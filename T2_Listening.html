rường nhịp độ rất nhanh với tỷ suất lợi nhuận thấp - nhân viên ở đó làm việc chăm chỉ, nhưng họ cũng chơi hết mình.\nTa có thể thấy rằng cơ hội việc làm này là công việc cường độ cao nhưng rất vui. Vì vậy lựa chọn D là đáp án đúng."}, "16": {"answer_label": "16. F", "quote": "We have an exciting post as an agronomist... There are good opportunities for the right person to quickly make their way up the career ladder...", "explain": "Câu hỏi:\nWhat information does Megan give about each of the following job opportunities?\nJob opportunities\n16 Agronomist …………………………..\nKeywords được paraphrase:\nchance - opportunities\nrapid promotion - quickly make their way up the career ladder\nGiải thích đáp án:\nĐoạn bên chỉ ra rằng với vị trí nhà nông học, có những cơ hội tốt để người phù hợp nhanh chóng tiến lên nấc thang sự nghiệp.\nTa có thể thấy rằng cơ hội việc làm này là một cơ hội cho việc thăng tiến nhanh chóng. Vì vậy lựa chọn F là đáp án đúng."}, "17": {"answer_label": "17. A", "quote": "A leading supermarket is looking for a fresh produce buyer who is available for a 12month maternity cover contract.", "explain": "Câu hỏi:\nWhat information does Megan give about each of the following job opportunities?\n     Job opportunities\n17\tFresh produce buyer\t\t\nGiải thích đáp án:\nCâu bên chỉ ra rằng một siêu thị hàng đầu đang tìm kiếm một người mua hàng sản phẩm tươi sống có sẵn hợp đồng bảo hiểm thai sản 12 tháng.\nTa có thể thấy rằng cơ hội việc làm này không phải là một công việc lâu dài. Vì vậy A là đáp án đúng."}, "18": {"answer_label": "18. H", "quote": "We have also received a request for a sales manager for a chain of garden centres. You will be visiting centres in the region to ensure their high levels of customer service are maintained.", "explain": "Câu hỏi:\nWhat information does Megan give about each of the following job opportunities?\nJob opportunities\n18\tGarden centre sales manager \t\nGiải thích đáp án:\nĐoạn bên chỉ ra rằng công việc này yêu cầu bạn sẽ đến thăm các trung tâm trong khu vực để đảm bảo mức độ dịch vụ khách hàng cao của họ được duy trì. Ta có thể thấy rằng cơ hội việc làm này có liên quan đến việc di chuyển địa phương. Vì vậy H là đáp án đúng."}, "19": {"answer_label": "19. C", "quote": "There is also a vacancy for a tree technician ... A year's experience would be preferred but the company might be prepared to consider someone who has just completed an appropriate training course.", "explain": "Câu hỏi:\nWhat information does Megan give about each of the following job opportunities?\nJob opportunities\n19\tTree technician \t\nGiải thích đáp án:\nĐoạn bên chỉ ra rằng đối với công việc này, kinh nghiệm một năm sẽ được ưu tiên hơn nhưng công ty có thể chuẩn bị để xem xét một người vừa hoàn thành một khóa đào tạo thích hợp.\nTa có thể thấy rằng đối với cơ hội việc làm này, kinh nghiệm đôi khi không cần thiết. Vì vậy C là đáp án đúng."}, "20": {"answer_label": "20. G", "quote": "Finally, we have a position for a farm worker... Perks of job include the possibility of renting a small cottage on the estate", "explain": "Câu hỏi:\nWhat information does Megan give about each of the following job opportunities?\nJob opportunities\n20 Farm worker ……………………..\t\nKeywords được paraphrase:\naccommodation - a small cottage\nGiải thích đáp án:\nĐoạn bên chỉ ra rằng đặc quyền của công việc này bao gồm khả năng thuê một ngôi nhà nhỏ trong khuôn viên.\nTa có thể thấy rằng đối với cơ hội việc làm này sẽ có chỗ ở. Vì vậy lựa chọn G là đáp án đúng."}}, "script_full": [{"speaker": null, "text": "Hello everyone. My name's Megan Baker and I'm a recruitment consultant at AVT Recruitment specialists.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "Now, our company specialises in positions that involve working in the agriculture and horticulture sectors, so that's fresh food production, garden and park maintenance and so on. And these sectors do provide some very special career opportunities. For a start, they often offer opportunities for those who don't want to be stuck with a 40-hour week, but need to juggle work with other responsibilities such as child care and this is very important for many of our recruits. Some people like working in a rural setting, surrounded by plants and trees instead of buildings, although we can't guarantee that. But there are certainly health benefits, especially in jobs where you're not sitting all day looking at a screen - a big plus for many people. Salaries can sometimes be good too, although there's a lot of variety here. And you may have the opportunity in some types of jobs for travel overseas, although that obviously depends on the job, and not everyone is keen to do it.", "qids": ["11", "12"], "time_seconds": 51}, {"speaker": null, "text": "Of course, working outdoors does have its challenges. It's fine in summer, but can be extremely unpleasant when it's cold and windy. You may need to be pretty fit for some jobs, though with modern technology that's not as important as it once was. And standards of health and safety are much higher now than they used to be, so there are fewer work-related accidents. But if you like a lively city environment surrounded by lots of people, these jobs are probably not for you - they're often in pretty remote areas. And some people worry about finding a suitable place to live, but in our experience, this usually turns out fine.", "qids": ["13", "14"], "time_seconds": 122}, {"speaker": null, "text": "Now let me tell you about some of the exciting jobs that we have on our books right now.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "One is for a fresh food commercial manager. Our client here is a very large fresh food producer supplying a range of top supermarkets. They operate in a very fast-paced environment with low profit margins - the staff there work hard, but they play hard as well, so if you've a sociable personality this may be for you.", "qids": ["15"], "time_seconds": 226}, {"speaker": null, "text": "We have an exciting post as an agronomist advising farmers on issues such as crop nutrition, protection against pests, and the latest legislation on farming and agricultural practices. There are good opportunities for the right person to quickly make their way up the career ladder, but a deep knowledge of the agricultural sector is expected of applicants.", "qids": ["16"], "time_seconds": 256}, {"speaker": null, "text": "A leading supermarket is looking for a fresh produce buyer who is available for a 12-month maternity cover contract. You need to have experience in administration, planning and buying in the fresh produce industry, and in return will receive a very competitive salary.", "qids": ["17"], "time_seconds": 285}, {"speaker": null, "text": "We have also received a request for a sales manager for a chain of garden centres. You will be visiting centres in the region to ensure their high levels of customer service are maintained. This post is only suitable for someone who is prepared to live in the region.", "qids": ["18"], "time_seconds": 306}, {"speaker": null, "text": "There is also a vacancy for a tree technician to carry out tree cutting, forestry and conservation work. Candidates must have a clean driving licence and have training in safety procedures. A year's experience would be preferred but the company might be prepared to consider someone who has just completed an appropriate training course.", "qids": ["19"], "time_seconds": 331}, {"speaker": null, "text": "Finally, we have a position for a farm worker. This will involve a wide range of farm duties including crop sowing and harvesting, machine maintenance and animal care. Perks of the job include the possibility of renting a small cottage on the estate, and the chance to earn a competitive salary. A driving licence and tractor driving experience are essential.", "qids": ["20"], "time_seconds": 359}], "groups": [{"type": "choice", "qids": ["11", "12"], "prompt": "According to Megan, what are the TWO main advantages of working in the agriculture and horticulture sectors?", "options": {"A": "the active lifestyle", "B": "the above-average salaries", "C": "the flexible working opportunities", "D": "the opportunities for overseas travel", "E": "the chance to be in a natural environment"}, "multi": true, "header": "Questions 11 and 12 Choose TWO letters, A-E."}, {"type": "choice", "qids": ["13", "14"], "prompt": "Which TWO of the following are likely to be disadvantages for people working outdoors?", "options": {"A": "the increasing risk of accidents", "B": "being in a very quiet location", "C": "difficult weather conditions at times", "D": "the cost of housing", "E": "the level of physical fitness required"}, "multi": true, "header": "Questions 13 and 14 Choose TWO letters, A-E."}, {"type": "matching", "qids": ["15", "16", "17", "18", "19", "20"], "box_title": "Information", "box": {"A": "not a permanent job", "B": "involves leading a team", "C": "experience not essential", "D": "intensive work but also fun", "E": "chance to earn more through overtime", "F": "chance for rapid promotion", "G": "accommodation available", "H": "local travel involved"}, "stems": [{"qid": "15", "prompt": "Fresh food commercial manager"}, {"qid": "16", "prompt": "Agronomist"}, {"qid": "17", "prompt": "Fresh produce buyer"}, {"qid": "18", "prompt": "Garden centre sales manager"}, {"qid": "19", "prompt": "Tree technician"}, {"qid": "20", "prompt": "Farm worker"}], "header": "Choose SIX answers from the box and write the correct letter, A-H, next to Questions 15-20."}]}, {"part": 3, "kind": "mcq", "title": "Holly's Work Placement Tutorial", "instructions": null, "audio": "audio/test2/part3.mp3", "answers": {"21": "B", "22": "A", "23": "A", "24": "B", "25": "C", "26": "A", "27": "D", "28": "B", "29": "F", "30": "H"}, "explanations": {"21": {"answer_label": "21. B", "quote": "TUTOR: Yup That's always a popular placement - even though it can be tougher than you think working with children.\nHOLLY: I know, but it's the fresh air that attracts me - organising something indoors doesn't have the same appeal, even though it might be fun.", "explain": "Câu hỏi: Holly has chosen the Orion Stadium placement because A it involves children.\nB it is outdoors.\nC it sounds like fun.\nKeywords được paraphrase:\nfresh air - outdoor\nGiải thích đáp án:\nĐoạn hội thoại trên chỉ ra Holly thích không khí trong lành, tổ chức một cái gì đó trong nhà không có thích bằng, mặc dù nó có thể vui hơn. Vậy đáp án là B"}, "22": {"answer_label": "22. A", "quote": "TUTOR: Ah well, you'll be working with schools, so the equipment will be their responsibility. However, the grounds and what goes on there will be yours.\nHOLLY: Oh I see - that'll include keeping everyone within the boundary once they're in their kit and on the field?\nTUTOR:\nExactly - you’ll need to inspect areas like changing rooms as well for anything someone can trip over, but your main priority will be not to lose anyone!", "explain": "Câu hỏi: Which aspect of safety does Dr Green emphasise most? A ensuring children stay in the stadium\nB checking the equipment children will use\nC removing obstacles in changing rooms\nKeywords được paraphrase:\nKeeping everyone within the boundary - ensuring children stay in the stadium\nGiải thích đáp án:\nĐoạn hội thoại trên chỉ ra Holly sẽ chịu trách nhiệm về sân chơi, là bao gồm giữ mọi người ở trong sân vận động, và quan sát những khu vực như phòng thay đồ để chắc chắn rằng không có ai trốn ra ngoài. Vậy đáp án là A"}, "23": {"answer_label": "23. A", "quote": "tUtOR: And that’s not always easy, especially when a proud parent’s trying to get a snap of their child and you want them to move elsewhere.\nHOLLY: OK.\nWhat about the scheduling?", "explain": "Câu hỏi: What does Dr Green say about the spectators?\nA They can be hard to manage.\nB They make useful volunteers.\nC They shouldn’t take photographs.\nKeywords được paraphrase:\nSpectators - parents\nGiải thích đáp án:\nĐoạn hội thoại trên chỉ ra Việc đó hề đơn giản khi mà một phụ huynh tự hào sẽ chụp những tấm hình của con họ bạn muốn di chuyển người đó đi. Vậy đáp án là A"}, "24": {"answer_label": "24. B", "quote": "HOLLY: Yeah, and I was thinking about what to do if someone got hurt as well. I know that last year that caused a terrible delay", "explain": "Câu hỏi: What has affected the schedule in the past?\nA bad weather\nB an injury\nC extra time\nKeywords được paraphrase:\nGot hurt - injury\nCaused a terrible delay - affected the schedule\nGiải thích đáp án:\nĐoạn hội thoại trên chỉ ra Holly cũng đang nghĩ sẽ làm gì nếu có người bị thương. Năm ngoái có người bị thương và sau đó lịch trình bị trễ. Vậy đáp án là B"}, "25": {"answer_label": "25. C", "quote": "TUTOR: Good - just remember it isn’t only about what you say. If you meet someone face-to- face and want to persuade them to be a sponsor, for example ...\nHOLLY: Oh, I'll dress up for that! Sure.", "explain": "Câu hỏi: What do Holly and her tutor agree is an important aspect of each of the following events management skills?\nChoose SIX answers from the box and write the correct letter, AH, next to Questions 25-30.\nImportant aspects\nA being flexible\nB focusing on details\n     C having a smart appearance \n     D hiding your emotions\nE relying on experts\nF trusting your own views\nG doing one thing at a time H thinking of the future\nEvents management skills\n25 Communication ...\nKeywords được paraphrase:\ndress up - having a smart apperance\nGiải thích đáp án:\nĐoạn hội thoại trên chỉ ra Tutor nói rằng nên nhớ, nó không chỉ là những gì bạn nói nếu bạn gặp mặt ai đó mà muốn thuyết phục làm nhà tài trợ.\nHolly nói rằng sẽ mặc đồ đẹp cho việc đó. Vậy đáp án là C"}, "26": {"answer_label": "26. A", "quote": "TUTOR: Good.\nLet's go on to think about your organisational skills. You're working in a very people-based industry and that means things won't always go to plan.\nHOLLY: I guess it's being prepared to make changes that matters\nTUTOR: That's right. You may have to make an on-the-spot change to a timetable because of a problem you hadn't anticipated ...", "explain": "Câu hỏi:What do Holly and her tutor agree is an important aspect of each of the following events management skills?\nChoose SIX answers from the box and write the correct letter, AH, next to Questions 25-30.\nImportant aspects\nA being flexible\nB focusing on details\nC having a smart appearance\nD hiding your emotions\nE relying on experts\nF trusting your own views\nG doing one thing at a time\nH thinking of the future\nEvents management skills\n26 Organisation ..\nKeywords được paraphrase:\nbeing prepared to make changes that matters - being flexible Giải thích đáp án:\nĐoạn hội thoại trên chỉ ra rằng: Holly cho rằng phải trở nên chuẩn bị sẵn cho mọi sự thay đổi, và tutor của cô ấy đồng ý với điều đó. Vậy đáp án là C."}, "27": {"answer_label": "27. D", "quote": "TUTOR:Yes, but it's how you respond as that deadline approaches!\nHOLLY: I know I've got to look calm even if I’m in a panic", "explain": "Câu hỏi:\nWhat do Holly and her tutor agree is an important aspect of each of the following events management skills?\nChoose SIX answers from the box and write the correct letter, AH, next to Questions 25-30.\nImportant aspects\nA being flexible\nB focusing on details\nC having a smart appearance\nD hiding your emotions\nE relying on experts\nF trusting your own views\nG doing one thing at a time\nH thinking of the future\nEvents management skills\n27 time management ....\nKeywords được paraphrase:\nHiding your emotions - I’ve got to look calm even if I’m in panic.\nGiải thích đáp án:\nHolly nói rằng cô ta phải tỏ ra bình tĩnh kể cả khi cô ta đang hoảng loạn. Vậy đáp án là D."}, "28": {"answer_label": "28. B", "quote": "TUTOR:\nAnother skill that events managers need is creativity. Often your client has what we call the ‘big picture’ idea, but it’s up to the events manager to think of all the fine points that go to making it work.\nHOLLY: Right, so I need to listen carefully to that idea and then fill in all the gaps", "explain": "Câu hỏi:\nWhat do Holly and her tutor agree is an important aspect of each of the following events management skills?\nChoose SIX answers from the box and write the correct letter, AH, next to Questions 25-30.\nImportant aspects\nA being flexible\nB focusing on details\nC having a smart appearance\nD hiding your emotions\nE relying on experts\nF trusting your own views\nG doing one thing at a time\nH thinking of the future\nEvents management skills\n28 creativity ..\nKeywords được paraphrase:\nlisten carefully to that idea and then fill in all the gaps - focus on details - think of all the fine point at go to making it work.\nGiải thích đáp án:\nHolly nói rằng cô ấy nên nghe kĩ ý tưởng và điền tất cả chúng vào ô trống. Vậy đáp án là B."}, "29": {"answer_label": "29. F", "quote": "TUTOR: It’s a nice idea, but you have the ultimate responsibility.\nSo, believe in what you think best. Be prepared to say ‘yes’, that's a good idea but it won't work", "explain": "Câu hỏi:\nWhat do Holly and her tutor agree is an important aspect of each of the following events management skills?\nChoose SIX answers from the box and write the correct letter, AH, next to Questions 25-30.\nImportant aspects\nA being flexible\nB focusing on details\n C having a smart appearance\n D hiding your emotions here.\t\n E relying on experts\n F trusting your own views\n G doing one thing at a time\n H thinking of the future\n Events management skills\n 29 leadership ....\n Keywords được paraphrase:\n trusting your own view - believe in what you think the  best \n Giải thích đáp án:\n Đoạn trên nói rằng. Đó là một ý tưởng nhưng nó có một trách nhiệm cao. Vì vậy cho nên tin vào những thì bạn thấy tốt nhất. Vậy đáp án là B."}, "30": {"answer_label": "30. H", "quote": "HOLLY: I see what you mean. What about the networking side of things? I know it's an area that a lot of students worry about because we don't have much experience to offer others.\nTUTOR: But even without it - you can still be an interesting person with useful ideas. And the more people you impress, the better.\nHOLLY: I guess that will help me when I apply for a real job.\nTUTOR:\nExactly - think ahead - remember what your ambitions are and keep them in mind.\nHOLLY: Definitely.", "explain": "Câu hỏi:\nWhat do Holly and her tutor agree is an important aspect of each of the following events management skills?\nChoose SIX answers from the box and write the correct letter, AH, next to Questions 25-30.\nImportant aspects\nA being flexible\nB focusing on details\nC having a smart appearance\nD hiding your emotions\nE relying on experts\nF trusting your own views\nG doing one thing at a time\nH thinking of the future\nEvents management skills\n30 Networking ....\nKeywords được paraphrase:\nthink ahead - think of the future\nGiải thích đáp án:\nĐoạn trên nói rằng. Holly hỏi tutor ý kiến về những mối quan hệ, vì có những sinh viên đang lo ngại rằng họ không có kinh nghiệm để tạo mối quan hệ. Tutor nói rằng không cần nó, bạn cũng vẫn là một người thú vị với nhiều ý tưởng hay. Sau đó Holly đồng ý với nó, và tutor nói là hãy nghĩ về phía trước. Vậy đáp án là H."}}, "script_full": [{"speaker": "HOLLY", "text": "Hello Dr Green - I'm here to talk to you about my work placement.", "qids": [], "time_seconds": null}, {"speaker": "TUTOR", "text": "Oh yes, it's Holly, isn't it?", "qids": [], "time_seconds": null}, {"speaker": "HOLLY", "text": "Yes.", "qids": [], "time_seconds": null}, {"speaker": "TUTOR", "text": "So, which work placement have you chosen?", "qids": [], "time_seconds": null}, {"speaker": "HOLLY", "text": "I decided to go for the Orion Stadium placement. The event I'll be managing is one where I'm helping to set up a sports competition for primary school children.", "qids": [], "time_seconds": null}, {"speaker": "TUTOR", "text": "Yup. That's always a popular placement - even though it can be tougher than you think working with children.", "qids": [], "time_seconds": null}, {"speaker": "HOLLY", "text": "I know, but it's the fresh air that attracts me - organising something indoors doesn't have the same appeal, even though it might be fun.", "qids": ["21"], "time_seconds": 80}, {"speaker": "TUTOR", "text": "OK, so obviously safety's going to be one of your key concerns for this event.", "qids": [], "time_seconds": null}, {"speaker": "HOLLY", "text": "Yes, I've already thought about that. I'll need to make sure none of the equipment's damaged.", "qids": [], "time_seconds": null}, {"speaker": "TUTOR", "text": "Ah well, you'll be working with schools, so the equipment will be their responsibility. However, the grounds and what goes on there will be yours.", "qids": [], "time_seconds": null}, {"speaker": "HOLLY", "text": "Oh I see that'll include keeping everyone within the boundary once they're in their kit and on the field?", "qids": ["22"], "time_seconds": null}, {"speaker": "TUTOR", "text": "Exactly you'll need to inspect areas like changing rooms as well for anything someone can trip over, but your main priority will be not to lose anyone!", "qids": [], "time_seconds": null}, {"speaker": "HOLLY", "text": "Right. I'll need staff to help with that.", "qids": [], "time_seconds": null}, {"speaker": "TUTOR", "text": "And don't forget about the spectators.", "qids": [], "time_seconds": null}, {"speaker": "HOLLY", "text": "Mmm. I was thinking that many of them will be parents, who could help run the event.", "qids": [], "time_seconds": null}, {"speaker": "TUTOR", "text": "I wouldn't rely on that. They'll be more interested in filming their children than volunteering.", "qids": [], "time_seconds": null}, {"speaker": "HOLLY", "text": "I'll need to make sure they don't interfere with events doing that!", "qids": [], "time_seconds": null}, {"speaker": "TUTOR", "text": "And that's not always easy, especially when a proud parent's trying to get a snap of their child and you want them to move elsewhere.", "qids": ["23"], "time_seconds": null}, {"speaker": "HOLLY", "text": "OK. What about the scheduling?", "qids": [], "time_seconds": null}, {"speaker": "TUTOR", "text": "With sporting events there are all sorts of things that can alter the timetable - like rain, for instance - though so far, we've always been lucky with that.", "qids": ["24"], "time_seconds": 163}, {"speaker": "HOLLY", "text": "Yeah, and I was thinking about what to do if someone got hurt as well. I know that last year that caused a terrible delay.", "qids": [], "time_seconds": null}, {"speaker": "TUTOR", "text": "You have to be prepared for such things.", "qids": [], "time_seconds": null}, {"speaker": "HOLLY", "text": "Oh. What if a match ends in a draw do you let the teams keep going until someone wins?", "qids": [], "time_seconds": null}, {"speaker": "TUTOR", "text": "That'll be up to you and again, you need to plan for it.", "qids": [], "time_seconds": null}, {"speaker": "HOLLY", "text": "Right.", "qids": [], "time_seconds": null}, {"speaker": "TUTOR", "text": "Now, the aim of your work placement is to give you the opportunity to develop the skills that an events manager needs. So, let's talk about those a bit.", "qids": [], "time_seconds": null}, {"speaker": "HOLLY", "text": "Well, I think my communication skills are pretty good. I can talk on the phone to people and book venues and that kind of thing.", "qids": [], "time_seconds": null}, {"speaker": "TUTOR", "text": "Good - just remember it isn't only about what you say. If you meet someone face-to-face and want to persuade them to be a sponsor, for example ...", "qids": [], "time_seconds": null}, {"speaker": "HOLLY", "text": "Oh, I'll dress up for that! Sure.", "qids": [], "time_seconds": null}, {"speaker": "TUTOR", "text": "Good. Let's go on to think about your organisational skills. You're working in a very people-based industry and that means things won't always go to plan.", "qids": [], "time_seconds": null}, {"speaker": "HOLLY", "text": "I guess it's being prepared to make changes that matters.", "qids": [], "time_seconds": null}, {"speaker": "TUTOR", "text": "That's right. You may have to make an on-the-spot change to a timetable because of a problem you hadn't anticipated - just do it!", "qids": ["25", "26"], "time_seconds": 293}, {"speaker": "HOLLY", "text": "OK.", "qids": [], "time_seconds": null}, {"speaker": "TUTOR", "text": "How's your time management these days?", "qids": [], "time_seconds": null}, {"speaker": "HOLLY", "text": "I'm working on it - I'm certainly better when I have a deadline, which is why this work suits me.", "qids": [], "time_seconds": null}, {"speaker": "TUTOR", "text": "Yes, but it's how you respond as that deadline approaches!", "qids": [], "time_seconds": null}, {"speaker": "HOLLY", "text": "I know I've got to look calm even if I'm in a panic.", "qids": ["27"], "time_seconds": 315}, {"speaker": "TUTOR", "text": "Just think to yourself no one must know I'm under pressure.", "qids": [], "time_seconds": null}, {"speaker": "HOLLY", "text": "Yeah - even though I'm multi-tasking like crazy!", "qids": [], "time_seconds": null}, {"speaker": "TUTOR", "text": "Another skill that events managers need is creativity. Often your client has what we call the 'big picture' idea, but it's up to the events manager to think of all the fine points that go to making it work.", "qids": ["28"], "time_seconds": 327}, {"speaker": "HOLLY", "text": "Right, so I need to listen carefully to that idea and then fill in all the gaps.", "qids": [], "time_seconds": null}, {"speaker": "TUTOR", "text": "That's right. And you'll have a team working under you, so another key skill is leadership. Your team may have lots of ideas too, but you've got to make the ultimate choices. Do we have refreshments inside or out, for example?", "qids": [], "time_seconds": null}, {"speaker": "HOLLY", "text": "Isn't it better to be democratic?", "qids": [], "time_seconds": null}, {"speaker": "TUTOR", "text": "It's a nice idea, but you have the ultimate responsibility. So, believe in what you think best. Be prepared to say 'yes', that's a good idea but it won't work here.", "qids": ["29", "30"], "time_seconds": 367}, {"speaker": "HOLLY", "text": "I see what you mean. What about the networking side of things? I know it's an area that a lot of students worry about because we don't have much experience to offer others.", "qids": [], "time_seconds": null}, {"speaker": "TUTOR", "text": "But even without it - you can still be an interesting person with useful ideas. And the more people you impress, the better.", "qids": [], "time_seconds": null}, {"speaker": "HOLLY", "text": "I guess that will help me when I apply for a real job.", "qids": [], "time_seconds": null}, {"speaker": "TUTOR", "text": "Exactly - think ahead - remember what your ambitions are and keep them in mind.", "qids": [], "time_seconds": null}, {"speaker": "HOLLY", "text": "Definitely.", "qids": [], "time_seconds": null}], "groups": [{"type": "choice", "qids": ["21"], "prompt": "Holly has chosen the Orion Stadium placement because", "options": {"A": "it involves children.", "B": "it is outdoors.", "C": "it sounds like fun."}, "multi": false, "header": "Choose the correct letter, A, B or C."}, {"type": "choice", "qids": ["22"], "prompt": "Which aspect of safety does Dr Green emphasise most?", "options": {"A": "ensuring children stay in the stadium", "B": "checking the equipment children will use", "C": "removing obstacles in changing rooms"}, "multi": false, "header": null}, {"type": "choice", "qids": ["23"], "prompt": "What does Dr Green say about the spectators?", "options": {"A": "They can be hard to manage.", "B": "They make useful volunteers.", "C": "They shouldn’t take photographs."}, "multi": false, "header": null}, {"type": "choice", "qids": ["24"], "prompt": "What has affected the schedule in the past?", "options": {"A": "bad weather", "B": "an injury", "C": "extra time"}, "multi": false, "header": null}, {"type": "matching", "qids": ["25", "26", "27", "28", "29", "30"], "box_title": "Important aspects", "box": {"A": "being flexible", "B": "focusing on details", "C": "having a smart appearance", "D": "hiding your emotions", "E": "relying on experts", "F": "trusting your own views", "G": "doing one thing at a time", "H": "thinking of the future"}, "stems": [{"qid": "25", "prompt": "Communication"}, {"qid": "26", "prompt": "Organisation"}, {"qid": "27", "prompt": "Time management"}, {"qid": "28", "prompt": "Creativity"}, {"qid": "29", "prompt": "Leadership"}, {"qid": "30", "prompt": "Networking"}], "header": "Choose SIX answers from the box and write the correct letter, A-H, next to Questions 25-30."}]}, {"part": 4, "kind": "notes", "title": "Space Traffic Management", "instructions": null, "audio": "audio/test2/part4.mp3", "answers": {"31": "technical", "32": "cheap", "33": "thousands", "34": "identification", "35": "tracking", "36": "military", "37": "location", "38": "prediction", "39": "database", "40": "trust"}, "explanations": {"31": {"answer_label": "31. technical", "quote": "The aim of such a system would be to prevent the danger of collisions in space between the objects in orbit around the Earth. In order to do this, we’d need to have a set of legal measures, and we’d also have to develop the technical systems 31 to enable us to prevent such accidents.", "explain": "Từ khóa: aim, set up, legal, improving, safety \nDựa vào từ và bài nghe ta xác định được đoạn thông tin sau “In order to do this, we’d need to have a set of legal measures, and we’d also have to develop the technical systems” => đáp án chính là technical. \nỞ đây, “In order to do this” “this” chính là “to prevent the danger of collisions in space between the objects in orbit around the Earth (aim)” \nTrong đó, động từ “aim” được diễn đạt lại thành cụm danh từ “the aim of…”; imrproving safety ~ prevent such accidents"}, "32": {"answer_label": "32. cheap", "quote": "What are the problems in developing such a system? Well, for one thing, satellites are relatively cheap these days, 32 compared with how they were in the past, meaning that more people can afford to put them into space.", "explain": "Từ khóa: Satellites, quite, now, more widespread \nDựa vào từ và bài nghe ta xác định được đoạn thông tin sau “Well, for one thing, satellites are relatively cheap these days” => đáp án chính là cheap \nTrong đó, quite = relatively; now = these days và cấu trúc “more people can afford to put …” được diễn đạt lại thành “more widespread”"}, "33": {"answer_label": "33. thousands", "quote": "So there's a lot more of them out there, and people aren't just launching single satellites but whole constellations, consisting of thousands of them 33 designed to work together. So space is getting more crowded every day.", "explain": "Từ khóa: constellation, made up of, satellites \nDựa vào từ và bài nghe ta xác định được đoạn thông tin sau “So there's a lot more of them out there, and people aren't just launching single satellites but whole constellations, consisting of thousands of them” (them ở đây chính là single satellites) => đáp án cần điền là thousands. \nTrong đó, constellation không bị paraphrase; made up of = consisting of"}, "34": {"answer_label": "34. identification", "quote": "But in spite of this, one thing you may be surprised to learn is that you can launch a satellite into space and, once it's out there, it doesn’t have to send back any information to Earth to allow its identification. 34", "explain": "Từ khóa: satellites, transmit information\nVị trí trên cần một danh từ để đứng sau tính từ sở hữu “their”. Dựa vào từ và bài nghe ta xác định được đoạn thông tin sau “it doesn’t have to send back any information to Earth to allow its identification” – Tạm dịch “nó sẽ không gửi lại bất kỳ thông tin nào về Trái đất để cho phép ta nhận dạng nó” => từ cần điền là identification \nTrong đó, transmit information = send back any information \nTính từ sở hữu “their” trong đề bài được diễn đạt lại thành “its” trong bài nghe."}, "35": {"answer_label": "35. tracking", "quote": "So while we have international systems for ensuring we know where the planes in our skies are, and to prevent them from colliding with one another, when it comes to the safety of satellites, at present we don’t have anything like enough proper ways of tracking them. 35", "explain": "Từ khóa: few, system, satellites \nDựa vào từ và bài nghe ta xác định được đoạn thông tin sau “when it comes to the safety of satellites, at present we don’t have anything like enough proper ways of tracking them” – Tạm dịch “và khi nói đến sự an toàn của các vệ tinh, hiện tại chúng ta chưa có bất cứ cách gì thích hợp để theo dõi chúng cả” => đáp án cần điền là tracking. \nTrong đó, “there are few systems …” được diễn đạt lại thành “we don’t have anything like …”"}, "36": {"answer_label": "36. military", "quote": "In addition, some operators may be unwilling to share information about the satellites they’ve launched. For example, a satellite may be designed for military purposes, 36 or it may have been launched for commercial reasons", "explain": "Từ khóa: operators, unwilling, share details, satellites, used for \nDựa vào từ và bài nghe ta xác định được đoạn thông tin sau “some operators may be unwilling to share information about the satellites they’ve launched. For example, a satellite may be designed for military purposes or it may have been launched for commercial reasons” – Tạm dịch “một số nhà khai thác vũ trụ có thể không sẵn sàng chia sẻ những thông tin về các vệ tinh mà họ đã phóng. Ví dụ, vệ tinh có thể được thiết kế cho mục đích quân sự 36, hoặc nó với mục đích thương mại” => từ cần điền là military. \nỞ đây các từ khóa không bị paraphrase nhiều, giúp thí sinh dễ dàng tìm ra được đáp án nhanh chóng. \nTrong đó, used for = designed for \nShare details = share information"}, "37": {"answer_label": "37. location", "quote": "And even if the operators are willing to provide it, the information isn’t easy to collect. Details are needed about the object itself, as well as about its location 37 at a particular time - and remember that a satellite isn’t very big, and it's likely to be moving at thousands of kilometres an hour.", "explain": "Từ khóa: hard, collect details, object’s, given time \nDựa vào từ và bài nghe ta xác định được đoạn thông tin sau “And even if the operators are willing to provide it, the information isn’t easy to collect. Details are needed about the object itself, as well as about its location 37 at a particular time” => từ cần điền là location. \nCấu trúc được paraphrase: \nIsn’t easy = hard \nDetails = information \nGiven time = particular time"}, "38": {"answer_label": "38. prediction", "quote": "We don’t have any sensors that can constantly follow something moving so fast, so all that the scientists can do is to put forward a prediction concerning where the satellite is heading next. 38", "explain": "Từ khóa: scientists, make, only, will go, satellites \nDựa vào từ và bài nghe ta xác định được đoạn thông tin sau “so all that the scientists can do is to put forward a prediction concerning where the satellite is heading next” – Tạm dịch “vì vậy mà tất cả những gì các nhà khoa học có thể làm được là đưa ra dự đoán liên quan đến nơi vệ tinh sẽ hướng tới tiếp theo” \nTừ cần điền là prediction \nTrong đó, \nCụm “all that the scientists can do” = “can only” \n“put forward” = “make” \n“is heading” = “will go”"}, "39": {"answer_label": "39. database", "quote": "Then, as all this information’s collected, it needs to be put together so it can be used, and that will involve creating a single database 39 on which it can be entered.", "explain": "Từ khóa: information, combined, one \nDựa vào từ và bài nghe ta xác định được đoạn thông tin sau “Then, as all this information’s collected, it needs to be put together so it can be used, and that will involve creating a single database” – Tạm dịch “Sau đó, khi tất cả thông tin này được thu thập, cần được kết hợp chúng với nhau để có thể sử dụng và điều đó sẽ bao gồm việc tạo nên một cơ sở dữ liệu duy nhất” \nTừ cần điền là database \nTrong đó, “involve” = “combined” \n“one” = “single”"}, "40": {"answer_label": "40. trust", "quote": "To cope with this, we need to develop a system like the one I’ve described to coordinate the work of the numerous spacecraft operators, but it’s also essential that this system is one that establishes trust 40 in the people that use it, both nationally and at a global level.", "explain": "Từ khóa: Coordinated system, create, in its users \nDựa vào từ và bài nghe ta xác định được đoạn thông tin sau “To cope with this, we need to develop a system like the one I’ve described to coordinate the work of the numerous spacecraft operators, but it’s also essential that this system is one that establishes trust 40 in the people that use it” – Tạm dịch “Để khắc phục điều đó, chúng ta cần phát triển một hệ thống tương tự như cái mà tôi đã mô tả mục đích nhằm điều phối công việc của nhiều nhà khai thác tàu vũ trụ, nhưng điều quan trọng nhất là hệ thống này phải giành được niềm tin 40 từ những người sử dụng nó” => từ cần điền là trust \nTrong đó, “its users” = “people that use it” \n“create” = “establishes”"}}, "script_full": [{"speaker": null, "text": "In today's astronomy lecture, I'm going to talk about the need for a system to manage the movement of satellites and other objects in orbit around the Earth. In other words, a Space Traffic Management system. We already have effective Air Traffic Control systems that are used internationally to ensure that planes navigate our skies safely. Well, Space Traffic Management is a similar concept, but focusing on the control of satellites.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "The aim of such a system would be to prevent the danger of collisions in space between the objects in orbit around the Earth. In order to do this, we'd need to have a set of legal measures, and we'd also have to develop the technical systems to enable us to prevent such accidents.", "qids": ["31"], "time_seconds": 104}, {"speaker": null, "text": "But unfortunately, at present we don't actually have a Space Traffic Management system that works. So why not? What are the problems in developing such a system?", "qids": [], "time_seconds": null}, {"speaker": null, "text": "Well, for one thing, satellites are relatively cheap these days, compared with how they were in the past, meaning that more people can afford to put them into space. So there's a lot more of them out there, and people aren't just launching single satellites but whole constellations, consisting of thousands of them designed to work together. So space is getting more crowded every day.", "qids": ["32", "33"], "time_seconds": 139}, {"speaker": null, "text": "But in spite of this, one thing you may be surprised to learn is that you can launch a satellite into space and, once it's out there, it doesn't have to send back any information to Earth to allow its identification. So while we have international systems for ensuring we know where the planes in our skies are, and to prevent them from colliding with one another, when it comes to the safety of satellites, at present we don't have anything like enough proper ways of tracking them.", "qids": ["34", "35"], "time_seconds": 168}, {"speaker": null, "text": "And it isn't just entire satellites that we need to consider. A greater threat is the huge amount of space debris in orbit around the Earth - broken bits of satellite and junk from space stations and so on. And some of these are so small that they can be very hard to identify, but they can still be very dangerous.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "In addition, some operators may be unwilling to share information about the satellites they've launched. For example, a satellite may be designed for military purposes, or it may have been launched for commercial reasons, and the operators don't want competitors to have information about it.", "qids": ["36"], "time_seconds": 232}, {"speaker": null, "text": "And even if the operators are willing to provide it, the information isn't easy to collect. Details are needed about the object itself, as well as about its location at a particular time - and remember that a satellite isn't very big, and it's likely to be moving at thousands of kilometres an hour. We don't have any sensors that can constantly follow something moving so fast, so all that the scientists can do is to put forward a prediction concerning where the satellite is heading next.", "qids": ["37", "38"], "time_seconds": 251}, {"speaker": null, "text": "So those are some of the problems that we're facing. Let's consider now some of the solutions that have been suggested. One key issue is the way in which information is dealt with. We need more information, but it also needs to be accessible at a global level, so we need to establish shared standards that we can all agree on for the way in which this information is presented. We already do this in other areas of science, so although this is a challenge, it's not an impossible task. Then, as all this information's collected, it needs to be put together so it can be used, and that will involve creating a single database on which it can be entered.", "qids": ["39"], "time_seconds": 289}, {"speaker": null, "text": "As we continue to push forward new developments, congestion of the space environment is only going to increase. To cope with this, we need to develop a system like the one I've described to coordinate the work of the numerous spacecraft operators, but it's also essential that this system is one that establishes trust in the people that use it, both nationally and at a global level.", "qids": ["40"], "time_seconds": 342}, {"speaker": null, "text": "One interesting development ...", "qids": [], "time_seconds": null}], "notes": ["Space Traffic Management", "A Space Traffic Management system", "• is a concept similar to Air Traffic Control, but for satellites rather than planes.", "• would aim to set up legal and {{31}}ways of improving safety.", "• does not actually exist at present.", "Problems in developing effective Space Traffic Management", "• Satellites are now quite {{32}}and thereforemmore widespread", "(e.g. there are constellations made up of {{33}}of satellites).", "• At present, satellites are not required to transmit information to help with their", "{{34}}", "• There are few systems for {{35}}satellites.", "• Small pieces of debris may be difficult to identify.", "• Operators may be unwilling to share details of satellites used for {{36}}or commercial reasons.", "• It may be hard to collect details of the object’s {{37}}at a given", "time.", "• Scientists can only make a {{38}}about where the satellite will go.", "Solutions", "• Common standards should be agreed on for the presentation of information.", "• The information should be combined in one {{39}}", "• A coordinated system must be designed to create {{40}}in its users."]}]};
</script>
<script>
(function(){
  const partsEl = document.getElementById('parts');
  const tabsEl = document.getElementById('tabs');

  function renderNotes(part){
    let html = '<div class="notes-block">';
    for(const rawLine of part.notes){
      const text = rawLine.trim();
      if(!text) continue;
      const isBlankLine = /\{\{\d+\}\}/.test(text);
      const isBulletLine = /^[–\-•]/.test(text);
      const isExample = /^example$/i.test(text);
      const rendered = text.replace(/\{\{(\d+)\}\}/g, (m, num) => {
        return `<span class="blank-num">${num}</span><input class="blank" type="text" data-part="${part.part}" data-q="${num}" autocomplete="off" spellcheck="false">`;
      });
      if(isExample){
        html += `<span class="subhead example-line">Example</span><br>`;
      } else if(isBlankLine){
        html += (isBulletLine ? '<span class="bullet">' : '<span>') + rendered + '</span><br>';
      } else if(isBulletLine){
        html += `<span class="bullet">${text}</span><br>`;
      } else if(text.split(' ').length <= 4){
        html += `<span class="subhead">${text}</span><br>`;
      } else {
        html += `<span class="example-line">${text}</span><br>`;
      }
    }
    html += '</div>';
    return html;
  }

  function renderMatching(g, part){
    let html = '<div class="qgroup" data-qids="' + g.qids.join(',') + '" data-mtype="matching">';
    if(g.image){
      html += `<img class="map-img" src="${g.image}" alt="${(g.box_title||'Map')}">`;
    }
    const boxEntries = Object.entries(g.box || {});
    if(boxEntries.length){
      html += '<div class="box-panel">';
      if(g.box_title) html += `<div class="box-title">${g.box_title}</div>`;
      for(const [letter, text] of boxEntries){
        html += `<div class="box-item"><b>${letter}</b><span>${text}</span></div>`;
      }
      html += '</div>';
    } else if(g.box_title){
      html += `<div class="box-title" style="margin-bottom:8px;font-weight:800;color:var(--navy);">${g.box_title}</div>`;
    }
    const letters = boxEntries.length ? boxEntries.map(([l]) => l) : (g.qids.length ? inferLetters(g) : []);
    for(const s of g.stems){
      html += `<div class="stem-row" data-q="${s.qid}"><span class="blank-num">${s.qid}</span><span class="stem-text">${s.prompt}</span>`;
      html += `<select data-part="${part.part}" data-q="${s.qid}"><option value="">--</option>`;
      for(const letter of letters){
        html += `<option value="${letter}">${letter}</option>`;
      }
      html += '</select></div>';
    }
    html += '</div>';
    return html;
  }

  function inferLetters(g){
    // No box text (e.g. a map where letters are drawn on the image) --
    // fall back to A..I so the dropdown offers every valid letter (some
    // maps go up to I, not just H).
    return ['A','B','C','D','E','F','G','H','I'];
  }

  function renderMcq(part){
    let html = '';
    for(const g of part.groups){
      if(g.header){
        html += `<div class="header-note">${g.header}</div>`;
      }
      if(g.type === 'matching'){
        html += renderMatching(g, part);
        continue;
      }
      const qidsLabel = g.qids.length>1 ? `${g.qids[0]}\u2013${g.qids[g.qids.length-1]}` : g.qids[0];
      html += `<div class="qgroup" data-qids="${g.qids.join(',')}" data-multi="${g.multi}">`;
      html += `<div class="prompt"><span class="blank-num">${qidsLabel}</span> ${g.prompt}</div>`;
      html += '<div class="opt-list">';
      for(const [letter, text] of Object.entries(g.options)){
        const inputType = g.multi ? 'checkbox' : 'radio';
        const name = g.multi ? `p${part.part}g${g.qids.join('_')}` : `p${part.part}q${g.qids[0]}`;
        html += `<label class="opt" data-letter="${letter}"><input type="${inputType}" name="${name}" value="${letter}" ${g.multi?`data-max="${g.qids.length}"`:''}>`+
                `<span><b>${letter}.</b> ${text}</span></label>`;
      }
      html += '</div></div>';
    }
    return html;
  }

  const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function fmtTime(t){
    t = Math.max(0, Math.round(t||0));
    const m = Math.floor(t/60), s = t%60;
    return `${m}:${String(s).padStart(2,'0')}`;
  }

  function buildScriptHtml(part){
    // part.script_full: the complete audioscript for this part, line by line, in order.
    // Lines whose "qids" array is non-empty are the lines where an answer's information
    // is actually said -- those get highlighted, tagged with the question number(s), and
    // (when time_seconds is known) get a jump button that seeks the script's own audio player.
    const lines = part.script_full || [];
    if(!lines.length) return '<p class="muted">No script data.</p>';
    return lines.map(l => {
      const spk = l.speaker ? `<span class="spk">${esc(l.speaker)}:</span> ` : '';
      let body = esc(l.text);
      if(l.qids && l.qids.length){
        const tags = l.qids.map(q => `<span class="qtag">Q${q}</span>`).join('');
        let jumpBtn = '';
        if(typeof l.time_seconds === 'number'){
          jumpBtn = `<button type="button" class="jump-btn" data-action="jump-audio" data-part="${part.part}" data-time="${l.time_seconds}" title="Jump to ${fmtTime(l.time_seconds)}">\u25b6 ${fmtTime(l.time_seconds)}</button>`;
        }
        body = `${jumpBtn}<mark class="hl">${body}</mark>${tags}`;
      }
      return `<p class="script-line">${spk}${body}</p>`;
    }).join('');
  }

  function buildExplanationsHtml(part){
    let html = '';
    const qids = [];
    if(part.kind === 'notes'){
      Object.keys(part.answers).sort((a,b)=>a-b).forEach(q=>qids.push(q));
    } else {
      part.groups.forEach(g=>g.qids.forEach(q=>qids.push(q)));
      qids.sort((a,b)=>a-b);
    }
    for(const q of qids){
      const e = part.explanations[q] || {};
      const ans = part.answers[q] || '';
      html += `<div class="expl-item"><div class="eq-head"><span class="qnum">C\u00e2u ${q}</span><span class="ans">${ans}</span></div>`;
      if(e.quote){
        html += `<div class="quote">"${e.quote.replace(/</g,'&lt;')}"</div>`;
      }
      html += `<div class="explain">${(e.explain||'').replace(/</g,'&lt;')}</div></div>`;
    }
    return html;
  }

  function gradeParts(part){
    let correct = 0, total = 0;
    if(part.kind === 'notes'){
      for(const [q, ans] of Object.entries(part.answers)){
        total++;
        const input = partsEl.querySelector(`input.blank[data-part="${part.part}"][data-q="${q}"]`);
        if(!input) continue;
        const val = input.value.trim().toLowerCase();
        const ok = val === String(ans).trim().toLowerCase();
        input.classList.remove('correct','incorrect');
        input.classList.add(ok ? 'correct' : 'incorrect');
        if(ok) correct++;
        if(!ok){
          input.title = `Correct answer: ${ans}`;
        }
      }
    } else {
      for(const g of part.groups){
        if(g.type === 'matching'){
          for(const s of g.stems){
            total++;
            const sel = partsEl.querySelector(`.part[data-part="${part.part}"] select[data-q="${s.qid}"]`);
            if(!sel) continue;
            const correctLetter = part.answers[s.qid];
            const ok = sel.value === correctLetter;
            sel.classList.remove('correct','incorrect');
            sel.classList.add(ok ? 'correct' : 'incorrect');
            if(ok) correct++;
            else sel.title = `Correct answer: ${correctLetter}`;
          }
          continue;
        }
        const groupEl = partsEl.querySelector(`.part[data-part="${part.part}"] .qgroup[data-qids="${g.qids.join(',')}"]`);
        if(!groupEl) continue;
        const inputs = groupEl.querySelectorAll('input');
        const correctLetters = g.qids.map(q => part.answers[q]);
        const selected = Array.from(inputs).filter(i=>i.checked).map(i=>i.value);
        groupEl.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','incorrect'));
        inputs.forEach(inp=>{
          const label = inp.closest('.opt');
          const letter = label.dataset.letter;
          if(correctLetters.includes(letter)) label.classList.add('correct');
          else if(inp.checked) label.classList.add('incorrect');
        });
        if(g.multi){
          total += g.qids.length;
          const sortedSel = [...selected].sort();
          const sortedCorrect = [...correctLetters].sort();
          if(sortedSel.length===sortedCorrect.length && sortedSel.every((v,i)=>v===sortedCorrect[i])){
            correct += g.qids.length;
          } else {
            correctLetters.forEach(cl=>{ if(selected.includes(cl)) correct++; });
          }
        } else {
          total += 1;
          if(selected[0] === correctLetters[0]) correct += 1;
        }
      }
    }
    return {correct, total};
  }

  function renderPart(part, idx){
    const wrap = document.createElement('div');
    wrap.className = 'part' + (idx===0 ? ' active' : '');
    wrap.dataset.part = part.part;

    const card = document.createElement('div');
    card.className = 'card';
    let inner = `<div class="part-bar"><span>PART ${part.part}${part.title ? ' — ' + part.title : ''}</span><span class="title">${part.kind==='notes'?'Note Completion':'Multiple Choice'}</span></div>`;
    inner += `<div class="card-body">`;
    if(part.instructions) inner += `<div class="instructions">${part.instructions}</div>`;
    inner += `<div class="audio-box"><span class="icon">\ud83c\udfa7</span><span class="label">Part ${part.part} Audio</span><audio controls preload="none" src="${part.audio}"></audio></div>`;
    inner += part.kind === 'notes' ? renderNotes(part) : renderMcq(part);
    inner += `<div class="actions">
        <button class="primary" data-action="check">Check Answers</button>
        <button class="ghost" data-action="reset">Reset</button>
        <span class="score-pill" data-role="score" style="display:none;"></span>
      </div>
      <div class="actions" style="margin-top:0;">
        <button class="ghost" data-action="toggle-script">Show Script</button>
        <button class="ghost" data-action="toggle-expl">Show Answers &amp; Explanations</button>
      </div>
      <div class="toggle-section" data-role="script-section">
        <h2 style="font-size:15px;color:var(--navy);">Full Script — Part ${part.part}</h2>
        <p class="script-note">Listen and follow along below — highlighted lines show where each answer is said${part.script_full && part.script_full.some(l=>typeof l.time_seconds==='number') ? '; tap a time button to jump straight there.' : '.'}</p>
        <div class="audio-box"><span class="icon">\ud83c\udfa7</span><span class="label">Part ${part.part} Audio</span><audio controls preload="none" src="${part.audio}" data-role="script-audio"></audio></div>
        <div class="script-text">${buildScriptHtml(part)}</div>
      </div>
      <div class="toggle-section" data-role="expl-section">
        <h2 style="font-size:15px;color:var(--navy);">Answers &amp; Explanations — Part ${part.part}</h2>
        ${buildExplanationsHtml(part)}
      </div>
      </div>`;
    card.innerHTML = inner;
    wrap.appendChild(card);

    card.querySelectorAll('.qgroup[data-multi="true"]').forEach(groupEl => {
      const boxes = Array.from(groupEl.querySelectorAll('input[type="checkbox"]'));
      if(!boxes.length) return;
      const max = parseInt(boxes[0].dataset.max, 10) || 2;
      const sync = () => {
        const checkedCount = boxes.filter(b=>b.checked).length;
        boxes.forEach(b => { if(!b.checked) b.disabled = checkedCount >= max; });
      };
      boxes.forEach(b => b.addEventListener('change', sync));
    });

    card.querySelector('[data-action="check"]').addEventListener('click', () => {
      const {correct, total} = gradeParts(part);
      const pill = card.querySelector('[data-role="score"]');
      pill.style.display = 'inline-block';
      pill.textContent = `Score: ${correct} / ${total}`;
      const tabBtn = tabsEl.querySelector(`[data-tab="${part.part}"]`);
      if(tabBtn) tabBtn.classList.add('done');
    });
    card.querySelector('[data-action="reset"]').addEventListener('click', () => {
      card.querySelectorAll('input[type="text"]').forEach(i=>{i.value='';i.classList.remove('correct','incorrect');i.title='';});
      card.querySelectorAll('input[type="radio"],input[type="checkbox"]').forEach(i=>{i.checked=false;i.disabled=false;});
      card.querySelectorAll('select').forEach(s=>{s.value='';s.classList.remove('correct','incorrect');s.title='';});
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','incorrect'));
      card.querySelector('[data-role="score"]').style.display='none';
      const tabBtn = tabsEl.querySelector(`[data-tab="${part.part}"]`);
      if(tabBtn) tabBtn.classList.remove('done');
    });
    card.querySelector('[data-action="toggle-script"]').addEventListener('click', (e) => {
      const sec = card.querySelector('[data-role="script-section"]');
      sec.classList.toggle('open');
      e.target.textContent = sec.classList.contains('open') ? 'Hide Script' : 'Show Script';
    });
    card.querySelector('[data-action="toggle-expl"]').addEventListener('click', (e) => {
      const sec = card.querySelector('[data-role="expl-section"]');
      sec.classList.toggle('open');
      e.target.textContent = sec.classList.contains('open') ? 'Hide Answers & Explanations' : 'Show Answers & Explanations';
    });
    card.querySelectorAll('[data-action="jump-audio"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const t = Number(btn.dataset.time) || 0;
        const audio = card.querySelector('[data-role="script-audio"]');
        if(!audio) return;
        audio.currentTime = t;
        audio.play();
      });
    });

    return wrap;
  }

  TEST_DATA.parts.forEach((part, idx) => {
    const tabBtn = document.createElement('button');
    tabBtn.className = 'tab-btn' + (idx===0 ? ' active' : '');
    tabBtn.dataset.tab = part.part;
    tabBtn.innerHTML = `<span class="dot"></span>Part ${part.part}`;
    tabBtn.addEventListener('click', () => {
      partsEl.querySelectorAll('audio').forEach(a => { a.pause(); });
      tabsEl.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      partsEl.querySelectorAll('.part').forEach(p=>p.classList.remove('active'));
      tabBtn.classList.add('active');
      partsEl.querySelector(`.part[data-part="${part.part}"]`).classList.add('active');
      window.scrollTo({top:0, behavior:'smooth'});
    });
    tabsEl.appendChild(tabBtn);
    partsEl.appendChild(renderPart(part, idx));
  });
})();
</script>
</body>
</html>
