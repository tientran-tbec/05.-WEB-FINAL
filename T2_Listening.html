<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test 2 &ndash; IELTS Listening Practice</title>
<style>
:root{
  --bg:#eef1f7; --panel:#ffffff; --ink:#1b2540; --muted:#66708a; --line:#e3e7f0;
  --navy:#122a52; --navy-2:#1c3f74; --brand:#1c3f74; --brand-ink:#ffffff;
  --good:#128a4e; --bad:#d64545; --good-bg:#e9f9f1; --bad-bg:#fdecec;
  --accent-bg:#eef2fb; --gold:#c9a24b; --radius:14px;
  --shadow:0 1px 3px rgba(18,42,82,.06), 0 10px 24px -14px rgba(18,42,82,.18);
}
*{box-sizing:border-box;}
body{margin:0;background:linear-gradient(180deg,#e7ebf5 0%,#eef1f7 320px);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.wrap{max-width:940px;margin:0 auto;padding:28px 16px 80px;}
header.top{padding:6px 4px 22px;text-align:center;}
header.top .kicker{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.14em;color:var(--gold);background:var(--navy);padding:5px 14px;border-radius:999px;margin-bottom:14px;}
header.top h1{font-size:26px;margin:0 0 8px;letter-spacing:.01em;color:var(--navy);font-weight:800;}
header.top p{margin:0;color:var(--muted);font-size:13.5px;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:22px 0;position:sticky;top:10px;z-index:5;}
.tab-btn{border:1px solid var(--line);background:var(--panel);color:var(--navy);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;box-shadow:var(--shadow);}
.tab-btn:hover{border-color:var(--navy-2);}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.tab-btn .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin-right:7px;vertical-align:middle;}
.tab-btn.done .dot{background:var(--gold);}
.part{display:none;}
.part.active{display:block;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:0 0 22px;margin-bottom:20px;box-shadow:var(--shadow);overflow:hidden;}
.part-bar{background:linear-gradient(90deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:15px 24px;font-weight:800;font-size:15.5px;letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.part-bar .title{font-weight:600;opacity:.92;font-size:13.5px;}
.card-body{padding:20px 24px 0;}
.card .instructions{color:var(--muted);font-size:13.5px;margin-bottom:14px;font-style:italic;}
.audio-box{display:flex;align-items:center;gap:12px;background:var(--accent-bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:4px 0 16px;}
.audio-box .icon{font-size:18px;}
.audio-box .label{font-size:12.5px;font-weight:700;color:var(--navy);white-space:nowrap;}
audio{width:100%;height:36px;}
.qgroup{margin:18px 0;}
.qgroup .header-note{font-size:12.5px;color:var(--navy-2);font-weight:800;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em;}
.qgroup .prompt{font-weight:600;margin-bottom:8px;}
.opt-list{display:flex;flex-direction:column;gap:6px;margin-bottom:2px;}
.opt{display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border-radius:9px;border:1px solid var(--line);cursor:pointer;}
.opt:hover{background:var(--accent-bg);border-color:var(--navy-2);}
.opt input{margin-top:3px;}
.opt.correct{background:var(--good-bg);border-color:var(--good);}
.opt.incorrect{background:var(--bad-bg);border-color:var(--bad);}
.opt:has(input:disabled){opacity:.45;cursor:not-allowed;}
.opt input:disabled{cursor:not-allowed;}
.notes-block{white-space:pre-wrap;line-height:2.2;}
.notes-block .subhead{display:block;font-weight:800;margin:16px 0 4px;color:var(--navy);font-size:14.5px;}
.notes-block .bullet{display:block;margin-left:14px;}
.blank{display:inline-block;border:none;border-bottom:2px solid var(--navy-2);background:var(--accent-bg);border-radius:5px 5px 0 0;padding:3px 8px;font:inherit;font-weight:700;min-width:120px;text-align:center;color:var(--ink);}
.blank:focus{outline:none;background:#e4eaf9;}
.blank.correct{border-color:var(--good);background:var(--good-bg);}
.blank.incorrect{border-color:var(--bad);background:var(--bad-bg);}
.blank-num{font-size:11px;color:var(--gold);font-weight:800;vertical-align:super;margin-right:2px;}
.actions{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap;}
button.primary{background:var(--navy);color:#fff;border:none;padding:12px 24px;border-radius:9px;font-size:14.5px;font-weight:700;cursor:pointer;box-shadow:0 6px 14px -6px rgba(18,42,82,.5);}
button.primary:hover{background:var(--navy-2);}
button.ghost{background:#fff;border:1px solid var(--line);color:var(--navy);padding:11px 18px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;}
button.ghost:hover{border-color:var(--navy-2);color:var(--navy-2);}
.score-pill{font-weight:800;padding:9px 18px;border-radius:999px;background:var(--navy);color:#fff;font-size:14px;}
.toggle-section{display:none;margin-top:16px;border-top:1px dashed var(--line);padding-top:16px;}
.toggle-section.open{display:block;}
.script-text{font-size:14.5px;background:#f7f8fc;border:1px solid var(--line);border-radius:10px;padding:14px 16px;max-height:560px;overflow-y:auto;}
.script-line{margin:0 0 10px;line-height:1.65;}
.script-line .spk{font-weight:800;color:var(--navy);margin-right:4px;}
.script-line mark.hl{background:#fdf1d0;border-radius:4px;padding:1px 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
.script-line .qtag{display:inline-block;font-weight:800;color:var(--navy);font-size:11px;background:#e8edf8;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle;}
.jump-btn{display:inline-block;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:700;color:#fff;background:var(--navy-2);border:none;border-radius:6px;padding:3px 8px;margin-right:8px;cursor:pointer;vertical-align:middle;}
.jump-btn:hover{background:var(--navy);}
.expl-item{border-top:1px solid var(--line);padding:14px 0;}
.expl-item:first-child{border-top:none;}
.expl-item .eq-head{display:flex;gap:10px;align-items:center;margin-bottom:6px;}
.expl-item .qnum{background:var(--navy);color:#fff;font-weight:800;font-size:12px;border-radius:6px;padding:3px 9px;}
.expl-item .ans{font-weight:800;color:var(--good);}
.expl-item .quote{font-style:italic;color:var(--muted);font-size:13.5px;margin:4px 0 6px;white-space:pre-wrap;}
.expl-item .explain{font-size:14px;white-space:pre-wrap;}
.example-line{color:var(--muted);font-style:italic;}
.script-note{font-size:12.5px;color:var(--muted);margin:0 0 10px;}
footer.credit{color:var(--muted);font-size:12px;text-align:center;margin-top:26px;}
.box-panel{background:var(--accent-bg);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px;}
.box-panel .box-title{font-weight:800;color:var(--navy);margin-bottom:8px;font-size:13.5px;}
.box-panel .box-item{display:flex;gap:8px;margin:4px 0;font-size:14px;}
.box-panel .box-item b{color:var(--navy-2);min-width:18px;}
.map-img{max-width:100%;border-radius:10px;border:1px solid var(--line);margin-bottom:14px;display:block;}
.stem-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);}
.stem-row:last-child{border-bottom:none;}
.stem-row .stem-text{flex:1;}
.stem-row select{padding:7px 10px;border-radius:8px;border:1px solid var(--line);font:inherit;font-weight:700;min-width:70px;background:#fff;}
.stem-row select.correct{border-color:var(--good);background:var(--good-bg);}
.stem-row select.incorrect{border-color:var(--bad);background:var(--bad-bg);}
@media(max-width:520px){.wrap{padding:18px 10px 60px;}.card-body{padding:16px 16px 0;}.part-bar{padding:13px 16px;}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="kicker">Flight to Success</span>
    <h1>Test 2 &mdash; IELTS Listening</h1>
    <p>4 parts &middot; 40 questions &middot; Listen to each part, answer, then check your results, script and explanations.</p>

  <div class="tabs" id="tabs"></div>

<script>
const TEST_DATA = {"test": "Test 2", "parts": [{"part": 1, "kind": "notes", "title": "Employment Agency: Possible Jobs", "instructions": null, "audio": "audio/test2/part1.mp3", "answers": {"1": "furniture", "2": "meetings", "3": "diary", "4": "detail(s)", "5": "1 / one year", "6": "deliveries", "7": "tidy", "8": "team", "9": "heavy", "10": "customer"}, "explanations": {"1": {"answer_label": "5. 1 year", "quote": "SALLY: I think they wanted some experience of teleconferencing. \nJOE: I've got three years' experience of that. \nSALLY: Let's see, yes, good. In fact they're only asking for at least one year so that's great. So is that something that might interest you?", "explain": "Câu hỏi: \nExperience \n• need a minimum of 5. ......................... of experience of teleconferencing \nKeywords được paraphrase: \nTừ khóa “need” (cần) được thay bằng “want” (muốn) và “ask for” (yêu cầu). Từ khóa “experience of teleconferencing” (kinh nghiệm họp online) giúp ta xác định vị trí câu hỏi trong bài nghe. \nGiải thích đáp án: \nCâu hỏi yêu cầu điền khoảng thời gian kinh nghiệm tối thiểu cho “teleconferencing”. Trong bài nghe, ta nghe được “They’re only asking for at least one year” (Họ chỉ yêu cầu tối thiểu 1 năm). Vì vậy “1 year” chính là đáp án. Lưu ý giới hạn về số từ và con số để điều chỉnh đáp án viết vào cho phù hợp. \nTrước đó ta cũng nghe được Joe nói “I’ve got three years’ experience of that” (tôi có 3 năm kinh nghiệm về nó). Tuy nhiên, “3 year” là đáp án bẫy vì đây chưa phải là yêu cầu của công ty."}, "2": {"answer_label": "2. meetings", "quote": "SALLY: So that's one skill they want. Then they expect the person they appoint to attend meetings and take notes there …", "explain": "Câu hỏi: \nResponsibilities \n• data entry \n• go to 2. ......................... and take notes \nKeywords được paraphrase: \nTừ khóa “go to” (đi đến) được thay bằng “attend” (tham dự). Ngoài ra từ khóa “take notes” (ghi chú) cũng giúp ta khoanh vùng đáp án. \nGiải thích đáp án: \nTrong bài nghe, sau khi nghe về một trách nhiệm mà một người phải là là “data entry” (nhập dữ liệu), ta nghe được “Then they expect the person they appoint to attend meetings and take notes” (Sau đó, họ muốn người mà họ bổ nhiệm tham dự các cuộc họp và ghi chú lại). Như vậy đáp án là “meetings”."}, "3": {"answer_label": "3. diary", "quote": "JOE: Filing, and keeping records and so on? That should be OK. And in my last job I also had to manage the diary.", "explain": "Câu hỏi: \n• management of 3. ................ \nKeywords được paraphrase: \nTừ khóa “management” (sự quản lý) được paraphrase thành “had to manage” (đã phải quản lý) trong bài nghe. \nGiải thích đáp án: \nTrong bài nghe, có đoạn “and in my last job, I also had to manage the diary” (Và trong công việc cuối cùng của tôi, tôi cũng đã phải quản lý nhật ký). Như vậy “diary” (nhật ký) là đáp án."}, "4": {"answer_label": "4. details", "quote": "SALLY: Then they mention that they want someone who is careful and takes care with details — just looking at your CV, I'd say you're probably alright there.", "explain": "Câu hỏi: \nRequirements \n• good computer skills including spreadsheets \n• good interpersonal skills \n• attention to 4. ..................... \nKeywords được paraphrase: \nTừ khóa “attention to” (sự chú ý/tập trung cho) được paraphrase thành “take care with” (quan tâm đến) trong bài nghe. \nGiải thích đáp án: \nCâu hỏi yêu câu ta nghe về một trong những yêu câu mà công ty đưa ra cho Joe. Chỗ cần điền là danh từ. Trong bài nghe, có đoạn “They want someone who is careful and takes care with details” (Họ muốn một người cẩn thận và quan tâm đến các chi tiết). Vì vậy, “details” là đáp án."}, "5": {"answer_label": "5. 1 year", "quote": "SALLY: I think they wanted some experience of teleconferencing. \nJOE: I've got three years' experience of that. \nSALLY: Let's see, yes, good. In fact they're only asking for at least one year so that's great. So is that something that might interest you?", "explain": "Câu hỏi: \nExperience \n• need a minimum of 5. ......................... of experience of teleconferencing \nKeywords được paraphrase: \nTừ khóa “need” (cần) được thay bằng “want” (muốn) và “ask for” (yêu cầu). Từ khóa “experience of teleconferencing” (kinh nghiệm họp online) giúp ta xác định vị trí câu hỏi trong bài nghe. \nGiải thích đáp án: \nCâu hỏi yêu cầu điền khoảng thời gian kinh nghiệm tối thiểu cho “teleconferencing”. Trong bài nghe, ta nghe được “They’re only asking for at least one year” (Họ chỉ yêu cầu tối thiểu 1 năm). Vì vậy “1 year” chính là đáp án. Lưu ý giới hạn về số từ và con số để điều chỉnh đáp án viết vào cho phù hợp. \nTrước đó ta cũng nghe được Joe nói “I’ve got three years’ experience of that” (tôi có 3 năm kinh nghiệm về nó). Tuy nhiên, “3 year” là đáp án bẫy vì đây chưa phải là yêu cầu của công ty."}, "6": {"answer_label": "6. deliveries", "quote": "May: So as far as the responsibilities for this position go, they want someone who can manage the stock, obviously, and also deliveries.", "explain": "Câu hỏi: \nResponsibilities \n• stock management \n• managing 6. ...................... \nKeywords được paraphrase: \nTừ khóa “responsibilities” (trách nhiệm) là đề mục chứa câu hỏi giúp ta xác định được vị trí của câu hỏi cần nghe trong bài. Ngoài ra, động \ntừ “managing” (việc quản lý) cũng cần được gạch chân. \nGiải thích đáp án: \nTrong bài nghe, có đoạn “they want someone who can manage the stock, obviously, and also deliveries” (họ muốn một người mà có thể quản lý kho, một điều hiển nhiên, và việc giao hàng) như vậy, ngoài “stock management” (quản lý kho) đã đuọc cho trước, ta còn thấy Joe cần phải có trách nhiệm quản lý giao hàng. Vì vậy “deliveries” là đáp án."}, "7": {"answer_label": "7. tidy", "quote": "SALLY: Then they mention organisational skills. They want someone who's well organised. \nJOE: Yes, I think I am. \nSALLY: And tidy?", "explain": "Câu hỏi: \nRequirements \n• ability to work with numbers \n• good computer skills \n• very organised and 7. ............................. \nKeywords được paraphrase: \n“very organized” (rất có tổ chức) được nhắc đến với cụm từ “organizational skills” (kỹ năng tổ chức) và được paraphrase thành “well-organized” (có tổ chức tốt trong bài nghe. \nGiải thích đáp án: \nCâu hỏi yêu cầu ta nghe về một trong các yêu cầu của công ty, bên cạnh việc có tổ chức tốt. Chỗ cần điền là một tính từ. Trong bài, ta nghe được “They want someone who’s well-organised” (Họ muốn một người có tổ chức tốt). Joe sau đó trả lời “yes” và Sally thêm tiếp một yêu câu nữa “and tidy?” (và ngăn nắp?). Như vậy, bên cạnh việc có tổ chức tốt, công ty cũng yêu câu sự ngăn nắp, “tidy” là đáp án."}, "8": {"answer_label": "8. team", "quote": "JOE: OK. And for the last warehouse job I had, one of the things I enjoyed most was being part of a team. I found that was really essential for the job. \nSALLY: Excellent. Yes, they do mention that they want someone who's used to that, yes.", "explain": "Câu hỏi: \n• used to working in a 8. ................... \nKeywords được paraphrase: \nTừ khóa “used to” (quen với việc gì) và “working in a” (làm việc trong một …) giúp ta hiểu rõ nội dung câu hỏi và xác định vị trí của nó trong bài nghe. \nGiải thích đáp án: \nTrong bài nghe, có đoạn Joe nói “one of the things I enjoyed most was being part of a team” (Một trong những điều mà tôi cảm thấy rất thích là việc là một phần của một nhóm). Câu này là nhận xét của của Joe về công việc trước của cô ấy “Last warehouse job”. Sau đó Sally nói “They do mention they want someone who’s used to that” (Họ - bên công ty mới, cũng đề cập đến việc họ muốn một ai đó mà quen với việc đó), “that” - cái đó, việc đó ở đây đại diện cho sự việc Joe vừa nói là “being part of a team”. “being part of a team” đồng nghĩa với “working in a team”. Vì vậy, đáp án là “team”."}, "9": {"answer_label": "9. heavy", "quote": "SALLY: So you're OK moving heavy things? \nJOE: Sure. I'm quite strong, and I've had the training.", "explain": "Câu hỏi: \n• able to cope with items that are 9. ..................... \nKeywords được paraphrase: \n“able to cope with” (có thể đối phó với) được thay bằng “You’re OK…” (bạn có ổn…?). “Items” (đồ vật) cũng được paraphrase thành “things” trong bài nghe. \nGiải thích đáp án: \nChỗ cần điền là một tính từ - miêu tả tính chất của các “items” mà Joe phải có khả năng đối phó. Trong bài nghe, có đoạn Sally hỏi “You’re OK moving heavy things?” (Bạn có ổn với việc di chuyển những đồ vật nặng chứ?). Joe trả lời “sure” (chắc chắn rồi). Như vậy đáp án là “heavy” (nặng)."}, "10": {"answer_label": "10. customer", "quote": "SALLY: Good. Now as far as experience goes, they mention they want someone with a licence, and that you have experience of driving in London — so you can cope with the traffic and so on. \nJOE: Yes, no problem. \nSALLY: And you've got experience of warehouse work ... and the final thing they mention is customer service. I think looking at your CV you're OK there.", "explain": "Câu hỏi: \nNeed experience of \n• driving in London \n• warehouse work \n• 10. .................. service \nKeywords được paraphrase: \nCâu hỏi cần điền nằm trong đề mục “need experience of” (Cần kinh nghiệm về). Như vậy, nó là một trong 3 loại kinh nghiệm mà công ty thứ 2 đòi hỏi. Từ “experience” (kinh nghiệm) và 2 kinh nghiệm còn lại “driving in London”; “warehouse work” xuất hiện theo thứ tự trên bài nghe giúp ta xác định vị trí của câu hỏi trong bài nghe dễ dàng hơn. \nGiải thích đáp án: \nTrong bài, sau khi các kinh nghiệm trước được nhắc qua, ta nghe được “The final thing they mention is customer service” (Điều cuối cùng mà họ nhắc đến là dịch vụ khách hàng). Như vậy “customer” (khách hàng) là đáp án."}}, "script_full": [{"speaker": "SALLY", "text": "Good morning. Thanks for coming in to see us here at the agency, Joe. I'm one of the agency representatives, and my name's Sally Baker.", "qids": [], "time_seconds": null}, {"speaker": "JOE", "text": "Hi Sally. I think we spoke on the phone, didn't we?", "qids": [], "time_seconds": null}, {"speaker": "SALLY", "text": "That's right, we did. So thank you for sending in your CV. We've had quite a careful look at it and I think we have two jobs that might be suitable for you.", "qids": [], "time_seconds": null}, {"speaker": "JOE", "text": "OK.", "qids": [], "time_seconds": null}, {"speaker": "SALLY", "text": "The first one is in a company based in North London. They're looking for an administrative assistant.", "qids": [], "time_seconds": null}, {"speaker": "JOE", "text": "OK. What sort of company is it?", "qids": [], "time_seconds": null}, {"speaker": "SALLY", "text": "They're called Home Solutions and they design and make furniture.", "qids": [], "time_seconds": null}, {"speaker": "JOE", "text": "Oh, I don't know much about that, but it sounds interesting.", "qids": [], "time_seconds": null}, {"speaker": "SALLY", "text": "Yes, well as I said, they want someone in their office, and looking at your past experience it does look as if you fit quite a few of the requirements. So on your CV it appears you've done some data entry?", "qids": ["1"], "time_seconds": 134}, {"speaker": "JOE", "text": "Yes.", "qids": [], "time_seconds": null}, {"speaker": "SALLY", "text": "So that's one skill they want. Then they expect the person they appoint to attend meetings and take notes there...", "qids": ["2"], "time_seconds": 148}, {"speaker": "JOE", "text": "OK. I've done that before, yes.", "qids": [], "time_seconds": null}, {"speaker": "SALLY", "text": "And you'd need to be able to cope with general admin.", "qids": [], "time_seconds": null}, {"speaker": "JOE", "text": "Filing, and keeping records and so on? That should be OK. And in my last job I also had to manage the diary.", "qids": ["3"], "time_seconds": 162}, {"speaker": "SALLY", "text": "Excellent. That's something they want here too. I'd suggest you add it to your CV-I don't think you mentioned that, did you?", "qids": [], "time_seconds": null}, {"speaker": "JOE", "text": "No.", "qids": [], "time_seconds": null}, {"speaker": "SALLY", "text": "So as far as the requirements go, they want good computer skills, of course, and they particularly mention spreadsheets.", "qids": [], "time_seconds": null}, {"speaker": "JOE", "text": "That should be fine.", "qids": [], "time_seconds": null}, {"speaker": "SALLY", "text": "And interpersonal skills - which would be something they'd check with your references.", "qids": [], "time_seconds": null}, {"speaker": "JOE", "text": "I think that should be OK, yes.", "qids": [], "time_seconds": null}, {"speaker": "SALLY", "text": "Then they mention that they want someone who is careful and takes care with details - just looking at your CV, I'd say you're probably alright there.", "qids": [], "time_seconds": null}, {"speaker": "JOE", "text": "I think so, yes. Do they want any special experience?", "qids": [], "time_seconds": null}, {"speaker": "SALLY", "text": "I think they wanted some experience of teleconferencing.", "qids": ["4"], "time_seconds": 210}, {"speaker": "JOE", "text": "I've got three years' experience of that.", "qids": [], "time_seconds": null}, {"speaker": "SALLY", "text": "Let's see, yes, good. In fact they're only asking for at least one year, so that's great. So is that something that might interest you?", "qids": ["5"], "time_seconds": 218}, {"speaker": "JOE", "text": "It is, yes. The only thing is, you said they were in North London so it would be quite a long commute for me.", "qids": [], "time_seconds": null}, {"speaker": "SALLY", "text": "OK.", "qids": [], "time_seconds": null}, {"speaker": "SALLY", "text": "So the second position might suit you better as far as the location goes; that's for a warehouse assistant and that's in South London.", "qids": [], "time_seconds": null}, {"speaker": "JOE", "text": "Yes, that would be a lot closer.", "qids": [], "time_seconds": null}, {"speaker": "SALLY", "text": "And you've worked in a warehouse before, haven't you?", "qids": [], "time_seconds": null}, {"speaker": "JOE", "text": "Yes.", "qids": [], "time_seconds": null}, {"speaker": "SALLY", "text": "So as far as the responsibilities for this position go, they want someone who can manage the stock, obviously, and also deliveries.", "qids": ["6"], "time_seconds": 292}, {"speaker": "JOE", "text": "That should be OK. You've got to keep track of stuff, but I've always been quite good with numbers.", "qids": [], "time_seconds": null}, {"speaker": "SALLY", "text": "Good. that's their first requirement. And they want someone who's computer literate, which we know you are.", "qids": [], "time_seconds": null}, {"speaker": "JOE", "text": "Sure.", "qids": [], "time_seconds": null}, {"speaker": "SALLY", "text": "Then they mention organisational skills. They want someone who's well organised.", "qids": ["7"], "time_seconds": 316}, {"speaker": "JOE", "text": "Yes, I think I am.", "qids": [], "time_seconds": null}, {"speaker": "SALLY", "text": "And tidy?", "qids": [], "time_seconds": null}, {"speaker": "JOE", "text": "Yes, they go together really, don't they?", "qids": [], "time_seconds": null}, {"speaker": "SALLY", "text": "Sure. Then the usual stuff; they want someone who can communicate well both orally and in writing.", "qids": [], "time_seconds": null}, {"speaker": "JOE", "text": "OK. And for the last warehouse job I had, one of the things I enjoyed most was being part of a team. I found that was really essential for the job.", "qids": ["8"], "time_seconds": 335}, {"speaker": "SALLY", "text": "Excellent. Yes, they do mention that they want someone who's used to that, yes.", "qids": [], "time_seconds": null}, {"speaker": "JOE", "text": "Now when you were working in a warehouse last time, what sorts of items were you dealing with?", "qids": [], "time_seconds": null}, {"speaker": "SALLY", "text": "It was mostly bathroom and kitchen equipment, sinks and stoves and fridges.", "qids": ["9"], "time_seconds": 358}, {"speaker": "JOE", "text": "So you're OK moving heavy things?", "qids": [], "time_seconds": null}, {"speaker": "SALLY", "text": "Sure. I'm quite strong, and I've had the training.", "qids": [], "time_seconds": null}, {"speaker": "JOE", "text": "Good. Now as far as experience goes, they mention they want someone with a licence, and that you have experience of driving in London so you can cope with the traffic and so on.", "qids": ["10"], "time_seconds": 371}, {"speaker": "SALLY", "text": "Yes, no problem.", "qids": [], "time_seconds": null}, {"speaker": "JOE", "text": "And you've got experience of warehouse work... and the final thing they mention is customer service. I think looking at your CV you're OK there.", "qids": [], "time_seconds": null}, {"speaker": "SALLY", "text": "Right. So what about pay? Can you tell me a bit more about that, please..", "qids": [], "time_seconds": null}], "notes": ["Employment Agency: Possible Jobs", "First Job", "Administrative assistant in a company that produces {{1}}(North London)", "Responsibilities", "• data entry", "• go to {{2}}and take notes", "• general admin", "• management of {{3}}", "Requirements", "• good computer skills including spreadsheets", "• good interpersonal skills", "• attention to {{4}}", "Experience", "• need a minimum of {{5}}of experience of teleconferencing", "Second Job", "Warehouse assistant in South London", "Responsibilities", "• stock management", "• managing {{6}}", "Requirements", "• ability to work with numbers", "• good computer skills", "• very organised and {{7}}", "• good communication skills", "• used to working in a {{8}}", "• able to cope with items that are {{9}}", "Need experience of", "• driving in London", "• warehouse work", "• {{10}}service"]}, {"part": 2, "kind": "mcq", "title": "Working in the Agriculture and Horticulture Sectors", "instructions": null, "audio": "audio/test2/part2.mp3", "answers": {"11": "A", "12": "C", "13": "B", "14": "C", "15": "D", "16": "F", "17": "A", "18": "H", "19": "C", "20": "G"}, "explanations": {"11": {"answer_label": "11 & 12. A & C", "quote": "And these sectors do provide some very special career opportunities. For a start, they often offer opportunities for those who don't want to be stuck with a 40hour week, but need to juggle work with other responsibilities such as child care...\nSome people like working in a rural setting, surrounded by plants and trees instead of buildings, although we can't guarantee that.\nBut there are certainly health benefits, especially in jobs where you're not sitting all day looking at a screen.\nSalaries can sometimes be good too, although there's a lot of variety here.\nAnd you may have the opportunity in some types of jobs for travel overseas, although that obviously depends on the job, and not everyone is keen to do it.", "explain": "Câu hỏi:\n11-12. According to Megan, what are the TWO main advantages of working in the agriculture and horticulture sectors?\nA the active lifestyle\nB the above-average salaries\nC the flexible working opportunities\nD the opportunities for overseas level E the chance to be in a natural environment\nGiải thích đáp án:\nTất cả các lựa chọn đều được nhắc đến trong đoạn hội thoại bên.\n•\tỞ lựa chọn A, đoạn bên thứ 3 có nhắc đến việc có một số lợi ích sức khỏe, đặc biệt là trong những công việc mà bạn không phải ngồi cả ngày để nhìn vào màn hình. Có thể thấy công việc này mang đến một lối sống năng động. Vì vậy lựa chọn A là đáp án đúng.\n•\tỞ lựa chọn B, đoạn bên thứ 4 có nhắc đến việc mức lương đôi khi cũng có thể cao, mặc dù có rất nhiều loại ở đây. Vì vậy làm việc trong lĩnh vực này sẽ không luôn luôn đảm bảo có mức lương trên trung bình.\n•\tỞ lựa chọn C, đoạn bên thứ 1 có nhắc đến việc làm việc trong lĩnh vực này sẽ cung cấp cơ hội cho những người không muốn bị mắc kẹt với 40 giờ một tuần nhưng cần phải sắp xếp công việc với các trách nhiệm khác như chăm sóc trẻ em. Có thể thấy nó mạng lại một cơ hội làm việc linh hoạt. Vì vậy lựa chọn C là đáp án đúng.\n•\tỞ lựa chọn D, đoạn bên thứ 5 có nhắc đến việc làm việc trong lĩnh vực này sẽ có cơ hội trong một số loại công việc khi đi du lịch nước ngoài, mặc dù điều đó rõ ràng phụ thuộc vào công việc và không phải ai cũng muốn làm điều đó. Vì vậy làm việc trong lĩnh vực không luôn luôn đảm bảo cơ hội cho cấp độ ở nước ngoài.\n•\tỞ lựa chọn E, đoạn bên thứ 2 có nhắc đến việc một số người thích làm việc trong khung cảnh nông thôn, xung quanh là cây cối thay vì các tòa nhà, mặc dù họ không thể đảm bảo điều đó.\nTừ những dữ kiện trên, ta có thể thấy A và C là đáp án đúng."}, "12": {"answer_label": "11 & 12. A & C", "quote": "And these sectors do provide some very special career opportunities. For a start, they often offer opportunities for those who don't want to be stuck with a 40hour week, but need to juggle work with other responsibilities such as child care...\nSome people like working in a rural setting, surrounded by plants and trees instead of buildings, although we can't guarantee that.\nBut there are certainly health benefits, especially in jobs where you're not sitting all day looking at a screen.\nSalaries can sometimes be good too, although there's a lot of variety here.\nAnd you may have the opportunity in some types of jobs for travel overseas, although that obviously depends on the job, and not everyone is keen to do it.", "explain": "Câu hỏi:\n11-12. According to Megan, what are the TWO main advantages of working in the agriculture and horticulture sectors?\nA the active lifestyle\nB the above-average salaries\nC the flexible working opportunities\nD the opportunities for overseas level E the chance to be in a natural environment\nGiải thích đáp án:\nTất cả các lựa chọn đều được nhắc đến trong đoạn hội thoại bên.\n•\tỞ lựa chọn A, đoạn bên thứ 3 có nhắc đến việc có một số lợi ích sức khỏe, đặc biệt là trong những công việc mà bạn không phải ngồi cả ngày để nhìn vào màn hình. Có thể thấy công việc này mang đến một lối sống năng động. Vì vậy lựa chọn A là đáp án đúng.\n•\tỞ lựa chọn B, đoạn bên thứ 4 có nhắc đến việc mức lương đôi khi cũng có thể cao, mặc dù có rất nhiều loại ở đây. Vì vậy làm việc trong lĩnh vực này sẽ không luôn luôn đảm bảo có mức lương trên trung bình.\n•\tỞ lựa chọn C, đoạn bên thứ 1 có nhắc đến việc làm việc trong lĩnh vực này sẽ cung cấp cơ hội cho những người không muốn bị mắc kẹt với 40 giờ một tuần nhưng cần phải sắp xếp công việc với các trách nhiệm khác như chăm sóc trẻ em. Có thể thấy nó mạng lại một cơ hội làm việc linh hoạt. Vì vậy lựa chọn C là đáp án đúng.\n•\tỞ lựa chọn D, đoạn bên thứ 5 có nhắc đến việc làm việc trong lĩnh vực này sẽ có cơ hội trong một số loại công việc khi đi du lịch nước ngoài, mặc dù điều đó rõ ràng phụ thuộc vào công việc và không phải ai cũng muốn làm điều đó. Vì vậy làm việc trong lĩnh vực không luôn luôn đảm bảo cơ hội cho cấp độ ở nước ngoài.\n•\tỞ lựa chọn E, đoạn bên thứ 2 có nhắc đến việc một số người thích làm việc trong khung cảnh nông thôn, xung quanh là cây cối thay vì các tòa nhà, mặc dù họ không thể đảm bảo điều đó.\nTừ những dữ kiện trên, ta có thể thấy A và C là đáp án đúng."}, "13": {"answer_label": "13 &14. B & C", "quote": "It's fine in summer, but can be extremely unpleasant when it's cold and windy.\nYou may need to be pretty fit for some jobs, though with modern technology that's not as important as it once was.\nAnd standards of health and safety are much higher now than they used to be, so there are fewer work-related accidents.\nBut if you like a lively city environment surrounded by lots of people, these jobs are probably not for you - they're often in pretty remote areas.\nAnd some people worry about finding a suitable place to live, but in our experience, this usually turns out fine.", "explain": "Câu hỏi:\n13-14. Which TWO of the following are likely to be disadvantages for people working outdoors?\nA the increasing risk of accidents B being in a very quiet location C difficult weather conditions at times D the cost of housing\nE the level of physical fitness required\nGiải thích đáp án:\nTất cả các lựa chọn đều được nhắc đến trong đoạn hội thoại bên.\n•\tỞ lựa chọn A, đoạn bên thứ 3 có nhắc đến việc các tiêu chuẩn về sức khỏe và an toàn hiện nay đã cao hơn nhiều so với trước đây, do đó, tai nạn lao động cũng ít hơn.\n•\tỞ lựa chọn B, đoạn bên thứ 4 có nhắc đến việc nếu bạn thích một môi trường thành phố sôi động được bao quanh bởi rất nhiều người, thì những công việc này có lẽ không dành cho bạn - chúng thường ở những khu vực khá hẻo lánh.Có thể thấy việc làm ở những khu vực hẻo lánh nó có thể là một bất lợi với những người làm việc ngoài trời.Vì vậy lựa chọn B là đáp án đúng.\n•\tỞ lựa chọn C, đoạn bên thứ 1 có nhắc đến việc vào mùa hè thì không sao, nhưng có thể cực kỳ khó chịu khi trời lạnh và có gió. Có thể thấy điều kiện thời tiết khắc nghiệt có thể là một bất lợi cho những người làm việc ngoài trời. Vì vậy lựa chọn C là đáp án đúng.\n•\tỞ lựa chọn D, đoạn bên thứ 5 có nhắc đến việc một số người lo lắng về việc tìm một nơi ở thích hợp nhưng cuố'i cùng họ đều ổn.\n•\tỞ lựa chọn E, đoạn bên thứ 2 có nhắc đến việc có thể cần phải khá mạnh khỏe với một số công việc, mặc dù với công nghệ hiện đại không còn quan trọng như trước đây.\nTừ những dữ kiện trên, ta có thể thấy B và C là đáp án đúng."}, "14": {"answer_label": "13 &14. B & C", "quote": "It's fine in summer, but can be extremely unpleasant when it's cold and windy.\nYou may need to be pretty fit for some jobs, though with modern technology that's not as important as it once was.\nAnd standards of health and safety are much higher now than they used to be, so there are fewer work-related accidents.\nBut if you like a lively city environment surrounded by lots of people, these jobs are probably not for you - they're often in pretty remote areas.\nAnd some people worry about finding a suitable place to live, but in our experience, this usually turns out fine.", "explain": "Câu hỏi:\n13-14. Which TWO of the following are likely to be disadvantages for people working outdoors?\nA the increasing ri
