<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test 1 &ndash; IELTS Listening Practice</title>
<style>
:root{
  --bg:#eef1f7; --panel:#ffffff; --ink:#1b2540; --muted:#66708a; --line:#e3e7f0;
  --navy:#122a52; --navy-2:#1c3f74; --brand:#1c3f74; --brand-ink:#ffffff;
  --good:#128a4e; --bad:#d64545; --good-bg:#e9f9f1; --bad-bg:#fdecec;
  --accent-bg:#eef2fb; --gold:#c9a24b; --radius:14px;
  --shadow:0 1px 3px rgba(18,42,82,.06), 0 10px 24px -14px rgba(18,42,82,.18);
}
*{box-sizing:border-box;}
body{margin:0;background:linear-gradient(180deg,#e7ebf5 0%,#eef1f7 320px);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.wrap{max-width:940px;margin:0 auto;padding:28px 16px 80px;}
header.top{padding:6px 4px 22px;text-align:center;}
header.top .kicker{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.14em;color:var(--gold);background:var(--navy);padding:5px 14px;border-radius:999px;margin-bottom:14px;}
header.top h1{font-size:26px;margin:0 0 8px;letter-spacing:.01em;color:var(--navy);font-weight:800;}
header.top p{margin:0;color:var(--muted);font-size:13.5px;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:22px 0;position:sticky;top:10px;z-index:5;}
.tab-btn{border:1px solid var(--line);background:var(--panel);color:var(--navy);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;box-shadow:var(--shadow);}
.tab-btn:hover{border-color:var(--navy-2);}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.tab-btn .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin-right:7px;vertical-align:middle;}
.tab-btn.done .dot{background:var(--gold);}
.part{display:none;}
.part.active{display:block;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:0 0 22px;margin-bottom:20px;box-shadow:var(--shadow);overflow:hidden;}
.part-bar{background:linear-gradient(90deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:15px 24px;font-weight:800;font-size:15.5px;letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.part-bar .title{font-weight:600;opacity:.92;font-size:13.5px;}
.card-body{padding:20px 24px 0;}
.card .instructions{color:var(--muted);font-size:13.5px;margin-bottom:14px;font-style:italic;}
.audio-box{display:flex;align-items:center;gap:12px;background:var(--accent-bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:4px 0 16px;}
.audio-box .icon{font-size:18px;}
.audio-box .label{font-size:12.5px;font-weight:700;color:var(--navy);white-space:nowrap;}
audio{width:100%;height:36px;}
.qgroup{margin:18px 0;}
.qgroup .header-note{font-size:12.5px;color:var(--navy-2);font-weight:800;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em;}
.qgroup .prompt{font-weight:600;margin-bottom:8px;}
.opt-list{display:flex;flex-direction:column;gap:6px;margin-bottom:2px;}
.opt{display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border-radius:9px;border:1px solid var(--line);cursor:pointer;}
.opt:hover{background:var(--accent-bg);border-color:var(--navy-2);}
.opt input{margin-top:3px;}
.opt.correct{background:var(--good-bg);border-color:var(--good);}
.opt.incorrect{background:var(--bad-bg);border-color:var(--bad);}
.opt:has(input:disabled){opacity:.45;cursor:not-allowed;}
.opt input:disabled{cursor:not-allowed;}
.notes-block{white-space:pre-wrap;line-height:2.2;}
.notes-block .subhead{display:block;font-weight:800;margin:16px 0 4px;color:var(--navy);font-size:14.5px;}
.notes-block .bullet{display:block;margin-left:14px;}
.blank{display:inline-block;border:none;border-bottom:2px solid var(--navy-2);background:var(--accent-bg);border-radius:5px 5px 0 0;padding:3px 8px;font:inherit;font-weight:700;min-width:120px;text-align:center;color:var(--ink);}
.blank:focus{outline:none;background:#e4eaf9;}
.blank.correct{border-color:var(--good);background:var(--good-bg);}
.blank.incorrect{border-color:var(--bad);background:var(--bad-bg);}
.blank-num{font-size:11px;color:var(--gold);font-weight:800;vertical-align:super;margin-right:2px;}
.actions{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap;}
button.primary{background:var(--navy);color:#fff;border:none;padding:12px 24px;border-radius:9px;font-size:14.5px;font-weight:700;cursor:pointer;box-shadow:0 6px 14px -6px rgba(18,42,82,.5);}
button.primary:hover{background:var(--navy-2);}
button.ghost{background:#fff;border:1px solid var(--line);color:var(--navy);padding:11px 18px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;}
button.ghost:hover{border-color:var(--navy-2);color:var(--navy-2);}
.score-pill{font-weight:800;padding:9px 18px;border-radius:999px;background:var(--navy);color:#fff;font-size:14px;}
.toggle-section{display:none;margin-top:16px;border-top:1px dashed var(--line);padding-top:16px;}
.toggle-section.open{display:block;}
.script-text{font-size:14.5px;background:#f7f8fc;border:1px solid var(--line);border-radius:10px;padding:14px 16px;max-height:560px;overflow-y:auto;}
.script-line{margin:0 0 10px;line-height:1.65;}
.script-line .spk{font-weight:800;color:var(--navy);margin-right:4px;}
.script-line mark.hl{background:#fdf1d0;border-radius:4px;padding:1px 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
.script-line .qtag{display:inline-block;font-weight:800;color:var(--navy);font-size:11px;background:#e8edf8;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle;}
.jump-btn{display:inline-block;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:700;color:#fff;background:var(--navy-2);border:none;border-radius:6px;padding:3px 8px;margin-right:8px;cursor:pointer;vertical-align:middle;}
.jump-btn:hover{background:var(--navy);}
.expl-item{border-top:1px solid var(--line);padding:14px 0;}
.expl-item:first-child{border-top:none;}
.expl-item .eq-head{display:flex;gap:10px;align-items:center;margin-bottom:6px;}
.expl-item .qnum{background:var(--navy);color:#fff;font-weight:800;font-size:12px;border-radius:6px;padding:3px 9px;}
.expl-item .ans{font-weight:800;color:var(--good);}
.expl-item .quote{font-style:italic;color:var(--muted);font-size:13.5px;margin:4px 0 6px;white-space:pre-wrap;}
.expl-item .explain{font-size:14px;white-space:pre-wrap;}
.example-line{color:var(--muted);font-style:italic;}
.script-note{font-size:12.5px;color:var(--muted);margin:0 0 10px;}
footer.credit{color:var(--muted);font-size:12px;text-align:center;margin-top:26px;}
@media(max-width:520px){.wrap{padding:18px 10px 60px;}.card-body{padding:16px 16px 0;}.part-bar{padding:13px 16px;}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="kicker">Flight to Success</span>
    <h1>Test 1 &mdash; IELTS Listening</h1>

<script>
const TEST_DATA = {"test": "Test 1", "parts": [{"part": 1, "kind": "notes", "title": "Flanders Conference Hotel", "instructions": "Complete the notes below. Write ONE WORD AND/OR A NUMBER for each answer.", "audio": "audio/test1/part1.mp3", "notes": ["Example", "Customer Services Manager: ........................................................................................", "Date available", "weekend beginning February 4th", "Conference facilities", "the {{1}} room for talks", "(projector and {{2}} available)", "area for coffee and an {{3}}", "free {{4}} throughout", "a standard buffet lunch costs {{5}} per head", "Accommodation", "Rooms will cost {{6}} including breakfast.", "Other facilities", "The hotel also has a spa and rooftop {{7}} .", "There's a free shuttle service to the {{8}} .", "Location", "Wilby Street (quite near the {{9}} )", "near to restaurants and many {{10}}"], "answers": {"1": "Tesla", "2": "microphone", "3": "exhibition", "4": "wifi", "5": "45", "6": "135", "7": "pool", "8": "airport", "9": "sea", "10": "clubs"}, "explanations": {"1": {"answer_label": "Câu 1", "quote": "Man: OK. Now can you tell me a bit about what conference facilities you have?\n\nAngela: Sure. So for talks and presentations we have the Tesla room.\n\nMan: Sorry?\n\nAngela: Tesla -that's spelled T-E- S-L-A.", "explain": "Câu hỏi:\nConference facilities\n•\tthe 1\troom for talks\nKeywords được paraphrase:\nCâu hỏi nằm trong phần “conference facilities” (cơ sở vật chất cho hội nghị). Đáp án cần điền là một danh từ chỉ về “room for talks” (phòng để đàm thoại).\nGiải thích đáp án:\nGiọng nam đưa ra câu hỏi “what conference facilities you have?” (bạn có cơ sở vật chất nào cho hội nghị?). Giọng nữ trả lời ngay sau đó “for talks and presentations we have the Tesla room” (để đàm thoại và trình bày, chúng tôi có phòng Tesla). Vì đây là một tên riêng của căn phòng, sau đó người nữ đã đánh vần từ Tesla."}, "2": {"answer_label": "Câu 2", "quote": "ANGELA: Tesla (Q1) - that's spelled T-E-S-L-A. It holds up to a hundred people, and it's fully equipped with a projector and so on.\n\nMAN: How about a microphone? (Q2)\n\nANGELA: Yes, that'll be all set up ready for you, and there'll be one that members of the audience can use too, for questions, if necessary.", "explain": "Câu hỏi:\nConference facilities\n•\tthe 1\troom\tfor talks\n(projector and 2\tavailable)\nKeywords được paraphrase:\nCâu hỏi vẫn nằm trong phần “conference facilities” (cơ sở vật chất cho hội nghị). Đáp án cần điền là một danh từ chỉ đồ vật, bởi trước đó ta có danh từ “projector and...” (máy chiếu và...).\nGiải thích đáp án:\nSau khi đánh vần tên căn phòng Telsa, người phụ nữ giới thiệu “it's fully equipped with a projector” (nó được trang bị đầy đủ với máy chiếu). Người đàn ông hỏi tiếp “How about a microphone?” (Còn mi-cro thì sao?). Cuối cùng, giọng nữ xác nhận “Yes, that'll be all set up ready for you.” (vâng, nó cũng sẽ được lắp sẵn cho bạn). Vì vậy, đáp án cần điền ở đây là “microphone”."}, "3": {"answer_label": "Câu 3", "quote": "Fine. And we'll also need some sort of open area where people can sit and have a cup of coffee, and we'd like to have an exhibition of our products and services there as well, so that'll need to be quite a big space.", "explain": "Câu hỏi:\n• area for coffee and an 3\t\nKeywords được paraphrase:\nCâu hỏi vẫn nằm trong phần “conference facilities” (cơ sở vật chất cho hội nghị). Dịch phần câu hỏi “area for coffee and an...” (khu vực có cà phê và một...) Vì vậy, đáp án ở đây sẽ là một danh từ đếm được số ít.\nGiải thích đáp án:\nNgười đàn ông đưa ra vế đầu tiên của câu hỏi “we'll also need some sort of open area where people can sit and have a cup of coffee” (chúng tôi cũng cần một khu vực mở nơi mọi người có thể ngồi và uống cà phê). Sau đó, ông đưa ra yêu cầu tiếp theo\nwe'd like to have an exhibition of our products” (chúng tôi muốn có một buổi triển lãm những sản phẩm). Do đó, đáp án cần điền ở đây là “exhibition”."}, "4": {"answer_label": "Câu 4", "quote": "“MAN:\tGreat. And I presume  there’s wifi?\n\nANGELA: Oh yes, that’s free and available throughout the\nhotel\n\nMAN: OK.", "explain": "Câu hỏi:\n•free 4\tthroughout\nKeywords được paraphrase:\nChỗ trống cần điền là một danh từ bởi\ntrước đó là tính từ “free” (miễn phí) và sau\nđó là trạng từ “throughout” (xuyên suốt).\nGiải thích đáp án:\nNgười đàn ông, đưa ra câu hỏi “I presume there’s wifi?” (tôi đoán là có wifi chứ?). Người phụ nữ xác nhận lại “Oh yes, that’s free and available throughout the hotel.” (Vâng, nó miễn phí và phủ sóng toàn khách sạn). Vì vậy, đáp án ở đây là “wifi”."}, "5": {"answer_label": "Câu 5", "quote": "ANGELA: Would you also like us to provide a buffet lunch? We can do a two-course meal with a number of different options.\nMAN: What sort of price are we looking at for that?\nANGELA: Well, I can send you the copy of the standard menu. That’s $45 (Q5) per person. Or you can have the special for $25 more.\nMAN: I think the standard should be OK, but yes, send me the\nmenu.", "explain": "Câu hỏi:\n• a standard buffet lunch costs 5 $\t per head\nKeywords được paraphrase:\nCâu hỏi hỏi về giá tiền của “a standard buffet lunch” (tiệc đứng buổi trưa tiêu chuẩn).\nGiải thích đáp án:\nNgười phụ nữ đưa ra câu hỏi “Would you also like us to provide a buffet lunch?” (Bạn có muốn chúng tôi cung cấp tiệc đứng buổi trưa?). Người đàn ông tiếp tục\nhỏi về thông tin bữa tiệc đứng “What sort of price are we looking at for that?” (có những loại giá nào?). Người phụ nữ giới thiệu “the standard menu. That's $45 per person.” (menu tiêu chuẩn. Nó có giá 45 đô mỗi người). Vì vậy, ta cần điền 45 ở đây."}, "6": {"answer_label": "Câu 6", "quote": "MAN: Now we're also going to need accommodation on the Saturday night for some of the participants ... I'm not sure how many, but probably about 25. So what do you charge for a room?\n\nANGELA: Well, for conference attendees we have a 25% reduction, so we can offer you rooms at $135. Normally a standard room's $180. (Q6)", "explain": "Câu hỏi:\nAccommodation\n• Rooms will cost 6$\t including\nbreakfast.\nKeywords được paraphrase:\nCâu\thỏi nằm\ttrong\tphần “accommodation” (phòng ở). Giá tiền cần điền dành cho “rooms ... including breakfast” (phòng bao gồm bữa sáng).\nGiải thích đáp án:\nĐầu tiên, người đàn ông đưa ra câu hỏi về phòng ở “What do you charge for a room?” (Bạn tính tiền một phòng bao nhiêu?). Sau đó, người phụ nữ đưa ra khá nhiều con số, ta cần lưu ý nghe kỹ. “We have a 25% reduction, so we can offer you rooms at $135.” (chúng tôi có giảm giá 25%, vì vậy giá phòng của bạn là 135 đô). Do đó, ở đây ta điền số 135."}, "7": {"answer_label": "Câu 7", "quote": "ANGELA: Sure. And of course, guests can also make use of all the other facilities at the hotel. So we've got a spa where you can get massages and facials and so on, and there's a pool up on the roof for the use of guests. (Q7)", "explain": "Câu hỏi:\nOther facilities\n• The hotel also has a spa and rooftop\n7………………………..\n•\tThere's a free shuttle service to the\n8 ……………………….\nKeywords được paraphrase:\nCâu hỏi nằm trong phần “other facilities” (cơ sở vật chất khác). Phần đáp án cần điền là một danh từ chỉ địa điểm bởi trước đó ta có cụm từ “a spa and rooftop ...” (một spa và nơi ... nằm trên mái nhà).\nGiải thích đáp án:\nNgười phụ nữ dẫn vào câu hỏi bằng câu nói “guests can also make use of all the other facilities at the hotel.” (khách có thể dùng các cơ sở vật chất khác ở khách sạn). Sau đó, người phụ nữ giới thiệu các cơ sở vật chất “we've got a spa...and there's a pool up on the roof” (chúng tôi có một spa..và một cái hồ bơi ở trên mái nhà). Vì vậy, đáp án ở đây là “pool”."}, "8": {"answer_label": "Câu 8", "quote": "MAN: Great. Now what about transport links? The hotel's downtown, isn't it?\nANGELA: Yes, it's about 12 kilometres from the airport (Q8), but there's a complimentary shuttle bus for guests. And it's only about ten minutes' walk from the central railway station.", "explain": "Câu hỏi:\nOther facilities\n•\tThe hotel also has a spa and rooftop\n7 …………………………………………………\n•\tThere's a free shuttle service to the\n8 …………………………………………………\t\nKeywords được paraphrase:\nCâu hỏi vẫn nằm trong phần “other facilities” (cơ sở vật chất khác). Phần đáp án cần điền là một danh từ chỉ địa điểm vì trước đó ta có cụm từ “there's a free shuttle service to the...” (có một dịch vụ tàu miễn phí đến.).\nGiải thích đáp án:\nNgười đàn ông chuyển sang vấn đề giao thông bằng câu hỏi “what about transport links?” (còn về mạng lưới giao thông như thế nào?). Người phụ nữ đưa ra câu trả lời “it's about 12 kilometers from the airport. But there's a complimentary shuttle bus for guests.” (khoảng 12 cây số từ sân bay, nhưng có một xe buýt tăng cường cho khách). Ở đây, chữ “complimentary” được thay cho chữ “free”, vì vậy đáp án cần điền là “airport”."}, "9": {"answer_label": "Câu 9", "quote": "ANGELA:Well, it's downtown on Wilby Street, that's quite a small street, and it's not very far from the sea (Q9). And of course if the conference attendees want to go out on the Saturday evening there's a huge choice of places to eat. Then if they want to make a night of it, they can go on to one of the clubs (Q10) in the area - there are a great many to choose from.", "explain": "Câu hỏi:\nLocation\n•\tWilby Street (quite near the 9\t)\n•\tnear to restaurants and many\n10\t\nKeywords được paraphrase:\nCâu hỏi nằm trong phần “location” (địa điểm). Tên riêng Wilby Street được đưa ra trong câu hỏi, sau đó ta cần điền một danh từ chỉ địa điểm bởi trước đó có cụm từ “quite near the...” (khá gần...).\nGiải thích đáp án:\nNgười phụ nữ nhắc đến tên riêng Wilby Street để báo hiệu câu trả lời nằm ngay sau đó. Ta nghe câu “it's not very far from the sea” (nó không quá xa từ biển) tức là nó gần biển. Vì vậy, đáp án cần điền là “sea”."}, "10": {"answer_label": "Câu 10", "quote": "ANGELA:Well, it's downtown on Wilby Street, that's quite a small street, and it's not very far from the sea (Q9). And of course if the conference attendees want to go out on the Saturday evening there's a huge choice of places to eat. Then if they want to make a night of it, they can go on to one of the clubs (Q10) in the area - there are a great many to choose from.", "explain": "Câu hỏi:\nLocation\n•\tWilby Street (quite near the 9\t)\n•\tnear to restaurants and many\n10\t\nKeywords được paraphrase:\nCâu hỏi vẫn nằm trong phần “location” (địa điểm). Ở đây, ta cần điền một danh từ chỉ nơi chốn ở dạng số nhiều vì trước đó có cụm từ “near to restaurants and many...” (gần các nhà hàng và nhiều...).\nGiải thích đáp án:\nNgười phụ nữ đưa ra câu đồng nghĩa với “restaurants” trong câu hỏi là “there's a huge choice of places to eat” (có nhiều sự lựa chọn địa điểm để ăn). Sau đó, người nói tiếp tục đưa ra ý tiếp theo “if they want to make a night of it, they can go to one of the clubs” (nếu họ muốn đi chơi đêm, họ có thể đến một trong những câu lạc bộ). Ở đây, chỉ có danh từ “clubs” phù hợp về nghĩa và loại từ để điền vào đáp án."}}, "script_full": [{"speaker": "ANGELA", "text": "Hello, Flanders conference hotel.", "qids": []}, {"speaker": "MAN", "text": "Oh, hi. I wanted to ask about conference facilities at the hotel. Have I come through to the right person?", "qids": []}, {"speaker": "ANGELA", "text": "You have. I'm the customer services manager. My name's Angela. So how can I help you?", "qids": []}, {"speaker": "MAN", "text": "Well, I'm calling from Barrett and Stansons, we're a medical company based in Perth.", "qids": []}, {"speaker": "ANGELA", "text": "Oh yes.", "qids": []}, {"speaker": "MAN", "text": "And we're organising a conference for our clients to be held in Sydney. It'll be held over two days and we're expecting about fifty or sixty people.", "qids": []}, {"speaker": "ANGELA", "text": "When were you thinking of having it?", "qids": []}, {"speaker": "MAN", "text": "Some time early next year, like the end of January? It'd have to be a weekend.", "qids": []}, {"speaker": "ANGELA", "text": "Let me see ... our conference facilities are already booked for the weekend beginning January 28th. We could do the first weekend in February?", "qids": []}, {"speaker": "MAN", "text": "How about January 21st?", "qids": []}, {"speaker": "ANGELA", "text": "I'm afraid that's booked too.", "qids": []}, {"speaker": "MAN", "text": "Well, let's go for the February date then.", "qids": []}, {"speaker": "ANGELA", "text": "So that's the weekend beginning the 4th.", "qids": []}, {"speaker": "MAN", "text": "OK. Now can you tell me a bit about what conference facilities you have?", "qids": []}, {"speaker": "ANGELA", "text": "Sure. So for talks and presentations we have the Tesla room.", "qids": ["1"], "time_seconds": 238}, {"speaker": "MAN", "text": "Sorry?", "qids": []}, {"speaker": "ANGELA", "text": "Tesla-that's spelled T-E-S-L-A. It holds up to a hundred people, and it's fully equipped with a projector and so on.", "qids": []}, {"speaker": "MAN", "text": "How about a microphone?", "qids": ["2"], "time_seconds": 258}, {"speaker": "ANGELA", "text": "Yes, that'll be all set up ready for you, and there'll be one that members of the audience can use too, for questions, if necessary.", "qids": []}, {"speaker": "MAN", "text": "Fine. And we'll also need some sort of open area where people can sit and have a cup of coffee, and we'd like to have an exhibition of our products and services there as well, so that'll need to be quite a big space.", "qids": ["3"], "time_seconds": 269}, {"speaker": "ANGELA", "text": "That's fine, there's a central atrium with all those facilities, and you can come before the conference starts if you want to set everything up.", "qids": []}, {"speaker": "MAN", "text": "Great. And I presume there's wifi?", "qids": ["4"], "time_seconds": 294}, {"speaker": "ANGELA", "text": "Oh yes, that's free and available throughout the hotel.", "qids": []}, {"speaker": "MAN", "text": "OK.", "qids": []}, {"speaker": "ANGELA", "text": "Would you also like us to provide a buffet lunch? We can do a two-course meal with a number of different options.", "qids": []}, {"speaker": "MAN", "text": "What sort of price are we looking at for that?", "qids": []}, {"speaker": "ANGELA", "text": "Well, I can send you a copy of the standard menu. That's $45 per person. Or you can have the special for $25 more.", "qids": ["5"], "time_seconds": 315}, {"speaker": "MAN", "text": "I think the standard should be OK, but yes, send me the menu.", "qids": []}, {"speaker": "MAN", "text": "Now we're also going to need accommodation on the Saturday night for some of the participants... I'm not sure how many, but probably about 25. So what do you charge for a room?", "qids": []}, {"speaker": "ANGELA", "text": "Well, for conference attendees we have a 25% reduction, so we can offer you rooms at $135. Normally a standard room's $180.", "qids": ["6"], "time_seconds": 386}, {"speaker": "MAN", "text": "And does that include breakfast?", "qids": []}, {"speaker": "ANGELA", "text": "Sure. And of course, guests can also make use of all the other facilities at the hotel. So we've got a spa where you can get massages and facials and so on, and there's a pool up on the roof for the use of guests.", "qids": ["7"], "time_seconds": 402}, {"speaker": "MAN", "text": "Great. Now what about transport links? The hotel's downtown, isn't it?", "qids": []}, {"speaker": "ANGELA", "text": "Yes, it's about 12 kilometres from the airport, but there's a complimentary shuttle bus for guests. And it's only about ten minutes' walk from the central railway station.", "qids": ["8"], "time_seconds": 424}, {"speaker": "MAN", "text": "OK. Now, I don't know Sydney very well, can you just give me an idea of the location of the hotel?", "qids": []}, {"speaker": "ANGELA", "text": "Well, it's downtown on Wilby Street, that's quite a small street, and it's not very far from the sea. And of course if the conference attendees want to go out on the Saturday evening there's a huge choice of places to eat. Then if they want to make a night of it, they can go on to one of the clubs in the area - there are a great many to choose from.", "qids": ["9", "10"], "time_seconds": 443}, {"speaker": "MAN", "text": "OK. So if we go ahead with this, can you give me some information about how much", "qids": []}]}, {"part": 2, "kind": "mcq", "title": "Street Play Scheme", "instructions": null, "audio": "audio/test1/part2.mp3", "groups": [{"qids": ["11"], "prompt": "When did the Street Play Scheme first take place?", "options": {"A": "two years ago", "B": "three years ago", "C": "six years ago"}, "multi": false, "header": "Questions 11-16 Choose the correct letter, A, B or C."}, {"qids": ["12"], "prompt": "How often is Beechwood Road closed to traffic now?", "options": {"A": "once a week", "B": "on Saturdays and Sundays", "C": "once a month"}, "multi": false, "header": null}, {"qids": ["13"], "prompt": "Who is responsible for closing the road?", "options": {"A": "a council official", "B": "the police", "C": "local wardens"}, "multi": false, "header": null}, {"qids": ["14"], "prompt": "Residents who want to use their cars", "options": {"A": "have to park in another street.", "B": "must drive very slowly.", "C": "need permission from a warden."}, "multi": false, "header": null}, {"qids": ["15"], "prompt": "Alice says that Street Play Schemes are most needed in", "options": {"A": "wealthy areas.", "B": "quiet suburban areas.", "C": "areas with heavy traffic."}, "multi": false, "header": null}, {"qids": ["16"], "prompt": "What has been the reaction of residents who are not parents?", "options": {"A": "Many of them were unhappy at first.", "B": "They like seeing children play in the street.", "C": "They are surprised by the lack of noise."}, "multi": false, "header": null}, {"qids": ["17", "18"], "prompt": "Which TWO benefits for children does Alice think are the most important?", "options": {"A": "increased physical activity", "B": "increased sense of independence", "C": "opportunity to learn new games", "D": "opportunity to be part of a community", "E": "opportunity to make new friends"}, "multi": true, "header": "Questions 17 and 18 Choose TWO letters, A-E."}, {"qids": ["19", "20"], "prompt": "Which TWO results of the King Street experiment surprised Alice?", "options": {"A": "more shoppers", "B": "improved safety", "C": "less air pollution", "D": "more relaxed atmosphere", "E": "less noise pollution"}, "multi": true, "header": "Questions 19 and 20 Choose TWO letters, A-E."}], "answers": {"11": "B", "12": "A", "13": "C", "14": "B", "15": "C", "16": "B", "17": "B", "18": "D", "19": "A", "20": "E"}, "explanations": {"11": {"answer_label": "11. B", "quote": "ALICE: Well, I first had the idea when my oldest child was still a toddler, so that's about six years ago now — but it took at least two years of campaigning before we were actually able to make it happen. So the scheme's been up and running for three years now. We'd love to be able to close our road for longer — for the whole …", "explain": "Câu hỏi: \n11. When did the Street Play Scheme first take place? \nA two years ago \nB three years ago \nC six years ago \nKeywords được paraphrase: \nTa cần gạch dưới các từ khóa “When” (khi nào) “Street Play Scheme” và “first take place” (diễn ra lần đầu tiên). Ta có thể thấy “first take place” được paraphrase lại trong bài bằng “has been up and running for” (đã bắt đầu và hoạt động trong). \nGiải thích đáp án: \nTrong bài, sau khi Alice được hỏi “When did you actually start the scheme?” (Bạn đã bắt đầu kế hoạch này khi nào?). Ta nghe được đoạn “the scheme’s been up and running for three years now” (Chương trình đã bắt và hoạt động được ba năm cho đến hiện tại). Như vậy B là đáp án. \nNgoài ra, trước đoạn này, ta cũng có nghe về những mốc thời gian khác ứng với các sự kiện mà Alice trình bày, tuy nhiên không phải là mốc thời gian bắt đầu của “Street Play Scheme”. Điển hình như “I first had the idea … six years ago” (tôi có ý tưởng này lần đầu … 6 năm về trước); “It took two years of campaigning...” (Nó mất 2 năm vận động chiến dịch…)."}, "12": {"answer_label": "12. A", "quote": "three years now. We'd love to be able to close our road for longer — for the whole weekend, from Saturday morning until Sunday evening, for example. At the moment it's just once a week. But when we started it was only once a month. But we're working on it.", "explain": "Câu hỏi: \n12. How often is Beechwood Road closed to traffic now? \nA once a week \nB on Saturdays and Sundays \nC once a month \nKeywords được paraphrase: \nTa cần chú ý vào từ hỏi “How often” (hỏi độ thường xuyên) ; “closed to traffic” (đóng cửa giao thông) và đặc biệt là “now” (ở hiện tại). Từ khóa “now” xuất hiện trong câu hỏi giúp ta xác định thì của câu chứa thông tin trong bài phải là thì hiện tại. \nGiải thích đáp án: \nTrong bài nghe, có đoạn “At the moment, It’s just once a week” (Ở thời điểm hiện tại, nó chỉ là một lần một tuần). “at the moment” có nghĩa tương đương với “now” trên câu hỏi.\nVì vậy ta chọn đáp án A."}, "13": {"answer_label": "13. C", "quote": "ALICE: We have volunteer wardens, mostly parents but some elderly residents too, who block off our road at either end. The council have provided special signs but there's always a\nvolunteer there to explain what's\nhappening to any motorists. Generally, they're fine about it — we've only had to get the police involved once or twice.", "explain": "Câu hỏi:\n13. Who is responsible for closing the road?\nA a council official\nB the police\nC local wardens\nKeywords được paraphrase:\n“responsible for” (chịu trách nhiệm làm gì) được thay bằng cấu trúc “have sb do something” (có ai đó làm gì). Ngoài ra, “closing” (đóng) cũng được thay bằng “block off” (chặn) trong bài nghe.\nGiải thích đáp án:\nTrong bài nghe, ta nghe được “We have volunteer wardens,…. who block off our road at either end” (Chúng tôi có những người trông coi tình nguyện, những người mà sẽ chặn những con đường ở 2 đầu). Như vậy đáp án là C. Ngoài ra ta cũng nghe được những vị trí khác\nứng với các đáp án A và B. Nhưng trách nhiệm của họ không phải là “closing the road”. Điển hình có “The council have provided special signs” (Hội đồng đã cung cấp những biển báo đặc biệt); “explain what’s happening to…, get the police involved” (giải thích những gì đang diễn ra cho …. gọi cảnh sát tham gia vào)."}, "14": {"answer_label": "14. B", "quote": "Now I should explain that the road isn't completely closed to cars. But only residents' cars are allowed. If people really need to get in or out of Beechwood Road, it's not a problem — as long as they drive at under 20 kilometres per hour.", "explain": "Câu hỏi:\n14. Residents who want to use their cars\nA have to park in another street.\nB must drive very slowly.\nC need permission from a warden. \nKeywords được paraphrase: \nTa cần gạch chân các từ khóa “residents” (cư dân) “use” (sử dụng) và “cars” (ô tô) để hiểu rõ nội dung câu hỏi và xác định được vị trí của câu hỏi trong bài nghe. \nGiải thích đáp án: \nTrong bài nghe, có đoạn “isn’t completely closed to cars” (không đóng hoàn toàn đối với ô tô); “only residents’ cars are allowed” (Chỉ có xe hơi của cư dân trong khu vực là được cho phép); “if people really need to get in or out, it’s not a problem” (Nếu người ta - cư dân muốn đi vào hoặc ra thì không vấn đề gì) ; “as long as they drive at under 20 kilometres per hour” (miễn là họ lái dưới 20km/h) . Như vậy ta chọn đáp án B."}, "15": {"answer_label": "15. C", "quote": "ALICE: Absolutely — we want to include all kids in the city — especially those who live on busy roads. It's here that demand is greatest. Obviously, there isn't such demand in wealthier areas where the children have access to parks or large gardens — or in the suburbs where there are usually more places for children to play outside.", "explain": "Câu hỏi: \n15. Alice says that Street Play Schemes are most needed in \nA wealthy areas. \nB quiet suburban areas. \nC areas with heavy traffic. \nKeywords được paraphrase: \nKeyword “are needed” được thay bằng “demand” (nhu cầu) trong bài nghe. \nGiải thích đáp án: \nTrong bài, ta nghe được “We want to include all kids in the city - especially those who live on busy roads. It’s here that the demand is greatest” (Chúng tôi muốn bao gồm tất cả trẻ em trong thành phố, nhất là những đứa mà sống trên những con đường tấp nập. Chính là ở đó mà nhu cầu là lớn nhất). Ta có thể thấy “busy roads” (những con đường tấp nập) đồng nghĩa với “areas with heavy traffic” (những khu vực mà có giao thông dày đặc) trong câu C. Vì vậy, ta chọn đáp án C. \nNgoài ra, tiếp sau đó, ta có thể nghe được những thông tin liên quan đến các lựa chọn còn lại, tuy nhiên chúng không phải là nơi có nhu cầu lớn nhất theo như yêu cầu câu hỏi “most needed” . Vì vậy ta loại các đáp án này."}, "16": {"answer_label": "16. B", "quote": "", "explain": "Câu hỏi: \n16. What has been the reaction of residents who are not parents? \nA Many of them were unhappy at first. \nB They like seeing children play in the street. \nC They are surprised by the lack of noise. \nKeywords được paraphrase: \nCác keyword quan trọng cần gạch chân là “reaction” (phản ứng) và “residents who are not parents” (những người dân mà không phải là các bậc phụ huynh). \nGiải thích đáp án: \nTrong bài, ta nghe được “everyone is very supportive and say they’re very happy to see children out on the street” (mọi người đều rất ủng hộ và nói rằng họ rất vui khi thấy trẻ em trên đường phố). “be happy to” (rất vui khi) đồng nghĩa với “like” (thích) ở câu B. Vì vậy, ta chọn đáp án B."}, "17": {"answer_label": "17. B & D", "quote": "but for me the biggest advantage is that kids develop confidence in themselves to be outside without their parents. The other really fantastic thing is that children get to know the adults in the street — it's like having a big extended family.", "explain": "Câu hỏi: \nQuestions 17 and 18 Choose TWO letters, A-E. Which TWO benefits for children does Alice think are the most important? \nA increased physical activity \nB increased sense of independence\nC opportunity to learn new games \nD opportunity to be part of a community \nE opportunity to make new friends \nKeywords được paraphrase: \nTa cần tập trung vào các keywords “Benefits” (lợi ích); “Alice think” và “most important” (quan trọng nhất) để nắm rõ thông tin cần nghe. Trong bài nghe, những keyword này được thể hiện qua câu “But for me the biggest advantage is” (nhưng đối với tôi, lợi ích lớn nhất là …). \nGiải thích đáp án: \nSau khi xác định vị trí của câu hỏi 17 và 18 qua cụm từ “for me the biggest advantage is”, ta nghe được “kids develop confidence in themselves to be outside without their parents” (Những đứa trẻ phát triển sự tự tin trong bản thân chúng khi ra ngoài mà không có ba mẹ). Ý của câu này hướng về câu B “increased sense of independence” (cảm giác tự lập được tăng lên). Như vậy lợi ích đầu tiên ta nghe được là B."}, "18": {"answer_label": "18. B & D", "quote": "but for me the biggest advantage is that kids develop confidence in themselves to be outside without their parents. The other really fantastic thing is that children get to know the adults in the street — it's like having a big extended family.", "explain": "Câu hỏi: \nQuestions 17 and 18 Choose TWO letters, A-E. \nWhich TWO benefits for children does Alice think are the most important? \nA increased physical activity \nB increased sense of independence \nC opportunity to learn new games \nD opportunity to be part of a community \nE opportunity to make new friends \nKeywords được paraphrase: \nTa cần tập trung vào các keywords “Benefits” (lợi ích); “Alice think” và “most \nimportant” (quan trọng nhất) để nắm rõ thông tin cần nghe. Trong bài nghe, những keyword này được thể hiện qua câu “But for me the biggest advantage is” (nhưng đối với tôi, lợi ích lớn nhất là …). \nGiải thích đáp án: \nSau đó, Alice chuyển sang lợi ích thứ 2 bằng cách nói “The other really fantastic thing is” (Một điều nữa khá tuyệt vời là…). Sau đó, cô ấy nói “Children get to know the adults in the street - it’s like having a big extended family” (Trẻ em có thể làm quen với những người lớn trong phố - nó giống như thể có một gia đình to lớn vậy). Ý của câu này hướng về lựa chọn D “opportunity to be part of a community” (cơ hội để trở thành một phần của cộng đồng). Rõ ràng những đứa trẻ khi quen biết được những người lớn sống trong cùng khu vực có thể trở thành một phần của một cộng đồng lớn hơn. Như vậy ta chọn đáp án D."}, "19": {"answer_label": "19. A & E", "quote": "It was surprising how much of a difference all this made. As we'd predicted, air quality was significantly better but what I hadn't expected was how much quieter it would be — even with the buses still running. Of course everyone said they felt safer but we were actually amazed that sales in the shops went up considerably that day — we thought there'd be fewer people out shopping — not more.", "explain": "Câu hỏi: \nQuestions 19 and 20 Choose TWO letters, A—E. \nWhich TWO results of the King Street experiment surprised Alice? \nA more shoppers \nB improved safety \nC less air pollution \nD more relaxed atmosphere \nE less noise pollution \nKeywords được paraphrase: \nCần gạch dưới “King Street experiment” vì đây là đối tượng chính của câu hỏi giúp mình xác định được vị trí của câu hỏi trong bài nghe. Ngoài ra cũng chú ý đến keyword \n“results” (kết quả) và “surprised Alice” (làm Alice ngạc nhiên). Như vậy, ta chỉ tập trung vào những kết quả mà làm Alice ngạc nhiên. \nTrong bài “surprised” (làm ngạc nhiên) được paraphrase lại thành các cụm từ “hadn’t expected” (không ngờ đến được) và “were amazed” (rất ngạc nhiên). \nGiải thích đáp án: \nĐoạn thông tin liên quan đến câu hỏi bắt đầu khi Alice nói “It was surprising how much of a difference all this made” (Thật ngạc nhiên làm sao về những sự khác biệt mà tất cả những việc này tạo ra). Sau đó ta nghe được “What I hadn’t expected was how much quieter it would be” (Điều mà tôi đã không ngờ đến được là việc mọi thứ trở nên yên tĩnh hơn như thế nào). Thông tin này hướng về lựa chọn E “less noise pollution” (ít ô nhiễm tiếng ồn hơn). Như vậy đáp án đầu tiên mà ta chọn được là E. \nNgoài ra, trước đó ta nghe được “air quality was…better” (Chất lượng không khí tốt hơn) nhưng ta không chọn lựa chọn C vì kết quả này đã được biết trước “As we’d predicted” (Giống như những gì chúng tôi đã liệu trước)."}, "20": {"answer_label": "20. A & E", "quote": "It was surprising how much of a difference all this made. As we'd predicted, air quality was significantly better but what I hadn't expected was how much quieter it would be — even with the buses still running. Of course everyone said they felt safer but we were actually amazed that sales in the shops went up considerably that day — we thought there'd be fewer people out shopping — not more.", "explain": "Câu hỏi: \nQuestions 19 and 20 Choose TWO letters, A—E. \nWhich TWO results of the King Street experiment surprised Alice? \nA more shoppers \nB improved safety \nC less air pollution \nD more relaxed atmosphere \nE less noise pollution\nCần gạch dưới “King Street experiment” vì đây là đối tượng chính của câu hỏi giúp mình xác định được vị trí của câu hỏi trong bài nghe. Ngoài ra cũng chú ý đến keyword “results” (kết quả) và “surprised Alice” (làm Alice ngạc nhiên). Như vậy, ta chỉ tập trung vào những kết quả mà làm Alice ngạc nhiên. \nTrong bài “surprised” (làm ngạc nhiên) được paraphrase lại thành các cụm từ “hadn’t expected” (không ngờ đến được) và “were amazed” (rất ngạc nhiên). \nGiải thích đáp án: \nTiếp theo, ta nghe được “We were actually amazed that sales in the shops went up considerably that day” (Chúng tôi đã thực sự ngạc nhiên khi doanh thu của các cửa hàng tăng vọt ngày hôm đó). Thông tin này hướng ta đến lựa chọn A “more shoppers” (nhiều người mua sắm hơn). Rõ ràng vì có nhiều người mua sắm hơn nên doanh thu các cửa hàng mới tăng vọt. Vì vậy đáp án thứ hai mà ta chọn được là A. \nTrước đó ta có nghe được “everyone said that they felt safer” (mọi người nói rằng họ cảm thấy an toàn hơn). Thông tin này hướng ta đến lựa chọn B nhưng ta không chọn đáp án này do trước câu này có “Of course” (Tất nhiên là). Như vậy, ta loại lựa chọn này vì nó không làm Alice ngạc nhiên."}}, "script_full": [{"speaker": "PRESENTER", "text": "My guest on the show today is Alice Riches who started the Street Play Scheme where she lives in Beechwood Road. For those of you that don't already know - Street Play involves local residents closing off their street for a few hours so that children have a chance to play in the street safely. She started it in her own street, Beechwood Road, and the idea caught on, and there are now Street Play Schemes all over the city. So when did you actually start the scheme, Alice?", "qids": []}, {"speaker": "ALICE", "text": "Well, I first had the idea when my oldest child was still a toddler, so that's about six years ago now - but it took at least two years of campaigning before we were actually able to make it happen. So the scheme's been up and running for three years now. We'd love to be able to close our road for longer - for the whole weekend, from Saturday morning until Sunday evening, for example. At the moment it's just once a week. But when we started it was only once a month. But we're working on it.", "qids": ["11", "12", "13"], "time_seconds": 98}, {"speaker": "PRESENTER", "text": "So what actually happens when Beechwood Road is closed?", "qids": []}, {"speaker": "ALICE", "text": "We have volunteer wardens, mostly parents but some elderly residents too, who block off our road at either end. The council have provided special signs but there's always a volunteer there to explain what's happening to any motorists. Generally, they're fine about it - we've only had to get the police involved once or twice.", "qids": []}, {"speaker": "PRESENTER", "text": "Now I should explain that the road isn't completely closed to cars. But only residents' cars are allowed. If people really need to get in or out of Beechwood Road, it's not a problem - as long as they drive at under 20 kilometres per hour. But most people just decide not to use their cars during this time, or they park in another street. The wardens are only there to stop through traffic.", "qids": []}, {"speaker": "ALICE", "text": "So can anyone apply to get involved in Street Play?", "qids": []}, {"speaker": "PRESENTER", "text": "Absolutely - we want to include all kids in the city - especially those who live on busy roads. It's here that demand is greatest. Obviously, there isn't such demand in wealthier areas where the children have access to parks or large gardens - or in the suburbs where there are usually more places for children to play outside. I'd recommend that anyone listening who likes the idea should just give it a go. We've been surprised by the positive reaction of residents all over the city. And that's not just parents. There are always a few who complain but they're a tiny minority. On the whole everyone is very supportive and say they're very happy to see children out on the street - even if it does get quite noisy.", "qids": ["14", "15", "16"], "time_seconds": 176}, {"speaker": "ALICE", "text": "There have been so many benefits of Street Play for the kids. Parents really like the fact that the kids are getting fresh air instead of sitting staring at a computer screen, even if they're not doing anything particularly energetic. And of course it's great that kids can play with their friends outside without being supervised by their parents but for me the biggest advantage is that kids develop confidence in themselves to be outside without their parents. The other really fantastic thing is that children get to know the adults in the street - it's like having a big extended family.", "qids": ["17", "18"], "time_seconds": 275}, {"speaker": "PRESENTER", "text": "It certainly does have a lot of benefits. I want to move on now and ask you about a related project in King Street.", "qids": []}, {"speaker": "ALICE", "text": "Right. Well this was an experiment I was involved in where local residents decided to try and reduce the traffic along King Street, which is the busiest main road in our area, by persuading people not to use their cars for one day. We thought about making people pay more for parking - but we decided that would be really unpopular - so instead we just stopped people from parking on King Street but left the other car parks open. It was surprising how much of a difference all this made. As we'd predicted, air quality was significantly better but what I hadn't expected was how much quieter it would be even with the buses still running. Of course everyone said they felt safer but we were actually amazed that sales in the shops went up considerably that day we thought there'd be fewer people out shopping - not more.", "qids": ["19", "20"], "time_seconds": 324}, {"speaker": "PRESENTER", "text": "That's really interesting so the fact that...", "qids": []}]}, {"part": 3, "kind": "mcq", "title": "Diet and Obesity Presentation", "instructions": null, "audio": "audio/test1/part3.mp3", "groups": [{"qids": ["21", "22"], "prompt": "Which TWO points does Adam make about his experiment on artificial sweeteners?", "options": {"A": "The results were what he had predicted.", "B": "The experiment was simple to set up.", "C": "A large sample of people was tested.", "D": "The subjects were unaware of what they were drinking.", "E": "The test was repeated several times for each person."}, "multi": true, "header": "Questions 21 and 22 Choose TWO letters, A-E."}, {"qids": ["23", "24"], "prompt": "Which TWO problems did Rosie have when measuring the fat content of nuts?", "options": {"A": "She used the wrong sort of nuts.", "B": "She used an unsuitable chemical.", "C": "She did not grind the nuts finely enough.", "D": "The information on the nut package was incorrect.", "E": "The weighing scales may have been unsuitable."}, "multi": true, "header": "Questions 23 and 24 Choose TWO letters, A-E."}, {"qids": ["25"], "prompt": "Adam suggests that restaurants could reduce obesity if their menus", "options": {"A": "offered fewer options.", "B": "had more low-calorie foods.", "C": "were organised in a particular way."}, "multi": false, "header": "Questions 25-30 Choose the correct letter, A, B or C."}, {"qids": ["26"], "prompt": "The students agree that food manufacturers deliberately", "options": {"A": "make calorie counts hard to understand.", "B": "fail to provide accurate calorie counts.", "C": "use ineffective methods to reduce calories."}, "multi": false, "header": null}, {"qids": ["27"], "prompt": "What does Rosie say about levels of exercise in England?", "options": {"A": "The amount recommended is much too low.", "B": "Most people overestimate how much they do.", "C": "Women now exercise more than they used to."}, "multi": false, "header": null}, {"qids": ["28"], "prompt": "Adam refers to the location and width of stairs in a train station to illustrate", "options": {"A": "practical changes that can influence people’s behaviour.", "B": "methods of helping people who have mobility problems.", "C": "ways of preventing accidents by controlling crowd movement."}, "multi": false, "header": null}, {"qids": ["29"], "prompt": "What do the students agree about including reference to exercise in their presentation?", "options": {"A": "They should probably leave it out.", "B": "They need to do more research on it.", "C": "They should discuss this with their tutor."}, "multi": false, "header": null}, {"qids": ["30"], "prompt": "What are the students going to do next for their presentation?", "options": {"A": "prepare some slides for it", "B": "find out how long they have for it", "C": "decide on its content and organization"}, "multi": false, "header": null}], "answers": {"21": "C", "22": "D", "23": "C", "24": "E", "25": "C", "26": "A", "27": "B", "28": "A", "29": "A", "30": "C"}, "explanations": {"21": {"answer_label": "21 & 22. C & D", "quote": "Adam: Yeah. It took me ages to decide exactly how I'd organise it, especially how I could make sure that people didn't know which drink I was giving them. It was hard to keep track of it all, especially as I had so many people doing it - I had to make sure I kept a proper record", "explain": "Câu hỏi:\n21-22. Which TWO points does Adam make about his experiment on artificial sweeteners?\nA The results were what he had predicted.\nB The experiment was simple to set up.\nC A large sample of people was tested.\nD The subjects were unaware of what they were drinking.\nE The test was repeated several times for each person.\nGiải thích đáp án:\nTất cả các lựa chọn đều được nhắc đến trong đoạn hội thoại bên."}, "22": {"answer_label": "21 & 22. C & D", "quote": "Adam: Yeah. It took me ages to decide exactly how I'd organise it, especially how I could make sure that people didn't know which drink I was giving them. It was hard to keep track of it all, especially as I had so many people doing it - I had to make sure I kept a proper record", "explain": "Câu hỏi:\n21-22. Which TWO points does Adam make about his experiment on artificial sweeteners?\nA The results were what he had predicted.\nB The experiment was simple to set up.\nC A large sample of people was tested.\nD The subjects were unaware of what they were drinking.\nE The test was repeated several times for each person.\nGiải thích đáp án:\nTất cả các lựa chọn đều được nhắc đến trong đoạn hội thoại bên."}, "23": {"answer_label": "23 & 24. C & E", "quote": "Rosie: Yes. My results were a bit problematic - the fat content for that type of nut seemed much lower than it said on the package. But I reckon the package information was right. I think I should probably have ground up the nuts more than I did. It's possible that the scales for weighing the fat weren't accurate enough, too...", "explain": "Câu hỏi:\n23-24. Which TWO problems did Rosie have when measuring the fat content of nuts?\nA She used the wrong sort of nuts.\nB She used an unsuitable chemical.\nC She did not grind the nuts finely enough. D The information on the nut package was incorrect.\nE The weighing scales may have been unsuitable.\nGiải thích đáp án:\n•  Ở lựa chọn A, thông tin về việc Rosie sử dụng sai loại hạt không được nhắc đến trong bài.\nỞ  Ở lựa chọn B, thông tin về việc Rosie sử dụng loại hóa chất không phù hợp không được nhắc đến trong bài.\n•\tỞ lựa chọn C, đoạn hội thoại bên chỉ ra rằng Rosie nghĩ rằng cô ấy có lẽ nên nghiền các loại hạt kỹ hơn cô ấy đã làm. Có thể thấy vấn đề Rosie gặp phải là cô ấy chưa nghiền các loại hạt đủ mịn. Vì vậy lựa chọn C là đáp án đúng.\n•\tỞ lựa chọn D, đoạn hội thoại bên chỉ ra rằng Rosie nghĩ rằng các thông tin trên bao bì là đúng chứ không sai.\n•\tỞ lựa chọn E, đoạn hội thoại bên chỉ ra rằng Rosie nghĩ rằng có thể cân dùng để cân chất béo không đủ chính xác. Có thể thấy vấn đề Rosie gặp phải là cân có thể không phù hợp. Vì vậy lựa chọn E là đáp án đúng.\nTừ những dữ kiện trên, ta có thể thấy C và E là đáp án đúng."}, "24": {"answer_label": "23 & 24. C & E", "quote": "Rosie: Yes. My results were a bit problematic - the fat content for that type of nut seemed much lower than it said on the package. But I reckon the package information was right. I think I should probably have ground up the nuts more than I did. It's possible that the scales for weighing the fat weren't accurate enough, too...", "explain": "Câu hỏi:\n23-24. Which TWO problems did Rosie have when measuring the fat content of nuts?\nA She used the wrong sort of nuts.\nB She used an unsuitable chemical.\nC She did not grind the nuts finely enough. D The information on the nut package was incorrect.\nE The weighing scales may have been unsuitable.\nGiải thích đáp án:\n•  Ở lựa chọn A, thông tin về việc Rosie sử dụng sai loại hạt không được nhắc đến trong bài.\nỞ  Ở lựa chọn B, thông tin về việc Rosie sử dụng loại hóa chất không phù hợp không được nhắc đến trong bài.\n•\tỞ lựa chọn C, đoạn hội thoại bên chỉ ra rằng Rosie nghĩ rằng cô ấy có lẽ nên nghiền các loại hạt kỹ hơn cô ấy đã làm. Có thể thấy vấn đề Rosie gặp phải là cô ấy chưa nghiền các loại hạt đủ mịn. Vì vậy lựa chọn C là đáp án đúng.\n•\tỞ lựa chọn D, đoạn hội thoại bên chỉ ra rằng Rosie nghĩ rằng các thông tin trên bao bì là đúng chứ không sai.\n•\tỞ lựa chọn E, đoạn hội thoại bên chỉ ra rằng Rosie nghĩ rằng có thể cân dùng để cân chất béo không đủ chính xác. Có thể thấy vấn đề Rosie gặp phải là cân có thể không phù hợp. Vì vậy lựa chọn E là đáp án đúng.\nTừ những dữ kiện trên, ta có thể thấy C và E là đáp án đúng."}, "25": {"answer_label": "25. C", "quote": "Adam: There's a lot we could say about what restaurants could do to reduce obesity ... So, if you put the low-calorie items at the beginning and end of the menu, people will probably go for the food with fewer calories, without even realising what they're doing.", "explain": "Câu hỏi:\nChoose the correct letter, A, B, or C.\n25. Adam suggests that restaurants could reduce obesity if their menus\nA offered fewer options.\nB had more low-calorie foods.\nC were organised in a particular way.\nGiải thích đáp án:\nĐoạn bên chỉ ra rằng Adam nghĩ rằng nếu đặt những món có hàm lượng calo thấp ở đầu và cuối thực đơn, mọi người có thể sẽ chọn món có ít calo hơn mà không hề nhận ra họ đang làm gì. Có thể thấy rằng Adam gợi ý rằng các nhà hàng có thể giảm béo phì nếu thực đơn của họ có nhiều các món ăn có hàm lượng calo thấp. Vì vậy lựa chọn B là đáp án đúng."}, "26": {"answer_label": "26. A", "quote": "Rosie: Well, when manufacturers put calorie counts of a food on the label, they're sometimes really confusing and I suspect they do it on purpose.", "explain": "Câu hỏi:\n26. The students agree that food manufacturers deliberately\nA make calorie counts hard to understand.\nB fall to provide accurate calorie counts. C use ineffective methods to reduce calories. Keywords được paraphrase: deliberately - on purpose"}, "27": {"answer_label": "27. B", "quote": "Adam: I suppose another approach to this problem is to get people to exercise more.\nRosie: Right. In England, ... about 40% of men and 30% of women say then do this, but when you objectively measure the amount of walking they do with motion sensors, you find that only 6% of men and 4% of women do the recommended amount of exercise.", "explain": "Câu hỏi:\n27. What does Rosie say about levels of exercise in England?\nA The amount recommended is much too low. B Most people overestimate how much they do. C Women now exercise more than they used to. Giải thích đáp án:\nĐoạn hội thoại bên chỉ ra rằng ở Anh, khoảng 40% nam giới và 30% phụ nữ nói họ có tập thể dục, nhưng khi bạn đo lường khách quan lượng đi bộ mà họ thực hiện bằng cảm biến chuyển động, bạn thấy rằng chỉ 6% nam giới và 4% phụ nữ làm theo khối lượng bài tập khuyến nghị.\nCó thể thấy rằng hầu hết mọi người đều đánh giá quá cao mức độ họ làm được. Vì vậy lựa chọn B là đáp án đúng."}, "28": {"answer_label": "28. A", "quote": "Adam: If people reach the stairs before they reach the escalator when they're leaving the station, they're more likely to take the stairs. And if you increase the width of the stairs, you'll get more people using them at the same time. It's an unconscious process and influenced by minor modifications in their environment.", "explain": "Câu hỏi:\n28. Adam refers the location and width of stairs in a train station to illustrate\nA practical changes that can influence people's behaviour.\nB methods of helping people who have mobility problems.\nC ways of preventing accidents by controlling crowd movement.\nKeywords được paraphrase:\nchanges - modifications\nGiải thích đáp án:\nĐoạn hội thoại bên chỉ ra rằng nếu mọi người đến cầu thang bộ trước khi họ đến thang cuốn khi rời nhà ga, thì nhiều khả năng họ sẽ đi cầu thang bộ. Và nếu bạn tăng chiều rộng của cầu thang, bạn sẽ có thêm nhiều người sử dụng chúng cùng một lúc. Đó là một quá trình vô thức và bị ảnh hưởng bởi những thay đổi nhỏ trong môi trường của họ.\nCó thể thấy rằng Adam đề cập đến vị trí và chiều rộng của cầu thang trong nhà ga xe lửa để minh họa những thay đổi thực tế có thể ảnh hưởng đến hành vi của mọi người. Vì vậy lựa chọn A là đáp án đúng."}, "29": {"answer_label": "29. A", "quote": "Adam: ... I'm not sure if we should be talking about exercise in our presentation.\nRosie: Well, we've done quite a bit of reading about it. Adam: I know, but it's going to mean we have a very wide focus, and our tutor did say that we need to focus on causes and solutions in terms of nutrition. Rosie: I suppose so. And we've got plenty of information about that. OK, well that will be simpler.", "explain": "Câu hỏi:\n29. What do the students agree about including reference to exercise in their presentation?\nA They should probably leave it out.\nB They need to do more research on it.\nC They should discuss this with their tutor.\nGiải thích đáp án:\nĐoạn hội thoại bên chỉ ra rằng cả Rose và Adam đều đồng ý rằng họ không nên đưa việc nói về việc tập thể dục vào trong bài thuyết trình của họ mà nên tập trung vào nguyên nhân và giải pháp liên quan đến dinh dưỡng.\nVì vậy lựa chọn A là đáp án đúng."}, "30": {"answer_label": "30. C", "quote": "Adam: So what shall we do now? We've still got an hour before our next lecture.\nRosie: Let's think about what we're going to include and what will go where.\nThen we can decide what slides we need. \nAdam: OK, fine.", "explain": "Câu hỏi:\n30. What are the students going to do next for their presentation?\nA prepare some slides for it\nB find out how long they have for it.\nC decide on its content and organisation.\nGiải thích đáp án:\nĐoạn bên chỉ ra rằng cả hai đều đồng ý rằng việc họ làm tiếp theo cho bài thuyết trình là suy nghĩ về những gì họ sẽ bao gồm và những gì sẽ đi đến đâu.\nSau đó, họ có thể quyết định những slide nào mà họ cần.\nCó thể thấy rằng họ sẽ quyết định về nội dung và việc tổ chức bài thuyết trình của họ. Vì vậy lựa chọn C là đáp án đúng."}}, "script_full": [{"speaker": "ADAM", "text": "OK Rosie, shall we try to get some ideas together for our presentation on diet and obesity?", "qids": []}, {"speaker": "ROSIE", "text": "Sure.", "qids": []}, {"speaker": "ADAM", "text": "I can talk about the experiment I did to see if people can tell the difference between real sugar and artificial sweeteners.", "qids": []}, {"speaker": "ROSIE", "text": "Where you gave people drinks with either sugar or artificial sweeteners and they had to say which they thought it was?", "qids": []}, {"speaker": "ADAM", "text": "Yeah. It took me ages to decide exactly how I'd organise it, especially how I could make sure that people didn't know which drink I was giving them. It was hard to keep track of it all, especially as I had so many people doing it - I had to make sure I kept a proper record of what each person had had.", "qids": ["21", "22"], "time_seconds": 64}, {"speaker": "ROSIE", "text": "So could most people tell the difference?", "qids": []}, {"speaker": "ADAM", "text": "Yeah I hadn't thought they would be able to, but most people could.", "qids": []}, {"speaker": "ROSIE", "text": "Then there's that experiment I did measuring the fat content of nuts, to see if the nutritional information given on the packet was accurate.", "qids": []}, {"speaker": "ADAM", "text": "The one where you ground up the nuts and mixed them with a chemical to absorb the fat?", "qids": []}, {"speaker": "ROSIE", "text": "Yes. My results were a bit problematic - the fat content for that type of nut seemed much lower than it said on the package. But I reckon the package information was right. I think I should probably have ground up the nuts more than I did. It's possible that the scales for weighing the fat weren't accurate enough, too. I'd really like to try the experiment again some time.", "qids": ["23", "24"], "time_seconds": 107}, {"speaker": "ADAM", "text": "So what can we say about helping people to lose weight?", "qids": []}, {"speaker": "ROSIE", "text": "There's a lot we could say about what restaurants could do to reduce obesity. I read that the items at the start of a menu and the items at the end of a menu are much more likely to be chosen than the items in the middle. So, if you put the low-calorie items at the beginning and end of the menu, people will probably go for the food with fewer calories, without even realising what they're doing.", "qids": ["25"], "time_seconds": 194}, {"speaker": "ADAM", "text": "I think food manufacturers could do more to encourage healthy eating.", "qids": []}, {"speaker": "ROSIE", "text": "How?", "qids": []}, {"speaker": "ADAM", "text": "Well, when manufacturers put calorie counts of a food on the label, they're sometimes really confusing and I suspect they do it on purpose. Because food that's high in calories tastes better, and so they'll sell more.", "qids": ["26"], "time_seconds": 222}, {"speaker": "ADAM", "text": "Yeah, so if you look at the amount of calories in a pizza, they'll give you the calories per quarter pizza and you think, oh that's not too bad. But who's going to eat a quarter pizza?", "qids": []}, {"speaker": "ROSIE", "text": "Exactly.", "qids": []}, {"speaker": "ADAM", "text": "I suppose another approach to this problem is to get people to exercise more.", "qids": []}, {"speaker": "ROSIE", "text": "Right. In England, the current guidelines are for at least 30 minutes of brisk walking, five days a week. Now when you ask them, about 40% of men and 30% of women say they do this, but when you objectively measure the amount of walking they do with motion sensors, you find that only 6% of men and 4% of women do the recommended amount of exercise.", "qids": ["27"], "time_seconds": 261}, {"speaker": "ADAM", "text": "Mm, so you can see why obesity is growing.", "qids": []}, {"speaker": "ROSIE", "text": "So how can people be encouraged to take more exercise?", "qids": []}, {"speaker": "ADAM", "text": "Well, for example, think of the location of stairs in a train station. If people reach the stairs before they reach the escalator when they're leaving the station, they're more likely to take the stairs. And if you increase the width of the stairs, you'll get more people using them at the same time. It's an unconscious process and influenced by minor modifications in their environment.", "qids": ["28"], "time_seconds": 297}, {"speaker": "ROSIE", "text": "Right. And it might not be a big change, but if it happens every day, it all adds up.", "qids": []}, {"speaker": "ADAM", "text": "Yes. But actually, I'm not sure if we should be talking about exercise in our presentation.", "qids": ["29"], "time_seconds": 330}, {"speaker": "ROSIE", "text": "Well, we've done quite a bit of reading about it.", "qids": []}, {"speaker": "ADAM", "text": "I know, but it's going to mean we have a very wide focus, and our tutor did say that we need to focus on causes and solutions in terms of nutrition.", "qids": []}, {"speaker": "ROSIE", "text": "I suppose so. And we've got plenty of information about that. OK, well that will be simpler.", "qids": []}, {"speaker": "ADAM", "text": "So what shall we do now? We've still got half an hour before our next lecture.", "qids": []}, {"speaker": "ROSIE", "text": "Let's think about what we're going to include and what will go where. Then we can decide what slides we need.", "qids": ["30"], "time_seconds": 362}, {"speaker": "ADAM", "text": "OK, fine.", "qids": []}]}, {"part": 4, "kind": "notes", "title": "Bird Migration Theory", "instructions": "Complete the notes below. Write ONE WORD ONLY for each answer.", "audio": "audio/test1/part4.mp3", "notes": ["Most birds are believed to migrate seasonally.", "Hibernation theory", "It was believed that birds hibernated underwater or buried themselves in {{31}} .", "This theory was later disproved by experiments on caged birds.", "Transmutation theory", "Aristotle believed birds changed from one species into another in summer and winter.", "–  In autumn he observed that redstarts experience the loss of {{32}} and thought they then turned into robins.", "–  Aristotle’s assumptions were logical because the two species of birds had a similar {{33}} .", "17th century", "Charles Morton popularised the idea that birds fly to the {{34}} in winter.", "Scientific developments", "In 1822, a stork was killed in Germany which had an African spear in its {{35}} .", "–  previously there had been no {{36}} that storks migrate to Africa", "Little was known about the {{37}} and journeys of migrating birds until the practice of ringing was established.", "–  It was thought large birds carried small birds on some journeys because they were considered incapable of travelling across huge {{38}} .", "–  Ringing depended on what is called the {{39}} of dead birds.", "In 1931, the first {{40}} to show the migration of European birds was printed."], "answers": {"31": "mud", "32": "feathers", "33": "shape", "34": "moon", "35": "neck", "36": "evidence", "37": "destinations", "38": "oceans", "39": "recovery", "40": "atlas"}, "explanations": {"31": {"answer_label": "31. mud", "quote": "Take hibernation theory for example - two thousand years ago, it was commonly believed that when birds left an area, they went underwater to hibernate in the seas and oceans. Another theory for the regular appearance and disappearance of birds was that they spend winter hidden in mud", "explain": "Câu hỏi:\nIt was believed that birds hibernated underwater or buried themselves in ...\nKeywords được paraphrase:\nUnderwater - seas and oceans\nburied - hidden\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Người ta tin rằng chim ngủ đông dưới nước hoặc vùi mình trong bùn -‘mud'"}, "32": {"answer_label": "32. feathers", "quote": "He observed that in the autumn, small birds called ‘redstarts' began to lose their feathers", "explain": "Câu hỏi:\nIn autumn he observed that redstarts experience the loss of \tand\tthought they then turned into robins\nKeywords được paraphrase:\nbegan to lose - experience the loss of\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Anh ta quán sát được rằng, vào mùa thu, loài chim nhỏ được gọi là “redstarts” sẽ bị rụng lông-‘feather'"}, "33": {"answer_label": "33. shape", "quote": "These assumptions are understandable given that this pair of species are similar in shape, but are a classic example of an incorrect interpretation based on correct observations", "explain": "Câu hỏi:\nAristotle's assumptions were logical because the two species of birds had a similar...\nKeywords được paraphrase:\nLogical - understandable\npair of species - the two species of birds\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Giả định của Aristotle là hợp lý vì hai loài chim có chung hình dạng-‘shape'"}, "34": {"answer_label": "34. moon", "quote": "He wrote a surprisingly well- regarded paper claiming that birds migrate to the moon and back every year", "explain": "Câu hỏi:\nCharles Morton popularised the idea that birds fly to the ... in winter\nKeywords được paraphrase:\nPopularised the idea that - wrote a surprisingly well-regard paper claiming that\nMigrate - fly\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Charles Morton đã phổ biến ý tưởng rằng các loài chim bay mặt trăng-‘moon' vào mùa đông"}, "35": {"answer_label": "35. neck", "quote": "One of the key moments in the development of migration theory came in 1822 when a white stork was shot in Germany. This particular stork made history because of the long spear in its neck", "explain": "Câu hỏi:\nIn 1822, a stork was killed in Germany which had an African spear in its.\nKeywords được paraphrase:\nwas killed - was shot\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Một trong những thời khắc quyết định trong sự phát triển của thuyết di cư đến vào năm 1822 kh mà một con cò trắng bị bắn ở Đức. Con còn này tạo ra lịch sử vì có một cây giáo-‘spear’ dài ở cổ"}, "36": {"answer_label": "36. evidence", "quote": "This was a truly defining moment in the history of ornithology because it was the first evidence that storks spend their winters in sub-Saharan Africa", "explain": "Câu hỏi:\npreviously there had been no ... that storks migrate to Africa\nKeywords được paraphrase:\nspend their winter in sub-Saharan Africa - migrate to Africa\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Đoạn bên nói rằng, đây là một trong những phút giây quyết định nhất trong lịch sử điểu học, vì nó là một trong những bằng chứng-‘evidence’ đầu tiên là cò dành thời gian mùa đông của chúng ở khu vực châu Phi. Câu hỏi: trước đó chưa có một bằng chứng-‘evidence’ nào về việc cò di cư đến châu Phi"}, "37": {"answer_label": "37. destinations", "quote": "Before this, very little information was available about the actual destinations of particular species and how they travelled there", "explain": "Câu hỏi:\nLittle was known about the ... and journeys of migrating birds until the practice of ringing was established.\nKeywords được paraphrase:\nVery little information was available - Little was known about\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Người ta biết rất ít về địa điểm-‘destinations’ và hành trình của các loài chim di cư cho đến khi thực hành tiếng chuông được thành lập"}, "38": {"answer_label": "38.oceans", "quote": "People speculated that larger birds provided a kind of taxi service for smaller birds by carrying them on their backs. This idea came about because it seemed impossible that small birds weighing only a few grams could fly over vast oceans", "explain": "Câu hỏi:\nIt was thought large birds carried small birds on some journeys because they were considered incapable of travelling across huge\nKeywords được paraphrase:\nthat larger birds provided a kind of taxi service for smaller birds by carrying them on their backs - large birds carried small birds\nthey were considered incapable of travelling across - it seemed impossible hat small brids weighing only a few grams could fly over\nvast - huge\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Người ta cho rằng những con chim lớn mang theo những con chim nhỏ trong một số cuộc hành trình vì chúng được coi là không có khả năng đi xuyên đại dương-‘oceans' khổng lồ"}, "39": {"answer_label": "39. recovery", "quote": "The development of bird ringing, by a Danish schoolteacher, Hans Christian Cornelius Mortensen, made many discoveries possible. This is still common practice today and relies upon what is known as ‘recovery’", "explain": "Câu hỏi:\nRinging depended on what is called the ‘\t'\tof\ndead birds\nKey words được paraphrase:\n Giải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Tiếng kêu phụ thuộc vào những gì được gọi là 'sự phục hồi'-‘recovery’ của những con chim chết"}, "40": {"answer_label": "40. atlas", "quote": "Huge amounts of data were gathered in the early part of the twentieth century and for the first time in history people understood where birds actually went to in winter. In 1931, an atlas was published showing where the most common species of European birds migrated to", "explain": "relies - depended\nwhat is called - what is known as\nCâu hỏi:\nIn 1931, the first ... to show the migration of European birds was printed\nKey words được paraphrase:\nwas printed - was established\nmigration of European birds - most common species of European birds migrated to\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Năm 1931, tờ át lát-‘atlas’ đầu tiên cho thấy sự di cư của các loài chim châu Âu đã được in"}}, "script_full": [{"speaker": null, "text": "Scientists believe that a majority of the earth's bird population migrate in some fashion or other.", "qids": []}, {"speaker": null, "text": "Some travel seasonally for relatively short distances, such as birds that move from their winter habitats in lowlands to mountain tops for the summers.", "qids": []}, {"speaker": null, "text": "Others, like the Arctic Tern, travel more than 25,000 miles seasonally between the northern an correct observations.", "qids": ["33"], "time_seconds": 204}, {"speaker": null, "text": "The most bizarre theory was put forward by an English amateur scientist, Charles Morton, in the seventeenth century.", "qids": []}, {"speaker": null, "text": "He wrote a surprisingly well-regarded paper claiming that birds migrate to the moon and back every year.", "qids": ["34"], "time_seconds": 227}, {"speaker": null, "text": "He came to this conclusion as the only logical explanation for the total disappearance of some species.", "qids": []}, {"speaker": null, "text": "One of the key moments in the development of migration theory came in 1822 when a white stork was shot in Germany.", "qids": []}, {"speaker": null, "text": "This particular stork made history because of the long spear in its neck which incredibly had not killed it - everyone immediately realised this spear was definitely not European.", "qids": ["35"], "time_seconds": 258}, {"speaker": null, "text": "It turned out to be a spear from a tribe in Central Africa.", "qids": []}, {"speaker": null, "text": "This was a truly defining moment in the history of ornithology because it was the first evidence that storks spend their winters in sub-Saharan Africa.", "qids": ["36"], "time_seconds": 277}, {"speaker": null, "text": "You can still see the 'arrow stork' in the Zoological Collection of the University of Rostock in Germany.", "qids": []}, {"speaker": null, "text": "People gradually became aware that European birds moved south in autumn and north in summer but didn't know much about it until the practice of catching birds and putting rings on their legs became established.", "qids": []}, {"speaker": null, "text": "Before this, very little information was available about the actual destinations of particular species and how they travelled there.", "qids": ["37"], "time_seconds": 313}, {"speaker": null, "text": "People speculated that larger birds provided a kind of taxi service for smaller birds by carrying them on their backs.", "qids": []}, {"speaker": null, "text": "This idea came about because it seemed impossible that small birds weighing only a few grams could fly over vast oceans.", "qids": ["38"], "time_seconds": 330}, {"speaker": null, "text": "This idea was supported by observations of bird behaviour such as the harassment of larger birds by smaller birds.", "qids": []}, {"speaker": null, "text": "The development of bird ringing, by a Danish schoolteacher, Hans Christian Cornelius Mortensen, made many discoveries possible.", "qids": []}, {"speaker": null, "text": "This is still common practice today and relies upon what is known as 'recovery' - this is when ringed birds are found dead in the place they have migrated to, and identified.", "qids": ["39"], "time_seconds": 365}, {"speaker": null, "text": "Huge amounts of data were gathered in the early part of the twentieth century and for the first time in history people understood where birds actually went to in winter.", "qids": []}, {"speaker": null, "text": "In 1931, an atlas was published showing where the most common species of European birds migrated to.", "qids": ["40"], "time_seconds": 376}, {"speaker": null, "text": "More recent theories about bird migration...", "qids": []}]}]};
