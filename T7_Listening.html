<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test 7 &ndash; IELTS Listening Practice</title>
<style>
:root{
  --bg:#eef1f7; --panel:#ffffff; --ink:#1b2540; --muted:#66708a; --line:#e3e7f0;
  --navy:#122a52; --navy-2:#1c3f74; --brand:#1c3f74; --brand-ink:#ffffff;
  --good:#128a4e; --bad:#d64545; --good-bg:#e9f9f1; --bad-bg:#fdecec;
  --accent-bg:#eef2fb; --gold:#c9a24b; --radius:14px;
  --shadow:0 1px 3px rgba(18,42,82,.06), 0 10px 24px -14px rgba(18,42,82,.18);
}
*{box-sizing:border-box;}
body{margin:0;background:linear-gradient(180deg,#e7ebf5 0%,#eef1f7 320px);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.wrap{max-width:940px;margin:0 auto;padding:28px 16px 80px;}
header.top{padding:6px 4px 22px;text-align:center;}
header.top .kicker{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.14em;color:var(--gold);background:var(--navy);padding:5px 14px;border-radius:999px;margin-bottom:14px;}
header.top h1{font-size:26px;margin:0 0 8px;letter-spacing:.01em;color:var(--navy);font-weight:800;}
header.top p{margin:0;color:var(--muted);font-size:13.5px;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:22px 0;position:sticky;top:10px;z-index:5;}
.tab-btn{border:1px solid var(--line);background:var(--panel);color:var(--navy);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;box-shadow:var(--shadow);}
.tab-btn:hover{border-color:var(--navy-2);}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.tab-btn .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin-right:7px;vertical-align:middle;}
.tab-btn.done .dot{background:var(--gold);}
.part{display:none;}
.part.active{display:block;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:0 0 22px;margin-bottom:20px;box-shadow:var(--shadow);overflow:hidden;}
.part-bar{background:linear-gradient(90deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:15px 24px;font-weight:800;font-size:15.5px;letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.part-bar .title{font-weight:600;opacity:.92;font-size:13.5px;}
.card-body{padding:20px 24px 0;}
.card .instructions{color:var(--muted);font-size:13.5px;margin-bottom:14px;font-style:italic;}
.audio-box{display:flex;align-items:center;gap:12px;background:var(--accent-bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:4px 0 16px;}
.audio-box .icon{font-size:18px;}
.audio-box .label{font-size:12.5px;font-weight:700;color:var(--navy);white-space:nowrap;}
audio{width:100%;height:36px;}
.qgroup{margin:18px 0;}
.qgroup .header-note{font-size:12.5px;color:var(--navy-2);font-weight:800;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em;}
.qgroup .prompt{font-weight:600;margin-bottom:8px;}
.opt-list{display:flex;flex-direction:column;gap:6px;margin-bottom:2px;}
.opt{display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border-radius:9px;border:1px solid var(--line);cursor:pointer;}
.opt:hover{background:var(--accent-bg);border-color:var(--navy-2);}
.opt input{margin-top:3px;}
.opt.correct{background:var(--good-bg);border-color:var(--good);}
.opt.incorrect{background:var(--bad-bg);border-color:var(--bad);}
.opt:has(input:disabled){opacity:.45;cursor:not-allowed;}
.opt input:disabled{cursor:not-allowed;}
.notes-block{white-space:pre-wrap;line-height:2.2;}
.notes-block .subhead{display:block;font-weight:800;margin:16px 0 4px;color:var(--navy);font-size:14.5px;}
.notes-block .bullet{display:block;margin-left:14px;}
.blank{display:inline-block;border:none;border-bottom:2px solid var(--navy-2);background:var(--accent-bg);border-radius:5px 5px 0 0;padding:3px 8px;font:inherit;font-weight:700;min-width:120px;text-align:center;color:var(--ink);}
.blank:focus{outline:none;background:#e4eaf9;}
.blank.correct{border-color:var(--good);background:var(--good-bg);}
.blank.incorrect{border-color:var(--bad);background:var(--bad-bg);}
.blank-num{font-size:11px;color:var(--gold);font-weight:800;vertical-align:super;margin-right:2px;}
.actions{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap;}
button.primary{background:var(--navy);color:#fff;border:none;padding:12px 24px;border-radius:9px;font-size:14.5px;font-weight:700;cursor:pointer;box-shadow:0 6px 14px -6px rgba(18,42,82,.5);}
button.primary:hover{background:var(--navy-2);}
button.ghost{background:#fff;border:1px solid var(--line);color:var(--navy);padding:11px 18px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;}
button.ghost:hover{border-color:var(--navy-2);color:var(--navy-2);}
.score-pill{font-weight:800;padding:9px 18px;border-radius:999px;background:var(--navy);color:#fff;font-size:14px;}
.toggle-section{display:none;margin-top:16px;border-top:1px dashed var(--line);padding-top:16px;}
.toggle-section.open{display:block;}
.script-text{font-size:14.5px;background:#f7f8fc;border:1px solid var(--line);border-radius:10px;padding:14px 16px;max-height:560px;overflow-y:auto;}
.script-line{margin:0 0 10px;line-height:1.65;}
.script-line .spk{font-weight:800;color:var(--navy);margin-right:4px;}
.script-line mark.hl{background:#fdf1d0;border-radius:4px;padding:1px 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
.script-line .qtag{display:inline-block;font-weight:800;color:var(--navy);font-size:11px;background:#e8edf8;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle;}
.jump-btn{display:inline-block;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:700;color:#fff;background:var(--navy-2);border:none;border-radius:6px;padding:3px 8px;margin-right:8px;cursor:pointer;vertical-align:middle;}
.jump-btn:hover{background:var(--navy);}
.expl-item{border-top:1px solid var(--line);padding:14px 0;}
.expl-item:first-child{border-top:none;}
.expl-item .eq-head{display:flex;gap:10px;align-items:center;margin-bottom:6px;}
.expl-item .qnum{background:var(--navy);color:#fff;font-weight:800;font-size:12px;border-radius:6px;padding:3px 9px;}
.expl-item .ans{font-weight:800;color:var(--good);}
.expl-item .quote{font-style:italic;color:var(--muted);font-size:13.5px;margin:4px 0 6px;white-space:pre-wrap;}
.expl-item .explain{font-size:14px;white-space:pre-wrap;}
.example-line{color:var(--muted);font-style:italic;}
.script-note{font-size:12.5px;color:var(--muted);margin:0 0 10px;}
footer.credit{color:var(--muted);font-size:12px;text-align:center;margin-top:26px;}
.box-panel{background:var(--accent-bg);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px;}
.box-panel .box-title{font-weight:800;color:var(--navy);margin-bottom:8px;font-size:13.5px;}
.box-panel .box-item{display:flex;gap:8px;margin:4px 0;font-size:14px;}
.box-panel .box-item b{color:var(--navy-2);min-width:18px;}
.map-img{max-width:100%;border-radius:10px;border:1px solid var(--line);margin-bottom:14px;display:block;}
.stem-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);}
.stem-row:last-child{border-bottom:none;}
.stem-row .stem-text{flex:1;}
.stem-row select{padding:7px 10px;border-radius:8px;border:1px solid var(--line);font:inherit;font-weight:700;min-width:70px;background:#fff;}
.stem-row select.correct{border-color:var(--good);background:var(--good-bg);}
.stem-row select.incorrect{border-color:var(--bad);background:var(--bad-bg);}
@media(max-width:520px){.wrap{padding:18px 10px 60px;}.card-body{padding:16px 16px 0;}.part-bar{padding:13px 16px;}}
</style>
</head>

<div class="wrap">

<script>
const TEST_DATA = {"test": "Test 7", "parts": [{"part": 1, "kind": "notes", "title": "Customer Satisfaction Survey", "instructions": null, "audio": "audio/test7/part1.mp3", "answers": {"1": "journalist", "2": "shopping", "3": "Staunfirth", "4": "return", "5": "23.70", "6": "online", "7": "delay", "8": "information", "9": "platform(s)", "10": "parking"}, "explanations": {"1": {"answer_label": "1. journalist", "quote": "MAN: Thank you. And would you mind telling me what you do? \nSOPHIE: I'm a journalist", "explain": "Câu hỏi: \nCustomer details \nName: Sophie Bird \nOccupation: 1. ......................... \nKeywords được paraphrase: \nCâu hỏi yêu cầu ta điền thông tin nghề nghiệp - “Occupation” của cô “Sophie Bird”. \nGiải thích đáp án: \nKhi người đàn ông hỏi cô Sophie “Would you mind telling me what you do?” (Bạn có phiền nói cho tôi nghe bạn làm gì không?). Cô ấy trả lời “I’m a journalist” (Tôi là nhà báo). Vì vậy, đáp án là “journalist”."}, "2": {"answer_label": "2. shopping", "quote": "MAN: So was the reason for your visit here today work? \nSOPHIE: Actually, it's my day off. I came here to do some shopping.", "explain": "Câu hỏi: \nReason for travel today: 2. ............................. \nKeywords được paraphrase: \nChú ý từ khóa “reason” (lý do), từ khóa này giúp ta xác định vị trí cần tập trung nghe trong bài. “Travel” (du lịch) cũng được paraphrase thành “visit” trong bài nghe. \nGiải thích đáp án: \nTrong bài, người đàn ông bắt đầu bằng một câu hỏi Yes/No “Was the reason for your visit here today work?” (Có phải lý do bà đến đây hôm nay là vì công việc không?). Ta không nghe xác nhận từ phía cô Sophie mà nghe được “Actually, … I came here to do some shopping” (thực ra…, tôi đến đây để mua sắm một chút). Như vậy, “shopping” là đáp án."}, "3": {"answer_label": "3. Staunfirth", "quote": "MAN: Right, so can you tell me which station you're travelling back to? \nSOPHIE: Staunfirth, where I live. \nMAN: Can I just check the spelling? S-T-A-U-N-F-I-R-T-H?", "explain": "Câu hỏi: \nJourney information \nName of station returning to: 3. .................. \nKeywords được paraphrase: \nCâu hỏi yêu câu ta điền tên của trạm - “Name of station”. Ngoài ra, ta có thể thấy “returning to” (trở về) được paraphrase thành “travelling back” có nghĩa tương tự trong bài nghe. \nGiải thích đáp án: \nTrong bài nghe, câu hỏi này bắt đầu khi người đàn ông hỏi “Which station…” (Trạm nào). Sau đó cô Sophie nói tên và người đàn ông đánh vần lại."}, "4": {"answer_label": "4. return", "quote": "MAN: OK, good. Next, can I ask what kind of ticket you bought? I assume it wasn't a season ticket, as you don't travel every day. \nSOPHIE: That's right. No, I just got a normal return ticket. I don't have a rail card so I didn't", "explain": "Câu hỏi: \nType of ticket purchased: standard 4. .................... ticket \nKeywords được paraphrase: \n“Type of ticket purchased” (Loại vé đã mua) được paraphrase lại trong câu hỏi của người đàn ông “What kind of ticket you bought?” (Bạn đã mua loại vé nào). Ta cũng có thể thấy “standard” (tiêu chuẩn) được thay bằng “normal” (bình thường) trong bài \nGiải thích đáp án: \nSau khi được người đàn ông hỏi về loại vé mà mình mua, cô Sophie trả lời “I just got a normal return ticket” (tôi đã mua một tấm vé quay về bình thường). “got something” có ý nghĩa tương đồng với “buy something” vì vậy đáp án là “return” (quay về)"}, "5": {"answer_label": "5. 23.70", "quote": "MAN: Yes — you'd have saved 20% on your ticket today. So you paid the full price for your ticket? \nSOPHIE: I paid £23.70.", "explain": "Câu hỏi: \nCost of ticket: 5. £……………………………… \nKeywords được paraphrase: \nCâu hỏi yêu cầu ta nghe thông tin về giá vé “Cost of ticket”. Từ Khóa “Cost” được thay bằng “price” trong câu hỏi của người đàn ông. \nGiải thích đáp án: \nTrong bài, ta nghe người đàn ông hỏi “So you paid the full price for your ticket?” (Vậy bạn đã trả đúng giá cho vé của bạn à?). Sau đó người phụ nữ trả lời “I paid 23.70 pounds” (tôi đã trả 23.70 pounds). Như vậy 23.70 là đáp án cần điền."}, "23": {"answer_label": "5. 23.70", "quote": "MAN: Yes — you'd have saved 20% on your ticket today. So you paid the full price for your ticket? \nSOPHIE: I paid £23.70.", "explain": "Câu hỏi: \nCost of ticket: 5. £……………………………… \nKeywords được paraphrase: \nCâu hỏi yêu cầu ta nghe thông tin về giá vé “Cost of ticket”. Từ Khóa “Cost” được thay bằng “price” trong câu hỏi của người đàn ông. \nGiải thích đáp án: \nTrong bài, ta nghe người đàn ông hỏi “So you paid the full price for your ticket?” (Vậy bạn đã trả đúng giá cho vé của bạn à?). Sau đó người phụ nữ trả lời “I paid 23.70 pounds” (tôi đã trả 23.70 pounds). Như vậy 23.70 là đáp án cần điền."}, "70": {"answer_label": "5. 23.70", "quote": "MAN: Yes — you'd have saved 20% on your ticket today. So you paid the full price for your ticket? \nSOPHIE: I paid £23.70.", "explain": "Câu hỏi: \nCost of ticket: 5. £……………………………… \nKeywords được paraphrase: \nCâu hỏi yêu cầu ta nghe thông tin về giá vé “Cost of ticket”. Từ Khóa “Cost” được thay bằng “price” trong câu hỏi của người đàn ông. \nGiải thích đáp án: \nTrong bài, ta nghe người đàn ông hỏi “So you paid the full price for your ticket?” (Vậy bạn đã trả đúng giá cho vé của bạn à?). Sau đó người phụ nữ trả lời “I paid 23.70 pounds” (tôi đã trả 23.70 pounds). Như vậy 23.70 là đáp án cần điền."}, "6": {"answer_label": "6. online", "quote": "MAN: Right. And do you usually buy your tickets at the station? \nSOPHIE: Well, I do usually but the ticket office closes early and I hate using ticket machines. I think ticket offices should be open for longer hours. There's always a queue for the machines and they're often out of order. \nMAN: A lot of customers are saying the same thing. \nSOPHIE: So to answer your question ... I got an e-ticket online.", "explain": "Câu hỏi: \nWhere ticket was bought: 6. ………………….. \nKeywords được paraphrase: \nCâu hỏi yêu cầu ta nghe thông tin về nơi mà vé đã được mua “Where ticket was bought” \nGiải thích đáp án: \nTrong bài, đoạn thông tin liên quan đến câu hỏi bắt đầu khi người đàn ông hỏi “Do you usually buy your tickets at the station?” (Bạn có thường xuyên mua vé ở trạm chứ?). Người phụ nữ trả lời “I do usually but…” (tôi thường xuyên mua ở đó nhưng …”. Như vậy “station” không phải là đáp án. Ngoài ra ta cũng nghe người phụ nữ nói “I hate using ticket machines” (Tôi ghét sử dụng máy bán vé). Như vậy, “ticket machines” (máy bán vé) cũng không phải là đáp án. Sau cùng cô ấy nói “I got a e-ticket online” (Tôi đã mua 1 vé online). Như vậy Sophie đã mua vé online cho chuyến đi hiện tại, “online” là đáp án cần điền."}, "7": {"answer_label": "7. delay", "quote": "MAN: And, is there anything you weren't satisfied with? \nSOPHIE: Well, normally. the trains run on time and are pretty reliable but today there was a delay; the train was about 15 minutes behind schedule.", "explain": "Câu hỏi: \nSatisfaction with journey\nMost satisfied with: the wifi \nLeast satisfied with: the 7. ……………... this morning. \nKeywords được paraphrase: \nTừ khóa “Least satisfied” (ít hài lòng nhất) được paraphrase thành “weren’t satisfied” (không hài lòng) trong câu hỏi của người đàn ông. \nGiải thích đáp án: \nTrong bài, ta nghe người đàn ông hỏi “Is there anything you weren’t satisfied with?” (Có gì mà bạn cảm thấy không hài lòng không?). Sophie đã trả lời “Normally, the trains run on time ……but today there was a delay” (Bình thường những chuyến tàu luôn chạy đúng giờ……nhưng hôm nay, đã có một sự chậm trễ). Chỗ cần điền phải là danh từ vì sau “the”, nên ở đây đáp án là “delay”."}, "8": {"answer_label": "8. information", "quote": "SOPHIE: You've probably noticed that the whole station's been upgraded. What are you most satisfied with? I think the best thing is that they've improved the amount of information about train times etc. that's given to passengers — it's much clearer — before there was", "explain": "Câu hỏi: \nSatisfaction with station facilities \nMost satisfied with: how much 8. …………….. was provided \nKeywords được paraphrase: \nTừ khóa “most satisfied with” (hài lòng nhất về) giúp xác định vị trí câu hỏi trong bài nghe qua câu hỏi của người đàn ông. Ngoài ra, ta có thể thấy “how much” cũng được paraphrase thành “the amount of” trong bài nghe. \nGiải thích đáp án: \nCâu hỏi yêu cầu ta điền một danh từ không đếm được - một lượng gì đó được cung cấp. Sau khi người đàn ông hỏi người phụ nữ “What are you most satisfied with?” (Bạn hài lòng nhất về điều gì). Sophie đáp “I think the best thing is that they’ve improved the amount of information about train times …” (Tôi nghĩ điều tốt nhất là họ đã cải thiện lượng thông tin về thời gian của các chuyến tàu). Cụm từ “the amount of..” (lượng…) đồng nghĩa với “how much” trên câu hỏi, vì vậy đáp án là “information”."}, "9": {"answer_label": "9. Platform(s)", "quote": "MAN: That's good. And is there anything you're not satisfied with? \nSOPHIE: Let's see ... I think things have generally improved a lot. The trains are much more modem and I like the new café. But one thing is that there aren't enough places to sit down, especially on the platfoms.", "explain": "Câu hỏi: \nLeast satisfied with: lack of seats, particularly on the 9. ……………………….. \nKeywords được paraphrase: \n“Least satisfied” được paraphrase thành “not satisfied” trong câu hỏi của người đàn ông, đây là câu hỏi giúp ta xác định vị trí của câu hỏi trong bài nghe. Ngoài ra, ta cũng thấy “lack of” (thiếu) được thay bằng “not enough” (không đủ); “seats” (chỗ ngồi) được thay bằng “places to sit down” và “particularly” (nhất là) được thay bằng một từ đồng nghĩa là “especially” trong bài nghe. \nGiải thích đáp án: \nCâu hỏi yêu cầu ta nghe thông tin về một vị trí mà làm điển hình cho việc thiếu chỗ ngồi. Khi người đàn ông hỏi Sophie có không hài lòng vì điều gì không, cô ấy trả lời “There aren’t enough places to sit down, especially on the platform” (Không có đủ chỗ để ngồi, nhất là trên sân ga). Như vậy “platform” (sân ga) là đáp án."}, "10": {"answer_label": "10. parking", "quote": "MAN: What about the parking at the station? \nSOPHIE: Well to be honest, I don't really have an opinion as I never use it. \nMAN: So, neither satisfied nor dissatisfied for that then.", "explain": "Câu hỏi: \nNeither satisfied nor dissatisfied with: the 10. ……………. available \nGiải thích đáp án: \nKhi người đàn ông hỏi về việc đỗ xe ở trạm “What about parking at the station”. Sophie trả lời “I don’t really have an opinion” (Tôi không có ý kiến) và người đàn ông đáp lại “So neither satisfied nor dissatisfied for that then” (Vậy thì tôi sẽ cho nó vô mục không có ý kiến hài lòng cũng không có ý kiến không hài lòng). Như vậy “parking” là đáp án."}}, "script_full": [{"speaker": "MAN", "text": "Hello. Do you mind if I ask you some questions about your journey today? We're doing a customer satisfaction survey.", "qids": []}, {"speaker": "SOPHIE", "text": "Yes. OK. I've got about ten minutes before my train home leaves. I'm on a day trip.", "qids": []}, {"speaker": "MAN", "text": "Great. Thank you. So first of all, could you tell me your name?", "qids": []}, {"speaker": "SOPHIE", "text": "It's Sophie Bird.", "qids": []}, {"speaker": "MAN", "text": "Thank you. And would you mind telling me what you do?", "qids": []}, {"speaker": "SOPHIE", "text": "I'm a journalist.", "qids": ["1"]}, {"speaker": "MAN", "text": "Oh really? That must be interesting.", "qids": []}, {"speaker": "SOPHIE", "text": "Yes. It is.", "qids": []}, {"speaker": "MAN", "text": "So was the reason for your visit here today work?", "qids": []}, {"speaker": "SOPHIE", "text": "Actually, it's my day off. I came here to do some shopping.", "qids": ["2"]}, {"speaker": "MAN", "text": "Oh right.", "qids": []}, {"speaker": "SOPHIE", "text": "But I do sometimes come here for work.", "qids": []}, {"speaker": "MAN", "text": "OK. Now I'd like to ask some questions about your journey today, if that's OK.", "qids": []}, {"speaker": "SOPHIE", "text": "Yes. No problem.", "qids": []}, {"speaker": "MAN", "text": "Right, so can you tell me which station you're travelling back to?", "qids": []}, {"speaker": "SOPHIE", "text": "Staunfirth, where I live.", "qids": ["3"]}, {"speaker": "MAN", "text": "Can I just check the spelling? S-T-A-U-N-F-I-R-T-H?", "qids": []}, {"speaker": "SOPHIE", "text": "That's right.", "qids": []}, {"speaker": "MAN", "text": "And you travelled from there this morning?", "qids": []}, {"speaker": "SOPHIE", "text": "Yes.", "qids": []}, {"speaker": "MAN", "text": "OK, good. Next, can I ask what kind of ticket you bought? I assume it wasn't a season ticket, as you don't travel every day.", "qids": []}, {"speaker": "SOPHIE", "text": "That's right. No, I just got a normal return ticket. I don't have a rail card so I didn't get any discount. I keep meaning to get one because it's a lot cheaper.", "qids": ["4"]}, {"speaker": "MAN", "text": "Yes-you'd have saved 20% on your ticket today. So you paid the full price for your ticket?", "qids": []}, {"speaker": "SOPHIE", "text": "I paid £23.70.", "qids": ["5"]}, {"speaker": "MAN", "text": "OK. Do you think that's good value for money?", "qids": []}, {"speaker": "SOPHIE", "text": "Not really. I think it's too much for a journey that only takes 45 minutes.", "qids": []}, {"speaker": "MAN", "text": "Yes, that's one of the main complaints we get. So, you didn't buy your ticket in advance?", "qids": []}, {"speaker": "SOPHIE", "text": "No. I know it's cheaper if you buy a week in advance but I didn't know I was coming then.", "qids": []}, {"speaker": "MAN", "text": "I know. You can't always plan ahead. So, did you buy it this morning?", "qids": []}, {"speaker": "SOPHIE", "text": "No, it was yesterday.", "qids": []}, {"speaker": "MAN", "text": "Right. And do you usually buy your tickets at the station?", "qids": []}, {"speaker": "SOPHIE", "text": "Well, I do usually but the ticket office closes early and I hate using ticket machines. I think ticket offices should be open for longer hours. There's always a queue for the machines and they're often out of order.", "qids": []}, {"speaker": "MAN", "text": "A lot of customers are saying the same thing.", "qids": []}, {"speaker": "SOPHIE", "text": "So to answer your question... I got an e-ticket online.", "qids": ["6"]}, {"speaker": "MAN", "text": "OK. Thank you. Now I'd like to ask you about your satisfaction with your journey. So what would you say you were most satisfied with today?", "qids": []}, {"speaker": "SOPHIE", "text": "Well, I like the wifi on the train. It's improved a lot. It makes it easier for me to work if I want to.", "qids": ["7"]}, {"speaker": "MAN", "text": "That's the first time today anyone's mentioned that. It's good to get some positive feedback on that.", "qids": []}, {"speaker": "SOPHIE", "text": "Mmm.", "qids": []}, {"speaker": "MAN", "text": "And, is there anything you weren't satisfied with?", "qids": []}, {"speaker": "SOPHIE", "text": "Well, normally, the trains run on time and are pretty reliable but today there was a delay; the train was about 15 minutes behind schedule.", "qids": []}, {"speaker": "MAN", "text": "OK. I'll put that down. Now I'd also like to ask about the facilities at this station. You've probably noticed that the whole station's been upgraded. What are you most satisfied with?", "qids": []}, {"speaker": "SOPHIE", "text": "I think the best thing is that they've improved the amount of information about train times etc. that's given to passengers - it's much clearer - before there was only one board and I couldn't always see it properly - which was frustrating.", "qids": ["8"]}, {"speaker": "MAN", "text": "That's good. And is there anything you're not satisfied with?", "qids": []}, {"speaker": "SOPHIE", "text": "Let's see ... I think things have generally improved a lot. The trains are much more modern and I like the new café. But one thing is that there aren't enough places to sit down, especially on the platforms.", "qids": ["9"]}, {"speaker": "MAN", "text": "OK-so I'll put 'seating' down, shall I, as the thing you're least satisfied with?", "qids": []}, {"speaker": "SOPHIE", "text": "Yes. OK.", "qids": ["10"]}, {"speaker": "MAN", "text": "Can I ask your opinion about some of the other facilities? We'd like feedback on whether people are satisfied, dissatisfied or neither satisfied nor dissatisfied.", "qids": []}, {"speaker": "SOPHIE", "text": "OK.", "qids": []}, {"speaker": "MAN", "text": "What about the parking at the station?", "qids": []}, {"speaker": "SOPHIE", "text": "Well to be honest, I don't really have an opinion as I never use it.", "qids": ["11"]}, {"speaker": "MAN", "text": "So, neither satisfied nor dissatisfied for that then.", "qids": []}, {"speaker": "SOPHIE", "text": "Yes, I suppose so ...", "qids": []}, {"speaker": "MAN", "text": "OK, and what about ...?", "qids": []}], "notes": ["Customer Satisfaction Survey", "Customer Satisfaction Survey", "Customer Satisfaction Survey", "Customer details", "Name:", "Sophie Bird", "Occupation:", "{{1}}", "Reason for travel today:", "{{2}}", "Journey information", "Name of station returning to:", "{{3}}", "Type of ticket purchased:", "standard {{4}}", "ticket", "Cost of ticket:", "{{5}}", "When ticket was purchased:", "yesterday", "Where ticket was bought:", "{{6}}", "Satisfaction with journey", "Most satisfied with:", "the wifi", "Least satisfied with:", "the {{7}}", "this morning", "Satisfaction with station facilities", "Most satisfied with:", "how much {{8}}", "provided", "was", "Least satisfied with:", "lack of seats, particularly on the", "{{9}}", "lack of seats, particularly on the", "{{9}}", "Neither satisfied nor dissatisfied with:", "the {{10}}", "available"]}, {"part": 2, "kind": "mcq", "title": "Local Council Report on Traffic and Highways", "instructions": null, "audio": "audio/test7/part2.mp3", "answers": {"11": "C", "12": "A", "13": "B", "14": "B", "15": "C", "16": "F", "17": "A", "18": "I", "19": "E", "20": "H"}, "explanations": {"11": {"answer_label": "11. C", "quote": "... People were generally satisfied with the state of the roads. ... a significant number of people complained about the increasing number of heavy vehicles using our local roads to avoid traffic elsewhere. We’d expected more complaints by commuters about the reduction in the train service, but it doesn’t seem to have affected people too much.", "explain": "Câu hỏi:\n11. A survey found people’s main concern about traffic in the area was\nA cuts to public transport. B poor maintenance of roads.\nC changes in the type of traffic.\nGiải thích đáp án:\nĐoạn bên chỉ ra rằng mọi người nói chung hài lòng với tình trạng của các con đường (không có sự lo ngoại về việc bảo trì đường sá kém nên ta loại lựa chọn B).\nMột số lượng đáng kể người dân phàn nàn về việc ngày càng có nhiều xe hạng nặng sử dụng đường địa phương của chúng tôi để tránh giao thông ở nơi khác (có thể thấy được mọi người lo ngại về sự thay đổi loại phương tiện, ở đây là các loại xe hạng nặng, vì vậy lựa chọn C là đáp án đúng).\nHọ dự kiến sẽ có thêm nhiều lời phàn nàn của hành khách về việc giảm dịch vụ xe lửa, nhưng dường như điều này không ảnh hưởng quá nhiều đến mọi người (không có sự lo ngại về việc cắt giảm phương tiện công cộng nên ta loại lựa chọn A)."}, "12": {"answer_label": "12. A", "quote": "The cycle path that runs alongside the river is very well used by both cyclists and pedestrians since the surface was improved last year, but overtaking can be a problem so we're going to add a bit on the side to make it wider.", "explain": "Câu hỏi:\n12. Which change will shortly be made to the cycle path next to the river?\nA\tIt will\tbe\twidened.\nB\tIt will\tbe\textended.\nC\tIt will\tbe\tresurfaced.\nGiải thích đáp án:\nĐoạn bên chỉ ra rằng đường dành cho xe đạp chạy dọc theo sông được cả người đi xe đạp và người đi bộ sử dụng rất tốt kể từ khi bề mặt được cải thiện vào năm ngoái, nhưng việc vượt làn có thể là một vấn đề, vì vậy họ sẽ thêm một chút ở bên cạnh để làm cho nó rộng hơn.\nCó thể thấy đường dành cho xe đạp chạy được làm rộng ra. Vì vậy lựa chọn A là đáp án đúng."}, "13": {"answer_label": "13. B", "quote": "The plans to have a pedestrian crossing next to the Post Office have unfortunately had to be put on hold for the time being. We'd budgeted for this to be done this financial year, but then there were rumours that the Post Office was going to move, which would have meant there wasn't really a need for a crossing. Now they've confirmed that they're staying where they are, but the Highways Department have told us that it would be dangerous to have a pedestrian crossing where we'd originally planned it as there's a bend in the road there.", "explain": "Câu hỏi:\n13. Plans for a pedestrian crossing have been postponed because\nA the Post Office has moved.\nB the proposed location is unsafe. C funding is not available at present.\nKeywords được paraphrase: postponed - put on hold unsafe - dangerous\nGiải thích đáp án:\nĐoạn bên chỉ ra rằng kế hoạch có một vạch sang đường cho người đi bộ bên cạnh Bưu điện rất tiếc đã phải tạm dừng trong thời điểm hiện tại. Họ đã lập ngân sách cho việc này để thực hiện trong năm tài chính này (ta có thể loại lựa chọn C khi chỉ ra rằng hiện không có kinh phí)\nNhưng sau đó có tin đồn rằng Bưu điện sẽ chuyển đi, điều đó có nghĩa là không thực sự cần thiết phải có một đoạn đường khác. Bây giờ họ đã xác nhận rằng họ đang ở đúng vị trí của họ (ta có thể loại lựa chọn A khi chỉ ra rằng Bưu điện đã dời đi)\nNhưng Highways Department đã thông báo với rằng sẽ rất nguy hiểm nếu có vạch sang đường dành cho người đi bộ ở nơi dự kiến ban đầu vì đường ở đó có một khúc cua (có thể thấy rằng vị trí được đề xuất là không an toàn, vì vậy lựa chọn B là đáp án đúng)."}, "14": {"answer_label": "14. B", "quote": "On Station Road near the station and level crossing, drivers can face quite long waits if the level crossing's closed, and we've now got signs up requesting them not to leave their engines running at that time.", "explain": "Câu hỏi:\n14. On Station Road, notices have been erected \nA telling cyclists not to leave their bikes outside the station ticket office.\nB asking motorists to switch off engines when waiting at the level crossing.\nC warning pedestrians to leave enough time when crossing the railway line.\nKeywords được paraphrase:\nswitch off engines - not to leave engines running\nGiải thích đáp án:\nCâu bên chỉ ra rằng trên Station Road gần nhà ga và đường cắt ngang, người lái xe có thể phải chờ đợi khá lâu nếu đường ngang đóng cửa và hiện đã có biển báo yêu cầu họ không để động cơ đang hoạt động tại thời điểm đó.\nCó thể thấy rằng trên Station Road, biển báo được dựng lên yêu cầu người điều khiển phương tiện không để động cơ hoạt động hay nói cách khác là tắt động cơ khi dừng chờ ở đường ngang. Vì vậy lựa chọn B là đáp án đúng."}, "15": {"answer_label": "15. C", "quote": "At present, cars can park between the Community Hall and that line of trees to the east, but this is quite dangerous for pedestrians, so we're suggesting a new car park on the opposite side of the Community Hall, right next to it.", "explain": "Câu hỏi:\n\n15 New car park \t\nGiải thích đáp án:\nĐoạn bên chỉ ra rằng hiện tại, ô tô có thể đỗ ở giữa Community Hall và hàng cây ở phía đôn, nhưng điều này khá nguy hiểm cho người đi bộ, vì vậy họ đề xuất một bãi đỗ xe mới ở phía đối diện của Community Hall, ngay bên cạnh nó. Từ những sự chỉ dẫn này ta có thể xác định được C là vị trí của bãi đỗ xe mới."}, "16": {"answer_label": "16. F", "quote": "We also have a new location for the cricket pitch. As we've now purchased additional space to the east of the recreation ground, beyond the trees, we plan to move it away from its current location, which is rather near the road, into this new area beyond the line of trees.", "explain": "Câu hỏi:\n\n16 New cricket pitch \t\nGiải thích đáp án:\nĐoạn bên chỉ ra rằng vì hiện tại họ đã mua thêm không gian ở phía đông của khu giải trí, phía ngoài hàng cây, chúng tôi họ dự định di chuyển sân cricket ra khỏi vị trí hiện tại, thay vì khá gần đường chính, thì chuyển vào khu vực mới này ở phía ngoài hàng cây. Từ những sự chỉ dẫn này ta có thể xác định được F là vị trí của sân cricket mới."}, "17": {"answer_label": "17. A", "quote": "We've got plans for a children's playground which will be accessible by a footpath from the Community Hall and will be alongside the river. We'd originally thought of having it close to the road, but we think this will be a more attractive location.", "explain": "Câu hỏi:\n\n17 Children's playground \nGiải thích đáp án:\nĐoạn bên chỉ ra rằng họ đã có kế hoạch cho một sân chơi dành cho trẻ em, có thể đến được sân chơi này bằng một lối đi bộ từ Community Hall và nó sẽ nằm dọc theo dòng sông. Ban đầu họ nghĩ sẽ đặt nó gần đường, nhưng họ nghĩ rằng đây sẽ là một vị trí hấp dẫn hơn. Từ những sự chỉ dẫn này ta có thể xác định được A là vị trí của sân chơi dành cho trẻ em."}, "18": {"answer_label": "18. I", "quote": "The skateboard ramp is very popular with both younger and older children - we had considered moving this up towards the river, but in the end we decided to have it in the southeast corner near the road.", "explain": "Câu hỏi:\n\n18 Skateboard ramp \t\nGiải thích đáp án:\nCâu bên chỉ ra rằng đoạn dốc trượt ván rất phổ biến với cả trẻ nhỏ và lớn tuổi - họ đã cân nhắc việc chuyển nó lên sông, nhưng cuối cùng chúng tôi quyết định lựa chọn nó ở góc đông nam gần đường. Từ những sự chỉ dẫn này ta có thể xác định được I là vị trí của đoạn dốc trượt ván."}, "19": {"answer_label": "19. E", "quote": "The pavilion is very well used at present by both football players and cricketer. It will stay where it is now - to the left of the line of trees and near to the river...", "explain": "Câu hỏi:\n\n19 Pavilion …….\nGiải thích đáp án:\nCâu bên chỉ ra rằng tạ (pavilion) hiện nay được sử dụng nhiều bởi cả các cầu thủ bóng đá và vận động viên cricket. Nó sẽ giữ nguyên ở vị trí hiện tại - bên trái hàng cây và gần phía sông. T ừ những sự chỉ dẫn này ta có thể thấy được E là vị trí của tạ."}, "20": {"answer_label": "20. H", "quote": "And finally, we'll be getting a new notice board for local information, and that will be directly on people's right as they go from the road into the recreation ground.", "explain": "Câu hỏi:\n\n20 Notice board ………………………\nGiải thích đáp án:\nCâu bên chỉ ra rằng họ sẽ có một bảng thông báo mới cho thông tin địa phương và bảng đó sẽ nằm ngay bên phải của mọi người khi họ đi từ đường vào khu giải trí. Từ những sự chỉ dẫn này ta có thể thấy được H là vị trí của bảng thông báo."}}, "script_full": [{"speaker": "CHAIRPERSON", "text": "Right. Next on the agenda we have traffic and highways. Councillor Thornton.", "qids": []}, {"speaker": null, "text": "Thank you. Well, we now have the results of the survey carried out last month about traffic and road transport in the town. People were generally satisfied with the state of the roads. There were one or two complaints about potholes which will be addressed, but a significant number of people complained about the increasing number of heavy vehicles using our local roads to avoid traffic elsewhere. We'd expected more complaints by commuters about the reduction in the train service, but it doesn't seem to have affected people too much.", "qids": ["11"]}, {"speaker": null, "text": "The cycle path that runs alongside the river is very well used by both cyclists and pedestrians since the surface was improved last year, but overtaking can be a problem so we're going to add a bit on the side to make it wider. At some stage, we'd like to extend the path so that it goes all the way through the town, but that won't be happening in the immediate future.", "qids": ["12"]}, {"speaker": null, "text": "The plans to have a pedestrian crossing next to the Post Office have unfortunately had to be put on hold for the time being. We'd budgeted for this to be done this financial year, but then there were rumours that the Post Office was going to move, which would have meant there wasn't really a need for a crossing. Now they've confirmed that they're staying where they are, but the Highways Department have told us that it would be dangerous to have a pedestrian crossing where we'd originally planned it as there's a bend in the road there. So that'll need some more thought.", "qids": ["13"]}, {"speaker": null, "text": "On Station Road near the station and level crossing, drivers can face quite long waits if the level crossing's closed, and we've now got signs up requesting them not to leave their engines running at that time. This means pedestrians waiting on the pavement to cross the railway line don't have to breathe in car fumes. We've had some problems with cyclists leaving their bikes chained to the railings outside the ticket office, but the station has agreed to provide bike racks there.", "qids": ["14"]}, {"speaker": "CHAIRPERSON", "text": "So next on the agenda is 'Proposals for improvements to the recreation ground'. Councillor Thornton again.", "qids": []}, {"speaker": null, "text": "Well, since we managed to extend the recreation ground, we've spent some time talking to local people about how it could be made a more attractive and useful space. If you have a look at the map up on the screen, you can see the river up in the north, and the Community Hall near the entrance from the road. At present, cars can park between the Community Hall and that line of trees to the east, but this is quite dangerous for pedestrians so we're suggesting a new car park on the opposite side of the Community Hall, right next to it.", "qids": ["15"]}, {"speaker": null, "text": "We also have a new location for the cricket pitch. As we've now purchased additional space to the east of the recreation ground, beyond the trees, we plan to move it away from its current location, which is rather near the road, into this new area beyond the line of trees. This means there's less danger of stray balls hitting cars or pedestrians.", "qids": ["16"]}, {"speaker": null, "text": "We've got plans for a children's playground which will be accessible by a footpath from the Community Hall and will be alongside the river. We'd originally thought of having it close to the road, but we think this will be a more attractive location.", "qids": ["17"]}, {"speaker": null, "text": "The skateboard ramp is very popular with both younger and older children we had considered moving this up towards the river, but in the end we decided to have it in the southeast corner near the road.", "qids": ["18"]}, {"speaker": null, "text": "The pavilion is very well used at present by both football players and cricketers. It will stay where it is now to the left of the line of trees and near to the river - handy for both the football and cricket pitches.", "qids": ["19"]}, {"speaker": null, "text": "And finally, we'll be getting a new notice board for local information, and that will be directly on people's right as they go from the road into the recreation ground.", "qids": ["20"]}], "groups": [{"type": "choice", "qids": ["11"], "prompt": "A survey found people’s main concern about traffic in the area was", "options": {"A": "cuts to public transport.", "B": "poor maintenance of roads.", "C": "changes in the type of traffic."}, "multi": false, "header": "Questions 11-14 Choose the correct letter, A, B or C."}, {"type": "choice", "qids": ["12"], "prompt": "Which change will shortly be made to the cycle path next to the river?", "options": {"A": "It will be widened.", "B": "It will be extended.", "C": "It will be resurfaced."}, "multi": false, "header": null}, {"type": "choice", "qids": ["13"], "prompt": "Plans for a pedestrian crossing have been postponed because", "options": {"A": "the Post Office has moved.", "B": "the proposed location is unsafe.", "C": "funding is not available at present."}, "multi": false, "header": null}, {"type": "choice", "qids": ["14"], "prompt": "On Station Road, notices have been erected", "options": {"A": "telling cyclists not to leave their bikes outside the station ticket office.", "B": "asking motorists to switch off engines when waiting at the level crossing.", "C": "warning pedestrians to leave enough time when crossing the railway line."}, "multi": false, "header": null}, {"type": "matching", "qids": ["15", "16", "17", "18", "19", "20"], "box_title": "Recreation ground after proposed changes", "box": {}, "stems": [{"qid": "15", "prompt": "New car park"}, {"qid": "16", "prompt": "New cricket pitch"}, {"qid": "17", "prompt": "Children’s playground"}, {"qid": "18", "prompt": "Skateboard ramp"}, {"qid": "19", "prompt": "Pavilion"}, {"qid": "20", "prompt": "Notice board"}], "header": "Label the map below. Write the correct letter next to each question.", "image": "_assets/test7_part2_map.jpeg"}]}, {"part": 3, "kind": "mcq", "title": "Development of Sporting Equipment (Thomas & Jeanne)", "instructions": null, "audio": "audio/test7/part3.mp3", "answers": {"21": "C", "22": "E", "23": "A", "24": "D", "25": "B", "26": "F", "27": "A", "28": "D", "29": "C", "30": "G"}, "explanations": {"21": {"answer_label": "21-22.\nE&C", "quote": "JEANNE: Hi Thomas, how are you enjoying the course so far?\nTHOMAS: Yeah, I think it's good.\nJEANNE: Remind me - why did you decide to study sports science? Didn’t you want to be a professional athlete when you were at school?\nTHOMAS: Yeah - that was my goal, and all my classmates assumed I would achieve it; they thought I was brilliant.\nJEANNE: That must have been a nice feeling.\nTHOMAS: Mm, I thought I could win anything. There was no one who could run faster than me.\nJEANNE: Exactly - so what happened? Did your mum and dad want you to be more ‘academic’?\nTHOMAS: Not at all. Perhaps they should have pushed me harder, though.\nJEANNE: What do you mean?\nTHOMAS: I think I should have practised more.\nJEANNE: What makes you say that?\nTHOMAS: Well, I went out to Kenya for a couple of weeks to train ...\nJEANNE: Really! I didn't know that.\nTHOMAS: I was chosen to go there out of loads of kids and run with some of the top teenage athletes in the world. And ... I was so calm about it. I just kept thinking how fortunate I was. What a great chance this was! Everyone back home was so proud of me. But once we started competing, I very quickly realised I wasn't good enough.\nJEANNE: That must have been a huge shock.\nTHOMAS: I thought ‘this can't be happening'! I was used to winning.\nJEANNE: I’m sorry to hear that.\nTHOMAS: It’s OK. I’m over it now and I think it’s much better to do a university course and this one has such a variety of sports- related areas. It’s going to be good.\nJEANNE: Oh, I agree - I chose it because of that.", "explain": "Câu hỏi:\nChoose TWO letters, A-E.\nWhich TWO points do Thomas and Jeanne make about Thomas's sporting activities at school?\nA He should have felt more positive about them.\nB The training was too challenging for him.\nC He could have worked harder at them.\nD His parents were disappointed in him.\nE His fellow students admired him.\nGiải thích đáp án:\nTất cả lựa chọn đều được nhắc đến trong đoạn hội thoại trên, Ở lựa chọn A, về việc He should have felt more positive about them. Thomas cho rằng Anh ta có thể thắng mọi thứ. Không có ai chạy nhanh hơn anh ta \nỞ lựa chọn B, về việc the training was to challenging for him. Anh ta nói rằng, anh ta cảm thấy may mắn. Và Anh ta nhanh chóng nhận ra là anh ta chưa đủ tốt\nỞ lựa chọn C, về việc he could have worked harder at them. Thomas nói rằng anh ta nên luyện tập nhiều hơn\nỞ lựa chọn D, về việc his parents were disappointed in him. Jeanne hỏi Thomas là bố mẹ của anh có muốn anh trở nên tri thức hơn không. Thomas trả lời rằng, không, lẽ ra họ nên đẩy tôi tập luyện nhiều hơn\nỞ lựa chọn E, về việc his fellow students admired him. Thomas nói rằng tất cả những người bạn cùng lớp của anh ấy nghĩ rằng anh ấy sẽ được nó, họ nghĩ rằng anh ấy cực kỳ giỏi.\nTừ những dữ kiện trên, ta có thể thấy E và C là đáp án đúng"}, "22": {"answer_label": "21-22.\nE&C", "quote": "JEANNE: Hi Thomas, how are you enjoying the course so far?\nTHOMAS: Yeah, I think it's good.\nJEANNE: Remind me - why did you decide to study sports science? Didn’t you want to be a professional athlete when you were at school?\nTHOMAS: Yeah - that was my goal, and all my classmates assumed I would achieve it; they thought I was brilliant.\nJEANNE: That must have been a nice feeling.\nTHOMAS: Mm, I thought I could win anything. There was no one who could run faster than me.\nJEANNE: Exactly - so what happened? Did your mum and dad want you to be more ‘academic’?\nTHOMAS: Not at all. Perhaps they should have pushed me harder, though.\nJEANNE: What do you mean?\nTHOMAS: I think I should have practised more.\nJEANNE: What makes you say that?\nTHOMAS: Well, I went out to Kenya for a couple of weeks to train ...\nJEANNE: Really! I didn't know that.\nTHOMAS: I was chosen to go there out of loads of kids and run with some of the top teenage athletes in the world. And ... I was so calm about it. I just kept thinking how fortunate I was. What a great chance this was! Everyone back home was so proud of me. But once we started competing, I very quickly realised I wasn't good enough.\nJEANNE: That must have been a huge shock.\nTHOMAS: I thought ‘this can't be happening'! I was used to winning.\nJEANNE: I’m sorry to hear that.\nTHOMAS: It’s OK. I’m over it now and I think it’s much better to do a university course and this one has such a variety of sports- related areas. It’s going to be good.\nJEANNE: Oh, I agree - I chose it because of that.", "explain": "Câu hỏi:\nChoose TWO letters, A-E.\nWhich TWO points do Thomas and Jeanne make about Thomas's sporting activities at school?\nA He should have felt more positive about them.\nB The training was too challenging for him.\nC He could have worked harder at them.\nD His parents were disappointed in him.\nE His fellow students admired him.\nGiải thích đáp án:\nTất cả lựa chọn đều được nhắc đến trong đoạn hội thoại trên, Ở lựa chọn A, về việc He should have felt more positive about them. Thomas cho rằng Anh ta có thể thắng mọi thứ. Không có ai chạy nhanh hơn anh ta \nỞ lựa chọn B, về việc the training was to challenging for him. Anh ta nói rằng, anh ta cảm thấy may mắn. Và Anh ta nhanh chóng nhận ra là anh ta chưa đủ tốt\nỞ lựa chọn C, về việc he could have worked harder at them. Thomas nói rằng anh ta nên luyện tập nhiều hơn\nỞ lựa chọn D, về việc his parents were disappointed in him. Jeanne hỏi Thomas là bố mẹ của anh có muốn anh trở nên tri thức hơn không. Thomas trả lời rằng, không, lẽ ra họ nên đẩy tôi tập luyện nhiều hơn\nỞ lựa chọn E, về việc his fellow students admired him. Thomas nói rằng tất cả những người bạn cùng lớp của anh ấy nghĩ rằng anh ấy sẽ được nó, họ nghĩ rằng anh ấy cực kỳ giỏi.\nTừ những dữ kiện trên, ta có thể thấy E và C là đáp án đúng"}, "23": {"answer_label": "23-24. A&D", "quote": "JEANNE: What makes you say that?\nTHOMAS:\nWell, I went out to Kenya for a couple of weeks to train ...\nJEANNE: Really! I didn’t know that.\nTHOMAS: I was chosen to go there out of loads of kids and run with some of the top teenage athletes in the world. And ... I was so calm about it. I just kept thinking how fortunate I was. What a great chance this was! Everyone back home was so proud of me. But once we started competing, I very quickly realised I wasn't good enough.\nJEANNE: That must have been a huge shock.\nTHOMAS: I thought ‘this can't be happening'! I was used to winning.\nJEANNE: I'm sorry to hear that.\nTHOMAS: It's OK. I'm over it now and I think it's much better to do a university course and this one has such a variety of sports- related areas. It's going to be good.\nJEANNE: Oh, I agree - I chose it because of that.", "explain": "Câu hỏi:\nChoose TWO letters, A-E.\nWhich TWO feelings did Thomas experience when he was in Kenya?\nA disbelief\nB relief\nC stress\nD gratitude\nE homesickness\nGiải thích đáp án:\nTất cả lựa chọn đều được nhắc đến trong đoạn hội thoại trên, Ở lựa chọn A, về việc disbelief. Thomas nói rằng, anh ta đã nhanh chóng nhận ta anh ta không đủ tốt\nỞ lựa chọn B, về việc relief. Anh ta nói rằng anh ta không thể tin được, anh ta từng chiên thắng rất nhiều\nỞ lựa chọn C, về việc stress. Thomas nói rằng anh ta cảm thấy rất may mắn.\nỞ lựa chọn D, về việc gratitude. Anh ta nói rằng anh ta cảm thấy rất may mắn khi được ở đây.\nỞ lựa chọn E, về homesickness. Thomas mọi người ở nhà đều rất tự hào về anh.\nTừ những dữ kiện trên, ta có thể thấy A và D là đáp án đúng"}, "24": {"answer_label": "23-24. A&D", "quote": "JEANNE: What makes you say that?\nTHOMAS:\nWell, I went out to Kenya for a couple of weeks to train ...\nJEANNE: Really! I didn’t know that.\nTHOMAS: I was chosen to go there out of loads of kids and run with some of the top teenage athletes in the world. And ... I was so calm about it. I just kept thinking how fortunate I was. What a great chance this was! Everyone back home was so proud of me. But once we started competing, I very quickly realised I wasn't good enough.\nJEANNE: That must have been a huge shock.\nTHOMAS: I thought ‘this can't be happening'! I was used to winning.\nJEANNE: I'm sorry to hear that.\nTHOMAS: It's OK. I'm over it now and I think it's much better to do a university course and this one has such a variety of sports- related areas. It's going to be good.\nJEANNE: Oh, I agree - I chose it because of that.", "explain": "Câu hỏi:\nChoose TWO letters, A-E.\nWhich TWO feelings did Thomas experience when he was in Kenya?\nA disbelief\nB relief\nC stress\nD gratitude\nE homesickness\nGiải thích đáp án:\nTất cả lựa chọn đều được nhắc đến trong đoạn hội thoại trên, Ở lựa chọn A, về việc disbelief. Thomas nói rằng, anh ta đã nhanh chóng nhận ta anh ta không đủ tốt\nỞ lựa chọn B, về việc relief. Anh ta nói rằng anh ta không thể tin được, anh ta từng chiên thắng rất nhiều\nỞ lựa chọn C, về việc stress. Thomas nói rằng anh ta cảm thấy rất may mắn.\nỞ lựa chọn D, về việc gratitude. Anh ta nói rằng anh ta cảm thấy rất may mắn khi được ở đây.\nỞ lựa chọn E, về homesickness. Thomas mọi người ở nhà đều rất tự hào về anh.\nTừ những dữ kiện trên, ta có thể thấy A và D là đáp án đúng"}, "25": {"answer_label": "25. B", "quote": "THOMAS: Look at early types of equipment perhaps? Uh, I remember reading something about table tennis bats once - how they ended up being covered with pimpled rubber.\nJEANNE: Cos they were just wooden at first, I'd imagine.\nTHOMAS: Yeah. In about the 1920s, a factory was making rolls of the rubber in bulk for something like horse harnesses.\nJEANNE: Really!\nTHOMAS: Yeah - and someone realised that it'd make a perfect covering for the wooden bats.", "explain": "Câu hỏi:\nWhat comment do the students make about the development of each of the following items of sporting equipment?\nChoose SIX answers from the box and write the correct letter, A-H, next to Questions 25-30.\nComments about the development of the equipment\nA It could cause excessive sweating.\nB The material was being mass produced for another purpose.\nC People often needed to make their own.\nD It often had to be replaced.\nE The material was expensive.\nF It was unpopular among spectators.\nG It caused injuries.\nH No one ring it liked it at first.\nItems of sporting equipment\n25 the table tennis bat\t\nKeywords được paraphrase:\nthe material was being mass produced - making rolls of the rubber in bulk\nGiải thích đáp án:\nĐoạn hội thoại trên chỉ ra rằng, Vào khoảng những năm 1920, một nhà máy đang sản xuất các cuộn cao su với số lượng lớn cho một thứ như dây nịt ngựa. Và sau đó đã có người nhận ra nó hoàn hảo cho việc bao phủ vợt gỗ. Vậy đáp án là B"}, "26": {"answer_label": "26. F", "quote": "when the first cricket helmet came in, in 1978, the Australian batsman who first wore it was booed and jeered by people", "explain": "Câu hỏi:\nWhat comment do the students make about the development of each of the following items of sporting equ
