a writer, he was at the height of his career in Paris and he was very highly regarded by his colleagues. As far as literature was concerned, he was the leading figure of the Romantic movement. However, as well as being a literary genius, he also gave many speeches about issues like the level of poverty (Q32) in his society. He felt very strongly about this and about other areas where change was needed, like education. This kind of outspoken criticism was not well liked by the rulers of France and, eventually, the emperor - Napoleon III - told Victor Hugo to leave Paris and not return; in other words, he sent him into exile.\n\nSo Victor Hugo was forced to reside in other parts of Europe (Q33). Guernsey was actually his third place of exile and he landed there in 1855. He produced a lot while on Guernsey - including Les Misérables - and to do this, he had to spend a great deal of time in the home that he had there. This was a property that he bought using the money he’d made in France from the publication of a collection of his poetry (Q34). It was the only property he ever owned, and he was very proud of it.\n_______________\nThe property Victor Hugo bought on Guernsey was a large, five-story house in the capital town of St Peter Port and he lived there for 15 years, returning to France in 1870 when Napoleon’s Empire collapsed. He decorated and furnished each level, or floor, of the house in unique and wonderful ways, and many people consider the inside of the house to be a ‘work of art’. Today it’s a museum that attracts 200,000 visitors a year.\nHe lived in the house with his family ... and portraits of its members still hang in rooms on the ground floor, along with drawings (Q35) that he did during his travels that he felt were important to him. In other ground-floor rooms, there are huge tapestries that he would have designed and loved. The walls are covered in dark wood paneling that Victor Hugo created himself using wooden furniture that he bought in the market (Q36). The items were relatively inexpensive, and he used them to create intricate carvings. They gave an atmosphere on the lower level that was shadowy and rather solemn.\n\n\n\nOn the next level of the house there are two impressive lounges, where he entertained his guests. One lounge has entirely red furnishings, such as sofas and wall coverings, and the other blue. There’s a strong Chinese influence in these areas in things like the wallpaper pattern and the lamps (Q37) - which he would have made himself by copying original versions.\n\nHis library, where he left many of his favourite books, forms the hallway to the third floor and was a comfortable area where he could relax and enjoy his afternoons. And then, at the very top of the house, there’s a room called the Lookout - called that because it looks out over the harbour (Q38). In contrast to the rather dark lower levels, it's full of light and was like a glass office where he would write until lunchtime - often at his desk.\n\nSo, Victor Hugo was a man of many talents, but he was also true to his values. While living in his house on Guernsey, he entertained many other famous writers, but he also invited a large group of local children from the deprived areas of the island to dinner once a week (Q39). What’s more, he served them their food, which was an extraordinary gesture for the time period.\nIn 1927, the house was owned bv his relatives, and they decided to donate it to the city of Paris (Q40). It has since been restored using photographs from the period and, as I mentioned earlier, is now a museum that is open to the public.", "quote": "The person I’ve chosen to talk about is the French writer Victor Hugo - many people have heard of him because his novel, Les Misérables, which he wrote in 1862, is famous around the world. It became a stage musical in the 1980s, and a film version was also released in 2012. So, some of us, I’m sure, have a pretty general idea of the plot, but we know much less about vels that he felt were important to him. In other ground-floor rooms, there are huge tapestries that he would have designed and loved. The walls are covered in dark wood paneling that Victor Hugo created himself using wooden furniture that he bought in the market (Q36). The items were relatively inexpensive, and he used them to create intricate carvings. They gave an atmosphere on the lower level that was shadowy and rather solemn.\n\n\n\nOn the next level of the house there are two impressive lounges, where he entertained his guests. One lounge has entirely red furnishings, such as sofas and wall coverings, and the other blue. There’s a strong Chinese influence in these areas in things like the wallpaper pattern and the lamps (Q37) - which he would have made himself by copying original versions.\n\nHis library, where he left many of his favourite books, forms the hallway to the third floor and was a comfortable area where he could relax and enjoy his afternoons. And then, at the very top of the house, there’s a room called the Lookout - called that because it looks out over the harbour (Q38). In contrast to the rather dark lower levels, it's full of light and was like a glass office where he would write until lunchtime - often at his desk.\n\nSo, Victor Hugo was a man of many talents, but he was also true to his values. While living in his house on Guernsey, he entertained many other famous writers, but he also invited a large group of local children from the deprived areas of the island to dinner once a week (Q39). What’s more, he served them their food, which was an extraordinary gesture for the time period.\nIn 1927, the house was owned bv his relatives, and they decided to donate it to the city of Paris (Q40). It has since been restored using photographs from the period and, as I mentioned earlier, is now a museum that is open to the public.", "explain": "Người mà tôi chọn để nói đến là nhà văn Pháp Victor Hugo - nhiều người biết đến ông vì cuốn tiểu thuyết Nhữ  he had there. This was a property that he bought using the money he’d made in France from the publication of a collection of his poetry (Q34). It was the only property he ever owned, and he was very proud of it.\n_______________\nThe property Victor Hugo bought on Guernsey was a large, five-story house in the capital town of St Peter Port and he lived there for 15 years, returning to France in 1870 when Napoleon’s Empire collapsed. He decorated and furnished each level, or floor, of the house in unique and wonderful ways, and many people consider the inside of the house to be a ‘work of art’. Today it’s a museum that attracts 200,000 visitors a year.\nHe lived in the house with his family ... and portraits of its members still hang in rooms on the ground floor, along with drawings (Q35) that he did during his travels that he felt were important to him. In other ground-floor rooms, there are huge tapestries that he would have designed and loved. The walls are covered in dark wood paneling that Victor Hugo created himself using wooden furniture that he bought in the market (Q36). The items were relatively inexpensive, and he used them to create intricate carvings. They gave an atmosphere on the lower level that was shadowy and rather solemn.\n\n\n\nOn the next level of the house there are two impressive lounges, where he entertained his guests. One lounge has entirely red furnishings, such as sofas and wall coverings, and the other blue. There’s a strong Chinese influence in these areas in things like the wallpaper pattern and the lamps (Q37) - which he would have made himself by copying original versions.\n\nHis library, where he left many of his favourite books, forms the hallway to the third floor and was a comfortable area where he could relax and enjoy his afternoons. And then, at the very top of the house, there’s a room called the Lookout - called that because it looks out over the harbour (Q38). In contrast to the rather dark lower levels, it's full of light and was like a glass office where he would write until lunchtime - often at his desk.\n\nSo, Victor Hugo was a man of many talents, but he was also true to his values. While living in his house on Guernsey, he entertained many other famous writers, but he also invited a large group of local children from the deprived areas of the island to dinner once a week (Q39). What’s more, he served them their food, which was an extraordinary gesture for the time period.\nIn 1927, the house was owned bv his relatives, and they decided to donate it to the city of Paris (Q40). It has since been restored using photographs from the period and, as I mentioned earlier, is now a museum that is open to the public.", "quote": "The person I’ve chosen to talk about is the French writer Victor Hugo - many people have heard of him because his novel, Les Misérables, which he wrote in 1862, is famous around the world. It became a stage musical in the 1980s, and a film version was also released in 2012. So, some of us, I’m sure, have a pretty general idea of the plot, but we know much less about the author (Q31). Today, I’m going to provide a little more insight into this talented man and I’m going to talk particularly about the home he had on the Island of Guernsey in the British Channel Islands.\n\nBut first, his early career... as I’ve said, he was a writer, he was at the height of his career in Paris and he was very highly regarded by his colleagues. As far as literature was concerned, he was the leading figure of the Romantic movement. However, as well as being a literary genius, he also gave many speeches about issues like the level of poverty (Q32) in his society. He felt very strongly about this and about other areas where change was needed, like education. This kind of outspoken criticism was not well liked by the rulers of France and, eventually, the emperor - Napoleon III - told Victor Hugo to leave Paris and not return; in other words, he sent him into exile.\n\nSo Victor Hugo was forced to reside in other parts of Europe (Q33). Guernsey was actually his third place of exile and he landed there in 1855. He produced a lot while on Guernsey - including Les Misérables - and to do this, he had to spend a great deal of time in the home that he had there. This was a property that he bought using the money he’d made in France from the publication of a collection of his poetry (Q34). It was the only property he ever owned, and he was very proud of it.\n_______________\nThe property Victor Hugo bought on Guernsey was a large, five-story house in the capital town of St Peter Port and he lived there for 15 years, returning to France in 1870 when Napoleon’s Empire collapsed. He decorated and furnished each level, or floor, of the house in unique and wonderful ways, and many people consider the inside of the house to be a ‘work of art’. Today it’s a museum that attracts 200,000 visitors a year.\nHe lived in the house with his family ... and portraits of its members still hang in rooms on the ground floor, along with drawings (Q35) that he did during his travels that he felt were important to him. In other ground-floor rooms, there are huge tapestries that he would have designed and loved. The walls are covered in dark wood paneling that Victor Hugo created himself using wooden furniture that he bought in the market (Q36). The items were relatively inexpensive, and he used them to create intricate carvings. They gave an atmosphere on the lower level that was shadowy and rather solemn.\n\n\n\nOn the next level of the house there are two impressive lounges, where he entertained his guests. One lounge has entirely red furnishings, such as sofas and wall coverings, and the other blue. There’s a strong Chinese influence in these areas in things like the wallpaper pattern and the lamps (Q37) - which he would have made himself by copying original versions.\n\nHis library, where he left many of his favourite books, forms the hallway to the third floor and was a comfortable area where he could relax and enjoy his afternoons. And then, at the very top of the house, there’s a room called the Lookout - called that because it looks out over the harbour (Q38). In contrast to the rather dark lower levels, it's full of light and was like a glass office where he would write until lunchtime - often at his desk.\n\nSo, Victor Hugo was a man of many talents, but he was also true to his values. While living in his house on Guernsey, he entertained many other famous writers, but he also invited a large group of local children from the deprived areas of the island to dinner once a week (Q39). What’s more, he served them their food, which was an extraordinary gesture for the time period.\nIn 1927, the house was owned bv his relatives, and they decided to donate it to the city of Paris (Q40). It has since been restored using photographs from the period and, as I mentioned earlier, is now a museum that is open to the public.", "explain": "Người mà tôi chọn để nói đến là nhà văn Pháp Victor Hugo - nhiều người biết đến ông vì cuốn tiểu thuyết Những người khốn khổ của ông viết năm 1862 đã nổi tiếng khắp thế giới. Nó đã trở thành một vở nhạc kịch sân khấu vào những năm 1980, và một phiên bản điện ảnh cũng được phát hành vào năm 2012. Vì vậy, tôi chắc chắn rằng một số người trong chúng ta có ý tưởng khá chung chung về cốt truyện, nhưng chúng ta biết về tác giả thì ít hơn nhiều (Q31). Hôm nay, tôi sẽ cung cấp thêm một chút thông tin chi tiết về người đàn ông tài năng này và tôi sẽ đặc biệt nói về ngôi nhà mà anh ấy có trên Đảo Guernsey thuộc Quần đảo Channel của Anh.\nNhưng trước tiên, sự nghiệp ban đầu của ông ấy... như tôi đã nói, ông ấy là một nhà văn, ông ấy đang ở đỉnh cao của sự nghiệp ở Paris và ông ấy rất được đồng nghiệp đánh giá cao. Về mặt văn học, ông là nhân vật hàng đầu của phong trào Lãng mạn. Tuy nhiên, ngoài việc là một thiên tài văn học, ông còn có nhiều bài phát biểu về các vấn đề như mức độ nghèo đói (Q32) trong xã hội của mình. Ông ấy cảm thấy rất rõ ràng về điều này và về những lĩnh vực khác cần thay đổi, chẳng hạn như giáo dục. Kiểu chỉ trích thẳng thắn này không được các nhà cai trị nước Pháp ưa thích và cuối cùng, hoàng đế - Napoléon III - đã yêu cầu Victor Hugo rời Paris và không được quay lại; nói cách khác, anh ta đã gửi ông ấy đi lưu vong.\nVì vậy, Victor Hugo buộc phải cư trú ở các vùng khác của Châu Âu (Q33). Guernsey thực sự là nơi lưu vong thứ ba của ông và ông đến đó vào năm 1855. Ông đã sản xuất rất nhiều khi ở Guernsey - bao gồm cả Les Misérables - và để làm được điều này, ông đã phải dành rất nhiều thời gian trong ngôi nhà mà ông đã có ở đó. Đây là tài sản mà ông ấy đã mua bằng số tiền ông ấy kiếm được ở Pháp từ việc xuất bản một tập thơ của ông ấy (Q34). Đó là tài sản duy nhất mà ông ấy từng sở hữu, và ông ấy rất tự hào về nó.\n_______________\nCơ ngơi mà Victor Hugo mua ở Guernsey là một ngôi nhà lớn, năm tầng ở thủ đô St Peter Port và ông sống ở đó 15 năm, trở về Pháp năm 1870 khi Đế chế Napoléon sụp đổ. Ông đã trang trí và trang bị nội thất cho từng tầng của ngôi nhà theo những cách độc đáo và tuyệt vời, và nhiều người coi bên trong ngôi nhà là một 'tác phẩm nghệ thuật'. Ngày nay, nó là một bảo tàng thu hút 200.000 du khách mỗi năm.\n\nÔng ấy sống trong ngôi nhà với gia đình của mình ... và chân dung của các thành viên trong ngôi nhà vẫn được treo trong các phòng ở tầng trệt, cùng với những bức vẽ (Q35) mà ông ấy đã thực hiện trong chuyến du lịch mà ông ấy cảm thấy quan trọng đối với ông ấy. Trong các phòng ở tầng trệt khác, có những tấm thảm khổng lồ mà ông ấy đã thiết kế và yêu thích. Các bức tường được bao phủ bởi những tấm gỗ tối màu mà Victor Hugo đã tự tạo ra bằng cách sử dụng đồ nội thất bằng gỗ mà ông đã mua ở chợ (Q36). Những món đồ này tương đối rẻ và ông ấy đã sử dụng chúng để tạo ra những tác phẩm chạm khắc phức tạp. Họ đã tạo ra một bầu không khí ở cấp độ thấp hơn là bóng tối và khá trang trọng.\nỞ tầng tiếp theo của ngôi nhà có hai sảnh khách ấn tượng, nơi ông tiếp đãi khách của mình. Một sảnh có đồ nội thất hoàn toàn màu đỏ, chẳng hạn như ghế sofa và giấy dán tường, còn phòng kia có màu xanh lam. Có một ảnh hưởng mạnh mẽ của Trung Quốc trong những lĩnh vực này trong những thứ như hoa văn giấy dán tường và đèn (Q37) - những thứ mà ông ấy đã tự làm bằng cách sao chép các phiên bản gốc.\nThư viện của ông ấy, nơi ông ấy để lại nhiều cuốn sách yêu thích của mình, tạo thành hành lang lên tầng ba và là một khu vực thoải mái để ông ấy có thể thư giãn và tận hưởng những buổi chiều của mình. Và sau đó, ở trên cùng của ngôi nhà, có một căn phòng tên là Lookout - được gọi như vậy bởi vì nó nhìn ra bến cảng (Q38). Trái ngược với các tầng thấp hơn khá tối, nó tràn ngập ánh sáng và giống như một văn phòng bằng kính, nơi ông ấy sẽ viết cho đến giờ ăn trưa - thường là tại bàn làm việc của ông ấy.\nVậy, Victor Hugo là một người đa tài, nhưng ông cũng sống đúng với giá trị của mình. Khi sống trong ngôi nhà của mình ở Guernsey, ông ấy đã chiêu đãi nhiều nhà văn nổi tiếng khác, nhưng ông ấy cũng mời một nhóm lớn trẻ em địa phương từ những khu vực thiếu thốn của hòn đảo đến ăn tối mỗi tuần một lần (Q39). Hơn nữa, ông ấy đã phục vụ thức ăn cho họ, đó là một cử chỉ phi thường trong khoảng thời gian đó.\nNăm 1927, ngôi nhà thuộc sở hữu của người thân của ông, và họ quyết định tặng nó cho thành phố Paris (Q40). Kể từ đó, nó đã được khôi phục bằng cách sử dụng các bức ảnh từ thời kỳ đó và, như tôi đã đề cập trước đó, hiện là một bảo tàng mở cửa cho công chúng."}, "000": {"answer_label": "The person I’ve chosen to talk about is the French writer Victor Hugo - many people have heard of him because his novel, Les Misérables, which he wrote in 1862, is famous around the world. It became a stage musical in the 1980s, and a film version was also released in 2012. So, some of us, I’m sure, have a pretty general idea of the plot, but we know much less about the author (Q31). Today, I’m going to provide a little more insight into this talented ma e a stage musical in the 1980s, and a film version was also released in 2012. So, some of us, I’m sure, have a pretty general idea of the plot, but we know much less about the author (Q31). Today, I’m going to provide a little more insight into this talented man and I’m going to talk particularly about the home he had on the Island of Guernsey in the British Channel Islands.\n\nBut first, his early career... as I’ve said, he was a writer, he was at the height of his career in Paris and he was very highly regarded by his colleagues. As far as literature was concerned, he was the leading figure of the Romantic movement. However, as well as being a literary genius, he also gave many speeches about issues like the level of poverty (Q32) in his society. He felt very strongly about this and about other areas where change was needed, like education. This kind of outspoken criticism was not well liked by the rulers of France and, eventually, the emperor - Napoleon III - told Victor Hugo to leave Paris and not return; in other words, he sent him into exile.\n\nSo Victor Hugo was forced to reside in other parts of Europe (Q33). Guernsey was actually his third place of exile and he landed there in 1855. He produced a lot while on Guernsey - including Les Misérables - and to do this, he had to spend a great deal of time in the home that he had there. This was a property that he bought using the money he’d made in France from the publication of a collection of his poetry (Q34). It was the only property he ever owned, and he was very proud of it.\n_______________\nThe property Victor Hugo bought on Guernsey was a large, five-story house in the capital town of St Peter Port and he lived there for 15 years, returning to France in 1870 when Napoleon’s Empire collapsed. He decorated and furnished each level, or floor, of the house in unique and wonderful ways, and many people consider the inside of the house to be a ‘work of art’. Today it’s a museum that attracts 200,000 visitors a year.\nHe lived in the house with his family ... and portraits of its members still hang in rooms on the ground floor, along with drawings (Q35) that he did during his travels that he felt were important to him. In other ground-floor rooms, there are huge tapestries that he would have designed and loved. The walls are covered in dark wood paneling that Victor Hugo created himself using wooden furniture that he bought in the market (Q36). The items were relatively inexpensive, and he used them to create intricate carvings. They gave an atmosphere on the lower level that was shadowy and rather solemn.\n\n\n\nOn the next level of the house there are two impressive lounges, where he entertained his guests. One lounge has entirely red furnishings, such as sofas and wall coverings, and the other blue. There’s a strong Chinese influence in these areas in things like the wallpaper pattern and the lamps (Q37) - which he would have made himself by copying original versions.\n\nHis library, where he left many of his favourite books, forms the hallway to the third floor and was a comfortable area where he could relax and enjoy his afternoons. And then, at the very top of the house, there’s a room called the Lookout - called that because it looks out over the harbour (Q38). In contrast to the rather dark lower levels, it's full of light and was like a glass office where he would write until lunchtime - often at his desk.\n\nSo, Victor Hugo was a man of many talents, but he was also true to his values. While living in his house on Guernsey, he entertained many other famous writers, but he also invited a large group of local children from the deprived areas of the island to dinner once a week (Q39). What’s more, he served them their food, which was an extraordinary gesture for the time period.\nIn 1927, the house was owned bv his relatives, and they decided to donate it to the city of Paris (Q40). It has since been restored using photographs from the period and, as I mentioned earlier, is now a museum that is open to the public.", "explain": "Người mà tôi chọn để nói đến là nhà văn Pháp Victor Hugo - nhiều người biết đến ông vì cuốn tiểu thuyết Những người khốn khổ của ông viết năm 1862 đã nổi tiếng khắp thế giới. Nó đã trở thành một vở nhạc kịch sân khấu vào những năm 1980, và một phiên bản điện ảnh cũng được phát hành vào năm 2012. Vì vậy, tôi chắc chắn rằng một số người trong chúng ta có ý tưởng khá chung chung về cốt truyện, nhưng chúng ta biết về tác giả thì ít hơn nhiều (Q31). Hôm nay, tôi sẽ cung cấp thêm một chút thông tin chi tiết về người đàn ông tài năng này và tôi sẽ đặc biệt nói về ngôi nhà mà anh ấy có trên Đảo Guernsey thuộc Quần đảo Channel của Anh.\nNhưng trước tiên, sự nghiệp ban đầu của ông ấy... như tôi đã nói, ông ấy là một nhà văn, ông ấy đang ở đỉnh cao của sự nghiệp ở Paris và ông ấy rất được đồng nghiệp đánh giá cao. Về mặt văn học, ông là nhân vật hàng đầu của phong trào Lãng mạn. Tuy nhiên, ngoài việc là một thiên tài văn học, ông còn có nhiều bài phát biểu về các vấn đề như mức độ nghèo đói (Q32) trong xã hội của mình. Ông ấy cảm thấy rất rõ ràng về điều này và về những lĩnh vực khác cần thay đổi, chẳng hạn như giáo dục. Kiểu chỉ trích thẳng thắn này không được các nhà cai trị nước Pháp ưa thích và cuối cùng, hoàng đế - Napoléon III - đã yêu cầu Victor Hugo rời Paris và không được quay lại; nói cách khác, anh ta đã gửi ông ấy đi lưu vong.\nVì vậy, Victor Hugo buộc phải cư trú ở các vùng khác của Châu Âu (Q33). Guernsey thực sự là nơi lưu vong thứ ba của ông và ông đến đó vào năm 1855. Ông đã sản xuất rất nhiều khi ở Guernsey - bao gồm cả Les Misérables - và để làm được điều này, ông đã phải dành rất nhiều thời gian trong ngôi nhà mà ông đã có ở đó. Đây là tài sản mà ông ấy đã mua bằng số tiền ông ấy kiếm được ở Pháp từ việc xuất bản một tập thơ của ông ấy (Q34). Đó là tài sản duy nhất mà ông ấy từng sở hữu, và ông ấy rất tự hào về nó.\n_______________\nCơ ngơi mà Victor Hugo mua ở Guernsey là một ngôi nhà lớn, năm tầng ở thủ đô St Peter Port và ông sống ở đó 15 năm, trở về Pháp năm 1870 khi Đế chế Napoléon sụp đổ. Ông đã trang trí và trang bị nội thất cho từng tầng của ngôi nhà theo những cách độc đáo và tuyệt vời, và nhiều người coi bên trong ngôi nhà là một 'tác phẩm nghệ thuật'. Ngày nay, nó là một bảo tàng thu hút 200.000 du khách mỗi năm.\n\nÔng ấy sống trong ngôi nhà với gia đình của mình ... và chân dung của các thành viên trong ngôi nhà vẫn được treo trong các phòng ở tầng trệt, cùng với những bức vẽ (Q35) mà ông ấy đã thực hiện trong chuyến du lịch mà ông ấy cảm thấy quan trọng đối với ông ấy. Trong các phòng ở tầng trệt khác, có những tấm thảm khổng lồ mà ông ấy đã thiết kế và yêu thích. Các bức tường được bao phủ bởi những tấm gỗ tối màu mà Victor Hugo đã tự tạo ra bằng cách sử dụng đồ nội thất bằng gỗ mà ông đã mua ở chợ (Q36). Những món đồ này tương đối rẻ và ông ấy đã sử dụng chúng để tạo ra những tác phẩm chạm khắc phức tạp. Họ đã tạo ra một bầu không khí ở cấp độ thấp hơn là bóng tối và khá trang trọng.\nỞ tầng tiếp theo của ngôi nhà có hai sảnh khách ấn tượng, nơi ông tiếp đãi khách của mình. Một sảnh có đồ nội thất hoàn toàn màu đỏ, chẳng hạn như ghế sofa và giấy dán tường, còn phòng kia có màu xanh lam. Có một ảnh hưởng mạnh mẽ của Trung Quốc trong những lĩnh vực này trong những thứ như hoa văn giấy dán tường và đèn (Q37) - những thứ mà ông ấy đã tự làm bằng cách sao chép các phiên bản gốc.\nThư viện của ông ấy, nơi ông ấy để lại nhiều cuốn sách yêu thích của mình, tạo thành hành lang lên tầng ba và là một khu vực thoải mái để ông ấy có thể thư giãn và tận hưởng những buổi chiều của mình. Và sau đó, ở trên cùng của ngôi nhà, có một căn phòng tên là Lookout - được gọi như vậy bởi vì nó nhìn ra bến cảng (Q38). Trái ngược với các tầng thấp hơn khá tối, nó tràn ngập ánh sáng và giống như một văn phòng bằng kính, nơi ông ấy sẽ viết cho đến giờ ăn trưa - thường là tại bàn làm việc của ông ấy.\nVậy, Victor Hugo là một người đa tài, nhưng ông cũng sống đúng với giá trị của mình. Khi sống trong ngôi nhà của mình ở Guernsey, ông ấy đã chiêu đãi nhiều nhà văn nổi tiếng khác, nhưng ông ấy cũng mời một nhóm lớn trẻ em địa phương từ những khu vực thiếu thốn của hòn đảo đến ăn tối mỗi tuần một lần (Q39). Hơn nữa, ông ấy đã phục vụ thức ăn cho họ, đó là một cử chỉ phi thường trong khoảng thời gian đó.\nNăm 1927, ngôi nhà thuộc sở hữu của người thân của ông, và họ quyết định tặng nó cho thành phố Paris (Q40). Kể từ đó, nó đã được khôi phục bằng cách sử dụng các bức ảnh từ thời kỳ đó và, như tôi đã đề cập trước đó, hiện là một bảo tàng mở cửa cho công chúng."}}, "script_full": [{"speaker": null, "text": "The person I've chosen to talk about is the French writer Victor Hugo - many people have heard of him because his novel, Les Misérables, which he wrote in 1862, is famous around the world. It became a stage musical in the 1980s, and a film version was also released in 2012. So, some of us, I'm sure, have a pretty general idea of the plot, but we know much less about the author. Today, I'm going to provide a little more insight into this talented man and I'm going to talk particularly about the home he had on the island of Guernsey in the British Channel Islands.", "qids": ["31"]}, {"speaker": null, "text": "But first, his early career... as I've said, he was a writer, he was at the height of his career in Paris and he was very highly regarded by his colleagues. As far as literature was concerned, he was the leading figure of the Romantic movement. However, as well as being a literary genius, he also gave many speeches about issues like the level of poverty in his society. He felt very strongly about this and about other areas where change was needed, like education.", "qids": ["32"]}, {"speaker": null, "text": "This kind of outspoken criticism was not well liked by the rulers of France and, eventually, the emperor - Napoleon III - told Victor Hugo to leave Paris and not return; in other words, he sent him into exile.", "qids": []}, {"speaker": null, "text": "So Victor Hugo was forced to reside in other parts of Europe. Guernsey was actually his third place of exile and he landed there in 1855. He produced a lot while on Guernsey - including Les Misérables - and to do this, he had to spend a great deal of time in the home that he had there. This was a property that he bought using the money he'd made in France from the publication of a collection of his poetry. It was the only property he ever owned, and he was very proud of it.", "qids": ["33", "34"]}, {"speaker": null, "text": "The property Victor Hugo bought on Guernsey was a large, five-storey house in the capital town of St Peter Port and he lived there for 15 years, returning to France in 1870 when Napoleon's Empire collapsed. He decorated and furnished each level, or floor, of the house in unique and wonderful ways, and many people consider the inside of the house to be a 'work of art'. Today it's a museum that attracts 200,000 visitors a year.", "qids": ["35"]}, {"speaker": null, "text": "He lived in the house with his family... and portraits of its members still hang in rooms on the ground floor, along with drawings that he did during his travels that he felt were important to him. In other ground-floor rooms, there are huge tapestries that he would have designed and loved. The walls are covered in dark wood panelling that Victor Hugo created himself using wooden furniture that he bought in the market. The items were relatively inexpensive, and he used them to create intricate carvings. They gave an atmosphere on the lower level that was shadowy and rather solemn.", "qids": ["36", "37"]}, {"speaker": null, "text": "On the next level of the house there are two impressive lounges, where he entertained his guests. One lounge has entirely red furnishings, such as sofas and wall coverings, and the other blue. There's a strong Chinese influence in these areas in things like the wallpaper pattern and the lamps - which he would have made himself by copying original versions.", "qids": []}, {"speaker": null, "text": "His library, where he left many of his favourite books, forms the hallway to the third floor and was a comfortable area where he could relax and enjoy his afternoons. And then, at the very top of the house, there's a room called the Lookout - called that because it looks out over the harbour. In contrast to the rather dark lower levels, it's full of light and was like a glass office where he would write until lunchtime - often at his desk.", "qids": ["38"]}, {"speaker": null, "text": "So, Victor Hugo was a man of many talents, but he was also true to his values. While living in his house on Guernsey, he entertained many other famous writers, but he also invited a large group of local children from the deprived areas of the island to dinner once a week. What's more, he served them their food, which was an extraordinary gesture for the time period.", "qids": ["39"]}, {"speaker": null, "text": "In 1927, the house was owned by his relatives, and they decided to donate it to the city of Paris. It has since been restored using photographs from the period and, as I mentioned earlier, is now a museum that is open to the public.", "qids": ["40"]}], "notes": ["Victor Hugo", "His novel, Les Miserables", "• It has been adapted for theatre and cinema.", "• We know more about its overall {{31}} than about its author.", "His early career", "• In Paris, his career was successful and he led the Romantic movement.", "• He spoke publicly about social issues, such as {{32}} and education.", "• Napoleon III disliked his views and exiled him.", "His exile from France", "• Victor Hugo had to live elsewhere in {{33}}", "• He used his income from the sale of some {{34}}  he had written to buy a house on Guernsey.", "His house on Guernsey", "• Victor Hugo lived in this house until the end of the Empire in France.", "• The ground floor contains portraits, {{35}} and tapestries that he valued.", "• He bought cheap {{36}} made of wood and turned this into beautiful wall carvings.", "• The first floor consists of furnished areas with wallpaper and {{37}} that have a Chinese design.", "• The library still contains many of his favourite books.", "• He wrote in a room at the top of the house that had a view of the {{38}}", "• He entertained other writers as well as poor {{39}} in his house.", "• Victor Hugo’s {{40}} gave ownership of the house to the city of Paris in 1927."]}]};

<script>
(function(){
  const partsEl = document.getElementById('parts');
  const tabsEl = document.getElementById('tabs');

  function renderNotes(part){
    let html = '<div class="notes-block">';
    for(const rawLine of part.notes){
      const text = rawLine.trim();
      if(!text) continue;
      const isBlankLine = /\{\{\d+\}\}/.test(text);
      const isBulletLine = /^[–\-•]/.test(text);
      const isExample = /^example$/i.test(text);
      const rendered = text.replace(/\{\{(\d+)\}\}/g, (m, num) => {
        return `<span class="blank-num">${num}</span><input class="blank" type="text" data-part="${part.part}" data-q="${num}" autocomplete="off" spellcheck="false">`;
      });
      if(isExample){
        html += `<span class="subhead example-line">Example</span><br>`;
      } else if(isBlankLine){
        html += (isBulletLine ? '<span class="bullet">' : '<span>') + rendered + '</span><br>';
      } else if(isBulletLine){
        html += `<span class="bullet">${text}</span><br>`;
      } else if(text.split(' ').length <= 4){
        html += `<span class="subhead">${text}</span><br>`;
      } else {
        html += `<span class="example-line">${text}</span><br>`;
      }
    }
    html += '</div>';
    return html;
  }

  function renderMatching(g, part){
    let html = '<div class="qgroup" data-qids="' + g.qids.join(',') + '" data-mtype="matching">';
    if(g.image){
      html += `<img class="map-img" src="${g.image}" alt="${(g.box_title||'Map')}">`;
    }
    const boxEntries = Object.entries(g.box || {});
    if(boxEntries.length){
      html += '<div class="box-panel">';
      if(g.box_title) html += `<div class="box-title">${g.box_title}</div>`;
      for(const [letter, text] of boxEntries){
        html += `<div class="box-item"><b>${letter}</b><span>${text}</span></div>`;
      }
      html += '</div>';
    } else if(g.box_title){
      html += `<div class="box-title" style="margin-bottom:8px;font-weight:800;color:var(--navy);">${g.box_title}</div>`;
    }
    const letters = boxEntries.length ? boxEntries.map(([l]) => l) : (g.qids.length ? inferLetters(g) : []);
    for(const s of g.stems){
      html += `<div class="stem-row" data-q="${s.qid}"><span class="blank-num">${s.qid}</span><span class="stem-text">${s.prompt}</span>`;
      html += `<select data-part="${part.part}" data-q="${s.qid}"><option value="">--</option>`;
      for(const letter of letters){
        html += `<option value="${letter}">${letter}</option>`;
      }
      html += '</select></div>';
    }
    html += '</div>';
    return html;
  }

  function inferLetters(g){
    // No box text (e.g. a map where letters are drawn on the image) --
    // fall back to A..I so the dropdown offers every valid letter (some
    // maps go up to I, not just H).
    return ['A','B','C','D','E','F','G','H','I'];
  }

  function renderMcq(part){
    let html = '';
    for(const g of part.groups){
      if(g.header){
        html += `<div class="header-note">${g.header}</div>`;
      }
      if(g.type === 'matching'){
        html += renderMatching(g, part);
        continue;
      }
      const qidsLabel = g.qids.length>1 ? `${g.qids[0]}\u2013${g.qids[g.qids.length-1]}` : g.qids[0];
      html += `<div class="qgroup" data-qids="${g.qids.join(',')}" data-multi="${g.multi}">`;
      html += `<div class="prompt"><span class="blank-num">${qidsLabel}</span> ${g.prompt}</div>`;
      html += '<div class="opt-list">';
      for(const [letter, text] of Object.entries(g.options)){
        const inputType = g.multi ? 'checkbox' : 'radio';
        const name = g.multi ? `p${part.part}g${g.qids.join('_')}` : `p${part.part}q${g.qids[0]}`;
        html += `<label class="opt" data-letter="${letter}"><input type="${inputType}" name="${name}" value="${letter}" ${g.multi?`data-max="${g.qids.length}"`:''}>`+
                `<span><b>${letter}.</b> ${text}</span></label>`;
      }
      html += '</div></div>';
    }
    return html;
  }

  const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function fmtTime(t){
    t = Math.max(0, Math.round(t||0));
    const m = Math.floor(t/60), s = t%60;
    return `${m}:${String(s).padStart(2,'0')}`;
  }

  function buildScriptHtml(part){
    // part.script_full: the complete audioscript for this part, line by line, in order.
    // Lines whose "qids" array is non-empty are the lines where an answer's information
    // is actually said -- those get highlighted, tagged with the question number(s), and
    // (when time_seconds is known) get a jump button that seeks the script's own audio player.
    const lines = part.script_full || [];
    if(!lines.length) return '<p class="muted">No script data.</p>';
    return lines.map(l => {
      const spk = l.speaker ? `<span class="spk">${esc(l.speaker)}:</span> ` : '';
      let body = esc(l.text);
      if(l.qids && l.qids.length){
        const tags = l.qids.map(q => `<span class="qtag">Q${q}</span>`).join('');
        let jumpBtn = '';
        if(typeof l.time_seconds === 'number'){
          jumpBtn = `<button type="button" class="jump-btn" data-action="jump-audio" data-part="${part.part}" data-time="${l.time_seconds}" title="Jump to ${fmtTime(l.time_seconds)}">\u25b6 ${fmtTime(l.time_seconds)}</button>`;
        }
        body = `${jumpBtn}<mark class="hl">${body}</mark>${tags}`;
      }
      return `<p class="script-line">${spk}${body}</p>`;
    }).join('');
  }

  function buildExplanationsHtml(part){
    let html = '';
    const qids = [];
    if(part.kind === 'notes'){
      Object.keys(part.answers).sort((a,b)=>a-b).forEach(q=>qids.push(q));
    } else {
      part.groups.forEach(g=>g.qids.forEach(q=>qids.push(q)));
      qids.sort((a,b)=>a-b);
    }
    for(const q of qids){
      const e = part.explanations[q] || {};
      const ans = part.answers[q] || '';
      html += `<div class="expl-item"><div class="eq-head"><span class="qnum">C\u00e2u ${q}</span><span class="ans">${ans}</span></div>`;
      if(e.quote){
        html += `<div class="quote">"${e.quote.replace(/</g,'&lt;')}"</div>`;
      }
      html += `<div class="explain">${(e.explain||'').replace(/</g,'&lt;')}</div></div>`;
    }
    return html;
  }

  function gradeParts(part){
    let correct = 0, total = 0;
    if(part.kind === 'notes'){
      for(const [q, ans] of Object.entries(part.answers)){
        total++;
        const input = partsEl.querySelector(`input.blank[data-part="${part.part}"][data-q="${q}"]`);
        if(!input) continue;
        const val = input.value.trim().toLowerCase();
        const ok = val === String(ans).trim().toLowerCase();
        input.classList.remove('correct','incorrect');
        input.classList.add(ok ? 'correct' : 'incorrect');
        if(ok) correct++;
        if(!ok){
          input.title = `Correct answer: ${ans}`;
        }
      }
    } else {
      for(const g of part.groups){
        if(g.type === 'matching'){
          for(const s of g.stems){
            total++;
            const sel = partsEl.querySelector(`.part[data-part="${part.part}"] select[data-q="${s.qid}"]`);
            if(!sel) continue;
            const correctLetter = part.answers[s.qid];
            const ok = sel.value === correctLetter;
            sel.classList.remove('correct','incorrect');
            sel.classList.add(ok ? 'correct' : 'incorrect');
            if(ok) correct++;
            else sel.title = `Correct answer: ${correctLetter}`;
          }
          continue;
        }
        const groupEl = partsEl.querySelector(`.part[data-part="${part.part}"] .qgroup[data-qids="${g.qids.join(',')}"]`);
        if(!groupEl) continue;
        const inputs = groupEl.querySelectorAll('input');
        const correctLetters = g.qids.map(q => part.answers[q]);
        const selected = Array.from(inputs).filter(i=>i.checked).map(i=>i.value);
        groupEl.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','incorrect'));
        inputs.forEach(inp=>{
          const label = inp.closest('.opt');
          const letter = label.dataset.letter;
          if(correctLetters.includes(letter)) label.classList.add('correct');
          else if(inp.checked) label.classList.add('incorrect');
        });
        if(g.multi){
          total += g.qids.length;
          const sortedSel = [...selected].sort();
          const sortedCorrect = [...correctLetters].sort();
          if(sortedSel.length===sortedCorrect.length && sortedSel.every((v,i)=>v===sortedCorrect[i])){
            correct += g.qids.length;
          } else {
            correctLetters.forEach(cl=>{ if(selected.includes(cl)) correct++; });
          }
        } else {
          total += 1;
          if(selected[0] === correctLetters[0]) correct += 1;
        }
      }
    }
    return {correct, total};
  }

  function renderPart(part, idx){
    const wrap = document.createElement('div');
    wrap.className = 'part' + (idx===0 ? ' active' : '');
    wrap.dataset.part = part.part;

    const card = document.createElement('div');
    card.className = 'card';
    let inner = `<div class="part-bar"><span>PART ${part.part}${part.title ? ' — ' + part.title : ''}</span><span class="title">${part.kind==='notes'?'Note Completion':'Multiple Choice'}</span></div>`;
    inner += `<div class="card-body">`;
    if(part.instructions) inner += `<div class="instructions">${part.instructions}</div>`;
    inner += `<div class="audio-box"><span class="icon">\ud83c\udfa7</span><span class="label">Part ${part.part} Audio</span><audio controls preload="none" src="${part.audio}"></audio></div>`;
    inner += part.kind === 'notes' ? renderNotes(part) : renderMcq(part);
    inner += `<div class="actions">
        <button class="primary" data-action="check">Check Answers</button>
        <button class="ghost" data-action="reset">Reset</button>
        <span class="score-pill" data-role="score" style="display:none;"></span>
      </div>
      <div class="actions" style="margin-top:0;">
        <button class="ghost" data-action="toggle-script">Show Script</button>
        <button class="ghost" data-action="toggle-expl">Show Answers &amp; Explanations</button>
      </div>
      <div class="toggle-section" data-role="script-section">
        <h2 style="font-size:15px;color:var(--navy);">Full Script — Part ${part.part}</h2>
        <p class="script-note">Listen and follow along below — highlighted lines show where each answer is said${part.script_full && part.script_full.some(l=>typeof l.time_seconds==='number') ? '; tap a time button to jump straight there.' : '.'}</p>
        <div class="audio-box"><span class="icon">\ud83c\udfa7</span><span class="label">Part ${part.part} Audio</span><audio controls preload="none" src="${part.audio}" data-role="script-audio"></audio></div>
        <div class="script-text">${buildScriptHtml(part)}</div>
      </div>
      <div class="toggle-section" data-role="expl-section">
        <h2 style="font-size:15px;color:var(--navy);">Answers &amp; Explanations — Part ${part.part}</h2>
        ${buildExplanationsHtml(part)}
      </div>
      </div>`;
    card.innerHTML = inner;
    wrap.appendChild(card);

    card.querySelectorAll('.qgroup[data-multi="true"]').forEach(groupEl => {
      const boxes = Array.from(groupEl.querySelectorAll('input[type="checkbox"]'));
      if(!boxes.length) return;
      const max = parseInt(boxes[0].dataset.max, 10) || 2;
      const sync = () => {
        const checkedCount = boxes.filter(b=>b.checked).length;
        boxes.forEach(b => { if(!b.checked) b.disabled = checkedCount >= max; });
      };
      boxes.forEach(b => b.addEventListener('change', sync));
    });

    card.querySelector('[data-action="check"]').addEventListener('click', () => {
      const {correct, total} = gradeParts(part);
      const pill = card.querySelector('[data-role="score"]');
      pill.style.display = 'inline-block';
      pill.textContent = `Score: ${correct} / ${total}`;
      const tabBtn = tabsEl.querySelector(`[data-tab="${part.part}"]`);
      if(tabBtn) tabBtn.classList.add('done');
    });
    card.querySelector('[data-action="reset"]').addEventListener('click', () => {
      card.querySelectorAll('input[type="text"]').forEach(i=>{i.value='';i.classList.remove('correct','incorrect');i.title='';});
      card.querySelectorAll('input[type="radio"],input[type="checkbox"]').forEach(i=>{i.checked=false;i.disabled=false;});
      card.querySelectorAll('select').forEach(s=>{s.value='';s.classList.remove('correct','incorrect');s.title='';});
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','incorrect'));
      card.querySelector('[data-role="score"]').style.display='none';
      const tabBtn = tabsEl.querySelector(`[data-tab="${part.part}"]`);
      if(tabBtn) tabBtn.classList.remove('done');
    });
    card.querySelector('[data-action="toggle-script"]').addEventListener('click', (e) => {
      const sec = card.querySelector('[data-role="script-section"]');
      sec.classList.toggle('open');
      e.target.textContent = sec.classList.contains('open') ? 'Hide Script' : 'Show Script';
    });
    card.querySelector('[data-action="toggle-expl"]').addEventListener('click', (e) => {
      const sec = card.querySelector('[data-role="expl-section"]');
      sec.classList.toggle('open');
      e.target.textContent = sec.classList.contains('open') ? 'Hide Answers & Explanations' : 'Show Answers & Explanations';
    });
    card.querySelectorAll('[data-action="jump-audio"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const t = Number(btn.dataset.time) || 0;
        const audio = card.querySelector('[data-role="script-audio"]');
        if(!audio) return;
        audio.currentTime = t;
        audio.play();
      });
    });

    return wrap;
  }

  TEST_DATA.parts.forEach((part, idx) => {
    const tabBtn = document.createElement('button');
    tabBtn.className = 'tab-btn' + (idx===0 ? ' active' : '');
    tabBtn.dataset.tab = part.part;
    tabBtn.innerHTML = `<span class="dot"></span>Part ${part.part}`;
    tabBtn.addEventListener('click', () => {
      partsEl.querySelectorAll('audio').forEach(a => { a.pause(); });
      tabsEl.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      partsEl.querySelectorAll('.part').forEach(p=>p.classList.remove('active'));
      tabBtn.classList.add('active');
      partsEl.querySelector(`.part[data-part="${part.part}"]`).classList.add('active');
      window.scrollTo({top:0, behavior:'smooth'});
    });
    tabsEl.appendChild(tabBtn);
    partsEl.appendChild(renderPart(part, idx));
  });
})();
</script>
</body>
</html>
