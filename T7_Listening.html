xt to Questions 25-30.\nComments about the development of the equipment\nA It could cause excessive sweating.\nB The material was being mass produced for another purpose.\nC People often needed to make their own.\nD It often had to be replaced.\nE The material was expensive.\nF It was unpopular among spectators.\nG It caused injuries.\nH No one ring it liked it at first.\nItems of sporting equipment\n28 the golf club ...\nKeywords được paraphrase:\nIt often had to be replaced - it would be easily break and players had to get another\nGiải thích đáp án:\nĐoạn hội thoại trên chỉ ra rằng, ông cố của Thomas nói rằng, cây gậy được làm hoàn toàn bằng gỗ nên có thể dễ bị gãy và phải thay cây mới. Vậy đáp án là D"}, "29": {"answer_label": "29. C", "quote": "JEANNE: I don't think so because players still use wooden sticks today. What it does say here, though, is that when the game started you had to produce a stick yourself", "explain": "Câu hỏi:\nWhat comment do the students make about the development of each of the following items of sporting equipment?\nChoose SIX answers from the box and write the correct letter, A-H, next to Questions 25-30.\nComments about the development of the equipment\nA It could cause excessive sweating.\nB The material was being mass produced for another purpose.\nC People often needed to make their own.\nD It often had to be replaced.\nE The material was expensive.\nF It was unpopular among spectators.\nG It caused injuries.\nH No one ring it liked it at first.\nItems of sporting equipment\n29 the hockey stick ...\nKeywords được paraphrase:\nYou had to produce a stick yourself - people often needed to make their own\nGiải thích đáp án:\nĐoạn hội thoại trên chỉ ra rằng, Khi trận đấu bắt đầu, bạn phải tự tạo ra một cây gậy của mình. Vậy đáp án là C"}, "30": {"answer_label": "30. G", "quote": "You can imagine the damage to player's necks when the ball was headed", "explain": "Câu hỏi:\nWhat comment do the students make about the development of each of the following items of sporting equipment?\nChoose SIX answers from the box and write the correct letter, A-H, next to Questions 25-30.\nComments about the development of the equipment\nA It could cause excessive sweating.\nB The material was being mass produced for another purpose.\nC People often needed to make their own.\nD It often had to be replaced.\nE The material was expensive.\nF It was unpopular among spectators.\nG It caused injuries.\nH No one ring it liked it at first.\nItems of sporting equipment\n30 the football ...\nKeywords được paraphrase:\ninjuries - damage\nGiải thích đáp án:\nĐoạn hội thoại trên chỉ ra rằng, Khi trận đấu bắt đầu, bạn phải tự tạo ra một cây gậy của mình. Vậy đáp án là G"}}, "script_full": [{"speaker": "JEANNE", "text": "Hi Thomas, how are you enjoying the course so far?", "qids": []}, {"speaker": "THOMAS", "text": "Yeah, I think it's good.", "qids": []}, {"speaker": "JEANNE", "text": "Remind me - why did you decide to study sports science? Didn't you want to be a professional athlete when you were at school?", "qids": []}, {"speaker": "THOMAS", "text": "Yeah - that was my goal, and all my classmates assumed I would achieve it; they thought I was brilliant.", "qids": ["21", "22"]}, {"speaker": "JEANNE", "text": "That must have been a nice feeling.", "qids": []}, {"speaker": "THOMAS", "text": "Mm, I thought I could win anything. There was no one who could run faster than me.", "qids": []}, {"speaker": "JEANNE", "text": "Exactly - so what happened? Did your mum and dad want you to be more 'academic'?", "qids": []}, {"speaker": "THOMAS", "text": "Not at all. Perhaps they should have pushed me harder, though.", "qids": ["21", "22"]}, {"speaker": "JEANNE", "text": "What do you mean?", "qids": []}, {"speaker": "THOMAS", "text": "I think I should have practised more.", "qids": []}, {"speaker": "JEANNE", "text": "What makes you say that?", "qids": []}, {"speaker": "THOMAS", "text": "Well, I went out to Kenya for a couple of weeks to train -", "qids": ["23", "24"]}, {"speaker": "JEANNE", "text": "Really! I didn't know that.", "qids": []}, {"speaker": "THOMAS", "text": "I was chosen to go there out of loads of kids and run with some of the top teenage athletes in the world. And... I was so calm about it. I just kept thinking how fortunate I was. What a great chance this was! Everyone back home was so proud of me. But once we started competing, I very quickly realised I wasn't good enough.", "qids": ["23", "24"]}, {"speaker": "JEANNE", "text": "That must have been a huge shock.", "qids": []}, {"speaker": "THOMAS", "text": "I thought 'this can't be happening'! I was used to winning.", "qids": []}, {"speaker": "JEANNE", "text": "I'm sorry to hear that.", "qids": []}, {"speaker": "THOMAS", "text": "It's OK. I'm over it now and I think it's much better to do a university course and this one has such a variety of sports-related areas. It's going to be good.", "qids": []}, {"speaker": "JEANNE", "text": "Oh, I agree I chose it because of that.", "qids": []}, {"speaker": "THOMAS", "text": "So Jeanne - have you thought of any ideas for the discussion session next week on technology and sport?", "qids": []}, {"speaker": "JEANNE", "text": "We have to cover more than one sport, don't we?", "qids": []}, {"speaker": "THOMAS", "text": "Yeah.", "qids": []}, {"speaker": "JEANNE", "text": "You know we always think technology is about the future, but we could gather some ideas about past developments in sport.", "qids": []}, {"speaker": "THOMAS", "text": "Look at early types of equipment perhaps?", "qids": []}, {"speaker": "JEANNE", "text": "Uh, I remember reading something about table tennis bats once how they ended up being covered with pimpled rubber.", "qids": []}, {"speaker": "THOMAS", "text": "Cos they were just wooden at first, I'd imagine.", "qids": []}, {"speaker": "JEANNE", "text": "Yeah. In about the 1920s, a factory was making rolls of the rubber in bulk for something like horse harnesses.", "qids": []}, {"speaker": "THOMAS", "text": "!", "qids": []}, {"speaker": "JEANNE", "text": "Yeah and someone realised that it'd make a perfect covering for the wooden bats.", "qids": ["25"]}, {"speaker": "THOMAS", "text": "So what about cricket - that's had a few innovative changes. Maybe the pads they wear on their legs?", "qids": []}, {"speaker": "JEANNE", "text": "I don't think they've changed much but, I'm just looking on the internet... and it says that when the first cricket helmet came in, in 1978, the Australian batsman who first wore it was booed and jeered by people watching because it was so ugly!", "qids": ["26"]}, {"speaker": "THOMAS", "text": "Wow, players have to protect themselves from getting hurt! I mean everyone wears one now. Really", "qids": []}, {"speaker": "THOMAS", "text": "Mm, unlike the cycle helmet.", "qids": []}, {"speaker": "JEANNE", "text": "Well, unless you're a professional, but you're right, many ordinary bikers don't wear a helmet.", "qids": []}, {"speaker": "THOMAS", "text": "Hey, look at these pictures of original helmet designs. This one looks like an upside-down bowl!!", "qids": []}, {"speaker": "JEANNE", "text": "Yet, the woman's laughing - she's so proud to be wearing it!", "qids": []}, {"speaker": "THOMAS", "text": "It says serious cyclists ended up with wet hair from all the hard exercise.", "qids": []}, {"speaker": "JEANNE", "text": "I guess that's why they have large air vents in them now so that the skin can breathe more easily.", "qids": ["27"]}, {"speaker": "THOMAS", "text": "OK, so we've done helmets. What about golf balls or better still golf clubs - they've changed a lot.", "qids": []}, {"speaker": "JEANNE", "text": "Yeah I remember my great grandfather telling me that because a club was made entirely of wood, it would easily break and players had to get another. There's no wood at all in them now, is there?", "qids": ["28"]}, {"speaker": "THOMAS", "text": "No - they're much more powerful.", "qids": []}, {"speaker": "JEANNE", "text": "The same must be true of hockey sticks.", "qids": []}, {"speaker": "THOMAS", "text": "I don't think so because players still use wooden sticks today. What it does say here, though, is that when the game started you had to produce a stick yourself. I guess they just weren't being manufactured. So, one more perhaps. What about football?", "qids": ["29"]}, {"speaker": "JEANNE", "text": "Well, I know the first balls were made of animal skin.", "qids": []}, {"speaker": "THOMAS", "text": "Yeah, they covered them with pieces of leather that were stitched together, but ... the balls let in water when it rained.", "qids": []}, {"speaker": "JEANNE", "text": "Oh, that would have made them much heavier.", "qids": []}, {"speaker": "THOMAS", "text": "That's right. You can imagine the damage to players' necks when the ball was headed. How painful that must have been!", "qids": ["30"]}, {"speaker": "JEANNE", "text": "Yeah, well, I think we can put together some useful ideas", "qids": []}], "groups": [{"type": "choice", "qids": ["21", "22"], "prompt": "Which TWO points do Thomas and Jeanne make about Thomas’s sporting activities at school?", "options": {"A": "He should have felt more positive about them.", "B": "The training was too challenging for him.", "C": "He could have worked harder at them.", "D": "His parents were disappointed in him.", "E": "His fellow students admired him."}, "multi": true, "header": "Questions 21 and 22 Choose TWO letters, A-E."}, {"type": "choice", "qids": ["23", "24"], "prompt": "Which TWO feelings did Thomas experience when he was in Kenya?", "options": {"A": "disbelief", "B": "relief", "C": "stress", "D": "gratitude", "E": "homesickness"}, "multi": true, "header": "Questions 23 and 24 Choose TWO letters, A-E."}, {"type": "matching", "qids": ["25", "26", "27", "28", "29", "30"], "box_title": "Comments about the development of the equipment", "box": {"A": "It could cause excessive sweating.", "B": "The material was being mass produced for another purpose.", "C": "People often needed to make their own.", "D": "It often had to be replaced.", "E": "The material was expensive.", "F": "It was unpopular among spectators.", "G": "It caused injuries.", "H": "No one ring it liked it at first."}, "stems": [{"qid": "25", "prompt": "the table tennis bat"}, {"qid": "26", "prompt": "the cricket helmet"}, {"qid": "27", "prompt": "the cycle helmet"}, {"qid": "28", "prompt": "the golf club"}, {"qid": "29", "prompt": "the hockey stick"}, {"qid": "30", "prompt": "the football"}], "header": "Choose SIX answers from the box and write the correct letter, A-H, next to Questions 25-30."}]}, {"part": 4, "kind": "notes", "title": "Victor Hugo", "instructions": null, "audio": "audio/test7/part4.mp3", "answers": {"31": "plot", "32": "poverty", "33": "Europe", "34": "poetry", "35": "drawings", "36": "furniture", "37": "lamps", "38": "harbour/harbor", "39": "children", "40": "relatives"}, "explanations": {"31": {"answer_label": "31", "quote": "We know more about its overall plot than about its author.", "explain": "Chúng ta đã biết về kịch bản này rõ hơn tác giá\nParaphrase: overall ~ general"}, "32": {"answer_label": "32", "quote": "He spoke publicly about social issues, such as porverty and education.", "explain": "Tác giá đã diễn thuyết nhiều về vấn đề nghèo đói và giáo dục vì ông ấy thấy sự cẩn thiết cho sự thay đổi"}, "33": {"answer_label": "33", "quote": "Victor Hugo had to live elsewhere in Europe", "explain": "Tác giả đã bị hoàng đế Napoléon III lưu đày, buộc phải chuyển đến Châu Âu."}, "34": {"answer_label": "34", "quote": "He used his income from the sale of some poetry he had written to buy a house on Guernsey.", "explain": "Ông ấy đã bán bộ sưu tập tác phẩm văn thơ của mình để kiếm tiền mua nhà."}, "35": {"answer_label": "35", "quote": "The ground floor contains portraits, drawings and tapestries that he valued.", "explain": "Ở tầng trệt nhà ông, ông treo những bước chân dung, hình vẽ được rất quan trọng với ông\nParaphrase: important ~ value"}, "36": {"answer_label": "36", "quote": "He bought cheap furniture made of wood", "explain": "Ông đã mua những nội thất bằng gỗ tối màu ở chợ để trang trí lên những bức tường"}, "37": {"answer_label": "37", "quote": "The first floor consists of furnished areas with wallpaper and lamps that have a Chinese design.", "explain": "Ảnh hưởng bởi văn hóa Trung Quốc, hoa văn giấy dán tường và đèn ngủ của tác giả được đặt ở tầng 1, nơi ông tiếp khách."}, "38": {"answer_label": "38", "quote": "He wrote in a room at the top of the house that had a view of the Harbour /harbor", "explain": "Ở trên đỉnh tòa nhà, phòng “Nhìn ra ngoài” có tấm nhìn ra bến tàu"}, "39": {"answer_label": "39", "quote": "He entertained other writers as well as poor children in his house.", "explain": "Bên cạnh những nhà văn nổi tiếng, ông còn mời những đứa trẻ nghèo ở địa phương đến ăn tối.\nParaphrase: poor children ~ children from the deprived areas (những đứa trẻ ở vùng khó khăn)"}, "40": {"answer_label": "40", "quote": "Victor Hugo’s relatives gave ownership of the house to the city of Paris in 1927.", "explain": "Vào năm 1927, họ hàng của tác giả đã được trao quyền sở hữu nhà ở Paris, và sau đó ngôi nhà đã được biến thành bảo tàng."}, "1927": {"answer_label": "The person I’ve chosen to talk about is the French writer Victor Hugo - many people have heard of him because his novel, Les Misérables, which he wrote in 1862, is famous around the world. It became a stage musical in the 1980s, and a film version was also released in 2012. So, some of us, I’m sure, have a pretty general idea of the plot, but we know much less about the author (Q31). Today, I’m going to provide a little more insight into this talented man and I’m going to talk particularly about the home he had on the Island of Guernsey in the British Channel Islands.\n\nBut first, his early career... as I’ve said, he was a writer, he was at the height of his career in Paris and he was very highly regarded by his colleagues. As far as literature was concerned, he was the leading figure of the Romantic movement. However, as well as being a literary genius, he also gave many speeches about issues like the level of poverty (Q32) in his society. He felt very strongly about this and about other areas where change was needed, like education. This kind of outspoken criticism was not well liked by the rulers of France and, eventually, the emperor - Napoleon III - told Victor Hugo to leave Paris and not return; in other words, he sent him into exile.\n\nSo Victor Hugo was forced to reside in other parts of Europe (Q33). Guernsey was actually his third place of exile and he landed there in 1855. He produced a lot while on Guernsey - including Les Misérables - and to do this, he had to spend a great deal of time in the home that he had there. This was a property that he bought using the money he’d made in France from the publication of a collection of his poetry (Q34). It was the only property he ever owned, and he was very proud of it.\n_______________\nThe property Victor Hugo bought on Guernsey was a large, five-story house in the capital town of St Peter Port and he lived there for 15 years, returning to France in 1870 when Napoleon’s Empire collapsed. He decorated and furnished each level, or floor, of the house in unique and wonderful ways, and many people consider the inside of the house to be a ‘work of art’. Today it’s a museum that attracts 200,000 visitors a year.\nHe lived in the house with his family ... and portraits of its members still hang in rooms on the ground floor, along with drawings (Q35) that he did during his travels that he felt were important to him. In other ground-floor rooms, there are huge tapestries that he would have designed and loved. The walls are covered in dark wood paneling that Victor Hugo created himself using wooden furniture that he bought in the market (Q36). The items were relatively inexpensive, and he used them to create intricate carvings. They gave an atmosphere on the lower level that was shadowy and rather solemn.\n\n\n\nOn the next level of the house there are two impressive lounges, where he entertained his guests. One lounge has entirely red furnishings, such as sofas and wall coverings, and the other blue. There’s a strong Chinese influence in these areas in things like the wallpaper pattern and the lamps (Q37) - which he would have made himself by copying original versions.\n\nHis library, where he left many of his favourite books, forms the hallway to the third floor and was a comfortable area where he could relax and enjoy his afternoons. And then, at the very top of the house, there’s a room called the Lookout - called that because it looks out over the harbour (Q38). In contrast to the rather dark lower levels, it's full of light and was like a glass office where he would write until lunchtime - often at his desk.\n\nSo, Victor Hugo was a man of many talents, but he was also true to his values. While living in his house on Guernsey, he entertained many other famous writers, but he also invited a large group of local children from the deprived areas of the island to dinner once a week (Q39). What’s more, he served them their food, which was an extraordinary gesture for the time period.\nIn 1927, the house was owned bv his relatives, and they decided to donate it to the city of Paris (Q40). It has since been restored using photographs from the period and, as I mentioned earlier, is now a museum that is open to the public.", "quote": "The person I’ve chosen to talk about is the French writer Victor Hugo - many people have heard of him because his novel, Les Misérables, which he wrote in 1862, is famous around the world. It became a stage musical in the 1980s, and a film version was also released in 2012. So, some of us, I’m sure, have a pretty general idea of the plot, but we know much less about the author (Q31). Today, I’m going to provide a little more insight into this talented man and I’m going to talk particularly about the home he had on the Island of Guernsey in the British Channel Islands.\n\nBut first, his early career... as I’ve said, he was a writer, he was at the height of his career in Paris and he was very highly regarded by his colleagues. As far as literature was concerned, he was the leading figure of the Romantic movement. However, as well as being a literary genius, he also gave many speeches about issues like the level of poverty (Q32) in his society. He felt very strongly about this and about other areas where change was needed, like education. This kind of outspoken criticism was not well liked by the rulers of France and, eventually, the emperor - Napoleon III - told Victor Hugo to leave Paris and not return; in other words, he sent him into exile.\n\nSo Victor Hugo was forced to reside in other parts of Europe (Q33). Guernsey was actually his third place of exile and he landed there in 1855. He produced a lot while on Guernsey - including Les Misérables - and to do this, he had to spend a great deal of time in the home that he had there. This was a property that he bought using the money he’d made in France from the publication of a collection of his poetry (Q34). It was the only property he ever owned, and he was very proud of it.\n_______________\nThe property Victor Hugo bought on Guernsey was a large, five-story house in the capital town of St Peter Port and he lived there for 15 years, returning to France in 1870 when Napoleon’s Empire collapsed. He decorated and furnished each level, or floor, of the house in unique and wonderful ways, and many people consider the inside of the house to be a ‘work of art’. Today it’s a museum that attracts 200,000 visitors a year.\nHe lived in the house with his family ... and portraits of its members still hang in rooms on the ground floor, along with drawings (Q35) that he did during his travels that he felt were important to him. In other ground-floor rooms, there are huge tapestries that he would have designed and loved. The walls are covered in dark wood paneling that Victor Hugo created himself using wooden furniture that he bought in the market (Q36). The items were relatively inexpensive, and he used them to create intricate carvings. They gave an atmosphere on the lower level that was shadowy and rather solemn.\n\n\n\nOn the next level of the house there are two impressive lounges, where he entertained his guests. One lounge has entirely red furnishings, such as sofas and wall coverings, and the other blue. There’s a strong Chinese influence in these areas in things like the wallpaper pattern and the lamps (Q37) - which he would have made himself by copying original versions.\n\nHis library, where he left many of his favourite books, forms the hallway to the third floor and was a comfortable area where he could relax and enjoy his afternoons. And then, at the very top of the house, there’s a room called the Lookout - called that because it looks out over the harbour (Q38). In contrast to the rather dark lower levels, it's full of light and was like a glass office where he would write until lunchtime - often at his desk.\n\nSo, Victor Hugo was a man of many talents, but he was also true to his values. While living in his house on Guernsey, he entertained many other famous writers, but he also invited a large group of local children from the deprived areas of the island to dinner once a week (Q39). What’s more, he served them their food, which was an extraordinary gesture for the time period.\nIn 1927, the house was owned bv his relatives, and they decided to donate it to the city of Paris (Q40). It has since been restored using photographs from the period and, as I mentioned earlier, is now a museum that is open to the public.", "explain": "Người mà tôi chọn để nói đến là nhà văn Pháp Victor Hugo - nhiều người biết đến ông vì cuốn tiểu thuyết Những người khốn khổ của ông viết năm 1862 đã nổi tiếng khắp thế giới. Nó đã trở thành một vở nhạc kịch sân khấu vào những năm 1980, và một phiên bản điện ảnh cũng được phát hành vào năm 2012. Vì vậy, tôi chắc chắn rằng một số người trong chúng ta có ý tưởng khá chung chung về cốt truyện, nhưng chúng ta biết về tác giả thì ít hơn nhiều (Q31). Hôm nay, tôi sẽ cung cấp thêm một chút thông tin chi tiết về người đàn ông tài năng này và tôi sẽ đặc biệt nói về ngôi nhà mà anh ấy có trên Đảo Guernsey thuộc Quần đảo Channel của Anh.\nNhưng trước tiên, sự nghiệp ban đầu của ông ấy... như tôi đã nói, ông ấy là một nhà văn, ông ấy đang ở đỉnh cao của sự nghiệp ở Paris và ông ấy rất được đồng nghiệp đánh giá cao. Về mặt văn học, ông là nhân vật hàng đầu của phong trào Lãng mạn. Tuy nhiên, ngoài việc là một thiên tài văn học, ông còn có nhiều bài phát biểu về các vấn đề như mức độ nghèo đói (Q32) trong xã hội của mình. Ông ấy cảm thấy rất rõ ràng về điều này và về những lĩnh vực khác cần thay đổi, chẳng hạn như giáo dục. Kiểu chỉ trích thẳng thắn này không được các nhà cai trị nước Pháp ưa thích và cuối cùng, hoàng đế - Napoléon III - đã yêu cầu Victor Hugo rời Paris và không được quay lại; nói cách khác, anh ta đã gửi ông ấy đi lưu vong.\nVì vậy, Victor Hugo buộc phải cư trú ở các vùng khác của Châu Âu (Q33). Guernsey thực sự là nơi lưu vong thứ ba của ông và ông đến đó vào năm 1855. Ông đã sản xuất rất nhiều khi ở Guernsey - bao gồm cả Les Misérables - và để làm được điều này, ông đã phải dành rất nhiều thời gian trong ngôi nhà mà ông đã có ở đó. Đây là tài sản mà ông ấy đã mua bằng số tiền ông ấy kiếm được ở Pháp từ việc xuất bản một tập thơ của ông ấy (Q34). Đó là tài sản duy nhất mà ông ấy từng sở hữu, và ông ấy rất tự hào về nó.\n_______________\nCơ ngơi mà Victor Hugo mua ở Guernsey là một ngôi nhà lớn, năm tầng ở thủ đô St Peter Port và ông sống ở đó 15 năm, trở về Pháp năm 1870 khi Đế chế Napoléon sụp đổ. Ông đã trang trí và trang bị nội thất cho từng tầng của ngôi nhà theo những cách độc đáo và tuyệt vời, và nhiều người coi bên trong ngôi nhà là một 'tác phẩm nghệ thuật'. Ngày nay, nó là một bảo tàng thu hút 200.000 du khách mỗi năm.\n\nÔng ấy sống trong ngôi nhà với gia đình của mình ... và chân dung của các thành viên trong ngôi nhà vẫn được treo trong các phòng ở tầng trệt, cùng với những bức vẽ (Q35) mà ông ấy đã thực hiện trong chuyến du lịch mà ông ấy cảm thấy quan trọng đối với ông ấy. Trong các phòng ở tầng trệt khác, có những tấm thảm khổng lồ mà ông ấy đã thiết kế và yêu thích. Các bức tường được bao phủ bởi những tấm gỗ tối màu mà Victor Hugo đã tự tạo ra bằng cách sử dụng đồ nội thất bằng gỗ mà ông đã mua ở chợ (Q36). Những món đồ này tương đối rẻ và ông ấy đã sử dụng chúng để tạo ra những tác phẩm chạm khắc phức tạp. Họ đã tạo ra một bầu không khí ở cấp độ thấp hơn là bóng tối và khá trang trọng.\nỞ tầng tiếp theo của ngôi nhà có hai sảnh khách ấn tượng, nơi ông tiếp đãi khách của mình. Một sảnh có đồ nội thất hoàn toàn màu đỏ, chẳng hạn như ghế sofa và giấy dán tường, còn phòng kia có màu xanh lam. Có một ảnh hưởng mạnh mẽ của Trung Quốc trong những lĩnh vực này trong những thứ như hoa văn giấy dán tường và đèn (Q37) - những thứ mà ông ấy đã tự làm bằng cách sao chép các phiên bản gốc.\nThư viện của ông ấy, nơi ông ấy để lại nhiều cuốn sách yêu thích của mình, tạo thành hành lang lên tầng ba và là một khu vực thoải mái để ông ấy có thể thư giãn và tận hưởng những buổi chiều của mình. Và sau đó, ở trên cùng của ngôi nhà, có một căn phòng tên là Lookout - được gọi như vậy bởi vì nó nhìn ra bến cảng (Q38). Trái ngược với các tầng thấp hơn khá tối, nó tràn ngập ánh sáng và giống như một văn phòng bằng kính, nơi ông ấy sẽ viết cho đến giờ ăn trưa - thường là tại bàn làm việc của ông ấy.\nVậy, Victor Hugo là một người đa tài, nhưng ông cũng sống đúng với giá trị của mình. Khi sống trong ngôi nhà của mình ở Guernsey, ông ấy đã chiêu đãi nhiều nhà văn nổi tiếng khác, nhưng ông ấy cũng mời một nhóm lớn trẻ em địa phương từ những khu vực thiếu thốn của hòn đảo đến ăn tối mỗi tuần một lần (Q39). Hơn nữa, ông ấy đã phục vụ thức ăn cho họ, đó là một cử chỉ phi thường trong khoảng thời gian đó.\nNăm 1927, ngôi nhà thuộc sở hữu của người thân của ông, và họ quyết định tặng nó cho thành phố Paris (Q40). Kể từ đó, nó đã được khôi phục bằng cách sử dụng các bức ảnh từ thời kỳ đó và, như tôi đã đề cập trước đó, hiện là một bảo tàng mở cửa cho công chúng."}, "1": {"answer_label": "Victor Hugo\nTiểu thuyết Những người khốn khổ của ông\n• Nó đã được chuyển thể cho sân khấu và điện ảnh.\n• Chúng tôi biết nhiều về 31 ………………. tổng thể của nó hơn là về tác giả của nó.\nSự nghiệp ban đầu của ông ấy\n• Tại Paris, sự nghiệp của anh ấy thành công và anh ấy đã lãnh đạo phong trào Lãng mạn.\n• Ông đã nói chuyện công khai về các vấn đề xã hội, chẳng hạn như 32 ……….………. và giáo dục.\n• Napoléon III không thích quan điểm của ông và lưu đày ông.\nÔng lưu vong từ Pháp\n• Victor Hugo phải sống ở nơi khác vào năm 33 …………………\n• Anh ấy đã sử dụng thu nhập từ việc bán một vài 34 ……..………….. mà anh ấy đã viết cho mua nhà ở Guernsey.\nNgôi nhà của ông ấy ở Guernsey\n• Victor Hugo sống trong ngôi nhà này cho đến khi kết thúc Đế chế ở Pháp.\n• Tầng trệt chứa các bức chân dung, 35………………… và tấm thảm mà ông đánh giá cao.\n• Ông ấy đã mua 36……………. rẻ tiền làm bằng gỗ và biến cái này thành đẹp chạm khắc tường.\n• Tầng 1 bao gồm các khu vực trang bị nội thất với giấy dán tường và 37 ………………… mà có một thiết kế Trung Quốc.\n• Thư viện vẫn chứa nhiều cuốn sách yêu thích của anh ấy.\n• Ông ấy đã viết trong một căn phòng ở trên cùng của ngôi nhà có tầm nhìn ra 38 ……………..\n• Ông ấy tiếp đãi những nhà văn khác cũng như những 39 ……………. nghèo trong ngôi nhà của anh ấy.\n• 40……………… của Victor Hugo đã trao quyền sở hữu ngôi nhà cho thành phố Paris vào năm 1927.", "quote": "", "explain": ""}, "1862": {"answer_label": "The person I’ve chosen to talk about is the French writer Victor Hugo - many people have heard of him because his novel, Les Misérables, which he wrote in 1862, is famous around the world. It became a stage musical in the 1980s, and a film version was also released in 2012. So, some of us, I’m sure, have a pretty general idea of the plot, but we know much less about the author (Q31). Today, I’m going to provide a little more insight into this talented man and I’m going to talk particularly about the home he had on the Island of Guernsey in the British Channel Islands.\n\nBut first, his early career... as I’ve said, he was a writer, he was at the height of his career in Paris and he was very highly regarded by his colleagues. As far as literature was concerned, he was the leading figure of the Romantic movement. However, as well as being a literary genius, he also gave many speeches about issues like the level of poverty (Q32) in his society. He felt very strongly about this and about other areas where change was needed, like education. This kind of outspoken criticism was not well liked by the rulers of France and, eventually, the emperor - Napoleon III - told Victor Hugo to leave Paris and not return; in other words, he sent him into exile.\n\nSo Victor Hugo was forced to reside in other parts of Europe (Q33). Guernsey was actually his third place of exile and he landed there in 1855. He produced a lot while on Guernsey - including Les Misérables - and to do this, he had to spend a great deal of time in the home that he had there. This was a property that he bought using the money he’d made in France from the publication of a collection of his poetry (Q34). It was the only property he ever owned, and he was very proud of it.\n_______________\nThe property Victor Hugo bought on Guernsey was a large, five-story house in the capital town of St Peter Port and he lived there for 15 years, returning to France in 1870 when Napoleon’s Empire collapsed. He decorated and furnished each level, or floor, of the house in unique and wonderful ways, and many people consider the inside of the house to be a ‘work of art’. Today it’s a museum that attracts 200,000 visitors a year.\nHe lived in the house with his family ... and portraits of its members still hang in rooms on the ground floor, along with drawings (Q35) that he did during his travels that he felt were important to him. In other ground-floor rooms, there are huge tapestries that he would have designed and loved. The walls are covered in dark wood paneling that Victor Hugo created himself using wooden furniture that he bought in the market (Q36). The items were relatively inexpensive, and he used them to create intricate carvings. They gave an atmosphere on the lower level that was shadowy and rather solemn.\n\n\n\nOn the next level of the house there are two impressive lounges, where he entertained his guests. One lounge has entirely red furnishings, such as sofas and wall coverings, and the other blue. There’s a strong Chinese influence in these areas in things like the wallpaper pattern and the lamps (Q37) - which he would have made himself by copying original versions.\n\nHis library, where he left many of his favourite books, forms the hallway to the third floor and was a comfortable area where he could relax and enjoy his afternoons. And then, at the very top of the house, there’s a room called the Lookout - called that because it looks out over the harbour (Q38). In contrast to the rather dark lower levels, it's full of light and was like a glass office where he would write until lunchtime - often at his desk.\n\nSo, Victor Hugo was a man of many talents, but he was also true to his values. While living in his house on Guernsey, he entertained many other famous writers, but he also invited a large group of local children from the deprived areas of the island to dinner once a week (Q39). What’s more, he served them their food, which was an extraordinary gesture for the time period.\nIn 1927, the house was owned bv his relatives, and they decided to donate it to the city of Paris (Q40). It has since been restored using photographs from the period and, as I mentioned earlier, is now a museum that is open to the public.", "quote": "The person I’ve chosen to talk about is the French writer Victor Hugo - many people have heard of him because his novel, Les Misérables, which he wrote in 1862, is famous around the world. It became a stage musical in the 1980s, and a film version was also released in 2012. So, some of us, I’m sure, have a pretty general idea of the plot, but we know much less about the author (Q31). Today, I’m going to provide a little more insight into this talented man and I’m going to talk particularly about the home he had on the Island of Guernsey in the British Channel Islands.\n\nBut first, his early career... as I’ve said, he was a writer, he was at the height of his career in Paris and he was very highly regarded by his colleagues. As far as literature was concerned, he was the leading figure of the Romantic movement. However, as well as being a literary genius, he also gave many speeches about issues like the level of poverty (Q32) in his society. He felt very strongly about this and about other areas where change was needed, like education. This kind of outspoken criticism was not well liked by the rulers of France and, eventually, the emperor - Napoleon III - told Victor Hugo to leave Paris and not return; in other words, he sent him into exile.\n\nSo Victor Hugo was forced to reside in other parts of Europe (Q33). Guernsey was actually his third place of exile and he landed there in 1855. He produced a lot while on Guernsey - including Les Misérables - and to do this, he had to spend a great deal of time in the home that he had there. This was a property that he bought using the money he’d made in France from the publication of a collection of his poetry (Q34). It was the only property he ever owned, and he was very proud of it.\n_______________\nThe property Victor Hugo bought on Guernsey was a large, five-story house in the capital town of St Peter Port and he lived there for 15 years, returning to France in 1870 when Napoleon’s Empire collapsed. He decorated and furnished each level, or floor, of the house in unique and wonderful ways, and many people consider the inside of the house to be a ‘work of art’. Today it’s a museum that attracts 200,000 visitors a year.\nHe lived in the house with his family ... and portraits of its members still hang in rooms on the ground floor, along with drawings (Q35) that he did during his travels that he felt were important to him. In other ground-floor rooms, there are huge tapestries that he would have designed and loved. The walls are covered in dark wood paneling that Victor Hugo created himself using wooden furniture that he bought in the market (Q36). The items were relatively inexpensive, and he used them to create intricate carvings. They gave an atmosphere on the lower level that was shadowy and rather solemn.\n\n\n\nOn the next level of the house there are two impressive lounges, where he entertained his guests. One lounge has entirely red furnishings, such as sofas and wall coverings, and the other blue. There’s a strong Chinese influence in these areas in things like the wallpaper pattern and the lamps (Q37) - which he would have made himself by copying original versions.\n\nHis library, where he left many of his favourite books, forms the hallway to the third floor and was a comfortable area where he could relax and enjoy his afternoons. And then, at the very top of the house, there’s a room called the Lookout - called that because it looks out over the harbour (Q38). In contrast to the rather dark lower levels, it's full of light and was like a glass office where he would write until lunchtime - often at his desk.\n\nSo, Victor Hugo was a man of many talents, but he was also true to his values. While living in his house on Guernsey, he entertained many other famous writers, but he also invited a large group of local children from the deprived areas of the island to dinner once a week (Q39). What’s more, he served them their food, which was an extraordinary gesture for the time period.\nIn 1927, the house was owned bv his relatives, and they decided to donate it to the city of Paris (Q40). It has since been restored using photographs from the period and, as I mentioned earlier, is now a museum that is open to the public.", "explain": "Người mà tôi chọn để nói đến là nhà văn Pháp Victor Hugo - nhiều người biết đến ông vì cuốn tiểu thuyết Những người khốn khổ của ông viết năm 1862 đã nổi tiếng khắp thế giới. Nó đã trở thành một vở nhạc kịch sân khấu vào những năm 1980, và một phiên bản điện ảnh cũng được phát hành vào năm 2012. Vì vậy, tôi chắc chắn rằng một số người trong chúng ta có ý tưởng khá chung chung về cốt truyện, nhưng chúng ta biết về tác giả thì ít hơn nhiều (Q31). Hôm nay, tôi sẽ cung cấp thêm một chút thông tin chi tiết về người đàn ông tài năng này và tôi sẽ đặc biệt nói về ngôi nhà mà anh ấy có trên Đảo Guernsey thuộc Quần đảo Channel của Anh.\nNhưng trước tiên, sự nghiệp ban đầu của ông ấy... như tôi đã nói, ông ấy là một nhà văn, ông ấy đang ở đỉnh cao của sự nghiệp ở Paris và ông ấy rất được đồng nghiệp đánh giá cao. Về mặt văn học, ông là nhân vật hàng đầu của phong trào Lãng mạn. Tuy nhiên, ngoài việc là một thiên tài văn học, ông còn có nhiều bài phát biểu về các vấn đề như mức độ nghèo đói (Q32) trong xã hội của mình. Ông ấy cảm thấy rất rõ ràng về điều này và về những lĩnh vực khác cần thay đổi, chẳng hạn như giáo dục. Kiểu chỉ trích thẳng thắn này không được các nhà cai trị nước Pháp ưa thích và cuối cùng, hoàng đế - Napoléon III - đã yêu cầu Victor Hugo rời Paris và không được quay lại; nói cách khác, anh ta đã gửi ông ấy đi lưu vong.\nVì vậy, Victor Hugo buộc phải cư trú ở các vùng khác của Châu Âu (Q33). Guernsey thực sự là nơi lưu vong thứ ba của ông và ông đến đó vào năm 1855. Ông đã sản xuất rất nhiều khi ở Guernsey - bao gồm cả Les Misérables - và để làm được điều này, ông đã phải dành rất nhiều thời gian trong ngôi nhà mà ông đã có ở đó. Đây là tài sản mà ông ấy đã mua bằng số tiền ông ấy kiếm được ở Pháp từ việc xuất bản một tập thơ của ông ấy (Q34). Đó là tài sản duy nhất mà ông ấy từng sở hữu, và ông ấy rất tự hào về nó.\n_______________\nCơ ngơi mà Victor Hugo mua ở Guernsey là một ngôi nhà lớn, năm tầng ở thủ đô St Peter Port và ông sống ở đó 15 năm, trở về Pháp năm 1870 khi Đế chế Napoléon sụp đổ. Ông đã trang trí và trang bị nội thất cho từng tầng của ngôi nhà theo những cách độc đáo và tuyệt vời, và nhiều người coi bên trong ngôi nhà là một 'tác phẩm nghệ thuật'. Ngày nay, nó là một bảo tàng thu hút 200.000 du khách mỗi năm.\n\nÔng ấy sống trong ngôi nhà với gia đình của mình ... và chân dung của các thành viên trong ngôi nhà vẫn được treo trong các phòng ở tầng trệt, cùng với những bức vẽ (Q35) mà ông ấy đã thực hiện trong chuyến du lịch mà ông ấy cảm thấy quan trọng đối với ông ấy. Trong các phòng ở tầng trệt khác, có những tấm thảm khổng lồ mà ông ấy đã thiết kế và yêu thích. Các bức tường được bao phủ bởi những tấm gỗ tối màu mà Victor Hugo đã tự tạo ra bằng cách sử dụng đồ nội thất bằng gỗ mà ông đã mua ở chợ (Q36). Những món đồ này tương đối rẻ và ông ấy đã sử dụng chúng để tạo ra những tác phẩm chạm khắc phức tạp. Họ đã tạo ra một bầu không khí ở cấp độ thấp hơn là bóng tối và khá trang trọng.\nỞ tầng tiếp theo của ngôi nhà có hai sảnh khách ấn tượng, nơi ông tiếp đãi khách của mình. Một sảnh có đồ nội thất hoàn toàn màu đỏ, chẳng hạn như ghế sofa và giấy dán tường, còn phòng kia có màu xanh lam. Có một ảnh hưởng mạnh mẽ của Trung Quốc trong những lĩnh vực này trong những thứ như hoa văn giấy dán tường và đèn (Q37) - những thứ mà ông ấy đã tự làm bằng cách sao chép các phiên bản gốc.\nThư viện của ông ấy, nơi ông ấy để lại nhiều cuốn sách yêu thích của mình, tạo thành hành lang lên tầng ba và là một khu vực thoải mái để ông ấy có thể thư giãn và tận hưởng những buổi chiều của mình. Và sau đó, ở trên cùng của ngôi nhà, có một căn phòng tên là Lookout - được gọi như vậy bởi vì nó nhìn ra bến cảng (Q38). Trái ngược với các tầng thấp hơn khá tối, nó tràn ngập ánh sáng và giống như một văn phòng bằng kính, nơi ông ấy sẽ viết cho đến giờ ăn trưa - thường là tại bàn làm việc của ông ấy.\nVậy, Victor Hugo là một người đa tài, nhưng ông cũng sống đúng với giá trị của mình. Khi sống trong ngôi nhà của mình ở Guernsey, ông ấy đã chiêu đãi nhiều nhà văn nổi tiếng khác, nhưng ông ấy cũng mời một nhóm lớn trẻ em địa phương từ những khu vực thiếu thốn của hòn đảo đến ăn tối mỗi tuần một lần (Q39). Hơn nữa, ông ấy đã phục vụ thức ăn cho họ, đó là một cử chỉ phi thường trong khoảng thời gian đó.\nNăm 1927, ngôi nhà thuộc sở hữu của người thân của ông, và họ quyết định tặng nó cho thành phố Paris (Q40). Kể từ đó, nó đã được khôi phục bằng cách sử dụng các bức ảnh từ thời kỳ đó và, như tôi đã đề cập trước đó, hiện là một bảo tàng mở cửa cho công chúng."}, "1980": {"answer_label": "The person I’ve chosen to talk about is the French writer Victor Hugo - many people have heard of him because his novel, Les Misérables, which he wrote in 1862, is famous around the world. It became a stage musical in the 1980s, and a film version was also released in 2012. So, some of us, I’m sure, have a pretty general idea of the plot, but we know much less about the author (Q31). Today, I’m going to provide a little more insight into this talented man and I’m going to talk particularly about the home he had on the Island of Guernsey in the British Channel Islands.\n\nBut first, his early career... as I’ve said, he was a writer, he was at the height of his career in Paris and he was very highly regarded by his colleagues. As far as literature was concerned, he was the leading figure of the Romantic movement. However, as well as being a literary genius, he also gave many speeches about issues like the level of poverty (Q32) in his society. He felt very strongly about this and about other areas where change was needed, like education. This kind of outspoken criticism was not well liked by the rulers of France and, eventually, the emperor - Napoleon III - told Victor Hugo to leave Paris and not return; in other words, he sent him into exile.\n\nSo Victor Hugo was forced to reside in other parts of Europe (Q33). Guernsey was actually his third place of exile and he landed there in 1855. He produced a lot while on Guernsey - including Les Misérables - and to do this, he had to spend a great deal of time in the home that he had there. This was a property that he bought using the money he’d made in France from the publication of a collection of his poetry (Q34). It was the only property he ever owned, and he was very proud of it.\n_______________\nThe property Victor Hugo bought on Guernsey was a large, five-story house in the capital town of St Peter Port and he lived there for 15 years, returning to France in 1870 when Napoleon’s Empire collapsed. He decorated and furnished each level, or floor, of the house in unique and wonderful ways, and many people consider the inside of the house to be a ‘work of art’. Today it’s a museum that attracts 200,000 visitors a year.\nHe lived in the house with his family ... and portraits of its members still hang in rooms on the ground floor, along with drawings (Q35) that he did during his travels that he felt were important to him. In other ground-floor rooms, there are huge tapestries that he would have designed and loved. The walls are covered in dark wood paneling that Victor Hugo created himself using wooden furniture that he bought in the market (Q36). The items were relatively inexpensive, and he used them to create intricate carvings. They gave an atmosphere on the lower level that was shadowy and rather solemn.\n\n\n\nOn the next level of the house there are two impressive lounges, where he entertained his guests. One lounge has entirely red furnishings, such as sofas and wall coverings, and the other blue. There’s a strong Chinese influence in these areas in things like the wallpaper pattern and the lamps (Q37) - which he would have made himself by copying original versions.\n\nHis library, where he left many of his favourite books, forms the hallway to the third floor and was a comfortable area where he could relax and enjoy his afternoons. And then, at the very top of the house, there’s a room called the Lookout - called that because it looks out over the harbour (Q38). In contrast to the rather dark lower levels, it's full of light and was like a glass office where he would write until lunchtime - often at his desk.\n\nSo, Victor Hugo was a man of many talents, but he was also true to his values. While living in his house on Guernsey, he entertained many other famous writers, but he also invited a large group of local children from the deprived areas of the island to dinner once a week (Q39). What’s more, he served them their food, which was an extraordinary gesture for the time period.\nIn 1927, the house was owned bv his relatives, and they decided to donate it to the city of Paris (Q40). It has since been restored using photographs from the period and, as I mentioned earlier, is now a museum that is open to the public.", "quote": "The person I’ve chosen to talk about is the French writer Victor Hugo - many people have heard of him because his novel, Les Misérables, which he wrote in 1862, is famous around the world. It became a stage musical in the 1980s, and a film version was also released in 2012. So, some of us, I’m sure, have a pretty general idea of the plot, but we know much less about the author (Q31). Today, I’m going to provide a little more insight into this talented man and I’m going to talk particularly about the home he had on the Island of Guernsey in the British Channel Islands.\n\nBut first, his early career... as I’ve said, he was a writer, he was at the height of his career in Paris and he was very highly regarded  carvings. They gave an atmosphere on the lower level that was shadowy and rather solemn.\n\n\n\nOn the next level of the house there are two impressive lounges, where he entertained his guests. One lounge has entirely red furnishings, such as sofas and wall coverings, and the other blue. There’s a strong Chinese influence in these areas in things like the wallpaper pattern and the lamps (Q37) - which he would have made himself by copying original versions.\n\nHis library, where he left many of his favourite books, forms the hallway to the third floor and was a comfortable area where he could relax and enjoy his afternoons. And then, at the very top of the house, there’s a room called the Lookout - called that because it looks out over the harbour (Q38). In contrast to the rather dark lower levels, it's full of light and was like a glass office where he would write until lunchtime - often at his desk.\n\nSo, Victor Hugo was a man of many talents, but he was also true to his values. While living in his house on Guernsey, he entertained many other famous writers, but he also invited a large group of local children from the deprived areas of the island to dinner once a week (Q39). What’s more, he served them their food, which was an extraordinary gesture for the time period.\nIn 1927, the house was owned bv his relatives, and they decided to donate it to the city of Paris (Q40). It has since been restored using photographs from the period and, as I mentioned earlier, is now a museum that is open to the public.", "explain": "Người mà tôi chọn để nói đến là nhà văn Pháp Victor Hugo - nhiều người biết đến ông vì cuốn tiểu thuyết Những người khốn khổ của ông viết năm 1862 đã nổi tiếng khắp thế giới. Nó đã trở thành một vở nhạc kịch sân khấu vào những năm 1980, và một phiên bản điện ảnh cũng được phát hành vào năm 2012. Vì vậy, tôi chắc chắn rằng một số người trong chúng ta có ý tưởng khá chung chung về cốt truyện, nhưng chúng ta biết về tác giả thì ít hơn nhiều (Q31). Hôm g ấy đã thực hiện trong chuyến du lịch mà ông ấy cảm thấy quan trọng đối với ông ấy. Trong các phòng ở tầng trệt khác, có những tấm thảm khổng lồ mà ông ấy đã thiết kế và yêu thích. Các bức tường được bao phủ bởi những tấm gỗ tối màu mà Victor Hugo đã tự tạo ra bằng cách sử dụng đồ nội thất bằng gỗ mà ông đã mua ở chợ (Q36). Những món đồ này tương đối rẻ và ông ấy đã sử dụng chúng để tạo ra những tác phẩm chạm khắc phức tạp. Họ đã tạo ra một bầu không khí ở cấp độ thấp hơn là bóng tối và khá trang trọng.\nỞ tầng tiếp theo của ngôi nhà có hai sảnh khách ấn tượng, nơi ông tiếp đãi khách của mình. Một sảnh có đồ nội thất hoàn toàn màu đỏ, chẳng hạn như ghế sofa và giấy dán tường, còn phòng kia có màu xanh lam. Có một ảnh hưởng mạnh mẽ của Trung Quốc trong những lĩnh vực này trong những thứ như hoa văn giấy dán tường và đèn (Q37) - những thứ mà ông ấy đã tự làm bằng cách sao chép các phiên bản gốc.\nThư viện của ông ấy, nơi ông ấy để lại nhiều cuốn sách yêu thích của mình, tạo thành hành lang lên tầng ba và là một khu vực thoải mái để ông ấy có thể thư giãn và tận hưởng những buổi chiều của mình. Và sau đó, ở trên cùng của ngôi nhà, có một căn phòng tên là Lookout - được gọi như vậy bởi vì nó nhìn ra bến cảng (Q38). Trái ngược với các tầng thấp hơn khá tối, nó tràn ngập ánh sáng và giống như một văn phòng bằng kính, nơi ông ấy sẽ viết cho đến giờ ăn trưa - thường là tại bàn làm việc của ông ấy.\nVậy, Victor Hugo là một người đa tài, nhưng ông cũng sống đúng với giá trị của mình. Khi sống trong ngôi nhà của mình ở Guernsey, ông ấy đã chiêu đãi nhiều nhà văn nổi tiếng khác, nhưng ông ấy cũng mời một nhóm lớn trẻ em địa phương từ những khu vực thiếu thốn của hòn đảo đến ăn tối mỗi tuần một lần (Q39). Hơn nữa, ông ấy đã phục vụ thức ăn cho họ, đó là một cử chỉ phi thường trong khoảng thời gian đó.\nNăm 1927, ngôi nhà thuộc sở hữu của người thân của ông, và họ quyết định tặng nó cho thành phố Paris (Q40). Kể từ đó, nó đã được khôi phục bằng cách sử dụng các bức ảnh từ thời kỳ đó và, như tôi đã đề cập trước đó, hiện là một bảo tàng mở cửa cho công chúng."}, "2012": {"answer_label": "The person I’ve chosen to talk about is the French writer Victor Hugo - many people have heard of him because his novel, Les Misérables, which he wrote in 1862, is famous around the world. It became a stage musical in the 1980s, and a film version was also released in 2012. So, some of us, I’m sure, have a pretty general idea of the plot, but we know much less about the author (Q31). Today, I’m going to provide a little more insight into this talented man and I’m going to talk particularly about the home he had on the Island of Guernsey in the British Channel Islands.\n\nBut first, his early career... as I’ve said, he was a writer, he was at the height of his career in Paris and he was very highly regarded by his colleagues. As far as literature was concerned, he was the leading figure of the Romantic movement. However, as well as being a literary genius, he also gave many speeches about issues like the level of poverty (Q32) in his society. He felt very strongly about this and about other areas where change was needed, like education. This kind of outspoken criticism was not well liked by the rulers of France and, eventually, the emperor - Napoleon III - told Victor Hugo to leave Paris and not return; in other words, he sent him into exile.\n\nSo Victor Hugo was forced to reside in other parts of Europe (Q33). Guernsey was actually his third place of exile and he landed there in 1855. He produced a lot while on Guernsey - including Les Misérables - and to do this, he had to spend a great deal of time in the home that he had there. This was a property that he bought using the money he’d made in France from the publication of a collection of his poetry (Q34). It was the only property he ever owned, and he was very proud of it.\n_______________\nThe property Victor Hugo bought on Guernsey was a large, five-story house in the capital town of St Peter Port and he lived there for 15 years, returning to France in 1870 when Napoleon’s Empire collapsed. He decorated and furnished each level, or floor, of the house in unique and wonderful ways, and many people consider the inside of the house to be a ‘work of art’. Today it’s a museum that attracts 200,000 visitors a year.\nHe lived in the house with his family ... and portraits of its members still hang in rooms on the ground floor, along with drawings (Q35) that he did during his travels that he felt were important to him. In other ground-floor rooms, there are huge tapestries that he would have designed and loved. The walls are covered in dark wood paneling that Victor Hugo created himself using wooden furniture that he bought in the market (Q36). The items were relatively inexpensive, and he used them to create intricate carvings. They gave an atmosphere on the lower level that was shadowy and rather solemn.\n\n\n\nOn the next level of the house there are two impressive lounges, where he entertained his guests. One lounge has entirely red furnishings, such as sofas and wall coverings, and the other blue. There’s a strong Chinese influence in these areas in things like the wallpaper pattern and the lamps (Q37) - which he would have made himself by copying original versions.\n\nHis library, where he left many of his favourite books, forms the hallway to the third floor and was a comfortable area where he could relax and enjoy his afternoons. And then, at the very top of the house, there’s a room called the Lookout - called that because it looks out over the harbour (Q38). In contrast to the rather dark lower levels, it's full of light and was like a glass office where he would write until lunchtime - often at his desk.\n\nSo, Victor Hugo was a man of many talents, but he was also true to his values. While living in his house on Guernsey, he entertained many other famous writers, but he also invited a large group of local children from the deprived areas of the island to dinner once a week (Q39). What’s more, he served them their food, which was an extraordinary gesture for the time period.\nIn 1927, the house was owned bv his relatives, and they decided to donate it to the city of Paris (Q40). It has since been restored using photographs from the period and, as I mentioned earlier, is now a museum that is open to the public.", "quote": "The person I’ve chosen to talk about is the French writer Victor Hugo - many people have heard of him because his novel, Les Misérables, which he wrote in 1862, is famous around the world. It became a stage musical in the 1980s, and a film version was also released in 2012. So, some of us, I’m sure, have a pretty general idea of the plot, but we know much less about the author (Q31). Today, I’m going to provide a little more insight into this talented man and I’m going to talk particularly about the home he had on the Island of Guernsey in the British Channel Islands.\n\nBut first, his early career... as I’ve said, he was a writer, he was at the height of his career in Paris and he was very highly regarded by his colleagues. As far as literature was concerned, he was the leading figure of the Romantic movement. However, as well as being a literary genius, he also gave many speeches about issues like the level of poverty (Q32) in his society. He felt very strongly about this and about other areas where change was needed, like education. This kind of outspoken criticism was not well liked by the rulers of France and, eventually, the emperor - Napoleon III - told Victor Hugo to leave Paris and not return; in other words, he sent him into exile.\n\nSo Victor Hugo was forced to reside in other parts of Europe (Q33). Guernsey was actually his third place of exile and he landed there in 1855. He produced a lot while on Guernsey - including Les Misérables - and to do this, he had to spend a great deal of time in the home that he had there. This was a property that he bought using the money he’d made in Franc .\n\nSo, Victor Hugo was a man of many talents, but he was also true to his values. While living in his house on Guernsey, he entertained many other famous writers, but he also invited a large group of local children from the deprived areas of the island to dinner once a week (Q39). What’s more, he served them their food, which was an extraordinary gesture for the time period.\nIn 1927, the house was owned bv his relatives, and they decided to donate it to the city of Paris (Q40). It has since been restored using photographs from the period and, as I mentioned earlier, is now a museum that is open to the public.", "explain": "Người mà tôi chọn để nói đến là nhà văn Pháp Victor Hugo - nhiều người biết đến ông vì cuốn tiểu thuyết Những người khốn khổ của ông viết năm 1862 đã nổi tiếng khắp thế giới. Nó đã trở thành một vở nhạc kịch sân khấu vào những năm 1980, và một phiên bản điện ảnh cũng được phát hành vào năm 2012. Vì vậy, tôi chắc chắn rằng một số người trong chúng ta có ý tưởng khá chung chung về cốt truyện, nhưng chúng ta biết về tác giả thì ít hơn nhiều (Q31). Hôm nay, tôi sẽ cung cấp thêm một chút thông tin chi tiết về người đàn ông tài năng này và tôi sẽ đặc biệt nói về ngôi nhà mà anh ấy có trên Đảo Guernsey thuộc Quần đảo Channel của Anh.\nNhưng trước tiên, sự nghiệp ban đầu của ông ấy... như tôi đã nói, ông ấy là một nhà văn, ông ấy đang ở đỉnh cao của sự nghiệp ở Paris và ông ấy rất được đồng nghiệp đánh giá cao. Về mặt văn học, ông là nhân vật hàng đầu của phong trào Lãng mạn. Tuy nhiên, ngoài việc là một thiên tài văn học, ông còn có nhiều bài phát biểu về các vấn đề như mức độ nghèo đói (Q32) trong xã hội của mình. Ông ấy cảm thấy rất rõ ràng về điều này và về những lĩnh vực khác cần thay đổi, chẳng hạn như giáo dục. Kiểu chỉ trích thẳng thắn này không được các nhà cai trị nước Pháp ưa thích và cuối cùng, hoàng đế - Napoléon III - đã yêu cầu Victor Hugo rời Paris và không được quay lại; nói cách khác, anh ta đã gửi ông ấy đi lưu vong.\nVì vậy, Victor Hugo buộc phải cư trú ở các vùng khác của Châu Âu (Q33). Guernsey thực sự là nơi lưu vong thứ ba của ông và ông đến đó vào năm 1855. Ông đã sản xuất rất nhiều khi ở Guernsey - bao gồm cả Les Misérables - và để làm được điều này, ông đã phải dành rất nhiều thời gian trong ngôi nhà mà ông đã có ở đó. Đây là tài sản mà ông ấy đã mua bằng số tiền ông ấy kiếm được ở Pháp từ việc xuất bản một tập thơ của ông ấy (Q34). Đó là tài sản duy nhất mà ông ấy từng sở hữu, và ông ấy rất tự hào về nó.\n_______________\nCơ ngơi mà Victor Hugo mua ở Guernsey là một ngôi nhà lớn, năm tầng ở thủ đô St Peter Port và ông sống ở đó 15 năm, trở về Pháp năm 1870 khi Đế chế Napoléon sụp đổ. Ông đã trang trí và trang bị nội thất cho từng tầng của ngôi nhà theo những cách độc đáo và tuyệt vời, và nhiều người coi bên trong ngôi nhà là một 'tác phẩm nghệ thuật'. Ngày nay, nó là một bảo tàng thu hút 200.000 du khách mỗi năm.\n\nÔng ấy sống trong ngôi nhà với gia đình của mình ... và chân dung của các thành viên trong ngôi nhà vẫn được treo trong các phòng ở tầng trệt, cùng với những bức vẽ (Q35) mà ông ấy đã thực hiện trong chuyến du lịch mà ông ấy cảm thấy quan trọng đối với ông ấy. Trong các phòng ở tầng trệt khác, có những tấm thảm khổng lồ mà ông ấy đã thiết kế và yêu thích. Các bức tường được bao phủ bởi những tấm gỗ tối màu mà Victor Hugo đã tự tạo ra bằng cách sử dụng đồ nội thất bằng gỗ mà ông đã mua ở chợ (Q36). Những món đồ này tương đối rẻ và ông ấy đã sử dụng chúng để tạo ra những tác phẩm chạm khắc phức tạp. Họ đã tạo ra một bầu không khí ở cấp độ thấp hơn là bóng tối và khá trang trọng.\nỞ tầng tiếp theo của ngôi nhà có hai sảnh khách ấn tượng, nơi ông tiếp đãi khách của mình. Một sảnh có đồ nội thất hoàn toàn màu đỏ, chẳng hạn như ghế sofa và giấy dán tường, còn phòng kia có màu xanh lam. Có một ảnh hưởng mạnh mẽ của Trung Quốc trong những lĩnh vực này trong những thứ như hoa văn giấy dán tường và đèn (Q37) - những thứ mà ông ấy đã tự làm bằng cách sao chép các phiên bản gốc.\nThư viện của ông ấy, nơi ông ấy để lại nhiều cuốn sách yêu thích của mình, tạo thành hành lang lên tầng ba và là một khu vực thoải mái để ông ấy có thể thư giãn và tận hưởng những buổi chiều của mình. Và sau đó, ở trên cùng của ngôi nhà, có một căn phòng tên là Lookout - được gọi như vậy bởi vì nó nhìn ra bến cảng (Q38). Trái ngược với các tầng thấp hơn khá tối, nó tràn ngập ánh sáng và giống như một văn phòng bằng kính, nơi ông ấy sẽ viết cho đến giờ ăn trưa - thường là tại bàn làm việc của ông ấy.\nVậy, Victor Hugo là một người đa tài, nhưng ông cũng sống đúng với giá trị của mình. Khi sống trong ngôi nhà của mình ở Guernsey, ông ấy đã chiêu đãi nhiều nhà văn nổi tiếng khác, nhưng ông ấy cũng mời một nhóm lớn trẻ em địa phương từ những khu vực thiếu thốn của hòn đảo đến ăn tối mỗi tuần một lần (Q39). Hơn nữa, ông ấy đã phục vụ thức ăn cho họ, đó là một cử chỉ phi thường trong khoảng thời gian đó.\nNăm 1927, ngôi nhà thuộc sở hữu của người thân của ông, và họ quyết định tặng nó cho thành phố Paris (Q40). Kể từ đó, nó đã được khôi phục bằng cách sử dụng các bức ảnh từ thời kỳ đó và, như tôi đã đề cập trước đó, hiện là một bảo tàng mở cửa cho công chúng."}, "1855": {"answer_label": "The person I’ve chosen to talk about is the French writer Victor Hugo - many people have heard of him because his novel, Les Misérables, which he wrote in 1862, is famous around the world. It became a stage musical in the 1980s, and a film version was also released in 2012. So, some of us, I’m sure, have a pretty general idea of the plot, but we know much less about the author (Q31). Today, I’m going to provide a little more insight into this talented man and I’m going to talk particularly about the home he had on the Island of Guernsey in the British Channel Islands.\n\nBut first, his early career... as I’ve said, he was a writer, he was at the height of his career in Paris and he was very highly regarded by his colleagues. As far as literature was concerned, he was the leading figure of the Romantic movement. However, as well as being a literary genius, he also gave many speeches about issues like the level of poverty (Q32) in his society. He felt very strongly about this and about other areas where change was needed, like education. This kind of outspoken criticism was not well liked by the rulers of France and, eventually, the emperor - Napoleon III - told Victor Hugo to leave Paris and not return; in other words, he sent him into exile.\n\nSo Victor Hugo was forced to reside in other parts of Europe (Q33). Guernsey was actually his third place of exile and he landed there in 1855. He produced a lot while on Guernsey - including Les Misérables - and to do this, he had to spend a great deal of time in the home that he had there. This was a property that he bought using the money he’d made in France from the publication of a collection of his poetry (Q34). It was the only property he ever owned, and he was very proud of it.\n_______________\nThe property Victor Hugo bought on Guernsey was a large, five-story house in the capital town of St Peter Port and he lived there for 15 years, returning to France in 1870 when Napoleon’s Empire collapsed. He decorated and furnished each level, or floor, of the house in unique and wonderful ways, and many people consider the inside of the house to be a ‘work of art’. Today it’s a museum that attracts 200,000 visitors a year.\nHe lived in the house with his family ... and portraits of its members still hang in rooms on the ground floor, along with drawings (Q35) that he did during his travels that he felt were important to him. In other ground-floor rooms, there are huge tapestries that he would have designed and loved. The walls are covered in dark wood paneling that Victor Hugo created himself using wooden furniture that he bought in the market (Q36). The items were relatively inexpensive, and he used them to create intricate carvings. They gave an atmosphere on the lower level that was shadowy and rather solemn.\n\n\n\nOn the next level of the house there are two impressive lounges, where he entertained his guests. One lounge has entirely red furnishings, such as sofas and wall coverings, and the other blue. There’s a strong Chinese influence in these areas in things like the wallpaper pattern and the lamps (Q37) - which he would have made himself by copying original versions.\n\nHis library, where he left many of his favourite books, forms the hallway to the third floor and was a comfortable area where he could relax and enjoy his afternoons. And then, at the very top of the house, there’s a room called the Lookout - called that because it looks out over the harbour (Q38). In contrast to the rather dark lower levels, it's full of light and was like a glass office where he would write until lunchtime - often at his desk.\n\nSo, Victor Hugo was a man of many talents, but he was also true to his values. While living in his house on Guernsey, he entertained many other famous writers, but he also invited a large group of local children from the deprived areas of the island to dinner once a week (Q39). What’s more, he served them their food, which was an extraordinary gesture for the time period.\nIn 1927, the house was owned bv his relatives, and they decided to donate it to the city of Paris (Q40). It has since been restored using photographs from the period and, as I mentioned earlier, is now a museum that is open to the public.", "quote": "The person I’ve chosen to talk about is the French writer Victor Hugo - many people have heard of him because his novel, Les Misérables, which he wrote in 1862, is famous around the world. It became a stage musical in the 1980s, and a film version was also released in 2012. So, some of us, I’m sure, have a pretty general idea of the plot, but we know much less about the author (Q31). Today, I’m going to provide a little more insight into this talented man and I’m going to talk particularly about the home he had on the Island of Guernse neling that Victor Hugo created himself using wooden furniture that he bought in the market (Q36). The items were relatively inexpensive, and he used them to create intricate carvings. They gave an atmosphere on the lower level that was shadowy and rather solemn.\n\n\n\nOn the next level of the house there are two impressive lounges, where he entertained his guests. One lounge has entirely red furnishings, such as sofas and wall coverings, and the other blue. There’s a strong Chinese influence in these areas in things like the wallpaper pattern and the lamps (Q37) - which he would have made himself by copying original versions.\n\nHis library, where he left many of his favourite books, forms the hallway to the third floor and was a comfortable area where he could relax and enjoy his afternoons. And then, at the very top of the house, there’s a room called the Lookout - called that because it looks out over the harbour (Q38). In contrast to the rather dark lower levels, it's full of light and was like a glass office where he would write until lunchtime - often at his desk.\n\nSo, Victor Hugo was a man of many talents, but he was also true to his values. While living in his house on Guernsey, he entertained many other famous writers, but he also invited a large group of local children from the deprived areas of the island to dinner once a week (Q39). What’s more, he served them their food, which was an extraordinary gesture for the time period.\nIn 1927, the house was owned bv his relatives, and they decided to donate it to the city of Paris (Q40). It has since been restored using photographs from the period and, as I mentioned earlier, is now a museum that is open to the public.", "explain": "Người mà tôi chọn để nói đến là nhà văn Pháp Victor Hugo - nhiều người biết đến ông vì cuốn tiểu thuyết Những người khốn khổ của ông viết năm 1862 đã nổi tiếng khắp thế giới. Nó đã trở thành một vở nhạc kịch sân khấu vào những năm 1980, và một phiên bản điện ảnh cũng được phát h g ấy sống trong ngôi nhà với gia đình của mình ... và chân dung của các thành viên trong ngôi nhà vẫn được treo trong các phòng ở tầng trệt, cùng với những bức vẽ (Q35) mà ông ấy đã thực hiện trong chuyến du lịch mà ông ấy cảm thấy quan trọng đối với ông ấy. Trong các phòng ở tầng trệt khác, có những tấm thảm khổng lồ mà ông ấy đã thiết kế và yêu thích. Các bức tường được bao phủ bởi những tấm gỗ tối màu mà Victor Hugo đã tự tạo ra bằng cách sử dụng đồ nội thất bằng gỗ mà ông đã mua ở chợ (Q36). Những món đồ này tương đối rẻ và ông ấy đã sử dụng chúng để tạo ra những tác phẩm chạm khắc phức tạp. Họ đã tạo ra một bầu không khí ở cấp độ thấp hơn là bóng tối và khá trang trọng.\nỞ tầng tiếp theo của ngôi nhà có hai sảnh khách ấn tượng, nơi ông tiếp đãi khách của mình. Một sảnh có đồ nội thất hoàn toàn màu đỏ, chẳng hạn như ghế sofa và giấy dán tường, còn phòng kia có màu xanh lam. Có một ảnh hưởng mạnh mẽ của Trung Quốc trong những lĩnh vực này trong những thứ như hoa văn giấy dán tường và đèn (Q37) - những thứ mà ông ấy đã tự làm bằng cách sao chép các phiên bản gốc.\nThư viện của ông ấy, nơi ông ấy để lại nhiều cuốn sách yêu thích của mình, tạo thành hành lang lên tầng ba và là một khu vực thoải mái để ông ấy có thể thư giãn và tận hưởng những buổi chiều của mình. Và sau đó, ở trên cùng của ngôi nhà, có một căn phòng tên là Lookout - được gọi như vậy bởi vì nó nhìn ra bến cảng (Q38). Trái ngược với các tầng thấp hơn khá tối, nó tràn ngập ánh sáng và giống như một văn phòng bằng kính, nơi ông ấy sẽ viết cho đến giờ ăn trưa - thường là tại bàn làm việc của ông ấy.\nVậy, Victor Hugo là một người đa tài, nhưng ông cũng sống đúng với giá trị của mình. Khi sống trong ngôi nhà của mình ở Guernsey, ông ấy đã chiêu đãi nhiều nhà văn nổi tiếng khác, nhưng ông ấy cũng mời một nhóm lớn trẻ em địa phương từ những khu vực thiếu thốn của hòn đảo đến ăn tối mỗi tuần một lần (Q39). Hơn nữa, ông ấy đã phục vụ thức ăn cho họ, đó là một cử chỉ phi thường trong khoảng thời gian đó.\nNăm 1927, ngôi nhà thuộc sở hữu của người thân của ông, và họ quyết định tặng nó cho thành phố Paris (Q40). Kể từ đó, nó đã được khôi phục bằng cách sử dụng các bức ảnh từ thời kỳ đó và, như tôi đã đề cập trước đó, hiện là một bảo tàng mở cửa cho công chúng."}, "15": {"answer_label": "The person I’ve chosen to talk about is the French writer Victor Hugo - many people have heard of him because his novel, Les Misérables, which he wrote in 1862, is famous around the world. It became a stage musical in the 1980s, and a film version was also released in 2012. So, some of us, I’m sure, have a pretty general idea of the plot, but we know much less about the author (Q31). Today, I’m going to provide a little more insight into this talented man and I’m going to talk particularly about the home he had on the Island of Guernsey in the British Channel Islands.\n\nBut first, his early career... as I’ve said, he was a writer, he was at the height of his career in Paris and he was very highly regarded by his colleagues. As far as literature was concerned, he was the leading figure of the Romantic movement. However, as well as being a literary genius, he also gave many speeches about issues like the level of poverty (Q32) in his society. He felt very strongly about this and about other areas where change was needed, like education. This kind of outspoken criticism was not well liked by the rulers of France and, eventually, the emperor - Napoleon III - told Victor Hugo to leave Paris and not return; in other words, he sent him into exile.\n\nSo Victor Hugo was forced to reside in other parts of Europe (Q33). Guernsey was actually his third place of exile and he landed there in 1855. He produced a lot while on Guernsey - including Les Misérables - and to do this, he had to spend a great deal of time in the home that he had there. This was a property that he bought using the money he’d made in France from the publication of a collection of his poetry (Q34). It was the only property he ever owned, and he was very proud of it.\n_______________\nThe property Victor Hugo bought on Guernsey was a large, five-story house in the capital town of St Peter Port and he lived there for 15 years, returning to France in 1870 when Napoleon’s Empire collapsed. He decorated and furnished each level, or floor, of the house in unique and wonderful ways, and many people consider the inside of the house to be a ‘work of art’. Today it’s a museum that attracts 200,000 visitors a year.\nHe lived in the house with his family ... and portraits of its members still hang in rooms on the ground floor, along with drawings (Q35) that he did during his travels that he felt were important to him. In other ground-floor rooms, there are huge tapestries that he would have designed and loved. The walls are covered in dark wood paneling that Victor Hugo created himself using wooden furniture that he bought in the market (Q36). The items were relatively inexpensive, and he used them to create intricate carvings. They gave an atmosphere on the lower level that was shadowy and rather solemn.\n\n\n\nOn the next level of the house there are two impressive lounges, where he entertained his guests. One lounge has entirely red furnishings, such as sofas and wall coverings, and the other blue. There’s a strong Chinese influence in these areas in things like the wallpaper pattern and the lamps (Q37) - which he would have made himself by copying original versions.\n\nHis library, where he left many of his favourite books, forms the hallway to the third floor and was a comfortable area where he could relax and enjoy his afternoons. And then, at the very top of the house, there’s a room called the Lookout - called that because it looks out over the harbour (Q38). In contrast to the rather dark lower levels, it's full of light and was like a glass office where he would write until lunchtime - often at his desk.\n\nSo, Victor Hugo was a man of many talents, but he was also true to his values. While living in his house on Guernsey, he entertained many other famous writers, but he also invited a large group of local children from the deprived areas of the island to dinner once a week (Q39). What’s more, he served them their food, which was an extraordinary gesture for the time period.\nIn 1927, the house was owned bv his relatives, and they decided to donate it to the city of Paris (Q40). It has since been restored using photographs from the period and, as I mentioned earlier, is now a museum that is open to the public.", "quote": "The person I’ve chosen to talk about is the French writer Victor Hugo - many people have heard of him because his novel, Les Misérables, which he wrote in 1862, is famous around the world. It became a stage musical in the 1980s, and a film version was also released in 2012. So, some of us, I’m sure, have a pretty general idea of the plot, but we know much less about the author (Q31). Today, I’m going to provide a little more insight into this talented man and I’m going to talk particularly about the home he had on the Island of Guernsey in the British Channel Islands.\n\nBut first, his early career... as I’ve said, he was a writer, he was at the height of his career in Paris and he was very highly regarded by his colleagues. As far as literature was concerned, he was the leading figure of the Romantic movement. However, as well as being a literary genius, he also gave many speeches about issues like the level of poverty (Q32) in his society. He felt very strongly about this and about other areas where change was needed, like education. This kind of outspoken criticism was not well liked by the rulers of France and, eventually, the emperor - Napoleon III - told Victor Hugo to leave Paris and not return; in other words, he sent him into exile.\n\nSo Victor Hugo was forced to reside in other parts of Europe (Q33). Guernsey was actually his third place of exile and he landed there in 1855. He produced a lot while on Guernsey - including Les Misérables - and to do this, he had to spend a great deal of time in the home that he had there. This was a property that he bought using the money he’d made in France from the publication of a collection of his poetry (Q34). It was the only property he ever owned, and he was very proud of it.\n_______________\nThe property Victor Hugo bought on Guernsey was a large, five-story house in the capital town of St Peter Port and he lived there for 15 years, returning to France in 1870 when Napoleon’s Empire collapsed. He decorated and furnished each level, or floor, of the house in unique and wonderful ways, and many people consider the inside of the house to be a ‘work of art’. Today it’s a museum that attracts 200,000 visitors a year.\nHe lived in the house with his family ... and portraits of its members still hang in rooms on the ground floor, along with drawings (Q35) that he did during his travels that he felt were important to him. In other ground-floor rooms, there are huge tapestries that he would have designed and loved. The walls are covered in dark wood paneling that Victor Hugo created himself using wooden furniture that he bought in the market (Q36). The items were relatively inexpensive, and he used them to create intricate carvings. They gave an atmosphere on the lower level that was shadowy and rather solemn.\n\n\n\nOn the next level of the house there are two impressive lounges, where he entertained his guests. One lounge has entirely red furnishings, such as sofas and wall coverings, and the other blue. There’s a strong Chinese influence in these areas in things like the wallpaper pattern and the lamps (Q37) - which he would have made himself by copying original versions.\n\nHis library, where he left many of his favourite books, forms the hallway to the third floor and was a comfortable area where he could relax and enjoy his afternoons. And then, at the very top of the house, there’s a room called the Lookout - called that because it looks out over the harbour (Q38). In contrast to the rather dark lower levels, it's full of light and was like a glass office where he would write until lunchtime - often at his desk.\n\nSo, Victor Hugo was a man of many talents, but he was also true to his values. While living in his house on Guernsey, he entertained many other famous writers, but he also invited a large group of local children from the deprived areas of the island to dinner once a week (Q39). What’s more, he served them their food, which was an extraordinary gesture for the time period.\nIn 1927, the house was owned bv his relatives, and they decided to donate it to the city of Paris (Q40). It has since been restored using photographs from the period and, as I mentioned earlier, is now a museum that is open to the public.", "explain": "Người mà tôi chọn để nói đến là nhà văn Pháp Victor Hugo - nhiều người biết đến ông vì cuốn tiểu thuyết Những người khốn khổ của ông viết năm 1862 đã nổi tiếng khắp thế giới. Nó đã trở thành một vở nhạc kịch sân khấu vào những năm 1980, và một phiên bản điện ảnh cũng được phát hành vào năm 2012. Vì vậy, tôi chắc chắn rằng một số người trong chúng ta có ý tưởng khá chung chung về cốt truyện, nhưng chúng ta biết về tác giả thì ít hơn nhiều (Q31). Hôm nay, tôi sẽ cung cấp thêm một chút thông tin chi tiết về người đàn ông tài năng này và tôi sẽ đặc biệt nói về ngôi nhà mà anh ấy có trên Đảo Guernsey thuộc Quần đảo Channel của Anh.\nNhưng trước tiên, sự nghiệp ban đầu của ông ấy... như tôi đã nói, ông ấy là một nhà văn, ông ấy đang ở đỉnh cao của sự nghiệp ở Paris và ông ấy rất được đồng nghiệp đánh giá cao. Về mặt văn học, ông là nhân vật hàng đầu của phong trào Lãng mạn. Tuy nhiên, ngoài việc là một thiên tài văn học, ông còn có nhiều bài phát biểu về các vấn đề như mức độ nghèo đói (Q32) trong xã hội của mình. Ông ấy cảm thấy rất rõ ràng về điều này và về những lĩnh vực khác cần thay đổi, chẳng hạn như giáo dục. Kiểu chỉ trích thẳng thắn này không được các nhà cai trị nước Pháp
