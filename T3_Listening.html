<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test 3 &ndash; IELTS Listening Practice</title>
<style>
:root{
  --bg:#eef1f7; --panel:#ffffff; --ink:#1b2540; --muted:#66708a; --line:#e3e7f0;
  --navy:#122a52; --navy-2:#1c3f74; --brand:#1c3f74; --brand-ink:#ffffff;
  --good:#128a4e; --bad:#d64545; --good-bg:#e9f9f1; --bad-bg:#fdecec;
  --accent-bg:#eef2fb; --gold:#c9a24b; --radius:14px;
  --shadow:0 1px 3px rgba(18,42,82,.06), 0 10px 24px -14px rgba(18,42,82,.18);
}
*{box-sizing:border-box;}
body{margin:0;background:linear-gradient(180deg,#e7ebf5 0%,#eef1f7 320px);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.wrap{max-width:940px;margin:0 auto;padding:28px 16px 80px;}
header.top{padding:6px 4px 22px;text-align:center;}
header.top .kicker{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.14em;color:var(--gold);background:var(--navy);padding:5px 14px;border-radius:999px;margin-bottom:14px;}
header.top h1{font-size:26px;margin:0 0 8px;letter-spacing:.01em;color:var(--navy);font-weight:800;}
header.top p{margin:0;color:var(--muted);font-size:13.5px;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:22px 0;position:sticky;top:10px;z-index:5;}
.tab-btn{border:1px solid var(--line);background:var(--panel);color:var(--navy);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;box-shadow:var(--shadow);}
.tab-btn:hover{border-color:var(--navy-2);}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.tab-btn .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin-right:7px;vertical-align:middle;}
.tab-btn.done .dot{background:var(--gold);}
.part{display:none;}
.part.active{display:block;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:0 0 22px;margin-bottom:20px;box-shadow:var(--shadow);overflow:hidden;}
.part-bar{background:linear-gradient(90deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:15px 24px;font-weight:800;font-size:15.5px;letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.part-bar .title{font-weight:600;opacity:.92;font-size:13.5px;}
.card-body{padding:20px 24px 0;}
.card .instructions{color:var(--muted);font-size:13.5px;margin-bottom:14px;font-style:italic;}
.audio-box{display:flex;align-items:center;gap:12px;background:var(--accent-bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:4px 0 16px;}
.audio-box .icon{font-size:18px;}
.audio-box .label{font-size:12.5px;font-weight:700;color:var(--navy);white-space:nowrap;}
audio{width:100%;height:36px;}
.qgroup{margin:18px 0;}
.qgroup .header-note{font-size:12.5px;color:var(--navy-2);font-weight:800;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em;}
.qgroup .prompt{font-weight:600;margin-bottom:8px;}
.opt-list{display:flex;flex-direction:column;gap:6px;margin-bottom:2px;}
.opt{display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border-radius:9px;border:1px solid var(--line);cursor:pointer;}
.opt:hover{background:var(--accent-bg);border-color:var(--navy-2);}
.opt input{margin-top:3px;}
.opt.correct{background:var(--good-bg);border-color:var(--good);}
.opt.incorrect{background:var(--bad-bg);border-color:var(--bad);}
.opt:has(input:disabled){opacity:.45;cursor:not-allowed;}
.opt input:disabled{cursor:not-allowed;}
.notes-block{white-space:pre-wrap;line-height:2.2;}
.notes-block .subhead{display:block;font-weight:800;margin:16px 0 4px;color:var(--navy);font-size:14.5px;}
.notes-block .bullet{display:block;margin-left:14px;}
.blank{display:inline-block;border:none;border-bottom:2px solid var(--navy-2);background:var(--accent-bg);border-radius:5px 5px 0 0;padding:3px 8px;font:inherit;font-weight:700;min-width:120px;text-align:center;color:var(--ink);}
.blank:focus{outline:none;background:#e4eaf9;}
.blank.correct{border-color:var(--good);background:var(--good-bg);}
.blank.incorrect{border-color:var(--bad);background:var(--bad-bg);}
.blank-num{font-size:11px;color:var(--gold);font-weight:800;vertical-align:super;margin-right:2px;}
.actions{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap;}
button.primary{background:var(--navy);color:#fff;border:none;padding:12px 24px;border-radius:9px;font-size:14.5px;font-weight:700;cursor:pointer;box-shadow:0 6px 14px -6px rgba(18,42,82,.5);}
button.primary:hover{background:var(--navy-2);}
button.ghost{background:#fff;border:1px solid var(--line);color:var(--navy);padding:11px 18px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;}
button.ghost:hover{border-color:var(--navy-2);color:var(--navy-2);}
.score-pill{font-weight:800;padding:9px 18px;border-radius:999px;background:var(--navy);color:#fff;font-size:14px;}
.toggle-section{display:none;margin-top:16px;border-top:1px dashed var(--line);padding-top:16px;}
.toggle-section.open{display:block;}
.script-text{font-size:14.5px;background:#f7f8fc;border:1px solid var(--line);border-radius:10px;padding:14px 16px;max-height:560px;overflow-y:auto;}
.script-line{margin:0 0 10px;line-height:1.65;}
.script-line .spk{font-weight:800;color:var(--navy);margin-right:4px;}
.script-line mark.hl{background:#fdf1d0;border-radius:4px;padding:1px 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
.script-line .qtag{display:inline-block;font-weight:800;color:var(--navy);font-size:11px;background:#e8edf8;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle;}
.jump-btn{display:inline-block;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:700;color:#fff;background:var(--navy-2);border:none;border-radius:6px;padding:3px 8px;margin-right:8px;cursor:pointer;vertical-align:middle;}
.jump-btn:hover{background:var(--navy);}
.expl-item{border-top:1px solid var(--line);padding:14px 0;}
.expl-item:first-child{border-top:none;}
.expl-item .eq-head{display:flex;gap:10px;align-items:center;margin-bottom:6px;}
.expl-item .qnum{background:var(--navy);color:#fff;font-weight:800;font-size:12px;border-radius:6px;padding:3px 9px;}
.expl-item .ans{font-weight:800;color:var(--good);}
.expl-item .quote{font-style:italic;color:var(--muted);font-size:13.5px;margin:4px 0 6px;white-space:pre-wrap;}
.expl-item .explain{font-size:14px;white-space:pre-wrap;}
.example-line{color:var(--muted);font-style:italic;}
.script-note{font-size:12.5px;color:var(--muted);margin:0 0 10px;}
footer.credit{color:var(--muted);font-size:12px;text-align:center;margin-top:26px;}
.box-panel{background:var(--accent-bg);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px;}
.box-panel .box-title{font-weight:800;color:var(--navy);margin-bottom:8px;font-size:13.5px;}
.box-panel .box-item{display:flex;gap:8px;margin:4px 0;font-size:14px;}
.box-panel .box-item b{color:var(--navy-2);min-width:18px;}
.map-img{max-width:100%;border-radius:10px;border:1px solid var(--line);margin-bottom:14px;display:block;}
.stem-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);}
.stem-row:last-child{border-bottom:none;}
.stem-row .stem-text{flex:1;}
.stem-row select{padding:7px 10px;border-radius:8px;border:1px solid var(--line);font:inherit;font-weight:700;min-width:70px;background:#fff;}
.stem-row select.correct{border-color:var(--good);background:var(--good-bg);}
.stem-row select.incorrect{border-color:var(--bad);background:var(--bad-bg);}
@media(max-width:520px){.wrap{padding:18px 10px 60px;}.card-body{padding:16px 16px 0;}.part-bar{padding:13px 16px;}}
</style>
</head>

<script>
const TEST_DATA = {"test": "Test 3", "parts": [{"part": 1, "kind": "notes", "title": "Junior Cycle Camp", "instructions": null, "audio": "audio/test3/part1.mp3", "answers": {"1": "park", "2": "blue", "3": "reference", "4": "story", "5": "rain", "6": "snack", "7": "medication", "8": "helmet", "9": "tent", "10": "199"}, "explanations": {"1": {"answer_label": "1. park", "quote": "Woman: Charlie? He's seven. He can ride a bike, but he needs a little more training before he's safe to go on the road.\nJake: He'd probably be best in Level 5. They start off practising on the site here, and we aim to get them riding on the road, but first they're taken to ride in the park, away from the traffic.", "explain": "Câu hỏi:\nWrite ONE WORD AND/OR A NUMBER for each answer.\nFirst of all, children at this level are taken to practise in a 1 ...\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Đoạn hội thoại bên chỉ ra rằng họ mong muốn đưa những đứa trẻ ở cấp độ 5 đi xe trên đường, nhưng trước tiên, chúng sẽ được đưa vào lái xe ở trong công viên - 'park', tránh xa dòng xe cộ."}, "2": {"answer_label": "2. blue", "quote": "Jake: Then the instructors themselves are in blue shirts, and one of these is responsible for each class.", "explain": "Câu hỏi:\nInstructors\nInstructors wear 2 \tshirts.\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một tính từ. Câu bên chỉ ra rằng những người hướng dẫn mặc áo màu xanh - 'blue', và một trong những người này chịu trách nhiệm cho mỗi lớp."}, "3": {"answer_label": "3. reference", "quote": "Jake: In order to be accepted, all our instructors have to submit a reference from someone who's seen them work with children ... Then they have to complete our training course ...", "explain": "Câu hỏi:\nInstructors\nA 3\tis required and training is given.\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Câu bên chỉ ra rằng để được chấp nhận, tất cả những người hướng dẫn phải gửi một bản giới thiệu - 'reference' từ một người đã thấy họ làm việc với trẻ em ... Sau đó, họ phải hoàn thành khóa đào tạo ..."}, "4": {"answer_label": "4. story", "quote": "Jake: They're out riding most of the time but they have quiet times too, where their instructor might tell them a", "explain": "Câu hỏi:\nClasses\nThere are quiet times during the morning for a 4 \t\nor a game.\nGiải thích đáp án:"}, "5": {"answer_label": "5. rain", "quote": "Woman: ... Now, what happens if there's rain? Do the classes still run?\nJake: Oh yes. We don't let that put us off - we just put on our waterproofs and keep cycling.", "explain": "Câu hỏi:\nClasses\nClasses are held even if there is 5\t\nKeywords được paraphrase:\nare held - run\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Đoạn hội thoại bên chỉ ra rằng nếu có mưa -'rain', các lớp học vẫn sẽ diễn ra bình thường, họ chỉ cần mặc áo mưa và tiếp tục đạp xe."}, "6": {"answer_label": "6. snack", "quote": "Woman: And is there anything special Charlie should bring along with him? Jake: Well, maybe some spare clothes, especially if the weather's not so good. And a snack for break time.", "explain": "Câu hỏi:\nWhat to bring\na 6\t\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Đoạn hội thoại bên chỉ ra rằng ngoài một vài bộ đồ để thay khi thời tiết không tốt, thì Charlie nên đem theo thức ăn nhẹ -'snack' cho giờ nghỉ giải lao."}, "7": {"answer_label": "7. medication", "quote": "Woman: Sure. And just at present Charlie has to take medication every few hours, so I'll make sure he has that.", "explain": "Câu hỏi:\nWhat to bring\nCharlie's 7\t\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Câu bên chỉ ra rằng hiện tại, Charlie phải uống thuốc - 'medication' vài giờ một lần, vì vậy người phụ nữ sẽ đảm bảo rằng Charlie đem theo thuốc."}, "8": {"answer_label": "8. helmet", "quote": "Jake: The classes normally start at 9.30 every morning, but on Day 1 you should aim to get Charlie here by 9.20 ... We need additional time because there are a few extra things to do. The most important is that we have a very careful check to make sure that every child's helmet fits properly.", "explain": "Câu hỏi:\nDay 1\nBefore the class, his 8 ... will be checked.\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Đoạn bên chỉ ra rằng Charlie được khuyên nên đến sớm trước 10 phút vì họ phải kiểm tra xem mũ bảo hiểm - 'helmet' của từng bạn có vừa vặn không để kịp thời chỉnh sửa."}, "9": {"answer_label": "9. tent", "quote": "Jake: Then after that, all the instructors will be waiting to meet their classes, and they'll meet up in the tent.", "explain": "Câu hỏi:\nDay 1\nHe should then go to the 9\tto meet his class\ninstructor.\nGiải thích đáp án:\nCâu hỏi yêu cầu điền danh từ. Câu bên chỉ ra rằng tất cả những người hướng dẫn sẽ đợi để gặp lớp học của họ và họ sẽ gặp nhau trong lều - 'tent'."}, "10": {"answer_label": "10. 199", "quote": "Woman: ... Now can you tell me how much the camp costs a week?\nJake: One hundred ninety-nine dollars.\nWe've managed to keep the price more or less the same as last year - it was one hundred ninety then. But the places are filling up quite quickly.", "explain": "Câu hỏi:\nCost\nThe course costs 10 $\tper week.\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một số tiền. Đoạn hội thoại bên chỉ ra rằng khóa trại này tốn 199 đô-la mỗi tuần. Họ đã cố gắng giữ mức giá ít nhiều bằng với năm ngoái - lúc đó là 190. Nhưng những chỗ này đang lấp đầy khá nhanh chóng."}, "199": {"answer_label": "10. 199", "quote": "Woman: ... Now can you tell me how much the camp costs a week?\nJake: One hundred ninety-nine dollars.\nWe've managed to keep the price more or less the same as last year - it was one hundred ninety then. But the places are filling up quite quickly.", "explain": "Câu hỏi:\nCost\nThe course costs 10 $\tper week.\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một số tiền. Đoạn hội thoại bên chỉ ra rằng khóa trại này tốn 199 đô-la mỗi tuần. Họ đã cố gắng giữ mức giá ít nhiều bằng với năm ngoái - lúc đó là 190. Nhưng những chỗ này đang lấp đầy khá nhanh chóng."}}, "script_full": [{"speaker": "JAKE", "text": "Hello, Junior Cycle camp, Jake speaking.", "qids": []}, {"speaker": "WOMAN", "text": "Hi. I'm calling for some information about the cycle camp - I'm thinking of sending my son.", "qids": []}, {"speaker": "JAKE", "text": "Great. Well, it's held every weekday morning over the summer vacation and we focus on basic cycling skills and safety. We have eight levels for children from three years upwards. How old's your son?", "qids": []}, {"speaker": "WOMAN", "text": "Charlie? He's seven. He can ride a bike, but he needs a little more training before he's safe to go on the road.", "qids": []}, {"speaker": "JAKE", "text": "He'd probably be best in Level 5. They start off practising on the site here, and we aim to get them riding on the road, but first they're taken to ride in the park, away from the traffic.", "qids": ["1"]}, {"speaker": "WOMAN", "text": "Right. And can you tell me a bit about the instructors?", "qids": []}, {"speaker": "JAKE", "text": "Well, all our staff wear different coloured shirts. So, we have three supervisors, and they have red shirts. They support the instructors, and they also stand in for me if I'm not around. Then the instructors themselves are in blue shirts, and one of these is responsible for each class.", "qids": ["2"]}, {"speaker": "WOMAN", "text": "OK.", "qids": []}, {"speaker": "JAKE", "text": "In order to be accepted, all our instructors have to submit a reference from someone who's seen them work with children like if they've worked as a babysitter, for example. Then they have to complete our training course, including how to do lesson plans, and generally care for the well-being of the kids in their class. They do a great job, I have to say.", "qids": ["3"]}, {"speaker": "WOMAN", "text": "Right. And tell me a bit about the classes. What size will Charlie's class be?", "qids": []}, {"speaker": "JAKE", "text": "We have a limit of eight children in each class, so their instructor really gets to know them well. They're out riding most of the time but they have quiet times too, where their instructor might tell them a story that's got something to do with cycling, or get them to play a game together. It's a lot of fun.", "qids": ["4", "5"]}, {"speaker": "WOMAN", "text": "It must be. Now, what happens if there's rain? Do the classes still run?", "qids": []}, {"speaker": "JAKE", "text": "Oh yes. We don't let that put us off - we just put on our waterproofs and keep cycling.", "qids": []}, {"speaker": "WOMAN", "text": "And is there anything special Charlie should bring along with him?", "qids": []}, {"speaker": "JAKE", "text": "Well, maybe some spare clothes, especially if the weather's not so good. And a snack for break time.", "qids": []}, {"speaker": "WOMAN", "text": "How about a drink?", "qids": []}, {"speaker": "JAKE", "text": "No, we'll provide that. And make sure he has shoes, not sandals.", "qids": ["6"]}, {"speaker": "WOMAN", "text": "Sure. And just at present Charlie has to take medication every few hours, so I'll make sure he has that.", "qids": ["7"]}, {"speaker": "JAKE", "text": "Absolutely. Just give us details of when he has to take it and we'll make sure he does.", "qids": []}, {"speaker": "WOMAN", "text": "Thanks.", "qids": []}, {"speaker": "JAKE", "text": "Now, there are a few things you should know about Day 1 of the camp. The classes normally start at 9.30 every morning, but on Day 1 you should aim to get Charlie here by 9.20. The finishing time will be 12.30 as usual. We need the additional time because there are a few extra things to do. The most important is that we have a very careful check to make sure that every child's helmet fits properly. If it doesn't fit, we'll try to adjust it, or we'll find him another one - but he must wear it all the time he's on the bike.", "qids": ["8"]}, {"speaker": "WOMAN", "text": "Of course.", "qids": []}, {"speaker": "JAKE", "text": "Then after that, all the instructors will be waiting to meet their classes, and they'll meet up in the tent - you can't miss it. And each instructor will take their class away and get started.", "qids": ["9"]}, {"speaker": "WOMAN", "text": "OK. Well that all sounds good. Now can you tell me how much the camp costs a week?", "qids": []}, {"speaker": "JAKE", "text": "One hundred ninety-nine dollars. We've managed to keep the price more or less the same as last year - it was one hundred ninety then. But the places are filling up quite quickly.", "qids": ["10"]}, {"speaker": "WOMAN", "text": "Right. OK, well I'd like to book for...", "qids": []}], "notes": ["JUNIOR CYCLE CAMP", "The course focuses on skills and safety.", "• Charlie would be placed in Level 5.", "• First of all, children at this level are taken to practise in a {{1}}", "Instructors", "• Instructors wear {{2}}shirts.", "• A {{3}}is required and training is given.", "Classes", "• The size of the classes is limited.", "• There are quiet times during the morning for a {{4}}or a game.", "• Classes are held even if there is {{5}}", "What to bring", "• a change of clothing", "• a {{6}}", "• shoes (not sandals)", "• Charlie’s {{7}}", "Day 1", "• Charlie should arrive at 9.20 am on the first day.", "• Before the class, his {{8}} will be checked.", "• He should then go to the {{9}}to meet his class instructor.", "Cost", "• The course costs {{10}} per week."]}, {"part": 2, "kind": "mcq", "title": "Childcare Services (extended hours)", "instructions": null, "audio": "audio/test3/part2.mp3", "answers": {"11": "B", "12": "E", "13": "C", "14": "C", "15": "A", "16": "E", "17": "D", "18": "G", "19": "F", "20": "C"}, "explanations": {"11": {"answer_label": "11-12. B&E", "quote": "Good afternoon. My name's Mrs Carter and I run the before and after school extended hours childcare service. I hope you've had a chance to\nhave a good look around the school and talk to staff and pupils. I know that many of you are interested in using our childcare service when your child joins the school, and perhaps you already know something about it, but for those that don't, I'll go through the main details now.\nWe offer childcare for children from the ages of four to eleven both before and after school. I know that many parents who work find this service invaluable. You can leave your child with us safe in the knowledge that they will be extremely well cared for.\nWe are insured to provide care for up to 70 children, although we rarely have this many attending at any one session. I think we generally expect around 50-60 children for the afternoon sessions and about half that number for the breakfast sessions. Although we currently do have 70 children registered with us, not all of these attend every day. It's ten years since we began offering an extended hours service and we've come a long way during that time. When we first opened, we only had about 20 children attending regularly.", "explain": "Câu hỏi: Choose TWO letters, A-E.\nWhich TWO facts are given about the school's extended hours childcare service?\nA It started recently.\nB More children attend after school than before school.\nC An average of 50 children attend in the mornings.\nD A child cannot attend both the before and after school sessions.\nE The maximum number of children who can attend is 70.\nGiải thích đáp án:\nTất cả lựa chọn đều được nhắc đến trong đoạn hội thoại trên, Ở lựa chọn A, về việc It started recently. Cô Carter có nói là nó đã 10 năm kể từ khi chúng tôi mở dịch vụ.\nỞ lựa chọn B, về more children attend after school than before school. Cô ta nói rằng, chúng tôi mong đợi cỡ 50-60 trẻ cho lớp buổi chiều, và một nửa số đó vào buổi sáng\nỞ lựa chọn C, về việc an average of 50 children attend in the mornings. Cô ta nói rằng, chúng tôi mong đợi cỡ 50-60 trẻ cho lớp buổi chiều, và một nửa số đó vào buổi sáng\nỞ lựa chọn D, về việc a child cannot attend both the before and after school sessions. Cô ta nói rằng chúng tôi có dịch vụ trông trẻ từ 4-11 tuổi vào 2 buổi trước và sau học Ở lựa chọn E, về the maximum number of children who can attend. Cô ta nói rằng chúng tôi có thể chắc chắn chăm sóc lên đến 70 đứa trẻ.\nTừ những dữ kiện trên, ta có thể thấy E và B là đáp án đúng"}, "12": {"answer_label": "11-12. B&E", "quote": "Good afternoon. My name's Mrs Carter and I run the before and after school extended hours childcare service. I hope you've had a chance to\nhave a good look around the school and talk to staff and pupils. I know that many of you are interested in using our childcare service when your child joins the school, and perhaps you already know something about it, but for those that don't, I'll go through the main details now.\nWe offer childcare for children from the ages of four to eleven both before and after school. I know that many parents who work find this service invaluable. You can leave your child with us safe in the knowledge that they will be extremely well cared for.\nWe are insured to provide care for up to 70 children, although we rarely have this many attending at any one session. I think we generally expect around 50-60 children for the afternoon sessions and about half that number for the breakfast sessions. Although we currently do have 70 children registered with us, not all of these attend every day. It's ten years since we began offering an extended hours service and we've come a long way during that time. When we first opened, we only had about 20 children attending regularly.", "explain": "Câu hỏi: Choose TWO letters, A-E.\nWhich TWO facts are given about the school's extended hours childcare service?\nA It started recently.\nB More children attend after school than before school.\nC An average of 50 children attend in the mornings.\nD A child cannot attend both the before and after school sessions.\nE The maximum number of children who can attend is 70.\nGiải thích đáp án:\nTất cả lựa chọn đều được nhắc đến trong đoạn hội thoại trên, Ở lựa chọn A, về việc It started recently. Cô Carter có nói là nó đã 10 năm kể từ khi chúng tôi mở dịch vụ.\nỞ lựa chọn B, về more children attend after school than before school. Cô ta nói rằng, chúng tôi mong đợi cỡ 50-60 trẻ cho lớp buổi chiều, và một nửa số đó vào buổi sáng\nỞ lựa chọn C, về việc an average of 50 children attend in the mornings. Cô ta nói rằng, chúng tôi mong đợi cỡ 50-60 trẻ cho lớp buổi chiều, và một nửa số đó vào buổi sáng\nỞ lựa chọn D, về việc a child cannot attend both the before and after school sessions. Cô ta nói rằng chúng tôi có dịch vụ trông trẻ từ 4-11 tuổi vào 2 buổi trước và sau học Ở lựa chọn E, về the maximum number of children who can attend. Cô ta nói rằng chúng tôi có thể chắc chắn chăm sóc lên đến 70 đứa trẻ.\nTừ những dữ kiện trên, ta có thể thấy E và B là đáp án đúng"}, "13": {"answer_label": "13. C", "quote": "We try to keep our costs as low as we can and we think we provide very good value for money. For the afternoon sessions, which run from 3.30 until 6 p.m., it's £7.20. But if you prefer, you can pay for one hour only, which costs £3.50, or two hours which costs £5.70.", "explain": "Câu hỏi: How much does childcare cost for a complete afternoon session per child?\nA £3.50\nB £5.70\nC £7.20\nKeywords được paraphrase:\ncomplete afternoon session - afternoon session\nGiải thích đáp án:\nĐoạn trên chỉ ra rằng cho một buổi chiều, từ 3:30-6:00pm thì giá là 7.20. Hoặc là bạn có thể trả cho 1 giờ là 3.50 ( không phải complete afternoon session) nên loại câu A. 2 giờ cho 5.70 ( cũng không phải complete afternoon session) loại câu B. Vậy đáp án là câu C"}, "14": {"answer_label": "14. C", "quote": "At 5 p.m. children are given something more substantial, such as pasta or a casserole. Please inform us of any allergies that your child might have and we'll make sure they're offered a suitable alternative", "explain": "Câu hỏi: What does the manager say about food?\nA Children with allergies should bring their own food.\nB Children may bring healthy snacks with them.\nC Children are given a proper meal at 5 p.m.\nKeywords được paraphrase:\nGiven proper meal - Given something more substaintial Giải thích đáp án:\nĐoạn trên chỉ ra rằng vào lúc 5 giờ thì trẻ sẽ được cho ăn đầy đủ hơn, ví dụ như pasta... vậy đáp án là câu C"}, "15": {"answer_label": "15. A", "quote": "As you may know, the childcare service runs through the school holidays from 8 a.m. to 6 p.m. We offer a really varied and exciting programme to keep the children entertained - we don't want them to feel as if they are still at school! It will also feel different because they'll get the chance to make new friends with children from other schools - spaces are available for them because a lot of our termtime children don't always attend during the holiday. In the past, parents have asked if children over the age of 11 are allowed to come with their younger brothers and sisters - but I'm afraid we're unable to do this because of the type of insurance we have.", "explain": "Câu hỏi: What is different about arrangements in the school holidays?\nA Children from other schools can attend.\nB Older children can attend.\nC A greater number of children can attend.\nKeywords được paraphrase:\nThey'll get the chance to make new friends with children from other schools - children from other schools can attend\nGiải thích đáp án:\nĐoạn trên chỉ ra rằng những đứa trẻ sẽ có cơ hội kết bạn với những đứa trẻ từ trường khác. Có rất nhiều không gian cho chúng vì những học sinh của chúng tôi thường không đến vào những ngày lễ. Vậy đáp án là A"}, "16": {"answer_label": "16. E", "quote": "She does two sessions: one for the over 8 s and one for the younger children. This is the only activity which we have to make an extra charge for but it's well worth it", "explain": "Câu hỏi: What information is given about each of the following activities on offer?\nChoose FIVE answers from the box and write the correct letter, A-G, next to Questions 16-20.\nInformation\n     A has limited availability\nB is no longer available\nC is for over 8s only\nD requires help from parents\nE involves an additional fee\nF is a new activity\nG was requested by children\nActivities\n16 Spanish\t\nKeywords được paraphrase:\nextra charge - additional fee\nGiải thích đáp án:\nĐoạn trên chỉ ra rằng đây là hoạt động duy nhất mà chúng tôi thu thêm phí. Vậy đáp án là E"}, "17": {"answer_label": "17. D", "quote": "On Mondays, she teaches singing and percussion to groups of children. We do rely on parental support for this, so if any of you sing or play an instrument and would be prepared to help out at these sessions, we'd be delighted", "explain": "Câu hỏi: What information is given about each of the following activities on offer?\nChoose FIVE answers from the box and write the correct letter, A-G, next to Questions 16-20.\nInformation\nA has limited availability\nB is no longer available\nC is for over 8s only\nD requires help from parents\nE involves an additional fee\nF is a new activity\nG was requested by children\nActivities\n17 Music\t\nKeywords được paraphrase:\nRely on parental support - requires help from parents\nGiải thích đáp án:\nĐoạn trên chỉ ra rằng chúng tôi phụ thuộc vào sự giúp đỡ của phụ huynh, nên nếu phụ huynh nào có thể hát hoặc chơi nhạc cụ thì giúp đỡ chúng tôi. Vậy đáp án là D"}, "18": {"answer_label": "18. G", "quote": "Painting continues to be one of the most popular activities. To begin with we weren't keen on offering this because of the extra mess involved, but children kept asking if they could do some art and so we finally gave in", "explain": "Câu hỏi: What information is given about each of the following activities on offer?\nChoose FIVE answers from the box and write the correct letter, A-G, next to Questions 16-20.\nInformation\nA has limited availability\nB is no longer available\nC is for over 8s only\nD requires help from parents\nE involves an additional fee\nF is a new activity\nG was requested by children\nActivities\n18 Painting ...\nKeywords được paraphrase:\nChildren kept asking - requested by children\nGiải thích đáp án:\nĐoạn trên chỉ ra Bọn trẻ cứ hỏi về việc chúng có thể làm vẽ không và cuối cùng chúng tôi đưa nó vào. Vậy đáp án là G"}, "19": {"answer_label": "19. F", "quote": "Yoga is something that we've been meaning to introduce for some time but haven't been able to find anyone available to teach it until now that is.", "explain": "Câu hỏi: What information is given about each of the following activities on offer?\nChoose FIVE answers from the box and write the correct letter, A-G, next to Questions 16-20.\nInformation\nA has limited availability\nB is no longer available\nC is for over 8s only\nD requires help from parents\nE involves an additional fee\nF is a new activity\nG was requested by children\nActivities\n19 Yoga ...\nKeywords được paraphrase:\nuntil now - new\nGiải thích đáp án:\nĐoạn trên chỉ ra Yoga là hoạt động mà chúng tôi giới thiệu nhưng vẫn chưa tìm ra được người dạy, cho tới bây giờ chúng tôi đã tìm được. Vậy đáp án là F"}, "20": {"answer_label": "20. C", "quote": "They make a different sort of cake, or pizza or bread each week. Although the younger children love doing it, we found that the mess was just too much, so we've decided to restrict this to the over 8s, as they are better able to clean up after themselves", "explain": "Câu hỏi: What information is given about each of the following activities on offer?\nChoose FIVE answers from the box and write the correct letter, A-G, next to Questions 16-20.\nInformation\nA has limited availability\nB is no longer available\nC is for over 8s only\nD requires help from parents\nE involves an additional fee\nF is a new activity\nG was requested by children\nActivities\n20 Cooking .\nKeywords được paraphrase:\nto restrict this to the over 8s - is for over 8s only\nGiải thích đáp án:\nĐoạn trên chỉ ra rằng họ làm một loại bánh khác nhau, hoặc bánh pizza hoặc bánh mì mỗi tuần. Mặc dù những đứa trẻ nhỏ tuổi thích làm điều đó, nhưng chúng tôi nhận thấy rằng tình trạng lộn xộn quá nhiều, vì vậy chúng tôi đã quyết định hạn chế việc này ở những người trên 8 tuổi vì chúng có khả năng tự dọn dẹp tốt hơn. Vậy đáp án là C"}}, "script_full": [{"speaker": null, "text": "Good afternoon. My name's Mrs Carter and I run the before and after school extended hours childcare service. I hope you've had a chance to have a good look around the school and talk to staff and pupils. I know that many of you are interested in using our childcare service when your child joins the school, and perhaps you already know something about it, but for those that don't, I'll go through the main details now.", "qids": []}, {"speaker": null, "text": "We offer childcare for children from the ages of four to eleven both before and after school. I know that many parents who work find this service invaluable. You can leave your child with us safe in the knowledge that they will be extremely well cared for.", "qids": []}, {"speaker": null, "text": "We are insured to provide care for up to 70 children, although we rarely have this many attending at any one session. I think we generally expect around 50-60 children for the afternoon sessions and about half that number for the breakfast sessions. Although we currently do have 70 children registered with us, not all of these attend every day. It's ten years since we began offering an extended hours service and we've come a long way during that time. When we first opened, we only had about 20 children attending regularly.", "qids": ["11", "12"]}, {"speaker": null, "text": "We try to keep our costs as low as we can and we think we provide very good value for money. For the afternoon sessions, which run from 3.30 until 6 p.m., it's £7.20. But if you prefer, you can pay for one hour only, which costs £3.50, or two hours which costs £5.70.", "qids": ["13"]}, {"speaker": null, "text": "The cost of the childcare includes food and snacks. They'll be given breakfast in the morning and in the afternoon, a healthy snack as soon as they finish school. At 5 p.m. children are given something more substantial, such as pasta or a casserole. Please inform us of any allergies that your child might have and we'll make sure they're offered a suitable alternative.", "qids": ["14"]}, {"speaker": null, "text": "As you may know, the childcare service runs through the school holidays from 8 a.m. to 6 p.m. We offer a really varied and exciting programme to keep the children entertained - we don't want them to feel as if they are still at school! It will also feel different because they'll get the chance to make new friends with children from other schools - spaces are available for them because a lot of our term-time children don't always attend during the holiday. In the past, parents have asked if children over the age of 11 are allowed to come with their younger brothers and sisters - but I'm afraid we're unable to do this because of the type of insurance we have.", "qids": ["15"]}, {"speaker": null, "text": "So now let me tell you about some of the activities that your child can do during the after-school sessions. As well as being able to use the playground equipment, computers and the library, there is usually at least one 'special' activity that children can do each day. For example, Spanish. We have a specialist teacher coming in every Thursday to give a basic introduction to the language through games and songs. She does two sessions: one for the over 8s and one for the younger children. This is the only activity which we have to make an extra charge for but it's well worth it.", "qids": ["16"]}, {"speaker": null, "text": "Once a week the children have the opportunity to do some music. We're very lucky that one of our staff is a member of a folk band. On Mondays, she teaches singing and percussion to groups of children. We do rely on parental support for this, so if any of you sing or play an instrument and would be prepared to help out at these sessions, we'd be delighted.", "qids": ["17"]}, {"speaker": null, "text": "Painting continues to be one of the most popular activities. To begin with we weren't keen on offering this because of the extra mess involved, but children kept asking if they could do some art and so we finally gave in. Art is great for helping the children to relax after working hard at school all day.", "qids": ["18"]}, {"speaker": null, "text": "Yoga is something that we've been meaning to introduce for some time but haven't been able to find anyone available to teach it until now that is. So we'll see how this goes. Hopefully, children will benefit in all sorts of ways from this.", "qids": ["19"]}, {"speaker": null, "text": "Cooking is another popular activity. They make a different sort of cake, or pizza or bread each week. Although the younger children love doing it, we found that the mess was just too much, so we've decided to restrict this to the over 8s, as they are better able to clean up after themselves.", "qids": ["20"]}], "groups": [{"type": "choice", "qids": ["11", "12"], "prompt": "Which TWO facts are given about the school’s extended hours childcare service?", "options": {"A": "It started recently.", "B": "More children attend after school than before school.", "C": "An average of 50 children attend in the mornings.", "D": "A child cannot attend both the before and after school sessions.", "E": "The maximum number of children who can attend is 70."}, "multi": true, "header": "Choose TWO letters, A-E."}, {"type": "choice", "qids": ["13"], "prompt": "How much does childcare cost for a complete afternoon session per child?", "options": {"A": "£3.50", "B": "£5.70", "C": "£7.20"}, "multi": false, "header": "Questions 13-15 Choose the correct letter, A, B or C."}, {"type": "choice", "qids": ["14"], "prompt": "What does the manager say about food?", "options": {"A": "Children with allergies should bring their own food.", "B": "Children may bring healthy snacks with them.", "C": "Children are given a proper meal at 5 p.m."}, "multi": false, "header": null}, {"type": "choice", "qids": ["15"], "prompt": "What is different about arrangements in the school holidays?", "options": {"A": "Children from other schools can attend.", "B": "Older children can attend.", "C": "A greater number of children can attend."}, "multi": false, "header": null}, {"type": "matching", "qids": ["16", "17", "18", "19", "20"], "box_title": "Information", "box": {"A": "has limited availability", "B": "is no longer available", "C": "is for over 8s only", "D": "requires help from parents", "E": "involves an additional fee", "F": "is a new activity", "G": "was requested by children"}, "stems": [{"qid": "16", "prompt": "Spanish"}, {"qid": "17", "prompt": "Music"}, {"qid": "18", "prompt": "Painting"}, {"qid": "19", "prompt": "Yoga"}, {"qid": "20", "prompt": "Cooking"}], "header": "Choose FIVE answers from the box and write the correct letter, A-G, next to Questions 16-20."}]}, {"part": 3, "kind": "mcq", "title": "Automation and the Future of Work (The Luddites)", "instructions": null, "audio": "audio/test3/part3.mp3", "answers": {"21": "A", "22": "E", "23": "B", "24": "D", "25": "G", "26": "E", "27": "B", "28": "C", "29": "F", "30": "A"}, "explanations": {"19": {"answer_label": "YOUNG MAN: That seminar yesterday on automation and the future of work was really good, wasn’t it? Looking at the first industrial revolution in Britain in the 19th century and seeing how people reacted to massive change was a real eye-opener.\nYOUNG WOMAN: Yes. It was interesting to hear how people felt about automation then and what challenges they faced. I didn’t know that first started with workers in the textile industry.\n\n\nYOUNG MAN: With those protesting workers called the Luddites destroying their knitting machines because they were so worried about losing their jobs. \nYOUNG WOMAN: Yes, and ultimately, they didn't achieve anything. 21/22 And anyway, industrialisation created more jobs than it destroyed.\nYOUNG MAN: Yes, that’s true - but it probably didn’t seem a positive thing at the time. I can see why the Luddites felt so threatened21/22\n\nYOUNG WOMAN: I know. I’m sure I would have felt the same. The discussion about the future of work was really optimistic for a change. I like the idea that work won’t involve doing boring, repetitive tasks, as robots will do all that. Normally, you only hear negative stuff about the future.\nYOUNG MAN: Bit too optimistic, don’t you think? For example, I can't see how people are about to have more leisure time, when all the evidence shows people are spending longer than ever at work23/24\n\nYOUNG WOMAN: No - that's true. And what about lower unemployment? I’m not so sure about that.  23/24\nYOUNG MAN:  Perhaps in the long term - but not in the foreseeable future.\nYOUNG WOMAN: Mmm. And I expect most people will be expected to work until they’re much older - as everyone’s living much longer.\nYOUNG MAN: That’s already happening.\nYOUNG WOMAN: I enjoyed all that stuff on how technology has changed some jobs and how they’re likely to change in the near future.\nYOUNG MAN: Yeah, incredible. Like accountants. You might think all the technological innovations would have put them out of a job, but in fact there are more of them than ever. They’re still really in demand and have become far more efficient. 25 \nYOUNG WOMAN: Right. That was amazing. Twenty times more accountants in this country compared to the 19th century.\nYOUNG MAN: I know. I’d never have thought that demand for hairdressing would have gone up so much in the last hundred years. One hairdresser for every 287 people now, compared to one for over 1,500.\nYOUNG WOMAN: Yeah because people’s earning power has gone up so they can afford to spend more on personal services like that. 26\nYOUNG MAN: But technology hasn’t changed the actual job that much.\nYOUNG WOMAN: No, they’ve got hairdryers, etc. but it’s one job where you don’t depend on a computer... The kind of work that administrative staff do has changed enormously, thanks to technology. Even 20 years ago there were secretaries doing dictation and typing.\nYOUNG MAN: Yes. Really boring compared to these days, when they're given much more responsibility and higher status. 27\nYOUNG WOMAN: Mmm. A lot of graduates go in for this kind of work now ... I’d expected there to be a much bigger change in the number of agricultural workers in the 19th century. But the 1871 census showed that roughly 25% of the population worked on the land.\nYOUNG MAN: Yeah, I’d have assumed it would be more than 50%. Now it's less than 0.2%. 28\nYOUNG WOMAN: What about care workers?\nYOUNG MAN: They barely existed in the 19th century as people’s lifespan was so much shorter. But now of course this sector will see huge growth. 29\n\nYOUNG WOMAN: Yeah - and it’s hard enough to meet current demand. The future looks quite bleak for bank clerks. They’ve been in decline since ATMs were introduced in the eighties.\n\nYOUNG MAN: And technology will certainly make most of the jobs they do now redundant, 30 I think.\n\nYOUNG WOMAN: I agree, although the situation may change. It’s very hard to predict what will happen.", "quote": "YOUNG MAN: That seminar yesterday on automation and the future of work was really good, wasn’t it? Looking at the first industrial revolution in Britain in the 19th century and seeing how people reacted to massive change was a real eye-opener.\nYOUNG WOMAN: Yes. It was interesting to hear how people felt about automation then and what challenges they faced. I didn’t know that first started with workers in the textile industry.\n\n\nYOUNG MAN: With those protesting workers called the Luddites destroying their knitting machines because they were so worried about losing their jobs. \nYOUNG WOMAN: Yes, and ultimately, they didn't achieve anything. 21/22 And anyway, industrialisation created more jobs than it destroyed.\nYOUNG MAN: Yes, that’s true - but it probably didn’t seem a positive thing at the time. I can see why the Luddites felt so threatened21/22\n\nYOUNG WOMAN: I know. I’m sure I would have felt the same. The discussion about the future of work was really optimistic for a change. I like the idea that work won’t involve doing boring, repetitive tasks, as robots will do all that. Normally, you only hear negative stuff about the future.\nYOUNG MAN: Bit too optimistic, don’t you think? For example, I can't see how people are about to have more leisure time, when all the evidence shows people are spending longer than ever at work23/24\n\nYOUNG WOMAN: No - that's true. And what about lower unemployment? I’m not so sure about that.  23/24\nYOUNG MAN:  Perhaps in the long term - but not in the foreseeable future.\nYOUNG WOMAN: Mmm. And I expect most people will be expected to work until they’re much older - as everyone’s living much longer.\nYOUNG MAN: That’s already happening.\nYOUNG WOMAN: I enjoyed all that stuff on how technology has changed some jobs and how they’re likely to change in the near future.\nYOUNG MAN: Yeah, incredible. Like accountants. You might think all the technological innovations would have put them out of a job, but in fact there are more of them than ever. They’re still really in demand and have become far more efficient. 25 \nYOUNG WOMAN: Right. That was amazing. Twenty times more accountants in this country compared to the 19th century.\nYOUNG MAN: I know. I’d never have thought that demand for hairdressing would have gone up so much in the last hundred years. One hairdresser for every 287 people now, compared to one for over 1,500.\nYOUNG WOMAN: Yeah because people’s earning power has gone up so they can afford to spend more on personal services like that. 26\nYOUNG MAN: But technology hasn’t changed the actual job that much.\nYOUNG WOMAN: No, they’ve got hairdryers, etc. but it’s one job where you don’t depend on a computer... The kind of work that administrative staff do has changed enormously, thanks to technology. Even 20 years ago there were secretaries doing dictation and typing.\nYOUNG MAN: Yes. Really boring compared to these days, when they're given much more responsibility and higher status. 27\nYOUNG WOMAN: Mmm. A lot of graduates go in for this kind of work now ... I’d expected there to be a much bigger change in the number of agricultural workers in the 19th century. But the 1871 census showed that roughly 25% of the population worked on the land.\nYOUNG MAN: Yeah, I’d have assumed it would be more than 50%. Now it's less than 0.2%. 28\nYOUNG WOMAN: What about care workers?\nYOUNG MAN: They barely existed in the 19th century as people’s lifespan was so much shorter. But now of course this sector will see huge growth. 29\n\nYOUNG WOMAN: Yeah - and it’s hard enough to meet current demand. The future looks quite bleak for bank clerks. They’ve been in decline since ATMs were introduced in the eighties.\n\nYOUNG MAN: And technology will certainly make most of the jobs they do now redundant, 30 I think.\n\nYOUNG WOMAN: I agree, although the situation may change. It’s very hard to predict what will happen.", "explain": "NAM: Buổi hội thảo về tự động hóa và nghề nghiệp trong tương lai ngày hôm qua thực sự rất tuyệt phải không? Nhìn vào cuộc cách mạng công nghiệp lần thứ nhất ở Anh vào thế kỷ 19 và xem cách mọi người phản ứng với sự thay đổi lớn khiến tôi thực sự được mở rộng tầm mắt.\nNỮ: Vâng. Thật thú vị khi được tìm hiểu về việc mọi người cảm thấy thế nào đối với tự động hóa và những thách thức mà họ phải đối mặt. Tôi không biết công nhân trong ngành dệt may là những người đầu tiên đối diện với những điều đó. \nNAM: Những công nhân biểu tình còn được gọi là Luddites, đã phá hủy máy dệt kim vì họ lo rằng họ sẽ mất việc.\n\nNỮ: Vâng, và cuối cùng, họ không đạt được gì cả. 21/22 Và dù sao đi nữa, công nghiệp hóa tạo ra nhiều việc làm hơn là khiến cho nhiều người mất việc. \nNAM: Vâng, đúng vậy - nhưng có lẽ nó không phải là một điều tích cực vào thời điểm đó. Tôi có thể hiểu tại sao Luddites cảm thấy bị đe dọa như vậy21/22\nNỮ: Tôi biết. Tôi chắc rằng tôi cũng sẽ cảm thấy như vậy. Buổi thảo luận về nghề nghiệp trong tương lai thực sự là một sự thay đổi tích cực. Tôi thích quan điểm cho rằng việc làm sẽ không còn nhàm chán hay lặp đi lăp lại hàng ngày như rô bốt nữa. Thường thường, bạn chỉ nghe những điều tiêu cực về tương lai.\nNAM: Tôi lại nghĩ suy nghĩ này lạc quan quá mức, bạn có nghĩ vậy không? Ví dụ, tôi không hiểu tại sao mọi người lại có nhiều thời gian giải trí hơn, khi tất cả các bằng chứng cho thấy mọi người đang dành nhiều thời gian hơn cho công việc 23/24\nNỮ: Bạn nói đúng. Còn về tỷ lệ thất nghiệp sẽ giảm? Tôi không chắc lắm về điều đó. 23/24\n\nNAM: Có lẽ phải rất lâu sau này mới được như thế - nhưng không phải trong tương lai gần.\nNỮ: Ừm. Và tôi cho rằng đa số mọi người sẽ phải làm việc rất lâu – bởi tuổi thọ của mọi người đang ngày càng tăng. \nNAM: Điều đó thật ra đã xảy ra rồi.\nNỮ: Tôi rất thích tất cả những nội dung về cách công nghệ đã thay đổi một số công việc và cách chúng có thể thay đổi trong tương lai gần.\nNAM: Đúng vậy, thật không thể tin được. Giống như kế toán. Có thể bạn sẽ nghĩ rằng tất cả những đổi mới công nghệ sẽ khiến họ mất việc làm, nhưng thực tế là có nhiều hơn bao giờ hết. Nhu cầu cho vị trí kế toán vẫn còn nhiều và họ đang trở nên hiệu quả hơn rất nhiều. 25\nNỮ: Đúng. Điều đó thật tuyệt vời. Số lượng nhân viên kế toán ở nước ta cao gấp 20 lần so với thế kỷ 19.\nNAM: Tôi hiểu. Tôi không thể ngờ rằng nhu cầu làm tóc lại tăng cao như vậy trong vòng một trăm năm qua. Ở thời điểm hiện tại, cứ 287 người thì có một thợ làm tóc, so quá khứ là cứ 1.500 người thì sẽ có 1 người là thợ làm tóc. \nNỮ: Vâng, bởi vì khả năng kiếm tiền của mọi người đã tăng lên nên họ có khả năng chi trả nhiều hơn cho các dịch vụ cá nhân như thế. 26\nNAM: Nhưng công nghệ không thay đổi công việc thực tế nhiều lắm.\nNỮ: Không, họ có máy sấy tóc, v.v. nhưng đó là một công việc mà bạn không phụ thuộc vào máy tính... Loại công việc mà nhân viên hành chính làm đã thay đổi rất nhiều nhờ công nghệ. Thậm chí 20 năm trước đã có những thư ký viết chính tả và đánh máy.\nNAM: Vâng. Thực sự nhàm chán so với thời điểm hiện tại, khi họ phải chịu trách nhiệm nhiều hơn cũng như ở vị trí cao hơn. 27\nNỮ: Ừm. Hiện nay có rất nhiều sinh viên tốt nghiệp làm  công việc này... Tôi đoán là   sẽ có một sự thay đổi lớn hơn nhiều về số lượng công nhân nông nghiệp trong thế kỷ 19. Nhưng cuộc điều tra dân số năm 1871 cho thấy khoảng 25% dân số làm việc trên đất liền.\nNAM:  Vâng, tôi đã nghĩ là hơn 50%. Bây giờ nó ít hơn 0,2%. 28\n\nNỮ: Còn nhân viên chăm sóc thì sao?\nNAM: Loại công việc này dường như không tồn tại vào thế kỷ 19 vì tuổi thọ của con người ngắn hơn rất nhiều. Nhưng bây giờ tất nhiên lĩnh vực này sẽ tăng trưởng rất mạnh. 29\n\nNỮ: Vâng - và nó đủ khó để đáp ứng nhu cầu hiện tại. Tương lai có vẻ ảm đạm đối với nhân viên ngân hàng. Số lượng nhân viên ngân hàng đã suy giảm kể từ khi máy ATM được đưa vào sử dụng vào những năm tám mươi.\nNAM: Và công nghệ chắc chắn sẽ khiến hầu hết những công việc họ làm hiện nay trở nên dư thừa, 30 tôi nghĩ vậy.\n\nNỮ: Tôi đồng ý, mặc dù tình hình có thể thay đổi. Rất khó để dự đoán điều gì sẽ xảy ra."}, "21": {"answer_label": "21. A", "quote": "YOUNG MAN: With those protesting workers called the Luddites destroying their knitting machines because they were so worried about losing their jobs. \nYOUNG WOMAN: Yes, and ultimately, they didn't achieve anything. 21/22 And anyway, industrialisation created more jobs than it destroyed.", "explain": "Từ khóa: opinions, Luddites, students, express \nDựa vào từ khóa và bài nghe ta xác định được thông tin sau “Yes, and ultimately, they didn't achieve anything” – để chọn được đáp án chính xác là A. \nTrong đó, cấu trúc “they didn’t achieve anything” được diễn đạt lại thành “their actions were ineffective”"}, "22": {"answer_label": "22. E", "quote": "YOUNG MAN: Yes, that’s true - but it probably didn’t seem a positive thing at the time. I can see why the Luddites felt so threatened21/22", "explain": "Từ khóa: opinions, Luddites, students, express \nDựa vào từ khóa và bài nghe ta xác định được thông tin sau: Các công nhân dệt may cảm thấy họ sẽ bị mất việc do sự xuất hiện những máy dệt kim, chính vì thế nhân vật vật nữ đã nói “it probably didn’t seem a positive thing at the time. I can see why the Luddites felt so threatened” – Tạm dịch “nhưng có lẽ nó không phải là một điều tích cực vào thời điểm đó. Tôi có thể hiểu tại sao Luddites cảm thấy bị đe dọa như vậy” => đáp án đúng là E. \nTrong đó, “I can see why” có nét nghĩa tương đồng với “understandable” và “the Luddites felt so threatened” ~ “their attitude”"}, "23": {"answer_label": "23. D", "quote": "YOUNG MAN: Bit too optimistic, don’t you think? For example, I can't see how people are about to have more leisure time, when all the evidence shows people are spending longer than ever at work23/24", "explain": "Từ khóa: predictions, future of work, students, doubtful \nỞ đây, doubtful nghĩa là “ngờ vực, nghi ngờ, không tin tưởng” nên người học cần tìm những từ hoặc ngữ thể hiện sự nghi ngờ để dễ tìm ra đáp án đúng. \nDựa vào từ khóa và bài nghe ta xác định được đoạn thông tin sau “, I can't see how people are about to have more leisure time, when all the evidence shows people are spending longer than ever at work” – Tạm dịch “tôi không hiểu tại sao mọi người lại có nhiều thời gian giải trí hơn, khi tất cả các bằng chứng cho thấy mọi người đang dành nhiều thời gian hơn cho công việc” \nĐáp án chính xác là D \nTrong đó, “I can’t see how”, “when all the evidence shows” = doubtful \n“have more leisure time” = “working hours will be shorter”"}, "24": {"answer_label": "24. B", "quote": "YOUNG WOMAN: No - that's true. And what about lower unemployment? I’m not so sure about that.  23/24\nYOUNG MAN:  Perhaps in the long term - but not in the foreseeable future.", "explain": "Từ khóa: predictions, future of work, students, doubtful \nỞ đây, doubtful nghĩa là “ngờ vực, nghi ngờ, không tin tưởng” nên người học cần tìm những từ hoặc ngữ thể hiện sự nghi ngờ để dễ tìm ra đáp án đúng. \nDựa vào từ khóa và bài nghe ta xác định được đoạn thông tin sau “And what about lower unemployment? I’m not so sure about that” – Tạm dịch – “Còn về việc giảm tỷ lệ thất nghiệp thì sao? Tôi không chắc về điều này lắm” \nĐáp án đúng là B \nTrong đó, “I’m not so sure” = doubtful\n“Lower unemployment” = “Unemployment will fall”"}, "25": {"answer_label": "25. G", "quote": "YOUNG MAN: Yeah, incredible. Like accountants. You might think all the technological innovations would have put them out of a job, but in fact there are more of them than ever. They’re still really in demand and have become far more efficient. 25", "explain": "Từ khóa: Accountants \nTừ câu số 25 đến 30 đề bài yêu cầu thí sinh match “comments” và jobs. Đối với các câu hỏi này, thí sinh cần tập trung vào “jobs” để locate được vị trí chứa thông tin trong bài. \nCăn cứ và từ khóa và bài nghe, ta xác định được thông tin sau “YOUNG MAN: Yeah, incredible. Like accountants. (…) but in fact there are more of them than ever. They’re still really in demand and have become far more efficient” – ta chọn được đáp án chính xác là G \nTrong đó, “they’re still really in demand” = “employment have risen” \n“far more efficient” = “productivity have risen”"}, "287": {"answer_label": "YOUNG MAN: That seminar yesterday on automation and the future of work was really good, wasn’t it? Looking at the first industrial revolution in Britain in the 19th century and seeing how people reacted to massive change was a real eye-opener.\nYOUNG WOMAN: Yes. It was interesting to hear how people felt about automation then and what challenges they faced. I didn’t know that first started with workers in the textile industry.\n\n\nYOUNG MAN: With those protesting workers called the Luddites destroying their knitting machines because they were so worried about losing their jobs. \nYOUNG WOMAN: Yes, and ultimately, they didn't achieve anything. 21/22 And anyway, industrialisation created more jobs than it destroyed.\nYOUNG MAN: Yes, that’s true - but it probably didn’t seem a positive thing at the time. I can see why the Luddites felt so threatened21/22\n\nYOUNG WOMAN: I know. I’m sure I would have felt the same. The discussion about the future of work was really optimistic for a change. I like the idea that work won’t involve doing boring, repetitive tasks, as robots will do all that. Normally, you only hear negative stuff about the future.\nYOUNG MAN: Bit too optimistic, don’t you think? For example, I can't see how people are about to have more leisure time, when all the evidence shows people are spending longer than ever at work23/24\n\nYOUNG WOMAN: No - that's true. And what about lower unemployment? I’m not so sure about that.  23/24\nYOUNG MAN:  Perhaps in the long term - but not in the foreseeable future.\nYOUNG WOMAN: Mmm. And I expect most people will be expected to work until they’re much older - as everyone’s living much longer.\nYOUNG MAN: That’s already happening.\nYOUNG WOMAN: I enjoyed all that stuff on how technology has changed some jobs and how they’re likely to change in the near future.\nYOUNG MAN: Yeah, incredible. Like accountants. You might think all the technological innovations would have put them out of a job, but in fact there are more of them than ever. They’re still really in demand and have become far more efficient. 25 \nYOUNG WOMAN: Right. That was amazing. Twenty times more accountants in this country compared to the 19th century.\nYOUNG MAN: I know. I’d never have thought that demand for hairdressing would have gone up so much in the last hundred years. One hairdresser for every 287 people now, compared to one for over 1,500.\nYOUNG WOMAN: Yeah because people’s earning power has gone up so they can afford to spend more on personal services like that. 26\nYOUNG MAN: But technology hasn’t changed the actual job that much.\nYOUNG WOMAN: No, they’ve got hairdryers, etc. but it’s one job where you don’t depend on a computer... The kind of work that administrative staff do has changed enormously, thanks to technology. Even 20 years ago there were secretaries doing dictation and typing.\nYOUNG MAN: Yes. Really boring compared to these days, when they're given much more responsibility and higher status. 27\nYOUNG WOMAN: Mmm. A lot of graduates go in for this kind of work now ... I’d expected there to be a much bigger change in the number of agricultural workers in the 19th century. But the 1871 census showed that roughly 25% of the population worked on the land.\nYOUNG MAN: Yeah, I’d have assumed it would be more than 50%. Now it's less than 0.2%. 28\nYOUNG WOMAN: What about care workers?\nYOUNG MAN: They barely existed in the 19th century as people’s lifespan was so much shorter. But now of course this sector will see huge growth. 29\n\nYOUNG WOMAN: Yeah - and it’s hard enough to meet current demand. The future looks quite bleak for bank clerks. They’ve been in decline since ATMs were introduced in the eighties.\n\nYOUNG MAN: And technology will certainly make most of the jobs they do now redundant, 30 I think.\n\nYOUNG WOMAN: I agree, although the situation may change. It’s very hard to predict what will happen.", "quote": "YOUNG MAN: That seminar yesterday on automation and the future of work was really good, wasn’t it? Looking at the first industrial revolution in Britain in the 19th century and seeing how people reacted to massive change was a real eye-opener.\nYOUNG WOMAN: Yes. It was interesting to hear how people felt about automation then and what challenges they faced. I didn’t know that first started with workers in the textile industry.\n\n\nYOUNG MAN: With those protesting workers called the Luddites destroying their knitting machines because they were so worried about losing their jobs. \nYOUNG WOMAN: Yes, and ultimately, they didn't achieve anything. 21/22 And anyway, industrialisation created more jobs than it destroyed.\nYOUNG MAN: Yes, that’s true - but it probably didn’t seem a positive thing at the time. I can see why the Luddites felt so threatened21/22\n\nYOUNG WOMAN: I know. I’m sure I would have felt the same. The discussion about the future of work was really optimistic for a change. I like the idea that work won’t involve doing boring, repetitive tasks, as robots will do all that. Normally, you only hear negative stuff about the future.\nYOUNG MAN: Bit too optimistic, don’t you think? For example, I can't see how people are about to have more leisure time, when all the evidence shows people are spending longer than ever at work23/24\n\nYOUNG WOMAN: No - that's true. And what about lower unemployment? I’m not so sure about that.  23/24\nYOUNG MAN:  Perhaps in the long term - but not in the foreseeable future.\nYOUNG WOMAN: Mmm. And I expect most people will be expected to work until they’re much older - as everyone’s living much longer.\nYOUNG MAN: That’s already happening.\nYOUNG WOMAN: I enjoyed all that stuff on how technology has changed some jobs and how they’re likely to change in the near future.\nYOUNG MAN: Yeah, incredible. Like accountants. You might think all the technological innovations would have put them out of a job, but in fact there are more of them than ever. They’re still really in demand and have become far more efficient. 25 \nYOUNG WOMAN: Right. That was amazing. Twenty times more accountants in this country compared to the 19th century.\nYOUNG MAN: I know. I’d never have thought that demand for hairdressing would have gone up so much in the last hundred years. One hairdresser for every 287 people now, compared to one for over 1,500.\nYOUNG WOMAN: Yeah because people’s earning power has gone up so they can afford to spend more on personal services like that. 26\nYOUNG MAN: But technology hasn’t changed the actual job that much.\nYOUNG WOMAN: No, they’ve got hairdryers, etc. but it’s one job where you don’t depend on a computer... The kind of work that administrative staff do has changed enormously, thanks to technology. Even 20 years ago there were secretaries doing dictation and typing.\nYOUNG MAN: Yes. Really boring compared to these days, when they're given much more responsibility and higher status. 27\nYOUNG WOMAN: Mmm. A lot of graduates go in for this kind of work now ... I’d expected there to be a much bigger change in the number of agricultural workers in the 19th century. But the 1871 census showed that roughly 25% of the population worked on the land.\nYOUNG MAN: Yeah, I’d have assumed it would be more than 50%. Now it's less than 0.2%. 28\nYOUNG WOMAN: What about care workers?\nYOUNG MAN: They barely existed in the 19th century as people’s lifespan was so much shorter. But now of course this sector will see huge growth. 29\n\nYOUNG WOMAN: Yeah - and it’s hard enough to meet current demand. The future looks quite bleak for bank clerks. They’ve been in decline since ATMs were introduced in the eighties.\n\nYOUNG MAN: And technology will certainly make most of the jobs they do now redundant, 30 I think.\n\nYOUNG WOMAN: I agree, although the situation may change. It’s very hard to predict what will happen.", "explain": "NAM: Buổi hội thảo về tự động hóa và nghề nghiệp trong tương lai ngày hôm qua thực sự rất tuyệt phải không? Nhìn vào cuộc cách mạng công nghiệp lần thứ nhất ở Anh vào thế kỷ 19 và xem cách mọi người phản ứng với sự thay đổi lớn khiến tôi thực sự được mở rộng tầm mắt.\nNỮ: Vâng. Thật thú vị khi được tìm hiểu về việc mọi người cảm thấy thế nào đối với tự động hóa và những thách thức mà họ phải đối mặt. Tôi không biết công nhân trong ngành dệt may là những người đầu tiên đối diện với những điều đó. \nNAM: Những công nhân biểu tình còn được gọi là Luddites, đã phá hủy máy dệt kim vì họ lo rằng họ sẽ mất việc.\n\nNỮ: Vâng, và cuối cùng, họ không đạt được gì cả. 21/22 Và dù sao đi nữa, công nghiệp hóa tạo ra nhiều việc làm hơn là khiến cho nhiều người mất việc. \nNAM: Vâng, đúng vậy - nhưng có lẽ nó không phải là một điều tích cực vào thời điểm đó. Tôi có thể hiểu tại sao Luddites cảm thấy bị đe dọa như vậy21/22\nNỮ: Tôi biết. Tôi chắc rằng tôi cũng sẽ cảm thấy như vậy. Buổi thảo luận về nghề nghiệp trong tương lai thực sự là một sự thay đổi tích cực. Tôi thích quan điểm cho rằng việc làm sẽ không còn nhàm chán hay lặp đi lăp lại hàng ngày như rô bốt nữa. Thường thường, bạn chỉ nghe những điều tiêu cực về tương lai.\nNAM: Tôi lại nghĩ suy nghĩ này lạc quan quá mức, bạn có nghĩ vậy không? Ví dụ, tôi không hiểu tại sao mọi người lại có nhiều thời gian giải trí hơn, khi tất cả các bằng chứng cho thấy mọi người đang dành nhiều thời gian hơn cho công việc 23/24\nNỮ: Bạn nói đúng. Còn về tỷ lệ thất nghiệp sẽ giảm? Tôi không chắc lắm về điều đó. 23/24\n\nNAM: Có lẽ phải rất lâu sau này mới được như thế - nhưng không phải trong tương lai gần.\nNỮ: Ừm. Và tôi cho rằng đa số mọi người sẽ phải làm việc rất lâu – bởi tuổi thọ của mọi người đang ngày càng tăng. \nNAM: Điều đó thật ra đã xảy ra rồi.\nNỮ: Tôi rất thích tất cả những nội dung về cách công nghệ đã thay đổi một số công việc và cách chúng có thể thay đổi trong tương lai gần.\nNAM: Đúng vậy, thật không thể tin được. Giống như kế toán. Có thể bạn sẽ nghĩ rằng tất cả những đổi mới công nghệ sẽ khiến họ mất việc làm, nhưng thực tế là có nhiều hơn bao giờ hết. Nhu cầu cho vị trí kế toán vẫn còn nhiều và họ đang trở nên hiệu quả hơn rất nhiều. 25\nNỮ: Đúng. Điều đó thật tuyệt vời. Số lượng nhân viên kế toán ở nước ta cao gấp 20 lần so với thế kỷ 19.\nNAM: Tôi hiểu. Tôi không thể ngờ rằng nhu cầu làm tóc lại tăng cao như vậy trong vòng một trăm năm qua. Ở thời điểm hiện tại, cứ 287 người thì có một thợ làm tóc, so quá khứ là cứ 1.500 người thì sẽ có 1 người là thợ làm tóc. \nNỮ: Vâng, bởi vì khả năng kiếm tiền của mọi người đã tăng lên nên họ có khả năng chi trả nhiều hơn cho các dịch vụ cá nhân như thế. 26\nNAM: Nhưng công nghệ không thay đổi công việc thực tế nhiều lắm.\nNỮ: Không, họ có máy sấy tóc, v.v. nhưng đó là một công việc mà bạn ể hiểu tại sao Luddites cảm thấy bị đe dọa như vậy21/22\nNỮ: Tôi biết. Tôi chắc rằng tôi cũng sẽ cảm thấy như vậy. Buổi thảo luận về nghề nghiệp trong tương lai thực sự là một sự thay đổi tích cực. Tôi thích quan điểm cho rằng việc làm sẽ không còn nhàm chán hay lặp đi lăp lại hàng ngày như rô bốt nữa. Thường thường, bạn chỉ nghe những điều tiêu cực về tương lai.\nNAM: Tôi lại nghĩ suy nghĩ này lạc quan quá mức, bạn có nghĩ vậy không? Ví dụ, tôi không hiểu tại sao mọi người lại có nhiều thời gian giải trí hơn, khi tất cả các bằng chứng cho thấy mọi người đang dành nhiều thời gian hơn cho công việc 23/24\nNỮ: Bạn nói đúng. Còn về tỷ lệ thất nghiệp sẽ giảm? Tôi không chắc lắm về điều đó. 23/24\n\nNAM: Có lẽ phải rất lâu sau này mới được như thế - nhưng không phải trong tương lai gần.\nNỮ: Ừm. Và tôi cho rằng đa số mọi người sẽ phải làm việc rất lâu – bởi tuổi thọ của mọi người đang ngày càng tăng. \nNAM: Điều đó thật ra đã xảy ra rồi.\nNỮ: Tôi rất thích tất cả những nội dung về cách công nghệ đã thay đổi một số công việc và cách chúng có thể thay đổi trong tương lai gần.\nNAM: Đúng vậy, thật không thể tin được. Giống như kế toán. Có thể bạn sẽ nghĩ rằng tất cả những đổi mới công nghệ sẽ khiến họ mất việc làm, nhưng thực tế là có nhiều hơn bao giờ hết. Nhu cầu cho vị trí kế toán vẫn còn nhiều và họ đang trở nên hiệu quả hơn rất nhiều. 25\nNỮ: Đúng. Điều đó thật tuyệt vời. Số lượng nhân viên kế toán ở nước ta cao gấp 20 lần so với thế kỷ 19.\nNAM: Tôi hiểu. Tôi không thể ngờ rằng nhu cầu làm tóc lại tăng cao như vậy trong vòng một trăm năm qua. Ở thời điểm hiện tại, cứ 287 người thì có một thợ làm tóc, so quá khứ là cứ 1.500 người thì sẽ có 1 người là thợ làm tóc. \nNỮ: Vâng, bởi vì khả năng kiếm tiền của mọi người đã tăng lên nên họ có khả năng chi trả nhiều hơn cho các dịch vụ cá nhân như thế. 26\nNAM: Nhưng công nghệ không thay đổi công việc thực tế nhiều lắm.\nNỮ: Không, họ có máy sấy tóc, v.v. nhưng đó là một công việc mà bạn không phụ thuộc vào máy tính... Loại công việc mà nhân viên hành chính làm đã thay đổi rất nhiều nhờ công nghệ. Thậm chí 20 năm trước đã có những thư ký viết chính tả và đánh máy.\nNAM: Vâng. Thực sự nhàm chán so với thời điểm hiện tại, khi họ phải chịu trách nhiệm nhiều hơn cũng như ở vị trí cao hơn. 27\nNỮ: Ừm. Hiện nay có rất nhiều sinh viên tốt nghiệp làm  công việc này... Tôi đoán là   sẽ có một sự thay đổi lớn hơn nhiều về số lượng công nhân nông nghiệp trong thế kỷ 19. Nhưng cuộc điều tra dân số năm 1871 cho thấy khoảng 25% dân số làm việc trên đất liền.\nNAM:  Vâng, tôi đã nghĩ là hơn 50%. Bây giờ nó ít hơn 0,2%. 28\n\nNỮ: Còn nhân viên chăm sóc thì sao?\nNAM: Loại công việc này dường như không tồn tại vào thế kỷ 19 vì tuổi thọ của con người ngắn hơn rất nhiều. Nhưng bây giờ tất nhiên lĩnh vực này sẽ tăng trưởng rất mạnh. 29\n\nNỮ: Vâng - và nó đủ khó để đáp ứng nhu cầu hiện tại. Tương lai có vẻ ảm đạm đối với nhân viên ngân hàng. Số lượng nhân viên ngân hàng đã suy giảm kể từ khi máy ATM được đưa vào sử dụng vào những năm tám mươi.\nNAM: Và công nghệ chắc chắn sẽ khiến hầu hết những công việc họ làm hiện nay trở nên dư thừa, 30 tôi nghĩ vậy.\n\nNỮ: Tôi đồng ý, mặc dù tình hình có thể thay đổi. Rất khó để dự đoán điều gì sẽ xảy ra."}, "500": {"answer_label": "YOUNG MAN: That seminar yesterday on automation and the future of work was really good, wasn’t it? Looking at the first industrial revolution in Britain in the 19th century and seeing how people reacted to massive change was a real eye-opener.\nYOUNG WOMAN: Yes. It was interesting to hear how people felt about automation then and what challenges they faced. I didn’t know that first started with workers in the textile industry.\n\n\nYOUNG MAN: With those protesting workers called the Luddites destroying their knitting machines because they were so worried about losing their jobs. \nYOUNG WOMAN: Yes, and ultimately, they didn't achieve anything. 21/22 And anyway, industrialisation created more jobs than it destroyed.\nYOUNG MAN: Yes, that’s tr cretaries doing dictation and typing.\nYOUNG MAN: Yes. Really boring compared to these days, when they're given much more responsibility and higher status. 27\nYOUNG WOMAN: Mmm. A lot of graduates go in for this kind of work now ... I’d expected there to be a much bigger change in the number of agricultural workers in the 19th century. But the 1871 census showed that roughly 25% of the population worked on the land.\nYOUNG MAN: Yeah, I’d have assumed it would be more than 50%. Now it's less than 0.2%. 28\nYOUNG WOMAN: What about care workers?\nYOUNG MAN: They barely existed in the 19th century as people’s lifespan was so much shorter. But now of course this sector will see huge growth. 29\n\nYOUNG WOMAN: Yeah - and it’s hard enough to meet current demand. The future looks quite bleak for bank clerks. They’ve been in decline since ATMs were introduced in the eighties.\n\nYOUNG MAN: And technology will certainly make most of the jobs they do now redundant, 30 I think.\n\nYOUNG WOMAN: I agree, although the situation may change. It’s very hard to predict what will happen.", "explain": "NAM: Buổi hội thảo về tự động hóa và nghề nghiệp trong tương lai ngày hôm qua thực sự rất tuyệt phải không? Nhìn vào cuộc cách mạng công nghiệp lần thứ nhất ở Anh vào thế kỷ 19 và xem cách mọi người phản ứng với sự thay đổi lớn khiến tôi thực sự được mở rộng tầm mắt.\nNỮ: Vâng. Thật thú vị khi được tìm hiểu về việc mọi người cảm thấy thế nào đối với tự động hóa và những thách thức mà họ phải đối mặt. Tôi không biết công nhân trong ngành dệt may là những người đầu tiên đối diện với những điều đó. \nNAM: Những công nhân biểu tình còn được gọi là Luddites, đã phá hủy máy dệt kim vì họ lo rằng họ sẽ mất việc.\n\nNỮ: Vâng, và cuối cùng, họ không đạt được gì cả. 21/22 Và dù sao đi nữa, công nghiệp hóa tạo ra nhiều việc làm hơn là khiến cho nhiều người mất việc. \nNAM: Vâng, đúng vậy - nhưng có lẽ nó không phải là một điều tích cực vào thời điểm đó. Tôi có thể hiểu tại sao Luddites cảm thấy bị đ ã thay đổi rất nhiều nhờ công nghệ. Thậm chí 20 năm trước đã có những thư ký viết chính tả và đánh máy.\nNAM: Vâng. Thực sự nhàm chán so với thời điểm hiện tại, khi họ phải chịu trách nhiệm nhiều hơn cũng như ở vị trí cao hơn. 27\nNỮ: Ừm. Hiện nay có rất nhiều sinh viên tốt nghiệp làm  công việc này... Tôi đoán là   sẽ có một sự thay đổi lớn hơn nhiều về số lượng công nhân nông nghiệp trong thế kỷ 19. Nhưng cuộc điều tra dân số năm 1871 cho thấy khoảng 25% dân số làm việc trên đất liền.\nNAM:  Vâng, tôi đã nghĩ là hơn 50%. Bây giờ nó ít hơn 0,2%. 28\n\nNỮ: Còn nhân viên chăm sóc thì sao?\nNAM: Loại công việc này dường như không tồn tại vào thế kỷ 19 vì tuổi thọ của con người ngắn hơn rất nhiều. Nhưng bây giờ tất nhiên lĩnh vực này sẽ tăng trưởng rất mạnh. 29\n\nNỮ: Vâng - và nó đủ khó để đáp ứng nhu cầu hiện tại. Tương lai có vẻ ảm đạm đối với nhân viên ngân hàng. Số lượng nhân viên ngân hàng đã suy giảm kể từ khi máy ATM được đưa vào sử dụng vào những năm tám mươi.\nNAM: Và công nghệ chắc chắn sẽ khiến hầu hết những công việc họ làm hiện nay trở nên dư thừa, 30 tôi nghĩ vậy.\n\nNỮ: Tôi đồng ý, mặc dù tình hình có thể thay đổi. Rất khó để dự đoán điều gì sẽ xảy ra."}, "26": {"answer_label": "26. E", "quote": "YOUNG WOMAN: Yeah because people’s earning power has gone up so they can afford to spend more on personal services like that. 26", "explain": "Từ khóa: Hairdressers \nTừ câu số 25 đến 30 đề bài yêu cầu thí sinh match “comments” và jobs. Đối với các câu hỏi này, thí sinh cần tập trung vào “jobs” để locate được vị trí chứa thông tin trong bài. \nDựa vào từ khóa và bài nghe, ta xác định được đoạn thông tin sau “Yeah because people’s earning power has gone up so they can afford to spend more on personal services like that” – suy ra, đáp án chính xác là E. \nTrong đó: \nPeople’s earning power = Disposable income \nHas gone up = higher \nSpend more = a huge increase in …"}, "20": {"answer_label": "YOUNG MAN: That seminar yesterday on automation and the future of work was really good, wasn’t it? Looking at the first industrial revolution in Britain in the 19th century and seeing how people reacted to massive change was a real eye-opener.\nYOUNG WOMAN: Yes. It was interesting to hear how people felt about automation then and what challenges they faced. I didn’t know that first started with workers in the textile industry.\n\n\nYOUNG MAN: With those protesting workers called the Luddites destroying their knitting machines because they were so worried about losing their jobs. \nYOUNG WOMAN: Yes, and ultimately, they didn't achieve anything. 21/22 And anyway, industrialisation created more jobs than it destroyed.\nYOUNG MAN: Yes, that’s true - but it probably didn’t seem a positive thing at the time. I can see why the Luddites felt so threatened21/22\n\nYOUNG WOMAN: I know. I’m sure I would have felt the same. The discussion about the future of work was really optimistic for a change. I like the idea that work won’t involve doing boring, repetitive tasks, as robots will do all that. Normally, you only hear negative stuff about the future.\nYOUNG MAN: Bit too optimistic, don’t you think? For example, I can't see how people are about to have more leisure time, when all the evidence shows people are spending longer than ever at work23/24\n\nYOUNG WOMAN: No - that's true. And what about lower unemployment? I’m not so sure about that.  23/24\nYOUNG MAN:  Perhaps in the long term - but not in the foreseeable future.\nYOUNG WOMAN: Mmm. And I expect most people will be expected to work until they’re much older - as everyone’s living much longer.\nYOUNG MAN: That’s already happening.\nYOUNG WOMAN: I enjoyed all that stuff on how technology has changed some jobs and how they’re likely to change in the near future.\nYOUNG MAN: Yeah, incredible. Like accountants. You might think all the technological innovations would have put them out of a job, but in fact there are more of them than ever. They’re still really in demand and have become far more efficient. 25 \nYOUNG WOMAN: Right. That was amazing. Twenty times more accountants in this country compared to the 19th century.\nYOUNG MAN: I know. I’d never have thought that demand for hairdressing would have gone up so much in the last hundred years. One hairdresser for every 287 people now, compared to one for over 1,500.\nYOUNG WOMAN: Yeah because people’s earning power has gone up so they can afford to spend more on personal services like that. 26\nYOUNG MAN: But technology hasn’t changed the actual job that much.\nYOUNG WOMAN: No, they’ve got hairdryers, etc. but it’s one job where you don’t depend on a computer... The kind of work that administrative staff do has changed enormously, thanks to technology. Even 20 years ago there were secretaries doing dictation and typing.\nYOUNG MAN: Yes. Really boring compared to these days, when they're given much more responsibility and higher status. 27\nYOUNG WOMAN: Mmm. A lot of graduates go in for this kind of work now ... I’d expected there to be a much bigger change in the number of agricultural workers in the 19th century. But the 1871 census showed that roughly 25% of the population worked on the land.\nYOUNG MAN: Yeah, I’d have assumed it would be more than 50%. Now it's less than 0.2%. 28\nYOUNG WOMAN: What about care workers?\nYOUNG MAN: They barely existed in the 19th century as people’s lifespan was so much shorter. But now of course this sector will see huge growth. 29\n\nYOUNG WOMAN: Yeah - and it’s hard enough to meet current demand. The future looks quite bleak for bank clerks. They’ve been in decline since ATMs were introduced in the eighties.\n\nYOUNG MAN: And technology will certainly make most of the jobs they do now redundant, 30 I think.\n\nYOUNG WOMAN: I agree, although the situation may change. It’s very hard to predict what will happen.", "quote": "YOUNG MAN: That seminar yesterday on automation and the future of work was really good, wasn’t it? Looking at the first industrial revolution in B
