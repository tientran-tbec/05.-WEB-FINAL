to technology. Even 20 years ago there were secretaries doing dictation and typing.\nYOUNG MAN: Yes. Really boring compared to these days, when they're given much more responsibility and higher status. 27", "explain": "Từ khóa: Administrative staff \nTừ câu số 25 đến 30 đề bài yêu cầu thí sinh match “comments” và jobs. Đối với các câu hỏi này, thí sinh cần tập trung vào “jobs” để locate được vị trí chứa thông tin trong bài. \nDựa vào từ khóa và nội dung bài nghe, xác định được \nĐoạn thông tin sau “Really boring compared to these days, when they're given much more responsibility and higher status” – Tạm dịch “Thực sự nhàm chán so với thời điểm hiện tại, khi họ phải chịu trách nhiệm nhiều hơn cũng như ở vị trí cao hơn” (Phần trước đang đề cập tới administrative staff) \nCác cấu trúc được viết lại: \n“really boring compared to ….” = “become more interesting” \n“these days” = “recent years”"}, "1871": {"answer_label": "YOUNG MAN: That seminar yesterday on automation and the future of work was really good, wasn’t it? Looking at the first industrial revolution in Britain in the 19th century and seeing how people reacted to massive change was a real eye-opener.\nYOUNG WOMAN: Yes. It was interesting to hear how people felt about automation then and what challenges they faced. I didn’t know that first started with workers in the textile industry.\n\n\nYOUNG MAN: With those protesting workers called the Luddites destroying their knitting machines because they were so worried about losing their jobs. \nYOUNG WOMAN: Yes, and ultimately, they didn't achieve anything. 21/22 And anyway, industrialisation created more jobs than it destroyed.\nYOUNG MAN: Yes, that’s true - but it probably didn’t seem a positive thing at the time. I can see why the Luddites felt so threatened21/22\n\nYOUNG WOMAN: I know. I’m sure I would have felt the same. The discussion about the future of work was really optimistic for a change. I like the idea that work won’t involve doing boring, repetitive tasks, as robots will do all that. Normally, you only hear negative stuff about the future.\nYOUNG MAN: Bit too optimistic, don’t you think? For example, I can't see how people are about to have more leisure time, when all the evidence shows people are spending longer than ever at work23/24\n\nYOUNG WOMAN: No - that's true. And what about lower unemployment? I’m not so sure about that.  23/24\nYOUNG MAN:  Perhaps in the long term - but not in the foreseeable future.\nYOUNG WOMAN: Mmm. And I expect most people will be expected to work until they’re much older - as everyone’s living much longer.\nYOUNG MAN: That’s already happening.\nYOUNG WOMAN: I enjoyed all that stuff on how technology has changed some jobs and how they’re likely to change in the near future.\nYOUNG MAN: Yeah, incredible. Like accountants. You might think all the technological innovations would have put them out of a job, but in fact there are more of them than ever. They’re still really in demand and have become far more efficient. 25 \nYOUNG WOMAN: Right. That was amazing. Twenty times more accountants in this country compared to the 19th century.\nYOUNG MAN: I know. I’d never have thought that demand for hairdressing would have gone up so much in the last hundred years. One hairdresser for every 287 people now, compared to one for over 1,500.\nYOUNG WOMAN: Yeah because people’s earning power has gone up so they can afford to spend more on personal services like that. 26\nYOUNG MAN: But technology hasn’t changed the actual job that much.\nYOUNG WOMAN: No, they’ve got hairdryers, etc. but it’s one job where you don’t depend on a computer... The kind of work that administrative staff do has changed enormously, thanks to technology. Even 20 years ago there were secretaries doing dictation and typing.\nYOUNG MAN: Yes. Really boring compared to these days, when they're given much more responsibility and higher status. 27\nYOUNG WOMAN: Mmm. A lot of graduates go in for this kind of work now ... I’d expected there to be a much bigger change in the number of agricultural workers in the 19th century. But the 1871 census showed that roughly 25% of the population worked on the land.\nYOUNG MAN: Yeah, I’d have assumed it would be more than 50%. Now it's less than 0.2%. 28\nYOUNG WOMAN: What about care workers?\nYOUNG MAN: They barely existed in the 19th century as people’s lifespan was so much shorter. But now of course this sector will see huge growth. 29\n\nYOUNG WOMAN: Yeah - and it’s hard enough to meet current demand. The future looks quite bleak for bank clerks. They’ve been in decline since ATMs were introduced in the eighties.\n\nYOUNG MAN: And technology will certainly make most of the jobs they do now redundant, 30 I think.\n\nYOUNG WOMAN: I agree, although the situation may change. It’s very hard to predict what will happen.", "quote": "YOUNG MAN: That seminar yesterday on automation and the future of work was really good, wasn’t it? Looking at the first industrial revolution in Britain in the 19th century and seeing how people reacted to massive change was a real eye-opener.\nYOUNG WOMAN: Yes. It was interesting to hear how people felt about automation then and what challenges they faced. I didn’t know that first started with workers in the textile industry.\n\n\nYOUNG MAN: With those protesting workers called the Luddites destroying their knitting machines because they were so worried about losing their jobs. \nYOUNG WOMAN: Yes, and ultimately, they didn't achieve anything. 21/22 And anyway, industrialisation created more jobs than it destroyed.\nYOUNG MAN: Yes, that’s true - but it probably didn’t seem a positive thing at the time. I can see why the Luddites felt so threatened21/22\n\nYOUNG WOMAN: I know. I’m sure I would have felt the same. The discussion about the future of work was really optimistic for a change. I like the idea that work won’t involve doing boring, repetitive tasks, as robots will do all that. Normally, you only hear negative stuff about the future.\nYOUNG MAN: Bit too optimistic, don’t you think? For example, I can't see how people are about to have more leisure time, when all the evidence shows people are spending longer than ever at work23/24\n\nYOUNG WOMAN: No - that's true. And what about lower unemployment? I’m not so sure about that.  23/24\nYOUNG MAN:  Perhaps in the long term - but not in the foreseeable future.\nYOUNG WOMAN: Mmm. And I expect most people will be expected to work until they’re much older - as everyone’s living much longer.\nYOUNG MAN: That’s already happening.\nYOUNG WOMAN: I enjoyed all that stuff on how technology has changed some jobs and how they’re likely to change in the near future.\nYOUNG MAN: Yeah, incredible. Like accountants. You might think all the technological innovations would have put them out of a job, but in fact there are more of them than ever. They’re still really in demand and have become far more efficient. 25 \nYOUNG WOMAN: Right. That was amazing. Twenty times more accountants in this country compared to the 19th century.\nYOUNG MAN: I know. I’d never have thought that demand for hairdressing would have gone up so much in the last hundred years. One hairdresser for every 287 people now, compared to one for over 1,500.\nYOUNG WOMAN: Yeah because people’s earning power has gone up so they can afford to spend more on personal services like that. 26\nYOUNG MAN: But technology hasn’t changed the actual job that much.\nYOUNG WOMAN: No, they’ve got hairdryers, etc. but it’s one job where you don’t depend on a computer... The kind of work that administrative staff do has changed enormously, thanks to technology. Even 20 years ago there were secretaries doing dictation and typing.\nYOUNG MAN: Yes. Really boring compared to these days, when they're given much more responsibility and higher status. 27\nYOUNG WOMAN: Mmm. A lot of graduates go in for this kind of work now ... I’d expected there to be a much bigger change in the number of agricultural workers in the 19th century. But the 1871 census showed that roughly 25% of the population worked on the land.\nYOUNG MAN: Yeah, I’d have assumed it would be more than 50%. Now it's less than 0.2%. 28\nYOUNG WOMAN: What about care workers?\nYOUNG MAN: They barely existed in the 19th century as people’s lifespan was so much shorter. But now of course this sector will see huge growth. 29\n\nYOUNG WOMAN: Yeah - and it’s hard enough to meet current demand. The future looks quite bleak for bank clerks. They’ve been in decline since ATMs were introduced in the eighties.\n\nYOUNG MAN: And technology will certainly make most of the jobs they do now redundant, 30 I think.\n\nYOUNG WOMAN: I agree, although the situation may change. It’s very hard to predict what will happen.", "explain": "NAM: Buổi hội thảo về tự động hóa và nghề nghiệp trong tương lai ngày hôm qua thực sự rất tuyệt phải không? Nhìn vào cuộc cách mạng công nghiệp lần thứ nhất ở Anh vào thế kỷ 19 và xem cách mọi người phản ứng với sự thay đổi lớn khiến tôi thực sự được mở rộng tầm mắt.\nNỮ: Vâng. Thật thú vị khi được tìm hiểu về việc mọi người cảm thấy thế nào đối với tự động hóa và những thách thức mà họ phải đối mặt. Tôi không biết công nhân trong ngành dệt may là những người đầu tiên đối diện với những điều đó. \nNAM: Những công nhân biểu tình còn được gọi là Luddites, đã phá hủy máy dệt kim vì họ lo rằng họ sẽ mất việc.\n\nNỮ: Vâng, và cuối cùng, họ không đạt được gì cả. 21/22 Và dù sao đi nữa, công nghiệp hóa tạo ra nhiều việc làm hơn là khiến cho nhiều người mất việc. \nNAM: Vâng, đúng vậy - nhưng có lẽ nó không phải là một điều tích cực vào thời điểm đó. Tôi có thể hiểu tại sao Luddites cảm thấy bị đe dọa như vậy21/22\nNỮ: Tôi biết. Tôi chắc rằng tôi cũng sẽ cảm thấy như vậy. Buổi thảo luận về nghề nghiệp trong tương lai thực sự là một sự thay đổi tích cực. Tôi thích quan điểm cho rằng việc làm sẽ không còn nhàm chán hay lặp đi lăp lại hàng ngày như rô bốt nữa. Thường thường, bạn chỉ nghe những điều tiêu cực về t ly, you only hear negative stuff about the future.\nYOUNG MAN: Bit too optimistic, don’t you think? For example, I can't see how people are about to have more leisure time, when all the evidence shows people are spending longer than ever at work23/24\n\nYOUNG WOMAN: No - that's true. And what about lower unemployment? I’m not so sure about that.  23/24\nYOUNG MAN:  Perhaps in the long term - but not in the foreseeable future.\nYOUNG WOMAN: Mmm. And I expect most people will be expected to work until they’re much older - as everyone’s living much longer.\nYOUNG MAN: That’s already happening.\nYOUNG WOMAN: I enjoyed all that stuff on how technology has changed some jobs and how they’re likely to change in the near future.\nYOUNG MAN: Yeah, incredible. Like accountants. You might think all the technological innovations would have put them out of a job, but in fact there are more of them than ever. They’re still really in demand and have become far more efficient. 25 \nYOUNG WOMAN: Right. That was amazing. Twenty times more accountants in this country compared to the 19th century.\nYOUNG MAN: I know. I’d never have thought that demand for hairdressing would have gone up so much in the last hundred years. One hairdresser for every 287 people now, compared to one for over 1,500.\nYOUNG WOMAN: Yeah because people’s earning power has gone up so they can afford to spend more on personal services like that. 26\nYOUNG MAN: But technology hasn’t changed the actual job that much.\nYOUNG WOMAN: No, they’ve got hairdryers, etc. but it’s one job where you don’t depend on a computer... The kind of work that administrative staff do has changed enormously, thanks to technology. Even 20 years ago there were secretaries doing dictation and typing.\nYOUNG MAN: Yes. Really boring compared to these days, when they're given much more responsibility and higher status. 27\nYOUNG WOMAN: Mmm. A lot of graduates go in for this kind of work now ... I’d expected there to be a much bigger change in the number of agricultural workers in the 19th century. But the 1871 census showed that roughly 25% of the population worked on the land.\nYOUNG MAN: Yeah, I’d have assumed it would be more than 50%. Now it's less than 0.2%. 28\nYOUNG WOMAN: What about care workers?\nYOUNG MAN: They barely existed in the 19th century as people’s lifespan was so much shorter. But now of course this sector will see huge growth. 29\n\nYOUNG WOMAN: Yeah - and it’s hard enough to meet current demand. The future looks quite bleak for bank clerks. They’ve been in decline since ATMs were introduced in the eighties.\n\nYOUNG MAN: And technology will certainly make most of the jobs they do now redundant, 30 I think.\n\nYOUNG WOMAN: I agree, although the situation may change. It’s very hard to predict what will happen.", "quote": "YOUNG MAN: That seminar yesterday on automation and the future of work was really good, wasn’t it? Looking at the first industrial revolution in Britain in the 19th century and seeing how people reacted to massive change was a real eye-opener.\nYOUNG WOMAN: Yes. It was interesting to hear how people felt about automation then and what challenges they faced. I didn’t know that first started with workers in the textile industry.\n\n\nYOUNG MAN: With those protesting workers called the Luddites destroying their knitting machines because they were so worried about losing their jobs. \nYOUNG WOMAN: Yes, and ultimately, they didn't achieve anything. 21/22 And anyway, industrialisation created more jobs than it destroyed.\nYOUNG MAN: Yes, that’s true - but it probably didn’t seem a positive thing at the time. I can see why the Luddites felt so threatened21/22\n\nYOUNG WOMAN: I know. I’m sure I would have felt the same. The discussion about the future of work was really optimistic for a change. I like the idea that work won’t involve doing boring, repetitive tasks, as robots will do all that. Normally, you only hear negative stuff about the future.\nYOUNG MAN: Bit too optim  showed that roughly 25% of the population worked on the land.\nYOUNG MAN: Yeah, I’d have assumed it would be more than 50%. Now it's less than 0.2%. 28\nYOUNG WOMAN: What about care workers?\nYOUNG MAN: They barely existed in the 19th century as people’s lifespan was so much shorter. But now of course this sector will see huge growth. 29\n\nYOUNG WOMAN: Yeah - and it’s hard enough to meet current demand. The future looks quite bleak for bank clerks. They’ve been in decline since ATMs were introduced in the eighties.\n\nYOUNG MAN: And technology will certainly make most of the jobs they do now redundant, 30 I think.\n\nYOUNG WOMAN: I agree, although the situation may change. It’s very hard to predict what will happen.", "explain": "NAM: Buổi hội thảo về tự động hóa và nghề nghiệp trong tương lai ngày hôm qua thực sự rất tuyệt phải không? Nhìn vào cuộc cách mạng công nghiệp lần thứ nhất ở Anh vào thế kỷ 19 và xem cách mọi người phản ứng với sự thay đổi lớn khiến tôi thực sự được mở rộng tầm mắt.\nNỮ: Vâng. Thật thú vị khi được tìm hiểu về việc mọi người cảm thấy thế nào đối với tự động hóa và những thách thức mà họ phải đối mặt. Tôi không biết công nhân trong ngành dệt may là những người đầu tiên đối diện với những điều đó. \nNAM: Những công nhân biểu tình còn được gọi là Luddites, đã phá hủy máy dệt kim vì họ lo rằng họ sẽ mất việc.\n\nNỮ: Vâng, và cuối cùng, họ không đạt được gì cả. 21/22 Và dù sao đi nữa, công nghiệp hóa tạo ra nhiều việc làm hơn là khiến cho nhiều người mất việc. \nNAM: Vâng, đúng vậy - nhưng có lẽ nó không phải là một điều tích cực vào thời điểm đó. Tôi có thể hiểu tại sao Luddites cảm thấy bị đe dọa như vậy21/22\nNỮ: Tôi biết. Tôi chắc rằng tôi cũng sẽ cảm thấy như vậy. Buổi thảo luận về nghề nghiệp trong tương lai thực sự là một sự thay đổi tích cực. Tôi thích quan điểm cho rằng việc làm sẽ không còn nhàm chán hay lặp đi lăp lại hàng ngày như rô bốt nữa. Thường thường, bạn chỉ nghe những điều tiêu cực về tương lai.\nNAM: Tôi lại nghĩ suy nghĩ ion worked on the land.\nYOUNG MAN: Yeah, I’d have assumed it would be more than 50%. Now it's less than 0.2%. 28\nYOUNG WOMAN: What about care workers?\nYOUNG MAN: They barely existed in the 19th century as people’s lifespan was so much shorter. But now of course this sector will see huge growth. 29\n\nYOUNG WOMAN: Yeah - and it’s hard enough to meet current demand. The future looks quite bleak for bank clerks. They’ve been in decline since ATMs were introduced in the eighties.\n\nYOUNG MAN: And technology will certainly make most of the jobs they do now redundant, 30 I think.\n\nYOUNG WOMAN: I agree, although the situation may change. It’s very hard to predict what will happen.", "explain": "NAM: Buổi hội thảo về tự động hóa và nghề nghiệp trong tương lai ngày hôm qua thực sự rất tuyệt phải không? Nhìn vào cuộc cách mạng công nghiệp lần thứ nhất ở Anh vào thế kỷ 19 và xem cách mọi người phản ứng với sự thay đổi lớn khiến tôi thực sự được mở rộng tầm mắt.\nNỮ: Vâng. Thật thú vị khi được tìm hiểu về việc mọi người cảm thấy thế nào đối với tự động hóa và những thách thức mà họ phải đối mặt. Tôi không biết công nhân trong ngành dệt may là những người đầu tiên đối diện với những điều đó. \nNAM: Những công nhân biểu tình còn được gọi là Luddites, đã phá hủy máy dệt kim vì họ lo rằng họ sẽ mất việc.\n\nNỮ: Vâng, và cuối cùng, họ không đạt được gì cả. 21/22 Và dù sao đi nữa, công nghiệp hóa tạo ra nhiều việc làm hơn là khiến cho nhiều người mất việc. \nNAM: Vâng, đúng vậy - nhưng có lẽ nó không phải là một điều tích cực vào thời điểm đó. Tôi có thể hiểu tại sao Luddites cảm thấy bị đe dọa như vậy21/22\nNỮ: Tôi biết. Tôi chắc rằng tôi cũng sẽ cảm thấy như vậy. Buổi thảo luận về nghề nghiệp trong tương lai thực sự là một sự thay đổi tích cực. Tôi thích quan điểm cho rằng việc làm sẽ không còn nhàm chán hay lặp đi lăp lại hàng ngày như rô bốt nữa. Thường thường, bạn chỉ nghe những điều tiêu cực về tương lai.\nNAM: Tôi lại nghĩ suy nghĩ này lạc quan quá mức, bạn có nghĩ vậy không? Ví dụ, tôi không hiểu tại sao mọi người lại có nhiều thời gian giải trí hơn, khi tất cả các bằng chứng cho thấy mọi người đang dành nhiều thời gian hơn cho công việc 23/24\nNỮ: Bạn nói đúng. Còn về tỷ lệ thất nghiệp sẽ giảm? Tôi không chắc lắm về điều đó. 23/24\n\nNAM: Có lẽ phải rất lâu sau này mới được như thế - nhưng không phải trong tương lai gần.\nNỮ: Ừm. Và tôi cho rằng đa số mọi người sẽ phải làm việc rất lâu – bởi tuổi thọ của mọi người đang ngày càng tăng. \nNAM: Điều đó thật ra đã xảy ra rồi.\nNỮ: Tôi rất thích tất cả những nội dung về cách công nghệ đã thay đổi một số công việc và cách chúng có thể thay đổi trong tương lai gần.\nNAM: Đúng vậy, thật không thể tin được. Giống như kế toán. Có thể bạn sẽ nghĩ rằng tất cả những đổi mới công nghệ sẽ khiến họ mất việc làm, nhưng thực tế là có nhiều hơn bao giờ hết. Nhu cầu cho vị trí kế toán vẫn còn nhiều và họ đang trở nên hiệu quả hơn rất nhiều. 25\nNỮ: Đúng. Điều đó thật tuyệt vời. Số lượng nhân viên kế toán ở nước ta cao gấp 20 lần so với thế kỷ 19.\nNAM: Tôi hiểu. Tôi không thể ngờ rằng nhu cầu làm tóc lại tăng cao như vậy trong vòng một trăm năm qua. Ở thời điểm hiện tại, cứ 287 người thì có một thợ làm tóc, so quá khứ là cứ 1.500 người thì sẽ có 1 người là thợ làm tóc. \nNỮ: Vâng, bởi vì khả năng kiếm tiền của mọi người đã tăng lên nên họ có khả năng chi trả nhiều hơn cho các dịch vụ cá nhân như thế. 26\nNAM: Nhưng công nghệ không thay đổi công việc thực tế nhiều lắm.\nNỮ: Không, họ có máy sấy tóc, v.v. nhưng đó là một công việc mà bạn không phụ thuộc vào máy tính... Loại công việc mà nhân viên hành chính làm đã thay đổi rất nhiều nhờ công nghệ. Thậm chí 20 năm trước đã có những thư ký viết chính tả và đánh máy.\nNAM: Vâng. Thực sự nhàm chán so với thời điểm hiện tại, khi họ phải chịu trách nhiệm nhiều hơn cũng như ở vị trí cao hơn. 27\nNỮ: Ừm. Hiện nay có rất nhiều sinh viên tốt nghiệp làm  công việc này... Tôi đoán là   sẽ có một sự thay đổi lớn hơn nhiều về số lượng công nhân nông nghiệp trong thế kỷ 19. Nhưng cuộc điều tra dân số năm 1871 cho thấy khoảng 25% dân số làm việc trên đất liền.\nNAM:  Vâng, tôi đã nghĩ là hơn 50%. Bây giờ nó ít hơn 0,2%. 28\n\nNỮ: Còn nhân viên chăm sóc thì sao?\nNAM: Loại công việc này dường như không tồn tại vào thế kỷ 19 vì tuổi thọ của con người ngắn hơn rất nhiều. Nhưng bây giờ tất nhiên lĩnh vực này sẽ tăng trưởng rất mạnh. 29\n\nNỮ: Vâng - và nó đủ khó để đáp ứng nhu cầu hiện tại. Tương lai có vẻ ảm đạm đối với nhân viên ngân hàng. Số lượng nhân viên ngân hàng đã suy giảm kể từ khi máy ATM được đưa vào sử dụng vào những năm tám mươi.\nNAM: Và công nghệ chắc chắn sẽ khiến hầu hết những công việc họ làm hiện nay trở nên dư thừa, 30 tôi nghĩ vậy.\n\nNỮ: Tôi đồng ý, mặc dù tình hình có thể thay đổi. Rất khó để dự đoán điều gì sẽ xảy ra."}, "2": {"answer_label": "YOUNG MAN: That seminar yesterday on automation and the future of work was really good, wasn’t it? Looking at the first industrial revolution in Britain in the 19th century and seeing how people reacted to massive change was a real eye-opener.\nYOUNG WOMAN: Yes. It was interesting to hear how people felt about automation then and what challenges they faced. I didn’t know that first started with workers in the textile industry.\n\n\nYOUNG MAN: With those protesting workers called the Luddites destroying their knitting machines because they were so worried about losing their jobs. \nYOUNG WOMAN: Yes, and ultimately, they didn't achieve anything. 21/22 And anyway, industrialisation created more jobs than it destroyed.\nYOUNG MAN: Yes, that’s true - but it probably didn’t seem a positive thing at the time. I can see why the Luddites felt so threatened21/22\n\nYOUNG WOMAN: I know. I’m sure I would have felt the same. The discussion about the future of work was really optimistic for a change. I like the idea that work won’t involve doing boring, repetitive tasks, as robots will do all that. Normally, you only hear negative stuff about the future.\nYOUNG MAN: Bit too optimis h, I’d have assumed it would be more than 50%. Now it's less than 0.2%. 28\nYOUNG WOMAN: What about care workers?\nYOUNG MAN: They barely existed in the 19th century as people’s lifespan was so much shorter. But now of course this sector will see huge growth. 29\n\nYOUNG WOMAN: Yeah - and it’s hard enough to meet current demand. The future looks quite bleak for bank clerks. They’ve been in decline since ATMs were introduced in the eighties.\n\nYOUNG MAN: And technology will certainly make most of the jobs they do now redundant, 30 I think.\n\nYOUNG WOMAN: I agree, although the situation may change. It’s very hard to predict what will happen.", "explain": "NAM: Buổi hội thảo về tự động hóa và nghề nghiệp trong tương lai ngày hôm qua thực sự rất tuyệt phải không? Nhìn vào cuộc cách mạng công nghiệp lần thứ nhất ở Anh vào thế kỷ 19 và xem cách mọi người phản ứng với sự thay đổi lớn khiến tôi thực sự được mở rộng tầm mắt.\nNỮ: Vâng. Thật thú vị khi được tìm hiểu về việc mọi người cảm thấy thế nào đối với tự động hóa và những thách thức mà họ phải đối mặt. Tôi không biết công nhân trong ngành dệt may là những người đầu tiên đối diện với những điều đó. \nNAM: Những công nhân biểu tình còn được gọi là Luddites, đã phá hủy máy dệt kim vì họ lo rằng họ sẽ mất việc.\n\nNỮ: Vâng, và cuối cùng, họ không đạt được gì cả. 21/22 Và dù sao đi nữa, công nghiệp hóa tạo ra nhiều việc làm hơn là khiến cho nhiều người mất việc. \nNAM: Vâng, đúng vậy - nhưng có lẽ nó không phải là một điều tích cực vào thời điểm đó. Tôi có thể hiểu tại sao Luddites cảm thấy bị đe dọa như vậy21/22\nNỮ: Tôi biết. Tôi chắc rằng tôi cũng sẽ cảm thấy như vậy. Buổi thảo luận về nghề nghiệp trong tương lai thực sự là một sự thay đổi tích cực. Tôi thích quan điểm cho rằng việc làm sẽ không còn nhàm chán hay lặp đi lăp lại hàng ngày như rô bốt nữa. Thường thường, bạn chỉ nghe những điều tiêu cực về tương lai.\nNAM: Tôi lại nghĩ suy nghĩ này lạc quan quá mức, bạn có nghĩ vậy không? Ví dụ, tôi không hiểu tại sao mọi người lại có nhiều thời gian giải trí hơn, khi tất cả các bằng chứng cho thấy mọi người đang dành nhiều thời gian hơn cho công việc 23/24\nNỮ: Bạn nói đúng. Còn về tỷ lệ thất nghiệp sẽ giảm? Tôi không chắc lắm về điều đó. 23/24\n\nNAM: Có lẽ phải rất lâu sau này mới được như thế - nhưng không phải trong tương lai gần.\nNỮ: Ừm. Và tôi cho rằng đa số mọi người sẽ phải làm việc rất lâu – bởi tuổi thọ của mọi người đang ngày càng tăng. \nNAM: Điều đó thật ra đã xảy ra rồi.\nNỮ: Tôi rất thích tất cả những nội dung về cách công nghệ đã thay đổi một số công việc và cách chúng có thể thay đổi trong tương lai gần.\nNAM: Đúng vậy, thật không thể tin được. Giống như kế toán. Có thể bạn sẽ nghĩ rằng tất cả những đổi mới công nghệ sẽ khiến họ mất việc làm, nhưng thực tế là có nhiều hơn bao giờ hết. Nhu cầu cho vị trí kế toán vẫn còn nhiều và họ đang trở nên hiệu quả hơn rất nhiều. 25\nNỮ: Đúng. Điều đó thật tuyệt vời. Số lượng nhân viên kế toán ở nước ta cao gấp 20 lần so với thế kỷ 19.\nNAM: Tôi hiểu. Tôi không thể ngờ rằng nhu cầu làm tóc lại tăng cao như vậy trong vòng một trăm năm qua. Ở thời điểm hiện tại, cứ 287 người thì có một thợ làm tóc, so quá khứ là cứ 1.500 người thì sẽ có 1 người là thợ làm tóc. \nNỮ: Vâng, bởi vì khả năng kiếm tiền của mọi người đã tăng lên nên họ có khả năng chi trả nhiều hơn cho các dịch vụ cá nhân như thế. 26\nNAM: Nhưng công nghệ không thay đổi công việc thực tế nhiều lắm.\nNỮ: Không, họ có máy sấy tóc, v.v. nhưng đó là một công việc mà bạn không phụ thuộc vào máy tính... Loại công việc mà nhân viên hành chính làm đã thay đổi rất nhiều nhờ công nghệ. Thậm chí 20 năm trước đã có những thư ký viết chính tả và đánh máy.\nNAM: Vâng. Thực sự nhàm chán so với thời điểm hiện tại, khi họ phải chịu trách nhiệm nhiều hơn cũng như ở vị trí cao hơn. 27\nNỮ: Ừm. Hiện nay có rất nhiều sinh viên tốt nghiệp làm  công việc này... Tôi đoán là   sẽ có một sự thay đổi lớn hơn nhiều về số lượng công nhân nông nghiệp trong thế kỷ 19. Nhưng cuộc điều tra dân số năm 1871 cho thấy khoảng 25% dân số làm việc trên đất liền.\nNAM:  Vâng, tôi đã nghĩ là hơn 50%. Bây giờ nó ít hơn 0,2%. 28\n\nNỮ: Còn nhân viên chăm sóc thì sao?\nNAM: Loại công việc này dường như không tồn tại vào thế kỷ 19 vì tuổi thọ của con người ngắn hơn rất nhiều. Nhưng bây giờ tất nhiên lĩnh vực này sẽ tăng trưởng rất mạnh. 29\n\nNỮ: Vâng - và nó đủ khó để đáp ứng nhu cầu hiện tại. Tương lai có vẻ ảm đạm đối với nhân viên ngân hàng. Số lượng nhân viên ngân hàng đã suy giảm kể từ khi máy ATM được đưa vào sử dụng vào những năm tám mươi.\nNAM: Và công nghệ chắc chắn sẽ khiến hầu hết những công việc họ làm hiện nay trở nên dư thừa, 30 tôi nghĩ vậy.\n\nNỮ: Tôi đồng ý, mặc dù tình hình có thể thay đổi. Rất khó để dự đoán điều gì sẽ xảy ra."}, "28": {"answer_label": "28. C", "quote": "YOUNG WOMAN: Mmm. A lot of graduates go in for this kind of work now ... I’d expected there to be a much bigger change in the number of agricultural workers in the 19th century. But the 1871 census showed that roughly 25% of the population worked on the land.\nYOUNG MAN: Yeah, I’d have assumed it would be more than 50%. Now it's less than 0.2%. 28", "explain": "Từ khóa: Agricultural workers \nTừ câu số 25 đến 30 đề bài yêu cầu thí sinh match “comments” và jobs. Đối với các câu hỏi này, thí sinh cần tập trung vào “jobs” để locate được vị trí chứa thông tin trong bài. \nDựa vào từ khóa và bài nghe ta xác định được đoạn thông tin sau: “I’d expected there to be a much bigger change in the number of agricultural workers in the 19th century. But the 1871 census showed that roughly 25% of the population worked on the land.\nYOUNG MAN: Yeah, I’d have assumed it would be more than 50%. Now it's less than 0.2%” – Tạm dịch “NỮ: Tôi đoán là sẽ có một sự thay đổi lớn hơn nhiều về số lượng công nhân nông nghiệp trong thế kỷ 19. Nhưng cuộc điều tra dân số năm 1871 cho thấy khoảng 25% dân số làm việc trên đất liền. NAM:  Vâng, tôi đã nghĩ là hơn 50%. Bây giờ nó ít hơn 0,2%. => Đáp án đúng là C."}, "29": {"answer_label": "29. F", "quote": "YOUNG WOMAN: What about care workers?\nYOUNG MAN: They barely existed in the 19th century as people’s lifespan was so much shorter. But now of course this sector will see huge growth. 29", "explain": "Từ khóa: Care workers \nTừ câu số 25 đến 30 đề bài yêu cầu thí sinh match “comments” và jobs. Đối với các câu hỏi này, thí sinh cần tập trung vào “jobs” để locate được vị trí chứa thông tin trong bài. \nDựa vào từ khóa và bài nghe ta xác định được đoạn thông tin sau “YOUNG WOMAN: What about care workers? YOUNG MAN: They barely existed in the 19th century as people’s lifespan was so much shorter. But now of course this sector will see huge growth” – “NỮ: Còn nhân viên chăm sóc thì sao?\nNAM: Loại công việc này dường như không tồn tại vào thế kỷ 19 vì tuổi thọ của con người ngắn hơn rất nhiều. Nhưng bây giờ tất nhiên lĩnh vực này sẽ tăng trưởng rất mạnh” \nĐáp án chính xác là F \nTrong đó, “significant rise in demand” = “huge growth”"}, "30": {"answer_label": "30. A", "quote": "YOUNG WOMAN: Yeah - and it’s hard enough to meet current demand. The future looks guite bleak for bank clerks. They’ve been in decline since ATMs were introduced in the eighties.\nYOUNG MAN: And technology will certainly make most of the jobs they do now redundant, 30 I think.", "explain": "Từ khóa: Bank clerks \nTừ câu số 25 đến 30 đề bài yêu cầu thí sinh match “comments” và jobs. Đối với các câu hỏi này, thí sinh cần tập trung vào “jobs” để locate được vị trí chứa thông tin trong bài.\nDựa vào từ khóa và nội dung bài nghe, ta xác định được đoạn thông tin sau “YOUNG WOMAN: The future looks guite bleak for bank clerks. They’ve been in decline since ATMs were introduced in the eighties.\nYOUNG MAN: And technology will certainly make most of the jobs they do now redundant, 30 I think” – Tạm dịch “NỮ: Tương lai có vẻ ảm đạm đối với nhân viên ngân hàng. Số lượng nhân viên ngân hàng đã suy giảm kể từ khi máy ATM được đưa vào sử dụng vào những năm tám mươi. NAM: Và công nghệ chắc chắn sẽ khiến hầu hết những công việc họ làm hiện nay trở nên dư thừa, tôi nghĩ vậy” \nTrong đó, “at risk” = “redundant”"}}, "script_full": [{"speaker": "YOUNG MAN", "text": "That seminar yesterday on automation and the future of work was really good, wasn't it? Looking at the first industrial revolution in Britain in the 19th century and seeing how people reacted to massive change was a real eye-opener.", "qids": []}, {"speaker": "YOUNG WOMAN", "text": "Yes. It was interesting to hear how people felt about automation then and what challenges they faced. I didn't know that first started with workers in the textile industry.", "qids": []}, {"speaker": "YOUNG MAN", "text": "With those protesting workers called the Luddites destroying their knitting machines because they were so worried about losing their jobs.", "qids": []}, {"speaker": "YOUNG WOMAN", "text": "Yes, and ultimately, they didn't achieve anything. And anyway, industrialisation created more jobs than it destroyed.", "qids": ["21", "22"]}, {"speaker": "YOUNG MAN", "text": "Yes, that's true - but it probably didn't seem a positive thing at the time ... I can see why the Luddites felt so threatened.", "qids": ["21", "22"]}, {"speaker": "YOUNG WOMAN", "text": "I know. I'm sure I would have felt the same. The discussion about the future of work was really optimistic for a change. I like the idea that work won't involve doing boring, repetitive tasks, as robots will do all that. Normally, you only hear negative stuff about the future.", "qids": []}, {"speaker": "YOUNG MAN", "text": "Bit too optimistic, don't you think? For example, I can't see how people are about to have more leisure time, when all the evidence shows people are spending longer than ever at work.", "qids": ["23", "24"]}, {"speaker": "YOUNG WOMAN", "text": "No - that's true. And what about lower unemployment? I'm not so sure about that. Perhaps in the long term but not in the foreseeable future.", "qids": ["23", "24"]}, {"speaker": "YOUNG MAN", "text": "Mmm. And I expect most people will be expected to work until they're much older - as everyone's living much longer.", "qids": []}, {"speaker": "YOUNG WOMAN", "text": "That's already happening.", "qids": []}, {"speaker": "YOUNG MAN", "text": "I enjoyed all that stuff on how technology has changed some jobs and how they're likely to change in the near future.", "qids": []}, {"speaker": "YOUNG WOMAN", "text": "Yeah, incredible. Like accountants. You might think all the technological innovations would have put them out of a job, but in fact there are more of them than ever. They're still really in demand and have become far more efficient.", "qids": ["25"]}, {"speaker": "YOUNG MAN", "text": "Right. That was amazing. Twenty times more accountants in this country compared to the 19th century.", "qids": []}, {"speaker": "YOUNG WOMAN", "text": "I know. I'd never have thought that demand for hairdressing would have gone up so much in the last hundred years. One hairdresser for every 287 people now, compared to one for over 1,500.", "qids": ["26"]}, {"speaker": "YOUNG MAN", "text": "Yeah because people's earning power has gone up so they can afford to spend more on personal services like that.", "qids": []}, {"speaker": "YOUNG WOMAN", "text": "But technology hasn't changed the actual job that much.", "qids": []}, {"speaker": "YOUNG MAN", "text": "No, they've got hairdryers, etc. but it's one job where you don't depend on a computer... The kind of work that administrative staff do has changed enormously, thanks to technology. Even 20 years ago there were secretaries doing dictation and typing.", "qids": ["27"]}, {"speaker": "YOUNG WOMAN", "text": "Yes. Really boring compared to these days, when they're given much more responsibility and higher status.", "qids": []}, {"speaker": "YOUNG MAN", "text": "Mmm. A lot of graduates go in for this kind of work now ... I'd expected there to be a much bigger change in the number of agricultural workers in the 19th century. But the 1871 census showed that roughly 25% of the population worked on the land.", "qids": ["28"]}, {"speaker": "YOUNG WOMAN", "text": "Yeah, I'd have assumed it would be more than 50%. Now it's less than 0.2%.", "qids": []}, {"speaker": "YOUNG MAN", "text": "What about care workers?", "qids": []}, {"speaker": "YOUNG WOMAN", "text": "They barely existed in the 19th century as people's lifespan was so much shorter. But now of course this sector will see huge growth.", "qids": ["29"]}, {"speaker": "YOUNG MAN", "text": "Yeah and it's hard enough to meet current demand. The future looks quite bleak for bank clerks. They've been in decline since ATMs were introduced in the eighties.", "qids": ["30"]}, {"speaker": "YOUNG WOMAN", "text": "And technology will certainly make most of the jobs they do now redundant, I think.", "qids": []}, {"speaker": "YOUNG MAN", "text": "I agree, although the situation may change. It's very hard to predict what will happen.", "qids": []}], "groups": [{"type": "choice", "qids": ["21", "22"], "prompt": "Which TWO opinions about the Luddites do the students express?", "options": {"A": "Their actions were ineffective.", "B": "They are still influential today.", "C": "They have received unfair criticism.", "D": "They were proved right.", "E": "Their attitude is understandable."}, "multi": true, "header": "Questions 21 and 22 Choose TWO letters, A-E."}, {"type": "choice", "qids": ["23", "24"], "prompt": "Which TWO predictions about the future of work are the students doubtful about?", "options": {"A": "Work will be more rewarding.", "B": "Unemployment will fall.", "C": "People will want to delay retiring.", "D": "Working hours will be shorter.", "E": "People will change jobs more frequently."}, "multi": true, "header": "Questions 23 and 24 Choose TWO letters, A-E."}, {"type": "matching", "qids": ["25", "26", "27", "28", "29", "30"], "box_title": "Comments", "box": {"A": "These jobs are likely to be at risk.", "B": "Their role has become more interesting in recent years.", "C": "The number of people working in this sector has fallen dramatically.", "D": "This job will require more qualifications.", "E": "Higher disposable income has led to a huge increase in jobs.", "F": "There is likely to be a significant rise in demand for this service.", "G": "Both employment and productivity have risen."}, "stems": [{"qid": "25", "prompt": "Accountants"}, {"qid": "26", "prompt": "Hairdressers"}, {"qid": "27", "prompt": "Administrative staff"}, {"qid": "28", "prompt": "Agricultural workers"}, {"qid": "29", "prompt": "Care workers"}, {"qid": "30", "prompt": "Bank clerks"}], "header": "Choose SIX answers from the box and write the correct letter, A—G, next to Questions 25-30."}]}, {"part": 4, "kind": "notes", "title": "The Hunt for Sunken Settlements and Ancient Shipwrecks", "instructions": null, "audio": "audio/test3/part4.mp3", "answers": {"31": "spring", "32": "tools", "33": "maps", "34": "heavy", "35": "marble", "36": "light", "37": "camera(s)", "38": "medical", "39": "eyes", "40": "wine"}, "explanations": {"31": {"answer_label": "Câu 31", "quote": "Atlit-Yam was a village on the coast of the eastern Mediterranean, which seems to have been thriving until around 7,000 BC. The residents kept cattle, caught fish and stored grain. They had wells for fresh water, many of their houses were built around a courtyard and were constructed of stone. The village contained an impressive monument: seven half-tonne stones standing in a semicircle around a spring (Q31), that might have been used for ceremonial purposes.", "explain": "Câu hỏi:\nATLIT-YAM\n•\twas a village on coast of eastern Mediterranean\n•\tthrived until about 7,000 BC\n•\tstone homes had a courtyard\n•\thad a semicircle of large stones round\na 31\t\nKeywords được paraphrase:\n•\tCâu hỏi nằm trong phần ATLIT-YAM. Dịch câu hỏi “had a semicircle of large stones round a...” (một hình bán nguyệt những tảng đá lớn xung quanh một.). Vì vậy, ta cần một danh từ đếm được số ít ở đây.\nGiải thích đáp án:\n•\tCâu hỏi được paraphrase lại thành câu “seven half-tonne stones standing in a semicircle around a spring” (bảy viên đá nặng nửa tấn đứng trong hình bán nguyệt quanh một con suối). Vì vậy, đáp án là “spring”."}, "32": {"answer_label": "Câu 32", "quote": "For marine archaeologists, Atlit- Yam is a treasure trove. Research on the buildings, tools (Q32) and the human remains has revealed how the bustling village once functioned, and even what diseases some of its residents suffered from. But of course this is only one small village, one window into a lost world. For a fuller picture, researchers need more sunken settlements, but the hard part is finding them.", "explain": "Câu hỏi:\n     •\tcause of destruction unknown - now under the sea\n•\tbiggest settlement from the prehistoric period found on the seabed\n•\tresearch carried out into structures, 32 ………………..\n•\tand human remains\nKeywords được paraphrase:\nCâu hỏi vẫn nằm trong phần ATLIT- YAM. Dịch câu hỏi “research carried out into structures, ... and human remains” (nghiên cứu được thực hiện trên cấu trúc, ... và hài cốt của con ngườì). Vì vậy, ta cần một danh từ ở đây.\nGiải thích đáp án:\nCâu hỏi được paraphrase lại thành câu “Research on the buildings, tools and the human remains” (Nghiên cứu về các tòa nhà, công cụ và hài cốt của con người). Chữ “structures” được thay bằng chữ “buildings”. Vì vậy, đáp án ở đây là “tools”."}, "33": {"answer_label": "Câu 33", "quote": "Autonomous underwater vehicles, or AUVs, are used in the oil industry, for instance, to create maps (Q33) of the seabed before rigs and pipelines are installed. To navigate they use sensors, such as compasses and sonar. Until relatively recently they were very expensive, and so heavy (Q34) that they had to be launched from a large vessel with a winch.", "explain": "Câu hỏi:\n•\tused in the oil industry, e.g. to make 33 ………………………\t\t\t\n•\tproblems: they were expensive and 34 ………………………\t\t\nKeywords được paraphrase:\nCâu hỏi nằm trong phần “Traditional autonomous underwater vehicles AUVs” (phương tiện dưới nước không người lái truyền thống). Dịch câu hỏi “used in the oil industry, eg to make ...” (được dùng trong ngành sản xuất dầu, ví dụ để tạo ra ...) Vì vậy, đáp án ở đây là một danh từ.\nGiải thích đáp án:\nCâu hỏi được paraphrase lại thành câu “Autonomous underwater vehicles, or AUVs, are used in the oil industry, for instance, to create maps” (Chẳng hạn, phương tiện tự động dưới nước, hay AUV, được sử dụng trong ngành dầu mỏ, để tạo ra bản đồ). Chữ “create” được thay cho chữ “make”. Vì vậy, đáp án ở đây là “maps”."}, "34": {"answer_label": "Câu 34", "quote": "Autonomous underwater vehicles, or AUVs, are used in the oil industry, for instance, to create maps (Q33) of the seabed before rigs and pipelines are installed. To navigate they use sensors, such as compasses and sonar. Until relatively recently they were very expensive, and so heavy (Q34) that they had to be launched from a large vessel with a winch.", "explain": "Câu hỏi:\n•\tused in the oil industry, e.g. to make 33 ..\n•\tproblems: they were expensive and 34 ...\nKeywords được paraphrase:\nCâu hỏi nằm trong phần “Traditional autonomous underwater vehicles AUVs” (phương tiện dưới nước không người lái truyền thống). Dịch câu hỏi “problems: they were expensive and ...” (vấn đề: chúng đắt và ...) Vì vậy, đáp án ở đây là một tính từ.\nGiải thích đáp án:\nĐáp n nằm trong câu “they were very expensive, and so heavy” (chúng rất đắt, và vì vậy nặng). Do đó, đáp án ở đây là “heavy”."}, "35": {"answer_label": "Câu 35", "quote": "Field tests show the approach can work. For example, in a trial in 2015, three AUVs searched for wrecks at Marzamemi, off the coast of Sicily. The site is the final resting place of an ancient Roman ship, which sank in the sixth century AD while ferrying prefabricated marble (Q35) elements for the construction of an early church. The AUVs mapped the area in detail, finding other ships carrying columns of the same material.", "explain": "Câu hỏi:\nTests:\n•\tMarzamemi, Sicily: found ancient Roman ships carrying architectural elements made of 35 ……………………\nKeywords được paraphrase:\nCâu hỏi nằm trong phần “Tests”. Dịch câu hỏi “...” (Marzameni Sicily tìm thấy những con tàu của người La Mã cổ chứa ...) Do đó, ta cần điền một danh từ.\nGiải thích đáp án:\nĐáp án nằm ở câu “an ancient Roman ship, which sank in the sixth century AD while ferrying prefabricated marble elements” (một con tàu La Mã cổ đại, đã chìm vào thế kỷ thứ sáu sau Công nguyên trong khi vận chuyển các yếu tố bằng đá cẩm thạch đúc sẵn). Vì vậy, đáp án ở đây là “marble”."}, "36": {"answer_label": "Câu 36", "quote": "Creating an internet in the sea for AUVs to communicate is no easy matter. Wifi networks on land use electromagnetic waves, but in water these will only travel a few centimetres. Instead, a more complex mix of technologies is required. For short distances, AUVs can share data using light (Q36), while acoustic waves are used to communicate over long distances. But more creative solutions are also being developed, where an AUV working on the\tseabed offloads data to a second AUV, which then surfaces and beams the data home to the research team using a satellite.", "explain": "Câu hỏi:\nUnderwater internet:\n•\t36\tis\tused for short\ndistance communication, acoustic\nwaves for long distance\nKeywords được paraphrase:\nCâu hỏi nằm trong phần “Underwater Internet” (Mạng Internet dưới nước). Dịch câu hỏi “... is used for short distance communication, acoustic waves for long distance” (... dùng cho liên lạc khoảng cách ngắn, sóng vô hình cho đường dài). Vì vậy ta cần điền một danh từ.\nGiải thích đáp án:\nBài nghe chuyển sang ý tiếp theo bằng câu “Creating an internet in the sea for AUVs to communicate is no easy matter” (Tạo ra mạng Internet ở dưới biển cho AUVs liên lạc thì không dễ). Câu hỏi được paraphrase lại thành câu “For short distances, AUVs can share data using light, while acoustic waves are used to communicate over long distances” (Đối với khoảng cách ngắn, AUV có thể chia sẻ dữ liệu bằng ánh sáng, trong khi sóng âm được sử dụng để liên lạc qua khoảng cách xa). Vì vậy, đáp án ở đây là “light”."}, "37": {"answer_label": "Câu 37", "quote": "There's also a system that enables AUVs to share information from seabed scans, and other data. So if an AUV surveying the seabed finds an intriguing object, it can share the coordinates of the object -that is, its position -with a nearby AUV that carries superior cameras, and arrange for that AUV to make a closer inspection of the object", "explain": "Câu hỏi:\nplans for communication with researchers by satellite\nAUV can send data to another AUV that has better 37…………………………….. for example\nKeywords được paraphrase:\nCâu hỏi vẫn nằm trong phần “Underwater Internet” (Mạng Internet dưới nước). Dịch câu hỏi “AUV can send data to another AUV that has better ..” (AUV có thể gửi dữ liệu sang một AUV khác có ... tốt hơn). Do đó, ta cần điền một danh từ ở đây.\nGiải thích đáp án:\nCâu trả lời được đưa ra trong câu “with a nearby AUV that carries superior cameras” (với một cái AUV gần bên mang những ca-me-ra tốt hơn). Chữ “better” được thay bằng chữ “superior”. Vì vậy, đáp án ở đây là “cameras”."}, "38": {"answer_label": "Câu 38", "quote": "Marine archaeologists are excited about the huge potential of these AUVs for their discipline.\nOne site where they’re going to be deployed is the Gulf of Baratti, off the Italian coast. In 1974, a 2,000-year-old Roman vessel was discovered here, in 18 metres of water. When it sank, it was carrying medical (Q38) goods, in wooden or tin receptacles. Its cargo gives us insight into the treat", "explain": "Câu hỏi:\nPlanned research in Gulf of Baratti:\nto find out more about wrecks of ancient Roman ships,\none carrying 38\t supplies;\ntablets may have been used for cleaning the 39\t…………..\nothers carrying containers of olive oil or 40 ………………..\nKeywords được paraphrase:\nCâu hỏi nằm trong phần “Planned research in Gulf of Baratti” (Nghiên cứu theo kế hoạch ở Vịnh Baratti). Dịch câu hỏi “to find out more about wrecks of ancient Roman ships, including one carrying ... supplies” (để tìm hiểu thêm về xác tàu đắm La Mã cổ đại, bao gồm một chiếc mang theo vật dụng.). Do đó, ta cần một tính từ ở đây.\nGiải thích đáp án:\nBài nghe chuyển sang phần tiếp theo bằng câu “One site where they're going to be deployed is the Gulf of Baratti” (Một nơi họ sẽ triển khai là Vịnh Baratti). Câu trả lời nằm ở câu “When it sank, it was carrying medical goods” (Khi bị chìm, nó đang chở hàng y tế). Chữ “goods” được thay bằng chữ “supplies”. Vì vậy, ta cần điền đáp án là “medical”."}, "39": {"answer_label": "Câu 39", "quote": "Marine archaeologists are excited about the huge potential of these AUVs for their discipline.\nOne site where they’re going to be deployed is the Gulf of Baratti, off the Italian coast. In 1974, a 2,000-year-old Roman vessel was discovered here, in 18 metres of water. When it sank, it was carrying medical (Q38) goods, in wooden or tin receptacles. Its cargo gives us insight into the treatments available all those years ago, including tablets that are thought to have been dissolved to form a cleansing liquid for the eyes (Q39).", "explain": "Câu hỏi:\nPlanned research in Gulf of Baratti:\n•\tto find out more about wrecks of ancient Roman ships,\n-\tone carrying 38\t supplies;\ntablets may have been used for cleaning the 39 ……………..\t\n-\tothers carrying containers of olive oil or 40 ………………………….\t\nKeywords được paraphrase:\nCâu hỏi vẫn nằm trong phần “Planned research in Gulf of Baratti” (Nghiên cứu theo kế hoạch ở Vịnh Baratti). Dịch câu hỏi “tablets may have been used for cleaning the...” (thuốc được dùng để làm sạch...) Do đó, ta cần điền một danh từ.\nGiải thích đáp án:\nCâu trả lời nằm trong câu “tablets that are thought to have been dissolved to form a cleansing liquid for the eyes” (thuốc được cho là đã được hòa tan để tạo thành một chất lỏng làm sạch cho mắt). Vì vậy, ta điền đáp án là “eyes”."}, "40": {"answer_label": "Câu 40", "quote": "Other Roman ships went down nearby, taking their cargoes with them. Some held huge pots made of terracotta. Some were used for transporting cargoes of olive oil, and others held wine (Q40). In many cases it’s only these containers that remain, while the wooden ships have been buried under silt on the seabed.", "explain": "Câu hỏi:\nPlanned research in Gulf of Baratti:\nto find out more about wrecks of ancient Roman ships, one carrying 38 ………………..supplies; tablets\nmay have been used for cleaning the 39 ……………..\nothers carrying containers of olive oil or 40 …………..\nKeywords được paraphrase:\nCâu hỏi vẫn nằm trong phần “Planned research in Gulf of Baratti” (Nghiên cứu theo kế hoạch ở Vịnh Baratti). Dịch câu hỏi “others carrying containers of olive oil or ...” (những thuyền khác mang thùng dầu ô liu hoặc.). Vì vậy, ta cần điền một danh từ ở đây.\nGiải thích đáp án:\nCâu trả lời nằm trong câu “Some were used for transporting cargoes of olive oil, and others held wine” (Một số được sử dụng để vận chuyển hàng hóa dầu ô liu và những thuyền khác giữ rượu). Vì vậy, ta điền đáp án là “wine”."}}, "script_full": [{"speaker": null, "text": "In today's class I'm going to talk about marine archaeology, the branch of archaeology focusing on human interaction with the sea, lakes and rivers. It's the study of ships, cargoes, shipping facilities, and other physical remains. I'll give you an example, then go on to show how this type of research is being transformed by the use of the latest technology", "qids": []}, {"speaker": null, "text": "Atlit-Yam was a village on the coast of the eastern Mediterranean, which seems to have been thriving until around 7,000 BC. The residents kept cattle, caught fish and stored grain. They had wells for fresh water, many of their houses were built around a courtyard and were constructed of stone. The village contained an impressive monument seven half-tonne stones standing in a semicircle around a spring, that might have been used for ceremonial purposes.", "qids": ["31"]}, {"speaker": null, "text": "Atlit-Yam may have been destroyed swiftly by a tsunami, or climate change may have caused glaciers to melt and sea levels to rise, flooding the village gradually. Whatever the cause. it now lies ten metres below the surface of the Mediterranean, buried under sand at the bottom of the sea. It's been described as the largest and best preserved prehistoric settlement ever found on the seabed", "qids": []}, {"speaker": null, "text": "For marine archaeologists, Atlit-Yam is a treasure trove. Research on the buildings, tools and the human remains has revealed how the bustling village once functioned, and even what diseases some of its residents suffered from. But of course this is only one small village, one window into a lost world. For a fuller picture, researchers need more sunken settlements, but the hard part is finding them.", "qids": ["32"]}, {"speaker": null, "text": "Underwater research used to require divers to find shipwrecks or artefacts, but in the second half of the twentieth century, various types of underwater vehicles were developed, some controlled from a ship on the surface, and some of them autonomous, which means they don't need to be operated by a person.", "qids": []}, {"speaker": null, "text": "Autonomous underwater vehicles, or AUVs, are used in the oil industry, for instance, to create maps of the seabed before rigs and pipelines are installed. To navigate they use sensors. such as compasses and sonar. Until relatively recently they were very expensive, and so heavy that they had to be launched from a large vessel with a winch.  [Q33", "qids": ["33", "34"]}, {"speaker": null, "text": "Q34]", "qids": []}, {"speaker": null, "text": "But the latest AUVs are much easier to manoeuvre - they can be launched from the shore or a small ship. And they're much cheaper, which makes them more accessible to research teams. They're also very sophisticated. They can communicate with each other and, for example, work out the most efficient way to survey a site, or to find particular objects on the seabed.", "qids": []}, {"speaker": null, "text": "Field tests show the approach can work. For example, in a trial in 2015, three AUVs searched for wrecks at Marzamemi, off the coast of Sicily. The site is the final resting place of an ancient Roman ship, which sank in the sixth century AD while ferrying prefabricated marble elements for the construction of an early church. The AUVs mapped the area in detail, finding other ships carrying columns of the same material.", "qids": ["35"]}, {"speaker": null, "text": "Creating an internet in the sea for AUVs to communicate is no easy matter. Wifi networks on land use electromagnetic waves, but in water these will only travel a few centimetres. Instead, a more complex mix of technologies is required. For short distances, AUVs can share data using light. while acoustic waves are used to communicate over long distances. But more creative solutions are also being developed, where an AUV working on the seabed offloads data to a second AUV, which then surfaces and beams the data home to the research team using a satellite.", "qids": ["36"]}, {"speaker": null, "text": "There's also a system that enables AUVs to share information from seabed scans, and other data. So if an AUV surveying the seabed finds an intriguing object, it can share the coordinates of the object - that is, its position - with a nearby AUV that carries superior cameras, and arrange for that AUV to make a closer inspection of the object.", "qids": ["37"]}, {"speaker": null, "text": "Marine archaeologists are excited about the huge potential of these AUVs for their discipline. One site where they're going to be deployed is the Gulf of Baratti, off the Italian coast. In 1974, a 2,000-year-old Roman vessel was discovered here, in 18 metres of water. When it sank, it was carrying medical goods, in wooden or tin receptacles. Its cargo gives us insight into the treatments available all those years ago, including tablets that are thought to have been dissolved to form a cleansing liquid for the eyes.  [Q38", "qids": ["38", "39"]}, {"speaker": null, "text": "Q39]", "qids": []}, {"speaker": null, "text": "Other Roman ships went down nearby, taking their cargoes with them. Some held huge pots made of terracotta. Some were used for transporting cargoes of olive oil, and others held wine. In many cases it's only these containers that remain, while the wooden ships have been buried under silt on the seabed.", "qids": ["40"]}, {"speaker": null, "text": "Another project that's about to", "qids": []}], "notes": ["The hunt for sunken settlements and ancient shipwrecks", "ATLIT-YAM", "was a village on coast of eastern Mediterranean", "thrived until about 7,000 BC", "stone homes had a courtyard", "had a semicircle of large stones round a {{31}}", "cause of destruction unknown – now under the sea", "biggest settlement from the prehistoric period found on the seabed", "research carried out into structures, {{32}} and human remains", "TRADITIONAL AUTONOMOUS UNDERWATER VEHICLES (AUVs)", "used in the oil industry, e.g. to make {{33}}", "problems: they were expensive and {{34}}", "LATEST AUVs", "much easier to use, relatively cheap, sophisticated", "Tests:", "Marzamemi, Sicily: found ancient Roman ships carrying architectural elements made of    {{35}}", "Underwater internet:", "{{36}} is used for short distance communication, acoustic waves for long distance", "plans for communication with researchers by satellite", "AUV can send data to another AUV that has better {{37}} , for example", "Planned research in Gulf of Baratti:", "to find out more about wrecks of ancient Roman ships, including", "one carrying {{38}} supplies; tablets may have been used for cleaning the {{39}}", "others carrying containers of olive oil or {{40}}"]}]};

<script>
(function(){
  const partsEl = document.getElementById('parts');
  const tabsEl = document.getElementById('tabs');

  function renderNotes(part){
    let html = '<div class="notes-block">';
    for(const rawLine of part.notes){
      const text = rawLine.trim();
      if(!text) continue;
      const isBlankLine = /\{\{\d+\}\}/.test(text);
      const isBulletLine = /^[–\-•]/.test(text);
      const isExample = /^example$/i.test(text);
      const rendered = text.replace(/\{\{(\d+)\}\}/g, (m, num) => {
        return `<span class="blank-num">${num}</span><input class="blank" type="text" data-part="${part.part}" data-q="${num}" autocomplete="off" spellcheck="false">`;
      });
      if(isExample){
        html += `<span class="subhead example-line">Example</span><br>`;
      } else if(isBlankLine){
        html += (isBulletLine ? '<span class="bullet">' : '<span>') + rendered + '</span><br>';
      } else if(isBulletLine){
        html += `<span class="bullet">${text}</span><br>`;
      } else if(text.split(' ').length <= 4){
        html += `<span class="subhead">${text}</span><br>`;
      } else {
        html += `<span class="example-line">${text}</span><br>`;
      }
    }
    html += '</div>';
    return html;
  }

  function renderMatching(g, part){
    let html = '<div class="qgroup" data-qids="' + g.qids.join(',') + '" data-mtype="matching">';
    if(g.image){
      html += `<img class="map-img" src="${g.image}" alt="${(g.box_title||'Map')}">`;
    }
    const boxEntries = Object.entries(g.box || {});
    if(boxEntries.length){
      html += '<div class="box-panel">';
      if(g.box_title) html += `<div class="box-title">${g.box_title}</div>`;
      for(const [letter, text] of boxEntries){
        html += `<div class="box-item"><b>${letter}</b><span>${text}</span></div>`;
      }
      html += '</div>';
    } else if(g.box_title){
      html += `<div class="box-title" style="margin-bottom:8px;font-weight:800;color:var(--navy);">${g.box_title}</div>`;
    }
    const letters = boxEntries.length ? boxEntries.map(([l]) => l) : (g.qids.length ? inferLetters(g) : []);
    for(const s of g.stems){
      html += `<div class="stem-row" data-q="${s.qid}"><span class="blank-num">${s.qid}</span><span class="stem-text">${s.prompt}</span>`;
      html += `<select data-part="${part.part}" data-q="${s.qid}"><option value="">--</option>`;
      for(const letter of letters){
        html += `<option value="${letter}">${letter}</option>`;
      }
      html += '</select></div>';
    }
    html += '</div>';
    return html;
  }

  function inferLetters(g){
    // No box text (e.g. a map where letters are drawn on the image) --
    // fall back to A..I so the dropdown offers every valid letter (some
    // maps go up to I, not just H).
    return ['A','B','C','D','E','F','G','H','I'];
  }

  function renderMcq(part){
    let html = '';
    for(const g of part.groups){
      if(g.header){
        html += `<div class="header-note">${g.header}</div>`;
      }
      if(g.type === 'matching'){
        html += renderMatching(g, part);
        continue;
      }
      const qidsLabel = g.qids.length>1 ? `${g.qids[0]}\u2013${g.qids[g.qids.length-1]}` : g.qids[0];
      html += `<div class="qgroup" data-qids="${g.qids.join(',')}" data-multi="${g.multi}">`;
      html += `<div class="prompt"><span class="blank-num">${qidsLabel}</span> ${g.prompt}</div>`;
      html += '<div class="opt-list">';
      for(const [letter, text] of Object.entries(g.options)){
        const inputType = g.multi ? 'checkbox' : 'radio';
        const name = g.multi ? `p${part.part}g${g.qids.join('_')}` : `p${part.part}q${g.qids[0]}`;
        html += `<label class="opt" data-letter="${letter}"><input type="${inputType}" name="${name}" value="${letter}" ${g.multi?`data-max="${g.qids.length}"`:''}>`+
                `<span><b>${letter}.</b> ${text}</span></label>`;
      }
      html += '</div></div>';
    }
    return html;
  }

  const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function fmtTime(t){
    t = Math.max(0, Math.round(t||0));
    const m = Math.floor(t/60), s = t%60;
    return `${m}:${String(s).padStart(2,'0')}`;
  }

  function buildScriptHtml(part){
    // part.script_full: the complete audioscript for this part, line by line, in order.
    // Lines whose "qids" array is non-empty are the lines where an answer's information
    // is actually said -- those get highlighted, tagged with the question number(s), and
    // (when time_seconds is known) get a jump button that seeks the script's own audio player.
    const lines = part.script_full || [];
    if(!lines.length) return '<p class="muted">No script data.</p>';
    return lines.map(l => {
      const spk = l.speaker ? `<span class="spk">${esc(l.speaker)}:</span> ` : '';
      let body = esc(l.text);
      if(l.qids && l.qids.length){
        const tags = l.qids.map(q => `<span class="qtag">Q${q}</span>`).join('');
        let jumpBtn = '';
        if(typeof l.time_seconds === 'number'){
          jumpBtn = `<button type="button" class="jump-btn" data-action="jump-audio" data-part="${part.part}" data-time="${l.time_seconds}" title="Jump to ${fmtTime(l.time_seconds)}">\u25b6 ${fmtTime(l.time_seconds)}</button>`;
        }
        body = `${jumpBtn}<mark class="hl">${body}</mark>${tags}`;
      }
      return `<p class="script-line">${spk}${body}</p>`;
    }).join('');
  }

  function buildExplanationsHtml(part){
    let html = '';
    const qids = [];
    if(part.kind === 'notes'){
      Object.keys(part.answers).sort((a,b)=>a-b).forEach(q=>qids.push(q));
    } else {
      part.groups.forEach(g=>g.qids.forEach(q=>qids.push(q)));
      qids.sort((a,b)=>a-b);
    }
    for(const q of qids){
      const e = part.explanations[q] || {};
      const ans = part.answers[q] || '';
      html += `<div class="expl-item"><div class="eq-head"><span class="qnum">C\u00e2u ${q}</span><span class="ans">${ans}</span></div>`;
      if(e.quote){
        html += `<div class="quote">"${e.quote.replace(/</g,'&lt;')}"</div>`;
      }
      html += `<div class="explain">${(e.explain||'').replace(/</g,'&lt;')}</div></div>`;
    }
    return html;
  }

  function gradeParts(part){
    let correct = 0, total = 0;
    if(part.kind === 'notes'){
      for(const [q, ans] of Object.entries(part.answers)){
        total++;
        const input = partsEl.querySelector(`input.blank[data-part="${part.part}"][data-q="${q}"]`);
        if(!input) continue;
        const val = input.value.trim().toLowerCase();
        const ok = val === String(ans).trim().toLowerCase();
        input.classList.remove('correct','incorrect');
        input.classList.add(ok ? 'correct' : 'incorrect');
        if(ok) correct++;
        if(!ok){
          input.title = `Correct answer: ${ans}`;
        }
      }
    } else {
      for(const g of part.groups){
        if(g.type === 'matching'){
          for(const s of g.stems){
            total++;
            const sel = partsEl.querySelector(`.part[data-part="${part.part}"] select[data-q="${s.qid}"]`);
            if(!sel) continue;
            const correctLetter = part.answers[s.qid];
            const ok = sel.value === correctLetter;
            sel.classList.remove('correct','incorrect');
            sel.classList.add(ok ? 'correct' : 'incorrect');
            if(ok) correct++;
            else sel.title = `Correct answer: ${correctLetter}`;
          }
          continue;
        }
        const groupEl = partsEl.querySelector(`.part[data-part="${part.part}"] .qgroup[data-qids="${g.qids.join(',')}"]`);
        if(!groupEl) continue;
        const inputs = groupEl.querySelectorAll('input');
        const correctLetters = g.qids.map(q => part.answers[q]);
        const selected = Array.from(inputs).filter(i=>i.checked).map(i=>i.value);
        groupEl.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','incorrect'));
        inputs.forEach(inp=>{
          const label = inp.closest('.opt');
          const letter = label.dataset.letter;
          if(correctLetters.includes(letter)) label.classList.add('correct');
          else if(inp.checked) label.classList.add('incorrect');
        });
        if(g.multi){
          total += g.qids.length;
          const sortedSel = [...selected].sort();
          const sortedCorrect = [...correctLetters].sort();
          if(sortedSel.length===sortedCorrect.length && sortedSel.every((v,i)=>v===sortedCorrect[i])){
            correct += g.qids.length;
          } else {
            correctLetters.forEach(cl=>{ if(selected.includes(cl)) correct++; });
          }
        } else {
          total += 1;
          if(selected[0] === correctLetters[0]) correct += 1;
        }
      }
    }
    return {correct, total};
  }

  function renderPart(part, idx){
    const wrap = document.createElement('div');
    wrap.className = 'part' + (idx===0 ? ' active' : '');
    wrap.dataset.part = part.part;

    const card = document.createElement('div');
    card.className = 'card';
    let inner = `<div class="part-bar"><span>PART ${part.part}${part.title ? ' — ' + part.title : ''}</span><span class="title">${part.kind==='notes'?'Note Completion':'Multiple Choice'}</span></div>`;
    inner += `<div class="card-body">`;
    if(part.instructions) inner += `<div class="instructions">${part.instructions}</div>`;
    inner += `<div class="audio-box"><span class="icon">\ud83c\udfa7</span><span class="label">Part ${part.part} Audio</span><audio controls preload="none" src="${part.audio}"></audio></div>`;
    inner += part.kind === 'notes' ? renderNotes(part) : renderMcq(part);
    inner += `<div class="actions">
        <button class="primary" data-action="check">Check Answers</button>
        <button class="ghost" data-action="reset">Reset</button>
        <span class="score-pill" data-role="score" style="display:none;"></span>
      </div>
      <div class="actions" style="margin-top:0;">
        <button class="ghost" data-action="toggle-script">Show Script</button>
        <button class="ghost" data-action="toggle-expl">Show Answers &amp; Explanations</button>
      </div>
      <div class="toggle-section" data-role="script-section">
        <h2 style="font-size:15px;color:var(--navy);">Full Script — Part ${part.part}</h2>
        <p class="script-note">Listen and follow along below — highlighted lines show where each answer is said${part.script_full && part.script_full.some(l=>typeof l.time_seconds==='number') ? '; tap a time button to jump straight there.' : '.'}</p>
        <div class="audio-box"><span class="icon">\ud83c\udfa7</span><span class="label">Part ${part.part} Audio</span><audio controls preload="none" src="${part.audio}" data-role="script-audio"></audio></div>
        <div class="script-text">${buildScriptHtml(part)}</div>
      </div>
      <div class="toggle-section" data-role="expl-section">
        <h2 style="font-size:15px;color:var(--navy);">Answers &amp; Explanations — Part ${part.part}</h2>
        ${buildExplanationsHtml(part)}
      </div>
      </div>`;
    card.innerHTML = inner;
    wrap.appendChild(card);

    card.querySelectorAll('.qgroup[data-multi="true"]').forEach(groupEl => {
      const boxes = Array.from(groupEl.querySelectorAll('input[type="checkbox"]'));
      if(!boxes.length) return;
      const max = parseInt(boxes[0].dataset.max, 10) || 2;
      const sync = () => {
        const checkedCount = boxes.filter(b=>b.checked).length;
        boxes.forEach(b => { if(!b.checked) b.disabled = checkedCount >= max; });
      };
      boxes.forEach(b => b.addEventListener('change', sync));
    });

    card.querySelector('[data-action="check"]').addEventListener('click', () => {
      const {correct, total} = gradeParts(part);
      const pill = card.querySelector('[data-role="score"]');
      pill.style.display = 'inline-block';
      pill.textContent = `Score: ${correct} / ${total}`;
      const tabBtn = tabsEl.querySelector(`[data-tab="${part.part}"]`);
      if(tabBtn) tabBtn.classList.add('done');
    });
    card.querySelector('[data-action="reset"]').addEventListener('click', () => {
      card.querySelectorAll('input[type="text"]').forEach(i=>{i.value='';i.classList.remove('correct','incorrect');i.title='';});
      card.querySelectorAll('input[type="radio"],input[type="checkbox"]').forEach(i=>{i.checked=false;i.disabled=false;});
      card.querySelectorAll('select').forEach(s=>{s.value='';s.classList.remove('correct','incorrect');s.title='';});
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','incorrect'));
      card.querySelector('[data-role="score"]').style.display='none';
      const tabBtn = tabsEl.querySelector(`[data-tab="${part.part}"]`);
      if(tabBtn) tabBtn.classList.remove('done');
    });
    card.querySelector('[data-action="toggle-script"]').addEventListener('click', (e) => {
      const sec = card.querySelector('[data-role="script-section"]');
      sec.classList.toggle('open');
      e.target.textContent = sec.classList.contains('open') ? 'Hide Script' : 'Show Script';
    });
    card.querySelector('[data-action="toggle-expl"]').addEventListener('click', (e) => {
      const sec = card.querySelector('[data-role="expl-section"]');
      sec.classList.toggle('open');
      e.target.textContent = sec.classList.contains('open') ? 'Hide Answers & Explanations' : 'Show Answers & Explanations';
    });
    card.querySelectorAll('[data-action="jump-audio"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const t = Number(btn.dataset.time) || 0;
        const audio = card.querySelector('[data-role="script-audio"]');
        if(!audio) return;
        audio.currentTime = t;
        audio.play();
      });
    });

    return wrap;
  }

  TEST_DATA.parts.forEach((part, idx) => {
    const tabBtn = document.createElement('button');
    tabBtn.className = 'tab-btn' + (idx===0 ? ' active' : '');
    tabBtn.dataset.tab = part.part;
    tabBtn.innerHTML = `<span class="dot"></span>Part ${part.part}`;
    tabBtn.addEventListener('click', () => {
      partsEl.querySelectorAll('audio').forEach(a => { a.pause(); });
      tabsEl.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      partsEl.querySelectorAll('.part').forEach(p=>p.classList.remove('active'));
      tabBtn.classList.add('active');
      partsEl.querySelector(`.part[data-part="${part.part}"]`).classList.add('active');
      window.scrollTo({top:0, behavior:'smooth'});
    });
    tabsEl.appendChild(tabBtn);
    partsEl.appendChild(renderPart(part, idx));
  });
})();
</script>
</body>
</html>
