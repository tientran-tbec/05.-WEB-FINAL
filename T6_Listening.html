<script>
const TEST_DATA = {"test": "Test 6", "parts": [{"part": 1, "kind": "notes", "title": "Clare House Hotel (booking a room for an event)", "instructions": null, "audio": "audio/test6/part1.mp3", "answers": {"1": "85", "2": "roses", "3": "trees", "4": "stage", "5": "speech", "6": "support", "7": "cabins", "8": "C", "9": "A", "10": "B"}, "explanations": {"1": {"answer_label": "Câu 1", "quote": "Well we have two rooms that can hold that number. One is the Adelphi Room.\n\nThat can seat eighty-five (Q1), or hold over a hundred if people are standing for a buffet.", "explain": "Câu hỏi:\nAdelphi Room\nnumber of people who can sit down to eat: 1.\nKeywords được paraphrase:\nCâu hỏi nằm trong phần “Adelphi Room” (Phòng Adelphi). Dịch câu hỏi “number of people who can sit down to eat” (số người có thể ngồi xuống để ăn). Vì vậy, đáp án ở đây cần một con số.\nGiải thích đáp án:\nCâu trả lời nằm trong phần nói của Andrew. Ở đây có hai con số được đưa ra, ta cần phải lưu ý “That can seat 85” (Nó có thể đủ chỗ ngồi cho 85). Con số thứ hai được nhắc đến “hold over a hundred if people are standing” (chứ hơn 100 nếu mọi người đứng). VÌ vậy, đáp án ở đây là 85."}, "2": {"answer_label": "Câu 2", "quote": "Exactly. Now the Adelphi Room is at the back of the hotel, and there are French windows leading out onto the terrace. This has a beautiful display of pots of roses(Q2) at that time of the year", "explain": "Câu hỏi:\nhas a gallery suitable for musicians can go out and see the 2 ………………….. in pots on the terrace\nKeywords được paraphrase:\nCâu hỏi vẫn nằm trong phần “Adelphi Room” (Phòng Adelphi). Trước phần câu hỏi có thông tin về “a gallery suitable for musicians” (một phòng trưng bày phù hợp cho các nhạc sĩ). Dịch câu hỏi “can go out and see the ... in pots on the terrace” (có thể ra ngoài và nhìn thấy... trong chậu trên sân thượng). Vì vậy, ta cần điền một danh từ ở đây.\nGiải thích đáp án:\nAndrew tiếp tục đưa thông tin về căn phòng. Đáp án nằm trong câu “This has a beautiful display of pots of roses” (Có một sự trưng bày những chậu hoa hồng). Vì vậy, đáp án ở đây là “roses”."}, "3": {"answer_label": "Câu 3", "quote": "From the terrace you can see the area of trees (Q3) within the grounds of the hotel, or you can stroll through there to the river - that's on the far side, so it isn't visible from the hotel.", "explain": "Câu hỏi:\nterrace has a view of a group of 3\t\nKeywords được paraphrase:\nCâu hỏi vẫn nằm trong phần “Adelphi Room” (Phòng Adelphi). Dịch câu hỏi “terrace has a view of a group of ...” (sân thượng có một tầm nhìn thấy một đám ...). Do đó, ta cần điền một danh từ ở đây.\nGiải thích đáp án:\nAndrew tiếp tục giới thiệu về “terrace” (sân thượng) bằng câu “From the terrace you can see the area of trees” (từ sân thượng bạn có thể thấy khu có nhiều cây). Vì vậy, đáp án ở đây là “trees”."}, "4": {"answer_label": "Câu 4", "quote": "Then another option is the Carlton Room. This is a bit bigger - it can hold up to a hundred and ten people - and it has the advantage of a stage (Q4), which is useful if you have any entertainment, or indeed a small band can fit onto it.", "explain": "Câu hỏi:\nCarlton Room\nnumber of people who can sit down to eat:\n110\nhas a 4\tview\tof the lake\nKeywords được paraphrase:\nCâu hỏi nằm trong phần “Carlton Room” (Phòng Carlton). Trước câu hỏi cần điền, có thông tin về “number of people who can sit down to eat: 110 “(số người có thể ngồi xuống ăn: 110). Dịch câu hỏi “has a...” (có một...). Do đó, ở đây ta cần điền một danh từ đếm được số ít.\nGiải thích đáp án:\nAndrew giới thiệu Phòng Carlton “it can hold up to a hundred and ten people” (nó có thể chứa tới 110 người). Sau đó, thông tin tiếp tục được đưa ra “it has the advantage of a stage” (có một lợi thế là một cái sàn). Vì vậy, đáp án ở đây là “stage”."}, "5": {"answer_label": "Câu 5", "quote": "As well as a meal, you can have an MC, a Master of Ceremonies, who'll be with you throughout the party.\nWhat exactly is the MC's function? I suppose they make a speech(Q5) during the meal if we need one, do they?\nThat's right. All our MCs are trained as public speakers, so they can easily get", "explain": "Câu hỏi:\nOptions\nMaster of Ceremonies:\ncan give a 5\t while people are\neating\nwill provide 6\tif\tthere are any problems\nKeywords được paraphrase:\nCâu hỏi hỏi nằm trong phần “Options” (Các sự lựa chọn). Phần đầu tiên là “Master of Ceremonies” (Người dẫn chương trình). Thông tin đầu tiên cần điền là “can give a ... while people are eating” (có thể đưa ra một ... trong lúc mọi người đang ăn). Do đó, đáp án là một danh từ đếm được số ít.\nGiải thích đáp án:\nSau khi Andrew giới thiệu về MC, người phụ nữ đưa ra câu hỏi “What exactly is the MC's function?” (chức năng của MC là gì?). Sau đó, người phụ nữ tự đưa ra câu trả lời “ I suppose they make a speech during the meal.” (Tôi cho là họ sẽ đọc bài diễn văn trong bữa ăn). Cụm từ “during the meal” được thay cho cụm “while people are eating”. Vì vậy, đáp án ở đây là “speech”."}, "6": {"answer_label": "Câu 6", "quote": "That's right. All our MCs are trained as public speakers, so they can easily get people's attention - many guests are glad to have someone who can make themselves heard above the chatter! And they're also your support (Q6) - if anything goes wrong, the MC will deal with it, so you can relax.", "explain": "Câu hỏi:\nOptions\nMaster of Ceremonies:\ncan give a 5\twhile\tpeople are eating\nwill provide 6\tif\tthere are any problems\nKeywords được paraphrase:\nCâu hỏi hỏi vẫn nằm trong phần đầu tiên của “Options” (Các sự lựa chọn) là “Master of Ceremonies” (Người dẫn chương trình). Thông tin thứ hai cần điền ở đây là “will provide ... if there are any problems” (sẽ cung cấp nếu có vấn đề). Do đó, đáp án là một danh từ.\nGiải thích đáp án:\nSau khi xác nhận lại ý kiến đầu tiên của người phụ nữ, Andrew đưa ra thông tin thứ hai “And they're also your support - if anything goes wrong” (họ cũng là sự hỗ trợ của bạn nếu có gì sai sót). Cụm từ “if anything goes wrong” được thay bằng cụm “if there are any problems”. Vì vậy, đáp án ở đây là “support”."}, "7": {"answer_label": "Câu 7", "quote": "Great! I'll need to ask you about food, but something else that's important is accommodation. You obviously have rooms in the hotel, but do you also have any other accommodation, like cabins (Q7), for example?", "explain": "Câu hỏi:\nAccommodation:\nin hotel rooms or 7\t\nKeywords được paraphrase:\nCâu hỏi nằm trong phần thứ hai của “Options” (các sự lựa chọn) là “Accommodation” (phòng ở). Dịch câu hỏi “in hotel rooms or ...” (ở phòng khách sạn hoặc ...). Do đó, đáp án ở đây phải là một danh từ chỉ nơi ở.\nGiải thích đáp án:\nGiọng nữ chuyển sang phần “accommodation” bằng câu “You obviously have rooms in the hotel, but do you also have any other accommodation, like cabins” (Bạn rõ ràng có phòng trong khách sạn, nhưng bạn cũng có chỗ ở nào khác, như cabins). Vì vậy, đáp án ở đây là “cabins”."}, "8": {"answer_label": "Câu 8", "quote": "Now you have various facilities, don't you? Are they all included in the price of hiring the room? The pool, for instance.\nNormally you'd be able to use it. But it’ll be closed throughout September for refurbishment (Q8). I'm afraid. The gym will be available, though, at no extra charge (Q9). That's open all day, from six in the morning until midnight.", "explain": "Câu hỏi:\n8. outdoor swimming pool\t\nKeywords được paraphrase:\nCâu hỏi yêu cầu nối tình trạng của các cơ sở vật chất trong khách sạn\nĐáp án A. included in cost of hiring room (đã bao gồm trong giá thuê phòng)\nĐáp án B. available at extra charge (có sẵn với phụ thu)\nĐáp án C. not available (không có sẵn)\nGiải thích đáp án:\nNgười phụ nữ đưa ra câu hỏi về các cơ sở vật chất “Now you have various facilities, don't you? Are they all included in the price of hiring the room? The pool, for instance” (Bây giờ bạn có cơ sở khác nhau, phải không? Có phải tất cả đều được bao gồm trong giá thuê phòng? Ví dụ, hồ bơi). Người đàn ông đưa ra câu trả lời “ it'll be closed throughout September for refurbishment” (nó sẽ đóng cửa trong suốt tháng 9 để tân trang). Vì vậy, ta nối câu hỏi 8 với đáp án C."}, "9": {"answer_label": "Câu 9", "quote": "Now you have various facilities, don’t you? Are they all included in the price of hiring the room? The pool, for instance.\nNormally you’d be able to use it. But it’ll be closed throughout September for refurbishment (Q8). I’m afraid. The gym will be available, though, at no extra charge (Q9). That's open all day, from six in the morning until midnight.", "explain": "Câu hỏi:\n9. gym\t\nKeywords được paraphrase:\nCâu hỏi yêu cầu nối tình trạng của các cơ sở vật chất trong khách sạn\nĐáp án A. included in cost of hiring room (đã bao gồm trong giá thuê phòng)\nĐáp án B. available at extra charge (có sẵn với phụ thu)\nĐáp án C. not available (không có sẵn)\nGiải thích đáp án:\nSau khi đưa thông tin về “pool” (hồ bơi), người nói tiếp tục giới thiệu về cơ sở vật chất thứ 2 “The gym will be available, though, at no extra charge” (Phòng tập thể dục sẽ có sẵn, mặc dù, không tính thêm phí). Vì vậy, ta nối đáp án A với câu hỏi 9."}, "10": {"answer_label": "Câu 10", "quote": "And the tennis courts, but there is a small additional payment for those (Q10). We have four courts, and it's worth booking in advance if you possibly can, as there can be quite a long waiting list for them!", "explain": "Câu hỏi:\n10.\ttennis courts\t\nKeywords được paraphrase:\nCâu hỏi yêu cầu nối tình trạng của các cơ sở vật chất trong khách sạn\nĐáp án A. included in cost of hiring room (đã bao gồm trong giá thuê phòng)\nĐáp án B. available at extra charge (có sẵn với phụ thu)\nĐáp án C. not available (không có sẵn)\nGiải thích đáp án:\nCuối cùng, người đàn ông giới thiệu về “tennis courts” (sân tennis) bằng câu “there is a small additional payment for those” (có một khoản bổ sung nhỏ cho nó). Vì vậy, ta chọn đáp án B."}}, "script_full": [{"speaker": null, "text": "ANDREW: Good morning, Clare House Hotel.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "Andrew speaking.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "I'm the Events Manager.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "SAM: Good morning, Andrew.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "My name's Samantha.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "I'm arranging a party for my parents fiftieth wedding anniversary, and I'm ringing to ask about hiring a room some time next September.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "Also my parents and several of the guests will need accommodation.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ANDREW: OK, I'm sure we can help you with that.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "Will you be having a sit-down meal or a buffet?", "qids": [], "time_seconds": null}, {"speaker": null, "text": "SAM: Probably a sit-down.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ANDREW: And do you know how many people there'll be?", "qids": [], "time_seconds": null}, {"speaker": null, "text": "SAM: Around eighty, I think.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ANDREW: Well we have two rooms that can hold that number.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "One is the Adelphi Room.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "That can seat eighty-five, or hold over a hundred if people are standing for a buffet.", "qids": ["1"], "time_seconds": 191}, {"speaker": null, "text": "SAM: Right.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ANDREW: If you have live music, there's room for four or five musicians in the gallery overlooking the room.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "Our guests usually appreciate the fact that the music can be loud enough for dancing, but not too loud for conversation.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "SAM: Yes, I really don't like it when you can't talk.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ANDREW: Exactly.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "Now the Adelphi Room is at the back of the hotel, and there are French windows leading out onto the terrace.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "This has a beautiful display of pots of roses at that time of the year.", "qids": ["2"], "time_seconds": 229}, {"speaker": null, "text": "SAM: Which direction does it face?", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ANDREW: Southwest, so that side of the hotel gets the sun in the afternoon and early evening.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "SAM: Very nice.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ANDREW: From the terrace you can see the area of trees within the grounds of the hotel, or you can stroll through there to the river - that's on the far side, so it isn't visible from the hotel.", "qids": ["3"], "time_seconds": 245}, {"speaker": null, "text": "SAM: OK.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ANDREW: Then another option is the Carlton Room.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "This is a bit bigger - it can hold up to a hundred and ten people and it has the advantage of a stage, which is useful if you have any entertainment, or indeed a small band can fit onto it.", "qids": ["4"], "time_seconds": 264}, {"speaker": null, "text": "SAM: And can you go outside from the room?", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ANDREW: No, the Carlton Room is on the first floor, but on one side the windows look out onto the lake.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "SAM: Lovely.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "I think either of those rooms would be suitable.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ANDREW: Can I tell you about some of the options we offer in addition?", "qids": [], "time_seconds": null}, {"speaker": null, "text": "SAM: Please do.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ANDREW: As well as a meal, you can have an MC, a Master of Ceremonies, who'll be with you throughout the party.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "SAM: What exactly is the MC's function?", "qids": [], "time_seconds": null}, {"speaker": null, "text": "I suppose they make a speech during the meal if we need one, do they?", "qids": ["5"], "time_seconds": 310}, {"speaker": null, "text": "ANDREW: That's right.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "All our MCs are trained as public speakers, so they can easily get people's attention many guests are glad to have someone who can make themselves heard above the chatter!", "qids": [], "time_seconds": null}, {"speaker": null, "text": "And they're also your support if anything goes wrong, the MC will deal with it, so you can relax.", "qids": ["6"], "time_seconds": 329}, {"speaker": null, "text": "SAM: Great!", "qids": [], "time_seconds": null}, {"speaker": null, "text": "I'll need to ask you about food, but something else that's important is accommodation.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "You obviously have rooms in the hotel, but do you also have any other accommodation, like cabins, for example?", "qids": ["7"], "time_seconds": 344}, {"speaker": null, "text": "ANDREW: Yes, there are five in the grounds, all self-contained.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "They each sleep two to four people and have their own living room, bathroom and small kitchen.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "SAM: That sounds perfect for what we'll need.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "Now you have various facilities, don't you?", "qids": [], "time_seconds": null}, {"speaker": null, "text": "Are they all included in the price of hiring the room?", "qids": [], "time_seconds": null}, {"speaker": null, "text": "The pool, for instance.", "qids": ["8"], "time_seconds": 407}, {"speaker": null, "text": "ANDREW: Normally you'd be able to use it, but it'll be closed throughout September for refurbishment, I'm afraid.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "The gym will be available, though, at no extra charge.", "qids": ["9"], "time_seconds": 415}, {"speaker": null, "text": "That's open all day, from six in the morning until midnight.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "SAM: Right.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ANDREW: And the tennis courts, but there is a small additional payment for those.", "qids": ["10"], "time_seconds": 423}, {"speaker": null, "text": "We have four courts, and it's worth booking in advance if you possibly can, as there can be quite a long waiting list for them!", "qids": [], "time_seconds": null}, {"speaker": null, "text": "SAM: Right.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "Now could we discuss the food?", "qids": [], "time_seconds": null}, {"speaker": null, "text": "This would be dinner, around seven o'clock.", "qids": [], "time_seconds": null}], "notes": ["Enquiry about booking hotel room for event", "Example", "Andrew is the .............................. Manager", "Rooms", "Adelphi Room", "number of people who can sit down to eat: {{1}}", "has a gallery suitable for musicians", "can go out and see the {{2}} in pots on the terrace", "terrace has a view of a group of {{3}}", "Carlton Room", "number of people who can sit down to eat: 110", "has a {{4}}", "view of the lake", "Options", "Master of Ceremonies:", "can give a {{5}} while people are eating", "will provide {{6}} if there are any problems", "Accommodation:", "in hotel rooms or {{7}}", "Questions 8–10", "What is said about using each of the following hotel facilities?", "Choose THREE answers from the box and write the correct letter, A, B or C, next to Question 8–10.", "Availability", "Availability", "A", "included in cost of hiring room", "B", "available at extra charge", "C", "not available", "Hotel facilities", "Hotel facilities", "{{8}}", "outdoor swimming pool", "....................", "{{9}}", "gym", "....................", "{{10}}", "tennis courts", "...................."]}, {"part": 2, "kind": "mcq", "title": "Croft Valley Park", "instructions": null, "audio": "audio/test6/part2.mp3", "answers": {"11": "D", "12": "C", "13": "G", "14": "H", "15": "A", "16": "E", "17": "A", "18": "D", "19": "A", "20": "C"}, "explanations": {"11": {"answer_label": "11. D", "quote": "The café continues to serve an assortment of drinks and snacks and is still in the same place, looking out over the lake and next to the old museum.", "explain": "Câu hỏi:\n\n11.\tCafé \t\nGiải thích đáp án:\nKhi ta nghe người dẫn nói về “cafe”, cần tập trung lắng nghe thông tin về vị trí của nó trên bản đồ. Ta nghe được \"... looking out over the lake and next to the old museum” (Nhìn về phía sông và kế Old museum). Như vậy đáp án là “D”."}, "12": {"answer_label": "12. C", "quote": "We're hoping to change the location of the toilets, and bring them nearer to the centre of the park as they're a bit out of the way at present, near the adventure playground, in the corner of your map.", "explain": "Câu hỏi: \n\nI South gate I\n12.\tToilets \t\nGiải thích đáp án:\nSau khi người dẫn nhắc đến “toilets”, ta nghe được “...at present, near the adventure playground, in the corner of your map” (hiện tai. nó ở gần với adventure playground, trong góc bản đồ của bạn). Như vậy ta chọn đáp án c."}, "13": {"answer_label": "13. G", "quote": "The formal gardens have been replanted and should be at their best in a month or two. They used to be behind the old museum, but we've now used the space near the south gate — between the park boundary and the path that goes past the lake towards the old museum.", "explain": "Câu hỏi:\n\n13.\tFormal gardens \t\nGiải thích đáp án:\nSau khi người dẫn nhắc đến “formal gardens”, ta nghe được “behind the museum” (đằng sau old museum) tuy nhiên, đây không phải đáp án vì thông tin này nằm trong câu “they used to be...” (Chúng từng ở ...). Vị trí này không phải ở hiện tại. Tiếp theo ta nghe được “the space near the south gate, between the park boundary and the path that goes past the lake towards the museum” (Khoảng không gian gần cổng phía nam, giữa biên giới cõng viên và con đường đi qua cái hồ hướng ve phía viện tóo tàn). Như vậy ta chọn đáp án G."}, "14": {"answer_label": "14. H", "quote": "We have a new outdoor gym for adults and children, which is already proving very popular. It's by the glass houses, lust to the right of the path from the south gate. You have to look for it as it's a bit hidden in the trees.", "explain": "Câu hỏi:\n\n14.\tOutdoor gym \t\nGiải thích đáp án:\nSau khi người dẫn nhắc đến “outdoor gym”, ta nghe được “It’s by the glass houses, just to the right of the path from the south gate. You have to look for it as it’s a bit hidden in the trees” (Nó bên cạnh glass houses, ở bên phải con đường từ cổng phía nam. Bạn phái tìm nó một chút vì nó ẩn mình trong đám cây). “By the glass houses” giúp ta lọc ra được đáp án F và H. Tuy nhiên vì địa điểm này nằm ẩn mình trong cây, nên ta chọn đáp án H."}, "15": {"answer_label": "15.\tA", "quote": "One very successful introduction has been our skateboard ramp. Ws in constant use during the evenings and holidays. It's near the old museum. at the end of a little oath that leads off from the main path between the lake and the museum.", "explain": "Câu hỏi:\n\n15.\tSkateboard ramp\t\nGiải thích đáp án:\nSau khi nghe người dẫn nói về “skateboard ramp”, ta nghe được thông tin về v trí của nó “It’s near the old museum, at the end of a little path that leads off from the main path between the lake and the museum” (Nó gần với old museum, ở cuối con đường nhở mà được chẽ ra khỏi con đường chính ở đoạn giữa hồ và bảo tàng). Như vậy ta chọn đáp án A."}, "16": {"answer_label": "16. E", "quote": "We've also introduced a new area for wild flowers, to attract bees and butterflies. It's on a bend in the oath that goes round the east side of the lake, lust south of the adventure playground.", "explain": "Câu hỏi:\n\n16. Wild flowers \t\nGiải thích đáp án:\nSau khi người dẫn nói về “wild flowers”, ta nghe được thông tin về v trí của nó như sau “It’s on the bend in the path that goes round the east side of the lake, just south of the adventure playground” (Nó nằm ở khúc ngoặt của con đường mà chạy quanh phía đông của cái hồ, nằm ngay phía nam của adventure playground). Như vậy, ta chọn đáp án E."}, "17": {"answer_label": "17. A & D", "quote": "One of our most exciting developments has been the adventure playground.\nset up a completely new facility in a large space to the north of the park. It's open year-round, though it closes early in the winter months, and entrance is completely Gee. Children can ...", "explain": "Câu hỏi: \nQuestions 17 and 18 \nChoose TWO letters, A-E. \nWhat does the speaker say about the adventure playground? \nA Children must be supervised. \nB It costs more in winter. \nC Some activities are only for younger children. \nD No payment is required. \nE It was recently expanded. \nKeywords được paraphrase: \nKeyword chính của câu 17 và 18 là “adventure playground” (sân chơi thám hiểm) giúp ta xác định vị trí của câu hỏi trong bài nghe. Câu hỏi yêu cầu ta nghe thông tin của người dẫn cung cấp về sân chơi này. \nGiải thích đáp án: \nThông tin đầu tiên mà ta nghe được là “It’s open year-round, though it closes early in winter months” (Nó mở quanh năm, tuy vậy nó sẽ đóng cửa sớm hơn vào những tháng mùa đông). Mặc dù có có nhắc đến “winter” (mùa đông) giống với lựa chọn B, tuy nhiên ta không chọn lựa chọn này vì thông tin trình bày ở B hoàn toàn khác với thông tin trong bài nghe. Tiếp theo, ta nghe được “and entrance is completely free” (và giá vào cổng hoàn toàn miễn phí). Thông tin này khớp với lựa chọn D. “No payment is required” (Không cần bất kì thanh toán nào)."}, "18": {"answer_label": "18.  A & D", "quote": "though it closes early in the winter months, and entrance is completely free. Children can choose whatever activities they want to do, irrespective of their age, but we do ask adults not to leave them on their own there. There are plenty of seats where parents can relax and keep an eye on their children at the same time.", "explain": "Câu hỏi: \nQuestions 17 and 18 \nChoose TWO letters, A-E. \nWhat does the speaker say about the adventure playground? \nA Children must be supervised. \nB It costs more in winter. \nC Some activities are only for younger children. \nD No payment is required. \nE It was recently expanded. \nKeywords được paraphrase: \nKeyword chính của câu 17 và 18 là “adventure playground” (sân chơi thám hiểm) giúp ta xác định vị trí của câu hỏi trong bài nghe. Câu hỏi yêu cầu ta nghe thông tin của người dẫn cung cấp về sân chơi này. \nGiải thích đáp án: \nThông tin tiếp theo mà ta nghe được về sân chơi là “… but we do ask adults not to leave them on their own there” (Nhưng chúng tôi cũng yêu cầu những người lớn không được để chúng một mình tự do ở đó). Thông tin này ứng với lựa chọn A. “Children must be supervised” (Trẻ em phải được giám sát)."}, "19": {"answer_label": "19.  A & C", "quote": "Lastly, the glass houses. A huge amount of work has been done on them to repair the damage following the disastrous fire that recently destroyed their western side. Over £80,000 …", "explain": "Câu hỏi: \nQuestions 19 and 20 \nChoose TWO letters, A-E. \nWhat does the speaker say about the glass houses? \nA They are closed at weekends. \nB Volunteers are needed to work there. \nC They were badly damaged by fire. \nD More money is needed to repair some of the glass. \nE Visitors can see palm trees from tropical regions. \nKeywords được paraphrase: \nKeyword chính của câu 19 và 20 là “glass houses” (nhà kính) giúp ta xác định vị trí của câu hỏi trong bài nghe. Câu hỏi yêu cầu ta nghe thông tin của người dẫn cung cấp về địa điểm này. \nGiải thích đáp án: \nSau khi người dẫn nhắc đến “glass houses”, ta nghe được thông tin đầu tiên về nó “A huge amount of work has been done on them to repair the damage following the disastrous fire that recently destroyed their western side” (Một lượng lớn công sức đã phải bỏ ra để sửa chữa những thiệt hại sau một trận hỏa hoạn lớn mà đã phá hủy phần phía tây của nó mới đây). Thông tin này ứng với lựa chọn C. “They were badly damaged by fire” (Chúng bị thiệt hại nặng nề bởi hỏa hoạn)."}, "20": {"answer_label": "20.  A & C", "quote": "been destroyed, although unfortunately the collection of tropical palm trees has proved too expensive to replace up to now. At present the glass houses are open from 10am to 3pm Mondays to Thursdays, and its hoped to extend this to the weekend soon. We're grateful to", "explain": "Câu hỏi: \nQuestions 19 and 20 \nChoose TWO letters, A-E. \nWhat does the speaker say about the glass houses? \nA They are closed at weekends. \nB Volunteers are needed to work there. \nC They were badly damaged by fire. \nD More money is needed to repair some of the glass. \nE Visitors can see palm trees from tropical regions. \nKeywords được paraphrase: \nKeyword chính của câu 19 và 20 là “glass houses” (nhà kính) giúp ta xác định vị trí của câu hỏi trong bài nghe. Câu hỏi yêu cầu ta nghe thông tin của người dẫn cung cấp về địa điểm này. \nGiải thích đáp án: \nThông tin thứ hai về “glass houses” mà ta nghe được là về thời gian mở cửa của nó “At present the glass houses are open from 10am to 3pm Mondays to Thursdays, and it’s hoped to extend this to the weekend soon” (Ở thời điểm hiện tại, những ngôi nhà kính mở cửa từ 10am đến 3pm từ thứ hai đến thứ năm, và chúng tôi hy vọng có thể sớm kéo dài ra đến cuối tuần). Như vậy, ở thời điểm hiện tại, những ngôi nhà kính chưa thể mở cửa vào cuối tuần được, thông tin này hướng ta đến lựa chọn A. “they are closed at weekends” (Chúng đóng cửa vào cuối tuần)."}}, "script_full": [{"speaker": null, "text": "As chair of the town council subcommittee on park facilities, I'd like to bring you up to date on some of the changes that have been made recently to the Croft Valley Park. So if you could just take a look at the map I handed out, let's begin with a general overview. So the basic arrangement of the park hasn't changed - it still has two gates, north and south, and a lake in the middle.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "The café continues to serve an assortment of drinks and snacks and is still in the same place, looking out over the lake and next to the old museum.", "qids": ["11"], "time_seconds": 88}, {"speaker": null, "text": "We're hoping to change the location of the toilets, and bring them nearer to the centre of the park as they're a bit out of the way at present, near the adventure playground, in the corner of your map.", "qids": ["12"], "time_seconds": 101}, {"speaker": null, "text": "The formal gardens have been replanted and should be at their best in a month or two. They used to be behind the old museum, but we've now used the space near the south gate - between the park boundary and the path that goes past the lake towards the old museum.", "qids": ["13"], "time_seconds": 118}, {"speaker": null, "text": "We have a new outdoor gym for adults and children, which is already proving very popular. It's by the glass houses, just to the right of the path from the south gate. You have to look for it as it's a bit hidden in the trees.", "qids": ["14"], "time_seconds": 140}, {"speaker": null, "text": "One very successful introduction has been our skateboard ramp. It's in constant use during the evenings and holidays. It's near the old museum, at the end of a little path that leads off from the main path between the lake and the museum.", "qids": ["15"], "time_seconds": 160}, {"speaker": null, "text": "We've also introduced a new area for wild flowers, to attract bees and butterflies. It's on a bend in the path that goes round the east side of the lake, just south of the adventure playground.", "qids": ["16"], "time_seconds": 178}, {"speaker": null, "text": "Now let me tell you a bit more about some of the changes to Croft Valley Park.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "One of our most exciting developments has been the adventure playground. We were aware that we had nowhere for children to let off steam, and decided to use our available funds to set up a completely new facility in a large space to the north of the park. It's open year-round, though it closes early in the winter months, and entrance is completely free. Children can choose whatever activities they want to do, irrespective of their age, but we do ask adults not to leave them on their own there. There are plenty of seats where parents can relax and keep an eye on their children at the same time.", "qids": ["17", "18"], "time_seconds": 241}, {"speaker": null, "text": "Lastly, the glass houses. A huge amount of work has been done on them to repair the damage following the disastrous fire that recently destroyed their western side. Over £80,000 was spent on replacing the glass walls and the metal supports, as well as the plants that had been destroyed, although unfortunately the collection of tropical palm trees has proved too expensive to replace up to now. At present the glass houses are open from 10am to 3pm Mondays to Thursdays, and it's hoped to extend this to the weekend soon. We're grateful to all those who helped us by contributing their time and money to this achievement.", "qids": ["19", "20"], "time_seconds": 306}, {"speaker": null, "text": "The gardens have ...", "qids": [], "time_seconds": null}], "groups": [{"type": "matching", "qids": ["11", "12", "13", "14", "15", "16"], "box_title": "Croft Valley Park", "box": {}, "stems": [{"qid": "11", "prompt": "café"}, {"qid": "12", "prompt": "toilets"}, {"qid": "13", "prompt": "formal gardens"}, {"qid": "14", "prompt": "outdoor gym"}, {"qid": "15", "prompt": "skateboard ramp"}, {"qid": "16", "prompt": "wildflowers"}], "header": "Label the map below. Write the correct letter next to each question.", "image": "_assets/test6_part2_map.png"}, {"type": "choice", "qids": ["17", "18"], "prompt": "What does the speaker say about the adventure playground?", "options": {"A": "Children must be supervised.", "B": "It costs more in winter.", "C": "Some activities are only for younger children.", "D": "No payment is required.", "E": "It was recently expanded."}, "multi": true, "header": "Questions 17 and 18 Choose TWO letters, A-E."}, {"type": "choice", "qids": ["19", "20"], "prompt": "What does the speaker say about the glass houses?", "options": {"A": "They are closed at weekends.", "B": "Volunteers are needed to work there.", "C": "They were badly damaged by fire.", "D": "More money is needed to repair some of the glass.", "E": "Visitors can see palm trees from tropical regions."}, "multi": true, "header": "Questions 19 and 20 Choose TWO letters, A-E."}]}, {"part": 3, "kind": "mcq", "title": "City Bike-Sharing Schemes", "instructions": null, "audio": "audio/test6/part3.mp3", "answers": {"21": "B", "22": "C", "23": "B", "24": "C", "25": "C", "26": "F", "27": "D", "28": "E", "29": "B", "30": "A"}, "explanations": {"21": {"answer_label": "21 & 22. B & C", "quote": "Jake: ... but the costs can add up and that puts people on low incomes off in some places.\nAmy: I suppose so, but if it means more people in general are cycling rather than driving, then because they're increasing the amount of physical activity they do, it's good for their health. Jake: OK. But isn't that of less importance? I mean, doesn't the impact of reduced emissions on air pollution have a more significant effect on people's health?\nAmy: Certainly, in some cities bikesharing has made a big contribution to that. And also helped to cut the number of cars on the road significantly.\nJake: Which is the main point.\nAmy: Exactly. But I'd say it's had less of an impact on noise pollution because there are still loads of buses and lorries around.\nJake: Right.", "explain": "Câu hỏi:\n21-22. Which TWO benefits of city bike-sharing schemes do the students agree are the most important?\nA\treducing noise pollution\nB\treducing traffic congestion\nC improving air quality\nD encouraging health and fitness\nE making cycling affordable\nGiải thích đáp án:\nTất cả các lựa chọn đều được nhắc đến trong đoạn hội thoại bên.\n•\tỞ lựa chọn A, đoạn bên chỉ ra rằng hệ thống xe đạp chia sẻ ít có sự ảnh hưởng đến ô nhiễm tiếng ồn vì xung quanh vẫn còn rất nhiều xe buýt và xe tải nên việc giảm thiểu ô nhiễm tiếng ồn không phải là một lợi ích của hệ thống xe đạp chia sẻ.\n•\tỞ lựa chọn B, đoạn bên chỉ ra rằng cả hai đều đồng ý hệ thống xe đạp chia sẻ giúp cắt giảm đáng kể số lượng ô tô trên đường. Có thể thấy việc giảm thiểu sự tắc nghẽn giao thông là một lợi ích của hệ thống xe đạp chia sẻ.\n•\tỞ lựa chọn C, đoạn bên chỉ ra rằng cả hai đều đồng ý tác động của việc giảm thiểu ô nhiễm không khí mà phương án chia sẻ xe đạp mang lại có ảnh hưởng đáng kể đến sức khỏe của con người. Có thể thấy việc cải thiện chất lượng không khí là một lợi ích của hệ thống xe đạp chia sẻ.\n•\tỞ lựa chọn D, đoạn bên chỉ ra rằng cả hai đều đồng ý rằng hệ thống xe đạp chia sẻ giúp làm tăng số lượng hoạt động thể chất, điều đó tốt cho sức khỏe của con người nhưng đó không phải là một lợi ích đáng kể.\n•\tỞ lựa chọn E, đoạn bên chỉ ra rằng với hệ thống xe đạp chia sẻ, chi phí có thể tăng lên và điều đó khiến những người có thu nhập thấp nản lòng ở một số nơi. Có thể thấy việc khiến cho việc đi xe đạp có thể chi trả được không phải là một lợi ích của hệ thống xe đạp chia sẻ.\nTừ những dữ kiện trên, ta có thể thấy B và C là đáp án đúng."}, "22": {"answer_label": "21 & 22. B & C", "quote": "Jake: ... but the costs can add up and that puts people on low incomes off in some places.\nAmy: I suppose so, but if it means more people in general are cycling rather than driving, then because they're increasing the amount of physical activity they do, it's good for their health. Jake: OK. But isn't that of less importance? I mean, doesn't the impact of reduced emissions on air pollution have a more significant effect on people's health?\nAmy: Certainly, in some cities bikesharing has made a big contribution to that. And also helped to cut the number of cars on the road significantly.\nJake: Which is the main point.\nAmy: Exactly. But I'd say it's had less of an impact on noise pollution because there are still loads of buses and lorries around.\nJake: Right.", "explain": "Câu hỏi:\n21-22. Which TWO benefits of city bike-sharing schemes do the students agree are the most important?\nA\treducing noise pollution\nB\treducing traffic congestion\nC improving air quality\nD encouraging health and fitness\nE making cycling affordable\nGiải thích đáp án:\nTất cả các lựa chọn đều được nhắc đến trong đoạn hội thoại bên.\n•\tỞ lựa chọn A, đoạn bên chỉ ra rằng hệ thống xe đạp chia sẻ ít có sự ảnh hưởng đến ô nhiễm tiếng ồn vì xung quanh vẫn còn rất nhiều xe buýt và xe tải nên việc giảm thiểu ô nhiễm tiếng ồn không phải là một lợi ích của hệ thống xe đạp chia sẻ.\n•\tỞ lựa chọn B, đoạn bên chỉ ra rằng cả hai đều đồng ý hệ thống xe đạp chia sẻ giúp cắt giảm đáng kể số lượng ô tô trên đường. Có thể thấy việc giảm thiểu sự tắc nghẽn giao thông là một lợi ích của hệ thống xe đạp chia sẻ.\n•\tỞ lựa chọn C, đoạn bên chỉ ra rằng cả hai đều đồng ý tác động của việc giảm thiểu ô nhiễm không khí mà phương án chia sẻ xe đạp mang lại có ảnh hưởng đáng kể đến sức khỏe của con người. Có thể thấy việc cải thiện chất lượng không khí là một lợi ích của hệ thống xe đạp chia sẻ.\n•\tỞ lựa chọn D, đoạn bên chỉ ra rằng cả hai đều đồng ý rằng hệ thống xe đạp chia sẻ giúp làm tăng số lượng hoạt động thể chất, điều đó tốt cho sức khỏe của con người nhưng đó không phải là một lợi ích đáng kể.\n•\tỞ lựa chọn E, đoạn bên chỉ ra rằng với hệ thống xe đạp chia sẻ, chi phí có thể tăng lên và điều đó khiến những người có thu nhập thấp nản lòng ở một số nơi. Có thể thấy việc khiến cho việc đi xe đạp có thể chi trả được không phải là một lợi ích của hệ thống xe đạp chia sẻ.\nTừ những dữ kiện trên, ta có thể thấy B và C là đáp án đúng."}, "23": {"answer_label": "23 & 24. B & C", "quote": "Jake: OK. Well, while I think it's nice to have really state-of- the art bikes with things like GPS, I wouldn't say they're absolutely necessary. Amy: But some technical things are really important - like a fully functional app - so people can make payments and book bikes easily... Jake: Good point... Some people say there shouldn't be competing companies offering separate bike-sharing schemes, but in some really big cities, competition's beneficial and anyway one company might not be able to manage the whole thing.\nAmy: Right ... Cities which have opened loads of new bike lanes at the same time as introducing bike-sharing schemes have generally been more successful - but there are examples of successful schemes where this hasn't happened ... What does matter though - is having a big publicity campaign.\nJake: Definitely. If people don't know how to use the scheme or don't understand its benefits, they won't use it. People need a lot of persuasion to stop using their cars.", "explain": "Câu hỏi:\n23-24. Which TWO things do the students think are necessary for successful bike-sharing schemes? A Bikes should have a GPS system.\nB The app should be easy to use.\nC Public awareness should be raised.\nD Only one scheme should be available.\nE There should be a large network of cycle lanes.\nGiải thích đáp án:\nTất cả các lựa chọn đều được nhắc đến trong đoạn hội thoại bên.\n•\tỞ lựa chọn A, đoạn bên chỉ ra rằng Jake nghĩ rằng mặc dù thật tuyệt khi có những chiếc xe đạp thực sự hiện đại với những thứ như GPS, nhưng anh ấy nghĩ rằng chúng không thực sự cần thiết. Có thể thấy là việc xe đạp nên có hệ thống GPS không tạo nên được một hệ thống xe đạp chia sẻ thành công.\n•\tỞ lựa chọn B, đoạn bên chỉ ra rằng cả hai đều đồng ý rằng một số thứ kỹ thuật thực sự quan trọng - như một ứng dụng đầy đủ chức năng - để mọi người có thể thanh toán và đặt xe đạp một cách dễ dàng. Có thể thấy rằng để có một hệ thống xe đạp chia sẻ thành công thì nên có một ứng dụng dễ dàng sử dụng.\n•\tỞ lựa chọn C, đoạn bên chỉ ra rằng cả hai đều đồng ý rằng nên có một chiến dịch quảng bá lớn vì nếu mọi người không biết cách sử dụng hệ thống hoặc không hiểu lợi ích của nó, họ sẽ không sử dụng nó. Có thể thấy rằng để có một hệ thống xe đạp chia sẻ thành công thì nên cần nâng cao nhận thức cộng đồng.\n•\tỞ lựa chọn D, đoạn bên chỉ ra rằng Jake cho rằng một số người nói rằng không nên có các công ty cạnh tranh cung cấp các hệ thống xe đạp chia sẻ riêng biệt, nhưng ở một số thành phố thực sự lớn, cạnh tranh có lợi và dù sao thì một công ty có thể không quản lý được toàn bộ. Có thể thấy rằng việc chỉ nên có một hệ thống xe đạp chia sẻ không tạo nên được một hệ thống xe đạp chia sẻ thành công.\n•\tỞ lựa chọn E, đoạn bên chỉ ra rằng Amy cho rằng các thành phố đã mở nhiều làn đường dành cho xe đạp mới cùng lúc với việc giới thiệu hệ thống xe đạp chia sẻ thường thành công hơn - nhưng có những ví dụ về các hệ thống thành công mà điều này đã không xảy ra. Có thể thấy rằng viêc cần có một mạng lưới lớn các làn đường dành cho xe đạp không nhất thiết cần thiết để tạo nên được một hệ thống xe đạp chia sẻ thành công.\nTừ những dữ kiện trên, ta có thể thấy B và C là đáp án đúng."}, "24": {"answer_label": "23 & 24. B & C", "quote": "Jake: OK. Well, while I think it's nice to have really state-of- the art bikes with things like GPS, I wouldn't say they're absolutely necessary. Amy: But some technical things are really important - like a fully functional app - so people can make payments and book bikes easily... Jake: Good point... Some people say there shouldn't be competing companies offering separate bike-sharing schemes, but in some really big cities, competition's beneficial and anyway one company might not be able to manage the whole thing.\nAmy: Right ... Cities which have opened loads of new bike lanes at the same time as introducing bike-sharing schemes have generally been more successful - but there are examples of successful schemes where this hasn't happened ... What does matter though - is having a big publicity campaign.\nJake: Definitely. If people don't know how to use the scheme or don't understand its benefits, they won't use it. People need a lot of persuasion to stop using their cars.", "explain": "Câu hỏi:\n23-24. Which TWO things do the students think are necessary for successful bike-sharing schemes? A Bikes should have a GPS system.\nB The app should be easy to use.\nC Public awareness should be raised.\nD Only one scheme should be available.\nE There should be a large network of cycle lanes.\nGiải thích đáp án:\nTất cả các lựa chọn đều được nhắc đến trong đoạn hội thoại bên.\n•\tỞ lựa chọn A, đoạn bên chỉ ra rằng Jake nghĩ rằng mặc dù thật tuyệt khi có những chiếc xe đạp thực sự hiện đại với những thứ như GPS, nhưng anh ấy nghĩ rằng chúng không thực sự cần thiết. Có thể thấy là việc xe đạp nên có hệ thống GPS không tạo nên được một hệ thống xe đạp chia sẻ thành công.\n•\tỞ lựa chọn B, đoạn bên chỉ ra rằng cả hai đều đồng ý rằng một số thứ kỹ thuật thực sự quan trọng - như một ứng dụng đầy đủ chức năng - để mọi người có thể thanh toán và đặt xe đạp một cách dễ dàng. Có thể thấy rằng để có một hệ thống xe đạp chia sẻ thành công thì nên có một ứng dụng dễ dàng sử dụng.\n•\tỞ lựa chọn C, đoạn bên chỉ ra rằng cả hai đều đồng ý rằng nên có một chiến dịch quảng bá lớn vì nếu mọi người không biết cách sử dụng hệ thống hoặc không hiểu lợi ích của nó, họ sẽ không sử dụng nó. Có thể thấy rằng để có một hệ thống xe đạp chia sẻ thành công thì nên cần nâng cao nhận thức cộng đồng.\n•\tỞ lựa chọn D, đoạn bên chỉ ra rằng Jake cho rằng một số người nói rằng không nên có các công ty cạnh tranh cung cấp các hệ thống xe đạp chia sẻ riêng biệt, nhưng ở một số thành phố thực sự lớn, cạnh tranh có lợi và dù sao thì một công ty có thể không quản lý được toàn bộ. Có thể thấy rằng việc chỉ nên có một hệ thống xe đạp chia sẻ không tạo nên được một hệ thống xe đạp chia sẻ thành công.\n•\tỞ lựa chọn E, đoạn bên chỉ ra rằng Amy cho rằng các thành phố đã mở nhiều làn đường dành cho xe đạp mới cùng lúc với việc giới thiệu hệ thống xe đạp chia sẻ thường thành công hơn - nhưng có những ví dụ về các hệ thống thành công mà điều này đã không xảy ra. Có thể thấy rằng viêc cần có một mạng lưới lớn các làn đường dành cho xe đạp không nhất thiết cần thiết để tạo nên được một hệ thống xe đạp chia sẻ thành công.\nTừ những dữ kiện trên, ta có thể thấy B và C là đáp án đúng."}, "25": {"answer_label": "25. C", "quote": "Jake: I suppose we should start with Amsterdam as this was one of the first cities to have a bikesharing scheme. Amy: Yes. There was already a strong culture of cycling here. In a way it's strange that there was such a demand for bike-sharing because you'd have thought most people would have used their own bikes.\nJake: And yet it's one of the best-used schemes...", "explain": "Câu hỏi:\nWhat is the speakers' opinion of the bike-sharing schemes in each of the following cities?\nOpinion of bike-sharing scheme\n\t\tA They agree it has been disappointing.\n\t\tB They think it should be cheaper.\n\t\tC They are surprised it has been so successful. \n\t\tD They agree that more investment is required. \n\t\tE They think the system has been well designed. \n\t\tF They disagree about the reasons for its success \n\t\tG They think it has expanded too quickly.\nCities\n25\tAmsterdam ………….\nGiải thích đáp án:\nĐoạn hội thoại bên chỉ ra rằng Amsterdam là một trong những thành phố đầu tiên có hệ thống xe đạp chia sẻ. Đã có một nền văn hóa đi xe đạp mạnh mẽ ở đây. Theo một cách nào đó, thật kỳ lạ khi có nhu cầu cho hệ thống xe đạp chia sẻ như vậy bởi vì bạn đã nghĩ rằng hầu hết mọi người sẽ sử dụng xe đạp của riêng họ. Và đó cũng là một trong những hệ thống xe đạp chia sẻ được sử dụng tốt nhất.\nCó thể thấy rằng ở thành phố Amsterdam, Amy và Jake rất ngạc nhiên vì hệ thống xe đạp chia sẻ ở đây đã rất thành công. Vì vậy C là đáp án đúng."}, "26": {"answer_label": "26. F", "quote": "Jake: ... Dublin's an interesting example of a success story. Amy: It must be because the public transport system's quite limited.\nJake: Not really - there's no underground, but there are trams and a good bus network. I'd say price has a lot to do with it. It's one of the cheapest schemes in Europe to join.\nAmy: But the buses are really slow - anyway the weather certainly can't be a factor!\nJake: No - definitely not.", "explain": "Câu hỏi:\nWhat is the speakers' opinion of the bike-sharing schemes in each of the following cities?\nOpinion of bike-sharing scheme\n\t\tA They agree it has been disappointing.\n\t\tB They think it should be cheaper.\n\t\tC They are surprised it has been so successful. \n\t\tD They agree that more investment is required. \n\t\tE They think the system has been well designed. \n\t\tF They disagree about the reasons for its success \n\t\tG They think it has expanded too quickly.\n26\tDublin ………………\nGiải thích đáp án:\nĐoạn hội thoại bên chỉ ra rằng Amy nói rằng hệ thống xe đạp chia sẻ ở Dublin thành công là vì hệ thống giao thông công cộng khá hạn chế. Nhưng Jake lại không đồng ý, nói rằng lý do chính liên quan đến giá cả, nó là một trong những hệ thống rẻ nhất ở Châu Âu để tham gia.\nCó thể thấy rằng với hệ thống xe đạp chia sẻ ở Dublin, Amy và Jake bất đồng quan điểm về lý do thành công của nó. Vì vậy F là đáp án đúng."}, "27": {"answer_label": "27. D", "quote": "Jake: ... The London scheme's been quite successful.\nAmy: Yes. ... The bikes are popular and the whole system is well maintained but it isn't expanding quickly enough. \nJake: Basically, not enough's been spent on increasing the number of cycle lanes. Hopefully that'll change.\nAmy: Yes...", "explain": "Câu hỏi:\nWhat is the speakers' opinion of the bike-sharing schemes in each of the following cities?\nOpinion of bike-sharing scheme\n\t\tA They agree it has been disappointing.\n\t\tB They think it should be cheaper.\n\t\tC They are surprised it has been so successful. \n\t\tD They agree that more investment is required. \n\t\tE They think the system has been well designed. \n\t\tF They disagree about the reasons for its success \n\t\tG They think it has expanded too quickly.\nCities\n27\tLondon ……………\nGiải thích đáp án:\nĐoạn hội thoại bên chỉ ra rằng Amy và Jake đồng ý rằng ở London, những chiếc xe đạp phổ biến và toàn bộ hệ thống được bảo trì tốt nhưng nó không mở rộng đủ nhanh và không đủ chi cho việc mở rộng số làn đường xe đạp.\nCó thể thấy rằng đối với hệ thống xe đạp chia sẻ ở London, Amy và Jake đều đồng ý rằng cần phải đầu tư nhiều hơn. Vì vậy D là đáp án đúng."}, "28": {"answer_label": "28. E", "quote": "Jake: Well bikesharing schemes have taken off in places like Buenos Aires.\nAmy: . They built a huge network of cycle lanes to support the introduction of the scheme there, didn't they? It attracted huge numbers of cyclists where previously there were hardly any.\nJake: An example of good planning.\nAmy: Absolutely...", "explain": "Câu hỏi:\nWhat is the speakers' opinion of the bike-sharing schemes in each of the following cities?\nOpinion of bike-sharing scheme\n\t\tA They agree it has been disappointing.\n\t\tB They think it should be cheaper.\n\t\tC They are surprised it has been so successful. \n\t\tD They agree that more investment is required. \n\t\tE They think the system has been well designed. \n\t\tF They disagree about the reasons for its success \n\t\tG They think it has expanded too quickly.\nCities\n28\tBuenos Aires ………\nGiải thích đáp án:\nĐoạn hội thoại bên chỉ ra rằng cả Jake và Amy đều đồng ý rằng hệ thống xe đạp chia sẻ ở Bueno Aires là một ví dụ điển hình cho việc lên kế hoạch tố't.\nCó thể thấy rằng đối với hệ thống xe đạp chia sẻ ở Buenos Aires, cả Jake và Amy đều nghĩ rằng hệ thống ở đây đã được thiết kế rất tốt. Vì vậy E là đáp án đúng."}, "29": {"answer_label": "29. B", "quote": "Amy: New York is a good example of how not to introduce a scheme. When they launched it, it was more than ten times the price of most other schemes. \nJake: More than it costs to take a taxi. Crazy, I think the organisers lacked vision and ambition there.\nAmy: I think so too.", "explain": "Câu hỏi:\nWhat is the speakers’ opinion of the bike-sharing schemes in each of the following cities?\nOpinion of bike-sharing scheme\n\t\tA They agree it has been disappointing.\n\t\tB They think it should be cheaper.\n\t\tC They are surprised it has been so successful. \n\t\tD They agree that more investment is required. \n\t\tE They think the system has been well designed. \n\t\tF They disagree about the reasons for its success \n\t\tG They think it has expanded too quickly.\nCities\n29 New York …………\nGiải thích đáp án:\nĐoạn hội thoại bên chỉ ra rằng Amy nói rằng New York là một ví dụ điển hình về việc không giới thiệu một hệ thống. Khi họ tung ra nó, nó đã đắt hơn gấp mười lần so với hầu hết các hệ thống khác. Và Jake cũng nói rằng nó nhiều hơn cả chi phí đi taxi.\nCó thể thấy rằng đối với hệ thống xe đạp chia sẻ ở New York, Jake và Amy đều nghĩ rằng giá cả nên rẻ hơn. Vì vậy B là đáp án đúng."}, "30": {"answer_label": "30. A", "quote": "Amy: ... Sydney would be a good example to use. I would have expected it to have grown pretty quickly here.\nJake: Yes. I can’t quite work out why it hasn’t been an instant success like some of the others. It's a shame really.", "explain": "Câu hỏi:\nWhat is the speakers’ opinion of the bike-sharing schemes in each of the following cities?\nOpinion of bike-sharing scheme\n\t\tA They agree it has been disappointing.\n\t\tB They think it should be cheaper.\n\t\tC They are surprised it has been so successful. \n\t\tD They agree that more investment is required. \n\t\tE They think the system has been well designed. \n\t\tF They disagree about the reasons for its success \n\t\tG They think it has expanded too quickly.\nCities\n  30\tSydney ............\nKeywords được paraphrase:\ndisappointing - shame\nGiải thích đáp án:\nĐoạn bên chỉ ra rằng cả Amy đã mong đợi hệ thống phát triển khá nhanh chóng ở Sydney. Và Jake cũng nói rằng anh ấy không thể tìm ra lý do tại sao nó không thành công ngay lập tức như một số' hệ thống khác. Thực sự là một điều đáng tiếc.\nCó thể thấy rằng đối với hệ thống xe đạp chia sẻ ở Sydney, cả Jake và Amy đều đồng ý rằng nó thật đáng thất vọng."}}, "script_full": [{"speaker": "JAKE", "text": "Now that we've done all the research into bike-sharing schemes in cities around the world, we need to think about how we're going to organise our report.", "qids": [], "time_seconds": null}, {"speaker": "AMY", "text": "Right. I think we should start by talking about the benefits. I mean it's great that so many cities have introduced these schemes where anyone can pick up a bike from dozens of different locations and hire it for a few hours. It makes riding a bike very convenient for people.", "qids": [], "time_seconds": null}, {"speaker": "JAKE", "text": "Yes, but the costs can add up and that puts people on low incomes off in some places.", "qids": [], "time_seconds": null}, {"speaker": "AMY", "text": "I suppose so, but if it means more people in general are cycling rather than driving, then because they're increasing the amount of physical activity they do, it's good for their health.", "qids": [], "time_seconds": null}, {"speaker": "JAKE", "text": "OK. But isn't that of less importance? I mean, doesn't the impact of reduced emissions on air pollution have a more significant effect on people's health?", "qids": ["21", "22"], "time_seconds": 85}, {"speaker": "AMY", "text": "Certainly, in some cities bike-sharing has made a big contribution to that. And also helped to cut the number of cars on the road significantly.", "qids": ["21", "22"], "time_seconds": 95}, {"speaker": "JAKE", "text": "Which is the main point.", "qids": [], "time_seconds": null}, {"speaker": "AMY", "text": "Exactly. But I'd say it's had less of an impact on noise pollution because there are still loads of buses and lorries around.", "qids": [], "time_seconds": null}, {"speaker": "JAKE", "text": "Right.", "qids": [], "time_seconds": null}, {"speaker": "AMY", "text": "Shall we quickly discuss the recommendations we're going to make?", "qids": [], "time_seconds": null}, {"speaker": "JAKE", "text": "In order to ensure bike-sharing schemes are successful?", "qids": [], "time_seconds": null}, {"speaker": "AMY", "text": "Yes.", "qids": [], "time_seconds": null}, {"speaker": "JAKE", "text": "OK. Well, while I think it's nice to have really state-of-the art bikes with things like GPS, I wouldn't say they're absolutely necessary.", "qids": [], "time_seconds": null}, {"speaker": "AMY", "text": "But some technical things are really important like a fully functional app so people can make payments and book bikes easily. Places which haven't invested in that have really struggled.", "qids": ["23", "24"], "time_seconds": 133}, {"speaker": "JAKE", "text": "Good point... Some people say there shouldn't be competing companies offering separate bike-sharing schemes, but in some really big cities, competition's beneficial and anyway one company might not be able to manage the whole thing.", "qids": [], "time_seconds": null}, {"speaker": "AMY", "text": "Right. Deciding how much to invest is a big question. Cities which have opened loads of new bike lanes at the same time as introducing bike-sharing schemes have generally been more successful - but there are examples of successful schemes where this hasn't happened. What does matter though - is having a big publicity campaign.", "qids": ["23", "24"], "time_seconds": null}, {"speaker": "JAKE", "text": "Definitely. If people don't know how to use the scheme or don't understand its benefits, they won't use it. People need a lot of persuasion to stop using their cars.", "qids": [], "time_seconds": null}, {"speaker": "AMY", "text": "Shall we look at some examples now? And say what we think is good or bad about them.", "qids": [], "time_seconds": null}, {"speaker": "JAKE", "text": "I suppose we should start with Amsterdam as this was one of the first cities to have a bike-sharing scheme.", "qids": [], "time_seconds": null}, {"speaker": "AMY", "text": "Yes. There was already a strong culture of cycling here. In a way it's strange that there was such a demand for bike-sharing because you'd have thought most people would have used their own bikes.", "qids": ["25"], "time_seconds": 159}, {"speaker": "JAKE", "text": "And yet it's one of the best-used schemes... Dublin's an interesting example of a success story.", "qids": [], "time_seconds": null}, {"speaker": "AMY", "text": "It must be because the public transport system's quite limited.", "qids": [], "time_seconds": null}, {"speaker": "JAKE", "text": "Not really there's no underground, but there are trams and a good bus network. I'd say price has a lot to do with it. It's one of the cheapest schemes in Europe to join.", "qids": ["26"], "time_seconds": 273}, {"speaker": "AMY", "text": "But the buses are really slow - anyway the weather certainly can't be a factor!", "qids": [], "time_seconds": null}, {"speaker": "JAKE", "text": "No-definitely not. The London scheme's been quite successful.", "qids": [], "time_seconds": null}, {"speaker": "AMY", "text": "Yes it's been a really good thing for the city. The bikes are popular and the whole system is well maintained but it isn't expanding quickly enough. Basically, not enough's been spent on increasing the number of cycle lanes. Hopefully that'll change.", "qids": ["27"], "time_seconds": 293}, {"speaker": "JAKE", "text": "Yes. Now what about outside Europe?", "qids": [], "time_seconds": null}, {"speaker": "AMY", "text": "Well bike-sharing schemes have taken off in places like Buenos Aires.", "qids": [], "time_seconds": null}, {"speaker": "JAKE", "text": "Mmm. They built a huge network of cycle lanes to support the introduction of the scheme there, didn't they? It attracted huge numbers of cyclists where previously there were hardly any.", "qids": ["28"], "time_seconds": 317}, {"speaker": "AMY", "text": "An example of good planning.", "qids": [], "time_seconds": null}, {"speaker": "AMY", "text": "Absolutely. New York is a good example of how not to introduce a scheme. When they launched it, it was more than ten times the price of most other schemes. More than it costs to take a taxi. Crazy. I think the organisers lacked vision and ambition there.", "qids": ["29"], "time_seconds": 330}, {"speaker": "JAKE", "text": "I think so too. Sydney would be a good example to use. I would have expected it to have grown pretty quickly here.", "qids": ["30"], "time_seconds": 348}, {"speaker": "AMY", "text": "Yes. I can't quite work out why it hasn't been an instant success like some of the others. It's a shame really.", "qids": [], "time_seconds": null}, {"speaker": "JAKE", "text": "I know. OK so now we've thought about ...", "qids": [], "time_seconds": null}], "groups": [{"type": "choice", "qids": ["21", "22"], "prompt": "Which TWO benefits of city bike-sharing schemes do the students agree are the most important?", "options": {"A": "reducing noise pollution", "B": "reducing traffic congestion", "C": "improving air quality", "D": "encouraging health and fitness", "E": "making cycling affordable"}, "multi": true, "header": "Questions 21-22 Choose TWO letters, A-E."}, {"type": "choice", "qids": ["23", "24"], "prompt": "Which TWO things do the students think are necessary for successful bike-sharing schemes?", "options": {"A": "Bikes should have a GPS system.", "B": "The app should be easy to use.", "C": "Public awareness should be raised.", "D": "Only one scheme should be available.", "E": "There should be a large network of cycle lanes."}, "multi": true, "header": "Questions 23-24 Choose TWO letters, A-E."}, {"type": "matching", "qids": ["25", "26", "27", "28", "29", "30"], "box_title": "Opinion of bike-sharing scheme", "box": {"A": "They agree it has been disappointing.", "B": "They think it should be cheaper.", "C": "They are surprised it has been so successful.", "D": "They agree that more investment is required.", "E": "They think the system has been well designed.", "F": "They disagree about the reasons for its success.", "G": "They think it has expanded too quickly."}, "stems": [{"qid": "25", "prompt": "Amsterdam"}, {"qid": "26", "prompt": "Dublin"}, {"qid": "27", "prompt": "London"}, {"qid": "28", "prompt": "Buenos Aires"}, {"qid": "29", "prompt": "New York"}, {"qid": "30", "prompt": "Sydney"}], "header": "Choose SIX answers from the box and write the correct letter, A-G, next to Questions 25-30."}]}, {"part": 4, "kind": "notes", "title": "Maple Syrup", "instructions": null, "audio": "audio/test6/part4.mp3", "answers": {"31": "golden", "32": "healthy", "33": "climate", "34": "rock(s)", "35": "diameter", "36": "tube", "37": "fire", "38": "steam", "39": "cloudy", "40": "litre / liter"}, "explanations": {"31": {"answer_label": "31. golden", "quote": "Maple syrup is a thick, golden, sweettasting liquid that can be bought in bottles or jars and poured onto food such as waffles and ice cream or used in the baking of cakes and pastries", "explain": "Câu hỏi: colour described as 31...\n  Giải thích đáp án:\nCâu hỏi yêu cầu điền một tính từ màu sắc. Siro cây phong là một chất lỏng, đặc, vàng-‘golden', có vị ngọt."}, "32": {"answer_label": "32. healthy", "quote": "It contains no preservatives or added ingredients, and it provides a healthy alternative to refined sugar", "explain": "Câu hỏi: very 32\t compared\tto refined sugar\n  Giải thích đáp án:\nCâu hỏi yêu cầu điền một tính từ. Nó không chứa chất bảo quản hoặc các thành phần bổ sung, và nó cung cấp một giải pháp thay thế lành mạnh-‘healthy' cho đường tinh luyện"}, "33": {"answer_label": "33. climate", "quote": "There are only certain parts of the world that provide all these conditions: one is Canada, and by that, I mean all parts of Canada, and the other is the northeastern states of North America. In these areas, the climate suits the trees perfectly", "explain": "Câu hỏi: best growing conditions and 33 \t are\tin\nCanada and North America\nKeywords được paraphrase:\nThese areas - Canada and North America\nsuits perfectly - best growing conditions\n  Giải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Ở những khu vực này, khí hậu- ‘climate' rất thích hợp với cây phong"}, "34": {"answer_label": "34.rock", "quote": "As they were unable to keep the liquid for any length of time - they didn't have storage facilities in those days - they boiled the liquid by placing pieces of rock that had become scorching hot from the sun into the sap", "explain": "Câu hỏi: used hot 34\tto heat the sap\nKeywords được paraphrase:\nScorching hot - hot\n  Giải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. họ đun sôi chất lỏng bằng cách đặt những mảnh đá-‘rock’ đã trở nên nóng như thiêu đốt từ mặt trời vào nhựa cây"}, "35": {"answer_label": "35. diameter", "quote": "the trees have to be well looked after and they cannot be used to make syrup until the trunks reach a diameter of around 25 centimetres. This can take anything up to 40 years", "explain": "Câu hỏi: Tree trunks may not have the correct 35 \tuntil\tthey have been growing for 40 years\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. cây phải được chăm sóc cẩn thận và không thể sử dụng chúng để làm siro cho đến khi thân cây đạt đường kính-‘diameter’ khoảng 25 cm. Quá trình này có thể mất đến 40 năm"}, "36": {"answer_label": "36. tube", "quote": "When the tree is ready, it can be tapped and this involves drilling a small hole into the trunk and inserting a tube into it that ends in a bucket", "explain": "Câu hỏi: A tap drilled into the trunk and a 36\t\ncarries the sap into a bucket\nKeywords được paraphrase:\nit can be tapped and this involves drilling a small hole into the trunk - tap drilled into the trunk\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Khi cây đã sẵn sàng, nó sẽ bị đục một lỗ ở thân cây và đưa một cái ống-‘tube’ vào đó và kết thúc bằng cái xô"}, "37": {"answer_label": "37. fire", "quote": "here are basically extremely large pans - the sap is poured into these, a fire is built and the pans are then heated until the sap boils", "explain": "Câu hỏi: Large pans of sap called evaporators are heated by means of a 37...\nKeywords được paraphrase:\nLarge pans of sap - extremely large pans - the sap is poured into these\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. ở đây về cơ bản là những chiếc chảo cực lớn - nhựa cây được đổ vào những chiếc chảo này, đốt lửa- ‘fire’ và sau đó đun nóng chảo cho đến khi nhựa cây sôi lên"}, "38": {"answer_label": "38. steam", "quote": "The evaporation process creates large quantities of steam", "explain": "Câu hỏi: A lot of 38\tis\tproduced during the\nevaporation process\nKeywords được paraphrase:\nLarge quantities - A lot of\nCreates - produced\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Sự bay hơi tạo ra một lượng lớn hơi nước-‘steam'"}, "39": {"answer_label": "39. cloudy", "quote": "‘sugar sand' has to be filtered out as this builds up during the boiling and gives the syrup a cloudy appearance", "explain": "Câu hỏi: ‘Sugar sand' is removed because it makes the syrup look 39\tand\taffects the taste\nKeywords được paraphrase:\nFiltered out - removed\nAppearance - look\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. \"Đường cát\" phải được lọc ra vì chất này tích tụ trong quá trình đun sôi và làm cho xi-rô có màu đục- ‘cloudy'"}, "40": {"answer_label": "40. litre", "quote": "It takes 40 litres of sap to produce one litre of maple syrup so you can get an idea of how much is needed", "explain": "Câu hỏi: A huge quantity of sap is needed to make a 40 \t of\tmaple syrup\nKeywords được paraphrase:\nA huge quantity - 40 liters\nMake - produce\none - a\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Cần 40 lít nhựa cây để tạo ra một lít-‘litre' xi-rô cây phong, vì vậy bạn có thể biết cần bao nhiêu"}}, "script_full": [{"speaker": null, "text": "Hello everyone. Today we're going to look at another natural food product and that's maple syrup. What is this exactly? Well, maple syrup looks rather like clear honey, but it's not made by bees; it's produced from the plant fluid or sap - inside the maple tree and that makes maple syrup a very natural product. Maple syrup is a thick, golden, sweet-tasting liquid that can be bought in bottles or jars and poured onto food such as waffles and ice cream or used in the baking of cakes and pastries. It contains no preservatives or added ingredients, and it provides a healthy alternative to refined sugar.", "qids": ["31", "32"], "time_seconds": 70}, {"speaker": null, "text": "Let's just talk a bit about the maple tree itself, which is where maple syrup comes from. So, there are many species of maple tree, and they'll grow without fertilizer in areas where there's plenty of moisture in the soil. However, they'll only do this if another important criterion is fulfilled, which is that they must have full or partial sun exposure during the day and very cool nights and I'll talk more about that in a minute. There are only certain parts of the world that provide all these conditions: one is Canada, and by that, I mean all parts of Canada, and the other is the north-eastern states of North America. In these areas, the climate suits the trees perfectly. In fact, Canada produces over two-thirds of the world's maple syrup, which is why the five-pointed maple leaf is a Canadian symbol and has featured on the flag since 1964.", "qids": ["33", "34"], "time_seconds": 122}, {"speaker": null, "text": "So how did maple syrup production begin? Well, long before Europeans settled in these parts of the world, the indigenous communities had started producing maple sugar. They bored holes in the trunks of maple trees and used containers made of tree bark to collect the liquid sap as it poured out. As they were unable to keep the liquid for any length of time - they didn't have storage facilities in those days - they boiled the liquid by placing pieces of rock that had become scorching hot from the sun into the sap. They did this until it turned into sugar, and they were then able to use this to sweeten their food and drinks. Since that time, improvements have been made to the process, but it has changed very little overall.", "qids": ["35"], "time_seconds": 198}, {"speaker": null, "text": "So let's look at the production of maple syrup today. Clearly, the maple forests are a valuable resource in many Canadian and North American communities. The trees have to be well looked after and they cannot be used to make syrup until the trunks reach a diameter of around 25 centimetres. This can take anything up to 40 years. As I've already mentioned, maple trees need the right conditions to grow and also to produce sap. Why is this? Well, what happens is that during a cold night, the tree absorbs water from the soil, and that rises through the tree's vascular system. But then in the warmer daytime, the change in temperature causes the water to be pushed back down to the bottom of the tree. This continual movement - up and down - leads to the formation of the sap needed for maple syrup production.", "qids": ["36", "37"], "time_seconds": 261}, {"speaker": null, "text": "When the tree is ready, it can be tapped and this involves drilling a small hole into the trunk and inserting a tube into it that ends in a bucket. The trees can often take several taps, though the workers take care not to cause any damage to the healthy growth of the tree itself.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "The sap that comes out of the trees consists of 98 percent water and 2 percent sugar and other nutrients. It has to be boiled so that much of that water evaporates, and this process has to take place immediately, using what are called evaporators. These are basically extremely large pans - the sap is poured into these, a fire is built and the pans are then heated until the sap boils. As it does this, the water evaporates, and the syrup begins to form. The evaporation process creates large quantities of steam, and the sap becomes thicker and denser, and, at just the right moment, when the sap is thick enough to be called maple syrup, the worker removes it from the heat. After this process, something called 'sugar sand' has to be filtered out as this builds up during the boiling and gives the syrup a cloudy appearance and a slightly gritty taste. Once this has been done, the syrup is ready to be packaged so that it can be used for a whole variety of products. It takes 40 litres of sap to produce one litre of maple syrup so you can get an idea of how much is needed!", "qids": ["38", "39", "40"], "time_seconds": 359}, {"speaker": null, "text": "So that's the basic process. In places like Quebec where ...", "qids": [], "time_seconds": null}], "notes": ["Maple syrup", "What is maple syrup?", "●   made from the sap of the maple tree", "●   added to food or used in cooking", "●   colour described as {{31}}", "●   very {{32}} compared to refined sugar", "- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -", "The maple tree", "●   has many species", "●   needs sunny days and cool nights", "●   maple leaf has been on the Canadian flag since 1964", "●   needs moist soil but does not need fertiliser as well", "●   best growing conditions and {{33}} are in Canada and North America", "- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -", "Early maple sugar producers", "●   made holes in the tree trunks", "●   used hot {{34}} to heat the sap", "●   used tree bark to make containers for collection", "●   sweetened food and drink with sugar", "- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -", "Today’s maple syrup", "The trees", "●   Tree trunks may not have the correct {{35}} until they have been growing for 40 years.", "●   The changing temperature and movement of water within the tree produces the sap.", "The production", "●   A tap drilled into the trunk and a {{36}} carries the sap into a bucket.", "●   Large pans of sap called evaporators are heated by means of a {{37}} .", "●   A lot of {{38}} is produced during the evaporation process.", "●   ‘Sugar sand’ is removed because it makes the syrup look {{39}} and affects the taste.", "●   The syrup is ready for use.", "●   A huge quantity of sap is needed to make a {{40}} of maple syrup."]}]};
