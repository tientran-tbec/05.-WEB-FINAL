<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test 8 &ndash; IELTS Listening Practice</title>
<style>
:root{
  --bg:#eef1f7; --panel:#ffffff; --ink:#1b2540; --muted:#66708a; --line:#e3e7f0;
  --navy:#122a52; --navy-2:#1c3f74; --brand:#1c3f74; --brand-ink:#ffffff;
  --good:#128a4e; --bad:#d64545; --good-bg:#e9f9f1; --bad-bg:#fdecec;
  --accent-bg:#eef2fb; --gold:#c9a24b; --radius:14px;
  --shadow:0 1px 3px rgba(18,42,82,.06), 0 10px 24px -14px rgba(18,42,82,.18);
}
*{box-sizing:border-box;}
body{margin:0;background:linear-gradient(180deg,#e7ebf5 0%,#eef1f7 320px);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.wrap{max-width:940px;margin:0 auto;padding:28px 16px 80px;}
header.top{padding:6px 4px 22px;text-align:center;}
header.top .kicker{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.14em;color:var(--gold);background:var(--navy);padding:5px 14px;border-radius:999px;margin-bottom:14px;}
header.top h1{font-size:26px;margin:0 0 8px;letter-spacing:.01em;color:var(--navy);font-weight:800;}
header.top p{margin:0;color:var(--muted);font-size:13.5px;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:22px 0;position:sticky;top:10px;z-index:5;}
.tab-btn{border:1px solid var(--line);background:var(--panel);color:var(--navy);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;box-shadow:var(--shadow);}
.tab-btn:hover{border-color:var(--navy-2);}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.tab-btn .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin-right:7px;vertical-align:middle;}
.tab-btn.done .dot{background:var(--gold);}
.part{display:none;}
.part.active{display:block;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:0 0 22px;margin-bottom:20px;box-shadow:var(--shadow);overflow:hidden;}
.part-bar{background:linear-gradient(90deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:15px 24px;font-weight:800;font-size:15.5px;letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.part-bar .title{font-weight:600;opacity:.92;font-size:13.5px;}
.card-body{padding:20px 24px 0;}
.card .instructions{color:var(--muted);font-size:13.5px;margin-bottom:14px;font-style:italic;}
.audio-box{display:flex;align-items:center;gap:12px;background:var(--accent-bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:4px 0 16px;}
.audio-box .icon{font-size:18px;}
.audio-box .label{font-size:12.5px;font-weight:700;color:var(--navy);white-space:nowrap;}
audio{width:100%;height:36px;}
.qgroup{margin:18px 0;}
.qgroup .header-note{font-size:12.5px;color:var(--navy-2);font-weight:800;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em;}
.qgroup .prompt{font-weight:600;margin-bottom:8px;}
.opt-list{display:flex;flex-direction:column;gap:6px;margin-bottom:2px;}
.opt{display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border-radius:9px;border:1px solid var(--line);cursor:pointer;}
.opt:hover{background:var(--accent-bg);border-color:var(--navy-2);}
.opt input{margin-top:3px;}
.opt.correct{background:var(--good-bg);border-color:var(--good);}
.opt.incorrect{background:var(--bad-bg);border-color:var(--bad);}
.opt:has(input:disabled){opacity:.45;cursor:not-allowed;}
.opt input:disabled{cursor:not-allowed;}
.notes-block{white-space:pre-wrap;line-height:2.2;}
.notes-block .subhead{display:block;font-weight:800;margin:16px 0 4px;color:var(--navy);font-size:14.5px;}
.notes-block .bullet{display:block;margin-left:14px;}
.blank{display:inline-block;border:none;border-bottom:2px solid var(--navy-2);background:var(--accent-bg);border-radius:5px 5px 0 0;padding:3px 8px;font:inherit;font-weight:700;min-width:120px;text-align:center;color:var(--ink);}
.blank:focus{outline:none;background:#e4eaf9;}
.blank.correct{border-color:var(--good);background:var(--good-bg);}
.blank.incorrect{border-color:var(--bad);background:var(--bad-bg);}
.blank-num{font-size:11px;color:var(--gold);font-weight:800;vertical-align:super;margin-right:2px;}
.actions{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap;}
button.primary{background:var(--navy);color:#fff;border:none;padding:12px 24px;border-radius:9px;font-size:14.5px;font-weight:700;cursor:pointer;box-shadow:0 6px 14px -6px rgba(18,42,82,.5);}
button.primary:hover{background:var(--navy-2);}
button.ghost{background:#fff;border:1px solid var(--line);color:var(--navy);padding:11px 18px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;}
button.ghost:hover{border-color:var(--navy-2);color:var(--navy-2);}
.score-pill{font-weight:800;padding:9px 18px;border-radius:999px;background:var(--navy);color:#fff;font-size:14px;}
.toggle-section{display:none;margin-top:16px;border-top:1px dashed var(--line);padding-top:16px;}
.toggle-section.open{display:block;}
.script-text{font-size:14.5px;background:#f7f8fc;border:1px solid var(--line);border-radius:10px;padding:14px 16px;max-height:560px;overflow-y:auto;}
.script-line{margin:0 0 10px;line-height:1.65;}
.script-line .spk{font-weight:800;color:var(--navy);margin-right:4px;}
.script-line mark.hl{background:#fdf1d0;border-radius:4px;padding:1px 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
.script-line .qtag{display:inline-block;font-weight:800;color:var(--navy);font-size:11px;background:#e8edf8;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle;}
.jump-btn{display:inline-block;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:700;color:#fff;background:var(--navy-2);border:none;border-radius:6px;padding:3px 8px;margin-right:8px;cursor:pointer;vertical-align:middle;}
.jump-btn:hover{background:var(--navy);}
.expl-item{border-top:1px solid var(--line);padding:14px 0;}
.expl-item:first-child{border-top:none;}
.expl-item .eq-head{display:flex;gap:10px;align-items:center;margin-bottom:6px;}
.expl-item .qnum{background:var(--navy);color:#fff;font-weight:800;font-size:12px;border-radius:6px;padding:3px 9px;}
.expl-item .ans{font-weight:800;color:var(--good);}
.expl-item .quote{font-style:italic;color:var(--muted);font-size:13.5px;margin:4px 0 6px;white-space:pre-wrap;}
.expl-item .explain{font-size:14px;white-space:pre-wrap;}
.example-line{color:var(--muted);font-style:italic;}
.script-note{font-size:12.5px;color:var(--muted);margin:0 0 10px;}
footer.credit{color:var(--muted);font-size:12px;text-align:center;margin-top:26px;}
.box-panel{background:var(--accent-bg);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px;}
.box-panel .box-title{font-weight:800;color:var(--navy);margin-bottom:8px;font-size:13.5px;}
.box-panel .box-item{display:flex;gap:8px;margin:4px 0;font-size:14px;}
.box-panel .box-item b{color:var(--navy-2);min-width:18px;}
.map-img{max-width:100%;border-radius:10px;border:1px solid var(--line);margin-bottom:14px;display:block;}
.stem-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);}
.stem-row:last-child{border-bottom:none;}
.stem-row .stem-text{flex:1;}
.stem-row select{padding:7px 10px;border-radius:8px;border:1px solid var(--line);font:inherit;font-weight:700;min-width:70px;background:#fff;}
.stem-row select.correct{border-color:var(--good);background:var(--good-bg);}
.stem-row select.incorrect{border-color:var(--bad);background:var(--bad-bg);}
@media(max-width:520px){.wrap{padding:18px 10px 60px;}.card-body{padding:16px 16px 0;}.part-bar{padding:13px 16px;}}
</style>
</head>

<script>
const TEST_DATA = {"test": "Test 8", "parts": [{"part": 1, "kind": "notes", "title": "Holiday Rental (Granary Cottage)", "instructions": null, "audio": "audio/test8/part1.mp3", "answers": {"1": "28th", "2": "550", "3": "Chervil", "4": "garage", "5": "garden", "6": "parking", "7": "wood", "8": "bridge", "9": "monument", "10": "March"}, "explanations": {"1": {"answer_label": "1.28th", "quote": "Shirley: What date did you have in mind? Tom: The week beginning the 14th , if possible.\nShirley: I'll just check ... I'm sorry, Tom, it's already booked that week. It's free the week beginning the 28th , though, for seven nights. In fact, that's the only time you could have it in May.", "explain": "Câu hỏi:\nWrite ONE WORD AND/OR A NUMBER for each answer.\nGranary Cottage\nAvailable for week beginning 1 ... May\nGiải thích đáp án:\nCâu hỏi yêu cầu điền ngày. Đoạn hội thoại bên chỉ ra rằng Tom muốn thuê nhà vào tuần bắt đầu từ ngày 14 của tháng 5, nhưng Shirley thông báo rằng khoảng thời gian đó đã được đặt chỗ hết, và chỉ có tuần từ ngày 28th là còn trống."}, "28": {"answer_label": "1.28th", "quote": "Shirley: What date did you have in mind? Tom: The week beginning the 14th , if possible.\nShirley: I'll just check ... I'm sorry, Tom, it's already booked that week. It's free the week beginning the 28th , though, for seven nights. In fact, that's the only time you could have it in May.", "explain": "Câu hỏi:\nWrite ONE WORD AND/OR A NUMBER for each answer.\nGranary Cottage\nAvailable for week beginning 1 ... May\nGiải thích đáp án:\nCâu hỏi yêu cầu điền ngày. Đoạn hội thoại bên chỉ ra rằng Tom muốn thuê nhà vào tuần bắt đầu từ ngày 14 của tháng 5, nhưng Shirley thông báo rằng khoảng thời gian đó đã được đặt chỗ hết, và chỉ có tuần từ ngày 28th là còn trống."}, "2": {"answer_label": "2. 550", "quote": "Shirley: That's the beginning of high season, so it'd be £550 for the week.", "explain": "Câu hỏi:\nGranary Cottage\nCost for the week: 2 £ \t\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một số tiền. Câu bên chỉ ra rằng vì là bắt đầu mùa cao điểm nên giá thuê sẽ là £550 cho cả tuần."}, "550": {"answer_label": "2. 550", "quote": "Shirley: That's the beginning of high season, so it'd be £550 for the week.", "explain": "Câu hỏi:\nGranary Cottage\nCost for the week: 2 £ \t\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một số tiền. Câu bên chỉ ra rằng vì là bắt đầu mùa cao điểm nên giá thuê sẽ là £550 cho cả tuần."}, "3": {"answer_label": "3. Chervil", "quote": "Shirley: Well, we've just finished converting another building into a cottage, which we're calling Chervil Cottage.\nTom: Sorry? What was that again> Shirley: Chervil. C-H- E-R-V for Victor I-L", "explain": "Câu hỏi:\n3\t Cottage\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ, cụ thể là một tên gọi. Câu bên chỉ ra rằng việc chuyển đổi một tòa nhà khác thành một ngôi nhà nhỏ vừa mới được hoàn thành, được gọi là Chervil Cottage."}, "4": {"answer_label": "4. garage", "quote": "Shirley: ... The building was built as a garage. It's a little smaller than Granary Cottage.", "explain": "Câu hỏi:\nChervil Cottage\nBuilding was originally a 4 \t\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Câu bên chỉ ra rằng tòa nhà được xây dựng như một nhà để xe – a 'garage'. Nó nhỏ hơn một chút so với Granary Cottage."}, "5": {"answer_label": "5. garden", "quote": "Tom: Does it have a garden?\nShirley: Yes, you get to it from the living room through French doors ...", "explain": "Câu hỏi:\nChervil Cottage\nwalk through doors from living room into a 5 ...\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Đoạn hội thoại bên chỉ ra rằng Shirley hướng dẫn Tom đi đến một khu vườn - a 'garden' ở trong Chervil Cottage bằng cách đi từ phòng khách và bang qua các cánh cửa."}, "6": {"answer_label": "6. parking", "quote": "Shirley: The front door opens onto the old farmyard, and parking isn't a problem - there's plenty of room at the front for that.", "explain": "Câu hỏi:\nChervil Cottage\nseveral 6 \t spaces at the front\nKeywords được paraphrase:\nseveral spaces - plenty of room\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Câu bên chỉ ra rằng cửa chính dẫn ra một sân trại cũ và chỗ đậu xe - 'parking' không thành vấn đề - phía trước có rất nhiều chỗ cho việc đó."}, "7": {"answer_label": "7. wood", "quote": "Shirley: There's central heating, and if you want to light a fire, there's a stove. We can provide all the wood you need for it.", "explain": "Câu hỏi:\nChervil Cottage\nCentral heating and stove that burns 7\t\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Câu bên chỉ ra rằng có hệ thống sưởi trung tâm và nếu bạn muốn đốt lửa, đã có bếp lò. Và họ có thể cung cấp tất cả các loại gỗ - 'wood' cần để cho vào đó."}, "8": {"answer_label": "8. bridge", "quote": "Shirley: There are some attractive views from the cottage, which I haven't mentioned. There's a famous stone bridge - it's one of the oldest in the region, and you can see it from the living room.", "explain": "Câu hỏi:\nChervil Cottage views of old 8\tfrom living room.\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Câu bên chỉ ra rằng có một số quang cảnh thu hút nhìn từ ngôi nhà. Có một cây cầu - 'bridge' đá nổi tiếng - nó là một trong những cây cầu lâu đời nhất trong vùng và bạn có thể nhìn thấy nó từ phòng khách."}, "9": {"answer_label": "9. monument", "quote": "Shirley: The bedroom window looks in the opposite direction, and has a lovely view of the hills and the monument at the top.", "explain": "Câu hỏi:\nChervil Cottage\nview of hilltop 9\tfrom the bedroom.\nGiải thích đáp án:\nCâu hỏi yêu cầu điền danh từ. Câu bên chỉ ra rằng cửa sổ phòng ngủ nhìn về hướng đối diện và có tầm nhìn tuyệt đẹp ra những ngọn đồi và đài tưởng niệm - ‘monument’ ở trên đỉnh."}, "10": {"answer_label": "10. March", "quote": "Tom: And when would you like the rest of the money?\nShirley: You’re coming in May, so the last day of March, please.", "explain": "Câu hỏi:\nPayment\ndeadline for final payment: end of 10 \t\nGiải thích đáp án:\nCâu hỏi yêu cầu điền tên một tháng. Đoạn hội thoại bên chỉ ra rằng hạn cuối để tra hết số tiền còn lại là ngày cuối cùng của tháng 3 - ‘March’."}}, "script_full": [{"speaker": "SHIRLEY", "text": "Hello?", "qids": [], "time_seconds": null}, {"speaker": "TOM", "text": "Oh hello, I was hoping to speak to Jack Fitzgerald about renting a cottage.", "qids": [], "time_seconds": null}, {"speaker": "SHIRLEY", "text": "I'm his wife, Shirley, and we own the cottages together, so I'm sure I can help you.", "qids": [], "time_seconds": null}, {"speaker": "TOM", "text": "Great. My name's Tom. Some friends of ours rented Granary Cottage from you last year, and they thought it was great. So my wife and I are hoping to come in May for a week.", "qids": [], "time_seconds": null}, {"speaker": "SHIRLEY", "text": "What date did you have in mind?", "qids": [], "time_seconds": null}, {"speaker": "TOM", "text": "The week beginning the 14th, if possible.", "qids": [], "time_seconds": null}, {"speaker": "SHIRLEY", "text": "I'll just check ... I'm sorry, Tom, it's already booked that week. It's free the week beginning the 28th, though, for seven nights. In fact, that's the only time you could have it in May.", "qids": ["1"], "time_seconds": 118}, {"speaker": "TOM", "text": "Oh. Well, we could manage that, I think. We'd just need to change a couple of things. How much would it cost?", "qids": [], "time_seconds": null}, {"speaker": "SHIRLEY", "text": "That's the beginning of high season, so it'd be £550 for the week.", "qids": ["2"], "time_seconds": 142}, {"speaker": "TOM", "text": "Ah. That's a bit more than we wanted to pay, I'm afraid. We've budgeted up to £500 for accommodation.", "qids": [], "time_seconds": null}, {"speaker": "SHIRLEY", "text": "Well, we've just finished converting another building into a cottage, which we're calling Chervil Cottage.", "qids": [], "time_seconds": null}, {"speaker": "TOM", "text": "Sorry? What was that again?", "qids": [], "time_seconds": null}, {"speaker": "SHIRLEY", "text": "Chervil. C-H-E-R-V for Victor I-L.", "qids": ["3"], "time_seconds": 168}, {"speaker": "TOM", "text": "Oh, that's a herb, isn't it?", "qids": [], "time_seconds": null}, {"speaker": "SHIRLEY", "text": "That's right. It grows fairly wild around here. You could have that for the week you want for £480.", "qids": ["4"], "time_seconds": 179}, {"speaker": "TOM", "text": "OK. So could you tell me something about it, please?", "qids": [], "time_seconds": null}, {"speaker": "SHIRLEY", "text": "Of course. The building was built as a garage. It's a little smaller than Granary Cottage.", "qids": [], "time_seconds": null}, {"speaker": "TOM", "text": "So that must sleep two people, as well?", "qids": [], "time_seconds": null}, {"speaker": "SHIRLEY", "text": "That's right. There's a double bedroom.", "qids": ["5"], "time_seconds": 202}, {"speaker": "TOM", "text": "Does it have a garden?", "qids": [], "time_seconds": null}, {"speaker": "SHIRLEY", "text": "Yes, you get to it from the living room through French doors, and we provide two deckchairs. We hope to build a patio in the near future, but I wouldn't like to guarantee it'll be finished by May.", "qids": [], "time_seconds": null}, {"speaker": "TOM", "text": "OK.", "qids": [], "time_seconds": null}, {"speaker": "SHIRLEY", "text": "The front door opens onto the old farmyard, and parking isn't a problem - there's plenty of room at the front for that. There are some trees and potted plants there.", "qids": ["6"], "time_seconds": 220}, {"speaker": "TOM", "text": "What about facilities in the cottage? It has standard things like a cooker and fridge, I presume.", "qids": [], "time_seconds": null}, {"speaker": "SHIRLEY", "text": "In the kitchen area there's a fridge-freezer and we've just put in an electric cooker.", "qids": [], "time_seconds": null}, {"speaker": "TOM", "text": "Is there a washing machine?", "qids": [], "time_seconds": null}, {"speaker": "SHIRLEY", "text": "Yes. There's also a TV in the living room, which plays DVDs too. The bathroom is too small for a bath, so there's a shower instead. I think a lot of people prefer that nowadays, anyway.", "qids": [], "time_seconds": null}, {"speaker": "TOM", "text": "It's more environmentally friendly, isn't it? Unless you spend half the day in it!", "qids": [], "time_seconds": null}, {"speaker": "SHIRLEY", "text": "Exactly.", "qids": [], "time_seconds": null}, {"speaker": "TOM", "text": "What about heating? It sometimes gets quite cool at that time of year.", "qids": [], "time_seconds": null}, {"speaker": "SHIRLEY", "text": "There's central heating, and if you want to light a fire, there's a stove. We can provide all the wood you need for it. It smells so much nicer than coal, and it makes the room very cosy - we've got one in our own house.", "qids": ["7"], "time_seconds": null}, {"speaker": "TOM", "text": "That sounds very pleasant. Perhaps we should come in the winter, to make the most of it!", "qids": [], "time_seconds": null}, {"speaker": "SHIRLEY", "text": "Yes, we find we don't want to go out when we've got the fire burning. There are some attractive views from the cottage, which I haven't mentioned. There's a famous stone bridge - it's one of the oldest in the region, and you can see it from the living room. It isn't far away. The bedroom window looks in the opposite direction, and has a lovely view of the hills and the monument at the top.", "qids": ["8", "9"], "time_seconds": 331}, {"speaker": "TOM", "text": "Well, that all sounds perfect. I'd like to book it, please. Would you want a deposit?", "qids": [], "time_seconds": null}, {"speaker": "SHIRLEY", "text": "Yes, we ask for thirty percent to secure your booking, so that'll be, um, £144.", "qids": [], "time_seconds": null}, {"speaker": "TOM", "text": "And when would you like the rest of the money?", "qids": [], "time_seconds": null}, {"speaker": "SHIRLEY", "text": "You're coming in May, so the last day of March, please.", "qids": ["10"], "time_seconds": 376}, {"speaker": "TOM", "text": "Fine.", "qids": [], "time_seconds": null}, {"speaker": "SHIRLEY", "text": "Excellent. Could I just take your details...", "qids": [], "time_seconds": null}], "notes": ["Holiday rental", "Owners’ names: Jack Fitzgerald and Shirley Fitzgerald", "Granary Cottage", "• available for week beginning {{1}} May", "• cost for the week: {{2}}", "{{3}} Cottage", "• cost for the week: £480", "• building was originally a {{4}}", "• walk through doors from living room into a {{5}}", "• several {{6}}  spaces at the front", "• bathroom has a shower", "• central heating and stove that burns {{7}}", "• views of old {{8}} from living room", "• view of hilltop {{9}} from the bedroom", "Payment", "• deposit: £144", "• deadline for final payment: end of {{10}}"]}, {"part": 2, "kind": "mcq", "title": "Reducing Staff Turnover in Hotels", "instructions": null, "audio": "audio/test8/part2.mp3", "answers": {"11": "A", "12": "A", "13": "A", "14": "C", "15": "A", "16": "C", "17": "B", "18": "C", "19": "B", "20": "A"}, "explanations": {"11": {"answer_label": "11. A", "quote": "but what they don't realise is that it's the lack of training in many hotel jobs which is a huge factor", "explain": "Câu hỏi:\nChoose the correct letter, A, B or C.\nMany hotel managers are unaware that their staff often leave because of\nA a lack of training.\nB long hours.\nC low pay\nKeywords được paraphrase:\nrealise - unaware\n  Giải thích đáp án:\nĐoạn bên chỉ ra rằng, thứ mà nhân viên không nhận ra là sự thiếu thời gian đào tạo ở những nghề liên quan đến khách sạn là một nhân tố lớn. Vậy đáp án A đúng"}, "12": {"answer_label": "12. A", "quote": "Well, having to recruit new staff all the time can be very time-consuming, and managers may have to cover some duties while waiting for new staff to arrive", "explain": "Câu hỏi:\nWhat is the impact of high staff turnover on managers?\nA an increased workload\nB low morale\nC an inability to meet targets\nKeywords được paraphrase:\nrealise - unaware\n  Giải thích đáp án:\nĐoạn bên chỉ ra rằng, việc phải tuyển dụng nhân viên mới liên tục có thể rất tốn thời gian và các nhà quản lý có thể phải thực hiện một số nhiệm vụ trong khi chờ đợi nhân viên mới đến. Vậy đáp án A đúng"}, "13": {"answer_label": "13. A", "quote": "When organising shifts, for example, make sure you never give certain staff preferential treatment. All staff should be given some choice about when they work", "explain": "Câu hỏi:\nWhat mistake should managers always avoid?\nA failing to treat staff equally\nB reorganising shifts without warning\nC neglecting to have enough staff during busy periods\nKeywords được paraphrase:\nFailing to treat staff equally - staff preferential treatment\n  Giải thích đáp án:\nĐoạn bên chỉ ra rằng, khi sắp xếp ca làm việc, nên nhớ rằng không bao giờ được ưu tiên nhân viên nào hết. Mọi nhân viên đều được sự lựa chọn về ca làm việc. Vậy đáp án A đúng"}, "14": {"answer_label": "14. C", "quote": "But they also noticed a significant increase in the amount each customer spent during their stay", "explain": "Câu hỏi:\nWhat unexpected benefit did Dunwich Hotel notice after improving staff retention rates?\nA a fall in customer complaints\nB an increase in loyalty club membership\nC a rise in spending per customer\nKeywords được paraphrase:\nrise - increase\neach customer spent - spending per customer\n  Giải thích đáp án:\nĐoạn bên chỉ ra rằng,Họ còn nhận ra rằng một sự gia tăng mạnh trong số tiền được chi ở mỗi khách khi họ ở. Vậy đáp án C đúng"}, "15": {"answer_label": "15. A", "quote": "They weren't made to feel they were partners who were contributing to the success of the business as a whole. This situation has changed. Junior staff at all levels are regularly invited to meetings where their ideas are welcomed", "explain": "Câu hỏi:\nWhich way of reducing staff turnover was used in each of the following hotels?\nWrite the correct letter, A, B or C, next to Questions 15-20.\nWays of reducing staff turnover\nA improving relationships and teamwork\nB offering incentives and financial benefits\nC providing career opportunities\nHotels\n15 The Sun Club\t\n  Giải thích đáp án:\nĐoạn bên chỉ ra rằng, Những nhân viên Junior ở mọi cấp bậc được thường xuyên được mời đến những buổi họp mặt và những ý tưởng đều được chào đón. Đáp án là câu A."}, "16": {"answer_label": "16. C", "quote": "Their first step was to introduce a scheme for recognising talent amongst their employees. The hope is that organising training for individuals with management potential will encourage them to stay with the business.", "explain": "Câu hỏi:\nWhich way of reducing staff turnover was used in each of the following hotels?\nWrite the correct letter, A, B or C, next to Questions 15-20.\nWays of reducing staff turnover\nA improving relationships and teamwork\nB offering incentives and financial benefits\nC providing career opportunities\nHotels\n16 The Portland\t\nKeywords được paraphrase:\nstay with the business - career opportunities\n  Giải thích đáp án:\nĐoạn bên chỉ ra rằng, Bước đầu tiên của họ là giới thiệu một kế hoạch công nhận tài năng giữa các nhân viên của họ. Hy vọng rằng việc tổ chức đào tạo cho các cá nhân có tiềm năng quản lý sẽ khuyến khích họ ở lại với doanh nghiệp. vậy đáp án là C"}, "17": {"answer_label": "17. B", "quote": "As a reward, they’re sent on an all- expenses-paid trip abroad every year", "explain": "Câu hỏi:\nWhich way of reducing staff turnover was used in each of the following hotels?\nWrite the correct letter, A, B or C, next to Questions 15-20.\nWays of reducing staff turnover\nA improving relationships and teamwork\nB offering incentives and financial benefits\nC providing career opportunities\nHotels\n17 Bluewater hotels\t\nKeywords được paraphrase:\nincentitives - reward\n  Giải thích đáp án:\nĐoạn bên chỉ ra rằng, Như một phần thưởng, họ sẽ được gửi đi du lịch nước ngoài được chi trả toàn bộ chi phí hàng năm. vậy đáp án là B"}, "18": {"answer_label": "18. C", "quote": "Pentlow Hotels identified that retention of junior reception staff was an issue. In order to encourage them to see that working in a hotel could be worthwhile and rewarding, with good prospects, they introduced a management programme. These staff were given additional responsibilities and the chance to work in various roles in the hotel", "explain": "Câu hỏi:\nWhich way of reducing staff turnover was used in each of the following hotels?\nWrite the correct letter, A, B or C, next to Questions 15-20.\nWays of reducing staff turnover\nA improving relationships and teamwork\nB offering incentives and financial benefits\nC providing career opportunities\nHotels\n18 Penlow hotels\t\nKeywords được paraphrase:\nThese staff were given additional responsibilities and the chance to work in various roles in the hotel - career opportunities\nGiải thích đáp án:\nĐoạn bên chỉ ra rằng, Pentlow Hotels xác định rằng việc giữ chân nhân viên lễ tân cấp dưới là một vấn đề. Để khuyến khích họ thấy rằng làm việc trong khách sạn có thể đáng giá và bổ ích, với những triển vọng tốt, họ đã giới thiệu một chương trình quản lý. Những nhân viên này được giao thêm trách nhiệm và có cơ hội làm việc với nhiều vai trò khác nhau trong khách sạn. Vậy đáp án C"}, "19": {"answer_label": "19. B", "quote": "Green Planet wanted to be seen as a caring employer. To make life easier for staff, many of whom had childcare responsibilities, the hotel began issuing vouchers to help cover the cost of childcare", "explain": "Câu hỏi:\nWhich way of reducing staff turnover was used in each of the following hotels?\nWrite the correct letter, A, B or C, next to Questions 15-20.\nWays of reducing staff turnover\nA improving relationships and teamwork\nB offering incentives and financial benefits\nC providing career opportunities\nHotels\n19 Green planet\t\nKeywords được paraphrase:\nissuing vouchers to help cover the cost of childcare – financial benefits\nGiải thích đáp án:\nĐoạn bên chỉ ra rằng, Blue Planet muốn được coi là một nhà tuyển dụng có lương tâm. Để giúp cuộc sống của nhân viên dễ dàng hơn, nhiều người trong số họ có trách nhiệm chăm sóc trẻ em, khách sạn đã bắt đầu phát hành phiếu mua hàng để giúp trang trải chi phí trông trẻ. Vậy đáp án là B"}, "20": {"answer_label": "20. A", "quote": "Louise Marsh at The Amesbury has one of the best staff retention rates in the business. Since she joined the company, she has made a huge effort to achieve this by creating a cooperative and supportive environment. For her, the staff are part of a large family where everyone is valued", "explain": "Câu hỏi:\nWhich way of reducing staff turnover was used in each of the following hotels?\nWrite the correct letter, A, B or C, next to Questions 15-20.\nWays of reducing staff turnover\nA improving relationships and teamwork\nB offering incentives and financial benefits\nC providing career opportunities\nHotels\n20 The Amesbury\t\nKeywords được paraphrase:\nthe staff are part of a large family - relationships co-operative - teamwork\nGiải thích đáp án:\nĐoạn bên chỉ ra rằng, Louise Marsh tại The Amesbury có một trong những tỷ lệ giữ chân nhân viên tốt nhất trong doanh nghiệp. Kể từ khi gia nhập công ty, cô ấy đã làm việc chăm chỉ để đạt được điều này bằng cách tạo ra một môi trường hợp tác và hỗ trợ. Đối với cô, nhân viên là một phần của một đại gia đình, nơi mọi người đều được trân trọng. Vậy đáp án là A"}}, "script_full": [{"speaker": null, "text": "As many of you here today have worked in the hotel industry for some time, I'm sure you have experienced the problem of high staff turnover in your hotels. Every hotel relies on having loyal and experienced members of staff who make sure that everything runs smoothly. If staff are constantly changing, it can make life difficult for everyone. But why do staff leave frequently in many hotels? Of course, many hotel jobs, such as cleaning, are low-skilled and are not well-paid. A lot of managers think it's this and the long hours that are the main causes of high staff turnover - but what they don't realise is that it's the lack of training in many hotel jobs which is a huge factor.", "qids": ["11", "12"], "time_seconds": 52}, {"speaker": null, "text": "So, what kind of problems does a high turnover of staff cause? Well, having to recruit new staff all the time can be very time-consuming, and managers may have to cover some duties while waiting for new staff to arrive. This means they don't have time to think about less immediate problems such as how to improve their service. When staff leave, it can also severely affect the colleagues they leave behind. It has a negative effect on remaining staff, who may start to feel that they too should be thinking about leaving.", "qids": ["13"], "time_seconds": 110}, {"speaker": null, "text": "So, what can be done to change this situation? Firstly, managers should stop making basic errors which leave their staff feeling upset and resentful. When organising shifts, for example, make sure you never give certain staff preferential treatment. All staff should be given some choice about when they work, and everyone should have to work some evening and weekend shifts. If you treat staff fairly, they'll be more likely to step in and help when extra staff are needed.", "qids": ["14"], "time_seconds": 153}, {"speaker": null, "text": "Keeping staff happy has other tangible benefits for the business. Take the Dunwich Hotel as an example. It had been experiencing a problem with staff complaints and in order to deal with this, invested in staff training and improved staff conditions. Not only did the level of complaints fall, but they also noticed a significant increase in the amount each customer spent during their stay. They have now introduced a customer loyalty scheme which is going really well.", "qids": ["15"], "time_seconds": 189}, {"speaker": null, "text": "Now I'd like to look at some ways you can reduce staff turnover in your hotels, and I'll do this by giving some examples of hotels where I've done some training recently.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "The Sun Club received feedback which showed that staff thought managers didn't value their opinions. They weren't made to feel they were partners who were contributing to the success of the business as a whole. This situation has changed. Junior staff at all levels are regularly invited to meetings where their ideas are welcomed.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "A year ago, The Portland recognised the need to invest in staff retention. Their first step was to introduce a scheme for recognising talent amongst their employees. The hope is that organising training for individuals with management potential will encourage them to stay with the business.", "qids": ["16"], "time_seconds": 312}, {"speaker": null, "text": "At Bluewater, managers decided to recognise 50 high achievers from across the company's huge hotel chain. As a reward, they're sent on an all-expenses-paid trip abroad every year. Fun is an important element in the trips, but there's also the opportunity to learn something useful. This year's trip included a visit to a brewery, where staff learned about the new beer that would be served in the hotel.", "qids": ["17"], "time_seconds": 334}, {"speaker": null, "text": "Pentlow Hotels identified that retention of junior reception staff was an issue. In order to encourage them to see that working in a hotel could be worthwhile and rewarding, with good prospects, they introduced a management programme. These staff were given additional responsibilities and the chance to work in various roles in the hotel.", "qids": ["18"], "time_seconds": 366}, {"speaker": null, "text": "Green Planet wanted to be seen as a caring employer. To make life easier for staff, many of whom had childcare responsibilities, the hotel began issuing vouchers to help cover the cost of childcare.", "qids": ["19"], "time_seconds": 391}, {"speaker": null, "text": "Louise Marsh at The Amesbury has one of the best staff retention rates in the business. Since she joined the company, she has made a huge effort to achieve this by creating a co-operative and supportive environment. For her, the staff are part of a large family where everyone is valued.", "qids": ["20"], "time_seconds": 406}, {"speaker": null, "text": "OK, now I'd like to ...", "qids": [], "time_seconds": null}], "groups": [{"type": "choice", "qids": ["11"], "prompt": "Many hotel managers are unaware that their staff often leave because of", "options": {"A": "a lack of training.", "B": "long hours.", "C": "low pay."}, "multi": false, "header": "Choose the correct letter, A, B or C."}, {"type": "choice", "qids": ["12"], "prompt": "What is the impact of high staff turnover on managers?", "options": {"A": "an increased workload", "B": "low morale", "C": "an inability to meet targets"}, "multi": false, "header": null}, {"type": "choice", "qids": ["13"], "prompt": "What mistake should managers always avoid?", "options": {"A": "failing to treat staff equally", "B": "reorganising shifts without warning", "C": "neglecting to have enough staff during busy periods"}, "multi": false, "header": null}, {"type": "choice", "qids": ["14"], "prompt": "What unexpected benefit did Dunwich Hotel notice after improving staff retention rates?", "options": {"A": "a fall in customer complaints", "B": "an increase in loyalty club membership", "C": "a rise in spending per customer"}, "multi": false, "header": null}, {"type": "matching", "qids": ["15", "16", "17", "18", "19", "20"], "box_title": "Ways of reducing staff turnover", "box": {"A": "improving relationships and teamwork", "B": "offering incentives and financial benefits", "C": "providing career opportunities"}, "stems": [{"qid": "15", "prompt": "The Sun Club"}, {"qid": "16", "prompt": "The Portland"}, {"qid": "17", "prompt": "Bluewater Hotels"}, {"qid": "18", "prompt": "Pentlow Hotels"}, {"qid": "19", "prompt": "Green Planet"}, {"qid": "20", "prompt": "The Amesbury"}], "header": null}]}, {"part": 3, "kind": "mcq", "title": "Children Doing Origami", "instructions": null, "audio": "audio/test8/part3.mp3", "answers": {"21": "B", "22": "D", "23": "D", "24": "A", "25": "C", "26": "G", "27": "F", "28": "A", "29": "B", "30": "C"}, "explanations": {"21": {"answer_label": "21", "quote": "B. following instructions", "explain": "Những đứa trẻ nghe thật kỹ và làm đúng theo những bước đã được hướng dẫn để tạo ra thành phẩm, chúng theo sát các hướng dẫn"}, "22": {"answer_label": "22", "quote": "D. learning through play", "explain": "Thông qua hoạt động xếp Origami, những đứa trẻ còn được vui chơi thông qua việc học điều mới."}, "23": {"answer_label": "23", "quote": "Sid\nD. seemed to find the activity calming", "explain": "Việc gấm origami giúp Sid bình tĩnh và tập trung hơn khi làm việc với đôi tay của cậu ấy. Có vẻ như cậu ấy cảm thấy hoạt động này yên bình."}, "24": {"answer_label": "24", "quote": "Jack\nA. demonstrated independence", "explain": "Jack tự tìm tòi khám phá mọi thứ mà không cần hỏi giáo viên, cậu ấy rất độc lập."}, "25": {"answer_label": "25", "quote": "Naomi\nC. developed a competitive attitude", "explain": "Naomi rất cạnh tranh, cô ấy muốn con chuột của mình đẹp nhất nên cô ấy đã có động lực để cố gắng hết sức."}, "26": {"answer_label": "26", "quote": "Anya\nG. seemed to find the activity easy", "explain": "Anya lại thực hiện thử thách rất nhẹ nhàng và dễ dàng mà không cần quá nhiều nỗ lực"}, "27": {"answer_label": "27", "quote": "Zara\nF. seemed confused", "explain": "Zara trông có vẻ bối rối vì không biết nên làm gì, trông như lần đầu tiên thực hiện việc này"}, "28": {"answer_label": "28", "quote": "A. make models that demonstrate the different stages.", "explain": "Lia và Seb nghĩ rằng việc chuẩn bị trước ví dụ mẫu và hướng dẫn chi tiết là ý tưởng hay."}, "29": {"answer_label": "29", "quote": "B. they may not have the necessary skills.", "explain": "Họ nghĩ các giáo viên không thoải mái với việc dùng origami vì họ không có kỹ năng trong việc này để làm mẫu cho học sinh."}, "3": {"answer_label": "TUTOR: So now I want you to discuss the lesson we’ve just been watching on the video\nand think about the ways in which origami can be a useful educational tool. Can you all work with the person sitting next to you ...\n\nSEB: I had no idea that such a simple thing like folding squares of paper to make the shape of something like a bird could be such an amazing tool. It’s made me see origami in a whole new light.\n\nLIA: I know. It was interesting to see the educational skills the children were developing by doing origami. On the video you could see them really listening hard to make sure they did all the steps in the right order (Q21/22) to make the bird.\nSEB: That’s right. In this lesson they were working individually but it would also be interesting to see if the children could work out how to make something simple without being given any direction. That would help with building teamwork as well.\nLIA: Yes, but much more of a challenge. One thing that really stood out for me was that the children were all having fun while being taught (Q21/22) something new. \nSEB: Which is a key aim of any lesson with this age group. And although these kids had no problems with folding the paper, with younger children you could do origami to help practise fine motor skills.\nLIA: Absolutely. Shall we talk about the individual children we saw on the video? I wrote all their names down and took some notes.\nSEB: Yes, I did too.\nLIA: OK, good. Let’s start with Sid.\nSEB: He was interesting because before they started doing the origami, he was being quite disruptive.\nLIA: Yes. He really benefited from having to use his hands - it helped him to settle down and start concentrating. (Q23)\nSEB: Yes, I noticed that too. What about Jack? I noticed he seemed to want to work things out for himself.\nLIA: Mmm. You could see him trying out different things rather than asking the teacher for help. (Q24) What did you make of Naomi?\nSEB: She seemed to be losing interest at one point but then she decided she wanted her mouse to be the best and that motivated her to try harder. (Q25)\nLIA: She didn't seem satisfied with hers in the end, though.\nSEB: No.\nLIA: Anya was such a star. She listened so carefully and then produced the perfect bird with very little effort. (Q26)\nSEB: Mmm - I think the teacher could have increased the level of difficulty for her.\nLIA: Maybe. I think it was the first time Zara had come across origami.\nSEB: She looked as if she didn’t really get what was going on.\nLIA: She seemed unsure about what she was supposed to do (Q27), but in the end hers didn't turn out too badly.\nSEB: Yeah. I’m sure it was a positive learning experience for her.\nLIA: Mmm.\n___________________\nLIA: I think one reason why the origami activity worked so well in this class was that the teacher was well prepared.\nSEB: Right. I think it would have taken me ages to prepare examples, showing each of the steps involved in making the bird. But that was a really good idea (Q28). The children could see what they were aiming for - and much better for them to be able to hold something, rather than just looking at pictures.\nLIA: Mmm - those physical examples supported her verbal explanations really well.\n\nSEB: It’s strange that origami isn’t used more widely. Why do you think that is?\nLIA: Well, teachers may just feel it’s not that appealing to children who are used to doing everything on computers, especially boys. Even if they’re aware of the benefits.\nSEB: Oh, I don't know. It’s no different to any other craft activity. I bet it's because so many teachers are clumsy like me (Q29).\nLIA: That's true - too much effort required if you're not good with your hands.\nSEB: Well, anyway, I think we should try it out in our maths teaching practice with Year 3 (Q30),i can see using origami is a really engaging way of reinforcing children’s knowledge of geometric shapes, like they were doing in the video, but I think it would also work really well for presenting fractions, which is coming up soon.\nLIA: Good idea - that’s something most of the kids in that class might struggle with. Origami would also be good practice for using symmetry - but I think they did that last term.\n\nSEB: OK - well let’s try and get some ideas together and plan the lesson next week.\n\nTUTOR: OK, if you could all stop ...", "quote": "TUTOR: So now I want you to discuss the lesson we’ve just been watching on the video\nand think about the ways in which origami can be a useful educational tool. Can you all work with the person sitting next to you ...\n\nSEB: I had no idea that such a simple thing like folding squares of paper to make the shape of something like a bird could be such an amazing tool. It’s made me see origami in a whole new light.\n\nLIA: I know. It was interesting to see the educational skills the children were developing by doing origami. On the video you could see them really listening hard to make sure they did all the steps in the right order (Q21/22) to make the bird.\nSEB: That’s right. In this lesson they were working individually but it would also be interesting to see if the children could work out how to make something simple without being given any direction. That would help with building teamwork as well.\nLIA: Yes, but much more of a challenge. One thing that really stood out for me was that the children were all having fun while being taught (Q21/22) something new. \nSEB: Which is a key aim of any lesson with this age group. And although these kids had no problems with folding the paper, with younger children you could do origami to help practise fine motor skills.\nLIA: Absolutely. Shall we talk about the individual children we saw on the video? I wrote all their names down and took some notes.\nSEB: Yes, I did too.\nLIA: OK, good. Let’s start with Sid.\nSEB: He was interesting because before they started doing the origami, he was being quite disruptive.\nLIA: Yes. He really benefited from having to use his hands - it helped him to settle down and start concentrating. (Q23)\nSEB: Yes, I noticed that too. What about Jack? I noticed he seemed to want to work things out for himself.\nLIA: Mmm. You could see him trying out different things rather than asking the teacher for help. (Q24) What did you make of Naomi?\nSEB: She seemed to be losing interest at one point but then she decided she wanted her mouse to be the best and that motivated her to try harder. (Q25)\nLIA: She didn't seem satisfied with hers in the end, though.\nSEB: No.\nLIA: Anya was such a star. She listened so carefully and then produced the perfect bird with very little effort. (Q26)\nSEB: Mmm - I think the teacher could have increased the level of difficulty for her.\nLIA: Maybe. I think it was the first time Zara had come across origami.\nSEB: She looked as if she didn’t really get what was going on.\nLIA: She seemed unsure about what she was supposed to do (Q27), but in the end hers didn't turn out too badly.\nSEB: Yeah. I’m sure it was a positive learning experience for her.\nLIA: Mmm.\n___________________\nLIA: I think one reason why the origami activity worked so well in this class was that the teacher was well prepared.\nSEB: Right. I think it would have taken me ages to prepare examples, showing each of the steps involved in making the bird. But that was a really good idea (Q28). The children could see what they were aiming for - and much better for them to be able to hold something, rather than just looking at pictures.\nLIA: Mmm - those physical examples supported her verbal explanations really well.\n\nSEB: It’s strange that origami isn’t used more widely. Why do you think that is?\nLIA: Well, teachers may just feel it’s not that appealing to children who are used to doing everything on computers, especially boys. Even if they’re aware of the benefits.\nSEB: Oh, I don't know. It’s no different to any other craft activity. I bet it's because so many teachers are clumsy like me (Q29).\nLIA: That's true - too much effort required if you're not good with your hands.\nSEB: Well, anyway, I think we should try it out in our maths teaching practice with Year 3 (Q30),i can see using origami is a really engaging way of reinforcing children’s knowledge of geometric shapes, like they were doing in the video, but I think it would also work really well for presenting fractions, which is coming up soon.\nLIA: Good idea - that’s something most of the kids in that class might struggle with. Origami would also be good practice for using symmetry - but I think they did that last term.\n\nSEB: OK - well let’s try and get some ideas together and plan the lesson next week.\n\nTUTOR: OK, if you could all stop ...", "explain": "GIA SƯ: Vậy, bây giờ tôi muốn các bạn thảo luận về bài học mà chúng ta vừa xem trên video\nvà suy nghĩ về những cách mà origami có thể trở thành một công cụ giáo dục hữu ích. Tất cả các bạn có thể làm việc với người ngồi bên cạnh bạn ...\nSEB: Tôi không biết rằng một việc đơn giản như gấp các hình vuông của giấy để tạo ra hình dạng của một thứ gì đó giống như một con chim lại có thể là một công cụ tuyệt vời như vậy. Nó khiến tôi nhìn origami theo một cách hoàn toàn mới.\nLIA: Tôi biết. Thật thú vị khi thấy các kỹ năng giáo dục mà trẻ em phát triển bằng cách xếp giấy origami. Trên video, bạn có thể thấy các em thực sự chăm chỉ lắng nghe để đảm bảo rằng các em đã thực hiện đúng tất cả các bước theo thứ tự (Q21/22) để làm con chim.\nSEB: Đúng vậy. Trong bài học này, các em làm việc cá nhân nhưng cũng sẽ rất thú vị để xem liệu các em có thể tìm ra cách làm một thứ gì đó đơn giản mà không cần hướng dẫn hay không. Điều đó cũng sẽ giúp xây dựng tinh thần đồng đội.\nLIA: Đúng, nhưng còn nhiều thách thức hơn thế. Một điều thực sự nổi bật đối với tôi là tất cả bọn trẻ đều vui vẻ khi được dạy (Q21/22) một điều gì đó mới mẻ.\nSEB: Đó là mục tiêu chính của bất kỳ bài học nào với nhóm tuổi này. Và mặc dù những đứa trẻ này không gặp vấn đề gì với việc gấp giấy, nhưng với những đứa trẻ nhỏ hơn, bạn có thể xếp giấy origami để giúp rèn luyện các kỹ năng vận động tinh.\nLIA: Chắc chắn rồi. Chúng ta sẽ nói về từng đứa trẻ mà chúng ta đã thấy trên video chứ? Tôi đã viết tất cả tên của họ xuống và ghi chú.\nSEB: Vâng, tôi cũng vậy.\nLIA: OK, tốt. Hãy bắt đầu với Sid.\nSEB: Cậu ấy rất thú vị vì trước khi họ bắt đầu xếp giấy origami, cậu ấy đã khá quậy phá.\nLIA: Vâng. Cậu ấy thực sự được hưởng lợi từ việc phải sử dụng đôi tay của mình - nó giúp cậu ấy ổn định và bắt đầu tập trung. (Q23)\nSEB: Vâng, tôi cũng nhận thấy điều đó. Còn Jack thì sao? Tôi nhận thấy cậu ấy dường như muốn tự mình giải quyết mọi việc.\nLIA: Ừm. Bạn có thể thấy cậu ấy đang thử những thứ khác nhau thay vì nhờ giáo viên giúp đỡ. (Q24) Bạn nghĩ gì về Naomi?\nSEB: Có lúc cô ấy dường như mất hứng thú nhưng sau đó cô ấy quyết định muốn con chuột của mình là tốt nhất và điều đó thúc đẩy cô ấy cố gắng hơn nữa. (Q25)\nLIA: Tuy nhiên, cuối cùng cô ấy có vẻ không hài lòng với cô ấy.\nSEB: Không.\nLIA: Anya thật là một ngôi sao. Cô ấy đã lắng nghe rất cẩn thận và sau đó tạo ra con chim hoàn hảo mà không tốn nhiều công sức. (Q26)\nSEB: Mmm - Tôi nghĩ giáo viên có thể tăng mức độ khó cho cô ấy.\nLIA: Có thể. Tôi nghĩ đó là lần đầu tiên Zara biết đến origami.\nSEB: Cô ấy trông như thể không thực sự hiểu chuyện gì đang xảy ra.\nLIA: Cô ấy có vẻ không chắc chắn về những gì mình phải làm (Q27), nhưng cuối cùng công việc của cô ấy cũng không tệ lắm.\nSEB: Vâng. Tôi chắc chắn rằng đó là một kinh nghiệm học tập tích cực cho cô ấy.\nLIA: Ừm.\n___________________\nLIA: Tôi nghĩ một lý do khiến hoạt động xếp giấy origami hoạt động tốt trong lớp này là do giáo viên đã chuẩn bị kỹ lưỡng.\nSEB: Đúng. Tôi nghĩ rằng tôi sẽ mất nhiều thời gian để chuẩn bị các ví dụ, chỉ ra từng bước liên quan đến việc tạo ra con chim. Nhưng đó thực sự là một ý kiến hay (Q28). Những đứa trẻ có thể nhìn thấy những gì chúng đang hướng tới - và tốt hơn nhiều là chúng có thể cầm một thứ gì đó, thay vì chỉ nhìn vào những bức tranh.\nLIA: Mmm - những ví dụ vật lý đó đã hỗ trợ rất tốt cho những lời giải thích bằng lời nói của cô ấy.\nSEB: Thật lạ là origami không được sử dụng rộng rãi hơn. Sao bạn lại nghĩ như vậy?\nLIA: Chà, giáo viên có thể cảm thấy nó không hấp dẫn lắm đối với những đứa trẻ đã quen làm mọi thứ trên máy tính, đặc biệt là các bé trai. Ngay cả khi họ nhận thức được những lợi ích.\nSEB: Ồ, tôi không biết. Nó không khác với bất kỳ hoạt động thủ công nào khác. Tôi cá là vì nhiều giáo viên cũng vụng về như tôi (Q29).\nLIA: Điều đó đúng - cần phải nỗ lực rất nhiều nếu bạn không khéo tay.\nSEB: Chà, dù sao thì, tôi nghĩ chúng ta nên thử nó trong thực tế giảng dạy toán của chúng ta với Lớp 3 (Q30), tôi có thể thấy rằng sử dụng origami là một cách thực sự hấp dẫn để củng cố kiến thức của trẻ về các hình dạng hình học, giống như chúng đã làm trong video , nhưng tôi nghĩ nó cũng sẽ hoạt động rất tốt để trình bày các phân số sắp ra mắt.\nLIA: Ý kiến hay - đó là điều mà hầu hết những đứa trẻ trong lớp đó có thể gặp khó khăn. Origami cũng sẽ là một cách thực hành tốt để sử dụng tính đối xứng - nhưng tôi nghĩ họ đã làm điều đó trong học kỳ trước.\nSEB: OK - chúng ta hãy thử và cùng nhau tìm ra một số ý tưởng và lên kế hoạch cho bài học vào tuần tới.\nGIA SƯ: OK, nếu tất cả các bạn có thể dừng lại ..."}, "30": {"answer_label": "30", "quote": "C. to introduce a new concept", "explain": "Vì origami giúp việc học hình học dễ hơn, 2 bạn muốn mang nó vào bài thuyết trình về quan niệm mới, phân số."}}, "script_full": [{"speaker": "TUTOR", "text": "So now I want you to discuss the lesson we've just been watching on the video and think about the ways in which origam onds": null}, {"speaker": "LIA", "text": "Yes. He really benefited from having to use his hands - it helped him to settle down and start concentrating.", "qids": ["23"], "time_seconds": 160}, {"speaker": "SEB", "text": "Yes, I noticed that too. What about Jack? I noticed he seemed to want to work things out for himself.", "qids": [], "time_seconds": null}, {"speaker": "LIA", "text": "Mmm. You could see him trying out different things rather than asking the teacher for help.", "qids": ["24"], "time_seconds": 176}, {"speaker": "SEB", "text": "What did you make of Naomi?", "qids": [], "time_seconds": null}, {"speaker": "LIA", "text": "She seemed to be losing interest at one point but then she decided she wanted her mouse to be the best and that motivated her to try harder.", "qids": ["25"], "time_seconds": 185}, {"speaker": "SEB", "text": "She didn't seem satisfied with hers in the end, though.", "qids": [], "time_seconds": null}, {"speaker": "LIA", "text": "No.", "qids": [], "time_seconds": null}, {"speaker": "SEB", "text": "Anya was such a star. She listened so carefully and then produced the perfect bird with very little effort.", "qids": ["26"], "time_seconds": 199}, {"speaker": "LIA", "text": "Mmm - I think the teacher could have increased the level of difficulty for her.", "qids": [], "time_seconds": null}, {"speaker": "SEB", "text": "Maybe. I think it was the first time Zara had come across origami.", "qids": [], "time_seconds": null}, {"speaker": "LIA", "text": "She looked as if she didn't really get what was going on.", "qids": ["27"], "time_seconds": 220}, {"speaker": "SEB", "text": "She seemed unsure about what she was supposed to do, but in the end hers didn't turn out too badly.", "qids": [], "time_seconds": null}, {"speaker": "LIA", "text": "Yeah. I'm sure it was a positive learning experience for her.", "qids": [], "time_seconds": null}, {"speaker": "SEB", "text": "Mmm.", "qids": [], "time_seconds": null}, {"speaker": "LIA", "text": "I think one reason why the origami activity worked so well in this class was that the teacher was well prepared.", "qids": [], "time_seconds": null}, {"speaker": "SEB", "text": "Right. I think it would have taken me ages to prepare examples, showing each of the steps involved in making the bird. But that was a really good idea. The children could see what they were aiming for - and much better for them to be able to hold something, rather than just looking at pictures.", "qids": ["28"], "time_seconds": 284}, {"speaker": "LIA", "text": "Mmm - those physical examples supported her verbal explanations really well.", "qids": [], "time_seconds": null}, {"speaker": "SEB", "text": "It's strange that origami isn't used more widely. Why do you think that is?", "qids": [], "time_seconds": null}, {"speaker": "LIA", "text": "Well, teachers may just feel it's not that appealing to children who are used to doing everything on computers, especially boys. Even if they're aware of the benefits.", "qids": ["29"], "time_seconds": 313}, {"speaker": "SEB", "text": "Oh, I don't know. It's no different to any other craft activity. I bet it's because so many teachers are clumsy like me.", "qids": [], "time_seconds": null}, {"speaker": "LIA", "text": "That's true - too much effort required if you're not good with your hands.", "qids": [], "time_seconds": null}, {"speaker": "SEB", "text": "Well, anyway, I think we should try it out in our maths teaching practice with Year 3. I can see using origami is a really engaging way of reinforcing children's knowledge of geometric shapes, like they were doing in the video, but I think it would also work really well for presenting fractions, which is coming up soon.", "qids": ["30"], "time_seconds": 336}, {"speaker": "LIA", "text": "Good idea - that's something most of the kids in that class might struggle with. Origami would also be good practice for using symmetry - but I think they did that last term.", "qids": [], "time_seconds": null}, {"speaker": "SEB", "text": "OK - well let's try and get some ideas together and plan the lesson next week.", "qids": [], "time_seconds": null}, {"speaker": "TUTOR", "text": "OK, if you could all stop ...", "qids": [], "time_seconds": null}], "groups": [{"type": "choice", "qids": ["21", "22"], "prompt": "Which TWO educational skills were shown in the video of children doing origami?", "options": {"A": "solving problems", "B": "following instructions", "C": "working cooperatively", "D": "learning through play", "E": "developing hand-eye coordination"}, "multi": true, "header": "Questions 21 and 22 Choose TWO letters, A-E."}, {"type": "matching", "qids": ["23", "24", "25", "26", "27"], "box_title": "Comments", "box": {"A": "demonstrated independence", "B": "asked for teacher support", "C": "developed a competitive attitude", "D": "seemed to find the activity calming", "E": "seemed pleased with the results", "F": "seemed confused", "G": "seemed to find the activity easy"}, "stems": [{"qid": "23", "prompt": "Sid"}, {"qid": "24", "prompt": "Jack"}, {"qid": "25", "prompt": "Naomi"}, {"qid": "26", "prompt": "Anya"}, {"qid": "27", "prompt": "Zara"}], "header": "Choose FIVE answers from the box and write the correct letter, A-G, next to Questions 23-27."}, {"type": "choice", "qids": ["28"], "prompt": "Before starting an origami activity in class, the students think it is important for the teacher to", "options": {"A": "make models that demonstrate the different stages.", "B": "check children understand the terminology involved.", "C": "tell children not to worry if they find the activity difficult."}, "multi": false, "header": "Questions 28-30 Choose the correct letter, A, B or C."}, {"type": "choice", "qids": ["29"], "prompt": "The students agree that some teachers might be unwilling to use origami in class because", "options": {"A": "they may not think that crafts are important.", "B": "they may not have the necessary skills.", "C": "they may worry that it will take up too much time."}, "multi": false, "header": null}, {"type": "choice", "qids": ["30"], "prompt": "Why do the students decide to use origami in their maths teaching practice?", "options": {"A": "to correct a particular misunderstanding", "B": "to set a challenge", "C": "to introduce a new concept"}, "multi": false, "header": null}]}, {"part": 4, "kind": "notes", "title": "Marine Renewable Energy (Ocean Energy)", "instructions": null, "audio": "audio/test8/part4.mp3", "answers": {"31": "industry", "32": "constant", "33": "direction", "34": "floor", "35": "predictable", "36": "bay", "37": "gates", "38": "fuel", "39": "jobs", "40": "migration"}, "explanations": {"31": {"answer_label": "Câu 31", "quote": "Producing enough energy to meet our needs has become a serious problem. Demand is rising rapidly, because of the world's increasing population and expanding industry.", "explain": "Câu hỏi:\nIntroduction\nMore energy required because of growth in population and 31\t\nWhat's needed:\n•\tRenewable energy sources.\n•\tMethods that won't create\npollution.\nKeywords được paraphrase:\nCâu hỏi “more energy required because of growth in population and...” (nhiều năng lượng cần hơn bởi sự tăng về dân số và.). Do đó, ta cần phải điền 1 danh từ ở đây.\nGiải thích đáp án:\nTrong bài nghe, có cụm từ “expanding industry” (mở rộng công nghiệp). Chữ “expanding” được thay thế cho chữ “growth” vì vậy đáp án là chữ “industry”."}, "32": {"answer_label": "Câu 32", "quote": "This form of energy has plenty of potential, as the source is constant, and there's no danger of waves coming to a standstill", "explain": "Câu hỏi:\nWave energy\nAdvantage:\twaves provide a 32 …………Source of renewable energy.\nElectricity can be generated using offshore systems may use reservoir.\nKeywords được paraphrase:\nCâu hỏi nói về “Advantage: waves provide a ... source of renewable energy” (lợi ích: sóng cung cấp một nguồn ... của năng lượng tái chế). Do đó, ở đây ta cần phải điền 1 tính từ để miêu tả cho nguồn năng lượng này.\nGiải thích đáp án:\nTrong bài nghe, có cụm từ “the source is constant” (nguồn này thì liên tiếp). Vì vậy, tính từ ta cần điền vào là chữ “constant”"}, "33": {"answer_label": "Câu 33", "quote": "But the problem with ocean waves is that they’re erratic, with the wind making them travel in every direction.", "explain": "Câu hỏi:\nProblem:\nWaves can move in any 33 ……………………..\nKeywords được paraphrase:\nCâu hỏi nói về “problems: waves can move in any...” (vấn đề: sóng có thể di chuyển ở bất kì ...). Do đó, ta cần phải điền 1 danh từ ở đây.\nGiải thích đáp án:\nTrong bài nghe, có cụm từ “making them travel in every direction” (khiến chúng di chuyển ở mọi hướng). Chữ “travel” được thay nghĩa cho chữ “move” trong câu hỏi, vì vậy đáp án sẽ là danh từ “direction”"}, "34": {"answer_label": "Câu 34", "quote": "Another drawback is that sand and other sediment on the ocean floor might be stopped from flowing normally, which can lead to environmental problems.", "explain": "Câu hỏi:\nMovement of sand, etc. on the 34………………of the ocean may be affected.\nKeywords được paraphrase:\nĐây là ý kiến thứ hai trong phần problems (những vấn đề) “movement of sand, on the ... of the ocean may be affected (sự di chuyển của cát, trên ... của đại dương sẽ bị ảnh hưởng). Do đó, ta cần phải điền 1 danh từ chỉ nơi chốn ở đây.\nGiải thích đáp án:\nĐầu tiên ta nghe “another drawback” (mặt hại khác) là điểm bài nghe, có cụm từ “sand...on the ocean floor” (cát ... trên bề mặt đại dương). Nhưng yêu cầu đề chỉ điền 1 danh từ duy nhất, ta chọn đáp án là “floor”"}, "35": {"answer_label": "Câu 35", "quote": "The second category of marine energy that I'll mention is tidal energy. One major advantage of using the tide, rather than waves, as a source of energy is that it's predictable: we know the exact times of high and low tides for years to come.", "explain": "Câu hỏi:\nTidal energy\nTides are more 35 \t…………………… than waves.\nKeywords được paraphrase:\nCâu hỏi nói về đặc tính của “tidal energy” (năng lượng thủy triều). Câu hỏi chứa thông tin “tides are more ... than waves” (thủy triều thì ... hơn sóng). Do đó, ta cần phải điền 1 tính từ ở đây.\nGiải thích đáp án:\nTrong bài nghe, có cụm từ “advantage of using the tide, rather than waves (lợi ích của việc sử dụng thủy triều, hơn sóng ...) giúp ta xác định vị trí câu trả lời. Sau đó, ta tiếp tục nghe “it's predictable.” (nó dê đoán). Vì vậy, đáp án ở đây là “predictable”."}, "36": {"answer_label": "Câu 36", "quote": "One current plan is to create a tidal lagoon on the coast of Wales. This will be an area of water within a bay at Swansea, sheltered by a U-shaped breakwater, or dam, built out from the coast.", "explain": "Câu hỏi:\nPlanned tidal lagoon in Wales:\nWill be created in a 36 ……………………. At Swansea.\nBreakwater (dam) containing 16 turbines.\nKeywords được paraphrase:\nCâu hỏi nằm trong phần “planned tidal lagoon in Wales” (vũng thủy triều có kế hoạch ở Wales). Thông tin cần điền nằm trong câu “will be created in a ... at Swansea” (sẽ được tạo ra ở một nơi ... tại Swansea). Do đó, ta cần phải điền 1 danh từ chỉ nơi chốn.\nGiải thích đáp án:\nTrong bài nghe, có nhắc đến tên riêng “tidal lagoon on the coast of Wales”. Sau đó ta nghe được câu “there will be an area of water within a bay at Swansea” (sẽ có một khu vực có nước nằm trong một vịnh ở Swansea). Vì vậy, đáp án là “bay” (vịnh)"}, "37": {"answer_label": "Câu 37", "quote": "Then, in order to release the stored water, gates in the breakwater are opened.", "explain": "Câu hỏi:\nStored water is released through 37……………………, driving the turbines in the reverse direction\nKeywords được paraphrase:\nCâu hỏi vẫn nằm trong phần “planned tidal lagoon in Wales” (vũng thủy triều có kế hoạch ở Wales). Thông tin cần điền nằm trong câu “stored water is released through...” (phần nước được lưu trữ sẽ được thải ra thông qua...). Do đó, ta cần phải điền 1 danh từ chỉ vật.\nGiả thích đáp án:\nTrong bài nghe, có cụm từ “in order to release the stored water” (để thải ra phần nước đã lưu trữ) giúp giúp ta xác định được vị trí câu trả lời. Sau đó, ta nghe được câu “gates in the breakwater are opened” (những cách cổng nằm ở đê chắn sóng được mở ra). Vì vậy, đáp án sẽ là “gates”, ở đây ta cần lưu ý danh từ đang ở dạng số nhiều."}, "38": {"answer_label": "Câu 38", "quote": "This system has quite a lot in its favour: unlike solar and wind energy it doesn't depend on the weather; the turbines are operated without the need for fuel, so it doesn't create any greenhouse gas emissions; and very little maintenance is needed.", "explain": "Câu hỏi:\nAdvantage:\nNot depended on weather\nNo 38 ………………. is\trequired to make it work\nLikely to create a number of 39 ……………………..\nKeywords được paraphrase:\nCâu hỏi nằm trong phần “advantages” (những lợi ích). Thông tin cần điền nằm ở câu “no ... is required to make it work” (không cần\nđến ... để hoạt động). Vì vậy, ta cần điền một danh từ số ít, hoặc danh từ không đếm được ở đây.\nGiải thích đáp án:\nTrong bài nghe, có câu “the turbines are operated without the need for fuel” (các tu-bin được hoạt động mà không cần đến nhiên liệu). Vì vậy, đáp án cần điền ở đây là “fuel” (nhiên liệu)."}, "39": {"answer_label": "Câu 39", "quote": "It's estimated that electricity generated in this way will be relatively cheap, and that manufacturing the components would create more than 2,000 jobs, a big boost to the local economy.", "explain": "Câu hỏi:\nAdvantage:\n•\t Not depended on weather.\n•    No 38 \t……….is required to make it work.\n     •    Likely to create a number of 39…………….\nKeywords được paraphrase:\nCâu hỏi vẫn nằm trong phần “advantages” (những lợi ích). Thông tin cần điền nằm ở câu “likely to create a number of ...” (có thể tạo ra nhiều ...). Vì vậy, ta cần điền một danh từ đếm được ở dạng số nhiều.\nGiải thích đáp án:\nTrong bài nghe, có cụm “would create more than 2000 jobs” (sẽ tạo ra hơn 2000 công việc). Số lượng 2000 được thay thế cho “a number of’ (nhiều) ở trong câu hỏi, vì vậy đáp án ta cần điền là “jobs” - lưu ý, giữ nguyên dạng số nhiều của danh từ này."}, "40": {"answer_label": "Câu 40", "quote": "On the other hand, there are fears that lagoons might harm both fish and birds, for example by disturbing migration (Q40) patterns, and causing a build-up of silt, affecting local ecosystems.", "explain": "Câu hỏi:\nProblem:\nMay harm fish and birds, e.g. by affecting 40 …………………… And building up silt.\nKeywords được paraphrase:\nCâu hỏi nằm trong phần “problems” (những vấn đề). Thông tin cần điền nằm ở câu “may harm fish and birds, e.g. by affecting ...” (có thể làm hại đến cá và chim, ví dụ bằng việc ảnh hưởng....). Vì vậy, ta cần điền một danh từ ở đây.\nGiải thích đáp án:\nTa nghe rõ cụm “might harm fish and birds” (có thể làm hại cá và chim) và dễ dàng xác định vị trí câu trả lời nằm ngay sau đó. Tiếp theo, ta nghe cụm “disturbing migration patterns” (xáo trộn mô hình di cư). Ở đây, chữ “disturbing” gần nghĩa với với chữ “affecting”, vì vậy đáp án sẽ là danh từ “migration”."}}, "script_full": [{"speaker": null, "text": "Producing enough energy to meet our needs has become a serious problem. Demand is rising rapidly, because of the world's increasing population and expanding industry. Burning fossil fuels, like gas, coal and oil, seriously damages the environment and they'll eventually run out.", "qids": ["31"], "time_seconds": 76}, {"speaker": null, "text": "For a number of years now, scientists have been working out how we can derive energy from renewable sources, such as the sun and wind, without causing pollution. Today I'll outline marine renewable energy - also called ocean energy - which harnesses the movement of the oceans.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "Marine renewable energy can be divided into three main categories: wave energy, tidal energy and ocean thermal energy conversion, and I'll say a few words about each one.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "First, wave energy. Numerous devices have been invented to harvest wave energy, with names such as Wave Dragon, the Penguin and Mighty Whale, and research is going on to try and come up with a really efficient method. This form of energy has plenty of potential, as the source is constant, and there's no danger of waves coming to a standstill. Electricity can be generated using onshore systems, using a reservoir, or offshore systems. But the problem with ocean waves is that they're erratic, with the wind making them travel in every direction, This adds to the difficulty of creating efficient technology: ideally all the waves would travel smoothly and regularly along the same straight line. Another drawback is that sand and other sediment on the ocean floor might be stopped from flowing normally, which can lead to environmental problems.  [Q32", "qids": ["32", "33", "34"], "time_seconds": 138}, {"speaker": null, "text": "Q33", "qids": [], "time_seconds": null}, {"speaker": null, "text": "Q34]", "qids": [], "time_seconds": null}, {"speaker": null, "text": "The second category of marine energy that I'll mention is tidal energy. One major advantage of using the tide, rather than waves, as a source of energy is that it's predictable, we know the exact times of high and low tides for years to come.", "qids": ["35"], "time_seconds": 213}, {"speaker": null, "text": "For tidal energy to be effective, the difference between high and low tides needs to be at least five metres, and this occurs naturally in only about forty places on Earth. But the right conditions can be created by constructing a tidal lagoon, an area of sea water separated from the sea.", "qids": ["36"], "time_seconds": 237}, {"speaker": null, "text": "One current plan is to create a tidal lagoon on the coast of Wales. This will be an area of water within a bay at Swansea, sheltered by a U-shaped breakwater, or dam, built out from the coast. The breakwater will contain sixteen hydro turbines, and as the tide rises, water rushes through the breakwater, activating the turbines, which turn a generator to produce electricity. Then, for three hours as the tide goes out, the water is held back within the breakwater, increasing the difference in water level, until it's several metres higher within the lagoon than in the open sea. Then, in order to release the stored water, gates in the breakwater are opened. It pours powerfully out of the lagoon, driving the turbines in the breakwater in the opposite direction and again generating thousands of megawatts of electricity. As there are two high tides a day, this lagoon scheme would generate electricity four times a day, every day, for a total of around 14 hours in every 24 - and enough electricity for over 150,000 homes.  [Q37", "qids": ["37"], "time_seconds": 264}, {"speaker": null, "text": "Q38]", "qids": [], "time_seconds": null}, {"speaker": null, "text": "This system has quite a lot in its favour: unlike solar and wind energy it doesn't depend on the weather the turbines are operated without the need for fuel, so it doesn't create any greenhouse gas emissions; and very little maintenance is needed. It's estimated that electricity generated in this way will be relatively cheap, and that manufacturing the components would create more than 2,000 jobs, a big boost to the local economy.", "qids": ["39", "38"], "time_seconds": 360}, {"speaker": null, "text": "On the other hand, there are fears that lagoons might harm both fish and birds, for example by disturbing migration patterns, and causing a build-up of silt, affecting local ecosystems.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "There are other forms of tidal energy, but I'll go on to the third category of marine energy: ocean thermal energy conversion. This depends on there being a big difference in temperature between surface water and the water a couple of kilometres below the surface, and this occurs in tropical coastal areas. The idea is to bring cold water up to the surface using a submerged pipe. The concept dates back to 1881, when ...", "qids": ["40"], "time_seconds": 416}], "notes": ["Marine renewable energy (ocean energy)", "Introduction", "More energy required because of growth in population and {{31}}", "What’s needed:", "renewable energy sources", "methods that won’t create pollution", "Wave energy", "Advantage: wave provide a {{32}} source of renewable energy", "Electricity can be generated using offshore or onshore systems", "Onshore systems may use a reservoir", "Problems:", "wave can move in any {{33}}", "movement of sand, etc. on the {{34}} of the ocean may be affected", "Tidal energy", "Tide are more {{35}} than waves", "Planned tidal lagoon in Wales:", "will be created in a {{36}} at Swansea", "breakwater (dam) containing 16 turbines", "rising tide forces water through turbines, generating electricity", "stored water is released through {{37}} , driving the turbines in the reserve direction", "Advantages:", "not dependent on weather", "no {{38}} is required to make it work", "likely to create a number of {{39}}", "Problem:", "may harm fish and birds, e.g. by affecting {{40}} and building up split", "Ocean thermal energy conversion", "Uses a difference in temperature between the surface and lower levels", "Water brought to the surface in a pipe"]}]};
