<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test 4 &ndash; IELTS Listening Practice</title>
<style>
:root{
  --bg:#eef1f7; --panel:#ffffff; --ink:#1b2540; --muted:#66708a; --line:#e3e7f0;
  --navy:#122a52; --navy-2:#1c3f74; --brand:#1c3f74; --brand-ink:#ffffff;
  --good:#128a4e; --bad:#d64545; --good-bg:#e9f9f1; --bad-bg:#fdecec;
  --accent-bg:#eef2fb; --gold:#c9a24b; --radius:14px;
  --shadow:0 1px 3px rgba(18,42,82,.06), 0 10px 24px -14px rgba(18,42,82,.18);
}
*{box-sizing:border-box;}
body{margin:0;background:linear-gradient(180deg,#e7ebf5 0%,#eef1f7 320px);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.wrap{max-width:940px;margin:0 auto;padding:28px 16px 80px;}
header.top{padding:6px 4px 22px;text-align:center;}
header.top .kicker{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.14em;color:var(--gold);background:var(--navy);padding:5px 14px;border-radius:999px;margin-bottom:14px;}
header.top h1{font-size:26px;margin:0 0 8px;letter-spacing:.01em;color:var(--navy);font-weight:800;}
header.top p{margin:0;color:var(--muted);font-size:13.5px;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:22px 0;position:sticky;top:10px;z-index:5;}
.tab-btn{border:1px solid var(--line);background:var(--panel);color:var(--navy);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;box-shadow:var(--shadow);}
.tab-btn:hover{border-color:var(--navy-2);}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.tab-btn .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin-right:7px;vertical-align:middle;}
.tab-btn.done .dot{background:var(--gold);}
.part{display:none;}
.part.active{display:block;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:0 0 22px;margin-bottom:20px;box-shadow:var(--shadow);overflow:hidden;}
.part-bar{background:linear-gradient(90deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:15px 24px;font-weight:800;font-size:15.5px;letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.part-bar .title{font-weight:600;opacity:.92;font-size:13.5px;}
.card-body{padding:20px 24px 0;}
.card .instructions{color:var(--muted);font-size:13.5px;margin-bottom:14px;font-style:italic;}
.audio-box{display:flex;align-items:center;gap:12px;background:var(--accent-bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:4px 0 16px;}
.audio-box .icon{font-size:18px;}
.audio-box .label{font-size:12.5px;font-weight:700;color:var(--navy);white-space:nowrap;}
audio{width:100%;height:36px;}
.qgroup{margin:18px 0;}
.qgroup .header-note{font-size:12.5px;color:var(--navy-2);font-weight:800;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em;}
.qgroup .prompt{font-weight:600;margin-bottom:8px;}
.opt-list{display:flex;flex-direction:column;gap:6px;margin-bottom:2px;}
.opt{display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border-radius:9px;border:1px solid var(--line);cursor:pointer;}
.opt:hover{background:var(--accent-bg);border-color:var(--navy-2);}
.opt input{margin-top:3px;}
.opt.correct{background:var(--good-bg);border-color:var(--good);}
.opt.incorrect{background:var(--bad-bg);border-color:var(--bad);}
.opt:has(input:disabled){opacity:.45;cursor:not-allowed;}
.opt input:disabled{cursor:not-allowed;}
.notes-block{white-space:pre-wrap;line-height:2.2;}
.notes-block .subhead{display:block;font-weight:800;margin:16px 0 4px;color:var(--navy);font-size:14.5px;}
.notes-block .bullet{display:block;margin-left:14px;}
.blank{display:inline-block;border:none;border-bottom:2px solid var(--navy-2);background:var(--accent-bg);border-radius:5px 5px 0 0;padding:3px 8px;font:inherit;font-weight:700;min-width:120px;text-align:center;color:var(--ink);}
.blank:focus{outline:none;background:#e4eaf9;}
.blank.correct{border-color:var(--good);background:var(--good-bg);}
.blank.incorrect{border-color:var(--bad);background:var(--bad-bg);}
.blank-num{font-size:11px;color:var(--gold);font-weight:800;vertical-align:super;margin-right:2px;}
.actions{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap;}
button.primary{background:var(--navy);color:#fff;border:none;padding:12px 24px;border-radius:9px;font-size:14.5px;font-weight:700;cursor:pointer;box-shadow:0 6px 14px -6px rgba(18,42,82,.5);}
button.primary:hover{background:var(--navy-2);}
button.ghost{background:#fff;border:1px solid var(--line);color:var(--navy);padding:11px 18px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;}
button.ghost:hover{border-color:var(--navy-2);color:var(--navy-2);}
.score-pill{font-weight:800;padding:9px 18px;border-radius:999px;background:var(--navy);color:#fff;font-size:14px;}
.toggle-section{display:none;margin-top:16px;border-top:1px dashed var(--line);padding-top:16px;}
.toggle-section.open{display:block;}
.script-text{font-size:14.5px;background:#f7f8fc;border:1px solid var(--line);border-radius:10px;padding:14px 16px;max-height:560px;overflow-y:auto;}
.script-line{margin:0 0 10px;line-height:1.65;}
.script-line .spk{font-weight:800;color:var(--navy);margin-right:4px;}
.script-line mark.hl{background:#fdf1d0;border-radius:4px;padding:1px 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
.script-line .qtag{display:inline-block;font-weight:800;color:var(--navy);font-size:11px;background:#e8edf8;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle;}
.jump-btn{display:inline-block;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:700;color:#fff;background:var(--navy-2);border:none;border-radius:6px;padding:3px 8px;margin-right:8px;cursor:pointer;vertical-align:middle;}
.jump-btn:hover{background:var(--navy);}
.expl-item{border-top:1px solid var(--line);padding:14px 0;}
.expl-item:first-child{border-top:none;}
.expl-item .eq-head{display:flex;gap:10px;align-items:center;margin-bottom:6px;}
.expl-item .qnum{background:var(--navy);color:#fff;font-weight:800;font-size:12px;border-radius:6px;padding:3px 9px;}
.expl-item .ans{font-weight:800;color:var(--good);}
.expl-item .quote{font-style:italic;color:var(--muted);font-size:13.5px;margin:4px 0 6px;white-space:pre-wrap;}
.expl-item .explain{font-size:14px;white-space:pre-wrap;}
.example-line{color:var(--muted);font-style:italic;}
.script-note{font-size:12.5px;color:var(--muted);margin:0 0 10px;}
footer.credit{color:var(--muted);font-size:12px;text-align:center;margin-top:26px;}
.box-panel{background:var(--accent-bg);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px;}
.box-panel .box-title{font-weight:800;color:var(--navy);margin-bottom:8px;font-size:13.5px;}
.box-panel .box-item{display:flex;gap:8px;margin:4px 0;font-size:14px;}
.box-panel .box-item b{color:var(--navy-2);min-width:18px;}
.map-img{max-width:100%;border-radius:10px;border:1px solid var(--line);margin-bottom:14px;display:block;}
.stem-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);}
.stem-row:last-child{border-bottom:none;}
.stem-row .stem-text{flex:1;}
.stem-row select{padding:7px 10px;border-radius:8px;border:1px solid var(--line);font:inherit;font-weight:700;min-width:70px;background:#fff;}
.stem-row select.correct{border-color:var(--good);background:var(--good-bg);}
.stem-row select.incorrect{border-color:var(--bad);background:var(--bad-bg);}
@media(max-width:520px){.wrap{padding:18px 10px 60px;}.card-body{padding:16px 16px 0;}.part-bar{padding:13px 16px;}}
</style>
</head>

<script>
const TEST_DATA = {"test": "Test 4", "parts": [{"part": 1, "kind": "notes", "title": "Advice on Surfing Holidays", "instructions": null, "audio": "audio/test4/part1.mp3", "answers": {"1": "family", "2": "fit", "3": "hotels", "4": "Carrowniskey", "5": "week", "6": "bay", "7": "September", "8": "19/nineteen", "9": "30 / thirty", "10": "boots"}, "explanations": {"1": {"answer_label": "1. family", "quote": "Well, I don't know about that, but yes, I've done a bit of surfing over the years. I'd thoroughly recommend it. I think it's the kind of holiday all the family can enjoy together", "explain": "Câu hỏi: Recommends surfing for... holidays in the summer\nKeywords được paraphrase:\nkind of holiday - family holiday\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một tính từ. Tôi đã từng lướt ván được vài năm. Tôi muốn khuyến nghị nó. Tôi nghĩ đây là loại ngày nghỉ mà tất cả gia đình-‘family' có thể tận hưởng nó"}, "2": {"answer_label": "2. fit", "quote": "Wow! But it's quite physically demanding, isn't it? I've heard you need to be pretty fit.", "explain": "Câu hỏi: Need to be quite...\nKeywords được paraphrase:\nquite-pretty\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. nó yêu cầu bạn phải khá là thon gọn-‘fit'"}, "3": {"answer_label": "3. hotels", "quote": "WOMAN: Are there good hotels there?\nJACK: Yes - some very nice ones and there are also a few basic hostels and campsites. It's great if you need lessons as the surf schools are excellent", "explain": "Câu hỏi: Lahinch has some good quality. and surf schools\nKeywords được paraphrase:\nvery nice - good quality\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Người phụ nữ đã hỏi là ở đây có khách sạn-‘hoel' tốt không. Người đàn ông trả lời rằng có một số rất tốt."}, "4": {"answer_label": "4.\nCarrowniskey", "quote": "There's a good surf school at Carrowniskey beach.\nWOMAN: How do you spell that?\nJACK: C-A- double R-O-W- N-I-S-K-E-Y", "explain": "Câu hỏi: Good surf school at ... beach\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ: người đàn ông đã đánh vần tên bãi biển: C-A- 2 chữ R-O-W-N-N-S-K-E-Y"}, "5": {"answer_label": "5. week", "quote": "JACK: I put the kids into the surf camp they run during the summer for 1016 year olds.\nWOMAN: Oh right. How long was that for?\nJACK: Three hours every day for a week. It was perfect - they were so tired out after that.", "explain": "Câu hỏi: Surf camp lasts for one ....\nKeywords được paraphrase:\nHow long was that for - lasts for\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Người phụ nữ đã hỏi nó sẽ kéo dài bao lâu. Người đang ông trả lời là 3 tiếng mỗi ngày trong 1 tuần-‘week'"}, "6": {"answer_label": "6. bay", "quote": "One thing we did while the kids were surfing was to rent some kayaks to have a look around the bay which is nearby. It's really beautiful", "explain": "Câu hỏi: Can also explore the local\tby\tkayak\nKeywords được paraphrase:\nExplore - to have a look around nearby - local\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Một thứ mà chúng ta có thể làm khi bọn trẻ đang lướt ván là thuê chèo để khám phá cái vịnh- ‘bay' ở khu vực lân cận"}, "7": {"answer_label": "7. September", "quote": "Well, the weather's been fine the last couple of years when I've been there, but actually, it tends to rain more in August than in the spring or autumn.\nSeptember's my favourite month because the water is warmer then", "explain": "Câu hỏi: Best month to go: ...\nKeywords được paraphrase:\nSeptember's my favourite month - best month\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một tháng. Tháng tốt nhất để đi là tháng chín- ‘September'"}, "8": {"answer_label": "8. 19", "quote": "The average temperature is about 19 degrees and it usually doesn't go above 25 degrees", "explain": "Câu hỏi: Average temperature in summer: approx\t\ndegrees\nKeywords được paraphrase:\nApprox. - about\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một số. Nhiệt độ trung bình của mùa hè là khoảng ‘19' độ"}, "19": {"answer_label": "8. 19", "quote": "The average temperature is about 19 degrees and it usually doesn't go above 25 degrees", "explain": "Câu hỏi: Average temperature in summer: approx\t\ndegrees\nKeywords được paraphrase:\nApprox. - about\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một số. Nhiệt độ trung bình của mùa hè là khoảng ‘19' độ"}, "9": {"answer_label": "9. 30", "quote": "Surfing is a pretty cheap holiday really - the only cost is the hire of equipment. You can expect to pay a daily rate of about 30 euros for the hire of a wetsuit and board - but you can save about 40 euros if you hire by the week", "explain": "Câu hỏi: Wetsuit and surfboard: \teuros per day\nKeywords được paraphrase:\ndaily rate - perday\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một số. Đồ bơi giữ nhiệt và ván lướt: ‘30' Euro 1 ngày"}, "30": {"answer_label": "9. 30", "quote": "Surfing is a pretty cheap holiday really - the only cost is the hire of equipment. You can expect to pay a daily rate of about 30 euros for the hire of a wetsuit and board - but you can save about 40 euros if you hire by the week", "explain": "Câu hỏi: Wetsuit and surfboard: \teuros per day\nKeywords được paraphrase:\ndaily rate - perday\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một số. Đồ bơi giữ nhiệt và ván lướt: ‘30' Euro 1 ngày"}, "10": {"answer_label": "10. boots", "quote": "No. It's important to make sure you get good quality wetsuits - you'll all get too cold if you don't. And make sure you also get boots. They keep your feet warm and it's easier to surf with them on too", "explain": "Câu hỏi: Also advisable to hire ... for warmth\nKeywords được paraphrase:\nwarmth - they keep your feet warm\nGiải thích đáp án:\nCâu hỏi yêu cầu điền danh từ. Nên thuê thêm đôi ủng-‘boots'. Nó giúp giữ ấm đôi chân của bạn."}}, "script_full": [{"speaker": "WOMAN", "text": "Jack, I'm thinking of taking the kids to the seaside on a surfing holiday this summer and I wanted to ask your advice - as I know you're such an expert.", "qids": []}, {"speaker": "JACK", "text": "Well, I don't know about that, but yes, I've done a bit of surfing over the years. I'd thoroughly recommend it. I think it's the kind of holiday all the family can enjoy together. The thing about surfing is that it's great for all ages and all abilities. My youngest started when he was only three!", "qids": ["1"]}, {"speaker": "WOMAN", "text": "Wow! But it's quite physically demanding, isn't it? I've heard you need to be pretty fit.", "qids": []}, {"speaker": "JACK", "text": "Yes. You'll certainly learn more quickly and won't tire as easily.", "qids": []}, {"speaker": "WOMAN", "text": "Well that should be OK for us. You've been surfing a few times in Ireland, haven't you?", "qids": []}, {"speaker": "JACK", "text": "Yes. There's some great surfing there, which people don't always realise.", "qids": []}, {"speaker": "WOMAN", "text": "And which locations would you recommend? - there seem to be quite a few.", "qids": []}, {"speaker": "JACK", "text": "Yes, there are loads. Last year we went to County Donegal. There are several great places to surf there.", "qids": ["2"]}, {"speaker": "WOMAN", "text": "What about in County Clare? I read that's also really good for surfing.", "qids": []}, {"speaker": "JACK", "text": "Yes, it is. I've been there a few times. Most people go to Lahinch. My kids love it there. The waves aren't too challenging and the town is very lively.", "qids": ["3"]}, {"speaker": "WOMAN", "text": "Are there good hotels there?", "qids": []}, {"speaker": "JACK", "text": "Yes - some very nice ones and there are also a few basic hostels and campsites. It's great if you need lessons as the surf schools are excellent.", "qids": []}, {"speaker": "WOMAN", "text": "Sounds good.", "qids": []}, {"speaker": "JACK", "text": "Yes and there's lots to see in the area - like those well-known cliffs - I've forgotten the name of them ...", "qids": []}, {"speaker": "WOMAN", "text": "Oh don't worry - I can look them up.", "qids": []}, {"speaker": "JACK", "text": "I've also been surfing in County Mayo, which is less well-known for surfing, but we had a really good time. That was a few years ago when the kids were younger. There's a good surf school at Carrowniskey beach.", "qids": []}, {"speaker": "WOMAN", "text": "How do you spell that?", "qids": []}, {"speaker": "JACK", "text": "C-A-double R-O-W-N-I-S-K-E-Y", "qids": ["4"]}, {"speaker": "WOMAN", "text": "OK.", "qids": []}, {"speaker": "JACK", "text": "I put the kids into the surf camp they run during the summer for 10-16 year olds.", "qids": []}, {"speaker": "WOMAN", "text": "Oh right. How long was that for?", "qids": []}, {"speaker": "JACK", "text": "Three hours every day for a week. It was perfect - they were so tired out after that.", "qids": ["5"]}, {"speaker": "WOMAN", "text": "I can imagine.", "qids": []}, {"speaker": "JACK", "text": "One thing we did while the kids were surfing was to rent some kayaks to have a look around the bay which is nearby. It's really beautiful.", "qids": ["6"]}, {"speaker": "WOMAN", "text": "Oh, I'd love to do that.", "qids": []}, {"speaker": "WOMAN", "text": "Now the only time I went to Ireland it rained practically every day.", "qids": []}, {"speaker": "JACK", "text": "Mmm yes that can be a problem - but you can surf in the rain, you know.", "qids": []}, {"speaker": "WOMAN", "text": "It doesn't have the same appeal, somehow.", "qids": []}, {"speaker": "JACK", "text": "Well, the weather's been fine the last couple of years when I've been there, but actually, it tends to rain more in August than in the spring or autumn. September's my favourite month because the water is warmer then.", "qids": ["7"]}, {"speaker": "WOMAN", "text": "The only problem is that the kids are back to school then.", "qids": []}, {"speaker": "JACK", "text": "I know. But one good thing about Irish summers is that it doesn't get too hot. The average temperature is about 19 degrees and it usually doesn't go above 25 degrees.", "qids": ["8"]}, {"speaker": "WOMAN", "text": "That sounds alright. Now what about costs?", "qids": []}, {"speaker": "JACK", "text": "Surfing is a pretty cheap holiday really - the only cost is the hire of equipment. You can expect to pay a daily rate of about 30 euros for the hire of a wetsuit and board but you can save about 40 euros if you hire by the week.", "qids": ["9"]}, {"speaker": "WOMAN", "text": "That's not too bad.", "qids": []}, {"speaker": "JACK", "text": "No. It's important to make sure you get good quality wetsuits - you'll all get too cold if you don't. And make sure you also get boots. They keep your feet warm and it's easier to surf with them on too.", "qids": ["10"]}, {"speaker": "WOMAN", "text": "OK. Well, thanks very much.", "qids": []}], "notes": ["Advice on surfing holidays", "Jack’s advice", "Recommends surfing for {{1}} holidays in the summer", "Need to be quite {{2}}", "Irish surfing locations", "County Clare", "–  Lahinch has some good quality {{3}} and surf schools", "–  There are famous cliffs nearby", "County Mayo", "–  Good surf school at {{4}} beach", "–  Surf camp lasts for one {{5}}", "–  Can also explore the local {{6}} by kayak", "Weather", "Best month to go: {{7}}", "Average temperature in summer: approx. {{8}} degrees", "Costs", "Equipment", "–  Wetsuit and surfboard: {{9}} euros per day", "–  Also advisable to hire {{10}} for warmth"]}, {"part": 2, "kind": "mcq", "title": "Picking Mushrooms", "instructions": null, "audio": "audio/test4/part2.mp3", "answers": {"11": "B", "12": "C", "13": "B", "14": "D", "15": "C", "16": "B", "17": "B", "18": "C", "19": "A", "20": "A"}, "explanations": {"11": {"answer_label": "11. C", "quote": "But of course, you have to be very careful and that’s why I always say you should never consume mushrooms picked by friends or neighbours 11/12 - always remember that some poisonous mushrooms look", "explain": "Từ khóa: warnings, picking, mushrooms \nDựa vào đầu bài nghe, ta xác định được thông tin rằng Dan đang đề cập về vấn đề an toàn thực phẩm – “I need to start by talking about safety” => đây cũng chính là 2 cảnh báo về việc hái nấm của Dan. \nCăn cứ vào từ khóa và nội dung bài nghe ta xác định được đoạn thông tin sau “I always say you should never consume mushrooms picked by friends or neighbours” để chọn được C là đáp án đúng. \nTa có: consume = eat"}, "12": {"answer_label": "12. B", "quote": "The other thing to avoid is mushrooms\t\ngrowing beside busy 11/12 roads for obvious reasons. But nothing beats the taste of freshly picked mushrooms (…)", "explain": "Từ khóa: warnings, picking, mushrooms \nDựa vào đầu bài nghe, ta xác định được thông tin rằng Dan đang đề cập về vấn đề an toàn thực phẩm – “I need to start by talking about safety” => đây cũng chính là 2 cảnh báo về việc hái nấm của Dan. \nCăn cứ vào từ khóa và nội dung bài nghe ta xác định được đoạn thông tin sau “The other thing to avoid is mushrooms growing beside busy roads for obvious reasons” để chọn được B là đáp án chính xác. \nDon’t pick = the other thing to avoid"}, "13": {"answer_label": "13. B", "quote": "Another thing you should remember is that you can’t tell if a mushroom is safe to eat by its smell - some of the most deadly mushrooms have no smell and taste quite nice, apparently. Finally, just because deer or squirrels eat a particular mushroom doesn't mean that you can. 13/14", "explain": "Từ khóa: wild mushrooms \nDựa vào bài nghe ta xác định được thông tin sau: Trong bài nghe, Dan có nói không thể xác định một loại nấm có ăn được hay không dựa vào mùi hương của nó vì “some of the most deadly mushrooms have no smell and taste quite nice” => Loại được đáp án E. Cũng cùng đoạn thông tin đó, ta có “just because deer or squirrels eat a particular mushroom doesn't mean that you can” – không phải vì hưu hay sóc ăn được loại nấm đó thì bạn cũng ăn được => đáp án đúng là B."}, "14": {"answer_label": "14. D", "quote": "There are certain ideas about wild mushrooms that it’s important to be aware of. Don’t listen to people who tell you that it’s only OK to eat mushrooms that are pale or dull - this is completely untrue. Some edible mushrooms are bright red, 13/14", "explain": "Từ khóa: wild mushrooms \nChú ý câu văn “There are certain ideas about wild mushrooms that it’s important to be aware of” => đây là hint để locate được đáp án. Căn cứ vào từ khóa và bài nghe ta xác định được thông tin sau “it’s only OK to eat mushrooms that are pale or dull - this is completely untrue. Some edible mushrooms are bright red” để xác đinh đáp án đúng là D. \nTrong đó bright red là từ đồng nghĩa với brightly coloured; edible không bị paraphrase lại nên dễ dàng xác định đáp án. \nPhương án C bị loại vì bài nghe không đề cập đến thông tin này, phương án A không phải là đáp án vì ở cuối bài người nói có đề cập “I prefer mushrooms cooked but it won’t do you any harm to eat them uncooked in salads - it’s not necessary to peel them”"}, "15": {"answer_label": "15. C", "quote": "There are usually a range of habitats where mushrooms grow, such as playing fields and wooded areas. But you need to be there first thing in the morning, 15 as there’s likely be a lot of competition - not just from people but wildlife too.", "explain": "Từ khóa: picking mushrooms, in parks \nDựa vào từ khóa và bài nghe ta xác định được thông tin sau “But you need to be there first thing in the morning” – “Nhưng bạn cần phải đến sớm nhất vào buổi sáng” để chọn được C là đáp án chính xác. \nTa có: get there early = be there first thing"}, "16": {"answer_label": "16. B", "quote": "There are some really good phone apps for identifying mushrooms, but you can’t always rely on getting a good signal in the middle of a wood. If possible, you should go with a group led by an expert 16 - you’ll stay safe and learn a lot that way.", "explain": "Từ khóa: beginners, good, idea \nDựa vào từ khóa và bài nghe ta xác định được thông tin sau “If possible, you should go with a group led by an expert 16 - you’ll stay safe and learn a lot that way” => đáp án đúng là B. \nLoại phương án A vì Dan có nói rằng “sóng ở trong rừng không phải lúc nào cũng tốt” \nLoại phương án C vì người nói nói rằng “I wouldn’t recommend relying on photos in a book”"}, "17": {"answer_label": "17. B", "quote": "Conservation is a really important consideration and you must follow a few basic rules. You should never pick all the mushrooms in one area - collect only enough for your own needs. 17", "explain": "Từ khóa: conservation, important \nDựa vào từ khóa và bài nghe ta xác định được thông tin sau “You should never pick all the mushrooms in one area - collect only enough for your own needs” – nghĩa là “Bạn không nên hái tất cả nấm trong một khu vực - chỉ hái đủ nhu cầu của bản thân” để xác định đáp án đúng là B. \nTa có cấu trúc “collect only enough” được diễn đạt lại thành “picking a limited amount”"}, "18": {"answer_label": "18. C", "quote": "Restaurants are becoming more interested in locally sourced food like wild mushrooms, but the biggest problem is that so many new houses have been built in this area in the last ten years. 18", "explain": "Từ khóa: wild mushrooms, decline\nDựa vào từ khóa và bài nghe ta xác định được thông tin sau “but the biggest problem is that so many new houses have been built in this area in the last ten years” – “nhưng vấn đề lớn nhất là có quá nhiều công trình nhà ở được xây dựng ở khu vực này trong mười năm qua” để xác định được đáp án đúng là C. \nTrong đó, “so many new houses” = “a rise in building developments”"}, "19": {"answer_label": "19. A", "quote": "Anyway, a word of advice on storing mushrooms. Collect them in a brown paper bag and as soon as you get home, put them in the fridge. They’ll be fine for a couple of days, but it's best to cook them as soon as possible 19- after washing them really carefully first, of course.", "explain": "Từ khóa: storing mushrooms, should \nDựa vào từ khóa và bài nghe ta xác định được thông tin sau “They’ll be fine for a couple of days, but it's best to cook them as soon as possible” để xác định đáp án chính xác là A. Ta có: a couple of days = two days \nLoại phương án B vì người nói khuyên chúng ta nên bảo quản nấm trong túi giấy màu nâu chứ không phải bảo quản trong phòng tối. Loại C vì “it's best to cook them as soon as possible 19- after washing them really carefully” \nTa có: should ~ advice"}, "20": {"answer_label": "20. A", "quote": "So everybody knows what a mushroom tastes like, right? Well, you’ll be surprised by the huge variety of wild mushrooms there are. Be adventurous! They're great in so many dishes - stir fries, risottos, pasta.", "explain": "Từ khóa: trying, new, varieties, mushrooms \nDựa vào từ khóa và bài nghe ta xác định được thông tin sau “Well, you’ll be surprised by the huge variety of wild mushrooms there are. Be adventurous! They're great in so many dishes - stir fries, risottos, pasta” => đáp án chính xác là A. \nTrong đó, different recipes = many dishes \nBe adventurous ở đây mang hàm nghĩa khuyến khích mọi người hãy thử nhiều loại nấm, và cụm này đồng nghĩa với experiment."}}, "script_full": [{"speaker": "PRESENTER", "text": "This evening we're delighted to welcome Dan Beagle, who's just written a book on looking for and finding food in the wild. He's going to tell us everything we need to know about picking wild mushrooms.", "qids": []}, {"speaker": "DAN", "text": "Thank you very much. Well, I need to start by talking about safety. You really need to know what you're doing because some mushrooms are extremely poisonous. Having said that, once you know what to look for, it's really worth doing for the amazing variety of mushrooms available - which you can't get in the shops. But of course, you have to be very careful and that's why I always say you should never consume mushrooms picked by friends or neighbours - always remember that some poisonous mushrooms look very similar to edible ones and it's easy for people to get confused. The other thing to avoid is mushrooms growing beside busy roads for obvious reasons. But nothing beats the taste of freshly picked mushrooms - don't forget that the ones in the shops are often several days old and past their best.", "qids": ["11", "12"]}, {"speaker": null, "text": "There are certain ideas about wild mushrooms that it's important to be aware of. Don't listen to people who tell you that it's only OK to eat mushrooms that are pale or dull - this is completely untrue. Some edible mushrooms are bright red, for example. Personally, I prefer mushrooms cooked but it won't do you any harm to eat them uncooked in salads - it's not necessary to peel them. Another thing you should remember is that you can't tell if a mushroom is safe to eat by its smell - some of the most deadly mushrooms have no smell and taste quite nice, apparently. Finally, just because deer or squirrels eat a particular mushroom doesn't mean that you can.", "qids": ["13", "14"]}, {"speaker": null, "text": "Of course, mushroom picking is associated with the countryside but if you haven't got a car, your local park can be a great place to start. There are usually a range of habitats where mushrooms grow, such as playing fields and wooded areas. But you need to be there first thing in the morning, as there's likely be a lot of competition - not just from people but wildlife too. The deer often get the best mushrooms in my local park.", "qids": ["15"]}, {"speaker": null, "text": "If you're a complete beginner, I wouldn't recommend going alone or relying on photos in a book, even the one I've written! There are some really good phone apps for identifying mushrooms, but you can't always rely on getting a good signal in the middle of a wood. If possible, you should go with a group led by an expert - you'll stay safe and learn a lot that way.", "qids": ["16"]}, {"speaker": null, "text": "Conservation is a really important consideration and you must follow a few basic rules. You should never pick all the mushrooms in one area - collect only enough for your own needs. Be very careful that you don't trample on young mushrooms or other plants. And make sure you don't pick any mushrooms that are endangered and protected by law.", "qids": ["17"]}, {"speaker": null, "text": "There's been a decline in some varieties of wild mushrooms in this part of the country. Restaurants are becoming more interested in locally sourced food like wild mushrooms, but the biggest problem is that so many new houses have been built in this area in the last ten years. And more water is being taken from rivers and reservoirs because of this, and mushroom habitats have been destroyed.", "qids": ["18"]}, {"speaker": null, "text": "Anyway, a word of advice on storing mushrooms. Collect them in a brown paper bag and as soon as you get home, put them in the fridge. They'll be fine for a couple of days, but it's best to cook them as soon as possible after washing them really carefully first, of course.", "qids": ["19"]}, {"speaker": null, "text": "So everybody knows what a mushroom tastes like, right? Well, you'll be surprised by the huge variety of wild mushrooms there are. Be adventurous! They're great in so many dishes - stir fries, risottos, pasta. But just be aware that some people can react badly to certain varieties so it's a good idea not to eat huge quantities to begin with.", "qids": ["20"]}, {"speaker": null, "text": "OK, so now I'm going to show you ...", "qids": []}], "groups": [{"type": "choice", "qids": ["11", "12"], "prompt": "Which TWO warnings does Dan give about picking mushrooms?", "options": {"A": "Don’t pick more than one variety of mushroom at a time.", "B": "Don’t pick mushrooms near busy roads.", "C": "Don’t eat mushrooms given to you.", "D": "Don’t eat mushrooms while picking them.", "E": "Don’t pick old mushrooms."}, "multi": true, "header": "Questions 11 and 12 Choose TWO letters, A-E."}, {"type": "choice", "qids": ["13", "14"], "prompt": "Which TWO ideas about wild mushrooms does Dan say are correct?", "options": {"A": "Mushrooms should always be peeled before eating.", "B": "Mushrooms eaten by animals may be unsafe.", "C": "Cooking destroys toxins in mushrooms.", "D": "Brightly coloured mushrooms can be edible.", "E": "All poisonous mushrooms have a bad smell."}, "multi": true, "header": "Questions 13 and 14 Choose TWO letters, A-E."}, {"type": "choice", "qids": ["15"], "prompt": "What advice does Dan give about picking mushrooms in parks?", "options": {"A": "Choose wooded areas.", "B": "Don’t disturb wildlife.", "C": "Get there early."}, "multi": false, "header": "Choose the correct letter, A, B or C."}, {"type": "choice", "qids": ["16"], "prompt": "Dan says it is a good idea for beginners to", "options": {"A": "use a mushroom app.", "B": "join a group.", "C": "take a reference book."}, "multi": false, "header": null}, {"type": "choice", "qids": ["17"], "prompt": "What does Dan say is important for conservation?", "options": {"A": "selecting only fully grown mushrooms", "B": "picking a limited amount of mushrooms", "C": "avoiding areas where rare mushroom species grow"}, "multi": false, "header": null}, {"type": "choice", "qids": ["18"], "prompt": "According to Dan, some varieties of wild mushrooms are in decline because there is", "options": {"A": "a huge demand for them from restaurants.", "B": "a lack of rain in this part of the country.", "C": "a rise in building developments locally."}, "multi": false, "header": null}, {"type": "choice", "qids": ["19"], "prompt": "Dan says that when storing mushrooms, people should", "options": {"A": "keep them in the fridge for no more than two days.", "B": "keep them in a brown bag in a dark room.", "C": "leave them for a period after washing them."}, "multi": false, "header": null}, {"type": "choice", "qids": ["20"], "prompt": "What does Dan say about trying new varieties of mushrooms?", "options": {"A": "Experiment with different recipes.", "B": "Expect some to have a strong taste.", "C": "Cook them for a long time."}, "multi": false, "header": null}]}, {"part": 3, "kind": "mcq", "title": "Trevor and Stephanie (Children's Literature)", "instructions": null, "audio": "audio/test4/part3.mp3", "answers": {"21": "A", "22": "C", "23": "A", "24": "B", "25": "B", "26": "F", "27": "E", "28": "C", "29": "B", "30": "G"}, "explanations": {"21": {"answer_label": "Câu 21", "quote": "TREVO2R: Right, and whether the teaching should be factual - giving them information about the world - or ethical, teaching them values. What’s fascinating is that the writer isn't necessarily conscious of the message they’re conveying (Q21). For instance, a story might show a child who has a problem as a result of not doing what an adult has told them to do, implying that children should always obey adults.", "explain": "Câu hỏi:\n21.\tWhat does Trevor find interesting about the purpose of children’s literature?\nA. the fact that authors may not realise what values they’re teaching\nB. the fact that literature can be entertaining and educational\nC. the fact that adults expect children to imitate characters in literature\nKeywords được paraphrase:\nDịch câu hỏi “What does Trevor find interesting about the purpose of children's literature?” (Trevor thấy điều gì thú vị về mục đích của văn học thiếu nhi?). Các đáp án lựa chọn:\n•\tA the fact that authors may not realise what values they're teaching (thực tế là các tác giả có thể không nhận ra giá trị nào họ đang dạy)\n•\tB the fact that literature can be entertaining and educational at the same time (thực tế là văn học có thể giải trí và giáo dục cùng lúc)\n•\tC the fact that adults expect children to imitate characters in literature (thực tế là người lớn mong đợi trẻ em bắt chước các nhân vật trong văn học)\nGiải thích đáp án:\nNgười nói băt đâu paraphrase keywords “interesting” trong câu hỏi bằng câu “What's fascinating is that the writer isn't necessarily conscious of the message they're conveying” (Điều hấp dẫn là người viết không nhất thiết phải ý thức về thông điệp họ đang truyền tải). Vì vậy ta chọn đáp án A.\nĐáp án B và C không được nhăc đến trong bài nghe."}, "22": {"answer_label": "Câu 22", "quote": "TREVOR: That module made me realise how important stones are - they can have a significant effect on children as they grow up. Actually, it inspired me to have a go at it myself (Q22). just for my own interest. I know I can't compete with the really popular stories, like the Harry Potter books - they're very good, and even young kids like my seven-year-old niece love reading them.", "explain": "Câu hỏi:\n22.\tTrevor says the module about the purpose of children's literature made him\nA.\tanalyse some of the stories that his niece reads.\nB.\twonder how far popularity reflects good quality.\nC.\tdecide to start writing some children's stories.\nKeywords được paraphrase:\nDịch câu hỏi “Trevor says the module about the purpose of children's literature made him” (Trevor nói rằng mô-đun về mục đích của văn học thiếu nhi đã khiến cậu). Các đáp án lựa chọn\n•\tA analyse some of the stories that his niece reads (phân tích một số câu chuyện mà cháu gái đọc)\n•\tB wonder how far popularity reflects good quality (tự hỏi sự nổi tiếng có phân nào phản ảnh đến chất lượng tốt)\n•\tC decide to start writing some children's stories (quyết định bắt đầu viết một số truyện thiếu nhi)\nGiải thích đáp án:\nNgười nói dẫn sang câu hỏi 22 bằng câu “That module made me realise how important stories are” (Mô-đun đó khiến tôi nhận ra những câu chuyện quan trọng như thế nào). Sau đó, người nói giải thích rõ hơn “ Actually, it inspired me to have a go at it myself” (Trên thực tế, nó đã truyền cảm hứng cho tôi để thử sức mình). Vì vậy, ta chọn đáp án C.\nTa nghe thấy cụm từ “popular” giống với đáp án B, nhưng câu nói trong bài nghe mang ý nghĩa khác “popular stories, like the Harry Potter books -they're very good” (những câu chuyện nổi tiếng, như những cuốn sách Harry Potter - chúng rất hay). Vì vậy, ta loại đáp án B.\nTa nghe thấy từ “niece” giống đáp án A, nhưng câu nói mang ý nghĩa khác “young kids like my seven-year-old niece love reading them” (những đứa trẻ như cháu gái bảy tuổi của tôi thích đọc chúng). VÌ vậy, ta loại đáp án A."}, "23": {"answer_label": "Câu 23", "quote": "STEPHANIE: That's good. I remember some frightening ones I saw as a child and I can still see them vividly in my mind, years later! Pictures can be so powerful, just as powerful as words. I've always enjoyed drawing, so that’s the field I want to go into when I finish the course (Q23). I bet that module will be really helpful.", "explain": "Câu hỏi:\n23.\tStephanie is interested in the Pictures module because\nA.\tshe intends to become an illustrator.\nB.\tshe can remember beautiful illustrations from her childhood.\nC.\tshe believes illustrations are more important than words.\nKeywords được paraphrase:\nDịch câu hỏi “Stephanie is interested in the Pictures module because “(Stephanie thích mô-đun hình vẽ vì). Các đáp án lựa chọn\n•   A she intends to become an illustrator (cô dự định trở thành một họa sĩ minh họa)\n•\tB she can remember beautiful illustrations from her childhood (cô ấy có thể nhớ những hình minh họa đẹp từ thời thơ ấu của mình)\n•\tC she believes illustrations are more important than words (cô ấy tin rằng hình minh họa quan trọng hơn lời nói)\nGiải thích đáp án:\nCâu nói đầu tiên gần giống đáp án B như sau “I remember some frightening ones I saw as a child and I can still see them vividly in my mind” (Tôi nhớ một số hình ảnh đáng sợ mà tôi đã thấy khi còn nhỏ và tôi vẫn có thể nhìn thấy chúng một cách sống động trong tâm trí của tôi). Ta thấy sự khác nhau giữa câu nói và đáp án B là chữ “frightening” (đáng sợ) khác với chữ “beautiful” (đẹp). Vì vậy, ta loại đáp án B.\nCâu nói tiếp theo khiến ta nhầm lẫn với đáp án C “Pictures can be so powerful, just as powerful as words” (Tranh vẽ cũng có hiệu quả như ngôn từ). Trong đáp án C nói tranh vẽ hiệu quả hơn ngôn từ. Vì vậy, ta loại đáp án C.\nCâu cuối cùng đưa ta câu trả lời “that's the field I want to go into when I finish the course. I bet that module will be really helpful” (đó là lĩnh vực tôi muốn theo khi tôi kết thúc khóa học. Tôi cá rằng mô-đun đó sẽ thực sự hữu ích). Vì vậy, ta chọn đáp án A."}, "24": {"answer_label": "Câu 24", "quote": "TREVOR: I'm sure it will. We also studied comics in that module, but I'm not convinced of their value, not compared with books. One of the great things about words is that you use your imagination, but with a comic you don't have to.\n\nSTEPHANIE: But children are so used to visual input - on TV, video games, and so on. There are plenty of kids who wouldn't even try to read a book, so I think comics can Q24 serve a really useful purpose.\n\nTREVOR: You mean, it's better to read a comic than not to read at all? Yes. I suppose you're right. I just think it's sad when children don't read books.", "explain": "Câu hỏi:\n24.\tTrevor and Stephanie agree that comics\nA.\tare inferior to books.\nB.\thave the potential for being useful.\n     C.\tdiscourage children from using their imagination.\nKeywords được paraphrase:\nDịch câu hỏi “Trevor and Stephanie agree that comics” (Trevor và Stephanie đồng ý rằng truyện tranh). Các đáp án lựa chọn\n•\tA are inferior to books (thua kém sách)\n•\tB have the potential for being useful (có khả năng hữu ích)\n•\tC discourage children from using their imagination (không khuyến khích trẻ sử dụng trí tưởng tượng của chúng)\nGiải thích đáp án:\nNgười đàn ông đưa ra hai ý kiến về “comics” (truyện tranh). Đầu tiên “We also studied comics in that module, but I'm not convinced of their value, not compared\nwith books” (Chúng ta cũng nghiên cứu truyện tranh trong mô-đun đó, nhưng tôi không tin về giá trị của chúng, không so sánh được với sách). Vì vậy, ta loại câu A.\nÝ kiến thứ hai, người đàn ông đưa ra là “One of the great things about words is that you use your imagination, but with a comic you don't have to” (Một trong những điều tuyệt vời về từ ngữ là bạn sử dụng trí tưởng tượng của mình, nhưng với một truyện tranh bạn không cần phải). Tuy nhiên, người phụ nữ không đồng ý với quan điểm này. Vì vậy, ta loại đáp án C.\nNgười phụ nữ đưa ra ý kiến của mình “There are plenty of kids who wouldn't even try to read a book, so I think comics can serve a really useful purpose” (Có rất nhiều trẻ em thậm chí không muốn đọc một cuốn sách, vì vậy tôi nghĩ truyện tranh có thể có mục đích thực sự hữu ích). Sau đó, người đàn ông đồng tình bằng câu nói “ Yes. I suppose you're right” (Đúng. Tôi nghĩ là bạn đúng). Vì vậy, ta chọn đáp án B."}, "25": {"answer_label": "Câu 25", "quote": "STEPHANIE : What about books for girls and books for boys? Does the course go into that?\n\nTREVOR: Yes, there’s a module on it. For years, lots of stories, in English, at least, assumed that boys went out and did adventurous things and girls stayed at home and played with dolls. I was amazed how many books were targeted at just one sex or the other (Q25). Of course this reflects society as it is when the books are written.\n\nSTEPHANIE: That's true. So it sounds as though you think it's a good course.", "explain": "Câu hỏi:\n25.\tWith regard to books aimed at only boys or only girls, Trevor was surprised\nA.\thow long the distinction had gone unquestioned.\nB.\thow few books were aimed at both girls and boys.\nC.\thow many children enjoyed books intended for the opposite sex.\nKeywords được paraphrase:\nDịch câu hỏi “With regard to books aimed at only boys or only girls, Trevor was surprised” (Đối với những cuốn sách chỉ dành cho con trai hoặc con gái, Trevor đã rất ngạc nhiên). Các đáp án lựa chọn\n•\tA how long the distinction had gone unquestioned (khoảng thời gian sự khác biệt đã không bị nghi ngờ)\n•\tB how few books were aimed at both girls and boys (ít sách dành cho cả nam và nữ)\n•\tC how many children enjoyed books intended for the opposite sex (nhiều trẻ em thích sách dành cho giới tính khác)\nGiải thích đáp án:\nBài nghe dẫn sang câu hỏi tiếp theo bằng câu nói của giọng nữ “What about books for girls and books for boys? (Còn sách cho con gái và sách cho con trai thì sao?). Người đàn ông đưa ra câu trả lời “I was amazed how many books were targeted at just one sex or the other” (Tôi đã rất ngạc nhiên khi có bao nhiêu cuốn sách được nhắm vào một giới tính hoặc khác). Từ “amazed” được thay cho từ “surprised” trong câu hỏi. Vì vậy, ta chọn đáp án B.\nĐáp án A và C không được nhắc tới trong bài nghe."}, "26": {"answer_label": "Câu 26", "quote": "TREVOR: So does that mean you’ve read Perrault’s fairy tales? Cinderella, The Sleeping Beauty, and so on.\n\nSTEPHANIE: Yes. They must be important, because no stories of that type had been written before, these were the first. (Q26) Then there’s The Swiss Family Robinson.", "explain": "Câu hỏi:\n26.\tPerrault’s fairy tales\t\nKeywords được paraphrase:\nCâu hỏi yêu cầu nối tên các tác phẩm với thông tin của chúng. Các thông tin lựa chọn\n•\tA translated into many other languages (được dịch ra nhiều thứ tiếng)\n•\tB hard to read (khó đọc)\n•\tC inspired a work in a different area of art (truyền cảm hứng cho một tác phẩm nghệ thuật khác)\n•\tD more popular than the author's other works (nổi tiếng hơn so với các tác phẩm khác của tác giả)\n•\tE original title refers to another book (tiêu đề gốc liên tưởng đến cuốn sách khác)\n•\tF started a new genre (bắt đầu một thể loại mới)\n•\tG unlikely topic (chủ đề không chắc chắn)\nGiải thích đáp án:\nGiọng người đàn ông nhắc đến câu hỏi “does that mean you've read Perrault's fairy tales? (có nghĩa là bạn đã đọc Perrault’s fairy tales?). Người phụ nữ trả lời “Yes. They must be important, because no stories of that type had been written before, these were the first” (Vâng, chúng rất quan trọng bởi vì không có truyện thể loại này được viết trước kia, những truyện này là đâu tiên). Vì vậy ta chọn đáp án F."}, "27": {"answer_label": "Câu 27", "quote": "before, these were the first. (Q26) Then there's The Swiss Family Robinson.\n\nTREVOR: I haven't read that.\n\nSTEPHANIE: The English name makes it sound as though Robinson is the family's surname, but a more accurate translation would be The Swiss Robinsons, because it's about a Swiss family who are shipwrecked, like Robinson Crusoe in the novel of a century earlier.(Q27)", "explain": "Câu hỏi:\n27.\tThe Swiss Family Robinson\nKeywords được paraphrase:\nNhư câu 26\nGiải thích đáp án:\nNgười phụ nữ đưa thông tin về The Swiss Family Robinson “The English name makes it sound as though Robinson is the family's surname, but a more accurate translation would be The Swiss Robinsons, because it's about a Swiss family who are shipwrecked. like Robinson Crusoe in the novel of a century earlier” (Tên tiếng Anh nghe có vẻ như Robinson là họ của gia đình, nhưng bản dịch chính xác hơn sẽ là The Robinsons của Thụy Sĩ, bởi vì đó là về một gia đình Thụy Sĩ bị đắm tàu. như Robinson Crusoe trong tiểu thuyết của một thế kỷ trước đó). Cả đoạn thông tin chỉ nói về vấn đề tên của tác phẩm, nên ta chọn đáp án E."}, "28": {"answer_label": "Câu 28", "quote": "STEPHANIE: Have you read Hoffmann's The Nutcracker and the Mouse King?\n\nTREVOR: Wasn't that the basis for Tchaikovsky’s ballet The Nutcracker? (Q28)\n\nSTEPHANIE: That's right. It has some quite bizarre elements.", "explain": "Câu hỏi:\n28.\tThe Nutcracker and The Mouse King\nKeywords được paraphrase:\nNhư câu 26\nGiải thích đáp án:\nTa nghe chuyển sang câu hỏi 28 bằng câu “Have you read Hoffmann's The Nutcracker and the Mouse King?” (Bạn đã đọc Hoffmann's The Nutcracker and the Mouse King chưa?). Người đàn ông đưa ra câu trả lời “Wasn't that the basis for Tchaikovsky's ballet The Nutcracker?” (Đó không phải là nền tảng cho vở ballet The Nutcracker của Tchaikovsky sao?). Sau đó, người phụ nữ xác nhận rằng “That's right” (Đúng vậy). Do đó, ta chọn đáp án C."}, "29": {"answer_label": "Câu 29", "quote": "STEPHANIE : Mine too! And it's so surprising, because Wilde is best known for his plays, and most of them are very witty, but The Happy Prince is really moving. I struggled with Tolkien’s The Lord of the Rinas - three long books, and I gave up after one(Q29).", "explain": "Câu hỏi:\n29.\tThe Lord of the Rings\t\nKeywords được paraphrase:\nNhư câu 26\nGiải thích đáp án:\nGiọng nữ nhắc đến câu trả lời cho câu hỏi 29 bằng câu “I struggled with Tolkien's The Lord of the Rings” (tôi gặp khó khăn với The Lord of the Rings của Tolkien). Vì vậy ta chọn đáp án B."}, "30": {"answer_label": "Câu 30", "quote": "STEPHANIE: Another one I've read is War Horse.\nTREVOR: Oh yes. It's about the First World War. isn't it? Hardly what you’d expect for a children’s story.", "explain": "Câu hỏi:\n30.\tWar House\t\nKeywords được paraphrase:\nNhư câu 26\nGiải thích đáp án:\nGiọng nữ nhắc đến câu hỏi 30 bằng câu “Another one I've read is War Horse” (Cuốn sách khác mà tôi đã đọc là War House). Giọng đàn ông đưa ra thông tin về cuốn sách “It's about the First World War, isn't it? Hardly what you'd expect for a children's story.” (Nó nói về thế chiến thứ nhất. Khó có thể đoán đó là chuyện dành cho trẻ em). Vì vậy, ta chọn đáp án G."}}, "script_full": [{"speaker": null, "text": "STEPHANIE: Hello, Trevor", "qids": []}, {"speaker": null, "text": "TREVOR: Hello, Stephanie.", "qids": []}, {"speaker": null, "text": "You said you wanted to talk about the course I'm taking on literature for children.", "qids": []}, {"speaker": null, "text": "STEPHANIE: That's right.", "qids": []}, {"speaker": null, "text": "I'm thinking of doing it next year, but I'd like to find out more about it first.", "qids": []}, {"speaker": null, "text": "TREVOR: OK, well, as you probably know, it's a one-year course.", "qids": []}, {"speaker": null, "text": "It's divided into six modules, and you have to take all of them.", "qids": []}, {"speaker": null, "text": "One of the most interesting ones, for me, at least, was about the purpose of children's literature.", "qids": []}, {"speaker": null, "text": "STEPHANIE: You mean, whether it should just entertain children or should be educational, as well.", "qids": []}, {"speaker": null, "text": "TREVOR: Right, and whether the teaching should be factual - giving them information about the world or ethical, teaching them values.", "qids": []}, {"speaker": null, "text": "What's fascinating is that the writer isn't necessarily conscious of the message they're conveying.", "qids": []}, {"speaker": null, "text": "For instance, a story might show a child who has a problem as a result of not doing what an adult has told them to do, implying that children should always obey adults.", "qids": []}, {"speaker": null, "text": "STEPHANIE: I see what you mean.", "qids": []}, {"speaker": null, "text": "TREVOR: That module made me realise how important stories are - they can have a significant effect on children as they grow up.", "qids": []}, {"speaker": null, "text": "Actually, it inspired me to have a go at it myself, just for my own interest.", "qids": []}, {"speaker": null, "text": "I know I can't compete with the really popular stories, like the Harry Potter books - they're very good, and even young kids like my seven-year-old niece love reading them.", "qids": []}, {"speaker": null, "text": "STEPHANIE: Mm.", "qids": []}, {"speaker": null, "text": "I'm very interested in illustrations in stories.", "qids": []}, {"speaker": null, "text": "Is that covered in the course?", "qids": []}, {"speaker": null, "text": "TREVOR: Yes, there's a module on pictures, and how they're sometimes central to the story.", "qids": []}, {"speaker": null, "text": "STEPHANIE: That's good.", "qids": []}, {"speaker": null, "text": "I remember some frightening ones I saw as a child and I can still see them vividly in my mind, years later!", "qids": []}, {"speaker": null, "text": "Pictures can be so powerful, just as powerful as words.", "qids": []}, {"speaker": null, "text": "I've always enjoyed drawing, so that's the field I want to go into when I finish the course.", "qids": []}, {"speaker": null, "text": "I bet that module will be really helpful.", "qids": []}, {"speaker": null, "text": "TREVOR: I'm sure it will.", "qids": []}, {"speaker": null, "text": "We also studied comics in that module, but I'm not convinced of their value, not compared with books.", "qids": []}, {"speaker": null, "text": "One of the great things about words is that you use your imagination, but with a comic you don't have to.", "qids": []}, {"speaker": null, "text": "STEPHANIE: But children are so used to visual input - on TV, video games, and so on.", "qids": []}, {"speaker": null, "text": "There are plenty of kids who wouldn't even try to read a book, so I think comics can serve a really useful purpose.", "qids": []}, {"speaker": null, "text": "TREVOR: You mean, it's better to read a comic than not to read at all?", "qids": []}, {"speaker": null, "text": "Yes, I suppose you're right.", "qids": []}, {"speaker": null, "text": "I just think it's sad when children don't read books.", "qids": []}, {"speaker": null, "text": "STEPHANIE: What about books for girls and books for boys?", "qids": []}, {"speaker": null, "text": "Does the course go into that?", "qids": []}, {"speaker": null, "text": "TREVOR: Yes, there's a module on it.", "qids": []}, {"speaker": null, "text": "For years, lots of stories, in English, at least, assumed that boys went out and did adventurous things and girls stayed at home and played with dolls.", "qids": []}, {"speaker": null, "text": "I was amazed how many books were targeted at just one sex or the other.", "qids": []}, {"speaker": null, "text": "Of course this reflects society as it is when the books are written.", "qids": []}, {"speaker": null, "text": "STEPHANIE: That's true.", "qids": []}, {"speaker": null, "text": "So it sounds as though you think it's a good course.", "qids": []}, {"speaker": null, "text": "TREVOR: Definitely.", "qids": []}, {"speaker": null, "text": "TREVOR: Have you been reading lots of children's stories, to help you decide whether to take the course?", "qids": []}, {"speaker": null, "text": "STEPHANIE: Yeah.", "qids": []}, {"speaker": null, "text": "I've gone as far back as the late seventeenth century, though I know there were earlier children's stories.", "qids": []}, {"speaker": null, "text": "TREVOR: So does that mean you've read Perrault's fairy tales?", "qids": []}, {"speaker": null, "text": "Cinderella, The Sleeping Beauty, and so on.", "qids": []}, {"speaker": null, "text": "STEPHANIE: Yes.", "qids": []}, {"speaker": null, "text": "They must be important, because no stories of that type had been written before, these were the first.", "qids": []}, {"speaker": null, "text": "Then there's The Swiss Family Robinson.", "qids": []}, {"speaker": null, "text": "TREVOR: I haven't read that.", "qids": []}, {"speaker": null, "text": "STEPHANIE: The English name makes it sound as though Robinson is the family's surname. but a more accurate translation would be The Swiss Robinsons, because it's about a Swiss family who are shipwrecked, like Robinson Crusoe in the novel of a century earlier.", "qids": []}, {"speaker": null, "text": "TREVOR: Well I never knew that!", "qids": []}, {"speaker": null, "text": "STEPHANIE: Have you read Hoffmann's The Nutcracker and the Mouse King?", "qids": []}, {"speaker": null, "text": "TREVOR: Wasn't that the basis for Tchaikovsky's ballet The Nutcracker?", "qids": []}, {"speaker": null, "text": "STEPHANIE: That's right.", "qids": []}, {"speaker": null, "text": "It has some quite bizarre elements.", "qids": []}, {"speaker": null, "text": "TREVOR: I hope you've read Oscar Wilde's The Happy Prince.", "qids": []}, {"speaker": null, "text": "It's probably my favourite children's story of all time.", "qids": []}, {"speaker": null, "text": "STEPHANIE: Mine too!", "qids": []}, {"speaker": null, "text": "And it's so surprising, because Wilde is best known for his plays, and most of them are very witty, but The Happy Prince is really moving.", "qids": []}, {"speaker": null, "text": "I struggled with Tolkien's The Lord of the Rings-three long books, and I gave up after one.", "qids": []}, {"speaker": null, "text": "TREVOR: It's extremely popular, though.", "qids": []}, {"speaker": null, "text": "STEPHANIE: Yeah, but whereas something like The Happy Prince just carried me along with it.", "qids": []}, {"speaker": null, "text": "The Lord of the Rings took more effort than I was prepared to give it.", "qids": []}, {"speaker": null, "text": "TREVOR: I didn't find that - I love it.", "qids": []}, {"speaker": null, "text": "STEPHANIE: Another one I've read is War Horse.", "qids": []}, {"speaker": null, "text": "TREVOR: Oh yes.", "qids": []}, {"speaker": null, "text": "It's about the First World War, isn't it?", "qids": []}, {"speaker": null, "text": "Hardly what you'd expect for a children's story.", "qids": []}, {"speaker": null, "text": "STEPHANIE: Exactly, but it's been very successful.", "qids": []}, {"speaker": null, "text": "Have you read any...", "qids": []}], "groups": [{"type": "choice", "qids": ["21"], "prompt": "What does Trevor find interesting about the purpose of children's literature?", "options": {"A": "the fact that authors may not realise what values they're teaching", "B": "the fact that literature can be entertaining and educational at the same time", "C": "the fact that adults expect children to imitate characters in literature"}, "multi": false, "header": "Questions 21–25 Choose the correct letter, A, B or C."}, {"type": "choice", "qids": ["22"], "prompt": "Trevor says the module about the purpose of children's literature made him", "options": {"A": "analyse some of the stories that his niece reads.", "B": "wonder how far popularity reflects good quality.", "C": "decide to start writing some children's stories."}, "multi": false, "header": null}, {"type": "choice", "qids": ["23"], "prompt": "Stephanie is interested in the Pictures module because", "options": {"A": "she intends to become an illustrator.", "B": "she can remember beautiful illustrations from her childhood.", "C": "she believes illustrations are more important than words."}, "multi": false, "header": null}, {"type": "choice", "qids": ["24"], "prompt": "Trevor and Stephanie agree that comics", "options": {"A": "are inferior to books.", "B": "have the potential for being useful.", "C": "discourage children from using their imagination."}, "multi": false, "header": null}, {"type": "choice", "qids": ["25"], "prompt": "With regard to books aimed at only boys or only girls, Trevor was surprised", "options": {"A": "how long the distinction had gone unquestioned.", "B": "how few books were aimed at both girls and boys.", "C": "how many children enjoyed books intended for the opposite sex."}, "multi": false, "header": null}, {"type": "matching", "qids": ["26", "27", "28", "29", "30"], "box_title": "Comments", "box": {"A": "translated into many other languages", "B": "hard to read", "C": "inspired a work in a different area of art", "D": "more popular than the author's other works", "E": "original title refers to another book", "F": "started a new genre", "G": "unlikely topic"}, "stems": [{"qid": "26", "prompt": "Perrault's fairy tales"}, {"qid": "27", "prompt": "The Swiss Family Robinson"}, {"qid": "28", "prompt": "The Nutcracker and The Mouse King"}, {"qid": "29", "prompt": "The Lord of the Rings"}, {"qid": "30", "prompt": "War Horse"}], "header": "Choose FIVE answers from the box and write the correct letter, A–G, next to Question 26–30."}]}, {"part": 4, "kind": "notes", "title": "How the Industrial Revolution Affected Life in Britain", "instructions": null, "audio": "audio/test4/part4.mp3", "answers": {"31": "wealth", "32": "technology", "33": "power", "34": "textile(s)", "35": "machines", "36": "newspapers", "37": "local", "38": "lighting", "39": "windows", "40": "Advertising"}, "explanations": {"31": {"answer_label": "31. wealth", "quote": "In fact, it was in the 19th century that the quantity and quality of people's possessions was used as an indication of the wealth of the country. Before this, the vast majority of people had …", "explain": "Câu hỏi: \n19th century \n• For the first time, people's possessions were used to measure Britain's 31. .................... \nKeywords được paraphrase: \nTa cần gạch chân keyword “people’s possessions” (Tài sản của con người), “were used” (được sử dụng) và “measure” (đo lường). Trong bài nghe, “measure” được paraphrase thành “as an indication of” (như là dấu hiệu/biểu hiện của). \nGiải thích đáp án: \nChỗ trống cần điền phải là một danh từ - một thứ gì thuộc sở hữu của “Britain” (nước Anh). Trong bài, sau khi người dẫn nhắc đến “19th century” (thế kỷ 19) tương ứng với đề mục của câu hỏi, ta nghe được “…of people’s possessions was used as an indication of the wealth of the country” (…của tài sản con người được sử dụng như một sự biểu hiện của sự giàu có của đất nước - nước Anh). Ta thấy “as an indication of” có nghĩa tương đồng với “to measure” trên câu hỏi, vì vậy đáp án là “wealth” (sự giàu có)."}, "32": {"answer_label": "32. \ntechnology", "quote": "from the mid-18th to the late 19th century, when improvements in how goods were made as well as in technology triggered massive social changes that transformed life for just about everybody in several key areas.", "explain": "Câu hỏi: \n• Developments in production of goods and in 32. ................. greatly changed lives. \nKeywords được paraphrase: \nKeyword “Developments” (sự phát triển) được paraphrase thành “Improvements” (sự tiến bộ); “production of goods” (sự sản xuất hàng hóa) được paraphrase thành “how goods were made” (cách mà hàng hóa được tạo ra). Ngoài ra động từ “changed” trong câu hỏi cũng được đổi dạng wordform thành danh từ trong “triggered … changes” hoặc nói lại bằng một từ đồng nghĩa “transformed” (biến đổi). \nGiải thích đáp án: \nTrong bài nghe, có đoạn “…when improvements in how goods were made as well as in technology triggered massive social changes that transformed lives…” (…khi sự tiến bộ trong cách mà hàng hóa được tạo ra cũng như trong công nghệ đã kích hoạt nhiều sự thay đổi xã hội lớn mà biến đổi đời sống…). Dựa vào các cặp từ đồng nghĩa đã nêu trên, ta có thể điền được đáp án “technology” (công nghệ)."}, "33": {"answer_label": "33. power", "quote": "Industrial Revolution in images of steam engines and coal. And it's true that the Industrial Revolution couldn't have taken place at all if it weren't for these new sources of power.", "explain": "Câu hỏi: \nMAIN AREAS OF CHANGE \nManufacturing \n• The Industrial Revolution would not have happened without the new types of 33. ........................ that were used then. \nKeywords được paraphrase: \nKeyword “The Industrial Revolution” (Cách mạng công nghiệp) giúp ta xác định vị trí của câu hỏi trong bài. Ngoài ra, ta có thể thấy “happened” (đã xảy ra) được paraphrase bằng một từ đồng nghĩa “taken place” và cấu trúc “without something” (nếu không có cái gì) trên câu hỏi cũng đuợc thay bằng cấu trúc “if it weren’t for something” có nghĩa tương tự. \nGiải thích đáp án: \nCâu hỏi yêu cầu ta điền một danh từ vì nằm trong cụm “types of…” (loại gì đó). Trong bài, ta nghe được “…The Industrial Revolution wouldn’t have taken place if it weren’t for these sources of power” (…Cuộc Cách mạng Công nghiệp đã không xảy ra nếu không nhờ những nguồn năng lượng này). Dựa vào những cặp từ và cấu trúc đồng nghĩa đã phân tích ở trên, ta điền đáp án “power” (năng lượng)."}, "34": {"answer_label": "34. \nTextile(s)", "quote": "had dominated before this. The most advanced industry for much of the 19th century was textiles. This meant that fashionable fabrics, and lace and ribbons were made available to everyone.", "explain": "Câu hỏi: \n• The leading industry was 34. ....................... (its products became widely available). \nKeywords được paraphrase: \nTừ khóa “leading industry” (ngành công nghiệp đi đầu được paraphrase thành “most advanced industry” (ngành công nghiệp phát triển nhất). Ngoài ra ta có thể thấy “its products” được chi tiết hóa thành các sản phẩm cụ thể trong bài nghe “fabrics”, “lace”, “ribbons” và cụm từ “widely available” (có sẵn rộng rãi) được thành “available to everyone” (có sẵn cho tất cả mọi người). \nGiải thích đáp án: \nChỗ cần điền phải là danh từ vì ta có thể thấy chú thích trong ngoặc phía sau “its products…” (những sản phẩm của nó…). Trong bài, ta nghe được “The most advanced industry …. was textiles…” (Ngành công nghiệp phát triển nhất …. là may mặc ….). Dựa vào các cặp từ và cấu trúc đồng nghixa đã phân tích ở trên, ta điền đáp án “textiles”"}, "35": {"answer_label": "35. \nmachines", "quote": "their own homes. But enormous new machines were now being created that could produce the goods faster and on a larger scale, and these required a lot more space. So large factories were built, replacing the workshops, and forcing workers to travel to work. In fact, large numbers of people migrated from villages into towns as a result.", "explain": "Câu hỏi: \n• New 35. .................. made factories necessary and so more people moved into towns. \nKeywords được paraphrase: \nTa cần gạch chân keyword “made factories necessary” (làm cho các nhà máy trở nên cần thiết) để hiểu rõ nội dung câu hỏi. Ta có thể thấy “moved into towns” được paraphrase thành “migrated into towns” (di cư đến những thành thị) trong bài nghe, và cấu trúc “and so…” (và vì vậy…) được thay bằng “….as a result” có ý nghĩa tương tự. \nGiải thích đáp án: \nChỗ cần điền là một danh từ vì đứng sau tính từ “new” (mới). Câu hỏi yêu cầu ta điền một cái gì đó mới mà đã làm cho nhà máy trở nên cần thiết và khiến con người di chuyển về thành thị. Trong bài, có đoạn “New machines were now being created…. and these required a lot more space. So large factories were built” (Những máy móc mới được tạo ra…. và điều này cần thêm rất nhiều không gian. Vì vậy các nhà máy lớn được xây dựng). Như vậy, ta có thể thấy việc muốn có những máy móc mới thì phải xây dựng nhà máy (khiến nhà máy trở nên cần thiết). Vì vậy, ta điền đáp án “machines” (máy móc)."}, "36": {"answer_label": "36. newspaper", "quote": "of the country to the other. And the goods they moved weren't just coal, iron, clothes, and so on — significantly, they included newspapers, which meant that thousands of people were not only more knowledgeable about what was going on in the country, but could also read about what was available in the shops. And that encouraged them to buy more. So faster forms of …", "explain": "Câu hỏi: \nTransport \n• The railways took the place of canals. \n• Because of the new transport: \n— greater access to 36. ...................... made people more aware of what they could buy in shops. \nKeywords được paraphrase: \nTa cần gạch chân từ khóa “greater access to” (sự tiếp cận tốt hơn tới) để hiểu rõ nội dung câu hỏi. Ngoài ra, ta thấy “more aware of” (có ý thức hơn về) được paraphrase trong bài nghe thành “more knowledgeable about” (có kiến thức hơn về) và “what they could buy in shops” (Những gì họ có thể mua ở các cửa hàng) được paraphrase thành “what was available in the shops) có ý nghĩa tương tự. \nGiải thích đáp án: \nCâu hỏi nằm trong mục news transport - ở đây là “railways” (đường sắt). Trong bài nghe, ta có thể nghe được thông tin về đường sắt như sau “The goods they moved weren’t just …. , they included newspapers, which meant thousands of people were not only more knowledgeable about …. but could also read about what was available in the shops” (Những hàng hóa mà chúng - ở đây là các phương tiện đường sắt, vận chuyển không phải chỉ là …. , chúng còn bao gồm báo nữa, điều này có nghĩa là hàng ngàn người không chỉ có nhiều kiến thức hơn về…., mà còn có thể đọc về những gì được có sẵn trong các cửa hàng). Dựa vào các từ và cấu trúc được paraphrase đã phân tích ở trên, ta điền đáp án “newspaper” (báo)."}, "37": {"answer_label": "37. local", "quote": "what was available in the shops. And that encouraged them to buy more. So faster forms of transport resulted in distribution becoming far more efficient — goods could now be sold all over the country, instead of just in the local market.", "explain": "Câu hỏi: \n- when shopping, people were not limited to buying 37. ................... goods. \nKeywords được paraphrase: \nTa cần gạch chân keyword “not limited to” (không giới hạn trong). \nGiải thích đáp án: \nChỗ cần điền phải là tính từ miêu tả, bổ sung ý nghĩa cho danh từ “goods” (hàng hóa). Trong bài, ta nghe được “goods could now be sold over the country, instead of just in the local market”. (Hàng hóa bấy giờ có thể được bán trên khắp đất nước, thay vì chỉ ở chợ địa phương). Như vậy, ta có thể thấy người ta có thể mua hàng không chỉ giới hạn trong địa phương mà còn có thể ở những nơi khác. Vì vậy, đáp án là “local” (địa phương)."}, "38": {"answer_label": "38. lighting", "quote": "stock them with goods, and to attract customers: for instance, improved lighting inside greatly increased the visibility of the goods for sale. Another development that made …", "explain": "Câu hỏi: \nRetailing \n• The first department stores were opened. \n• The displays of goods were more visible: \n— inside stores because of better 38. ..................... \nKeywords được paraphrase: \nCâu hỏi nằm trong mục “retailing” và “the displays of goods were more visible” . Ta cần gạch chân các keywords “display of goods” (sự trưng bày hàng hóa) và “more visible” (rõ ràng hơn). Từ khóa “more visible” được paraphrase trong bài nghe thành “ increased the visibility” (tăng tính rõ ràng). Ngoài ra, ta cũng cần chú ý từ khóa “inside stores” (bên trong các cửa hàng). \nGiải thích đáp án: \nCâu hỏi yêu cầu ta điền một danh từ - vì đứng sau “better” (tốt hơn). Trong bài, sau khi người dẫn nhắc đến “retailing”, ta cần tập trung lắng nghe thông tin liên quan đến câu hỏi. Có đoạn “improved lighting inside greatly increased the visibility of the goods for sale” (sự chiếu sáng được củng cố ở bên trong đã làm tăng mạnh tính rõ ràng của các hàng hóa bày bán). Ta thấy “improved” (được cải thiện, củng cố) đồng nghĩa với “better” (tốt hơn) trên câu hỏi, vì vậy đáp án cần điền là “lighting” (sự chiếu sáng)."}, "39": {"answer_label": "39. windows", "quote": "greatly increased the visibility of the goods for sale. Another development that made goods more visible from outside resulted from the use of plate glass, which made it possible for windows to be much larger than previously. New ways of promoting goods.", "explain": "Câu hỏi: \n- outside stores, because 39. ........... were bigger. \nKeywords được paraphrase: \nTa cần gạch chân keyword “outside stores” (bên ngoài các cửa hàng) để phần biệt với ý trên câu 38 . Ta cũng gạch chân vào tính từ “bigger” (lớn hơn) để nắm rõ thông tin cần điền phải là thứ gì đó mà lớn hơn. \nGiải thích đáp án: \nChỗ trống cần điền phải là danh từ - một cái gì đó lớn hơn, giúp cho hàng hóa trở nên rõ ràng hơn “goods more visible” bên ngoài cửa hàng . Trong bài có đoạn “Another development that made goods more visible from outside resulted from the use of plate glass, which made it possible for windows to be much larger … “(Một phát triển khác mà làm cho hàng hóa trở nên rõ ràng hơn ở bên ngoài đến từ việc sử dụng kính phẳng, điều làm cho các cửa sổ trở nên to hơn). Ta thấy “larger” đồng nghĩa với “bigger” trên câu hỏi. Vì vậy, đáp án cần điền là “windows” (cửa sổ)."}, "40": {"answer_label": "40. Advertising", "quote": "possible for windows to be much larger than previously. New ways of promoting goods were introduced, too. Previously, the focus had been on informing potential customers about the availability of goods; now there was an explosion in advertising trying to persuade people to go shopping.", "explain": "Câu hỏi: \n• 40. ........................ that was persuasive became much more common. \nKeywords được paraphrase: \nTa cần gạch chân các keyword “persuasive” (có tính thuyết phục); “became” (trở nên) và “more common” (phổ biến hơn). \nGiải thích đáp án: \nTrong bài, có đoạn “There was an explosion in advertising trying to persuade people to go shopping” (Có một sự bùng nổ trong quảng cáo mà cố thuyết phục người ta đi mua sắm). Ta có thể thấy “there was an explosion” (có một sự bùng nổ) có ý nghĩa tương đồng với “became much more common” (trở nên phổ biến hơn rất nhiều) trên câu hỏi. Như vậy, đáp án cần điền là “Advertising” (Quảng cáo)."}}, "script_full": [{"speaker": null, "text": "Hi everyone, in this session I'll be presenting my research about the social history of Britain during the Industrial Revolution. I particularly looked at how ordinary lives were affected by changes that happened at that time. This was a time that saw the beginning of a new phenomenon: consumerism - where buying and selling goods became a major part of ordinary people's lives.", "qids": []}, {"speaker": null, "text": "In fact, it was in the 19th century that the quantity and quality of people's possessions was used as an indication of the wealth of the country. Before this, the vast majority of people had very few possessions, but all that was changed by the Industrial Revolution. This was the era from the mid-18th to the late 19th century, when improvements in how goods were made as well as in technology triggered massive social changes that transformed life for just about everybody in several key areas.", "qids": ["31"]}, {"speaker": null, "text": "First let's look at manufacturing. When it comes to manufacturing, we tend to think of the Industrial Revolution in images of steam engines and coal. And it's true that the Industrial Revolution couldn't have taken place at all if it weren't for these new sources of power. They marked an important shift away from the traditional watermills and windmills that had dominated before this. The most advanced industry for much of the 19th century was textiles. This meant that fashionable fabrics, and lace and ribbons were made available to everyone.", "qids": ["32", "33"]}, {"speaker": null, "text": "Before the Industrial Revolution, most people made goods to sell in small workshops, often in their own homes. But enormous new machines were now being created that could produce the goods faster and on a larger scale, and these required a lot more space. So large factories were built, replacing the workshops, and forcing workers to travel to work. In fact, large numbers of people migrated from villages into towns as a result.", "qids": ["34"]}, {"speaker": null, "text": "As well as manufacturing, there were new technologies in transport, contributing to the growth of consumerism. The horse-drawn stagecoaches and carts of the 18th century, which carried very few people and goods, and travelled slowly along poorly surfaced roads, were gradually replaced by the numerous canals that were constructed. These were particularly important for the transportation of goods. The canals gradually fell out of use, though, as railways were developed, becoming the main way of moving goods and people from one end of the country to the other. And the goods they moved weren't just coal, iron, clothes, and so on-significantly, they included newspapers, which meant that thousands of people were not only more knowledgeable about what was going on in the country, but could also read about what was available in the shops. And that encouraged them to buy more. So faster forms of transport resulted in distribution becoming far more efficient goods could now be sold all over the country, instead of just in the local market.", "qids": ["35", "36", "37"]}, {"speaker": null, "text": "The third main area that saw changes that contributed to consumerism was retailing. The number and quality of shops grew rapidly, and in particular, small shops suffered as customers flocked to the growing number of department stores a form of retailing that was new in the 19th century. The entrepreneurs who opened these found new ways to stock them with goods, and to attract customers: for instance, improved lighting inside greatly increased the visibility of the goods for sale. Another development that made goods more visible from outside resulted from the use of plate glass, which made it possible for windows to be much larger than previously. New ways of promoting goods were introduced, too. Previously, the focus had been on informing potential customers about the availability of goods; now there was an explosion in advertising trying to persuade people to go shopping.", "qids": ["38", "39"]}, {"speaker": null, "text": "Flanders claims that one of the great effects of the Industrial Revolution was that it created choice. All sorts of things that had previously been luxuries - from sugar to cutlery - became conveniences, and before long they'd turned into necessities: life without sugar or cutlery was unimaginable. Rather like mobile phones these days!", "qids": ["40"]}], "notes": ["How the Industrial Revolution affected life in Britain", "19th century", "• For the first time, people’s possessions were used to measure Britain’s {{31}}", "• Developments in production of goods and in {{32}} greatly changed lives.", "MAIN AREAS OF CHANGE", "Manufacturing", "• The Industrial Revolution would not have happened without the new types of {{33}}that were used then.", "• The leading industry was {{34}} (its products became widely available).", "• New {{35}} made factories necessary and so more people moved into towns.", "Transport", "• The railways took the place of canals.", "• Because of the new transport:", "greater access to {{36}}  made  people more aware of what they could buy in shops.", "when shopping, people were not limited to buying {{37}} goods.", "Retailing", "• The first department stores were opened.", "• The displays of goods were more visible:", "inside stores because of better {{38}}", "outside stores, because {{39}}were bigger.", "• {{40}}that was persuasive became much more common."]}]};
