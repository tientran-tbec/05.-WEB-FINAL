<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test 10 &ndash; IELTS Listening Practice</title>
<style>
:root{
  --bg:#eef1f7; --panel:#ffffff; --ink:#1b2540; --muted:#66708a; --line:#e3e7f0;
  --navy:#122a52; --navy-2:#1c3f74; --brand:#1c3f74; --brand-ink:#ffffff;
  --good:#128a4e; --bad:#d64545; --good-bg:#e9f9f1; --bad-bg:#fdecec;
  --accent-bg:#eef2fb; --gold:#c9a24b; --radius:14px;
  --shadow:0 1px 3px rgba(18,42,82,.06), 0 10px 24px -14px rgba(18,42,82,.18);
}
*{box-sizing:border-box;}
body{margin:0;background:linear-gradient(180deg,#e7ebf5 0%,#eef1f7 320px);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.wrap{max-width:940px;margin:0 auto;padding:28px 16px 80px;}
header.top{padding:6px 4px 22px;text-align:center;}
header.top .kicker{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.14em;color:var(--gold);background:var(--navy);padding:5px 14px;border-radius:999px;margin-bottom:14px;}
header.top h1{font-size:26px;margin:0 0 8px;letter-spacing:.01em;color:var(--navy);font-weight:800;}
header.top p{margin:0;color:var(--muted);font-size:13.5px;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:22px 0;position:sticky;top:10px;z-index:5;}
.tab-btn{border:1px solid var(--line);background:var(--panel);color:var(--navy);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;box-shadow:var(--shadow);}
.tab-btn:hover{border-color:var(--navy-2);}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.tab-btn .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin-right:7px;vertical-align:middle;}
.tab-btn.done .dot{background:var(--gold);}
.part{display:none;}
.part.active{display:block;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:0 0 22px;margin-bottom:20px;box-shadow:var(--shadow);overflow:hidden;}
.part-bar{background:linear-gradient(90deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:15px 24px;font-weight:800;font-size:15.5px;letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.part-bar .title{font-weight:600;opacity:.92;font-size:13.5px;}
.card-body{padding:20px 24px 0;}
.card .instructions{color:var(--muted);font-size:13.5px;margin-bottom:14px;font-style:italic;}
.audio-box{display:flex;align-items:center;gap:12px;background:var(--accent-bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:4px 0 16px;}
.audio-box .icon{font-size:18px;}
.audio-box .label{font-size:12.5px;font-weight:700;color:var(--navy);white-space:nowrap;}
audio{width:100%;height:36px;}
.qgroup{margin:18px 0;}
.qgroup .header-note{font-size:12.5px;color:var(--navy-2);font-weight:800;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em;}
.qgroup .prompt{font-weight:600;margin-bottom:8px;}
.opt-list{display:flex;flex-direction:column;gap:6px;margin-bottom:2px;}
.opt{display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border-radius:9px;border:1px solid var(--line);cursor:pointer;}
.opt:hover{background:var(--accent-bg);border-color:var(--navy-2);}
.opt input{margin-top:3px;}
.opt.correct{background:var(--good-bg);border-color:var(--good);}
.opt.incorrect{background:var(--bad-bg);border-color:var(--bad);}
.opt:has(input:disabled){opacity:.45;cursor:not-allowed;}
.opt input:disabled{cursor:not-allowed;}
.notes-block{white-space:pre-wrap;line-height:2.2;}
.notes-block .subhead{display:block;font-weight:800;margin:16px 0 4px;color:var(--navy);font-size:14.5px;}
.notes-block .bullet{display:block;margin-left:14px;}
.blank{display:inline-block;border:none;border-bottom:2px solid var(--navy-2);background:var(--accent-bg);border-radius:5px 5px 0 0;padding:3px 8px;font:inherit;font-weight:700;min-width:120px;text-align:center;color:var(--ink);}
.blank:focus{outline:none;background:#e4eaf9;}
.blank.correct{border-color:var(--good);background:var(--good-bg);}
.blank.incorrect{border-color:var(--bad);background:var(--bad-bg);}
.blank-num{font-size:11px;color:var(--gold);font-weight:800;vertical-align:super;margin-right:2px;}
.actions{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap;}
button.primary{background:var(--navy);color:#fff;border:none;padding:12px 24px;border-radius:9px;font-size:14.5px;font-weight:700;cursor:pointer;box-shadow:0 6px 14px -6px rgba(18,42,82,.5);}
button.primary:hover{background:var(--navy-2);}
button.ghost{background:#fff;border:1px solid var(--line);color:var(--navy);padding:11px 18px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;}
button.ghost:hover{border-color:var(--navy-2);color:var(--navy-2);}
.score-pill{font-weight:800;padding:9px 18px;border-radius:999px;background:var(--navy);color:#fff;font-size:14px;}
.toggle-section{display:none;margin-top:16px;border-top:1px dashed var(--line);padding-top:16px;}
.toggle-section.open{display:block;}
.script-text{font-size:14.5px;background:#f7f8fc;border:1px solid var(--line);border-radius:10px;padding:14px 16px;max-height:560px;overflow-y:auto;}
.script-line{margin:0 0 10px;line-height:1.65;}
.script-line .spk{font-weight:800;color:var(--navy);margin-right:4px;}
.script-line mark.hl{background:#fdf1d0;border-radius:4px;padding:1px 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
.script-line .qtag{display:inline-block;font-weight:800;color:var(--navy);font-size:11px;background:#e8edf8;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle;}
.jump-btn{display:inline-block;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:700;color:#fff;background:var(--navy-2);border:none;border-radius:6px;padding:3px 8px;margin-right:8px;cursor:pointer;vertical-align:middle;}
.jump-btn:hover{background:var(--navy);}
.expl-item{border-top:1px solid var(--line);padding:14px 0;}
.expl-item:first-child{border-top:none;}
.expl-item .eq-head{display:flex;gap:10px;align-items:center;margin-bottom:6px;}
.expl-item .qnum{background:var(--navy);color:#fff;font-weight:800;font-size:12px;border-radius:6px;padding:3px 9px;}
.expl-item .ans{font-weight:800;color:var(--good);}
.expl-item .quote{font-style:italic;color:var(--muted);font-size:13.5px;margin:4px 0 6px;white-space:pre-wrap;}
.expl-item .explain{font-size:14px;white-space:pre-wrap;}
.example-line{color:var(--muted);font-style:italic;}
.script-note{font-size:12.5px;color:var(--muted);margin:0 0 10px;}
footer.credit{color:var(--muted);font-size:12px;text-align:center;margin-top:26px;}
.box-panel{background:var(--accent-bg);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px;}
.box-panel .box-title{font-weight:800;color:var(--navy);margin-bottom:8px;font-size:13.5px;}
.box-panel .box-item{display:flex;gap:8px;margin:4px 0;font-size:14px;}
.box-panel .box-item b{color:var(--navy-2);min-width:18px;}
.map-img{max-width:100%;border-radius:10px;border:1px solid var(--line);margin-bottom:14px;display:block;}
.stem-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);}
.stem-row:last-child{border-bottom:none;}
.stem-row .stem-text{flex:1;}
.stem-row select{padding:7px 10px;border-radius:8px;border:1px solid var(--line);font:inherit;font-weight:700;min-width:70px;background:#fff;}
.stem-row select.correct{border-color:var(--good);background:var(--good-bg);}
.stem-row select.incorrect{border-color:var(--bad);background:var(--bad-bg);}
@media(max-width:520px){.wrap{padding:18px 10px 60px;}.card-body{padding:16px 16px 0;}.part-bar{padding:13px 16px;}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="kicker">Flight to Success</span>
    <h1>Test 10 &mdash; IELTS Listening</h1>
    <p>4 parts &middot; 40 questions &middot; Listen to each part, answer, then check your results, script and explanations.</p>
  </header>
  <div class="tabs" id="tabs"></div>

</div>
<script>
const TEST_DATA = {"test": "Test 10", "parts": [{"part": 1, "kind": "notes", "title": "Job Details from Employment Agency", "instructions": null, "audio": "audio/test10/part1.mp3", "answers": {"1": "receptionist", "2": "Medical", "3": "Chastons", "4": "appointments", "5": "database", "6": "experience", "7": "confident", "8": "temporary", "9": "1.15", "10": "parking"}, "explanations": {"1": {"answer_label": "1", "quote": "Role: receptionist", "explain": "Greg đang giới thiệu chi tiết công việc mà Julie có thể hứng thú, vị trí là nhân viên lễ tân."}, "2": {"answer_label": "2", "quote": "Location:\nFordham Medical Centre", "explain": "Vị trí nơi làm việc là ở trung tâm y tế Fordham, không xa đối với Julie"}, "3": {"answer_label": "3", "quote": "Chastons Road, Fordham", "explain": "Trung tâm y tế nó nằm trên đường Chastons Road."}, "5": {"answer_label": "5", "quote": "maintaining the internal database", "explain": "Nhiệm vụ tiếp theo là cập nhật dữ liệu nội bộ của trung tâm\nParaphrase: maintain ~ keep"}, "6": {"answer_label": "6", "quote": "Requirements:\nExperiences (essential)", "explain": "Greg đã nghĩ đến Julie khi biết công việc này yêu cầu người có kinh nghiệm, Julie đã có kinh nghiệm làm ở trung tâm thể thao."}, "7": {"answer_label": "7", "quote": "a calm and confident manner", "explain": "Yêu cầu tiếp theo là một người có thái độ bình tĩnh và tự tin khi tương tác với công chúng vì môi trường làm việc rất áp lực"}, "8": {"answer_label": "8", "quote": "Other information:\na temporary job-further opportunities may be available", "explain": "Công việc này là tạm thời (thời vự) nên sẽ kết thúc sớm vào tháng 9, nhưng sau đó những cơ hội tiếp theo sẽ có trong tương lai"}, "9": {"answer_label": "9", "quote": "hours: 7.45 a.m. to 1.15 p.m. Monday to Friday", "explain": "Thời gian làm việc bắt đầu từ 8 giờ sáng và kết thúc lúc 1 giờ 15 chiều."}, "10": {"answer_label": "10", "quote": "parking is available onsite", "explain": "Julie có thể đậu xe tại trung tâm vì ở đó có bãi đậu xe"}, "4": {"answer_label": "4", "quote": "Work involves: \nmaking appointment and reorganising them", "explain": "Công việc này bao gồm những nhiệm vụ như đặt lịch hẹn trực tiếp học qua điện thoại hoặc dời hẹn.\nParaphrase: reschedule ~ reorganize"}}, "script_full": [{"speaker": "JULIE", "text": "Hello?", "qids": []}, {"speaker": "GREG", "text": "Oh, hello. Is that Julie Davison?", "qids": []}, {"speaker": "JULIE", "text": "Yes.", "qids": []}, {"speaker": "GREG", "text": "This is Greg Preston from the Employment Agency. We met last week when you came in to enquire about office work.", "qids": []}, {"speaker": "JULIE", "text": "Oh, that's right.", "qids": []}, {"speaker": "GREG", "text": "Now we've just had some details come in of a job which might interest you.", "qids": []}, {"speaker": "JULIE", "text": "OK.", "qids": []}, {"speaker": "GREG", "text": "So this is a position for a receptionist - I believe you've done that sort of work before?", "qids": ["1"]}, {"speaker": "JULIE", "text": "Yes, I have, I worked in a sports centre for a couple of years before I got married and had the children.", "qids": []}, {"speaker": "GREG", "text": "Right. Well, this job's in Fordham, so not too far away for you, and it's at the medical centre there.", "qids": []}, {"speaker": "JULIE", "text": "OK. So where exactly is that?", "qids": []}, {"speaker": "GREG", "text": "It's quite near the station, on Chastons Road.", "qids": ["2", "3"]}, {"speaker": "JULIE", "text": "Sorry?", "qids": []}, {"speaker": "GREG", "text": "Chastons Road - that's C-H-A-S-T-O-N-S.", "qids": []}, {"speaker": "JULIE", "text": "OK, thanks. So what would the work involve? Dealing with enquiries from patients?", "qids": []}, {"speaker": "GREG", "text": "Yes, and you'd also be involved in making appointments, whether face to face or on the phone. And rescheduling them if necessary.", "qids": ["4"]}, {"speaker": "JULIE", "text": "Fine, that shouldn't be a problem.", "qids": []}, {"speaker": "GREG", "text": "And another of your duties would be keeping the centre's database up-to-date. Then you might have other general administrative duties as well, but those would be the main ones.", "qids": ["5"]}, {"speaker": "JULIE", "text": "OK.", "qids": []}, {"speaker": "GREG", "text": "Now when the details came in, I immediately thought of you because one thing they do require is someone with experience, and you did mention your work at the sports centre when you came in to see us.", "qids": []}, {"speaker": "JULIE", "text": "Yes, in fact I enjoyed that job. Is there anything else they're looking for?", "qids": []}, {"speaker": "GREG", "text": "Well, they say it's quite a high-pressure environment, they're always very busy, and patients are often under stress, so they want someone who can cope with that and stay calm, and at the same time be confident when interacting with the public.", "qids": ["6", "7"]}, {"speaker": "JULIE", "text": "Well, after dealing with three children all under five, I reckon I can cope with that.", "qids": []}, {"speaker": "GREG", "text": "I'm sure you can.", "qids": []}, {"speaker": "GREG", "text": "And then another thing they mention is that they're looking for someone with good IT skills ...", "qids": []}, {"speaker": "JULIE", "text": "Not a problem.", "qids": []}, {"speaker": "GREG", "text": "So you'd be interested in following this up?", "qids": []}, {"speaker": "JULIE", "text": "Sure. When would it start?", "qids": []}, {"speaker": "GREG", "text": "Well, they're looking for someone from the beginning of next month, but I should tell you that this isn't a permanent job, it's temporary, so the contract would be just to the end of September. But they do say that there could be further opportunities after that.", "qids": ["8"]}, {"speaker": "JULIE", "text": "OK. And what would the hours be?", "qids": []}, {"speaker": "GREG", "text": "Well, they want someone who can start at a quarter to eight in the morning - could you manage that?", "qids": []}, {"speaker": "JULIE", "text": "Yes, my husband would have to get the kids up and off to my mother's - she's going to be looking after them while I'm at work. What time would I finish?", "qids": []}, {"speaker": "GREG", "text": "One fifteen.", "qids": ["9"]}, {"speaker": "JULIE", "text": "That should work out all right. I can pick the kids up on my way home, and then I'll have the afternoon with them. Oh, one thing... is there parking available for staff at the centre?", "qids": ["10"]}, {"speaker": "GREG", "text": "Yes, there is, and it's also on a bus route.", "qids": []}, {"speaker": "JULIE", "text": "Right. Well, I expect I'll have the car but it's good to know that. OK, so where do I go from here?", "qids": []}, {"speaker": "GREG", "text": "Well, if you're happy for me to do so, I'll forward your CV and references, and then the best thing would probably be for you to phone them so they can arrange for an interview.", "qids": []}, {"speaker": "JULIE", "text": "Great. Well thank you very much.", "qids": []}, {"speaker": "GREG", "text": "You're welcome. Bye now.", "qids": []}, {"speaker": "JULIE", "text": "Bye.", "qids": []}], "notes": ["Job details from employment agency", "Role {{1}}", "Location Fordham {{2}}Centre", "{{3}}Road,Fordham", "Work involves", "• dealing with enquiries", "• making {{4}}and reorganising them", "• maintaining the internal {{5}}", "• general administration", "Requirements", "• {{6}} (essential)", "• a calm and {{7}}manner", "• good IT skills", "Other information", "• a {{8}}job- further opportunities may be available", "• hours: 7.45 a.m. to {{9}}p.m Monday to Friday", "• {{10}}is available onsite"]}, {"part": 2, "kind": "mcq", "title": "Induction Talk for New Apprentices", "instructions": null, "audio": "audio/test10/part2.mp3", "answers": {"11": "A", "12": "C", "13": "B", "14": "E", "15": "B", "16": "B", "17": "C", "18": "A", "19": "A", "20": "C"}, "explanations": {"11": {"answer_label": "Câu 11", "quote": "I'd like to start with some general advice about being an apprentice\n\nI'd like to start with some general advice about being an apprentice. Most of you have very little or no experience of working for a big organisation and the first week or so may be quite challenging. There will be a lot of new information to take in but don't worry too much about trying to remember everything. The important thing is to check with someone if you're not sure what to do - you'll find your supervisor is very approachable and won't mind explaining things or helping you out.", "explain": "Câu hỏi:\nWhich TWO pieces of advice for the first week of an apprenticeship does the manager give?\nCâu hỏi yêu cầu 2 lời khuyên cho tuần đầu tiên học việc. Trước khi nghe câu trả lời, ta cần gạch chân những từ khóa của đáp án.\nKeywords được paraphrase:\nSau khi giới thiệu, người nói bắt đầu đưa ra thông tin về câu hỏi bằng cách “I'd like to start with some general advice about being an apprentice.” (Tôi muốn bắt đầu bằng một vài lời khuyên về nhân viên thử việc).\nGiải thích đáp án:\nNgười nói bắt đầu đưa ra câu trả lời đầu tiên bằng cụm “The important thing is...” (Điều quan trọng là.). Đáp án đầu tiên được nhắc đến là câu C: ask lots of questions (hỏi nhiều câu hỏi) bởi bài nghe đưa ra câu trả lời “check with someone if you're not sure what to do” (kiểm tra với mọi người nếu bạn không biết phải làm gì)."}, "12": {"answer_label": "Câu 12", "quote": "You're here to learn so make the most of that opportunity. You'll be spending time in different departments during your first week so make an effort to talk to as many people as possible about their work - you'll make some new friends and find out lots of useful information.", "explain": "Câu hỏi:\nWhich TWO pieces of advice for the first week of an apprenticeship does the manager give?\nCâu hỏi yêu cầu 2 lời khuyên cho tuần đầu tiên học việc. Trước khi nghe câu trả lời, ta cần gạch chân những từ khóa của đáp án.\nKeywords được paraphrase:\nNgười nói bắt đầu đưa ra câu trả lời bằng cụm “during the first week” (trong suốt tuần đầu tiên), đồng nghĩa với đáp án, nên ta tập trung câu trả lời sẽ nằm ở đây.\nGiải thích đáp án:\nTrong bài nghe, người nói đưa ra câu trả lời là “make an effort to...” (nỗ lực làm ...) đây chính là cách mở đầu khi đưa ra lời khuyên.\nĐáp án ở đây là câu A: get to know colleagues (làm quen với đồng nghiệp) bởi bài nghe đưa ra câu trả lời “talk to as many people as possible” (nói chuyện với nhiều người nhất có thể)"}, "13": {"answer_label": "Câu 13", "quote": "Their role is to provide help and support throughout your apprenticeship. Of course, this doesn't mean they'll actually do any of your work for you - instead they'll be asking you about what goals you've achieved so far, as well as helping you to identify any areas for improvement.", "explain": "Câu hỏi:\nWhich TWO things does the manager say mentors can help with?\nCâu hỏi yêu cầu 2 điều mà người hướng dẫn có thể giúp đỡ. Trước khi nghe câu trả lời, ta cần gạch chân những từ khóa của đáp án.\nKeywords được paraphrase:\nNgười nói chuyển sang câu hỏi số 13 bằng câu nói “As well as having a supervisor, you'll each be assigned a mentor” (Ngay khi có người giám sát, bạn sẽ được chỉ định người hướng dẫn).\nGiải thích đáp án:\nĐáp án đầu tiên nghe được là câu E: reviewing progress (xem lại quá trình) bởi bài nghe đưa ra câu trả lời they’ll be asking you about what goals you’ve achieved so far (họ sẽ hỏi bạn về những mục tiêu mà bạn đã đạt được) và “identify any areas for improvement” (tìm ra những phần cần cải thiện)"}, "14": {"answer_label": "Câu 14", "quote": "You can also discuss your more long - term ambitions with them as well", "explain": "Câu hỏi:\nWhich TWO things does the manager say mentors can help with?\nCâu hỏi yêu cầu 2 điều mà người hướng dẫn có thể giúp đỡ. Trước khi nghe câu trả lời, ta cần gạch chân những từ khóa của đáp án.\nGiải thích đáp án:\nĐáp án thứ hai là câu B: making career plans (có kế hoạch nghề nghiệp) bởi trong bài nghe có cụm từ “long-term ambitions” (hoài bão lâu dài) đông nghĩa với kê hoạch cho tương lai."}, "15": {"answer_label": "Câu 15", "quote": "Most importantly, the internet. As part of your job you'll be doing some research online so obviously you'll have unlimitited access for that but please don't use it for personal use - you'll have your own phones for that.", "explain": "Câu hỏi:\nCompany policy for apprentices. Using the internet 15 ………………\t\nKeywords được paraphrase:\nNgười nói bắt đầu đưa ra câu trả lời bằng câu “Now I just want to run through a few company policies for our apprenticeship scheme...” (Bây giờ tôi muốn thông qua một vài chính sách công ty đối với nhân viên thử việc).\nGiải thích đáp án:\nĐáp án câu này là B: there are some restrictions (có một vài hạn chê) bởi cụm don't use it for personal use (đừng dùng cho mục đích cá nhân). Tuy nhiên, các bạn dễ bị dính bẫy bởi chữ “unlimited access” (không hạn chê truy cập, cần lưu ý truy cập này chỉ dành cho “research online” (nghiên cứu online)."}, "16": {"answer_label": "Câu 16", "quote": "Some of you have already asked me about flexible working. After your probationary three- month period - some of you will be eligible for this - but it will depend on which department you're in and what your personal circumstances are (Q16). So please don't assume you'll automatically be permitted to do this.", "explain": "Câu hỏi:\nFrexible working 16 ……………………………….\nKeywords được paraphrase:\nNgười nói bắt đầu đưa ra câu trả lời cho câu hỏi 16 bằng câu nói “some of you have already asked me about flexible working” (một vài bạn đã hỏi tôi về lịch đi làm linh động).\nGiải thích đáp án:\nĐáp án câu này là B: there are some restrictions (có một vài hạn chế). Câu trả lời được đưa ra rõ ràng với rất nhiều chi tiết “some of you will be eligible for this” (chỉ vài người thích hợp) “depend on which department.. .what your personal circumstances are” (phụ thuộc vào phòng ban...tình huống cá nhân)"}, "17": {"answer_label": "Câu 17", "quote": "I want to make sure there's no confusion about our holiday policy. Apart from any statutory public holidays we ask that you don't look any holidays we ask that you don't book any holidays until your six-month your apprenticeship has finished. Time off should only be taken if you are unwell. Please speak to your supervisor if this is going to be a problem.", "explain": "Câu hỏi:\nBooking holidays 17\t\nKeywords được paraphrase:\nNgười nói bắt đầu chuyển qua câu hỏi số 17 bằng cụm từ “no confusion about our holiday policy” (không có nhầm lẫn về chính sách nghỉ lễ).\nGiải thích đáp án:\nĐáp án câu này là C: it is against the rules (đi ngược lại với luật) bởi trong bài nghe don't book any holidays until after your six-month apprenticeship has finished (không được xin nghỉ cho đến khi 6 tháng học việc kết thúc). Tức là, chính sách dành cho nhân viên học viên không được đăng kí ngày nghỉ."}, "18": {"answer_label": "Câu 18", "quote": "You'll be expected to work a 40 – hour week but there may be opportunities to do overtime during busy periods. Although you’re not required to do this, it can be a valuable experience - so we advise you to take it up if possible.", "explain": "Câu hỏi:\nWorking overtime 18 ……………………………….……..\nKeywords được paraphrase:\nNgười nói chuyển sang câu hỏi 18 bằng cụm từ “opportunities to do overtime...” (cơ hội để làm tăng ca).\nGiải thích đáp án:\nĐáp án câu này là A: it is encouraged (điều này được khuyến khích) bởi bài nghe có nói đến chữ “advise” (khuyên) trong trường hợp này đồng nghĩa với chữ encourage (khuyến khích)"}, "19": {"answer_label": "Câu 19", "quote": "As you know, we don’t have a formal dress code here - you may wear casual clothes as long as they’re practical - and the only restriction for shoes we have is on high heels for health and safety reasons. Comfortable shoes like trainers are preferable.", "explain": "Câu hỏi:\nWearing trainers 19\t\nKeywords được paraphrase:\nNgười nói chuyển sang đáp án cho câu hỏi số 19 bằng cụm từ “the only restriction for shoes” (nghiêm cấm duy nhất đối với giày).\nGiải thích đáp án:\nĐáp án câu này là A: it is encouraged (điều này được khuyến khích) bởi bài nghe có nói đến “trainers are preferable” (giày thể thao được ưa thích)"}, "20": {"answer_label": "Câu 20", "quote": "There’s heavily subsidized canteen on site where you can get hot meals or salads cheaply. Snacks and drinks are also provided - so we’ve decided to introduce a no packed lunch Policy. This is partly to encourage healthy eating at work and partly to stop people from eating....", "explain": "Câu hỏi:\nBringing food to work 20\t\nKeywords được paraphrase:\nNgười nói bắt đầu chuyển ý sang\ncâu hỏi thứ 20 bằng cụm từ “meals or salads” (bữa ăn và salad).\nGiải thích đáp án:\nĐáp án câu này là C: it is against the rules (đi ngược lại với luật) bởi trong bài nghe có cụm “no packed lunch policy” (không có chính sách bữa trưa theo phần)."}}, "script_full": [{"speaker": null, "text": "Good morning everyone. My name's Janet Parker and I'm the human resources manager. We're very happy to welcome you to your new apprenticeship. I hope that the next six months will be a positive and enjoyable experience for you.", "qids": []}, {"speaker": null, "text": "I'd like to start with some general advice about being an apprentice. Most of you have very little or no experience of working for a big organisation and the first week or so may be quite challenging. There will be a lot of new information to take in but don't worry too much about trying to remember everything. The important thing is to check with someone if you're not sure what to do-you'll find your supervisor is very approachable and won't mind explaining things or helping you out. You're here to learn so make the most of that opportunity. You'll be spending time in different departments during your first week so make an effort to talk to as many people as possible about their work you'll make some new friends and find out lots of useful information.  [Q11", "qids": []}, {"speaker": null, "text": "Q12]", "qids": []}, {"speaker": null, "text": "As well as having a supervisor, you'll each be assigned a mentor. This person will be someone who's recently completed an apprenticeship and you'll meet with them on a weekly basis. Their role is to provide help and support throughout your apprenticeship. Of course, this doesn't mean they'll actually do any of your work for you - instead they'll be asking you about what goals you've achieved so far, as well as helping you to identify any areas for improvement. You can also discuss your more long-term ambitions with them as well.  [Q13", "qids": []}, {"speaker": null, "text": "Q14]", "qids": []}, {"speaker": null, "text": "Now I just want to run through a few company policies for our apprenticeship scheme with you... Most importantly, the internet. As part of your job you'll be doing some research online so obviously you'll have unlimited access for that but please don't use it for personal use - you'll have your own phones for that.", "qids": ["15"]}, {"speaker": null, "text": "Some of you have already asked me about flexible working. After your probationary three-month period - some of you will be eligible for this but it will depend on which department you're in and what your personal circumstances are. So please don't assume you'll automatically be permitted to do this.", "qids": ["16"]}, {"speaker": null, "text": "I want to make sure there's no confusion about our holiday policy. Apart from any statutory public holidays we ask that you don't book any holidays until after your six-month apprenticeship has finished. Time off should only be taken if you are unwell. Please speak to your supervisor if this is going to be a problem.", "qids": ["17"]}, {"speaker": null, "text": "You'll be expected to work a 40-hour week but there may be opportunities to do overtime during busy periods. Although you're not required to do this, it can be a valuable experience - so we advise you to take it up if possible. Obviously, we understand that people do have commitments outside work, so don't worry if there are times when you are unavailable.", "qids": ["18"]}, {"speaker": null, "text": "As you know, we don't have a formal dress code here you may wear casual clothes as long as they're practical and the only restriction for shoes we have is on high heels for health and safety reasons. Comfortable shoes like trainers are preferable.", "qids": ["19"]}, {"speaker": null, "text": "There's a heavily subsidised canteen on site where you can get hot meals or salads cheaply. Snacks and drinks are also provided so we've decided to introduce a no packed lunch policy. This is partly to encourage healthy eating at work and partly to stop people from eating at their workstation, which is unhygienic.", "qids": ["20"]}, {"speaker": null, "text": "OK moving on to", "qids": []}], "groups": [{"type": "choice", "qids": ["11", "12"], "prompt": "Which TWO pieces of advice for the this week of an apprenticeship does the manager give?", "options": {"A": "get to know colleagues", "B": "learn from any mistakes", "C": "ask lots of questions", "D": "react positively to feedback", "E": "enjoy new challenges"}, "multi": true, "header": "Questions 11 and 12 Choose TWO letters, A–E."}, {"type": "choice", "qids": ["13", "14"], "prompt": "Which TWO things does the manager say mentors can help with?", "options": {"A": "confidence-building", "B": "making career plans", "C": "completing difficult tasks", "D": "making a weekly timetable", "E": "reviewing progress"}, "multi": true, "header": "Questions 13 and 14 Choose TWO letters, A–E."}, {"type": "matching", "qids": ["15", "16", "17", "18", "19", "20"], "box_title": "Company policy for apprentices", "box": {"A": "It is encouraged.", "B": "There are some restrictions.", "C": "It is against the rules."}, "stems": [{"qid": "15", "prompt": "Using the internet"}, {"qid": "16", "prompt": "Flexible working"}, {"qid": "17", "prompt": "Booking holidays"}, {"qid": "18", "prompt": "Working overtime"}, {"qid": "19", "prompt": "Wearing trainers"}, {"qid": "20", "prompt": "Bringing food to work"}], "header": null}]}, {"part": 3, "kind": "mcq", "title": "Birth Order and Personality", "instructions": null, "audio": "audio/test10/part3.mp3", "answers": {"21": "G", "22": "F", "23": "A", "24": "E", "25": "B", "26": "C", "27": "C", "28": "A", "29": "B", "30": "D"}, "explanations": {"21": {"answer_label": "21.\tG", "quote": "• ... like the consensus seems to be that oldest children are generally less well-adjusted because they can never get over the arrival of a younger sibling.\n•    Right, but on a positive note, somestudies claimed that they werethought to be good at nurturing,certainly in the past when people havelarge families, they have beenexpected to look after the youngerones.", "explain": "Câu hỏi:\nQuestions 21-26\nWhat did findings of previous research claim about the personality traits a child is likely to have because of their position in the family?\nPosition in family\n21.\tthe eldest child \t\t\t_______________\n22.\ta middle child. \t\t\t_______________\n23. the youngest child.\t\t_______________\t\n24.a twin. \t\t\t\t_______________\t\n25.an old child \t\t\t_______________\t\n26.a child with much older siblings\t_______________\nKeywords được paraphrase:\nCác keyword trong câu hỏi can chú ý là “findings of previous research” (kết quả của những nghiên cứu trước đó). Khi nghe chúng ta cũng cần tập trung vào tính từ mô tả “personality trait” (đặc điểm tính cách) của từng đối tượng, sau đó so sánh với các tính cách được đánh kí tự cho trong báng.\nGiải thích đáp án:\nĐối với đối tượng “eldest child” (đứa trẻ lớn tuổi nhất). Trong bài nghe ta có thể nghe được tính từ “less well-adjusted” (kém khả năng điều chỉnh bản thân) nhưng tính cách này không ứng với bất kì tính từ nào được cho trong bảng. Sau đó, ta lại nghe “some studies claimed that they were thought to be good at nurturing” (một số nghiên cứu cho rằng chúng được xem là rất giỏi trong việc chăm sóc), “nurturing” đồng nghĩa với \"caring” được cho trên báng tính cách, vì vậyta chọn đáp án G."}, "22": {"answer_label": "22.\tF", "quote": "• There isn’t such a clear picture for middle children but one traits that a lot of studies mention is that they are easier to get on with than older or younger siblings.\n•   hmm, generally eager to please and helpful although that’s certainly not accurate as far as my family goes. My middle brother was a nightmare, always causing fights and envious of whatever I had.", "explain": "Câu hỏi: (như trên)\nKeywords được paraphrase:\nCác keyword trong câu hỏi cần chú ý là “findings of previous research” (kết quả của những nghiên cứu trước đó). Khi nghe chúng ta cũng cần tập trung vào tính từ mô tả \"personality trait’’ (đặc điểm tính cách) của từng đổi tượng, sau đó so sánh với các tính cách được đánh kí tự cho trong bảng.\nGiải thích đáp án:\nTa nghe được trong bài \"one traits that a lot of studies mention is that they are easier to get on with than older or younger siblings”. \"Get on with” (hòa thuận với) gần nghĩa với “co-operative” (chịu hợp tác) trong bàng tính cách. Vì vậy, ta chọn đáp án F Ngoài ra sau đó người nói còn nói thêm các tính từ như \"eager to please” (có xu hướng làm hài lòng) và \"helpful” (hay giúp đỡ) cũng củng cố cho đặc điểm này."}, "23": {"answer_label": "23.\tA", "quote": "... I’m the youngest in my family and I don’t recognize myself in any of the studies I’ve read about. I’m supposed to have been a sociable and confident child who made friends easily but I was actually terribly shy.", "explain": "Câu hỏi: (như trên)\nKeywords được paraphrase:\nCác keyword trong câu hói cần chú ý là “findings of previous research” (kết quả của những nghiên cứu trước đó). Khi nghe chúng ta cũng cần tập trung vào tính từ mô tả “personality trait” (đặc điểm tính cách) của từng đối tượng, sau đó so sánh với các tính cách được đánh kí tự cho trong bảng.\nGiải thích đáp án:\nNgười nói bắt dầu bằng ‘Tm the youngest in my family and I don’t recognize myself in any of the studies I’ve read about.” (Tôi là người trẻ nhất trong nhà và tôi không nhận ra được bản thân mình qua bất cứ nghiên cứu nào mà tôi từng đọc qua). Sau đó ta có thể thấy câu phía sau sử dụng cẩu trúc “be supposed to” (lẽ ra phải), Tm supposed to have been a sociable and confident child who made friends easily” (tôi lẽ ra (theo nghiên cứru) phải là một đứa trẻ thích giao du kết bạn và tự tin, đứa mà dễ dàng kết bạn). Dù trong câu này không còn nói về nghiên cứu nhưng cấu trúc “be supposed to” vẫn giúp ta hiểu được nội dung của đoạn này vẫn là về những tính cách mà nghiên cứu kết luận về đứa trẻ nhỏ tuổi nhất. Và các từ sociable, confident sẽ tương đương với “outgoing” (hướng ngoại)."}, "24": {"answer_label": "24.\tE", "quote": "• There have been hundreds of studies on twins but mostly about nurture versus nature.\n•  There was one on personality which said that a twin is likely to be shy in social situations because they always have their twin around to depend on for support\n•  My cousins were like that when they were small. They were only interested in each other and found it hard to engage with other kids. They’re fine now though.", "explain": "Câu tói: (như trên)\nKeywords được paraphrase:\nCác keyword trong câu hỏi cần chú ý là “findings of previous research” (kết quả của những nghiên cứu trước đó). Khi nghe chúng ta cũng cần tập trung vào tính từ mô tả “personality trait” (đặc điểm tính cách) của từng đối tượng, sau đó so sánh với các tính cách được đánh kí tự cho trong bảng.\nGiải thích đáp án:\nKhi nói về các nghiên cứu trên “twins” (các cặp sinh đôi), ta có thể nghe \"a twin is likely to be shy in social situations” (một cặp sinh đôi nhiều khả năng sẽ cảm thấy ngại ngùng trong các tình huống xã hội). Đây là một tính cách tương đương với từ “introverted” (hướng nội) trên bảng câu hỏi."}, "25": {"answer_label": "25. B", "quote": "•\tOnly children have had a really bad press. A lot of studies have branded them as loners who think the world revolves around them because they’ve never had to fight for their parents’ attention.\n•\tThat does seem a bit harsh.", "explain": "Câu tói: (như trên)\nKeywords được paraphrase:\nCác keyword trong câu hỏi cần chú ý là “findings of previous research” (kết quá của những nghiên cứu trước đó). Khi nghe chúng ta cũng cần tập trung vào tính từ mô tả \"personality trait” (đặc điểm tính cách) của từng đối tượng, sau đó so sánh với các tính cách được đánh kí tự cho trong báng.\nGiải thích đáp án:\nĐoạn tót đầu cho câu hỏi này có thể được nhận biết qua từ khóa “Only children” trong bài nghe. Sau đó, ta nghe được “ A lot of studies have branded them as loners who think the world revolves around them” (Nhiều nghiên cứu đã cho rằng chúng là những tó cô đọc mà luôn nghĩ rằng thế giới xoay quay bản thân mình). Mô tả này tương đương với “selfish” (ích kỉ, chỉ nghĩ cho bản thân) trong bảng câu hỏi.\nNgoài ra, ta cũng có thể nghe được từ “attention” (sự chú ý). Đây là một từ bẫy khiến ta dễ chọn nhầm thành câu D nếu không thực sự hiểu rõ nghĩa. Bài nghe nói rằng “...they’ve never had to fight for their parents’ attention” (chúng chưa bao giờ phái đấu tranh giành lấy sự chú ý của bố mẹ), điều này trái với “attention-seeker” (người tìm kiếm sự chú ý) có trong bảng câu hỏi."}, "26": {"answer_label": "26.\tC", "quote": "• One category I hadn’t considered before was children with much older siblings. A couple of studies mentioned that these children grow up more quickly and are expected to do basic", "explain": "Câu tói: (như trên)\nKeywords được paraphrase:\nCác keyword trong câu hỏi cần chú ý là “findings of previous research” (kết quá của những nghiên cứui trước đó). Khi nghe chúng ta cũng cần tập trung vào tính từ mô tả\nthings for themselves like getting dressed.\n• I can see how that might be true although I expect they’re sometimes the exact opposite - playing the baby role or clamoring for special treatment.\"personality trait” (đặc điểm tính cách) của từng đổi tượng, sau đó so sánh với các tính cách được đánh kí tự cho trong bảng.\nGiải thích đáp án:\nĐoạn thông tin cho câu hỏi tót dầu khi ta nghe được từ khóa \"children with much older siblings” (trẻ em với những anh ch em lớn tuổi hơn rất nhiếu so với chúng). Sau đó, ta nghe được “A couple of studies mentioned that these children grow up more quickly and are expected to do basic things for themselves like getting dressed” (một vài nghiên cứu đã chỉ ra rang những đứa trẻ này lớn lên nhanh chóng và được mong đợi sẽ có thể làm những việc cơ bàn như thay đồ). Đoạn mô tả này tương đương với tính cách \"indepedent” (tự lập) trong báng câu hỏi."}, "27": {"answer_label": "27. C", "quote": "• Some of the old research into therelationship between birth order and academic achievement have been proved to be accurate though. Performances and intelligence tests decline slightly from the eldest child to his or her younger siblings. This has been proved in lots of recent studies.\n• yes, but what many of them didn’t take into consideration was family size. The more the siblings there are, the more likely of the family is to have a low socioeconomic status which can also account for differences between siblings in academic performance.\n• The oldest boy might be given more opportunities than his younger sisters for example.", "explain": "Câu hỏi:\n27.\tWhat do the speakers say about the evidence relating to birth order and academic success?\nA.\tThere is conflicting evidence about whether oldest children perform best in intelligence tests.\nB.\tThere is little doubt that birth order has less influence on academic achievement than socio-economic status.\nC.\tSome studies have neglected to include important factors such as family size.\nKeywords được paraphrase:\nGạch chân các keyword \"evidence” (bằng chứng) \"birth order” (thứ tự sinh) và “academic success” (thành công trong học tập). Câu hỏi yêu câu ta nghe về thông tin mà người nói trình bày, nhận xét về các bằng\n• Exactly... chứng liên quan đến thứ tự sinh và sự thành công trong học tập.\nGiải thích đáp án:\nĐoạn thông tin cần tập trung khi ta nghe được \"the relationship between birth order and academic achievement” (mối quan hệ giữa thứ tự sinh và thành tựu học tập). Từ đó, ta có thể nghe được “Performances and intelligence tests declined slightly from the eldest child to his or her younger siblings.” (Hiệu suất và các bài kiểm tra trí thông minh sụt giảm nhẹ từ đứa trẻ lớn tuổi nhất đến những người em nhỏ hơn). Đến đây, ta vẫn chưa chọn được đáp án đúng vì theo câu A. ta phải có những bằng chứng mâu thuẫn nhau “conflicting evidence” và câu B. phải có sự so sánh “less influence...than” và câu c phải có sự bỏ sót “neglect”. Tiếp theo ta nghe được “what many of them didn’t take into consideration was family size.” (Điều mà nhiều nghiên cứu đã không xem xét là kích cỡ gia đình). Như vậy lúc này ta chọn được đáp án c."}, "28": {"answer_label": "28. A", "quote": "•\tBut the main reason for the marginally higher academic performance of oldest children is quite surprising I think. It’s not only that they benefit intellectually from extra attention at a young age which I would have expected. It’s that they benefit from being teachers for their younger siblings by verbalizing processes.\n•\tRight, and this gives this status and confidence which again contributes a small way to better performance.", "explain": "Câu hỏi:\n28.\tWhat does Ruth think is surprising about the difference in oldest children’s academic performance?\nA.\tIt is mainly thanks to their roles as teachers for their younger siblings.\nB.\tThe advantages they have only lead to a slightly higher level of achievement.\nC.\tThe extra parental attention they receive at a young age makes little difference.\nKeywords được paraphrase:\nKeyword “Ruth think” (Ruth nghĩ rằng) yêu cầu chúng ta chỉ nên tập trung vào quan điểm của Ruth. Câu hỏi yêu cầu chúng ta nghe điều mà Ruth nghĩ là ngạc nhiên về sự khác biệt về kết quả học tập của những đứa trẻ lớn tuồi nhất.\nGiải thích đáp án:\nĐáp án đúng là A, ứng với trong bài nghe \"It’s that they benefit from being teachers for their younger siblings” (Đó là vì chúng hưởng lợi từ việc là những thầy/cô giáo cho những đứa em nhó tuổi hơn).\nTa cũng nghe qua keyword “extra attention” (sự chú ý nhiều hơn) trong bài ứng với đáp án c nhưng ta không chọn đáp án c vì đáp án này nói “extra attention...makes little difference” (sự chú ý nhiều hơn này tạo ít sự khác biệt), trái với ý của bài nghe là đang tìm lý do chính dẫn đến sự khác biệt trong kct quá học tập của trẻ em lớn tuổi nhất."}, "29": {"answer_label": "29 & 30 B & D", "quote": "• So would you say sibling rivalry has been a useful thing for you?\n• I think so, my younger brother was incredibly annoying and we fought a lot but I think this has made me a stronger person. I know how to defend myself. We had some terrible arguments and I would have died rather than apologized to him but we had to put up with each other and most of the time we coexisted amicably enough.\n• Yes, my situation was pretty similar, but I don’t think having two older brothers made me any less selfish. I was never prepared to let my brothers use any of my stuffs.", "explain": "Câu hỏi:\nQuestions 29-30: Which Two experience of sibling rivalry do the speakers agree has been valuable for them?\nA.\tLearning to share\nB.\tLearning to stand up for oneself.\nC.\tLearning to be a good loser\nD.\tLearning to be tolerant.\nE.\tLearning to say sorry\nKeywords được paraphrase:\nTa can gạch chân các keywords “sibling rivalry” (mâu thuẫn anh chị em), “speakers agree” (người nói đồng ý với nhau) và “valuable” (quý báu) để hiểu rõ nội dung câu hỏi.\nGiải thích đáp án:\nPhần thông tin cho câu hỏi bắt đầu khi một người hỏi “would you say sibling rivalry has been a useful thing for you?” (Bạn có nghĩ rằng mâu thuẫn giữa anh chị em là một điều có ích cho bạn?). Sau đó ta có thể nghe được “I think this has made me a stronger person.” (Tôi nghĩ điều này đã khiến tôi trò thành một người mnh mẽ hơn) và ‘‘I know how to defend myself” (Tôi biết cách để bào vệ bản thân tôi). Điều này tương ứng với đáp án B “learning to stand up for oneself” (học cách bảo vệ bản thân). Cụm từ “stand up for” đồng nghĩa với \"defend”.\nTiếp sau đó, ta nghe được “we had to put up with each other” (Chúng tôi đã phải chịu đựng lẫn nhau) và “most of the time we coexisted amicably” (hầu hết thời gian thì chúng tôi cùng tồn tại hài hòa với nhau). 2 câu này tương đương ý nghĩa với đáp án D. “learning to be tolerant” (học cách chịu đựng). Cụm từ “to put up with” đồng nghĩa với “to be tolerant”.\nLưu ý rằng ta cũng có thể nghe được từ “apologized” (xin lỗi) trong “I would have died rather than apologized to him” (Tôi thà chết còn hơn xin lỗi anh ta). Đây là bẫy có thể khiển người nghe chọn nhầm đáp án E. “learning to say sorry”. Tuy nhiên ở đây ta có thể thấy người nói không học được bài học gì về việc nói lời xin lỗi."}, "30": {"answer_label": "29 & 30 B & D", "quote": "• So would you say sibling rivalry has been a useful thing for you?\n• I think so, my younger brother was incredibly annoying and we fought a lot but I think this has made me a stronger person. I know how to defend myself. We had some terrible arguments and I would have died rather than apologized to him but we had to put up with each other and most of the time we coexisted amicably enough.\n• Yes, my situation was pretty similar, but I don’t think having two older brothers made me any less selfish. I was never prepared to let my brothers use any of my stuffs.", "explain": "Câu hỏi:\nQuestions 29-30: Which Two experience of sibling rivalry do the speakers agree has been valuable for them?\nA.\tLearning to share\nB.\tLearning to stand up for oneself.\nC.\tLearning to be a good loser\nD.\tLearning to be tolerant.\nE.\tLearning to say sorry\nKeywords được paraphrase:\nTa can gạch chân các keywords “sibling rivalry” (mâu thuẫn anh chị em), “speakers agree” (người nói đồng ý với nhau) và “valuable” (quý báu) để hiểu rõ nội dung câu hỏi.\nGiải thích đáp án:\nPhần thông tin cho câu hỏi bắt đầu khi một người hỏi “would you say sibling rivalry has been a useful thing for you?” (Bạn có nghĩ rằng mâu thuẫn giữa anh chị em là một điều có ích cho bạn?). Sau đó ta có thể nghe được “I think this has made me a stronger person.” (Tôi nghĩ điều này đã khiến tôi trò thành một người mnh mẽ hơn) và ‘‘I know how to defend myself” (Tôi biết cách để bào vệ bản thân tôi). Điều này tương ứng với đáp án B “learning to stand up for oneself” (học cách bảo vệ bản thân). Cụm từ “stand up for” đồng nghĩa với \"defend”.\nTiếp sau đó, ta nghe được “we had to put up with each other” (Chúng tôi đã phải chịu đựng lẫn nhau) và “most of the time we coexisted amicably” (hầu hết thời gian thì chúng tôi cùng tồn tại hài hòa với nhau). 2 câu này tương đương ý nghĩa với đáp án D. “learning to be tolerant” (học cách chịu đựng). Cụm từ “to put up with” đồng nghĩa với “to be tolerant”.\nLưu ý rằng ta cũng có thể nghe được từ “apologized” (xin lỗi) trong “I would have died rather than apologized to him” (Tôi thà chết còn hơn xin lỗi anh ta). Đây là bẫy có thể khiển người nghe chọn nhầm đáp án E. “learning to say sorry”. Tuy nhiên ở đây ta có thể thấy người nói không học được bài học gì về việc nói lời xin lỗi."}}, "script_full": [{"speaker": "RUTH", "text": "Ed, how are you getting on with the reading for our presentation next week?", "qids": []}, {"speaker": "ED", "text": "Well, OK, Ruth - but there's so much of it.", "qids": []}, {"speaker": "RUTH", "text": "I know, I hadn't realised birth order was such a popular area of research.", "qids": []}, {"speaker": "ED", "text": "But the stuff on birth order and personality is mostly unreliable. From what I've been reading a lot of the claims about how your position in the family determines certain personality traits are just stereotypes, with no robust evidence to support them.", "qids": []}, {"speaker": "RUTH", "text": "OK, but that's an interesting point - we could start by outlining what previous research has shown. There are studies going back over a hundred years.", "qids": []}, {"speaker": "ED", "text": "Yeah - so we could just run through some of the typical traits. Like the consensus seems to be that oldest children are generally less well-adjusted because they never get over the arrival of a younger sibling.", "qids": ["21"]}, {"speaker": "RUTH", "text": "Right, but on a positive note, some studies claimed that they were thought to be good at nurturing - certainly in the past when people had large families they would have been expected to look after the younger ones.", "qids": []}, {"speaker": "ED", "text": "There isn't such a clear picture for middle children - but one trait that a lot of the studies mention is that they are easier to get on with than older or younger siblings.", "qids": []}, {"speaker": "RUTH", "text": "Generally eager to please and helpful although that's certainly not accurate as far as my family goes - my middle brother was a nightmare - always causing fights and envious of whatever I had.", "qids": ["22"]}, {"speaker": "ED", "text": "As I said - none of this seems to relate to my own experience. I'm the youngest in my family and I don't recognise myself in any of the studies I've read about. I'm supposed to have been a sociable and confident child who made friends easily - but I was actually terribly shy.", "qids": ["23"]}, {"speaker": "RUTH", "text": "Really? That's funny. There have been hundreds of studies on twins but mostly about nurture versus nature...", "qids": []}, {"speaker": "ED", "text": "There was one on personality, which said that a twin is likely to be quite shy in social situations because they always have their twin around to depend on for support.", "qids": ["24"]}, {"speaker": "RUTH", "text": "My cousins were like that when they were small - they were only interested in each other and found it hard to engage with other kids. They're fine now though.", "qids": []}, {"speaker": "ED", "text": "Only children have had a really bad press - a lot of studies have branded them as loners who think the world revolves around them because they've never had to fight for their parents' attention.", "qids": ["25"]}, {"speaker": "RUTH", "text": "That does seem a bit harsh. One category I hadn't considered before was children with much older siblings - a couple of studies mentioned that these children grow up more quickly and are expected to do basic things for themselves like getting dressed.", "qids": ["26"]}, {"speaker": "ED", "text": "I can see how that might be true although I expect they're sometimes the exact opposite playing the baby role and clamouring for special treatment.", "qids": []}, {"speaker": "RUTH", "text": "What was the problem with most of these studies, do you think?", "qids": []}, {"speaker": "ED", "text": "I think it was because in a lot of cases data was collected from only one sibling per family, who rated him or herself and his or her siblings at the same time.", "qids": []}, {"speaker": "RUTH", "text": "Mmm. Some of the old research into the relationship between birth order and academic achievement has been proved to be accurate though. Performances in intelligence tests decline slightly from the eldest child to his or her younger siblings. This has been proved in lots of recent studies.", "qids": []}, {"speaker": "ED", "text": "Yes. Although what many of them didn't take into consideration was family size. The more siblings there are, the likelier the family is to have a low socio-economic status - which can also account for differences between siblings in academic performance.", "qids": ["27"]}, {"speaker": "RUTH", "text": "The oldest boy might be given more opportunities than his younger sisters, for example.", "qids": []}, {"speaker": "ED", "text": "Exactly.", "qids": []}, {"speaker": "RUTH", "text": "But the main reason for the marginally higher academic performance of oldest children is quite surprising, I think. It's not only that they benefit intellectually from extra attention at a young age - which is what I would have expected. It's that they benefit from being teachers for their younger siblings, by verbalising processes.", "qids": ["28"]}, {"speaker": "ED", "text": "Right, and this gives them status and confidence, which again contribute, in a small way, to better performance.", "qids": []}, {"speaker": "RUTH", "text": "So would you say sibling rivalry has been a useful thing for you?", "qids": []}, {"speaker": "ED", "text": "I think so my younger brother was incredibly annoying and we fought a lot but I think this has made me a stronger person. I know how to defend myself. We had some terrible arguments and I would have died rather than apologise to him but we had to put up with each other and most of the time we co-existed amicably enough.", "qids": ["29", "30"]}, {"speaker": "RUTH", "text": "Yes, my situation was pretty similar. But I don't think having two older brothers made me any less selfish - I was never prepared to let my brothers use any of my stuff...", "qids": ["29", "30"]}, {"speaker": "ED", "text": "That's perfectly normal, whereas ...", "qids": []}], "groups": [{"type": "matching", "qids": ["21", "22", "23", "24", "25", "26"], "box_title": "Personality Traits", "box": {"A": "outgoing", "B": "selfish", "C": "independent", "D": "attention-seeking", "E": "introverted", "F": "co-operative", "G": "caring", "H": "competitive"}, "stems": [{"qid": "21", "prompt": "the eldest child"}, {"qid": "22", "prompt": "a middle child"}, {"qid": "23", "prompt": "the youngest child"}, {"qid": "24", "prompt": "a twin"}, {"qid": "25", "prompt": "an only child"}, {"qid": "26", "prompt": "a child with much older siblings"}], "header": "Choose SIX answers from the box and write the correct letter, A-H, next to Questions 21-26."}, {"type": "choice", "qids": ["27"], "prompt": "What do the speakers say about the evidence relating to birth order and academic success?", "options": {"A": "There is conflicting evidence about whether oldest children perform best in intelligence tests.", "B": "There is little doubt that birth order has less influence on academic achievement than socio-economic status.", "C": "Some studies have neglected to include important factors such as family size."}, "multi": false, "header": "Questions 27 and 28 Choose the correct letter, A, B or C."}, {"type": "choice", "qids": ["28"], "prompt": "What does Ruth think is surprising about the difference in oldest children’s academic performance?", "options": {"A": "It is mainly thanks to their roles as teachers for their younger siblings.", "B": "The advantages they have only lead to a slightly higher level of achievement.", "C": "The extra parental attention they receive at a young age makes little difference."}, "multi": false, "header": null}, {"type": "choice", "qids": ["29", "30"], "prompt": "Which TWO experiences of sibling rivalry do the speakers agree has been valuable for them?", "options": {"A": "learning to share", "B": "learning to stand up for oneself", "C": "learning to be a good loser", "D": "learning to be tolerant", "E": "learning to say sorry"}, "multi": true, "header": "Questions 29 and 30 Choose TWO letters, A-E."}]}, {"part": 4, "kind": "notes", "title": "Stoicism", "instructions": null, "audio": "audio/test10/part4.mp3", "answers": {"31": "spice(s)", "32": "colony / settlement", "33": "fat", "34": "head", "35": "movement", "36": "balance / balancing", "37": "brain", "38": "smell", "39": "rats", "40": "forest"}, "explanations": {"31": {"answer_label": "31. practical", "quote": "Specifically, I am referring to Stoicism, which, in my opinion, is the most practical of all philosophies and therefore the most appealing.", "explain": "Câu hỏi:\nWrite ONE WORD ONLY for each answer.\nStoicism is still relevant today because of its 31\t\nappeal.\nKeywords được paraphrase:\nappeal - appealing\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một tính từ. Câu bên chỉ ra rằng chủ nghĩa khắc kỷ (stoicism) là triết lý thực tế - 'practical' nhất trong tất cả, và vì vậy có sức lôi cuốn lớn nhất."}, "32": {"answer_label": "32. publication", "quote": "Amazingly, we still have access to these ideas, despite the fact that the most famous Stoics never wrote anything down for publication.", "explain": "Câu hỏi:\nThe Stoics' ideas are surprisingly well known, despite not being intended for 32 ...\nKeywords được paraphrase:\nsurprisingly - amazingly\nwell known - have access to\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Câu bên chỉ ra rằng chúng ta vẫn có thể tiếp cận đến những ý tưởng này mặc dù những nhà khắc kỷ nổi tiếng chưa bao giờ viết nhằm mục đích xuất bản - 'publication'."}, "33": {"answer_label": "33. choices", "quote": "In the words of Epictetus: “external events I cannot control, but the choices I make with regard to them, I do control.”", "explain": "Câu hỏi:\nEpictetus said that external events cannot be controlled but the 33\tpeople make in response\ncan be controlled.\nKeywords được paraphrase:\ncannot be controlled - cannot control in response - with regard to\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Epictetus nói rằng ông ấy không thể điều khiển được những sự kiện ngoại cảnh, nhưng việc đưa ra lựa chọn - 'choices' để đáp lại thì có thể điều khiển được."}, "34": {"answer_label": "34. negative", "quote": "...Nassim Nicholas Taleb defines a Stoic as someone who has a different perspective on experiences which most of us would see as wholly negative.", "explain": "Câu hỏi:\nA Stoic is someone who has a different view on experiences which others would consider as 34\t\nKeywords được paraphrase:\nview - perspective consider - see\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một tính từ. Câu bên chỉ ra rằng người khắc kỷ là người có quan điểm khác biệt về những trải nghiệm mà đa số chúng ta cho là tiêu cực - 'negative'."}, "35": {"answer_label": "35. play", "quote": "George Washington was introduced to Stoicism by his neighbours at age seventeen, and later, put on a play based on the life of Cato to inspire his men.", "explain": "Câu hỏi:\nGeorge Washington organised a 35\tabout Cato\nto motivate his men.\nKeywords được paraphrase: organised - put on motivate - inspire\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Câu bên chỉ ra rằng chủ nghĩa khắc kỷ được giới thiệu đến George Washington bởi những người hàng xóm của ông ấy vào năm 17 tuổi, và sau đó ông đã sắp đặt một vở kịch - 'play' dựa trên cuộc đời của Cato để truyền cảm hứng cho những người của ông ấy."}, "36": {"answer_label": "36. capitalism", "quote": "The economist Adam Smith's theories on capitalism were significantly influenced by the Stoicism.", "explain": "Câu hỏi:\nAdam Smith's ideas on 36\twere influenced by\nStoicism.\nKeywords được paraphrase:\nideas - theories\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Câu bên chỉ ra rằng những ý tưởng của Adam Smith về chủ nghĩa tư bản - 'capitalism' chịu ảnh hưởng rất lớn từ chủ nghĩa khắc kỷ."}, "37": {"answer_label": "37. depression", "quote": "Stoicism had a profound influence on Albert Ellis, who invented Cognitive Behaviour Therapy ... It's most commonly used to treat depression.", "explain": "Câu hỏi:\nCognitive Behaviour Therapy (CBT)\n- the treatment for 37\tis based on ideas from\nStoicism\nKeywords được paraphrase:\ntreatment - treat\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Câu bên chỉ ra rằng phương pháp CBT được phát minh bởi Albert Ellis dựa trên chủ nghĩa khắc kỷ, và nó giúp chữa bệnh trầm cảm - 'depression'."}, "38": {"answer_label": "38. logic", "quote": "The idea is that we can take control of our lives by challenging the irrational beliefs that create our faulty thinking, symptoms and behaviours by using logic instead.", "explain": "Câu hỏi:\nCognitive Behaviour Therapy (CBT)\n- people learn to base their thinking on 38\t\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Câu bên chỉ ra rằng chúng ta có thể làm chủ cuộc sống bằng cách thách thức những đức tin phi lý dẫn đến những suy nghĩ lệch lạc, triệu chứng và hành vi bằng cách sử dụng sự lô-gíc - 'logic'."}, "39": {"answer_label": "39. opportunity", "quote": "... Stoics teach turning obstacles into opportunity. A lesson every business entrepreneur needs to learn.", "explain": "Câu hỏi:\nIn business, people benefit from Stoicism by identifying obstacles as 9\t\nKeywords được paraphrase: turning ... into ... - identifying ... as ...\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Câu bên chỉ ra rằng hững nhà khắc kỷ dạy rằng hãy biến những trở ngại thành cơ hội - 'opportunity’. Một bài học mà bất cứ chủ doanh nghiệp nào cũng cần phải học."}, "40": {"answer_label": "40. practice", "quote": "... studying Stoicism is as relevant today as it was 2,000 years ago, thanks to its brilliant insights into how to lead a good life. ... This is not as easy as it sounds and will require considerable practice.", "explain": "Câu hỏi:\nIt requires a lot of 40\tbut Stoicism can help\npeople to lead a good life.\nKeywords được paraphrase:\na lot of - considerable\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Đoạn bên chỉ ra rằng chủ nghĩa khắc kỷ có thể giúp con người điều khiển cuộc sống nhờ vào sự thấu hiểu tuyệt bời. Điều này là không dễ dàng và yêu cầu sự luyện tập - 'practice’ đáng kể."}}, "script_full": [{"speaker": null, "text": "Ancient philosophy is not just about talking or lecturing, or even reading long, dense books. In fact, it is something people have used throughout history - to solve their problems and to achieve their greatest triumphs.", "qids": []}, {"speaker": null, "text": "Specifically, I am referring to Stoicism, which, in my opinion, is the most practical of all philosophies and therefore the most appealing. Stoicism was founded in Ancient Greece by Zeno of Citium in the early 3rd century BC, but was practised by the likes of Epictetus, Cato, Seneca and Marcus Aurelius. Amazingly, we still have access to these ideas, despite the fact that the most famous Stoics never wrote anything down for publication. Cato definitely didn't. Marcus Aurelius never intended his Meditations to be anything but personal. Seneca's letters were, well, letters and Epictetus' thoughts come to us by way of a note-taking student.", "qids": ["31", "32"]}, {"speaker": null, "text": "Stoic principles were based on the idea that its followers could have an unshakable happiness in this life and the key to achieving this was virtue. The road to virtue, in turn, lay in understanding that destructive emotions, like anger and jealousy, are under our conscious control- they don't have to control us, because we can learn to control them. In the words of Epictetus: \"external events I cannot control, but the choices I make with regard to them, I do control\".", "qids": ["33"]}, {"speaker": null, "text": "The modern day philosopher and writer Nassim Nicholas Taleb defines a Stoic as someone who has a different perspective on experiences which most of us would see as wholly negative; a Stoic \"transforms fear into caution, pain into transformation, mistakes into initiation and desire into undertaking\". Using this definition as a model, we can see that throughout the centuries Stoicism has been practised in more recent history by kings, presidents, artists, writers and entrepreneurs.", "qids": ["34"]}, {"speaker": null, "text": "The founding fathers of the United States were inspired by the philosophy. George Washington was introduced to Stoicism by his neighbours at age seventeen, and later, put on a play based on the life of Cato to inspire his men. Thomas Jefferson kept a copy of Seneca beside his bed.", "qids": ["35"]}, {"speaker": null, "text": "Writers and artists have also been inspired by the stoics. Eugène Delacroix, the renowned French Romantic artist (known best for his painting Liberty Leading the People) was an ardent Stoic, referring to it as his \"consoling religion\".", "qids": []}, {"speaker": null, "text": "The economist Adam Smith's theories on capitalism were significantly influenced by the Stoicism that he studied as a schoolboy, under a teacher who had translated Marcus Aurelius' works.", "qids": ["36"]}, {"speaker": null, "text": "Today's political leaders are no different, with many finding their inspiration from the ancient texts. Former US president Bill Clinton rereads Marcus Aurelius every single year, and many have compared former President Obama's calm leadership style to that of Cato. Wen Jiabao, the former prime minister of China, claims that Meditations is one of two books he travels with and that he has read it more than one hundred times over the course of his life.", "qids": []}, {"speaker": null, "text": "Stoicism had a profound influence on Albert Ellis, who invented Cognitive Behaviour Therapy, which is used to help people manage their problems by changing the way that they think and behave. It's most commonly used to treat depression. The idea is that we can take control of our lives by challenging the irrational beliefs that create our faulty thinking, symptoms and behaviours by using logic instead.", "qids": ["37", "38"]}, {"speaker": null, "text": "Stoicism has also become popular in the world of business. Stoic principles can build the resilience and state of mind required to overcome setbacks because Stoics teach turning obstacles into opportunity. A lesson every business entrepreneur needs to learn.", "qids": ["39"]}, {"speaker": null, "text": "I would argue that studying Stoicism is as relevant today as it was 2,000 years ago, thanks to its brilliant insights into how to lead a good life. At the very root of the thinking, there is a very simple way of living control what you can and accept what you can't. This is not as easy as it sounds and will require considerable practice it can take a lifetime to master. The Stoics also believed the most important foundation for a good and happy life is not money, fame, power or pleasure, but having a disciplined and principled character - something which seems to resonate with many people today.", "qids": ["40"]}], "notes": ["Stoicism", "Stoicism is still relevant today because of its {{31}}appeal.", "Ancient Stoics", "• Stoicism was founded over 2,000 years ago in Greece.", "• The Stoics’ ideas are surprisingly well known, despite not being intended for {{32}}", "Stoic principles", "• Happiness could be achieved by leading a virtuous life.", "• Controlling emotions was essential.", "• Epictetus said that external events cannot be controlled but the", "{{33}} people make in response can be controlled.", "• A Stoic is someone who has a different view on experiences which others would", "consider as {{34}}", "The influence of Stoicism", "• George Washington organised a {{35}} about Cato to motivate", "his men.", "• The French artist Delacroix was a Stoic.", "• Adam Smith’s ideas on {{36}}were influenced by Stoicism.", "• Some of today’s political leaders are inspired by the Stoics.", "• Cognitive Behavior Therapy (CBT)", "- the treatment for {{37}}is based on ideas from Stoicism", "- people learn to base their thinking on {{38}}", "• In business, people benefit from Stoicism by identifying obstacles as", "{{39}}", "Relevance of Stoicism", "• It requires a lot of {{40}}but Stoicism can help people to lead a", "good life.", "• It teaches people that having a strong character is more important than anything else."]}]};
