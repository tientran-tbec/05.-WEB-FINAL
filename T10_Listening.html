<script>
(function(){
  const partsEl = document.getElementById('parts');
  const tabsEl = document.getElementById('tabs');

  function renderNotes(part){
    let html = '<div class="notes-block">';
    for(const rawLine of part.notes){
      const text = rawLine.trim();
      if(!text) continue;
      const isBlankLine = /\{\{\d+\}\}/.test(text);
      const isBulletLine = /^[–\-•]/.test(text);
      const isExample = /^example$/i.test(text);
      const rendered = text.replace(/\{\{(\d+)\}\}/g, (m, num) => {
        return `<span class="blank-num">${num}</span><input class="blank" type="text" data-part="${part.part}" data-q="${num}" autocomplete="off" spellcheck="false">`;
      });
      if(isExample){
        html += `<span class="subhead example-line">Example</span><br>`;
      } else if(isBlankLine){
        html += (isBulletLine ? '<span class="bullet">' : '<span>') + rendered + '</span><br>';
      } else if(isBulletLine){
        html += `<span class="bullet">${text}</span><br>`;
      } else if(text.split(' ').length <= 4){
        html += `<span class="subhead">${text}</span><br>`;
      } else {
        html += `<span class="example-line">${text}</span><br>`;
      }
    }
    html += '</div>';
    return html;
  }

  function renderMatching(g, part){
    let html = '<div class="qgroup" data-qids="' + g.qids.join(',') + '" data-mtype="matching">';
    if(g.image){
      html += `<img class="map-img" src="${g.image}" alt="${(g.box_title||'Map')}">`;
    }
    const boxEntries = Object.entries(g.box || {});
    if(boxEntries.length){
      html += '<div class="box-panel">';
      if(g.box_title) html += `<div class="box-title">${g.box_title}</div>`;
      for(const [letter, text] of boxEntries){
        html += `<div class="box-item"><b>${letter}</b><span>${text}</span></div>`;
      }
      html += '</div>';
    } else if(g.box_title){
      html += `<div class="box-title" style="margin-bottom:8px;font-weight:800;color:var(--navy);">${g.box_title}</div>`;
    }
    const letters = boxEntries.length ? boxEntries.map(([l]) => l) : (g.qids.length ? inferLetters(g) : []);
    for(const s of g.stems){
      html += `<div class="stem-row" data-q="${s.qid}"><span class="blank-num">${s.qid}</span><span class="stem-text">${s.prompt}</span>`;
      html += `<select data-part="${part.part}" data-q="${s.qid}"><option value="">--</option>`;
      for(const letter of letters){
        html += `<option value="${letter}">${letter}</option>`;
      }
      html += '</select></div>';
    }
    html += '</div>';
    return html;
  }

  function inferLetters(g){
    // No box text (e.g. a map where letters are drawn on the image) --
    // fall back to A..I so the dropdown offers every valid letter (some
    // maps go up to I, not just H).
    return ['A','B','C','D','E','F','G','H','I'];
  }

  function renderMcq(part){
    let html = '';
    for(const g of part.groups){
      if(g.header){
        html += `<div class="header-note">${g.header}</div>`;
      }
      if(g.type === 'matching'){
        html += renderMatching(g, part);
        continue;
      }
      const qidsLabel = g.qids.length>1 ? `${g.qids[0]}\u2013${g.qids[g.qids.length-1]}` : g.qids[0];
      html += `<div class="qgroup" data-qids="${g.qids.join(',')}" data-multi="${g.multi}">`;
      html += `<div class="prompt"><span class="blank-num">${qidsLabel}</span> ${g.prompt}</div>`;
      html += '<div class="opt-list">';
      for(const [letter, text] of Object.entries(g.options)){
        const inputType = g.multi ? 'checkbox' : 'radio';
        const name = g.multi ? `p${part.part}g${g.qids.join('_')}` : `p${part.part}q${g.qids[0]}`;
        html += `<label class="opt" data-letter="${letter}"><input type="${inputType}" name="${name}" value="${letter}" ${g.multi?`data-max="${g.qids.length}"`:''}>`+
                `<span><b>${letter}.</b> ${text}</span></label>`;
      }
      html += '</div></div>';
    }
    return html;
  }

  const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function fmtTime(t){
    t = Math.max(0, Math.round(t||0));
    const m = Math.floor(t/60), s = t%60;
    return `${m}:${String(s).padStart(2,'0')}`;
  }

  function buildScriptHtml(part){
    // part.script_full: the complete audioscript for this part, line by line, in order.
    // Lines whose "qids" array is non-empty are the lines where an answer's information
    // is actually said -- those get highlighted, tagged with the question number(s), and
    // (when time_seconds is known) get a jump button that seeks the script's own audio player.
    const lines = part.script_full || [];
    if(!lines.length) return '<p class="muted">No script data.</p>';
    return lines.map(l => {
      const spk = l.speaker ? `<span class="spk">${esc(l.speaker)}:</span> ` : '';
      let body = esc(l.text);
      if(l.qids && l.qids.length){
        const tags = l.qids.map(q => `<span class="qtag">Q${q}</span>`).join('');
        let jumpBtn = '';
        if(typeof l.time_seconds === 'number'){
          jumpBtn = `<button type="button" class="jump-btn" data-action="jump-audio" data-part="${part.part}" data-time="${l.time_seconds}" title="Jump to ${fmtTime(l.time_seconds)}">\u25b6 ${fmtTime(l.time_seconds)}</button>`;
        }
        body = `${jumpBtn}<mark class="hl">${body}</mark>${tags}`;
      }
      return `<p class="script-line">${spk}${body}</p>`;
    }).join('');
  }

  function buildExplanationsHtml(part){
    let html = '';
    const qids = [];
    if(part.kind === 'notes'){
      Object.keys(part.answers).sort((a,b)=>a-b).forEach(q=>qids.push(q));
    } else {
      part.groups.forEach(g=>g.qids.forEach(q=>qids.push(q)));
      qids.sort((a,b)=>a-b);
    }
    for(const q of qids){
      const e = part.explanations[q] || {};
      const ans = part.answers[q] || '';
      html += `<div class="expl-item"><div class="eq-head"><span class="qnum">C\u00e2u ${q}</span><span class="ans">${ans}</span></div>`;
      if(e.quote){
        html += `<div class="quote">"${e.quote.replace(/</g,'&lt;')}"</div>`;
      }
      html += `<div class="explain">${(e.explain||'').replace(/</g,'&lt;')}</div></div>`;
    }
    return html;
  }

  function gradeParts(part){
    let correct = 0, total = 0;
    if(part.kind === 'notes'){
      for(const [q, ans] of Object.entries(part.answers)){
        total++;
        const input = partsEl.querySelector(`input.blank[data-part="${part.part}"][data-q="${q}"]`);
        if(!input) continue;
        const val = input.value.trim().toLowerCase();
        const ok = val === String(ans).trim().toLowerCase();
        input.classList.remove('correct','incorrect');
        input.classList.add(ok ? 'correct' : 'incorrect');
        if(ok) correct++;
        if(!ok){
          input.title = `Correct answer: ${ans}`;
        }
      }
    } else {
      for(const g of part.groups){
        if(g.type === 'matching'){
          for(const s of g.stems){
            total++;
            const sel = partsEl.querySelector(`.part[data-part="${part.part}"] select[data-q="${s.qid}"]`);
            if(!sel) continue;
            const correctLetter = part.answers[s.qid];
            const ok = sel.value === correctLetter;
            sel.classList.remove('correct','incorrect');
            sel.classList.add(ok ? 'correct' : 'incorrect');
            if(ok) correct++;
            else sel.title = `Correct answer: ${correctLetter}`;
          }
          continue;
        }
        const groupEl = partsEl.querySelector(`.part[data-part="${part.part}"] .qgroup[data-qids="${g.qids.join(',')}"]`);
        if(!groupEl) continue;
        const inputs = groupEl.querySelectorAll('input');
        const correctLetters = g.qids.map(q => part.answers[q]);
        const selected = Array.from(inputs).filter(i=>i.checked).map(i=>i.value);
        groupEl.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','incorrect'));
        inputs.forEach(inp=>{
          const label = inp.closest('.opt');
          const letter = label.dataset.letter;
          if(correctLetters.includes(letter)) label.classList.add('correct');
          else if(inp.checked) label.classList.add('incorrect');
        });
        if(g.multi){
          total += g.qids.length;
          const sortedSel = [...selected].sort();
          const sortedCorrect = [...correctLetters].sort();
          if(sortedSel.length===sortedCorrect.length && sortedSel.every((v,i)=>v===sortedCorrect[i])){
            correct += g.qids.length;
          } else {
            correctLetters.forEach(cl=>{ if(selected.includes(cl)) correct++; });
          }
        } else {
          total += 1;
          if(selected[0] === correctLetters[0]) correct += 1;
        }
      }
    }
    return {correct, total};
  }

  function renderPart(part, idx){
    const wrap = document.createElement('div');
    wrap.className = 'part' + (idx===0 ? ' active' : '');
    wrap.dataset.part = part.part;

    const card = document.createElement('div');
    card.className = 'card';
    let inner = `<div class="part-bar"><span>PART ${part.part}${part.title ? ' — ' + part.title : ''}</span><span class="title">${part.kind==='notes'?'Note Completion':'Multiple Choice'}</span></div>`;
    inner += `<div class="card-body">`;
    if(part.instructions) inner += `<div class="instructions">${part.instructions}</div>`;
    inner += `<div class="audio-box"><span class="icon">\ud83c\udfa7</span><span class="label">Part ${part.part} Audio</span><audio controls preload="none" src="${part.audio}"></audio></div>`;
    inner += part.kind === 'notes' ? renderNotes(part) : renderMcq(part);
    inner += `<div class="actions">
        <button class="primary" data-action="check">Check Answers</button>
        <button class="ghost" data-action="reset">Reset</button>
        <span class="score-pill" data-role="score" style="display:none;"></span>
      </div>
      <div class="actions" style="margin-top:0;">
        <button class="ghost" data-action="toggle-script">Show Script</button>
        <button class="ghost" data-action="toggle-expl">Show Answers &amp; Explanations</button>
      </div>
      <div class="toggle-section" data-role="script-section">
        <h2 style="font-size:15px;color:var(--navy);">Full Script — Part ${part.part}</h2>
        <p class="script-note">Listen and follow along below — highlighted lines show where each answer is said${part.script_full && part.script_full.some(l=>typeof l.time_seconds==='number') ? '; tap a time button to jump straight there.' : '.'}</p>
        <div class="audio-box"><span class="icon">\ud83c\udfa7</span><span class="label">Part ${part.part} Audio</span><audio controls preload="none" src="${part.audio}" data-role="script-audio"></audio></div>
        <div class="script-text">${buildScriptHtml(part)}</div>
      </div>
      <div class="toggle-section" data-role="expl-section">
        <h2 style="font-size:15px;color:var(--navy);">Answers &amp; Explanations — Part ${part.part}</h2>
        ${buildExplanationsHtml(part)}
      </div>
      </div>`;
    card.innerHTML = inner;
    wrap.appendChild(card);

    card.querySelectorAll('.qgroup[data-multi="true"]').forEach(groupEl => {
      const boxes = Array.from(groupEl.querySelectorAll('input[type="checkbox"]'));
      if(!boxes.length) return;
      const max = parseInt(boxes[0].dataset.max, 10) || 2;
      const sync = () => {
        const checkedCount = boxes.filter(b=>b.checked).length;
        boxes.forEach(b => { if(!b.checked) b.disabled = checkedCount >= max; });
      };
      boxes.forEach(b => b.addEventListener('change', sync));
    });

    card.querySelector('[data-action="check"]').addEventListener('click', () => {
      const {correct, total} = gradeParts(part);
      const pill = card.querySelector('[data-role="score"]');
      pill.style.display = 'inline-block';
      pill.textContent = `Score: ${correct} / ${total}`;
      const tabBtn = tabsEl.querySelector(`[data-tab="${part.part}"]`);
      if(tabBtn) tabBtn.classList.add('done');
    });
    card.querySelector('[data-action="reset"]').addEventListener('click', () => {
      card.querySelectorAll('input[type="text"]').forEach(i=>{i.value='';i.classList.remove('correct','incorrect');i.title='';});
      card.querySelectorAll('input[type="radio"],input[type="checkbox"]').forEach(i=>{i.checked=false;i.disabled=false;});
      card.querySelectorAll('select').forEach(s=>{s.value='';s.classList.remove('correct','incorrect');s.title='';});
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','incorrect'));
      card.querySelector('[data-role="score"]').style.display='none';
      const tabBtn = tabsEl.querySelector(`[data-tab="${part.part}"]`);
      if(tabBtn) tabBtn.classList.remove('done');
    });
    card.querySelector('[data-action="toggle-script"]').addEventListener('click', (e) => {
      const sec = card.querySelector('[data-role="script-section"]');
      sec.classList.toggle('open');
      e.target.textContent = sec.classList.contains('open') ? 'Hide Script' : 'Show Script';
    });
    card.querySelector('[data-action="toggle-expl"]').addEventListener('click', (e) => {
      const sec = card.querySelector('[data-role="expl-section"]');
      sec.classList.toggle('open');
      e.target.textContent = sec.classList.contains('open') ? 'Hide Answers & Explanations' : 'Show Answers & Explanations';
    });
    card.querySelectorAll('[data-action="jump-audio"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const t = Number(btn.dataset.time) || 0;
        const audio = card.querySelector('[data-role="script-audio"]');
        if(!audio) return;
        audio.currentTime = t;
        audio.play();
      });
    });

    return wrap;
  }

  TEST_DATA.parts.forEach((part, idx) => {
    const tabBtn = document.createElement('button');
    tabBtn.className = 'tab-btn' + (idx===0 ? ' active' : '');
    tabBtn.dataset.tab = part.part;
    tabBtn.innerHTML = `<span class="dot"></span>Part ${part.part}`;
    tabBtn.addEventListener('click', () => {
      partsEl.querySelectorAll('audio').forEach(a => { a.pause(); });
      tabsEl.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      partsEl.querySelectorAll('.part').forEach(p=>p.classList.remove('active'));
      tabBtn.classList.add('active');
      partsEl.querySelector(`.part[data-part="${part.part}"]`).classList.add('active');
      window.scrollTo({top:0, behavior:'smooth'});
    });
    tabsEl.appendChild(tabBtn);
    partsEl.appendChild(renderPart(part, idx));
  });
})();
</script>
</body>
</html>
