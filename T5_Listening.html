 []}, {"speaker": "BREDA", "text": "So what was the theme of the second competition?", "qids": []}, {"speaker": "DAN", "text": "Well, my university was on the coast and that area gets a lot of beautiful sunsets, so that was the theme.", "qids": ["6"]}, {"speaker": "BREDA", "text": "Oh, sunsets, that's a great theme.", "qids": []}, {"speaker": "DAN", "text": "Yes. The instructions were to capture the clouds as well - it couldn't just be blue sky and a setting sun.", "qids": []}, {"speaker": "BREDA", "text": "Sure, cause they give you all those amazing pinks and purples.", "qids": []}, {"speaker": "DAN", "text": "Yeah and I thought I'd done that well, but the feedback was that I should have waited a bit longer to get the shot.", "qids": ["7"]}, {"speaker": "BREDA", "text": "I see. So the timing wasn't right.", "qids": []}, {"speaker": "DAN", "text": "Yes I took it too soon, basically. And then the third competition I entered was called 'Animal Magic'.", "qids": ["8"]}, {"speaker": "BREDA", "text": "Well, that's a difficult subject!", "qids": []}, {"speaker": "DAN", "text": "I know! I had to take hundreds of shots.", "qids": []}, {"speaker": "BREDA", "text": "I'm sure - because animals move all the time.", "qids": []}, {"speaker": "DAN", "text": "That's what we had to show - there had to be some movement in the scene. I got a great shot of a fox in the end, but I took it at night and, well, I suspected that it was a bit dark, which is what I was told.", "qids": ["9", "10"]}, {"speaker": "BREDA", "text": "Well Dan - you seem to be really keen and we'd be delighted to have you in our club. I'm sure we can help with all those areas that you've outlined.", "qids": []}, {"speaker": "DAN", "text": "Thanks, that's great.", "qids": []}], "notes": ["Questions 1-10", "Questions 1-4", "Wayside Camera Club membership form", "Wayside Camera Club membership form", "Name:", "Dan Green", "Email address:", "dan 1068@market.com", "Home address:", "52 {{1}} Street, Peacetown", "Heard about us:", "from a {{2}}", "Reasons for joining:", "to enter competitions to {{3}}", "Type of membership:", "{{4}}membership (£30)", "Questions 5-10", "Photography competitions", "Photography competitions", "Photography competitions", "Title of competition", "Instructions", "Feedback to Dan", "{{5}} ’", "A scene in the home", "The picture’s composition was not good.", "‘Beautiful Sunsets’", "Scene must show some {{6}}", "The {{7}} was wrong.", "{{8}} ’", "Scene must show", "{{9}}", "The photograph was too", "{{10}}"]}, {"part": 2, "kind": "mcq", "title": "Excursions", "instructions": null, "audio": "audio/test5/part2.mp3", "answers": {"11": "G", "12": "D", "13": "A", "14": "E", "15": "F", "16": "B", "17": "B", "18": "D", "19": "A", "20": "D"}, "explanations": {"11": {"answer_label": "Câu 11", "quote": "One thing you have to do while you’re here is go dolphin watching. On our boat trips, we pretty well guarantee you’ll see dolphins - if you don’t you can repeat the trip free of charge.\nWe organise daily trips for just 35 euros. Unfortunately, there aren’t any places left for this afternoon’s trip (Q11), but come and see me to book for later in the week", "explain": "Câu hỏi:\n11.\tdolphin watching\nKeywords được paraphrase:\nCâu hỏi yêu cầu nối các chuyến du ngoạn với các thông tin\nA all downhill (ở dưới đồi)\nB suitable for beginners (phù hợp cho người mới bắt đầu)\nC only in good weather (chỉ trong thời tiết tốt)\nD food included (được bao gồm đồ ăn)\nE no charge (không thêm phí)\nF swimming possible (có thể bơi)\nG fully booked today (đã đặt hết trong hôm nay)\nH transport not included (không bao gồm phương tiện đi lại)\nGiải thích đáp án:\nNgười nói giới thiệu về chuyến du ngoạn đầu tiên “dolphin watching”. Đầu tiên ta sẽ bị nhầm với đáp án E bởi câu nói “if you don't you can repeat the trip free of charge” (nếu không, bạn có thể đi lại chuyến đi miễn phí), nhưng sau đó “We organise daily trips for just 35 euros” (Chúng tôi tổ chức các chuyến đi hàng ngày chỉ với 35 euro). Đáp án đúng nằm ở câu nói tiếp theo “there aren't any places left for this afternoon's trip” (không còn chô cho chuyên đi chiêu nay). Vì vậy ta chọn đáp án G."}, "12": {"answer_label": "Câu 12", "quote": "If you’re energetic, I'd recommend our forest walk. It's a guided walk of about seven kilometres. There’ll be a stop half way, and you’ll be provided with a drink and sandwiches (Q12).\nThere’s some fairly steep climbs up the hills, so you need to be reasonably fit for this one, with good shoes, and bring a waterproof in case it rains. It’s just 25 euros all inclusive, and it’s every Wednesday.", "explain": "Câu hỏi:\n12.\tforest walk\t\nKeywords được paraphrase:\nNhư câu 11\nGiải thích đáp án:\nNgười nói chuyển sang câu hỏi 12 bằng câu “If you're energetic, I'd recommend our forest walk” (nêu bạn năng động, tôi giới thiệu đường đi rừng của chúng tôi). Sau đó, người nói đưa thêm thông tin và đáp án nằm ở câu “you'll be provided with a drink and sandwiches” (bạn sẽ được cung cấp đồ uống và bánh san-wich). Vì vậy ta chọn đáp án D."}, "13": {"answer_label": "Câu 13", "quote": "Then on Thursdays we organise a cycle trip, which will give you all the fun of biking without the effort. We’ll take you and your bike up to the top of Mount Larna, and leave you to bike back - it’s a 700-metre drop in just 20 kilometres (Q13) so this isn’t really for inexperienced cyclists as you’ll be going pretty fa", "explain": "Câu hỏi:\n13.\tcycle trip\nKeywords được paraphrase:\nNhư câu 11\nGiải thích đáp án:\nNgười nói chuyển sang câu hỏi 13 bằng câu “on Thursdays we organise a cycle trip” (vào thứ năm, chúng tôi tổ chức chuyên đi xe đạp). Sau đó, người nói đưa thêm thông tin và đáp án nằm ở câu “We'll take you and your bike up to the top of Mount Larna, and leave you to bike back” (Chúng tôi sẽ đưa bạn và chiêc xe đạp của bạn lên đỉnh núi Larna và để bạn quay trở lại). Vì vậy, ta chọn đáp án A."}, "14": {"answer_label": "Câu 14", "quote": "On our local craft tour you can find out about the traditional activities in the island. And the best thing about this trip is that it’s completely free (Q14). You'll be taken to a factory where jewellery is made, and also a ceramics centre. If you want, you can buy some of the products but that's entirely up to you. The trip starts after lunch on Thursday, and you'll return by 6 pm.", "explain": "Câu hỏi:\n14.\tlocal craft tour\nKeywords được paraphrase:\nNhư câu 11\nGiải thích đáp án:\nNgười nói chuyển sang câu hỏi 14 bằng câu nói “On our local craft tour you can find out about the traditional activities in the island” (Trong tour du lịch thủ công địa phương của chúng tôi, bạn có thể tìm hiểu về các hoạt động truyền thống trên đảo). Sau đó, người nói đưa thêm thông tin và đáp án nằm ở câu “it's completely free.” (nó hoàn toàn miễn phí). Vì vậy, ta chọn đáp án E."}, "15": {"answer_label": "Câu 15", "quote": "If you're interested in astronomy you may already know that the island's one of the best places in the world to observe the night sky. We can offer trips to the observatory on Friday for those who are interested. They cost 90 euros per person and you'll be shown the huge telescopes and have a talk from an expert, who'll explain all about how they work. Afterwards we’ll head down to Sunset Beach, where you can have a dip in the ocean (Q15) if you want before we head off back to the hotel.", "explain": "Câu hỏi:\n15.\tobservatory trip\nKeywords được paraphrase:\nNhư câu 11\nGiải thích đáp án:\nNgười nói chuyển sang câu hỏi 15 bằng câu nói “We can offer trips to the observatory” (chúng tôi có thể cung cấp các chuyến đi đến đài quan sát). Sau đó, người nói đưa thêm thông tin và đáp án nằm ở câu “you can have a dip in the ocean” (bạn có thể ngâm mình trong đại dương). Vì vậy, ta chọn đáp án F."}, "16": {"answer_label": "Câu 16", "quote": "Finally, there's horse riding. This is organised by the Equestrian Centre over near Playa Cortino and it's a great experience if you're a keen horseback rider, or even if you’ve never been on a horse before (Q16). They take you down to the beach, and you can canter along the sand and through the waves. It costs 35 euros and it's available every day.", "explain": "Câu hỏi:\n16.\thorse riding\nKeywords được paraphrase:\nNhư câu 11\nGiải thích đáp án:\nNgười nói chuyển sang câu hỏi 15 bằng câu nói “Finally, there's horse riding” (cuối cùng, có một cuộc đua ngựa). Sau đó, người nói đưa thêm thông tin và đáp án nằm ở câu “or even if you've never been on a horse before” (hoặc thậm chí nếu bạn chưa bao giờ cưỡi ngựa trước đây). VÌ vậy, ta chọn đáp án B."}, "17": {"answer_label": "Câu 17", "quote": "Well, the number one attraction's called ‘Musical Favourites'. Guests enjoy a three-course meal and unlimited free drinks, and watch a fantastic show, starting with musicals set in Paris and then crossing the Atlantic to Las Vegas and finally Copacabana. At the end the cast members come down from the stage (Q17), still in their stunning costumes, and you'll have a chance to chat with them (Q18). It's hugely popular, so let me know now if you're interested because it's no good leaving it until the last minute. It's on Friday night. Tickets are just 50 euros each, but for an extra 10 euros you can have a table right by the stage.", "explain": "Câu hỏi:\nWhich TWO things does the speaker say about the attraction called Musical Favourites?\nA.\tYou pay extra for drinks.\nB.\tYou must book it in advance.\nC.\tYou get a reduction if you buy two tickets.\nD.\tYou can meet the performers.\nE.\tYou can take part in the show.\nKeywords được paraphrase:\nCâu hỏi yêu cầu 2 thông tin về “the attraction called Musical Favourites” (sức hút có tên là Musical Favourites). Các đáp án để lựa chọn bao gồm:\nA You pay extra for drinks (trả thêm cho nước uống) \nB You must book it in advance (phải đặt trước)\nC You get a reduction if you buy two tickets (được giảm giá nếu mua hai vé)\nD You can meet the performers (có thể gặp những người biểu diễn)\nE You can take part in the show (có thể tham gia vào buổi diễn)\nGiải thích đáp án:\nBài nghe nhắc đến “free drinks” (đồ uống miễn phí), nên ta loại câu A đầu tiên. Sau đó, ta nghe thấy “cast members come down from the stage... you'll have a chance to chat with them.” (các diễn viên bước xuống từ sân khấu ... bạn sẽ có cơ hội trò chuyện với họ). Vì vậy, ta chọn đáp D."}, "18": {"answer_label": "Câu 18", "quote": "Well, the number one attraction’s called ‘Musical Favourites’. Guests enjoy a three-course meal and unlimited free drinks, and watch a fantastic show, starting with musicals set in Paris and then crossing the Atlantic to Las Vegas and finally Copacabana. At the end the cast members come down from the stage (Q17), still in their stunning costumes, and you'll have a chance to chat with them (Q18). It’s hugely popular, so let me know now if you’re interested because it’s no good leaving it until the last minute. It's on Friday night. Tickets are just 50 euros each, but for an extra 10 euros you can have a table right by the stage.", "explain": "Câu hỏi:\nWhich TWO things does the speaker say about the attraction called Musical Favourites?\nA.\tYou pay extra for drinks.\nB.\tYou must book it in advance.\nC.\tYou get a reduction if you buy two tickets.\nD.\tYou can meet the performers.\nE.\tYou can take part in the show.\nKeywords được paraphrase:\nNhư câu 17\nGiải thích đáp án:\nTiếp theo, ta nghe được thông tin “it's no good leaving it until the last minute” (không có tốt khi đê đên phút cuối cùng). Vì vậy, ta chọn đáp án B."}, "19": {"answer_label": "Câu 19", "quote": "If you'd like to go back in time, there's the Castle Feast on Saturday evening. It's held in a twelfthcentury castle, and you eat in the great courtyard, with ladies in long gowns serving your food. You're given a whole chicken each, which you eat in the medieval way, using your hands instead of cutlery (Q19), and you’re entertained by competitions where the horseback riders attempt to knock one another off their horses. Then you can watch the dancers in the ballroom and join in as well if you want (Q20). OK, so now if anyone...", "explain": "Câu hỏi:\nWhich TWO things does the speaker say about the Castle Feast?\nA.\tVisitors can dance after the meal.\nB.\tThere is a choice of food.\nC.\tVisitors wear historical costume.\nD.\tKnives and forks are not used.\nE.\tThe entertainment includes horse races.\nKeywords được paraphrase:\nCâu hỏi yêu cầu 2 điều về the Castle Feast. Các đáp án đê lựa chọn bao gồm:\n•\tA Visitors can dance after the meal (có thê nhảy sau bữa ăn)\n•\tB There is a choice of food (được lựa chọn thức ăn)\n•\tC Visitors wear historical costume (có thê thê mặc trang phục lịch sử)\n•\tD Knives and forks are not used (không được dùng dao và nĩa)\n•\tE The entertainment includes horse races\n(có trò giải trí trong cuộc thi ngựa)\nGiải thích đáp án:\nSau khi giới thiệu đên the Castle Feast, người nói đưa ra thông tin câu trả lời “you eat in the medieval way, using your hands instead of cutlery” (bạn ăn theo cách trung cổ, dùng tay thay vì dao nĩa). Vì vậy, ta chọn đáp án D."}, "20": {"answer_label": "Câu 20", "quote": "If you'd like to go back in time, there's the Castle Feast on Saturday evening. It's held in a twelfthcentury castle, and you eat in the great courtyard, with ladies in long gowns serving your food. You're given a whole chicken each, which you eat in the medieval way, using your hands instead of cutlery (Q19), and you're entertained by competitions where the horseback riders attempt to knock one another off their horses. Then you can watch the dancers in the ballroom and join in as well if you want (Q20). OK, so now if anyone...", "explain": "Câu hỏi:\nWhich TWO things does the speaker say about the Castle Feast?\nA.\tVisitors can dance after the meal.\nB.\tThere is a choice of food.\nC.\tVisitors wear historical costume.\nD.\tKnives and forks are not used.\nE.\tThe entertainment includes horse races.\nKeywords được paraphrase:\nNhư câu 19\nGiải thích đáp án:\nThông tin tiếp theo ta nghe được là “you're entertained by competitions where the horseback riders” (bạn được giải trí bởi các cuộc thi mà những người cưỡi ngựa), khiến ta bị nhầm lẫn với đáp án E. Tuy nhiên, câu trả lời nằm ở câu nói “ join in as well if you want” (hãy tham gia nếu bạn muốn). Vì vậy ta chọn đáp án A."}}, "script_full": [{"speaker": null, "text": "Hello everyone. I'm Jake Stevens and I'm your rep here at the hotel. I'm sure you'll all have a great time here. So let me tell you a bit about what's on offer. I'll start by telling you about some of the excursions that are available for guests.", "qids": []}, {"speaker": null, "text": "One thing you have to do while you're here is go dolphin watching. On our boat trips, we pretty well guarantee you'll see dolphins if you don't you can repeat the trip free of charge. We organise daily trips for just 35 euros. Unfortunately there aren't any places left for this afternoon's trip, but come and see me to book for later in the week.", "qids": ["11"]}, {"speaker": null, "text": "If you're energetic, I'd recommend our forest walk. It's a guided walk of about seven kilometres. There'll be a stop half way, and you'll be provided with a drink and sandwiches. There's some fairly steep climbs up the hills, so you need to be reasonably fit for this one. with good shoes, and bring a waterproof in case it rains. It's just 25 euros all inclusive, and it's every Wednesday.", "qids": ["12"]}, {"speaker": null, "text": "Then on Thursdays we organise a cycle trip, which will give you all the fun of biking without the effort. We'll take you and your bike up to the top of Mount Larna, and leave you to bike back-it's a 700-metre drop in just 20 kilometres so this isn't really for inexperienced cyclists as you'll be going pretty fast. And if it's a clear day, you'll have fantastic views.", "qids": ["13"]}, {"speaker": null, "text": "On our local craft tour you can find out about the traditional activities in the island. And the best thing about this trip is that it's completely free. You'll be taken to a factory where jewellery is made, and also a ceramics centre. If you want, you can buy some of the products but that's entirely up to you. The trip starts after lunch on Thursday, and you'll return by 6 pm.", "qids": ["14"]}, {"speaker": null, "text": "If you're interested in astronomy you may already know that the island's one of the best places in the world to observe the night sky. We can offer trips to the observatory on Friday for those who are interested. They cost 90 euros per person and you'll be shown the huge telescopes and have a talk from an expert, who'll explain all about how they work. Afterwards we'll head down to Sunset Beach, where you can have a dip in the ocean if you want before we head off back to the hotel.", "qids": ["15"]}, {"speaker": null, "text": "Finally, there's horse riding. This is organised by the Equestrian Centre over near Playa Cortino and it's a great experience if you're a keen horseback rider, or even if you've never been on a horse before. They take you down to the beach, and you can canter along the sand and through the waves. It costs 35 euros and it's available every day.", "qids": ["16"]}, {"speaker": null, "text": "So there's plenty to do in the daytime, but what about night life?", "qids": []}, {"speaker": null, "text": "Well, the number one attraction's called 'Musical Favourites'. Guests enjoy a three-course meal and unlimited free drinks, and watch a fantastic show, starting with musicals set in Paris and then crossing the Atlantic to Las Vegas and finally Copacabana. At the end the cast members come down from the stage, still in their stunning costumes, and you'll have a chance to chat with them. It's hugely popular, so let me know now if you're interested because it's no good leaving it until the last minute. It's on Friday night. Tickets are just 50 euros each, but for an extra 10 euros you can have a table right by the stage.  [Q17", "qids": []}, {"speaker": null, "text": "Q18]", "qids": []}, {"speaker": null, "text": "If you'd like to go back in time, there's the Castle Feast on Saturday evening. It's held in a twelfth-century castle, and you eat in the great courtyard, with ladies in long gowns serving your food. You're given a whole chicken each, which you eat in the medieval way, using your hands instead of cutlery, and you're entertained by competitions where the horseback riders attempt to knock one another off their horses. Then you can watch the dancers in the ballroom and join in as well if you want. OK, so now if anyone ...  [Q19", "qids": []}, {"speaker": null, "text": "Q20]", "qids": []}], "groups": [{"type": "matching", "qids": ["11", "12", "13", "14", "15", "16"], "box_title": "Information", "box": {"A": "all downhill", "B": "suitable for beginners", "C": "only in good weather", "D": "food included", "E": "no charge", "F": "swimming possible", "G": "fully booked today", "H": "transport not included"}, "stems": [{"qid": "11", "prompt": "dolphin watching"}, {"qid": "12", "prompt": "forest walk"}, {"qid": "13", "prompt": "cycle trip"}, {"qid": "14", "prompt": "local craft tour"}, {"qid": "15", "prompt": "observatory trip"}, {"qid": "16", "prompt": "horse riding"}], "header": "Questions 11–16 What information does the speaker give about each of the following excursions? Choose SIX answers from the box and write the correct letter, A–H, next to Question 11–16."}, {"type": "choice", "qids": ["17", "18"], "prompt": "Which TWO things does the speaker say about the attraction called Musical Favourites?", "options": {"A": "You pay extra for drinks.", "B": "You must book it in advance.", "C": "You get a reduction if you buy two tickets.", "D": "You can meet the performers.", "E": "You can take part in the show."}, "multi": true, "header": "Questions 17 and 18 Choose TWO letters, A–E."}, {"type": "choice", "qids": ["19", "20"], "prompt": "Which TWO things does the speaker say about the Castle Feast?", "options": {"A": "Visitors can dance after the meal.", "B": "There is a choice of food.", "C": "Visitors wear historical costume.", "D": "Knives and forks are not used.", "E": "The entertainment includes horse races."}, "multi": true, "header": "Questions 19 and 20 Choose TWO letters, A–E."}]}, {"part": 3, "kind": "mcq", "title": "Presentation about Refrigeration (Annie & Jack)", "instructions": null, "audio": "audio/test5/part3.mp3", "answers": {"21": "B", "22": "A", "23": "B", "24": "A", "25": "A", "26": "A", "27": "B", "28": "B", "29": "A", "30": "C"}, "explanations": {"21": {"answer_label": "21. B", "quote": "Nor me. But I found an interesting article about icehouses. … \nand 19th-century ones here in the UK, so I knew they were often built in a shady area or underground, close to lakes that might freeze in the winter. Then blocks of ice could be cut and stored in the icehouse. But I didn't realise that insulating the blocks with straw or sawdust meant they didn't melt for months. The ancient", "explain": "Câu hỏi: \n21. What did Annie discover from reading about icehouses? \nA why they were first created \nB how the ice was kept frozen \nC where they were located \nKeywords được paraphrase: \nTừ khóa “icehouses” (nhà chứa băng) giúp ta xác định vị trí của câu hỏi trong bài nghe. Ngoài ra ta cũng chú ý từ khóa “Annie discover” (Annie khám phá được) \nGiải thích đáp án: \nSau khi nghe Annie đề cập về “icehouses” qua câu “I found an interesting article about icehouses” (Tôi đã tìm thấy một bài báo thú vị về nhà chứa băng), ta nghe được “I didn’t realize that insulating the blocks with straw or sawdust meant they didn’t melt for months” (Tôi đã không nhận ra rằng việc cách điện những khối đá với rơm rạ hoặc mùn cưa có nghĩa là chúng sẽ không tan chảy trong nhiều tháng). Như vậy, Annie đã không nhận ra (trước khi đọc bài báo), khám phá ra về cách đề giữ đá khỏi tan chảy. Ta chọn đáp án B. \nTrước đó ta cũng nghe Annie nói “I knew they were often built in…” (Tôi đã biết chúng thường được dựng lên ở…). Như vậy ta thấy thông tin địa điểm - lựa chọn C là thông tin mà Annie đã biết, như vậy cô ấy không khám phá gì thêm về điều này sau khi đọc bài báo."}, "22": {"answer_label": "22. A", "quote": "the blocks with straw or sawdust meant they didn't melt for months. The ancient Romans had refrigeration, too. \nANNIE: Yes, pits were dug in the ground, and snow was imported from the mountains — even though they were at quite a distance. The snow was stored in the pits. Ice formed at the bottom of it. Both the ice and the snow were then sold. The ice cost …", "explain": "Câu hỏi: \n22. What point does Annie make about refrigeration in ancient Rome? \nA It became a commercial business. \nB It used snow from nearby. \nC It took a long time to become popular. \nKeywords được paraphrase: \nTừ khóa “ancient Rome” và “refrigeration” giúp ta xác định vị trí câu hỏi trong bài nghe. \nGiải thích đáp án: \nSau khi nghe Annie đề cập đến “refrigeration” và “ancient Rome”, ta nghe được thông tin mà Annie cung cấp về “refrigeration” như sau”snow was imported from the mountains - even though they were at quite a distance” (tuyết được nhập từ những ngọn nuối - dù rằng chúng ở khá xa). Thông tin này mâu thuẫn với lựa chọn B. “it used snow from nearby” (Nó sử dụng tuyết gần đó). Như vậy ta loại lựa chọn này. \nSau đó, ta nghe được “Both the ice and the snow were then sold” (Cả băng và tuyết sau đó đều được bán). Thông tin này ứng với lựa chọn A. “it became a commercial business” (Nó trở thành một kinh doanh thương mại)."}, "23": {"answer_label": "23. B", "quote": "JACK: I wouldn't be surprised. I also came across an article about modern domestic fridges. Several different technologies are used, but they were too complex for me to understand. \nANNIE: You have to wonder what happens when people get rid of old ones. \nANNIE: Exactly. At least there are now plenty of organisations that will recycle most of the components safely, but of course some people just dump old fridges in the countryside. \nJACK: It's hard to see how they can be stopped unfortunately. In the UK we get rid of three million a year altogether!", "explain": "Câu hỏi: \n23. In connection with modern refrigerators, both Annie and Jack are worried about \nA the complexity of the technology. \nB the fact that some are disposed of irresponsibly. \nC the large number that quickly break down. \nKeywords được paraphrase: \nTa cần tập trung vào keyword “Both Annie and Jack” (Cả Annie và Jack) để không bị đánh bẫy khi chỉ một người thể hiện sự lo lắng, còn người còn lại thì không. Ngoài ra từ khóa “modern refridgerators” (tủ lạnh hiện đại) cũng cần được gạch chân để xác định vị trí của câu hỏi trong bài nghe. \nGiải thích đáp án: \nĐầu tiên, ta nghe Jack đề cập đến tủ lạnh hiện đại và nhận xét “They were too complex for me to understand” (Chúng quá phức tạp để tôi có thể hiểu được) sau đó Annie đổi chủ đề bằng cách đáp lại “You have to wonder what happens when people get rid of old ones” (Bạn nên quan tâm đến việc chuyện gì sẽ xảy ra khi người ta vứt bỏ những tủ lạnh cũ). Như vậy, ở đây ta thấy Jack có thể hiện sự lo lắng về độ phức tạp của tủ lạnh hiện đại - lựa chọn A, nhưng Annie thì không, ta loại lựa chọn này."}, "24": {"answer_label": "24. A", "quote": "JACK: That's right. In this country we keep domestic fridges for 11 years on average, and a lot last for 20 or more. So if you divide the cost by the number of years you can use a fridge. they're not expensive. compared with some household appliances. \nANNIE: True. I suppose manufacturers encourage people to spend more by making them …", "explain": "Câu hỏi: \n24. What do Jack and Annie agree regarding domestic fridges? \nA They are generally good value for money. \nB There are plenty of useful variations. \nC They are more useful than other domestic appliances. \nKeywords được paraphrase: \nTa cần tập trung vào keyword “Jack and Annie agree” (Jack và Annie đồng ý), và “domestic fridge” (tủ lạnh trong nhà). \nGiải thích đáp án: \nTrong bài, ta nghe Jack nói “If you divide the cost by the number of years you can use a fridge, they’re not expensive…” (Nếu bạn chia số tiền bỏ ra cho số năm mà bạn sử dụng một chiếc tủ lạnh, chúng thước sự không đắt…). Sau đó Annie cũng đồng tình với quan điểm này khi nói “true”. Như vậy ta chọn đáp án A. “They are generally good value for money” (Chúng nhìn chung thì đáng đồng tiền)."}, "25": {"answer_label": "25. A", "quote": "ANNIE: OK. How about starting with how useful refrigeration is, and the range of goods that are refrigerated nowadays? Because of course it's not just food and drinks. \nJACK: No, I suppose flowers and medicines are refrigerated, too. \nANNIE: And computers. I could do that, unless you particularly want to.", "explain": "Câu hỏi: \nQuestions 25-30 \nWho is going to do research into each topic? \nWrite the correct letter, A, B or C, next to Questions 25-30. \nPeople \nA Annie \nB Jack \nC both Annie and Jack \n25. the goods that are refrigerated ………… \nKeywords được paraphrase: \nĐề bài yêu cầu ta phân trách nhiệm cho Annie, Jack hoặc cả 2 người cho mỗi chủ đề. \nGiải thích đáp án: \nAnnie khởi xướng chủ đề ứng với câu hỏi 25 trước “and the range of goods that are refridgerated nowadays?” (và những món mà được giữ đông ở hiện tại?). Sau đó cô nói tiếp, “and computers, I could do that” (và máy tính, tôi có thể làm chúng). Ta cũng thấy Jack thể hiện sự đồng ý cách phân việc này qua câu “that’s fine by me” (Nó ổn với tôi). Như vậy, ta chọn đáp án A."}, "26": {"answer_label": "26. A", "quote": "JACK: No, that's fine by me. What about the effects of refrigeration on people's health? After all, some of the chemicals used in the 19th century were pretty harmful, but there have been lots of benefits too, like always having access to fresh food. Do you fancy dealing with that? \nANNIE: I'm not terribly keen, to be honest. \nJACK: Nor me. My mind just goes blank when I read anything about chemicals. \nANNIE: Oh. all right then. I'll do you a favour. But you owe me, Jack.", "explain": "Câu hỏi: \nQuestions 25-30 \nWho is going to do research into each topic? \nWrite the correct letter, A, B or C, next to Questions 25-30. \nPeople \nA Annie \nB Jack \nC both Annie and Jack \n26. the effects on health ……………… \nKeywords được paraphrase: \nĐề bài yêu cầu ta phân trách nhiệm cho Annie, Jack hoặc cả 2 người cho mỗi chủ đề. \nGiải thích đáp án: \nJack nhắc đến chủ đề của câu 26 qua câu “What about the effects of refrigeration on people’s health?”. Sau đó ta nghe Annie bảo “I’m not terribly keen” (Tôi không hứng thú lắm). Và Jack cũng nói “nor me” (Tôi cũng không). Tuy nhiên sau đó Annie nói “Alright then, I’ll do you a favour, but you owe me Jack” (Được rồi, tôi sẽ làm nó cho cậu, nhưng cậu nợ tôi Jack). Như vậy ta chọn đáp án A."}, "27": {"answer_label": "27. B", "quote": "ANNIE: Oh, all right then. I'll do you a favour. But you owe me, Jack. OK. What about the effects on food producers, like farmers in poorer countries being able to export their produce to developed countries? Something for you, maybe? \nJACK: I don't mind. It should be quite interesting.", "explain": "Câu hỏi: \nQuestions 25-30 \nWho is going to do research into each topic? \nWrite the correct letter, A, B or C, next to Questions 25-30. \nPeople \nA Annie \nB Jack \nC both Annie and Jack \n27. the impact on food producers ………… \nKeywords được paraphrase: \nĐề bài yêu cầu ta phân trách nhiệm cho Annie, Jack hoặc cả 2 người cho mỗi chủ đề. \nGiải thích đáp án: \nAnnie khởi xướng chủ đề ở câu 27 qua câu “What about the effects on food producers?”. Sau đó, cô nói “Something for you, maybe?” (Cái này cho cậu, nhỉ). Jack đáp lại “I don’t mind” (Tôi không phiền). Như vậy chủ đề này Jack làm, ta chọn đáp án B."}, "28": {"answer_label": "28. B", "quote": "ANNIE: I think we should also look at how refrigeration has helped whole cities — like Las Vegas, which couldn't exist without refrigeration because it's in the middle of a desert. \nJACK: Right. I had a quick look at an economics book in the library that's got a chapter about this sort of thing. I could give you the title, if you want to do this section. \nANNIE: Not particularly, to be honest. I find economics books pretty heavy going, as a rule. \nJACK: OK leave it to me. then", "explain": "Câu hỏi: \nQuestions 25-30 \nWho is going to do research into each topic? \nWrite the correct letter, A, B or C, next to Questions 25-30. \nPeople \nA Annie \nB Jack \nC both Annie and Jack \n28 the impact on cities ……………………. \nKeywords được paraphrase: \nĐề bài yêu cầu ta phân trách nhiệm cho Annie, Jack hoặc cả 2 người cho mỗi chủ đề. The impact on cities ở câu hỏi này được paraphrase lại thành “how refrigeration has helped whole cities” (cách mà hệ thống tủ lạnh đã giúp những thành phố) trong câu khởi xướng của Annie về chủ đề này. \nGiải thích đáp án: \nSau khi đề xướng chủ đề ở câu 26, Jack nói có đọc qua một quyển sách ở thư viện “I had a quick look at an economics book in the library” và có ý muốn nhờ Annie đọc qua nếu cô muốn làm về chủ đề này “I could give you the title, if you want to do this section”. Annie từ chối “Not particularly, to be honest” và Jack đáp lại “OK leave it to me” (OK để nó cho tôi). Như vậy ta chọn đáp án B."}, "29": {"answer_label": "29. A", "quote": "ANNIE: Thanks. Then there's transport, and the difference that refrigerated trucks have made. I wouldn't mind having a go at that.", "explain": "Câu hỏi: \nQuestions 25-30 \nWho is going to do research into each topic? \nWrite the correct letter, A, B or C, next to Questions 25-30. \nPeople \nA Annie \nB Jack \nC both Annie and Jack \n29. refrigerated transport ……………………… \nKeywords được paraphrase: \nĐề bài yêu cầu ta phân trách nhiệm cho Annie, Jack hoặc cả 2 người cho mỗi chủ đề. Ngoài ra, keyword “transport” cũng giúp ta xác định vị trí câu hỏi trong bài nghe. \nGiải thích đáp án: \nAnnie khởi xướng về chủ đề “transport” qua câu “Then there’s transport…”. Sau đó cô cũng nói tiếp “I wouldn’t mind having a go at that” (Tôi không phiền làm về nó đâu). Như vậy ta chọn đáp án A."}, "30": {"answer_label": "30. C", "quote": "JACK: Shall we have a separate section on domestic fridges? After all, they're something everyone's familiar with. \nANNIE: What about splitting it into two? You could investigate 19th- and 20th-century fridges, and I'll concentrate on what's available these days, and how manufacturers differentiate their products from those of their competitors. \nJACK: OK, that'd suit me.", "explain": "Câu hỏi: \nQuestions 25-30 \nWho is going to do research into each topic? \nWrite the correct letter, A, B or C, next to Questions 25-30. \nPeople \nA Annie \nB Jack \nC both Annie and Jack \n30. domestic fridges \nKeywords được paraphrase: \nĐề bài yêu cầu ta phân trách nhiệm cho Annie, Jack hoặc cả 2 người cho mỗi chủ đề. Ngoài ra, keyword “domestic fridges” cũng giúp ta xác định vị trí câu hỏi trong bài nghe. \nGiải thích đáp án: \nJack khởi xướng chủ đề trong câu hỏi này qua câu “Shall we have a separate section on domestic fridges?” (Chúng ta có nên có một phần riêng về các tủ lạnh gia đình chứ?). Sau đó Annie bảo “What about splitting it into two? You could….and I’ll …” (Hay là tách nó ra làm hai nhỉ? Bạn có thể làm … và tôi sẽ….). Sau đó Jack thể hiện sự đồng ý “Ok, that’d suit me” (OK, nó hơp ý tôi đó). Như vậy chủ đề này cả 2 người sẽ cùng làm, đáp án C."}}, "script_full": [{"speaker": "ANNIE", "text": "OK, Jack. Before we plan our presentation about refrigeration, let's discuss what we've discovered so far.", "qids": []}, {"speaker": "JACK", "text": "Fine, Annie. Though I have to admit I haven't done much research yet.", "qids": []}, {"speaker": "ANNIE", "text": "Nor me. But I found an interesting article about icehouses. I'd seen some 18th- and 19th-century ones here in the UK, so I knew they were often built in a shady area or underground, close to lakes that might freeze in the winter. Then blocks of ice could be cut and stored in the icehouse. But I didn't realise that insulating the blocks with straw or sawdust meant they didn't melt for months. The ancient Romans had refrigeration, too.", "qids": ["21"]}, {"speaker": "JACK", "text": "I didn't know that.", "qids": []}, {"speaker": "ANNIE", "text": "Yes, pits were dug in the ground, and snow was imported from the mountains - even though they were at quite a distance. The snow was stored in the pits. Ice formed at the bottom of it. Both the ice and the snow were then sold. The ice cost more than the snow and my guess is that only the wealthy members of society could afford it.", "qids": ["22"]}, {"speaker": "JACK", "text": "I wouldn't be surprised. I also came across an article about modern domestic fridges. Several different technologies are used, but they were too complex for me to understand.", "qids": []}, {"speaker": "ANNIE", "text": "You have to wonder what happens when people get rid of old ones.", "qids": []}, {"speaker": "JACK", "text": "You mean because the gases in them are harmful for the environment?", "qids": []}, {"speaker": "ANNIE", "text": "Exactly. At least there are now plenty of organisations that will recycle most of the components safely, but of course some people just dump old fridges in the countryside.", "qids": ["23"]}, {"speaker": "JACK", "text": "It's hard to see how they can be stopped unfortunately. In the UK we get rid of three million a year altogether!", "qids": []}, {"speaker": "ANNIE", "text": "That sounds a lot, especially because fridges hardly ever break down.", "qids": []}, {"speaker": "JACK", "text": "That's right. In this country we keep domestic fridges for 11 years on average, and a lot last for 20 or more. So if you divide the cost by the number of years you can use a fridge, they're not expensive, compared with some household appliances.", "qids": ["24"]}, {"speaker": "ANNIE", "text": "True. I suppose manufacturers encourage people to spend more by making them different colours and designs. I'm sure when my parents bought their first fridge they had hardly any choice!", "qids": ["25"]}, {"speaker": "JACK", "text": "Yes, there's been quite a change.", "qids": []}, {"speaker": "JACK", "text": "Right, let's make a list of topics to cover in our presentation, and decide who's going to do more research on them. Then later, we can get together and plan the next step.", "qids": []}, {"speaker": "ANNIE", "text": "OK. How about starting with how useful refrigeration is, and the range of goods that are refrigerated nowadays? Because of course it's not just food and drinks.", "qids": []}, {"speaker": "JACK", "text": "No, I suppose flowers and medicines are refrigerated, too.", "qids": []}, {"speaker": "ANNIE", "text": "And computers. I could do that, unless you particularly want to.", "qids": ["26"]}, {"speaker": "JACK", "text": "No, that's fine by me. What about the effects of refrigeration on people's health? After all, some of the chemicals used in the 19th century were pretty harmful, but there have been lots of benefits too, like always having access to fresh food. Do you fancy dealing with that?", "qids": []}, {"speaker": "ANNIE", "text": "I'm not terribly keen, to be honest.", "qids": []}, {"speaker": "JACK", "text": "Nor me. My mind just goes blank when I read anything about chemicals.", "qids": []}, {"speaker": "ANNIE", "text": "Oh, all right then, I'll do you a favour. But you owe me, Jack.", "qids": ["27"]}, {"speaker": "JACK", "text": "OK. What about the effects on food producers, like farmers in poorer countries being able to export their produce to developed countries? Something for you, maybe?", "qids": []}, {"speaker": "ANNIE", "text": "I don't mind. It should be quite interesting.", "qids": ["28"]}, {"speaker": "JACK", "text": "I think we should also look at how refrigeration has helped whole cities - like Las Vegas, which couldn't exist without refrigeration because it's in the middle of a desert.", "qids": []}, {"speaker": "ANNIE", "text": "Right. I had a quick look at an economics book in the library that's got a chapter about this sort of thing. I could give you the title, if you want to do this section.", "qids": []}, {"speaker": "JACK", "text": "Not particularly, to be honest. I find economics books pretty heavy going, as a rule.", "qids": []}, {"speaker": "ANNIE", "text": "OK. leave it to me, then.", "qids": []}, {"speaker": "JACK", "text": "Thanks. Then there's transport, and the difference that refrigerated trucks have made. I wouldn't mind having a go at that.", "qids": ["29"]}, {"speaker": "ANNIE", "text": "Don't forget trains, too. I read something about milk and butter being transported in refrigerated railroad cars in the USA, right back in the 1840s.", "qids": []}, {"speaker": "JACK", "text": "I hadn't thought of trains. Thanks.", "qids": []}, {"speaker": "ANNIE", "text": "Shall we have a separate section on domestic fridges? After all, they're something everyone's familiar with.", "qids": ["30"]}, {"speaker": "JACK", "text": "What about splitting it into two? You could investigate 19th- and 20th-century fridges, and I'll concentrate on what's available these days, and how manufacturers differentiate their products from those of their competitors.", "qids": []}, {"speaker": "ANNIE", "text": "OK, that'd suit me.", "qids": []}], "groups": [{"type": "choice", "qids": ["21"], "prompt": "What did Annie discover from reading about icehouses?", "options": {"A": "why they were first created", "B": "how the ice was kept frozen", "C": "where they were located"}, "multi": false, "header": "Questions 21-24 Choose the correct letter, A, B or C."}, {"type": "choice", "qids": ["22"], "prompt": "What point does Annie make about refrigeration in ancient Rome?", "options": {"A": "It became a commercial business.", "B": "It used snow from nearby.", "C": "It took a long time to become popular."}, "multi": false, "header": null}, {"type": "choice", "qids": ["23"], "prompt": "In connection with modern refrigerators, both Annie and Jack are worried about", "options": {"A": "the complexity of the technology.", "B": "the fact that some are disposed of irresponsibly.", "C": "the large number that quickly break down."}, "multi": false, "header": null}, {"type": "choice", "qids": ["24"], "prompt": "What do Jack and Annie agree regarding domestic fridges?", "options": {"A": "They are generally good value for money.", "B": "There are plenty of useful variations.", "C": "They are more useful than other domestic appliances."}, "multi": false, "header": null}, {"type": "matching", "qids": ["25", "26", "27", "28", "29", "30"], "box_title": "People", "box": {"A": "Annie", "B": "Jack", "C": "both Annie and Jack"}, "stems": [{"qid": "25", "prompt": "the goods that are refrigerated"}, {"qid": "26", "prompt": "the effects on health"}, {"qid": "27", "prompt": "the impact on food producers"}, {"qid": "28", "prompt": "the impact on cities"}, {"qid": "29", "prompt": "refrigerated transport"}, {"qid": "30", "prompt": "domestic fridges"}], "header": null}]}, {"part": 4, "kind": "notes", "title": "The Extinction of the Dodo Bird", "instructions": null, "audio": "audio/test5/part4.mp3", "answers": {"31": "spice(s)", "32": "colony / settlement", "33": "fat", "34": "head", "35": "movement", "36": "balance / balancing", "37": "brain", "38": "smell", "39": "rats", "40": "forest"}, "explanations": {"31": {"answer_label": "31. spice(s)", "quote": "Then in the year 1507 the first Portuguese ships stopped at the island. The sailors were carrying spices back to Europe, and found the island a convenient stopping place where they could stock up with food and water for the rest of the voyage.", "explain": "Câu hỏi:\nHistory\n1507 - Portuguese ships transporting 31 ........................... stopped at the island to collect food and water. Keywords được paraphrase: transporting - carrying collect - stock up with\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Đoạn bên chỉ ra rằng vào năm 1507, những con tàu đầu tiên của Bồ Đào Nha đã dừng lại ở hòn đảo này. Các thủy thủ đang mang theo gia vị - 'spices’ trở về châu Âu, và tìm thấy hòn đảo là một nơi dừng chân thuận tiện để họ có thể tích trữ thực phẩm và nước uống cho phần còn lại của chuyến đi."}, "32": {"answer_label": "32. colony / settlement", "quote": "However, 1638 the Dutch arrived and set up a colony there.", "explain": "Câu hỏi:\nHistory\n1638 - The Dutch established a 32 ...................... on the island.\nKeywords được paraphrase:\nestablished - set up\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Câu bên chỉ ra rằng vào năm 1638 người Hà Lan đã đến hòn đảo Mauritius và thiết lập thuộc địa - 'colony’ ở đó."}, "33": {"answer_label": "33.fat", "quote": "The best-known picture is a Dutch painting in which the bird appears to be extremely fat, ...", "explain": "Câu hỏi:\nDescription\nA Dutch painting suggests the dodo was very 33 ……………………….\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một tính từ. Câu bên chỉ ra rằng bức tranh nổi tiếng nhất là bức tranh của Hà Lan, trong đó con chim có vẻ rất béo - 'fat'."}, "34": {"answer_label": "34. head", "quote": "In the early 17th century four dried parts of a bird were known to exist - of these, three have disappeared, so only one example of soft tissue from the dodo survives, a dodo head.", "explain": "Câu hỏi:\nDescription\nThe only remaining soft tissue is a dried 34 ............................\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Câu bên chỉ ra rằng vào đầu thế kỷ 17, bốn bộ phận khô của một con chim được biết là tồn tại - trong số' này, ba bộ phận đã biến mất, vì vậy chỉ có một ví dụ về mô mềm của dodo còn sống sót, đó là đầu -'head' của chim dodo."}, "35": {"answer_label": "35. movement", "quote": "For example, early accounts of the birds mention how slow and clumsy it was, but scientists now believe the bird's strong knee joints would have made it capable of movement which was not slow, but actually quite fast.", "explain": "Câu hỏi:\nDescription\nRecent studies of a dodo skeleton suggest the birds were capable of rapid 35\t\nKeywords được paraphrase:\nrapid - fast\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Câu bên chỉ ra rằng các bản tường thuật ban đầu về loài chim đề cập đến việc nó chậm chạp và vụng về như thế nào, nhưng các nhà khoa học hiện tin rằng khớp gối khỏe của chim sẽ giúp nó có khả năng di chuyển - 'movement' không chậm mà thực sự khá nhanh."}, "36": {"answer_label": "36. balance / balancing", "quote": "It's true that the dodo's small wings wouldn't have allowed it to leave the ground, but the scientists suggest that these were probably employed for balance while going over uneven ground.", "explain": "Câu hỏi:\nDescription\nIt's thought they were able to use their small wings to maintain 36 ……………………………………..\nKeywords được paraphrase:\nuse - employed\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Câu bên chỉ ra rằng đúng là đôi cánh nhỏ của loài chim dodo sẽ không cho phép nó rời khỏi mặt đất, nhưng các nhà khoa học cho rằng chúng có thể được sử dụng để giữ thăng bằng - 'balance' khi đi trên mặt đất không bằng phẳng."}, "37": {"answer_label": "37. brain", "quote": "They found that the reports of the lack of intelligence of the dodo were not borne out by their research, which suggested the bird's brain was not small, but average in size.", "explain": "Câu hỏi:\nDescription\nTheir 37 ………………………………………\twas of average size\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Câu bên chỉ ra rằng các nhà khoa học phát hiện ra rằng các báo cáo về sự thiếu thông minh của dodo không phải do nghiên cứu của họ đưa ra, điều này cho thấy não - 'brain' của loài chim này không nhỏ, nhưng có kích thước trung bình."}, "38": {"answer_label": "38. smell", "quote": "The researchers also found that the structure of the bird's skull suggested that one sense which was particularly well- developed was that of smell. So the dodo may also have been particularly good at locating ripe fruit and other food in the island's thick vegetation.", "explain": "Câu hỏi:\nDescription\nTheir sense of 38 …………………..... enabled them to find food.\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Đoạn bên chỉ ra rằng các nhà nghiên cứu cũng phát hiện ra rằng cấu trúc hộp sọ của loài chim gợi ý rằng một giác quan đặc biệt phát triển tốt là khứu giác -'smell'. Vì vậy, dodo cũng có thể đặc biệt giỏi trong việc tìm trái cây chín và thức ăn khác trong thảm thực vật dày của hòn đảo."}, "39": {"answer_label": "39. rats", "quote": "... the ships also brought another type of creature - rats, which came to land from the ships and rapidly overran the island. These upset the ecology of the island, not just the dodos but other species too. However, they were a particular danger to the dodos because they consumed their eggs ...", "explain": "Câu hỏi:\nReasons for extinction\n39 …………………... also escaped onto the island and ate the birds' eggs.\nKeywords được paraphrase:\nate - consumed\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Đoạn bên chỉ ra rằng các con tàu cũng mang theo một loại sinh vật khác - loài chuột - 'rats', từ tàu đổ bộ và nhanh chóng xâm chiếm hòn đảo. Những điều này làm đảo lộn hệ sinh thái của hòn đảo, không chỉ dodo mà còn các loài khác. Tuy nhiên, chúng là một mối nguy hiểm đặc biệt đối với dodo vì chúng đã ăn trứng của chúng."}, "40": {"answer_label": "40.forest", "quote": "However, we now think that probably the main cause of birds' extinction was not the introduction of non-native species, but the introduction of agriculture. This meant that the forest that had once covered all the island, and that had provided a perfect home for the dodo, was cut down so that crops such as sugar could be grown.", "explain": "Câu hỏi:\nReasons for extinction\nThe arrival of farming meant the 40 ………………………… was\ndestroyed.\nKeywords được paraphrase:\nthe arrival of farming - the introduction of agriculture.\ndestroyed - cut down\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Đoạn bên chỉ ra rằng tuy nhiên, nguyên nhân chính dẫn đến sự tuyệt chủng của các loài chim không phải là do sự du nhập của các loài không phải bản địa, mà là do sự xuất hiện của nền nông nghiệp. Điều này có nghĩa là khu rừng -'forest' đã từng bao phủ toàn bộ hòn đảo, và từng là ngôi nhà hoàn hảo cho dodo, đã bị đốn hạ để có thể trồng các loại cây như đường."}}, "script_full": [{"speaker": null, "text": "One of the most famous cases of extinction is that of a bird known as the dodo. In fact there's even a saying in English, 'as dead as the dodo', used to refer to something which no longer exists. But for many centuries the dodo was alive and well, although it could only be found in one place, the island of Mauritius in the Indian Ocean. It was a very large bird, about one metre tall, and over the centuries it had lost the ability to fly, but it survived happily under the trees that covered the island.", "qids": []}, {"speaker": null, "text": "Then in the year 1507 the first Portuguese ships stopped at the island. The sailors were carrying spices back to Europe, and found the island a convenient stopping place where they could stock up with food and water for the rest of the voyage, but they didn't settle on Mauritius. However, in 1638 the Dutch arrived and set up a colony there. These first human inhabitants of the island found the dodo birds a convenient source of meat, although not everyone liked the taste.", "qids": ["31", "32"]}, {"speaker": null, "text": "It's hard to get an accurate description of what the dodo actually looked like. We do have some written records from sailors, and a few pictures, but we don't know how reliable these are. The best-known picture is a Dutch painting in which the bird appears to be extremely fat, but this may not be accurate - an Indian painting done at the same time shows a much thinner bird.", "qids": ["33"]}, {"speaker": null, "text": "Although attempts were made to preserve the bodies of some of the birds, no complete specimen survives. In the early 17th century four dried parts of a bird were known to exist of these, three have disappeared, so only one example of soft tissue from the dodo survives, a dodo head. Bones have also been found, but there's only one complete skeleton in existence.", "qids": ["34"]}, {"speaker": null, "text": "This single dodo skeleton has recently been the subject of scientific research which suggests that many of the earlier beliefs about dodos may have been incorrect. For example, early accounts of the birds mention how slow and clumsy it was, but scientists now believe the bird's strong knee joints would have made it capable of movement which was not slow, but actually quite fast. In fact, one 17th century sailor wrote that he found the birds hard to catch.", "qids": ["35"]}, {"speaker": null, "text": "It's true that the dodo's small wings wouldn't have allowed it to leave the ground, but the scientists suggest that these were probably employed for balance while going over uneven ground. Another group of scientists carried out analysis of the dodo's skull. They found that the reports of the lack of intelligence of the dodo were not borne out by their research, which suggested the bird's brain was not small, but average in size. In fact, in relation to its body size, it was similar to that of the pigeon, which is known to be a highly intelligent bird.", "qids": ["36", "37"]}, {"speaker": null, "text": "The researchers also found that the structure of the bird's skull suggested that one sense which was particularly well-developed was that of smell. So the dodo may also have been particularly good at locating ripe fruit and other food in the island's thick vegetation.", "qids": ["38"]}, {"speaker": null, "text": "So it looks as if the dodo was better able to survive and defend itself than was originally believed. Yet less than 200 years after Europeans first arrived on the island, they had become extinct. So what was the reason for this? For a long time, it was believed that the dodos were hunted to extinction, but scientists now believe the situation was more complicated than this. Another factor may have been the new species brought to the island by the sailors. These included dogs, which would have been a threat to the dodos, and also monkeys, which ate the fruit that was the main part of the dodos' diet. These were brought to the island deliberately, but the ships also brought another type of creature rats, which came to land from the ships and rapidly overran the island. These upset the ecology of the island, not just the dodos but other species too. However, they were a particular danger to the dodos because they consumed their eggs, and since each dodo only laid one at a time, this probably had a devastating effect on populations.", "qids": ["39"]}, {"speaker": null, "text": "However, we now think that probably the main cause of the birds' extinction was not the introduction of non-native species, but the introduction of agriculture. This meant that the forest that had once covered all the island, and that had provided a perfect home for the dodo, was cut down so that crops such as sugar could be grown. So although the dodo had survived for thousands of years, suddenly it was gone.", "qids": ["40"]}], "notes": ["THE EXTINCTION OF THE DODO BIRD", "The dodo was a large flightless bird which used to inhabit the island of Mauritius.", "History", "• 1507 - Portuguese ships transporting {{31}}stopped at the island to collect food and water.", "• 1638 - The Dutch established a {{32}}on the island.", "• They killed the dodo birds for their meat.", "• The last one was killed in 1681.", "Description", "• The only record we have is written descriptions and pictures (possibly unreliable).", "• A Dutch painting suggests the dodo was very {{33}}", "• The only remaining soft tissue is a dried {{34}}", "• Recent studies of a dodo skeleton suggest the birds were capable of rapid {{35}}", "• It’s thought they were able to use their small wings to maintain {{36}}", "• Their {{37}}was of average size.", "• Their sense of {{38}}enabled them to find food.", "Reasons for extinction", "• Hunting was probably not the main cause.", "• Sailors brought dogs and monkeys.", "• {{39}} also escaped onto the island and ate the birds’ eggs.", "• The arrival of farming meant the {{40}} was destroyed."]}]};

<script>
(function(){
  const partsEl = document.getElementById('parts');
  const tabsEl = document.getElementById('tabs');

  function renderNotes(part){
    let html = '<div class="notes-block">';
    for(const rawLine of part.notes){
      const text = rawLine.trim();
      if(!text) continue;
      const isBlankLine = /\{\{\d+\}\}/.test(text);
      const isBulletLine = /^[–\-•]/.test(text);
      const isExample = /^example$/i.test(text);
      const rendered = text.replace(/\{\{(\d+)\}\}/g, (m, num) => {
        return `<span class="blank-num">${num}</span><input class="blank" type="text" data-part="${part.part}" data-q="${num}" autocomplete="off" spellcheck="false">`;
      });
      if(isExample){
        html += `<span class="subhead example-line">Example</span><br>`;
      } else if(isBlankLine){
        html += (isBulletLine ? '<span class="bullet">' : '<span>') + rendered + '</span><br>';
      } else if(isBulletLine){
        html += `<span class="bullet">${text}</span><br>`;
      } else if(text.split(' ').length <= 4){
        html += `<span class="subhead">${text}</span><br>`;
      } else {
        html += `<span class="example-line">${text}</span><br>`;
      }
    }
    html += '</div>';
    return html;
  }

  function renderMatching(g, part){
    let html = '<div class="qgroup" data-qids="' + g.qids.join(',') + '" data-mtype="matching">';
    if(g.image){
      html += `<img class="map-img" src="${g.image}" alt="${(g.box_title||'Map')}">`;
    }
    const boxEntries = Object.entries(g.box || {});
    if(boxEntries.length){
      html += '<div class="box-panel">';
      if(g.box_title) html += `<div class="box-title">${g.box_title}</div>`;
      for(const [letter, text] of boxEntries){
        html += `<div class="box-item"><b>${letter}</b><span>${text}</span></div>`;
      }
      html += '</div>';
    } else if(g.box_title){
      html += `<div class="box-title" style="margin-bottom:8px;font-weight:800;color:var(--navy);">${g.box_title}</div>`;
    }
    const letters = boxEntries.length ? boxEntries.map(([l]) => l) : (g.qids.length ? inferLetters(g) : []);
    for(const s of g.stems){
      html += `<div class="stem-row" data-q="${s.qid}"><span class="blank-num">${s.qid}</span><span class="stem-text">${s.prompt}</span>`;
      html += `<select data-part="${part.part}" data-q="${s.qid}"><option value="">--</option>`;
      for(const letter of letters){
        html += `<option value="${letter}">${letter}</option>`;
      }
      html += '</select></div>';
    }
    html += '</div>';
    return html;
  }

  function inferLetters(g){
    // No box text (e.g. a map where letters are drawn on the image) --
    // fall back to A..I so the dropdown offers every valid letter (some
    // maps go up to I, not just H).
    return ['A','B','C','D','E','F','G','H','I'];
  }

  function renderMcq(part){
    let html = '';
    for(const g of part.groups){
      if(g.header){
        html += `<div class="header-note">${g.header}</div>`;
      }
      if(g.type === 'matching'){
        html += renderMatching(g, part);
        continue;
      }
      const qidsLabel = g.qids.length>1 ? `${g.qids[0]}\u2013${g.qids[g.qids.length-1]}` : g.qids[0];
      html += `<div class="qgroup" data-qids="${g.qids.join(',')}" data-multi="${g.multi}">`;
      html += `<div class="prompt"><span class="blank-num">${qidsLabel}</span> ${g.prompt}</div>`;
      html += '<div class="opt-list">';
      for(const [letter, text] of Object.entries(g.options)){
        const inputType = g.multi ? 'checkbox' : 'radio';
        const name = g.multi ? `p${part.part}g${g.qids.join('_')}` : `p${part.part}q${g.qids[0]}`;
        html += `<label class="opt" data-letter="${letter}"><input type="${inputType}" name="${name}" value="${letter}" ${g.multi?`data-max="${g.qids.length}"`:''}>`+
                `<span><b>${letter}.</b> ${text}</span></label>`;
      }
      html += '</div></div>';
    }
    return html;
  }

  const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function fmtTime(t){
    t = Math.max(0, Math.round(t||0));
    const m = Math.floor(t/60), s = t%60;
    return `${m}:${String(s).padStart(2,'0')}`;
  }

  function buildScriptHtml(part){
    // part.script_full: the complete audioscript for this part, line by line, in order.
    // Lines whose "qids" array is non-empty are the lines where an answer's information
    // is actually said -- those get highlighted, tagged with the question number(s), and
    // (when time_seconds is known) get a jump button that seeks the script's own audio player.
    const lines = part.script_full || [];
    if(!lines.length) return '<p class="muted">No script data.</p>';
    return lines.map(l => {
      const spk = l.speaker ? `<span class="spk">${esc(l.speaker)}:</span> ` : '';
      let body = esc(l.text);
      if(l.qids && l.qids.length){
        const tags = l.qids.map(q => `<span class="qtag">Q${q}</span>`).join('');
        let jumpBtn = '';
        if(typeof l.time_seconds === 'number'){
          jumpBtn = `<button type="button" class="jump-btn" data-action="jump-audio" data-part="${part.part}" data-time="${l.time_seconds}" title="Jump to ${fmtTime(l.time_seconds)}">\u25b6 ${fmtTime(l.time_seconds)}</button>`;
        }
        body = `${jumpBtn}<mark class="hl">${body}</mark>${tags}`;
      }
      return `<p class="script-line">${spk}${body}</p>`;
    }).join('');
  }

  function buildExplanationsHtml(part){
    let html = '';
    const qids = [];
    if(part.kind === 'notes'){
      Object.keys(part.answers).sort((a,b)=>a-b).forEach(q=>qids.push(q));
    } else {
      part.groups.forEach(g=>g.qids.forEach(q=>qids.push(q)));
      qids.sort((a,b)=>a-b);
    }
    for(const q of qids){
      const e = part.explanations[q] || {};
      const ans = part.answers[q] || '';
      html += `<div class="expl-item"><div class="eq-head"><span class="qnum">C\u00e2u ${q}</span><span class="ans">${ans}</span></div>`;
      if(e.quote){
        html += `<div class="quote">"${e.quote.replace(/</g,'&lt;')}"</div>`;
      }
      html += `<div class="explain">${(e.explain||'').replace(/</g,'&lt;')}</div></div>`;
    }
    return html;
  }

  function gradeParts(part){
    let correct = 0, total = 0;
    if(part.kind === 'notes'){
      for(const [q, ans] of Object.entries(part.answers)){
        total++;
        const input = partsEl.querySelector(`input.blank[data-part="${part.part}"][data-q="${q}"]`);
        if(!input) continue;
        const val = input.value.trim().toLowerCase();
        const ok = val === String(ans).trim().toLowerCase();
        input.classList.remove('correct','incorrect');
        input.classList.add(ok ? 'correct' : 'incorrect');
        if(ok) correct++;
        if(!ok){
          input.title = `Correct answer: ${ans}`;
        }
      }
    } else {
      for(const g of part.groups){
        if(g.type === 'matching'){
          for(const s of g.stems){
            total++;
            const sel = partsEl.querySelector(`.part[data-part="${part.part}"] select[data-q="${s.qid}"]`);
            if(!sel) continue;
            const correctLetter = part.answers[s.qid];
            const ok = sel.value === correctLetter;
            sel.classList.remove('correct','incorrect');
            sel.classList.add(ok ? 'correct' : 'incorrect');
            if(ok) correct++;
            else sel.title = `Correct answer: ${correctLetter}`;
          }
          continue;
        }
        const groupEl = partsEl.querySelector(`.part[data-part="${part.part}"] .qgroup[data-qids="${g.qids.join(',')}"]`);
        if(!groupEl) continue;
        const inputs = groupEl.querySelectorAll('input');
        const correctLetters = g.qids.map(q => part.answers[q]);
        const selected = Array.from(inputs).filter(i=>i.checked).map(i=>i.value);
        groupEl.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','incorrect'));
        inputs.forEach(inp=>{
          const label = inp.closest('.opt');
          const letter = label.dataset.letter;
          if(correctLetters.includes(letter)) label.classList.add('correct');
          else if(inp.checked) label.classList.add('incorrect');
        });
        if(g.multi){
          total += g.qids.length;
          const sortedSel = [...selected].sort();
          const sortedCorrect = [...correctLetters].sort();
          if(sortedSel.length===sortedCorrect.length && sortedSel.every((v,i)=>v===sortedCorrect[i])){
            correct += g.qids.length;
          } else {
            correctLetters.forEach(cl=>{ if(selected.includes(cl)) correct++; });
          }
        } else {
          total += 1;
          if(selected[0] === correctLetters[0]) correct += 1;
        }
      }
    }
    return {correct, total};
  }

  function renderPart(part, idx){
    const wrap = document.createElement('div');
    wrap.className = 'part' + (idx===0 ? ' active' : '');
    wrap.dataset.part = part.part;

    const card = document.createElement('div');
    card.className = 'card';
    let inner = `<div class="part-bar"><span>PART ${part.part}${part.title ? ' — ' + part.title : ''}</span><span class="title">${part.kind==='notes'?'Note Completion':'Multiple Choice'}</span></div>`;
    inner += `<div class="card-body">`;
    if(part.instructions) inner += `<div class="instructions">${part.instructions}</div>`;
    inner += `<div class="audio-box"><span class="icon">\ud83c\udfa7</span><span class="label">Part ${part.part} Audio</span><audio controls preload="none" src="${part.audio}"></audio></div>`;
    inner += part.kind === 'notes' ? renderNotes(part) : renderMcq(part);
    inner += `<div class="actions">
        <button class="primary" data-action="check">Check Answers</button>
        <button class="ghost" data-action="reset">Reset</button>
        <span class="score-pill" data-role="score" style="display:none;"></span>
      </div>
      <div class="actions" style="margin-top:0;">
        <button class="ghost" data-action="toggle-script">Show Script</button>
        <button class="ghost" data-action="toggle-expl">Show Answers &amp; Explanations</button>
      </div>
      <div class="toggle-section" data-role="script-section">
        <h2 style="font-size:15px;color:var(--navy);">Full Script — Part ${part.part}</h2>
        <p class="script-note">Listen and follow along below — highlighted lines show where each answer is said${part.script_full && part.script_full.some(l=>typeof l.time_seconds==='number') ? '; tap a time button to jump straight there.' : '.'}</p>
        <div class="audio-box"><span class="icon">\ud83c\udfa7</span><span class="label">Part ${part.part} Audio</span><audio controls preload="none" src="${part.audio}" data-role="script-audio"></audio></div>
        <div class="script-text">${buildScriptHtml(part)}</div>
      </div>
      <div class="toggle-section" data-role="expl-section">
        <h2 style="font-size:15px;color:var(--navy);">Answers &amp; Explanations — Part ${part.part}</h2>
        ${buildExplanationsHtml(part)}
      </div>
      </div>`;
    card.innerHTML = inner;
    wrap.appendChild(card);

    card.querySelectorAll('.qgroup[data-multi="true"]').forEach(groupEl => {
      const boxes = Array.from(groupEl.querySelectorAll('input[type="checkbox"]'));
      if(!boxes.length) return;
      const max = parseInt(boxes[0].dataset.max, 10) || 2;
      const sync = () => {
        const checkedCount = boxes.filter(b=>b.checked).length;
        boxes.forEach(b => { if(!b.checked) b.disabled = checkedCount >= max; });
      };
      boxes.forEach(b => b.addEventListener('change', sync));
    });

    card.querySelector('[data-action="check"]').addEventListener('click', () => {
      const {correct, total} = gradeParts(part);
      const pill = card.querySelector('[data-role="score"]');
      pill.style.display = 'inline-block';
      pill.textContent = `Score: ${correct} / ${total}`;
      const tabBtn = tabsEl.querySelector(`[data-tab="${part.part}"]`);
      if(tabBtn) tabBtn.classList.add('done');
    });
    card.querySelector('[data-action="reset"]').addEventListener('click', () => {
      card.querySelectorAll('input[type="text"]').forEach(i=>{i.value='';i.classList.remove('correct','incorrect');i.title='';});
      card.querySelectorAll('input[type="radio"],input[type="checkbox"]').forEach(i=>{i.checked=false;i.disabled=false;});
      card.querySelectorAll('select').forEach(s=>{s.value='';s.classList.remove('correct','incorrect');s.title='';});
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','incorrect'));
      card.querySelector('[data-role="score"]').style.display='none';
      const tabBtn = tabsEl.querySelector(`[data-tab="${part.part}"]`);
      if(tabBtn) tabBtn.classList.remove('done');
    });
    card.querySelector('[data-action="toggle-script"]').addEventListener('click', (e) => {
      const sec = card.querySelector('[data-role="script-section"]');
      sec.classList.toggle('open');
      e.target.textContent = sec.classList.contains('open') ? 'Hide Script' : 'Show Script';
    });
    card.querySelector('[data-action="toggle-expl"]').addEventListener('click', (e) => {
      const sec = card.querySelector('[data-role="expl-section"]');
      sec.classList.toggle('open');
      e.target.textContent = sec.classList.contains('open') ? 'Hide Answers & Explanations' : 'Show Answers & Explanations';
    });
    card.querySelectorAll('[data-action="jump-audio"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const t = Number(btn.dataset.time) || 0;
        const audio = card.querySelector('[data-role="script-audio"]');
        if(!audio) return;
        audio.currentTime = t;
        audio.play();
      });
    });

    return wrap;
  }

  TEST_DATA.parts.forEach((part, idx) => {
    const tabBtn = document.createElement('button');
    tabBtn.className = 'tab-btn' + (idx===0 ? ' active' : '');
    tabBtn.dataset.tab = part.part;
    tabBtn.innerHTML = `<span class="dot"></span>Part ${part.part}`;
    tabBtn.addEventListener('click', () => {
      partsEl.querySelectorAll('audio').forEach(a => { a.pause(); });
      tabsEl.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      partsEl.querySelectorAll('.part').forEach(p=>p.classList.remove('active'));
      tabBtn.classList.add('active');
      partsEl.querySelector(`.part[data-part="${part.part}"]`).classList.add('active');
      window.scrollTo({top:0, behavior:'smooth'});
    });
    tabsEl.appendChild(tabBtn);
    partsEl.appendChild(renderPart(part, idx));
  });
})();
</script>
</body>
</html>
