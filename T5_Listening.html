<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test 5 &ndash; IELTS Listening Practice</title>
<style>
:root{
  --bg:#eef1f7; --panel:#ffffff; --ink:#1b2540; --muted:#66708a; --line:#e3e7f0;
  --navy:#122a52; --navy-2:#1c3f74; --brand:#1c3f74; --brand-ink:#ffffff;
  --good:#128a4e; --bad:#d64545; --good-bg:#e9f9f1; --bad-bg:#fdecec;
  --accent-bg:#eef2fb; --gold:#c9a24b; --radius:14px;
  --shadow:0 1px 3px rgba(18,42,82,.06), 0 10px 24px -14px rgba(18,42,82,.18);
}
*{box-sizing:border-box;}
body{margin:0;background:linear-gradient(180deg,#e7ebf5 0%,#eef1f7 320px);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.wrap{max-width:940px;margin:0 auto;padding:28px 16px 80px;}
header.top{padding:6px 4px 22px;text-align:center;}
header.top .kicker{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.14em;color:var(--gold);background:var(--navy);padding:5px 14px;border-radius:999px;margin-bottom:14px;}
header.top h1{font-size:26px;margin:0 0 8px;letter-spacing:.01em;color:var(--navy);font-weight:800;}
header.top p{margin:0;color:var(--muted);font-size:13.5px;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:22px 0;position:sticky;top:10px;z-index:5;}
.tab-btn{border:1px solid var(--line);background:var(--panel);color:var(--navy);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;box-shadow:var(--shadow);}
.tab-btn:hover{border-color:var(--navy-2);}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.tab-btn .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin-right:7px;vertical-align:middle;}
.tab-btn.done .dot{background:var(--gold);}
.part{display:none;}
.part.active{display:block;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:0 0 22px;margin-bottom:20px;box-shadow:var(--shadow);overflow:hidden;}
.part-bar{background:linear-gradient(90deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:15px 24px;font-weight:800;font-size:15.5px;letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.part-bar .title{font-weight:600;opacity:.92;font-size:13.5px;}
.card-body{padding:20px 24px 0;}
.card .instructions{color:var(--muted);font-size:13.5px;margin-bottom:14px;font-style:italic;}
.audio-box{display:flex;align-items:center;gap:12px;background:var(--accent-bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:4px 0 16px;}
.audio-box .icon{font-size:18px;}
.audio-box .label{font-size:12.5px;font-weight:700;color:var(--navy);white-space:nowrap;}
audio{width:100%;height:36px;}
.qgroup{margin:18px 0;}
.qgroup .header-note{font-size:12.5px;color:var(--navy-2);font-weight:800;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em;}
.qgroup .prompt{font-weight:600;margin-bottom:8px;}
.opt-list{display:flex;flex-direction:column;gap:6px;margin-bottom:2px;}
.opt{display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border-radius:9px;border:1px solid var(--line);cursor:pointer;}
.opt:hover{background:var(--accent-bg);border-color:var(--navy-2);}
.opt input{margin-top:3px;}
.opt.correct{background:var(--good-bg);border-color:var(--good);}
.opt.incorrect{background:var(--bad-bg);border-color:var(--bad);}
.opt:has(input:disabled){opacity:.45;cursor:not-allowed;}
.opt input:disabled{cursor:not-allowed;}
.notes-block{white-space:pre-wrap;line-height:2.2;}
.notes-block .subhead{display:block;font-weight:800;margin:16px 0 4px;color:var(--navy);font-size:14.5px;}
.notes-block .bullet{display:block;margin-left:14px;}
.blank{display:inline-block;border:none;border-bottom:2px solid var(--navy-2);background:var(--accent-bg);border-radius:5px 5px 0 0;padding:3px 8px;font:inherit;font-weight:700;min-width:120px;text-align:center;color:var(--ink);}
.blank:focus{outline:none;background:#e4eaf9;}
.blank.correct{border-color:var(--good);background:var(--good-bg);}
.blank.incorrect{border-color:var(--bad);background:var(--bad-bg);}
.blank-num{font-size:11px;color:var(--gold);font-weight:800;vertical-align:super;margin-right:2px;}
.actions{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap;}
button.primary{background:var(--navy);color:#fff;border:none;padding:12px 24px;border-radius:9px;font-size:14.5px;font-weight:700;cursor:pointer;box-shadow:0 6px 14px -6px rgba(18,42,82,.5);}
button.primary:hover{background:var(--navy-2);}
button.ghost{background:#fff;border:1px solid var(--line);color:var(--navy);padding:11px 18px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;}
button.ghost:hover{border-color:var(--navy-2);color:var(--navy-2);}
.score-pill{font-weight:800;padding:9px 18px;border-radius:999px;background:var(--navy);color:#fff;font-size:14px;}
.toggle-section{display:none;margin-top:16px;border-top:1px dashed var(--line);padding-top:16px;}
.toggle-section.open{display:block;}
.script-text{font-size:14.5px;background:#f7f8fc;border:1px solid var(--line);border-radius:10px;padding:14px 16px;max-height:560px;overflow-y:auto;}
.script-line{margin:0 0 10px;line-height:1.65;}
.script-line .spk{font-weight:800;color:var(--navy);margin-right:4px;}
.script-line mark.hl{background:#fdf1d0;border-radius:4px;padding:1px 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
.script-line .qtag{display:inline-block;font-weight:800;color:var(--navy);font-size:11px;background:#e8edf8;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle;}
.jump-btn{display:inline-block;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:700;color:#fff;background:var(--navy-2);border:none;border-radius:6px;padding:3px 8px;margin-right:8px;cursor:pointer;vertical-align:middle;}
.jump-btn:hover{background:var(--navy);}
.expl-item{border-top:1px solid var(--line);padding:14px 0;}
.expl-item:first-child{border-top:none;}
.expl-item .eq-head{display:flex;gap:10px;align-items:center;margin-bottom:6px;}
.expl-item .qnum{background:var(--navy);color:#fff;font-weight:800;font-size:12px;border-radius:6px;padding:3px 9px;}
.expl-item .ans{font-weight:800;color:var(--good);}
.expl-item .quote{font-style:italic;color:var(--muted);font-size:13.5px;margin:4px 0 6px;white-space:pre-wrap;}
.expl-item .explain{font-size:14px;white-space:pre-wrap;}
.example-line{color:var(--muted);font-style:italic;}
.script-note{font-size:12.5px;color:var(--muted);margin:0 0 10px;}
footer.credit{color:var(--muted);font-size:12px;text-align:center;margin-top:26px;}
.box-panel{background:var(--accent-bg);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px;}
.box-panel .box-title{font-weight:800;color:var(--navy);margin-bottom:8px;font-size:13.5px;}
.box-panel .box-item{display:flex;gap:8px;margin:4px 0;font-size:14px;}
.box-panel .box-item b{color:var(--navy-2);min-width:18px;}
.map-img{max-width:100%;border-radius:10px;border:1px solid var(--line);margin-bottom:14px;display:block;}
.stem-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);}
.stem-row:last-child{border-bottom:none;}
.stem-row .stem-text{flex:1;}
.stem-row select{padding:7px 10px;border-radius:8px;border:1px solid var(--line);font:inherit;font-weight:700;min-width:70px;background:#fff;}
.stem-row select.correct{border-color:var(--good);background:var(--good-bg);}
.stem-row select.incorrect{border-color:var(--bad);background:var(--bad-bg);}
@media(max-width:520px){.wrap{padding:18px 10px 60px;}.card-body{padding:16px 16px 0;}.part-bar{padding:13px 16px;}}
</style>
</head>

const TEST_DATA = {"test": "Test 5", "parts": [{"part": 1, "kind": "notes", "title": "Wayside Camera Club", "instructions": null, "audio": "audio/test5/part1.mp3", "answers": {"1": "Marrowfield", "2": "relative", "3": "socialise / socialize", "4": "full", "5": "Domestic Life", "6": "clouds", "7": "timing", "8": "Animal Magic", "9": "(animal) movement", "10": "dark"}, "explanations": {"5": {"answer_label": "5. Domestic Life", "quote": "BREDA: Oh, that’s interesting. So why don’t you tell me something about those? Let's start with the first one.\nDAN: Well, the theme was entitled 'Domestic Life’. 5", "explain": "Từ khóa: title, competition \nỞ cột “Title of competition” có 3 hàng dành cho 3 đáp án, suy ra trong bài nghe sẽ đề cập đến 3 cuộc thi => người học nên chú ý các số thứ tự như first, second và third. \nDựa vào bài nghe ta xác định được thông tin rằng Breda đã hỏi Dan là có từng thắng cuộc thi nhiếp ảnh nào chưa, Dan đã trả lời rằng chưa nhưng anh đã từng tham gia 3 cuộc thi - “have entered three in the past” \nCăn cứ vào từ khóa và bài nghe ta xác định được đoạn thông tin sau: “BREDA: So why don’t you tell me something about those? Let's start with the first one.\nDAN: Well, the theme was entitled 'Domestic Life’”để chọn ra được Domestic Life là đáp án chính xác. \nTitle ~ entitled"}, "8": {"answer_label": "8. Animal Magic", "quote": "DAN: Yes - I took it too soon, basically. And then the third competition I entered was called 'Animal Magic’. 8", "explain": "Từ khóa: title, competition \nỞ cột “Title of competition” có 3 hàng dành cho 3 đáp án, suy ra trong bài nghe sẽ đề cập  đến 3 cuộc thi => người học nên chú ý các số thứ tự như first, second và third. \nDựa vào bài nghe ta xác định được đoạn thông tin sau “And then the third competition I entered was called 'Animal Magic’” – đáp án đúng là “Animal Magic”"}, "1068": {"answer_label": "BREDA: Hello, Wayside Camera Club, Breda speaking.\nDAN: Oh, hello, um, my name’s Dan and I’d like to join your club.\nBREDA: That’s great, Dan. We have an application form - would you like to complete it over the phone, then you can ask any questions you might have?\nDAN: Oh, yes, thanks.\nBREDA: OK, so what’s your family name?\nDAN: It’s Green - Dan Green.\nBREDA: So - can I take your email address?\nDAN: Yes, it’s dan1068@market.com.\nBREDA: Thanks. And what about your home address?\nDAN: Well, I’m about ten miles away from your club in Peacetown. I live in a house there.\nBREDA: OK, so what’s the house number and street?\nDAN: It’s 52 Marrowfield Street. 1 \nBREDA: Is that M-A double R-O-W-F-l-E-L-D?\n\nDAN: That’s right.\nBREDA: ... and that’s Peacetown, you said?\nDAN: Uhuh.\nBREDA: So how did you hear about our club? Did you look on the internet?\n\nDAN: I usually do that, but this time, well, I was talking to a relative 2 the other day and he suggested it.\n\nBREDA: Oh, is he a member too?\n\nDAN: He belongs to another club - but he’d heard good things about yours.\n\nBREDA: OK. So what do you hope to get from joining?\nDAN: Well, one thing that really interests me is the competitions that you have. I enjoy entering those.\nBREDA: Right. Anything else?\nDAN: Well, I also like to socialise 3with other photographers.\t\nBREDA: That’s great. So what type of membership would you like?\nDAN: What are the options?\nBREDA: It’s £30 a year for full membership 4 or £20 a year if you’re an associate.\n\nDAN: I think I’ll go for the full membership, then.\nBREDA: That’s a good idea because you can’t vote in meetings with an associate membership.\n\nBREDA: If I could just find out a bit more about you ...\nDAN: OK.\nBREDA: So you said you wanted to compete - have you ever won any photography competitions?\n\nDAN: Not yet, but I have entered three in the past.\n\nBREDA: Oh, that’s interesting. So why don’t you tell me something about those? Let's start with the first one.\nDAN: Well, the theme was entitled 'Domestic Life’. 5\n\nBREDA: I see - so it had to be something related to the home?\nDAN: Yeah. I chose to take a photo of a family sitting round the dinner table having a meal, and, urn, I didn’t win, but I did get some feedback.\n\nBREDA: Oh, what did the judges say?\nDAN: That it was too ‘busy’ as a picture.\nBREDA: Aha - so it was the composition of the picture that they criticised?\nDAN: That’s right - and once they'd told me that, I could see my mistake.\nBREDA: So what was the theme of the second competition?\nDAN: Well, my university was on the coast and that area gets a lot of beautiful sunsets, so that was the theme.\nBREDA: Oh, sunsets, that’s a great theme.\n\nDAN: Yes. The instructions were to capture the clouds as well 6 - it couldn't just be blue sky and a setting sun.\nBREDA: Sure, cause they give you all those amazing pinks and purples.\nDAN: Yeah - and I thought I’d done that well, but the feedback was that I should have waited a bit longer to get the shot.\nBREDA: I see. So the timing wasn’t right. 7\n\nDAN: Yes - I took it too soon, basically. And then the third competition I entered was called 'Animal Magic’. 8\nBREDA: Well, that’s a difficult subject!\nDAN: I know! I had to take hundreds of shots.\n\nBREDA: I’m sure - because animals move all the time.\nDAN: That’s what we had to show - there had to be some movement in the scene. 9I got a great shot of a fox in the end, but I took it at night and, well,\tI suspected that it was a bit dark, which is what I was told. 10\n\nBREDA: Well Dan - you seem to be really keen and we'd be delighted to have you in our club. I’m sure we can help with all those areas that you’ve outlined.\nDAN: Thanks, that’s great.", "quote": "BREDA: Hello, Wayside Camera Club, Breda speaking.\nDAN: Oh, hello, um, my name’s Dan and I’d like to join your club.\nBREDA: That’s great, Dan. We have an application form - would you like to complete it over the phone, then you can ask any questions you might have?\nDAN: Oh, yes, thanks.\nBREDA: OK, so what’s your family name?\nDAN: It’s Green - Dan Green.\nBREDA: So - can I take your email address?\nDAN: Yes, it’s dan1068@market.com.\nBREDA: Thanks. And what about your home address?\nDAN: Well, I’m about ten miles away from your club in Peacetown. I live in a house there.\nBREDA: OK, so what’s the house number and street?\nDAN: It’s 52 Marrowfield Street. 1 \nBREDA: Is that M-A double R-O-W-F-l-E-L-D?\n\nDAN: That’s right.\nBREDA: ... and that’s Peacetown, you said?\nDAN: Uhuh.\nBREDA: So how did you hear about our club? Did you look on the internet?\n\nDAN: I usually do that, but this time, well, I was talking to a relative 2 the other day and he suggested it.\n\nBREDA: Oh, is he a member too?\n\nDAN: He belongs to another club - but he’d heard good things about yours.\n\nBREDA: OK. So what do you hope to get from joining?\nDAN: Well, one thing that really interests me is the competitions that you have. I enjoy entering those.\nBREDA: Right. Anything else?\nDAN: Well, I also like to socialise 3with other photographers.\t\nBREDA: That’s great. So what type of membership would you like?\nDAN: What are the options?\nBREDA: It’s £30 a year for full membership 4 or £20 a year if you’re an associate.\n\nDAN: I think I’ll go for the full membership, then.\nBREDA: That’s a good idea because you can’t vote in meetings with an associate membership.\n\nBREDA: If I could just find out a bit more about you ...\nDAN: OK.\nBREDA: So you said you wanted to compete - have you ever won any photography competitions?\n\nDAN: Not yet, but I have entered three in the past.\n\nBREDA: Oh, that’s interesting. So why don’t you tell me something about those? Let's start with the first one.\nDAN: Well, the theme was entitled 'Domestic Life’. 5\n\nBREDA: I see - so it had to be something related to the home?\nDAN: Yeah. I chose to take a photo of a family sitting round the dinner table having a meal, and, urn, I didn’t win, but I did get some feedback.\n\nBREDA: Oh, what did the judges say?\nDAN: That it was too ‘busy’ as a picture.\nBREDA: Aha - so it was the composition of the picture that they criticised?\nDAN: That’s right - and once they'd told me that, I could see my mistake.\nBREDA: So what was the theme of the second competition?\nDAN: Well, my university was on the coast and that area gets a lot of beautiful sunsets, so that was the theme.\nBREDA: Oh, sunsets, that’s a great theme.\n\nDAN: Yes. The instructions were to capture the clouds as well 6 - it couldn't just be blue sky and a setting sun.\nBREDA: Sure, cause they give you all those amazing pinks and purples.\nDAN: Yeah - and I thought I’d done that well, but the feedback was that I should have waited a bit longer to get the shot.\nBREDA: I see. So the timing wasn’t right. 7\n\nDAN: Yes - I took it too soon, basically. And then the third competition I entered was called 'Animal Magic’. 8\nBREDA: Well, that’s a difficult subject!\nDAN: I know! I had to take hundreds of shots.\n\nBREDA: I’m sure - because animals move all the time.\nDAN: That’s what we had to show - there had to be some movement in the scene. 9I got a great shot of a fox in the end, but I took it at night and, well,\tI suspected that it was a bit dark, which is what I was told. 10\n\nBREDA: Well Dan - you seem to be really keen and we'd be delighted to have you in our club. I’m sure we can help with all those areas that you’ve outlined.\nDAN: Thanks, that’s great.", "explain": "BREDA: Alo, Breda từ Wayside Camera Club xin nghe. \nDAN: Ồ, xin chào, ừm, tên tôi là Dan và tôi muốn tham gia câu lạc bộ của bạn.\nBREDA: Điều đó thật tuyệt, Dan. Để tham gia câu lạc bộ thì bạn cần điền vào mẫu đơn – bạn có muốn hoàn thành nó qua điện thoại, sau đó bạn có thể hỏi bất kỳ vấn đề gì mà bạn thắc mắc. \nDAN: Ồ, vâng, cảm ơn.\nBREDA: OK, vậy họ của bạn là gì?\nDAN: Là Green – Tên đầy đủ là Dan Green.\nBREDA: Còn địa chỉ email của bạn?\nDAN: Vâng, đó là dan1068@market.com.\nBREDA: Cảm ơn. Còn về địa chỉ nhà thì sao?\n\nDAN: Chà, nhà tôi ở Peacetown cách câu lạc bộ khoảng mười dặm. Tôi sống ở đó. \nBREDA: OK, vậy số nhà và đường là gì?\n\nDAN: Đó là 52 đường Marrowfield. 1\nBREDA: Có phải là M-A 2 chữ R-O-W-F-l-E-L-D không?\nDAN: Đúng vậy.\nBREDA: ... Bạn nói là Peacetown đúng không?\nDAN: Uh.\nBREDA: Làm thế nào mà bạn biết đến câu lạc bộ của chúng tôi? Internet hay là thông qua những kênh khác? \nDAN: Tôi thường tìm thấy trên Internet, nhưng lần này, là khi tôi đang nói chuyện với một người họ hàng 2 vào ngày hôm trước và anh ấy đã gợi ý cho tôi.\nBREDA: Ồ, anh ấy cũng là thành viên trong câu lạc bộ à?\nDAN: Anh ấy thuộc một câu lạc bộ khác - nhưng anh ấy nghe nói nhiều điều tích cực về câu lạc bộ của các bạn. \nBREDA: Được rồi. Vì vậy, bạn hy vọng mình sẽ nhận được gì từ việc tham gia câu lạc bộ?\nDAN: Chà, một điều thực sự khiến tôi quan tâm là các cuộc thi mà bạn tham gia. Tôi thích tham gia những cuộc thi như thế.\nBREDA: Okay. Còn gì nữa không?\nDAN: Chà, tôi cũng thích giao lưu 3 với các nhiếp ảnh gia khác.\nBREDA: Điều đó thật tuyệt. Vậy bạn muốn tham gia với tư cách thành viên nào?\nDAN: Có những sự lựa chọn nào?\nBREDA: Đó là £30 một năm cho tư cách thành viên chính thức 4 hoặc £20 một năm nếu bạn là cộng tác viên.\nDAN: Vậy thì tôi nghĩ tôi sẽ chọn cái đầu tiên. \nBREDA: Đó là một ý tưởng hay vì bạn không thể bỏ phiếu trong các cuộc họp với tư cách là cộng tác viên. \nBREDA: Liệu tôi có thể hỏi thêm một số thông tin khác về bạn được không? \nDAN: Được chứ\nBREDA: À, bạn nói rằng bạn muốn tham gia cuộc thi - bạn đã bao giờ chiến thắng cuộc thi nhiếp ảnh nào chưa?\nDAN: Chưa, nhưng trước đây tôi từng tham gia 3 cuộc thi. \nBREDA: Ồ, thật thú vị. Vậy tại sao bạn không nói với tôi về những điều đó? Hãy bắt đầu với cuộc thi đầu tiên.\nDAN: Chà, chủ đề có tên là 'Cuộc sống gia đình'. 5\n\nBREDA: Tôi hiểu rồi - vậy nó phải là thứ gì đó liên quan đến gia đình đúng không?\nDAN: Vâng. Tôi đã chọn chụp ảnh một gia đình đang ngồi ăn quanh bàn ăn tối, và, ừm, tôi đã không thắng, nhưng tôi đã nhận được một số lời nhận xét.\nBREDA: Ồ, ban giám khảo đã nói gì?\nDAN: Rằng bức ảnh này quá rối. \nBREDA: Aha - vậy là các giám khảo đã nhận xét về bố cục? \nDAN: Đúng vậy - và một khi họ nói với tôi điều đó, tôi có thể nhận ra sai lầm của mình.\nBREDA: VẬY chủ đề của cuộc thi thứ hai là gì?\n\nDAN: Chà, trường đại học của tôi nằm trên bờ biển và khu vực đó có rất nhiều cảnh hoàng hôn tuyệt đẹp, vì vậy đó là chủ đề.\nBREDA: Ồ, hoàng hôn, đó là một chủ đề tuyệt vời.\nDAN: Vâng. Yêu cầu là chụp cả mây 6 - không thể chỉ có bầu trời xanh và mặt trời lặn.\n\nBREDA: Chắc chắn rồi, vì hoàng hôn cho bạn tất cả những màu hồng và tím tuyệt vời đó.\nDAN: Vâng - và tôi nghĩ rằng mình đã làm tốt điều đó, nhưng phản hồi là tôi nên đợi thêm một chút nữa rồi mới bấm máy. \nBREDA: Tôi hiểu rồi. Vì vậy, là do canh thời gian không đúng. 7\nDAN: Vâng - về cơ bản, tôi đã chụp quá sớm. Và rồi cuộc thi thứ ba mà tôi tham gia có tên là 'Phép Thuật Động Vật'. 8\nBREDA: Chà, đó là một chủ đề khó!\nDAN: Tôi biết! Tôi đã phải chụp hàng trăm bức ảnh.\nBREDA: Tôi chắc chắn - bởi vì động vật di chuyển mọi lúc.\nDAN: Đó là những gì chúng tôi phải thể hiện - phải có một số chuyển động trong bức ảnh. 9 Cuối cùng, tôi đã chụp được một bức ảnh tuyệt vời về một con cáo, nhưng tôi đã chụp nó vào ban đêm và tôi nghi rằng trời hơi tối, đó là những gì tôi được nhận xét. 10\nBREDA: Chà, Dan - bạn có vẻ rất quan tâm và chúng tôi rất vui khi có bạn trong câu lạc bộ của chúng tôi. Tôi chắc chắn rằng chúng tôi có thể trợ giúp với tất cả những lĩnh vực mà bạn đã vạch ra.\nDAN: Cảm ơn, điều đó thật tuyệt."}, "52": {"answer_label": "BREDA: Hello, Wayside Camera Club, Breda speaking.\nDAN: Oh, hello, um, my name’s Dan and I’d like to join your club.\nBREDA: That’s great, Dan. We have an application form - would you like to complete it over the phone, then you can ask any questions you might have?\nDAN: Oh, yes, thanks.\nBREDA: OK, so what’s your family name?\nDAN: It’s Green - Dan Green.\nBREDA: So - can I take your email address?\nDAN: Yes, it’s dan1068@market.com.\nBREDA: Thanks. And eme.\n\nDAN: Yes. The instructions were to capture the clouds as well 6 - it couldn't just be blue sky and a setting sun.\nBREDA: Sure, cause they give you all those amazing pinks and purples.\nDAN: Yeah - and I thought I’d done that well, but the feedback was that I should have waited a bit longer to get the shot.\nBREDA: I see. So the timing wasn’t right. 7\n\nDAN: Yes - I took it too soon, basically. And then the third competition I entered was called 'Animal Magic’. 8\nBREDA: Well, that’s a difficult subject!\nDAN: I know! I had to take hundreds of shots.\n\nBREDA: I’m sure - because animals move all the time.\nDAN: That’s what we had to show - there had to be some movement in the scene. 9I got a great shot of a fox in the end, but I took it at night and, well,\tI suspected that it was a bit dark, which is what I was told. 10\n\nBREDA: Well Dan - you seem to be really keen and we'd be delighted to have you in our club. I’m sure we can help with all those areas that you’ve outlined.\nDAN: Thanks, that’s great.", "explain": "BREDA: Alo, Breda từ Wayside Camera Club xin nghe. \nDAN: Ồ, xin chào, ừm, tên tôi là Dan và tôi muốn tham gia câu lạc bộ của bạn.\nBREDA: Điều đó thật tuyệt, Dan. Để tham gia câu lạc bộ thì bạn cần điền vào mẫu đơn – bạn có muốn hoàn thành nó qua điện thoại, sau đó bạn có thể hỏi bất kỳ vấn đề gì mà bạn thắc mắc. \nDAN: Ồ, vâng, cảm ơn.\nBREDA: OK, vậy họ của bạn là gì?\nDAN: Là Green – Tên đầy đủ là Dan Green.\nBREDA: Còn địa chỉ email của bạn?\nDAN: Vâng, đó là dan1068@market.com.\nBREDA: Cảm ơn. Còn về địa chỉ nhà thì sao?\n\nDAN: Chà, nhà tôi ở Peacetown cách câu lạc bộ khoảng mười dặm. Tôi sống ở đó. \nBREDA: OK, vậy số nhà và đường là gì?\n\nDAN: Đó là 52 đường Marrowfield. 1\nBREDA: Có phải là M-A 2 chữ R-O-W-F-l-E-L-D không?\nDAN: Đúng vậy.\nBREDA: ... Bạn nói là Peacetown đúng không?\nDAN: Uh.\nBREDA: Làm thế nào mà bạn biết đến câu lạc bộ của chúng tôi? Internet hay là thông qua những kênh khác? \nDAN: Tôi thường tìm thấy trên Inter là chủ đề.\nBREDA: Ồ, hoàng hôn, đó là một chủ đề tuyệt vời.\nDAN: Vâng. Yêu cầu là chụp cả mây 6 - không thể chỉ có bầu trời xanh và mặt trời lặn.\n\nBREDA: Chắc chắn rồi, vì hoàng hôn cho bạn tất cả những màu hồng và tím tuyệt vời đó.\nDAN: Vâng - và tôi nghĩ rằng mình đã làm tốt điều đó, nhưng phản hồi là tôi nên đợi thêm một chút nữa rồi mới bấm máy. \nBREDA: Tôi hiểu rồi. Vì vậy, là do canh thời gian không đúng. 7\nDAN: Vâng - về cơ bản, tôi đã chụp quá sớm. Và rồi cuộc thi thứ ba mà tôi tham gia có tên là 'Phép Thuật Động Vật'. 8\nBREDA: Chà, đó là một chủ đề khó!\nDAN: Tôi biết! Tôi đã phải chụp hàng trăm bức ảnh.\nBREDA: Tôi chắc chắn - bởi vì động vật di chuyển mọi lúc.\nDAN: Đó là những gì chúng tôi phải thể hiện - phải có một số chuyển động trong bức ảnh. 9 Cuối cùng, tôi đã chụp được một bức ảnh tuyệt vời về một con cáo, nhưng tôi đã chụp nó vào ban đêm và tôi nghi rằng trời hơi tối, đó là những gì tôi được nhận xét. 10\nBREDA: Chà, Dan - bạn có vẻ rất quan tâm và chúng tôi rất vui khi có bạn trong câu lạc bộ của chúng tôi. Tôi chắc chắn rằng chúng tôi có thể trợ giúp với tất cả những lĩnh vực mà bạn đã vạch ra.\nDAN: Cảm ơn, điều đó thật tuyệt."}, "1": {"answer_label": "1. Marrowfield", "quote": "BREDA: OK, so what’s the house number and street?\nDAN: It’s 52 Marrowfield Street. 1 \nBREDA: Is that M-A double R-O-W-F-l-E-L-D?\nDAN: That’s right.", "explain": "Từ khóa: home address, street \nỞ câu hỏi này đề bài đã cho sẵn số nhà, nhiệm vụ của người học là phải xác định đúng tên đường và ghi đúng chính tả. Đối với dạng câu hỏi yêu cầu điền tên thường sẽ có phần đánh vần (spelling). \nDựa vào từ khóa và nội dung bài nghe ta xác định được đoạn thông tin sau: “OK, so what’s the house number and street? DAN: It’s 52 Marrowfield Street” để chọn được Marrowfield là đáp án chính xác."}, "2": {"answer_label": "2. Relative", "quote": "BREDA: So how did you hear about our club? Did you look on the internet?\nDAN: I usually do that, but this time, well, I was talking to a relative 2 the other day and he suggested it.", "explain": "Từ khóa: heard, about, us \nVị trí từ khóa cần một danh từ (vì phía trước có mạo từ không xác định “a”) chỉ người. \nCăn cứ vào từ khóa và nội dung bài nghe, dễ dàng tìm được đoạn thông tin sau: “I usually do that, but this time, well, I was talking to a relative  the other day and he suggested it” để xác định đáp án chính xác là relative. \nTrong đó cụm “hear about us” được viết lại thành “hear about our club” trong bài nghe."}, "3": {"answer_label": "3. Socialize / socialise", "quote": "BREDA: Right. Anything else?\nDAN: Well, I also like to socialise 3with other photographers.", "explain": "Từ khóa: reasons, joining\nDựa vào bài nghe ta xác định được thông tin sau: Khi Breda hỏi Dan “What do you hope to get from joining?” (= reasons) thì Dan trả lời rằng anh ấy thích những cuộc thi nhiếp ảnh và muốn tham gia ở câu lạc bộ. Kế tiếp, Breda hỏi “Anything else” – “Còn gì khác không” đây cũng là hint để người học xác định đáp án cho câu hỏi số 3. Câu trả lời cho câu hỏi này chính là đáp án. Đáp án là socialize / socialise"}, "30": {"answer_label": "BREDA: Hello, Wayside Camera Club, Breda speaking.\nDAN: Oh, hello, um, my name’s Dan and I’d like to join your club.\nBREDA: That’s great, Dan. We have an application form - would you like to complete it over the phone, then you can ask any questions you might have?\nDAN: Oh, yes, thanks.\nBREDA: OK, so what’s your family name?\nDAN: It’s Green - Dan Green.\nBREDA: So - can I take your email address?\nDAN: Yes, it’s dan1068@market.com.\nBREDA: Thanks. And what about your home address?\nDAN: Well, I’m about ten miles away from your club in Peacetown. I live in a house there.\nBREDA: OK, so what’s the house number and street?\nDAN: It’s 52 Marrowfield Street. 1 \nBREDA: Is that M-A double R-O-W-F-l-E-L-D?\n\nDAN: That’s right.\nBREDA: ... and that’s Peacetown, you said?\nDAN: Uhuh.\nBREDA: So how did you hear about our club? Did you look on the internet?\n\nDAN: I usually do that, but this time, well, I was talking to a relative 2 the other day and he suggested it.\n\nBREDA: Oh, is he a member too?\n\nDAN: He belongs to another club - but he’d heard good things about yours.\n\nBREDA: OK. So what do you hope to get from joining?\nDAN: Well, one thing that really interests me is the competitions that you have. I enjoy entering those.\nBREDA: Right. Anything else?\nDAN: Well, I also like to socialise 3with other photographers.\t\nBREDA: That’s great. So what type of membership would you like?\nDAN: What are the options?\nBREDA: It’s £30 a year for full membership 4 or £20 a year if you’re an associate.\n\nDAN: I think I’ll go for the full membership, then.\nBREDA: That’s a good idea because you can’t vote in meetings with an associate membership.\n\nBREDA: If I could just find out a bit more about you ...\nDAN: OK.\nBREDA: So you said you wanted to compete - have you ever won any photography competitions?\n\nDAN: Not yet, but I have entered three in the past.\n\nBREDA: Oh, that’s interesting. So why don’t you tell me something about those? Let's start with the first one.\nDAN: Well, the theme was entitled 'Domestic Life’. 5\n\nBREDA: I see - so it had to be something related to the home?\nDAN: Yeah. I chose to take a photo of a family sitting round the dinner table having a meal, and, urn, I didn’t win, but I did get some feedback.\n\nBREDA: Oh, what did the judges say?\nDAN: That it was too ‘busy’ as a picture.\nBREDA: Aha - so it was the composition of the picture that they criticised?\nDAN: That’s right - and once they'd told me that, I could see my mistake.\nBREDA: So what was the theme of the second competition?\nDAN: Well, my university was on the coast and that area gets a lot of beautiful sunsets, so that was the theme.\nBREDA: Oh, sunsets, that’s a great theme.\n\nDAN: Yes. The instructions were to capture the clouds as well 6 - it couldn't just be blue sky and a setting sun.\nBREDA: Sure, cause they give you all those amazing pinks and purples.\nDAN: Yeah - and I thought I’d done that well, but the feedback was that I should have waited a bit longer to get the shot.\nBREDA: I see. So the timing wasn’t right. 7\n\nDAN: Yes - I took it too soon, basically. And then the third competition I entered was called 'Animal Magic’. 8\nBREDA: Well, that’s a difficult subject!\nDAN: I know! I had to take hundreds of shots.\n\nBREDA: I’m sure - because animals move all the time.\nDAN: That’s what we had to show - there had to be some movement in the scene. 9I got a great shot of a fox in the end, but I took it at night and, well,\tI suspected that it was a bit dark, which is what I was told. 10\n\nBREDA: Well Dan - you seem to be really keen and we'd be delighted to have you in our club. I’m sure we can help with all those areas that you’ve outlined.\nDAN: Thanks, that’s great.", "quote": "BREDA: Hello, Wayside Camera Club, Breda speaking.\nDAN: Oh, hello, um, my name’s Dan and I’d like to join your club.\nBREDA: That’s great, Dan. We have an application form - would you like to complete it over the phone, then you can ask any questions you might have?\nDAN: Oh, yes, thanks.\nBREDA: OK, so what’s your family name?\nDAN: It’s Green - Dan Green.\nBREDA: So - can I take your email address?\nDAN: Yes, it’s dan1068@market.com.\nBREDA: Thanks. And what about your home address?\nDAN: Well, I’m about ten miles away from your club in Peacetown. I live in a house there.\nBREDA: OK, so what’s the house number and street?\nDAN: It’s 52 Marrowfield Street. 1 \nBREDA: Is that M-A double R-O-W-F-l-E-L-D?\n\nDAN: That’s right.\nBREDA: ... and that’s Peacetown, you said?\nDAN: Uhuh.\nBREDA: So how did you hear about our club? Did you look on the internet?\n\nDAN: I usually do that, but this time, well, I was talking to a relative 2 the other day and he suggested it.\n\nBREDA: Oh, is he a member too?\n\nDAN: He belongs to another club - but he’d heard good things about yours.\n\nBREDA: OK. So what do you hope to get from joining?\nDAN: Well, one thing that really interests me is the competitions that you have. I enjoy entering those.\nBREDA: Right. Anything else?\nDAN: Well, I also like to socialise 3with other photographers.\t\nBREDA: That’s great. So what type of membership would you like?\nDAN: What are the options?\nBREDA: It’s £30 a year for full membership 4 or £20 a year if you’re an associate.\n\nDAN: I think I’ll go for the full membership, then.\nBREDA: That’s a good idea because you can’t vote in meetings with an associate membership.\n\nBREDA: If I could just find out a bit more about you ...\nDAN: OK.\nBREDA: So you said you wanted to compete - have you ever won any photography competitions?\n\nDAN: Not yet, but I have entered three in the past.\n\nBREDA: Oh, that’s interesting. So why don’t you tell me something about those? Let's start with the first one.\nDAN: Well, the theme was entitled 'Domestic Life’. 5\n\nBREDA: I see - so it had to be something related to the home?\nDAN: Yeah. I chose to take a photo of a family sitting round the dinner table having a meal, and, urn, I didn’t win, but I did get some feedback.\n\nBREDA: Oh, what did the judges say?\nDAN: That it was too ‘busy’ as a picture.\nBREDA: Aha - so it was the composition of the picture that they criticised?\nDAN: That’s right - and once they'd told me that, I could see my mistake.\nBREDA: So what was the theme of the second competition?\nDAN: Well, my university was on the coast and that area gets a lot of beautiful sunsets, so that was the theme.\nBREDA: Oh, sunsets, that’s a great theme.\n\nDAN: Yes. The instructions were to capture the clouds as well 6 - it couldn't just be blue sky and a setting sun.\nBREDA: Sure, cause they give you all those amazing pinks and purples.\nDAN: Yeah - and I thought I’d done that well, but the feedback was that I should have waited a bit longer to get the shot.\nBREDA: I see. So the timing wasn’t right. 7\n\nDAN: Yes - I took it too soon, basically. And then the third competition I entered was called 'Animal Magic’. 8\nBREDA: Well, that’s a difficult subject!\nDAN: I know! I had to take hundreds of shots.\n\nBREDA: I’m sure - because animals move all the time.\nDAN: That’s what we had to show - there had to be some movement in the scene. 9I got a great shot of a fox in the end, but I took it at night and, well,\tI suspected that it was a bit dark, which is what I was told. 10\n\nBREDA: Well Dan - you seem to be really keen and we'd be delighted to have you in our club. I’m sure we can help with all those areas that you’ve outlined.\nDAN: Thanks, that’s great.", "explain": "BREDA: Alo, Breda từ Wayside Camera Club xin nghe. \nDAN: Ồ, xin chào, ừm, tên tôi là Dan và tôi muốn tham gia câu lạc bộ của bạn.\nBREDA: Điều đó thật tuyệt, Dan. Để tham gia câu lạc bộ thì bạn cần điền vào mẫu đơn – bạn có muốn hoàn thành nó qua điện thoại, sau đó bạn có thể hỏi bất kỳ vấn đề gì mà bạn thắc mắc. \nDAN: Ồ, vâng, cảm ơn.\nBREDA: OK, vậy họ của bạn là gì?\nDAN: Là Green – Tên đầy đủ là Dan Green.\nBREDA: Còn địa chỉ email của bạn?\nDAN: Vâng, đó là dan1068@market.com.\nBREDA: Cảm ơn. Còn về địa chỉ nhà thì sao?\n\nDAN: Chà, nhà tôi ở Peacetown cách câu lạc bộ khoảng mười dặm. Tôi sống ở đó. \nBREDA: OK, vậy số nhà và đường là gì?\n\nDAN: Đó là 52 đường Marrowfield. 1\nBREDA: Có phải là M-A 2 chữ R-O-W-F-l-E-L-D không?\nDAN: Đúng vậy.\nBREDA: ... Bạn nói là Peacetown đúng không?\nDAN: Uh.\nBREDA: Làm thế nào mà bạn biết đến câu lạc bộ của chúng tôi? Internet hay là thông qua những kênh khác? \nDAN: Tôi thường tìm thấy trên Internet, nhưng lần này, là khi tôi đang nói chuyện với một người họ hàng 2 vào ngày hôm trước và anh ấy đã gợi ý cho tôi.\nBREDA: Ồ, anh ấy cũng là thành viên trong câu lạc bộ à?\nDAN: Anh ấy thuộc một câu lạc bộ khác - nhưng anh ấy nghe nói nhiều điều tích cực về câu lạc bộ của các bạn. \nBREDA: Được rồi. Vì vậy, bạn hy vọng mình sẽ nhận được gì từ việc tham gia câu lạc bộ?\nDAN: Chà, một điều thực sự khiến tôi quan tâm là các cuộc thi mà bạn tham gia. Tôi thích tham gia những cuộc thi như thế.\nBREDA: Okay. Còn gì nữa không?\nDAN: Chà, tôi cũng thích giao lưu 3 với các nhiếp ảnh gia khác.\nBREDA: Điều đó thật tuyệt. Vậy bạn muốn tham gia với tư cách thành viên nào?\nDAN: Có những sự lựa chọn nào?\nBREDA: Đó là £30 một năm cho tư cách thành viên chính thức 4 hoặc £20 một năm nếu bạn là cộng tác viên.\nDAN: Vậy thì tôi nghĩ tôi sẽ chọn cái đầu tiên. \nBREDA: Đó là một ý tưởng hay vì bạn không thể bỏ phiếu trong các cuộc họp với tư cách là cộng tác viên. \nBREDA: Liệu tôi có thể hỏi thêm một số thông tin khác về bạn được không? \nDAN: Được chứ\nBREDA: À, bạn nói rằng bạn muốn tham gia cuộc thi - bạn đã bao giờ chiến thắng cuộc thi nhiếp ảnh nào chưa?\nDAN: Chưa, nhưng trước đây tôi từng tham gia 3 cuộc thi. \nBREDA: Ồ, thật thú vị. Vậy tại sao bạn không nói với tôi về những điều đó? Hãy bắt đầu với cuộc thi đầu tiên.\nDAN: Chà, chủ đề có tên là 'Cuộc sống gia đình'. 5\n\nBREDA: Tôi hiểu rồi - vậy nó phải là thứ gì đó liên quan đến gia đình đúng không?\nDAN: Vâng. Tôi đã chọn chụp ảnh một gia đình đang ngồi ăn quanh bàn ăn tối, và, ừm, tôi đã không thắng, nhưng tôi đã nhận được một số lời nhận xét.\nBREDA: Ồ, ban giám khảo đã nói gì?\nDAN: Rằng bức ảnh này quá rối. \nBREDA: Aha - vậy là các giám khảo đã nhận xét về bố cục? \nDAN: Đúng vậy - và một khi họ nói với tôi điều đó, tôi có thể nhận ra sai lầm của mình.\nBREDA: VẬY chủ đề của cuộc thi thứ hai là gì?\n\nDAN: Chà, trường đại học của tôi nằm trên bờ biển và khu vực đó có rất nhiều cảnh hoàng hôn tuyệt đẹp, vì vậy đó là chủ đề.\nBREDA: Ồ, hoàng hôn, đó là một chủ đề tuyệt vời.\nDAN: Vâng. Yêu cầu là chụp cả mây 6 - không thể chỉ có bầu trời xanh và mặt trời lặn.\n\nBREDA: Chắc chắn rồi, vì hoàng hôn cho bạn tất cả những màu hồng và tím tuyệt vời đó.\nDAN: Vâng - và tôi nghĩ rằng mình đã làm tốt điều đó, nhưng phản hồi là tôi nên đợi thêm một chút nữa rồi mới bấm máy. \nBREDA: Tôi hiểu rồi. Vì vậy, là do canh thời gian không đúng. 7\nDAN: Vâng - về cơ bản, tôi đã chụp quá sớm. Và rồi cuộc thi thứ ba mà tôi tham gia có tên là 'Phép Thuật Động Vật'. 8\nBREDA: Chà, đó là một chủ đề khó!\nDAN: Tôi biết! Tôi đã phải chụp hàng trăm bức ảnh.\nBREDA: Tôi chắc chắn - bởi vì động vật di chuyển mọi lúc.\nDAN: Đó là những gì chúng tôi phải thể hiện - phải có một số chuyển động trong bức ảnh. 9 Cuối cùng, tôi đã chụp được một bức ảnh tuyệt vời về một con cáo, nhưng tôi đã chụp nó vào ban đêm và tôi nghi rằng trời hơi tối, đó là những gì tôi được nhận xét. 10\nBREDA: Chà, Dan - bạn có vẻ rất quan tâm và chúng tôi rất vui khi có bạn trong câu lạc bộ của chúng tôi. Tôi chắc chắn rằng chúng tôi có thể trợ giúp với tất cả những lĩnh vực mà bạn đã vạch ra.\nDAN: Cảm ơn, điều đó thật tuyệt."}, "4": {"answer_label": "4. Full", "quote": "BREDA: That’s great. So what type of membership would you like?\nDAN: What are the options?\nBREDA: It’s £30 a year for full membership 4 or £20 a year if you’re an associate.\nDAN: I think I’ll go for the full membership, then.", "explain": "Từ khóa: type, membership, £30\nTừ khóa quan trọng giúp người học dễ xác định được đáp án chính là “£30”. Chỉ cần lắng nghe thật kỹ xem loại thành viên nào cần £30 là được. \nDựa vào từ khóa và bài nghe ta tìm được thông tin sau “It’s £30 a year for full membership or £20 a year if you’re an associate” để xác định được đáp án là full. \nTrong đó, các từ khóa không bị diễn đạt lại hay paraphrase giúp người học dễ dàng xác định đáp án."}, "20": {"answer_label": "BREDA: Hello, Wayside Camera Club, Breda speaking.\nDAN: Oh, hello, um, my name’s Dan and I’d like to join your club.\nBREDA: That’s great, Dan. We have an application form - would you like to complete it over the phone, then you can ask any questions you might have?\nDAN: Oh, yes, thanks.\nBREDA: OK, so what’s your family name?\nDAN: It’s Green - Dan Green.\nBREDA: So - can I take your email address?\nDAN: Yes, it’s dan1068@market.com.\nBREDA: Thanks. And what about your hom he instructions were to capture the clouds as well 6 - it couldn't just be blue sky and a setting sun.\nBREDA: Sure, cause they give you all those amazing pinks and purples.\nDAN: Yeah - and I thought I’d done that well, but the feedback was that I should have waited a bit longer to get the shot.\nBREDA: I see. So the timing wasn’t right. 7\n\nDAN: Yes - I took it too soon, basically. And then the third competition I entered was called 'Animal Magic’. 8\nBREDA: Well, that’s a difficult subject!\nDAN: I know! I had to take hundreds of shots.\n\nBREDA: I’m sure - because animals move all the time.\nDAN: That’s what we had to show - there had to be some movement in the scene. 9I got a great shot of a fox in the end, but I took it at night and, well,\tI suspected that it was a bit dark, which is what I was told. 10\n\nBREDA: Well Dan - you seem to be really keen and we'd be delighted to have you in our club. I’m sure we can help with all those areas that you’ve outlined.\nDAN: Thanks, that’s great.", "explain": "BREDA: Alo, Breda từ Wayside Camera Club xin nghe. \nDAN: Ồ, xin chào, ừm, tên tôi là Dan và tôi muốn tham gia câu lạc bộ của bạn.\nBREDA: Điều đó thật tuyệt, Dan. Để tham gia câu lạc bộ thì bạn cần điền vào mẫu đơn – bạn có muốn hoàn thành nó qua điện thoại, sau đó bạn có thể hỏi bất kỳ vấn đề gì mà bạn thắc mắc. \nDAN: Ồ, vâng, cảm ơn.\nBREDA: OK, vậy họ của bạn là gì?\nDAN: Là Green – Tên đầy đủ là Dan Green.\nBREDA: Còn địa chỉ email của bạn?\nDAN: Vâng, đó là dan1068@market.com.\nBREDA: Cảm ơn. Còn về địa chỉ nhà thì sao?\n\nDAN: Chà, nhà tôi ở Peacetown cách câu lạc bộ khoảng mười dặm. Tôi sống ở đó. \nBREDA: OK, vậy số nhà và đường là gì?\n\nDAN: Đó là 52 đường Marrowfield. 1\nBREDA: Có phải là M-A 2 chữ R-O-W-F-l-E-L-D không?\nDAN: Đúng vậy.\nBREDA: ... Bạn nói là Peacetown đúng không?\nDAN: Uh.\nBREDA: Làm thế nào mà bạn biết đến câu lạc bộ của chúng tôi? Internet hay là thông qua những kênh khác? \nDAN: Tôi thường tìm thấy trên Internet, nhưng lần này, là khi tôi đang nói chuyện với một người họ hàng 2 vào ngày hôm trước và anh ấy đã gợi ý cho tôi.\nBREDA: Ồ, anh ấy cũng là thành viên trong câu lạc bộ à?\nDAN: Anh ấy thuộc một câu lạc bộ khác - nhưng anh ấy nghe nói nhiều điều tích cực về câu lạc bộ của các bạn. \nBREDA: Được rồi. Vì vậy, bạn hy vọng mình sẽ nhận được gì từ việc tham gia câu lạc bộ?\nDAN: Chà, một điều thực sự khiến tôi quan tâm là các cuộc thi mà bạn tham gia. Tôi thích tham gia những cuộc thi như thế.\nBREDA: Okay. Còn gì nữa không?\nDAN: Chà, tôi cũng thích giao lưu 3 với các nhiếp ảnh gia khác.\nBREDA: Điều đó thật tuyệt. Vậy bạn muốn tham gia với tư cách thành viên nào?\nDAN: Có những sự lựa chọn nào?\nBREDA: Đó là £30 một năm cho tư cách thành viên chính thức 4 hoặc £20 một năm nếu bạn là cộng tác viên.\nDAN: Vậy thì tôi nghĩ tôi sẽ chọn cái đầu tiên. \nBREDA: Đó là một ý tưởng hay vì bạn không thể bỏ phiếu trong các cuộc họp với tư cách là cộng tác viên. \nBREDA: Liệu tôi có thể hỏi thêm một số thông tin khác về bạn được không? \nDAN: Được chứ\nBREDA: À, bạn nói rằng bạn muốn tham gia cuộc thi - bạn đã bao giờ chiến thắng cuộc thi nhiếp ảnh nào chưa?\nDAN: Chưa, nhưng trước đây tôi từng tham gia 3 cuộc thi. \nBREDA: Ồ, thật thú vị. Vậy tại sao bạn không nói với tôi về những điều đó? Hãy bắt đầu với cuộc thi đầu tiên.\nDAN: Chà, chủ đề có tên là 'Cuộc sống gia đình'. 5\n\nBREDA: Tôi hiểu rồi - vậy nó phải là thứ gì đó liên quan đến gia đình đúng không?\nDAN: Vâng. Tôi đã chọn chụp ảnh một gia đình đang ngồi ăn quanh bàn ăn tối, và, ừm, tôi đã không thắng, nhưng tôi đã nhận được một số lời nhận xét.\nBREDA: Ồ, ban giám khảo đã nói gì?\nDAN: Rằng bức ảnh này quá rối. \nBREDA: Aha - vậy là các giám khảo đã nhận xét về bố cục? \nDAN: Đúng vậy - và một khi họ nói với tôi điều đó, tôi có thể nhận ra sai lầm của mình.\nBREDA: VẬY chủ đề của cuộc thi thứ hai là gì?\n\nDAN: Chà, trường đại học của tôi nằm trên bờ biển và khu vực đó có rất nhiều cảnh hoàng hôn tuyệt đẹp, vì vậy đó là chủ đề.\nBREDA: Ồ, hoàng hôn, đó là một chủ đề tuyệt vời.\nDAN: Vâng. Yêu cầu là chụp cả mây 6 - không thể chỉ có bầu trời xanh và mặt trời lặn.\n\nBREDA: Chắc chắn rồi, vì hoàng hôn cho bạn tất cả những màu hồng và tím tuyệt vời đó.\nDAN: Vâng - và tôi nghĩ rằng mình đã làm tốt điều đó, nhưng phản hồi là tôi nên đợi thêm một chút nữa rồi mới bấm máy. \nBREDA: Tôi hiểu rồi. Vì vậy, là do canh thời gian không đúng. 7\nDAN: Vâng - về cơ bản, tôi đã chụp quá sớm. Và rồi cuộc thi thứ ba mà tôi tham gia có tên là 'Phép Thuật Động Vật'. 8\nBREDA: Chà, đó là một chủ đề khó!\nDAN: Tôi biết! Tôi đã phải chụp hàng trăm bức ảnh.\nBREDA: Tôi chắc chắn - bởi vì động vật di chuyển mọi lúc.\nDAN: Đó là những gì chúng tôi phải thể hiện - phải có một số chuyển động trong bức ảnh. 9 Cuối cùng, tôi đã chụp được một bức ảnh tuyệt vời về một con cáo, nhưng tôi đã chụp nó vào ban đêm và tôi nghi rằng trời hơi tối, đó là những gì tôi được nhận xét. 10\nBREDA: Chà, Dan - bạn có vẻ rất quan tâm và chúng tôi rất vui khi có bạn trong câu lạc bộ của chúng tôi. Tôi chắc chắn rằng chúng tôi có thể trợ giúp với tất cả những lĩnh vực mà bạn đã vạch ra.\nDAN: Cảm ơn, điều đó thật tuyệt."}, "6": {"answer_label": "6. Clouds", "quote": "BREDA: So what was the theme of the second competition?\nDAN: (…) \nBREDA: Oh, sunsets, that’s a great theme.\nDAN: Yes. The instructions were to capture the clouds as well 6 - it couldn't just be blue sky and a setting sun.", "explain": "Từ khóa: instructions, Beautiful Sunsets \nCâu hỏi số 6 liên quan đến cuộc thi số 2 “Beautiful Sunsets”, người học cần lưu ý để dễ dàng xác định đáp án. Căn cứ vào từ khóa và bài nghe ta xác định được đoạn thông tin sau “DAN: Yes. The instructions were to capture the clouds as well - it couldn't just be blue sky and a setting sun” để chọn được đáp án chính xác là clouds. \nTa có capture the clouds = scene must show some clouds"}, "7": {"answer_label": "7. Timing", "quote": "DAN: Yeah - and I thought I’d done that well, but the feedback was that I should have waited a bit longer to get the shot.\nBREDA: I see. So the timing wasn’t right. 7", "explain": "Từ khóa: feedback, Beautiful Sunsets, wrong\nVị trí trên cần một danh từ để đi với mạo từ “the”. \nCâu hỏi số 7 liên quan đến cuộc thi số 2 “Beautiful Sunsets”, người học cần lưu ý để dễ dàng xác định đáp án. Căn cứ vào từ khóa và bài nghe ta xác định được đoạn thông tin sau “I thought I’d done that well, but the feedback was that I should have waited a bit longer to get the shot. BREDA: I see. So the timing wasn’t right.” Đáp án chính xác là timing. \nWasn’t right = wrong"}, "9": {"answer_label": "9. (animal) movement", "quote": "BREDA: I’m sure - because animals move all the time.\nDAN: That’s what we had to show - there had to be some movement in the scene. 9", "explain": "Từ khóa: instructions, Animal Magic \nCâu hỏi số 9 liên quan đến cuộc thi số 3 “Animal Magic”, người học cần lưu ý để dễ dàng xác định đáp án. Căn cứ vào từ khóa và bài nghe ta xác định được đoạn thông tin sau “DAN: That’s what we had to show - there had to be some movement in the scene” – đáp án chính xác là movement. \nTrong đó, cấu trúc there had to be some movement in the scene được diễn đạt lại thành Scene must show movement"}, "10": {"answer_label": "10. Dark", "quote": "DAN: I got a great shot of a fox in the end, but I took it at night and, well, I suspected that it was a bit dark, which is what I was told. 10", "explain": "Từ khóa: feedback, Animal Magic, photograph \nVị trí trên cần một tính từ (ví phía trước có too và động từ tobe was). \nCâu hỏi số 10 liên quan đến cuộc thi số 3 “Animal Magic”, người học cần lưu ý để dễ dàng xác định đáp án. Căn cứ vào từ khóa và bài nghe ta xác định được đoạn thông tin sau “I got a great shot of a fox in the end, but I took it at night and, well, I suspected that it was a bit dark, which is what I was told” – để xác định đáp án là dark. \nTrong đó, từ “it” thay thế cho cụm “a great shot of a fox” (= photograph); a bit ~ too trong đề bài"}}, "scr
