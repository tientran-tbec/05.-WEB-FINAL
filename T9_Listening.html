<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test 9 &ndash; IELTS Listening Practice</title>
<style>
:root{
  --bg:#eef1f7; --panel:#ffffff; --ink:#1b2540; --muted:#66708a; --line:#e3e7f0;
  --navy:#122a52; --navy-2:#1c3f74; --brand:#1c3f74; --brand-ink:#ffffff;
  --good:#128a4e; --bad:#d64545; --good-bg:#e9f9f1; --bad-bg:#fdecec;
  --accent-bg:#eef2fb; --gold:#c9a24b; --radius:14px;
  --shadow:0 1px 3px rgba(18,42,82,.06), 0 10px 24px -14px rgba(18,42,82,.18);
}
*{box-sizing:border-box;}
body{margin:0;background:linear-gradient(180deg,#e7ebf5 0%,#eef1f7 320px);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
.wrap{max-width:940px;margin:0 auto;padding:28px 16px 80px;}
header.top{padding:6px 4px 22px;text-align:center;}
header.top .kicker{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.14em;color:var(--gold);background:var(--navy);padding:5px 14px;border-radius:999px;margin-bottom:14px;}
header.top h1{font-size:26px;margin:0 0 8px;letter-spacing:.01em;color:var(--navy);font-weight:800;}
header.top p{margin:0;color:var(--muted);font-size:13.5px;}
.tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:22px 0;position:sticky;top:10px;z-index:5;}
.tab-btn{border:1px solid var(--line);background:var(--panel);color:var(--navy);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;transition:.15s;box-shadow:var(--shadow);}
.tab-btn:hover{border-color:var(--navy-2);}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.tab-btn .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--line);margin-right:7px;vertical-align:middle;}
.tab-btn.done .dot{background:var(--gold);}
.part{display:none;}
.part.active{display:block;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:0 0 22px;margin-bottom:20px;box-shadow:var(--shadow);overflow:hidden;}
.part-bar{background:linear-gradient(90deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff;padding:15px 24px;font-weight:800;font-size:15.5px;letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.part-bar .title{font-weight:600;opacity:.92;font-size:13.5px;}
.card-body{padding:20px 24px 0;}
.card .instructions{color:var(--muted);font-size:13.5px;margin-bottom:14px;font-style:italic;}
.audio-box{display:flex;align-items:center;gap:12px;background:var(--accent-bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:4px 0 16px;}
.audio-box .icon{font-size:18px;}
.audio-box .label{font-size:12.5px;font-weight:700;color:var(--navy);white-space:nowrap;}
audio{width:100%;height:36px;}
.qgroup{margin:18px 0;}
.qgroup .header-note{font-size:12.5px;color:var(--navy-2);font-weight:800;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.04em;}
.qgroup .prompt{font-weight:600;margin-bottom:8px;}
.opt-list{display:flex;flex-direction:column;gap:6px;margin-bottom:2px;}
.opt{display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border-radius:9px;border:1px solid var(--line);cursor:pointer;}
.opt:hover{background:var(--accent-bg);border-color:var(--navy-2);}
.opt input{margin-top:3px;}
.opt.correct{background:var(--good-bg);border-color:var(--good);}
.opt.incorrect{background:var(--bad-bg);border-color:var(--bad);}
.opt:has(input:disabled){opacity:.45;cursor:not-allowed;}
.opt input:disabled{cursor:not-allowed;}
.notes-block{white-space:pre-wrap;line-height:2.2;}
.notes-block .subhead{display:block;font-weight:800;margin:16px 0 4px;color:var(--navy);font-size:14.5px;}
.notes-block .bullet{display:block;margin-left:14px;}
.blank{display:inline-block;border:none;border-bottom:2px solid var(--navy-2);background:var(--accent-bg);border-radius:5px 5px 0 0;padding:3px 8px;font:inherit;font-weight:700;min-width:120px;text-align:center;color:var(--ink);}
.blank:focus{outline:none;background:#e4eaf9;}
.blank.correct{border-color:var(--good);background:var(--good-bg);}
.blank.incorrect{border-color:var(--bad);background:var(--bad-bg);}
.blank-num{font-size:11px;color:var(--gold);font-weight:800;vertical-align:super;margin-right:2px;}
.actions{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap;}
button.primary{background:var(--navy);color:#fff;border:none;padding:12px 24px;border-radius:9px;font-size:14.5px;font-weight:700;cursor:pointer;box-shadow:0 6px 14px -6px rgba(18,42,82,.5);}
button.primary:hover{background:var(--navy-2);}
button.ghost{background:#fff;border:1px solid var(--line);color:var(--navy);padding:11px 18px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;}
button.ghost:hover{border-color:var(--navy-2);color:var(--navy-2);}
.score-pill{font-weight:800;padding:9px 18px;border-radius:999px;background:var(--navy);color:#fff;font-size:14px;}
.toggle-section{display:none;margin-top:16px;border-top:1px dashed var(--line);padding-top:16px;}
.toggle-section.open{display:block;}
.script-text{font-size:14.5px;background:#f7f8fc;border:1px solid var(--line);border-radius:10px;padding:14px 16px;max-height:560px;overflow-y:auto;}
.script-line{margin:0 0 10px;line-height:1.65;}
.script-line .spk{font-weight:800;color:var(--navy);margin-right:4px;}
.script-line mark.hl{background:#fdf1d0;border-radius:4px;padding:1px 3px;box-decoration-break:clone;-webkit-box-decoration-break:clone;}
.script-line .qtag{display:inline-block;font-weight:800;color:var(--navy);font-size:11px;background:#e8edf8;border-radius:5px;padding:1px 6px;margin-left:6px;vertical-align:middle;}
.jump-btn{display:inline-block;font-variant-numeric:tabular-nums;font-size:11.5px;font-weight:700;color:#fff;background:var(--navy-2);border:none;border-radius:6px;padding:3px 8px;margin-right:8px;cursor:pointer;vertical-align:middle;}
.jump-btn:hover{background:var(--navy);}
.expl-item{border-top:1px solid var(--line);padding:14px 0;}
.expl-item:first-child{border-top:none;}
.expl-item .eq-head{display:flex;gap:10px;align-items:center;margin-bottom:6px;}
.expl-item .qnum{background:var(--navy);color:#fff;font-weight:800;font-size:12px;border-radius:6px;padding:3px 9px;}
.expl-item .ans{font-weight:800;color:var(--good);}
.expl-item .quote{font-style:italic;color:var(--muted);font-size:13.5px;margin:4px 0 6px;white-space:pre-wrap;}
.expl-item .explain{font-size:14px;white-space:pre-wrap;}
.example-line{color:var(--muted);font-style:italic;}
.script-note{font-size:12.5px;color:var(--muted);margin:0 0 10px;}
footer.credit{color:var(--muted);font-size:12px;text-align:center;margin-top:26px;}
.box-panel{background:var(--accent-bg);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:14px;}
.box-panel .box-title{font-weight:800;color:var(--navy);margin-bottom:8px;font-size:13.5px;}
.box-panel .box-item{display:flex;gap:8px;margin:4px 0;font-size:14px;}
.box-panel .box-item b{color:var(--navy-2);min-width:18px;}
.map-img{max-width:100%;border-radius:10px;border:1px solid var(--line);margin-bottom:14px;display:block;}
.stem-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);}
.stem-row:last-child{border-bottom:none;}
.stem-row .stem-text{flex:1;}
.stem-row select{padding:7px 10px;border-radius:8px;border:1px solid var(--line);font:inherit;font-weight:700;min-width:70px;background:#fff;}
.stem-row select.correct{border-color:var(--good);background:var(--good-bg);}
.stem-row select.incorrect{border-color:var(--bad);background:var(--bad-bg);}
@media(max-width:520px){.wrap{padding:18px 10px 60px;}.card-body{padding:16px 16px 0;}.part-bar{padding:13px 16px;}}
</style>
</head>

<script>
const TEST_DATA = {"test": "Test 9", "parts": [{"part": 1, "kind": "notes", "title": "Easy Life Cleaning Services", "instructions": null, "audio": "audio/test9/part1.mp3", "answers": {"1": "floor(s)", "2": "fridge", "3": "shirts", "4": "windows", "5": "balcony", "6": "electrician", "7": "dust", "8": "police", "9": "training", "10": "review"}, "explanations": {"1": {"answer_label": "1. floor", "quote": "CLIENT: No, I don't have any, but the floor would need cleaning.\nJACINTA: Of course - we'd do that in every room. And we'd do a thorough clean of the kitchen and bathroom", "explain": "Câu hỏi: \nCleaning the 1... throughout the apartment\nKeywords được paraphrase:\nevery room - throughout the apartment\n  Giải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Khách hàng nói rằng, sàn nhà-‘floor' của anh ta nên được lau chùi. Jacinta nói rằng, chắc chắn, chúng tôi làm việc đó ở tất cả các phòng"}, "2": {"answer_label": "2. fridge", "quote": "CLIENT: Actually, I hardly ever use that, but can you do the fridge?\nJACINTA: Sure.\nWould you like that done every week?\nCLIENT: Yes, definitely. And would ironing clothes be an additional service you can do?", "explain": "Câu hỏi: Every week\nCleaning the 2 ...\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Khách hàng yêu cầu bên phía Jacinta lau chùi tủ lạnh-‘fridge'. Jacinta offer khách hàng là bên phía Jacinta sẽ lau chùi tủ lạnh hàng tuần"}, "3": {"answer_label": "3. shirts", "quote": "CLIENT: Yes, definitely. And would ironing clothes be an additional service you can do?\nJACINTA: Yes, of course.\nCLIENT: It wouldn't be much, just my shirts for work that week.\nJACINTA: That's fine. And we could also clean your microwave if you want.\nCLIENT: No, I wipe that out pretty regularly so there's no need for that", "explain": "Câu hỏi: \nIroning clothes - ... only\n  Giải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Khách hàng yêu cầu dịch vụ ủi đồ từ phía Jacinta. Sau đó khách hàng giao cho phía Jacinta ủi áo-‘shirts' cho khách hàng. Ngoài ra phía Jacinta còn offer thêm lau chùi lò vi sóng nhưng phía khách hàng từ chối."}, "4": {"answer_label": "4. windows", "quote": "JACINTA: We also offer additional services that you might want a bit less often, say every month. So for example, if the inside of your windows need cleaning, we could do that.\nCLIENT: Yes, that'd be good. I'm on the fifteenth floor, so the outside gets done regularly by specialists, but the inside goes get a bit grubby.", "explain": "Câu hỏi:\n Every month \nCleaning all the 4.... from the inside\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Jacinta offer khách hàng dịch vụ lau cửa số-‘windows' từ bên trong, và khách hàng đồng ý."}, "5": {"answer_label": "5. balcony", "quote": "CLIENT: No, they're OK. But would you be able to do something about the balcony ? It's quite small and I don't use it much, but it could do with a wash every month or so.\nJACINTA: Yes, we can get the pressure washer onto that", "explain": "Câu hỏi: \nWashing down the 5 ...\nGiải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. khách hàng hỏi bên phía Jacinta có thể làm gì với cái ban công không, và bên phía Jacinta sẽ có vòi áp suất để rửa."}, "6": {"answer_label": "6. electrician", "quote": "JACINTA: Now if you're interested, we do offer some other possibilities to do with general maintenance. For example, if you have a problem with water and you need a plumber in a hurry, we can put you in touch with a reliable one who can come out straightaway. And the same thing if you need an electrician", "explain": "Câu hỏi: \nThey can organise a plumber or an ... if necessary \nKeywords được paraphrase:\nIf necessary - if you need\n  Giải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Họ có thể sắp xếp một người thợ sửa ống nước hoặc một người thợ điện-‘electrician' nếu bạn cần"}, "7": {"answer_label": "7. dust", "quote": "Cleaning system which can improve the indoor air quality of your home by capturing up to 99% of all the dust in the air. So if you're troubled by allergies, this can make a big difference", "explain": "Câu hỏi: A special cleaning service is available for customers who are allergic to 7\t …….\nKeywords được paraphrase:\nWho are allergic to - if you're troubled by allergies\n  Giải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Một dịch vụ làm sạch đặc biệt có sẵn cho những khách hàng bị dị ứng với bụi-‘dust'"}, "8": {"answer_label": "8. police", "quote": "Of course. So all our cleaners are very carefully selected. When they apply to us, they have to undergo a security check with the police", "explain": "Câu hỏi: Before being hired, all cleaners have a background check carried out by the 8...\nKeywords được paraphrase:\nbackground check - sercurity check\n  Giải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Trước khi được thuê, tất cả những người dọn dẹp đều phải kiểm tra lý lịch do cảnh sát- ‘police'"}, "9": {"answer_label": "9. training", "quote": "Then if we think they might be suitable for the job, we give them training for it. That lasts for two weeks", "explain": "Câu hỏi: All cleaners are given 9 .. for two weeks\nKeywords được paraphrase:\nWe give them - All cleaners are given\n  Giải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Tất cả những người dọn dẹp đều được đào tạo-‘training' trong hai tuần"}, "10": {"answer_label": "10. review", "quote": "If they pass that, we take them on, but we monitor them very carefully - we ask all our clients to complete a review of their performance after every visit and to email it to us. So we can pick up any problems straightaway and deal with them", "explain": "Câu hỏi: Customers send a 10 ... after each visit\nKeywords được paraphrase:\nCustomers - clients\nafter each visit - after every visit\n  Giải thích đáp án:\nCâu hỏi yêu cầu điền một danh từ. Chúng tôi yêu cầu những khách hàng để hoàn thành những đánh giá-‘review' của những người dọn dẹp mỗi lần họ đến qua mail cho chúng tôi."}}, "script_full": [{"speaker": "JACINTA", "text": "Hello, Easy Life Cleaning Services, Jacinta speaking.", "qids": [], "time_seconds": null}, {"speaker": "CLIENT", "text": "Oh hello. I'm looking for a cleaning service for my apartment - do you do domestic cleaning?", "qids": [], "time_seconds": null}, {"speaker": "JACINTA", "text": "Sure.", "qids": [], "time_seconds": null}, {"speaker": "CLIENT", "text": "Well, it's just a one-bedroom flat. Do you have a basic cleaning package?", "qids": [], "time_seconds": null}, {"speaker": "JACINTA", "text": "Yes. For a one-bedroom flat we're probably looking at about two hours for a clean. So we'd do a thorough clean of all surfaces in each room, and polish them where necessary. Does your apartment have carpets?", "qids": [], "time_seconds": null}, {"speaker": "CLIENT", "text": "No, I don't have any, but the floor would need cleaning.", "qids": [], "time_seconds": null}, {"speaker": "JACINTA", "text": "Of course - we'd do that in every room. And we'd do a thorough clean of the kitchen and bathroom.", "qids": ["1"], "time_seconds": 115}, {"speaker": "CLIENT", "text": "OK.", "qids": [], "time_seconds": null}, {"speaker": "JACINTA", "text": "Then we have some additional services which you can request if you want - so for example, we can clean your oven for you every week.", "qids": [], "time_seconds": null}, {"speaker": "CLIENT", "text": "Actually, I hardly ever use that, but can you do the fridge?", "qids": ["2"], "time_seconds": 130}, {"speaker": "JACINTA", "text": "Sure. Would you like that done every week?", "qids": [], "time_seconds": null}, {"speaker": "CLIENT", "text": "Yes, definitely. And would ironing clothes be an additional service you can do?", "qids": [], "time_seconds": null}, {"speaker": "JACINTA", "text": "Yes, of course.", "qids": [], "time_seconds": null}, {"speaker": "CLIENT", "text": "It wouldn't be much, just my shirts for work that week.", "qids": ["3"], "time_seconds": 145}, {"speaker": "JACINTA", "text": "That's fine. And we could also clean your microwave if you want.", "qids": [], "time_seconds": null}, {"speaker": "CLIENT", "text": "No, I wipe that out pretty regularly so there's no need for that.", "qids": [], "time_seconds": null}, {"speaker": "JACINTA", "text": "We also offer additional services that you might want a bit less often, say every month. So for example, if the inside of your windows need cleaning, we could do that.", "qids": ["4"], "time_seconds": 157}, {"speaker": "CLIENT", "text": "Yes, that'd be good. I'm on the fifteenth floor, so the outside gets done regularly by specialists, but the inside does get a bit grubby.", "qids": [], "time_seconds": null}, {"speaker": "JACINTA", "text": "And we could arrange for your curtains to get cleaned if necessary.", "qids": [], "time_seconds": null}, {"speaker": "CLIENT", "text": "No, they're OK. But would you be able to do something about the balcony? It's quite small and I don't use it much, but it could do with a wash every month or so.", "qids": ["5"], "time_seconds": 181}, {"speaker": "JACINTA", "text": "Yes, we can get the pressure washer onto that.", "qids": [], "time_seconds": null}, {"speaker": "JACINTA", "text": "Now if you're interested, we do offer some other possibilities to do with general maintenance. For example, if you have a problem with water and you need a plumber in a hurry, we can put you in touch with a reliable one who can come out straightaway. And the same thing if you need an electrician.", "qids": ["6"], "time_seconds": 228}, {"speaker": "CLIENT", "text": "Right. That's good to know. I've only just moved here so I don't have any of those sorts of contacts.", "qids": [], "time_seconds": null}, {"speaker": "JACINTA", "text": "And I don't know if this is of interest to you, but we also offer a special vacuum cleaning system which can improve the indoor air quality of your home by capturing up to 99% of all the dust in the air. So if you're troubled by allergies, this can make a big difference.", "qids": ["7"], "time_seconds": 260}, {"speaker": "CLIENT", "text": "Right. In fact, I don't have that sort of problem, but I'll bear it in mind. Now can you tell me a bit about your cleaning staff?", "qids": [], "time_seconds": null}, {"speaker": "JACINTA", "text": "Of course. So all our cleaners are very carefully selected. When they apply to us, they have to undergo a security check with the police to make sure they don't have any sort of criminal background, and, of course, they have to provide references as well. Then if we think they might be suitable for the job, we give them training for it. That lasts for two weeks so it's very thorough, and at the end of it, they have a test. If they pass that, we take them on, but we monitor them very carefully - we ask all our clients to complete a review of their performance after every visit and to email it to us. So we can pick up any problems straightaway and deal with them.", "qids": ["8", "9", "10"], "time_seconds": 286}, {"speaker": "CLIENT", "text": "OK, well that all sounds good. And will I always have the same cleaner?", "qids": [], "time_seconds": null}, {"speaker": "JACINTA", "text": "Yes, we do our best to organise it that way, and we usually manage it.", "qids": [], "time_seconds": null}, {"speaker": "CLIENT", "text": "Good. That's fine. Right, so I'd like to go ahead and ...", "qids": [], "time_seconds": null}], "notes": ["Easy Life Cleaning Services", "Basic cleaning package offered", "●   Cleaning all surfaces", "●   Cleaning the {{1}} throughout the apartment", "●   Cleaning shower, sinks, toilet etc.", "Additional services agreed", "●   Every week", "–  Cleaning the {{2}}", "–  Ironing clothes – {{3}} only", "●   Every month", "–  Cleaning all the {{4}} from the inside", "–  Washing down the {{5}}", "Other possibilities", "●   They can organise a plumber or an {{6}} if necessary.", "●   A special cleaning service is available for customers who are allergic to {{7}}", "Information on the cleaners", "●   Before being hired, all cleaners have a background check carried out by the {{8}}", "●   References are required.", "●   All cleaners are given {{9}} for two weeks.", "●   Customers send a {{10}} after each visit.", "●   Usually, each customer has one regular cleaner."]}, {"part": 2, "kind": "mcq", "title": "Museum Tour", "instructions": null, "audio": "audio/test9/part2.mp3", "answers": {"11": "B", "12": "A", "13": "A", "14": "C", "15": "F", "16": "G", "17": "E", "18": "A", "19": "C", "20": "B"}, "explanations": {"1880": {"answer_label": "Good morning everyone, and welcome to the Museum of Farming Life. I understand it’s your first visit here, so I’d like to give you some background information about the museum and then explain a little about what you can see during your visit.\n\nSo, where we're standing at the moment is the entrance to a large building that was constructed in 1880 as the home of a local businessman (Q11), Alfred Palmer, of the Palmer biscuit factory. It was later sold and became a hall of residence for students in 1911, and a museum in 1951. In 2005, a modern extension was built to accommodate the museum’s collections.\n\nThe museum’s owned by the university, and apart from two rooms that are our offices, the university uses the main part of the building. You may see students going into the building for lessons (Q12), but it’s not open to museum visitors, I’m afraid. It’s a shame because the interior architectural features are outstanding, especially the room that used to be the library.\n\nLuckily, we’ve managed to keep entry to the museum free. This includes access to all the galleries, outdoor areas and the rooms for special exhibitions. We run activities for children and students, such as the museum club, for which there’s no charge. We do have a donation box just over there so feel free to give whatever amount you consider appropriate. (Q13)\n\nWe do have a cloakroom, if you'd like to leave your coats and bags somewhere. (Q14) Unlike other museums, photography is allowed here, so you might like to keep your cameras with you. \n\nYou might be more comfortable not carrying around heavy rucksacks, though keep your coats and jackets on as it's quite cold in the museum garden today.\n--------------------------------------\nI’d like to tell you about the different areas of the museum.\n\nJust inside, and outside the main gallery, we have an area called Four Seasons. Here you can watch a four-minute animation of a woodland scene. It was designed especially for the, museum by a group of young people on a film studies course (Q15), and it’s beautiful. Children absolutely love it, but then, so do adults.\n\nThe main gallery’s called Town and Country. It includes a photographic collection of prizewinning sheep and shepherds. Leaving Town and Country, you enter Farmhouse Kitchen, which is ... well, self-explanatory. Here we have the oldest collection of equipment for making butter and cheese in the country. And this morning, a specialist cheesemaker will be giving demonstrations (Q16) of how it’s produced. You may even get to try some.\n\nAfter that, you can go in two directions. To the right is a staircase that takes you up to a landing from where you can look down on the galleries. To the left is a room called A Year on the Farm. There's lots of seating here as sometimes we use the room for school visits, so it’s a good place to stop for a rest. If you’re feeling competitive, you can take our memory test in which you answer questions about things you’ve seen in the museum. (Q17)\n\nThe next area’s called Wagon Walk. This contains farm carts from nearly every part of the country. It’s surprising how much regional variation there was. Beside the carts are display boards with information about each one. The carts are old and fragile, so we ask you to keep your children close to you and ensure they don’t climb on the carts. (Q18)\n\nFrom Wagon Walk, you can either make your way back to reception or go out into the garden - or even go back to take another look in the galleries. In the far corner of the garden is Bees are Magic, but we’re redeveloping this area so you can’t visit that at the moment. (Q19) You can still buy our honey in the shop, though.\n\n\nFinally, there’s The Pond, which contains all kinds of interesting wildlife. There are baby ducks that are only a few days old, as well as tiny frogs. (Q20) The Pond isn’t deep and there’s a fence around it, so it’s perfectly safe for children.", "quote": "Good morning everyone, and welcome to the Museum of Farming Life. I understand it’s your first visit here, so I’d like to give you some background information about the museum and then explain a little about what you can see during your visit.\n\nSo, where we're standing at the moment is the entrance to a large building that was constructed in 1880 as the home of a local businessman (Q11), Alfred Palmer, of the Palmer biscuit factory. It was later sold and became a hall of residence for students in 1911, and a museum in 1951. In 2005, a modern extension was built to accommodate the museum’s collections.\n\nThe museum’s owned by the university, and apart from two rooms that are our offices, the university uses the main part of the building. You may see students going into the building for lessons (Q12), but it’s not open to museum visitors, I’m afraid. It’s a shame because the interior architectural features are outstanding, especially the room that used to be the library.\n\nLuckily, we’ve managed to keep entry to the museum free. This includes access to all the galleries, outdoor areas and the rooms for special exhibitions. We run activities for children and students, such as the museum club, for which there’s no charge. We do have a donation box just over there so feel free to give whatever amount you consider appropriate. (Q13)\n\nWe do have a cloakroom, if you'd like to leave your coats and bags somewhere. (Q14) Unlike other museums, photography is allowed here, so you might like to keep your cameras with you. \n\nYou might be more comfortable not carrying around heavy rucksacks, though keep your coats and jackets on as it's quite cold in the museum garden today.\n--------------------------------------\nI’d like to tell you about the different areas of the museum.\n\nJust inside, and outside the main gallery, we have an area called Four Seasons. Here you can watch a four-minute animation of a woodland scene. It was designed especially for the, museum by a group of young people on a film studies course (Q15), and it’s beautiful. Children absolutely love it, but then, so do adults.\n\nThe main gallery’s called Town and Country. It includes a photographic collection of prizewinning sheep and shepherds. Leaving Town and Country, you enter Farmhouse Kitchen, which is ... well, self-explanatory. Here we have the oldest collection of equipment for making butter and cheese in the country. And this morning, a specialist cheesemaker will be giving demonstrations (Q16) of how it’s produced. You may even get to try some.\n\nAfter that, you can go in two directions. To the right is a staircase that takes you up to a landing from where you can look down on the galleries. To the left is a room called A Year on the Farm. There's lots of seating here as sometimes we use the room for school visits, so it’s a good place to stop for a rest. If you’re feeling competitive, you can take our memory test in which you answer questions about things you’ve seen in the museum. (Q17)\n\nThe next area’s called Wagon Walk. This contains farm carts from nearly every part of the country. It’s surprising how much regional variation there was. Beside the carts are display boards with information about each one. The carts are old and fragile, so we ask you to keep your children close to you and ensure they don’t climb on the carts. (Q18)\n\nFrom Wagon Walk, you can either make your way back to reception or go out into the garden - or even go back to take another look in the galleries. In the far corner of the garden is Bees are Magic, but we’re redeveloping this area so you can’t visit that at the moment. (Q19) You can still buy our honey in the shop, though.\n\n\nFinally, there’s The Pond, which contains all kinds of interesting wildlife. There are baby ducks that are only a few days old, as well as tiny frogs. (Q20) The Pond isn’t deep and there’s a fence around it, so it’s perfectly safe for children.", "explain": "Chào buổi sáng mọi người và chào mừng đến với Bảo tàng Đời sống Nông dân. Tôi hiểu đây là lần đầu tiên bạn đến đây, vì vậy tôi muốn cung cấp cho bạn một số thông tin cơ bản về bảo tàng và sau đó giải thích một chút về những gì bạn có thể thấy trong chuyến thăm của mình.\n\nVậy, nơi chúng tôi đang đứng lúc này là lối vào một tòa nhà lớn được xây dựng vào năm 1880 với tư cách là nhà của một doanh nhân địa phương (Q11), Alfred Palmer, của nhà máy bánh quy Palmer. Sau đó nó được bán và trở thành ký túc xá cho sinh viên vào năm 1911, và thành bảo tàng vào năm 1951. Năm 2005, một phần mở rộng hiện đại được xây dựng để chứa các bộ sưu tập của bảo tàng.\nBảo tàng thuộc sở hữu của trường đại học, và ngoài hai phòng là văn phòng của chúng tôi, trường đại học sử dụng phần chính của tòa nhà. Bạn có thể thấy sinh viên vào tòa nhà để học bài (Q12), nhưng tôi e rằng nó không mở cửa cho khách tham quan bảo tàng. Thật đáng tiếc vì các đặc điểm kiến trúc bên trong rất nổi bật, đặc biệt là căn phòng từng là thư viện.\n\nMay mắn thay, chúng tôi đã thu xếp để vào bảo tàng miễn phí. Điều này bao gồm quyền sử dụng tất cả các phòng trưng bày, khu vực ngoài trời và các phòng triển lãm đặc biệt. Chúng tôi điều hành các hoạt động dành cho trẻ em và học sinh, chẳng hạn như câu lạc bộ bảo tàng, miễn phí. Chúng tôi có một hộp quyên góp ở ngay đằng kia, vì vậy hãy thoải mái đóng góp bất kỳ số tiền nào bạn cho là phù hợp. (Q13)\nChúng tôi có một phòng để đồ, nếu bạn muốn để áo khoác và túi xách của mình ở đâu đó. (Q14) Không giống như các bảo tàng khác, ở đây cho phép chụp ảnh, vì vậy bạn có thể mang theo máy ảnh bên mình.\nBạn có thể thoải mái hơn khi không mang theo những chiếc ba lô nặng, mặc dù vậy hãy mặc áo khoác ngoài vì hôm nay trời khá lạnh trong vườn bảo tàng.\n--------------------------------------\nTôi muốn nói với bạn về các khu vực khác nhau của bảo tàng.\n\nNgay bên trong và bên ngoài phòng trưng bày chính, chúng tôi có một khu vực gọi là Bốn Mùa. Tại đây, bạn có thể xem một đoạn phim hoạt hình dài bốn phút về cảnh rừng cây. Nó được thiết kế đặc biệt cho bảo tàng bởi một nhóm thanh niên đang theo học khóa học về điện ảnh (Q15), và nó rất đẹp. Trẻ em cực kỳ thích nó, nhưng sau đó, người lớn cũng vậy.\nPhòng trưng bày chính có tên là Thị trấn và Quốc gia. Nó bao gồm một bộ sưu tập ảnh về những con cừu và người chăn cừu từng đoạt giải thưởng. Rời khỏi Thị trấn và Quốc gia, bạn vào Nhà Bếp của Nông Trại, điều này ... tốt, tự giải thích. Ở đây chúng tôi có bộ sưu tập thiết bị làm bơ và pho mát lâu đời nhất trong cả nước. Và sáng nay, một nhà sản xuất pho mát chuyên nghiệp sẽ trình diễn (Q16) về cách sản xuất pho mát. Bạn thậm chí có thể ăn thử.\n\nSau đó, bạn có thể đi theo hai hướng. Bên phải là một cầu thang đưa bạn lên khu vực từ đó bạn có thể nhìn xuống các phòng trưng bày. Bên trái là căn phòng có tên Một năm ở Nông trại. Có rất nhiều chỗ ngồi ở đây vì đôi khi chúng tôi sử dụng phòng này để các trường đến tham quan, vì vậy đây là một nơi tốt để dừng chân nghỉ ngơi. Nếu bạn cảm thấy cạnh tranh, bạn có thể làm bài kiểm tra trí nhớ của chúng tôi, trong đó bạn trả lời câu hỏi về những thứ bạn đã thấy trong bảo tàng. (Q17)\nKhu vực tiếp theo được gọi là Wagon Walk (Toa xe đi bộ). Điều này chứa xe nông trại từ hầu hết mọi miền của đất nước. Thật đáng ngạc nhiên là có bao nhiêu sự khác biệt trong khu vực. Bên cạnh những chiếc xe đẩy là những bảng trưng bày thông tin về từng chiếc xe. Xe đẩy cũ và dễ hỏng, vì vậy chúng tôi yêu cầu bạn giữ trẻ em gần bạn và đảm bảo chúng không trèo lên xe. (Q18)\nTừ Wagon Walk, bạn có thể quay trở lại quầy lễ tân hoặc ra ngoài vườn - hoặc thậm chí quay lại để ngắm nhìn các phòng trưng bày. Ở góc xa của khu vườn là Bees are Magic (những con ong phép thuật), nhưng chúng tôi đang tái phát triển khu vực này nên bạn không thể ghé thăm khu vực đó vào lúc này. (Q19) Tuy nhiên, bạn vẫn có thể mua mật ong của chúng tôi tại cửa hàng.\nCuối cùng, có The Pond (cái ao), nơi chứa tất cả các loại động vật hoang dã thú vị. Có những chú vịt con mới vài ngày tuổi, có cả những chú ếch nhỏ. (Q20) Ao không sâu và có hàng rào bao quanh nên hoàn toàn an toàn cho trẻ em."}, "11": {"answer_label": "11", "quote": "B. a private home", "explain": "Cả 3 đáp án đều xuất hiện nhưng nhà riêng là đúng nhất vì câu hỏi về nguồn gốc của bảo tàng. Alfred Palmer có nhà máy bánh quy, nó được bán và chuyển thành ký túc xá nên loại đáp án B và C vì không liên quan đến viện bảo tàng."}, "1911": {"answer_label": "Good morning everyone, and welcome to the Museum of Farming Life. I understand it’s your first visit here, so I’d like to give you some background information about the museum and then explain a little about what you can see during your visit.\n\nSo, where we're standing at the moment is the entrance to a large building that was constructed in 1880 as the home of a local businessman (Q11), Alfred Palmer, of the Palmer biscuit factory. It was later sold and became a hall of residence for students in 1911, and a museum in 1951. In 2005, a modern extension was built to accommodate the museum’s collections.\n\nThe museum’s owned by the university, and apart from two rooms that are our offices, the university uses the main part of the building. You may see students going into the building for lessons (Q12), but it’s not open to museum visitors, I’m afraid. It’s a shame because the interior architectural features are outstanding, especially the room that used to be the library.\n\nLuckily, we’ve managed to keep entry to the museum free. ery part of the country. It’s surprising how much regional variation there was. Beside the carts are display boards with information about each one. The carts are old and fragile, so we ask you to keep your children close to you and ensure they don’t climb on the carts. (Q18)\n\nFrom Wagon Walk, you can either make your way back to reception or go out into the garden - or even go back to take another look in the galleries. In the far corner of the garden is Bees are Magic, but we’re redeveloping this area so you can’t visit that at the moment. (Q19) You can still buy our honey in the shop, though.\n\n\nFinally, there’s The Pond, which contains all kinds of interesting wildlife. There are baby ducks that are only a few days old, as well as tiny frogs. (Q20) The Pond isn’t deep and there’s a fence around it, so it’s perfectly safe for children.", "explain": "Chào buổi sáng mọi người và chào mừng đến với Bảo tàng Đời sống Nông dân. Tôi hiểu đây là lần đầu tiên bạn đến đây, vì vậy tôi muốn cung cấp cho bạn một số thông tin cơ bản về bảo tàng và sau đó giải thích một chút về những gì bạn có thể thấy trong chuyến thăm của mình.\n\nVậy, nơi chúng tôi đang đứng lúc này là lối vào một tòa nhà lớn được xây dựng vào năm 1880 với tư cách là nhà của một doanh nhân địa phương (Q11), Alfred Palmer, của nhà máy bánh quy Palmer. Sau đó nó được bán và trở thành ký túc xá cho sinh viên vào năm 1911, và thành bảo tàng vào năm 1951. Năm 2005, một phần mở rộng hiện đại được xây dựng để chứa các bộ sưu tập của bảo tàng.\nBảo tàng thuộc sở hữu của trường đại học, và ngoài hai phòng là văn phòng của chúng tôi, trường đại học sử dụng phần chính của tòa nhà. Bạn có thể thấy sinh viên vào tòa nhà để học bài (Q12), nhưng tôi e rằng nó không mở cửa cho khách tham quan bảo tàng. Thật đáng tiếc vì các đặc điểm kiến trúc bên trong rất nổi bật, đặc biệt là căn phòng từng là thư viện.\n\nMay mắn thay, chúng tôi đã thu xếp để vào bảo tàng miễn phí. Điều này bao gồm quyền sử dụng tất cả các phòng trưng bày, khu vực ngoài trời và các phòng triển lãm đặc biệt. Chúng tôi điều hành các hoạt động dành cho trẻ em và học sinh, chẳng hạn như câu lạc bộ bảo tàng, miễn phí. Chúng tôi có một hộp quyên góp ở ngay đằng kia, vì vậy hãy thoải mái đóng góp bất kỳ số tiền nào bạn cho là phù hợp. (Q13)\nChúng tôi có một phòng để đồ, nếu bạn muốn để áo khoác và túi xách của mình ở đâu đó. (Q14) Không giống như các bảo tàng khác, ở đây cho phép chụp ảnh, vì vậy bạn có thể mang theo máy ảnh bên mình.\nBạn có thể thoải mái hơn khi không mang theo những chiếc ba lô nặng, mặc dù vậy hãy mặc áo khoác ngoài vì hôm nay trời khá lạnh trong vườn bảo tàng.\n--------------------------------------\nTôi muốn nói với bạn về các khu vực khác nhau của bảo tàng.\n\nNgay bên trong và bên ngoài phòng trưng bày chính, chúng tôi có một khu vực gọi là Bốn Mùa. Tại đây, bạn có thể xem một đoạn phim hoạt hình dài bốn phút về cảnh rừng cây. Nó được thiết kế đặc biệt cho bảo tàng bởi một nhóm thanh niên đang theo học khóa học về điện ảnh (Q15), và nó rất đẹp. Trẻ em cực kỳ thích nó, nhưng sau đó, người lớn cũng vậy.\nPhòng trưng bày chính có tên là Thị trấn và Quốc gia. Nó bao gồm một bộ sưu tập ảnh về những con cừu và người chăn cừu từng đoạt giải thưởng. Rời khỏi Thị trấn và Quốc gia, bạn vào Nhà Bếp của Nông Trại, điều này ... tốt, tự giải thích. Ở đây chúng tôi có bộ sưu tập thiết bị làm bơ và pho mát lâu đời nhất trong cả nước. Và sáng nay, một nhà sản xuất pho mát chuyên nghiệp sẽ trình diễn (Q16) về cách sản xuất pho mát. Bạn thậm chí có thể ăn thử.\n\nSau đó, bạn có thể đi theo hai hướng. Bên phải là một cầu thang đưa bạn lên khu vực từ đó bạn có thể nhìn xuống các phòng trưng bày. Bên trái là căn phòng có tên Một năm ở Nông trại. Có rất nhiều chỗ ngồi ở đây vì đôi khi chúng tôi sử dụng phòng này để các trường đến tham quan, vì vậy đây là một nơi tốt để dừng chân nghỉ ngơi. Nếu bạn cảm thấy cạnh tranh, bạn có thể làm bài kiểm tra trí nhớ của chúng tôi, trong đó bạn trả lời câu hỏi về những thứ bạn đã thấy trong bảo tàng. (Q17)\nKhu vực tiếp theo được gọi là Wagon Walk (Toa xe đi bộ). Điều này chứa xe nông trại từ hầu hết mọi miền của đất nước. Thật đáng ngạc nhiên là có bao nhiêu sự khác biệt trong khu vực. Bên cạnh những chiếc xe đẩy là những bảng trưng bày thông tin về từng chiếc xe. Xe đẩy cũ và dễ hỏng, vì vậy chúng tôi yêu cầu bạn giữ trẻ em gần bạn và đảm bảo chúng không trèo lên xe. (Q18)\nTừ Wagon Walk, bạn có thể quay trở lại quầy lễ tân hoặc ra ngoài vườn - hoặc thậm chí quay lại để ngắm nhìn các phòng trưng bày. Ở góc xa của khu vườn là Bees are Magic (những con ong phép thuật), nhưng chúng tôi đang tái phát triển khu vực này nên bạn không thể ghé thăm khu vực đó vào lúc này. (Q19) Tuy nhiên, bạn vẫn có thể mua mật ong của chúng tôi tại cửa hàng.\nCuối cùng, có The Pond (cái ao), nơi chứa tất cả các loại động vật hoang dã thú vị. Có những chú vịt con mới vài ngày tuổi, có cả những chú ếch nhỏ. (Q20) Ao không sâu và có hàng rào bao quanh nên hoàn toàn an toàn cho trẻ em."}, "1951": {"answer_label": "Good morning everyone, and welcome to the Museum of Farming Life. I understand it’s your first visit here, so I’d like to give you some background information about the museum and then explain a little about what you can see during your visit.\n\nSo, where we're standing at the moment is the entrance to a large building that was constructed in 1880 as the home of a local businessman (Q11), Alfred Palmer, of the Palmer biscuit factory. It was later sold and became a hall of residence for students in 1911, and a museum in 1951. In 2005, a modern extension was built to accommodate the museum’s collections.\n\nThe museum’s owned by the university, and apart from two rooms that are our offices, the university uses the main part of the building. You may see students going into the building for lessons (Q12), but it’s not open to museum visitors, I’m afraid. It’s a shame because the interior architectural features are outstanding, especially t ’m afraid. It’s a shame because the interior architectural features are outstanding, especially the room that used to be the library.\n\nLuckily, we’ve managed to keep entry to the museum free. This includes access to all the galleries, outdoor areas and the rooms for special exhibitions. We run activities for children and students, such as the museum club, for which there’s no charge. We do have a donation box just over there so feel free to give whatever amount you consider appropriate. (Q13)\n\nWe do have a cloakroom, if you'd like to leave your coats and bags somewhere. (Q14) Unlike other museums, photography is allowed here, so you might like to keep your cameras with you. \n\nYou might be more comfortable not carrying around heavy rucksacks, though keep your coats and jackets on as it's quite cold in the museum garden today.\n--------------------------------------\nI’d like to tell you about the different areas of the museum.\n\nJust inside, and outside the main gallery, we have an area called Four Seasons. Here you can watch a four-minute animation of a woodland scene. It was designed especially for the, museum by a group of young people on a film studies course (Q15), and it’s beautiful. Children absolutely love it, but then, so do adults.\n\nThe main gallery’s called Town and Country. It includes a photographic collection of prizewinning sheep and shepherds. Leaving Town and Country, you enter Farmhouse Kitchen, which is ... well, self-explanatory. Here we have the oldest collection of equipment for making butter and cheese in the country. And this morning, a specialist cheesemaker will be giving demonstrations (Q16) of how it’s produced. You may even get to try some.\n\nAfter that, you can go in two directions. To the right is a staircase that takes you up to a landing from where you can look down on the galleries. To the left is a room called A Year on the Farm. There's lots of seating here as sometimes we use the room for school visits, so it’s a good place to stop for a rest. If you’re feeling competitive, you can take our memory test in which you answer questions about things you’ve seen in the museum. (Q17)\n\nThe next area’s called Wagon Walk. This contains farm carts from nearly every part of the country. It’s surprising how much regional variation there was. Beside the carts are display boards with information about each one. The carts are old and fragile, so we ask you to keep your children close to you and ensure they don’t climb on the carts. (Q18)\n\nFrom Wagon Walk, you can either make your way back to reception or go out into the garden - or even go back to take another look in the galleries. In the far corner of the garden is Bees are Magic, but we’re redeveloping this area so you can’t visit that at the moment. (Q19) You can still buy our honey in the shop, though.\n\n\nFinally, there’s The Pond, which contains all kinds of interesting wildlife. There are baby ducks that are only a few days old, as well as tiny frogs. (Q20) The Pond isn’t deep and there’s a fence around it, so it’s perfectly safe for children.", "quote": "Good morning everyone, and welcome to the Museum of Farming Life. I understand it’s your first visit here, so I’d like to give you some background information about the museum and then explain a little about what you can see during your visit.\n\nSo, where we're standing at the moment is the entrance to a large building that was constructed in 1880 as the home of a local businessman (Q11), Alfred Palmer, of the Palmer biscuit factory. It was later sold and became a hall of residence for students in 1911, and a museum in 1951. In 2005, a modern extension was built to accommodate the museum’s collections.\n\nThe museum’s owned by the university, and apart from two rooms that are our offices, the university uses the main part of the building. You may see students going into the building for lessons (Q12), but it’s not open to museum visitors, I’m afraid. It’s a shame because the interio ompetitive, you can take our memory test in which you answer questions about things you’ve seen in the museum. (Q17)\n\nThe next area’s called Wagon Walk. This contains farm carts from nearly every part of the country. It’s surprising how much regional variation there was. Beside the carts are display boards with information about each one. The carts are old and fragile, so we ask you to keep your children close to you and ensure they don’t climb on the carts. (Q18)\n\nFrom Wagon Walk, you can either make your way back to reception or go out into the garden - or even go back to take another look in the galleries. In the far corner of the garden is Bees are Magic, but we’re redeveloping this area so you can’t visit that at the moment. (Q19) You can still buy our honey in the shop, though.\n\n\nFinally, there’s The Pond, which contains all kinds of interesting wildlife. There are baby ducks that are only a few days old, as well as tiny frogs. (Q20) The Pond isn’t deep and there’s a fence around it, so it’s perfectly safe for children.", "explain": "Chào buổi sáng mọi người và chào mừng đến với Bảo tàng Đời sống Nông dân. Tôi hiểu đây là lần đầu tiên bạn đến đây, vì vậy tôi muốn cung cấp cho bạn một số thông tin cơ bản về bảo tàng và sau đó giải thích một chút về những gì bạn có thể thấy trong chuyến thăm của mình.\n\nVậy, nơi chúng tôi đang đứng lúc này là lối vào một tòa nhà lớn được xây dựng vào năm 1880 với tư cách là nhà của một doanh nhân địa phương (Q11), Alfred Palmer, của nhà máy bánh quy Palmer. Sau đó nó được bán và trở thành ký túc xá cho sinh viên vào năm 1911, và thành bảo tàng vào năm 1951. Năm 2005, một phần mở rộng hiện đại được xây dựng để chứa các bộ sưu tập của bảo tàng.\nBảo tàng thuộc sở hữu của trường đại học, và ngoài hai phòng là văn phòng của chúng tôi, trường đại học sử dụng phần chính của tòa nhà. Bạn có thể thấy sinh viên vào tòa nhà để học bài (Q12), nhưng tôi e rằng nó không mở cửa cho khách tham quan bảo tàng. Thật đáng tiếc vì các đặc đ
