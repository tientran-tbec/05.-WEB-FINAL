abel": "15", "quote": "Four Seasons\nF. It features something created by students.", "explain": "Khu vực Four Seasons được làm bởi những người trẻ tuổi trong khóa học của họ, tức là những học sinh đã tạo ra nó."}, "16": {"answer_label": "16", "quote": "Farmhouse Kitchen\nG. An expert is here today.", "explain": "Một chuyên gia làm phô mai đã có mặt để mô tả quá trình làm phô mai tại Farmhouse Kitchen"}, "17": {"answer_label": "17", "quote": "A Year on the Farm\nE. There is a quiz for visitors.", "explain": "Tại A year on the Farm, các khách tham quan có thể làm bài thi trí nhớ."}, "18": {"answer_label": "18", "quote": "Wagon Walk\nA. Parents must supervise their children.", "explain": "Tại Wagon Walk, phụ huynh nên trông coi trẻ nhỏ cẩn thận, không để chúng trèo lên xe đẩy vì những chiếc xe đẩy rất đã cũ và yếu ớt."}, "19": {"answer_label": "19", "quote": "Bees are Magic\nC. It is closed today.", "explain": "Khu vực Bees are Magic đang đóng cửa được nâng cấp nên không phục vụ khách."}, "20": {"answer_label": "20", "quote": "The Pond\nB. There are new things to see.", "explain": "Ở The Pond có những thứ thú vị về cuộc sống hoang dã, có vịt con vài ngày tuổi và ếch con."}}, "script_full": [{"speaker": null, "text": "Good morning everyone, and welcome to the Museum of Farming Life. I understand it's your first visit here, so I'd like to give you some background information about the museum and then explain a little about what you can see during your visit.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "So, where we're standing at the moment is the entrance to a large building that was constructed in 1880 as the home of a local businessman, Alfred Palmer, of the Palmer biscuit factory. It was later sold and became a hall of residence for students in 1911, and a museum in 1951. In 2005, a modern extension was built to accommodate the museum's collections. The museum's owned by the university, and apart from two rooms that are our offices, the university uses the main part of the building. You may see students going into the building for lessons, but it's not open to museum visitors, I'm afraid. It's a shame because the interior architectural features are outstanding, especially the room that used to be the library.", "qids": ["11"], "time_seconds": 68}, {"speaker": null, "text": "Luckily, we've managed to keep entry to the museum free. This includes access to all the galleries, outdoor areas and the rooms for special exhibitions. We run activities for children and students, such as the museum club, for which there's no charge. We do have a donation box just over there so feel free to give whatever amount you consider appropriate.", "qids": ["12"], "time_seconds": null}, {"speaker": null, "text": "We do have a cloakroom, if you'd like to leave your coats and bags somewhere. Unlike other museums, photography is allowed here, so you might like to keep your cameras with you. You might be more comfortable not carrying around heavy rucksacks, though keep your coats and jackets on as it's quite cold in the museum garden today.", "qids": ["13"], "time_seconds": 149}, {"speaker": null, "text": "I'd like to tell you about the different areas of the museum.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "Just inside, and outside the main gallery, we have an area called Four Seasons. Here you can watch a four-minute animation of a woodland scene. It was designed especially for the museum by a group of young people on a film studies course, and it's beautiful. Children absolutely love it, but then, so do adults.", "qids": ["14"], "time_seconds": 235}, {"speaker": null, "text": "The main gallery's called Town and Country. It includes a photographic collection of prize-winning sheep and shepherds. Leaving Town and Country, you enter Farmhouse Kitchen, which is ... well, self-explanatory. Here we have the oldest collection of equipment for making butter and cheese in the country. And this morning, a specialist cheesemaker will be giving demonstrations of how it's produced. You may even get to try some.", "qids": ["15"], "time_seconds": 259}, {"speaker": null, "text": "After that, you can go in two directions. To the right is a staircase that takes you up to a landing from where you can look down on the galleries. To the left is a room called A Year on the Farm. There's lots of seating here as sometimes we use the room for school visits, so it's a good place to stop for a rest. If you're feeling competitive, you can take our memory test in which you answer questions about things you've seen in the museum.", "qids": ["16"], "time_seconds": 288}, {"speaker": null, "text": "The next area's called Wagon Walk. This contains farm carts from nearly every part of the country. It's surprising how much regional variation there was. Beside the carts are display boards with information about each one. The carts are old and fragile, so we ask you to keep your children close to you and ensure they don't climb on the carts.", "qids": ["17"], "time_seconds": 327}, {"speaker": null, "text": "From Wagon Walk, you can either make your way back to reception or go out into the garden or even go back to take another look in the galleries. In the far corner of the garden is Bees are Magic, but we're redeveloping this area so you can't visit that at the moment. You can still buy our honey in the shop, though.", "qids": ["18"], "time_seconds": 351}, {"speaker": null, "text": "Finally, there's The Pond, which contains all kinds of interesting wildlife. There are baby ducks that are only a few days old, as well as tiny frogs. The Pond isn't deep and there's a fence around it, so it's perfectly safe for children.", "qids": ["19", "20"], "time_seconds": 378}], "groups": [{"type": "choice", "qids": ["11"], "prompt": "The museum building was originally", "options": {"A": "a factory.", "B": "a private home.", "C": "a hall of residence."}, "multi": false, "header": "Questions 11-14 Choose the correct letter, A, B or C."}, {"type": "choice", "qids": ["12"], "prompt": "The university uses part of the museum building as", "options": {"A": "teaching rooms.", "B": "a research library.", "C": "administration offices."}, "multi": false, "header": null}, {"type": "choice", "qids": ["13"], "prompt": "What does the guide say about the entrance fee?", "options": {"A": "Visitors decide whether or not they wish to pay.", "B": "Only children and students receive a discount.", "C": "The museum charges extra for special exhibitions."}, "multi": false, "header": null}, {"type": "choice", "qids": ["14"], "prompt": "What are visitors advised to leave in the cloakroom?", "options": {"A": "cameras", "B": "coats", "C": "bags"}, "multi": false, "header": null}, {"type": "matching", "qids": ["15", "16", "17", "18", "19", "20"], "box_title": "Information", "box": {"A": "Parents must supervise their children.", "B": "There are new things to see.", "C": "It is closed today.", "D": "This is only for school groups.", "E": "There is a quiz for visitors.", "F": "It features something created by students.", "G": "An expert is here today.", "H": "There is a one-way system."}, "stems": [{"qid": "15", "prompt": "Four Seasons"}, {"qid": "16", "prompt": "Farmhouse Kitchen"}, {"qid": "17", "prompt": "A Year on the Farm"}, {"qid": "18", "prompt": "Wagon Walk"}, {"qid": "19", "prompt": "Bees are Magic"}, {"qid": "20", "prompt": "The Pond"}], "header": "Choose SIX answers from the box and write the correct letter, A-H, next to Questions 15-20."}]}, {"part": 3, "kind": "mcq", "title": "Cities Built by the Sea", "instructions": null, "audio": "audio/test9/part3.mp3", "answers": {"21": "B", "22": "A", "23": "C", "24": "B", "25": "A", "26": "B", "27": "A", "28": "F", "29": "G", "30": "C"}, "explanations": {"21": {"answer_label": "Câu 21", "quote": "Yeah. And cities are growing so quickly - I mean, we know that more than half the world's population lives in cities now.\n\nYeah, though that's all cities, not just ones on the coast. But most of the biggest cities are actually built by the sea.", "explain": "Câu hỏi:\nCarla and Rob were surprised to learn that coastal cities\nA.\tcontain nearly half the world's population.\nB.\tinclude most of the world's larget cities.\nC.\tare growing twice as fast as other cities.\nKeywords được paraphrase:\nTừ khóa trong câu hỏi là “surprised” (ngạc nhiên) về “coastal cities” (các thành phố ven biển). Cả ba sự lựa chọn đều được nhắc đến trong bài nghe, nhưng đáp án phải là điều khiến hai bạn thấy ngạc nhiên.\nGiải thích đáp án:\n• Đáp án là câu B. include most of the world's largest cities (bao gồm hầu hết các thành phố lớn trên thế giới) bởi trong bài nghe, ngay sau khi đưa ra ý kiến “most of the biggest cities are actually built by the sea” (hầu hết các thành phố lớn nhất đều được xây ở bên cạnh biển), ta nghe thêm cụm từ “I'd not realised that before” (tôi đã không nhận ra điều này trước đó). Câu này\nhoàn toàn đồng nghĩa với cụm từ “surprised” (bất ngờ) trong câu hỏi.\n•\tTrước đó, ta nghe câu “cities are growing so quickly.” (thành phố đang phát triển rất nhanh), chúng ta sẽ vội nhầm lẫn với đáp án C. are growing twice as fast as other cities. (đang phát triển nhanh hơn 2 lần so với những thành phố khác.) Thực tế, trong bài nghe không nói rõ t ỉ lệ tăng trưởng như đáp án C, và đây cũng không được nói rõ là một điều đáng ngạc nhiên, nên ta loại câu C.\n•\tNgoài ra, câu A. contain nearly half the world's population (chứa một nửa dân số thế giới) cũng được nhắc đến trong bài nghe, nhưng trước câu đồng nghĩa với đáp án A, ta nghe cụm từ “we know that more than half the world's population lives in cities now.” (chúng ta biết rằng hơn nửa dân số thế giới đang sống ở thành phố.) □ Đây không phải là điều ngạc nhiên, nên câu A không thể là đáp án."}, "22": {"answer_label": "Câu 22", "quote": "That's not necessarily a problem, except it means more and more pollutants are discharged into the rivers.", "explain": "Câu hỏi:\n22. Accorrding to Rob, building coastal cities near to rivers\n\tA may vring pollution to the cities.\n\tB may reduce the land available for agriculture.\n\tC may mean the countryside is spoiled by industry.\nKeywords được paraphrase:\nTừ khóa trong câu hỏi bao gồm Rob và “building coastal cities near to rivers (việc xây dựng các thành phố ven biển ở gần sông). Trong bài nghe đều nhắc đến các từ khóa trong các sự lựa chọn, vì vậy ta cần phân tích và hiểu kĩ về các đáp án: A. may bring pollution to the cities (mang ô nhiễm đến thành phố) - B. may reduce the land available for agriculture (cắt giảm đất dùng cho nông nghiệp) - C. may mean the countryside is spoiled by industry (vùng quê sẽ bị ảnh hưởng xấu bởi công nghiệp)\nGiải thích đáp án:\nCâu trả lời trong bài nghe có nói đến “agriculture and industry ... spread inland along the rivers” (nông nghiệp và công nghiệp mở rộng thêm vùng đất dọc bờ sông), sau đó là cụm từ “that's not necessarily a problem” (đây không phải là một vấn đề) vì thế ta loại bỏ được đáp án B và C. Thêm nữa, “except it means more and more pollutants are discharged into the rivers” (có nhiều chất thải được thả xuống sông) đồng nghĩa với đáp án A."}, "23": {"answer_label": "Câu 23", "quote": "Well, apparently back in the 1950s they built channels to drain away the water in case of flooding.\n\nSounds sensible.\n\nYeah, they spent quite a lot of money on them. But what they didn't take into account was global warming.", "explain": "Câu hỏi:\nWhat mistake was make when buiding water drainage channels in Miami in the 1950s?\nA There were not enough of them.\nB They were made of unsuitable materials.\nC They did not allow for the effects of climate change.\nKeywords được paraphrase:\nỞ câu hỏi này, đầu tiên ta tập trung vào những từ khóa liên quan đến tên riêng Miami và năm 1950s. Ngoài ra, từ “mistakes” (sai lầm) cũng cần được gạch chân khi đọc câu hỏi này.\nGiải thích đáp án:\nTrong bài nghe, ta nghe được câu “what they didn't take into account was global warming.” (cái mà họ đã không để tâm đến là sự nóng lên toàn cầu.) Đây chính là sai lầm mà câu hỏi nhắc đến, vì vậy đáp án là câu C. they did not allow for the effects of climate change. (họ không cân nhắc ảnh hưởng của biến đổi thời tiết.)\nTrước đó, ta nghe câu “they spent quite a lot of money on them.” (họ đã chi khá nhiều tiền.) ngược nghĩa hoàn toàn với câu A. they were not enough of them (không có đủ). Và bài nghe cũng không nhắc đến đáp án B. they were made of unsuitablematerials (chúng được làm bằng nguyên liệu không phù hợp)."}, "24": {"answer_label": "Câu 24", "quote": "But that won't help with flood prevention now, will it?\n\nNo. Really they just need to find the money for something to replace the drainage Channels, in order to protect against flooding now.", "explain": "Câu hỏi:\n24 What do Rob and Carla think that the authorties in Miami should do immediately?\n\tA take measures to restore ecosystems\n\tB pay for a new flood prevention system\n\tC stop dispoing of waste materials into the ocean.\nKeywords được paraphrase:\nỞ câu hỏi này, ngoài phân tích những từ khóa chính nằm ở chủ ngữ, động từ “the authorities in Miami should do” (chính quyền ở Miami nên làm), ta cần phải lưu ý ở trạng từ “immediately” (ngay lập tức). Thêm nữa, đọc hiểu và phân tích các sự lựa chọn: A. take measures to restore ecosystems (có biện pháp để phục hồi hệ sinh thái) - B. pay for a new flood prevention system (trả tiền cho hệ thống phòng chống lũ lụt) - C. stop disposing of waste materials into the ocean (dừng việc thải chất thải ra biển).\nGiải thích đáp án:\nTrong bài nghe, cụm từ “flood prevention” (ngăn chặn lũ lụt) được nhắc đến đầu tiên. Sau đó, ta tiếp tục nghe thêm 1 ý kiến nữa “they'll just need to find the money for something to replace the drainage channels.” (họ chỉ cần kiếm tiền để thay thế kênh rút nước).\nTrước đó, ta nghe “they're aiming to stop disposing of waste water in the ocean over the next ten years.” (họ đang nhắm vào việc ngăn chặn thả nước thải xuống đại dương trong vòng 10 năm tới). Vế đầu của câu nói này đồng nghĩa với đáp án C. Tuy nhiên, câu hỏi yêu cầu hành động nên làm ngay lập tức, khác với bài nghe đề cập là 10 năm tới.\nTa sẽ nghe được ý giống đáp án A “consider the whole ecosystem” (cân nhắc toàn bộ hệ thống sinh thái) nhưng trước đó có chữ “long-term” (dài hạn) vì vậy đáp án A không phù hợp."}, "25": {"answer_label": "Câu 25", "quote": "Absolutely. The thing is, everyone knows what the problems are and environmentalists have a pretty good idea of what we should be doing about them, so they should be able to work together to some extent.", "explain": "Câu hỏi:\n25. What do they agree should be the priority for international action?\n\tA greater coordination of activities\n\tB more sharing of information\n\tC agreement on shared policies\nKeywords được paraphrase:\nTừ khóa trong câu hỏi là “the priority for international action” (ưu tiên cho hành động toàn cầu). Phân tích từng\nđáp án: A. greater coordination of activities (phối hợp các hành động tốt hơn) - B. more sharing of information (chia sẻ nhiều thông tin hơn) - C. agreement on shared policies (đồng ý về những chính sách chung).\nGiải thích đáp án:\nNgười nói đầu tiên đưa ra ý kiến “they’ve got to start acting together at an international level instead of just doing their own thing” (họ phải bắt đầu hành động cùng nhau ở mức độ toàn cầu hay vì tự làm việc của mình). Sau đó người nói thứ hai đồng ý bằng từ “absolutely” (hiển nhiên) và tiếp tục đưa ra ý kiến “they should be able to work together” (họ nên có khả năng làm việc cùng nhau). Vì vậy đáp án là câu A.\nSau đó, ta nghe câu “it's going to be a long time before countries come to a decision on what principles...” (sẽ cần một thời gian dài trước khi các quốc gia đi đến quyết định về các kỷ luật.). Câu này hoàn toàn ngược nghĩa với đáp án C.\nĐáp án B không được nhắc đến trong bài nghe."}, "26": {"answer_label": "Câu 26", "quote": "But we don’t want to spend too long  on that, the other students will already know a bit about it. It's all to do with communications and so on.", "explain": "Câu hỏi:\n      26 Historical background\nKeywords được paraphrase:\nNgười nói bắt đầu đưa ra câu trả lời cho câu hỏi 26 khi nhắc đến cụm từ “general historical background” (tiểu sử chung)\nGiải thích đáp án:\nTa nghe được cụm từ “we don't want to spend too long on that” (chúng ta không muốn dành quá nhiều thời gian) đồng nghĩa với đáp án B. keep it short (giữ nó ngắn)"}, "27": {"answer_label": "Câu 27", "quote": "Yes. We should mention some geographical factors, things like wetlands and river estuaries and coastal erosion and so on. We could have some maps of different cities with these features marked.\n\nOn a handout you mean? Or some slides everyone can see?\n\nYeah, that'd be better.", "explain": "Câu hỏi:\n27. Geographical factors\nKeywords được paraphrase:\nGiọng nữ nhắc đến cụm từ “geography factors” (yếu tố địa lý) để chúng ta tập trung nghe câu trả lời nằm ở đây.\nGiải thích đáp án:\nỞ câu này, ta phải cẩn thận bởi người trả lời đưa ra cụm từ “handout” đầu tiên, nhưng sau đó lại tiếp tục hỏi “or some slides everyone can see?” (hoặc một vài bản trình chiếu để mọi người có thể nhìn?). Sau đó là sự đồng ý của người thứ 2 “yeah, that'd be better.” (đúng, đó sẽ tốt hơn.). Vì vậy đáp án là câu A. use visuals (dùng trực quan)."}, "28": {"answer_label": "Câu 28", "quote": "Yeah, that'd be better. It'd be good to go into past mistakes in a bit more detail. Did you read that case study of the problems there were in New Orleans with flooding a few years ago?\n\nYes. We could use that as the basis for that part of the talk. I don't think the other students will have read it, but they'll remember hearing about the flooding at the time.", "explain": "Câu hỏi:\n28.\tPast mistakes\nKeywords được paraphrase:\nTa nghe được cụm từ “go into past mistakes in a bit more detail” (đi vào phần sai lầm trong quá khứ một cách chi tiết). Đây chính là chỗ có đáp án.\nGiải thích đáp án:\nNgười nói gợi ý tiếp bằng câu hỏi “Did you read that case study of the problems...?” (bạn đã đọc phân tích thực tế của những vấn đề ...?). Sau đó, người thứ 2 trả lời “Yes. we could use that as the basis for the part of the talk.” (đúng, chúng ta có thể sử dụng đó là phần nền cho bài nói.) Do đó, cả 2 cùng đồng ý với việc đề cập đến ví dụ, nên đáp án là câu F. focus on one example (tập trung vào 1 ví dụ)."}, "29": {"answer_label": "Câu 29", "quote": "No.\tWe'll need to\tlook at some websites. Shouldn't take too long.\n\nOK. And I think we should end by talking about international implications.", "explain": "Câu hỏi:\n29.\tFuture risks\nKeywords được paraphrase:\nGiọng nam nhắc đến “future risks” (rủi ro trong tương lai), cần tập trung để nghe đáp án ở sau đây.\nGiải thích đáp án:\nĐáp án của câu này dễ dàng tìm thấy là câu G. do online research (làm nghiên cứu trên mạng) bởi ta nghe được từ khóa “websites” (trang mạng)."}, "30": {"answer_label": "Câu 30", "quote": "we could ask people in the audience. We've got people from quite a lot of different places.\n\nThat'd be interesting, if we have time, yes. So now shall we ...", "explain": "Câu hỏi:\n30.\tInternational implications\nKeywords được paraphrase:\nTrong bài nghe có câu “I think we should end by talking about international implications” (tôi nghĩ chúng ta nên kết thúc bằng cách nói về những ý nghĩa quốc tế).\nGiải thích đáp án:\nTa nghe được cụm từ “we could ask people in the audience” (chúng ta có thể hỏi mọi người ở khán giả) đồng nghĩa với đáp án C. involve other students (kéo theo những học sinh khác."}}, "script_full": [{"speaker": null, "text": "TUTOR: OK, so what I'd like you to do now is to talk to your partner about your presentations on urban planning.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "You should have done most of the reading now, so I'd like you to share your ideas, and talk about the structure of your presentation and what you need to do next.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "CARLA: OK Rob.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "I'm glad we chose quite a specific topic - cities built next to the sea.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "It made it much easier to find relevant information.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ROB: Yeah.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "And cities are growing so quickly - I mean, we know that more than half the world's population lives in cities now.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "CARLA: Yeah, though that's all cities, not just ones on the coast.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "But most of the biggest cities are actually built by the sea, I'd not realised that before.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ROB: Nor me.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "And what's more, a lot of them are built at places where rivers come out into the sea.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "But apparently this can be a problem.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "CARLA: Why?", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ROB: Well, as the city expands, agriculture and industry tend to spread further inland along the rivers, and so agriculture moves even further inland up the river.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "That's not necessarily a problem, except it means more and more pollutants are discharged into the rivers.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "CARLA: So these are brought downstream to the cities?", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ROB: Right.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "Hmm.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "Did you read that article about Miami, on the east coast of the USA?", "qids": [], "time_seconds": null}, {"speaker": null, "text": "CARLA: No.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ROB: Well, apparently back in the 1950s they built channels to drain away the water in case of flooding.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "CARLA: Sounds sensible.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ROB: Yeah, they spent quite a lot of money on them.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "But what they didn't take into account was global warming.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "So they built the drainage channels too close to sea level, and now sea levels are rising, they're more or less useless.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "If there's a lot of rain, the water can't run away, there's nowhere for it to go.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "The whole design was faulty.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "CARLA: So what are the authorities doing about it now?", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ROB: I don't know.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "I did read that they're aiming to stop disposing of waste water into the ocean over the next ten years.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "CARLA: But that won't help with flood prevention now, will it?", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ROB: No.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "Really they just need to find the money for something to replace the drainage channels, in order to protect against flooding now.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "But in the long term they need to consider the whole ecosystem.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "CARLA: Right.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "Really, though, coastal cities can't deal with their problems on their own, can they?", "qids": [], "time_seconds": null}, {"speaker": null, "text": "I mean, they've got to start acting together at an international level instead of just doing their own thing.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ROB: Absolutely.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "The thing is, everyone knows what the problems are and environmentalists have a pretty good idea of what we should be doing about them, so they should be able to work together to some extent.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "But it's going to be a long time before countries come to a decision on what principles they're prepared to abide by.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "CARLA: Yes, if they ever do.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "So I think we've probably got enough for our presentation.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "It's only fifteen minutes.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ROB: OK, So I suppose we'll begin with some general historical background about why coastal cities were established.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "But we don't want to spend too long on that, the other students will already know a bit about it.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "It's all to do with communications and so on.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "CARLA: Yes.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "We should mention some geographical factors, things like wetlands and river estuaries and coastal erosion and so on.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "We could have some maps of different cities with these features marked.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ROB: On a handout you mean?", "qids": [], "time_seconds": null}, {"speaker": null, "text": "Or some slides everyone can see?", "qids": [], "time_seconds": null}, {"speaker": null, "text": "CARLA: Yeah, that'd be better.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ROB: It'd be good to go into past mistakes in a bit more detail.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "Did you read that case study of the problems there were in New Orleans with flooding a few years ago?", "qids": [], "time_seconds": null}, {"speaker": null, "text": "CARLA: Yes.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "We could use that as the basis for that part of the talk.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "I don't think the other students will have read it, but they'll remember hearing about the flooding at the time.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ROB: OK.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "So that's probably enough background.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "CARLA: So then we'll go on to talk about what action's being taken to deal with the problems of coastal cities.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ROB: OK.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "What else do we need to talk about?", "qids": [], "time_seconds": null}, {"speaker": null, "text": "Maybe something on future risks, looking more at the long term, if populations continue to grow.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "CARLA: Yeah.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "We'll need to do a bit of work there, I haven't got much information, have you?", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ROB: No.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "We'll need to look at some websites.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "Shouldn't take too long.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "CARLA: OK.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "And I think we should end by talking about international implications.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "Maybe we could ask people in the audience.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "We've got people from quite a lot of different places.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "ROB: That'd be interesting, if we have time, yes.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "So now shall we", "qids": [], "time_seconds": null}], "groups": [{"type": "choice", "qids": ["21"], "prompt": "Carla and Rob were surprised to learn that coastal cities", "options": {"A": "contain nearly half the world’s population.", "B": "include most of the world’s largest cities.", "C": "are growing twice as fast as other cities."}, "multi": false, "header": null}, {"type": "choice", "qids": ["22"], "prompt": "According to Rob, building coastal cities near to rivers", "options": {"A": "may bring pollution to the cities.", "B": "may reduce the land available for agriculture.", "C": "may mean the countryside is spoiled by industry."}, "multi": false, "header": null}, {"type": "choice", "qids": ["23"], "prompt": "What mistake was made when building water drainage channels in Miami in the 1950s?", "options": {"A": "There were not enough of them.", "B": "They were made of unsuitable materials.", "C": "They did not allow for the effects of climate change."}, "multi": false, "header": null}, {"type": "choice", "qids": ["24"], "prompt": "What do Rob and Carla think that the authorities in Miami should do immediately?", "options": {"A": "take measures to restore ecosystems", "B": "pay for a new flood prevention system", "C": "stop disposing of waste materials into the ocean"}, "multi": false, "header": null}, {"type": "choice", "qids": ["25"], "prompt": "What do they agree should be the priority for international action?", "options": {"A": "greater coordination of activities", "B": "more sharing of information", "C": "agreement on shared policies"}, "multi": false, "header": null}, {"type": "matching", "qids": ["26", "27", "28", "29", "30"], "box_title": "Decisions", "box": {"A": "use visuals", "B": "keep it short", "C": "involve other students", "D": "check the information is accurate", "E": "provide a handout", "F": "focus on one example", "G": "do online research"}, "stems": [{"qid": "26", "prompt": "Historical background"}, {"qid": "27", "prompt": "Geographical factors"}, {"qid": "28", "prompt": "Past mistakes"}, {"qid": "29", "prompt": "Future risks"}, {"qid": "30", "prompt": "International implications"}], "header": "Choose FIVE answers from the box and write the correct letter, A–G, next to Question 26–30."}]}, {"part": 4, "kind": "notes", "title": "The Eucalyptus Tree in Australia", "instructions": null, "audio": "audio/test9/part4.mp3", "answers": {"31": "shelter", "32": "oil", "33": "roads", "34": "insects", "35": "grass(es)", "36": "water", "37": "soil", "38": "dry", "39": "simple", "40": "nest(s)"}, "explanations": {"31": {"answer_label": "31. shelter", "quote": "For example, it gives shelter to creatures like birds and bats and these and other species also depend on it for food particularly the nectar from its flowers.", "explain": "Câu hỏi: \nImportance \nIt provides 31. ……………… and food for a wide range of species. \nKeywords được paraphrase: \n“provide” (cung cấp) được paraphrase thành “give” (cho) trong bài nghe. Ngoài ra ta có thể suy ra chỗ trống cần điền là danh từ vì nó theo sau động từ “provide”, và nó được nối với một danh từ khác “food” qua liên từ “and” \nGiải thích đáp án: \nĐáp án là “shelter” trong câu “it gives shelter” (nó tạo chỗ trú). A wide range of species trên câu hỏi được nhắc đến trong bài nghe dưới dạng “creatures like birds and bats” (các sinh vật như chim và dơi)."}, "32": {"answer_label": "32. oil", "quote": "It’s useful for us humans too because we can kill germs with a disinfectant made from oil extracted from eucalyptus leaves.", "explain": "Câu hỏi: \nIts leaves provide 32 ………….. which is used to make a disinfectant. \nKeywords được paraphrase: \n“the leaves provide” (những chiếc lá cung cấp) được paraphrase thành “be extracted from leaves” (được trích xuất từ lá) trong bài nghe. \nChỗ trống cần điền trong câu hỏi là danh từ - một cái gì mà được sử dụng để làm chất diệt khuẩn “disinfectant”. \nGiải thích đáp án: \nTrong bài nghe có nói “a disinfectant made from oil extracted from eucalyptus leaves” (một loại chất diệt khuẩn được làm từ dầu trích xuất từ những chiếc lá eucalyptus). Như vậy, ta có thể thấy dầu của lá được sử dụng để làm chất diệt khuẩn, vì vậy đáp án là oil."}, "33": {"answer_label": "33. road", "quote": "It wasn’t until 2004 that they found the roads cause of the problem was lime or calcium hydroxide to give it its proper chemical name which was used in the construction of roads. The lime was being washed away into the ground and affecting the roots of the eucalyptus trees nearby.", "explain": "Câu hỏi:\nReasons for present decline in number\nA) Diseases\n(I) \"Mundulla Yellows”\n• Cause\n- Lime used for making 33…………………..\t was absorbed.\n- Trees were unable to take in necessary ion through their roots.\nKeywords được paraphrase:\nTừ khóa “used for making” (được sử dụng để làm) được paraphrase thành “...which was used in” (cái mà được sử dụng trong).\nGiải thích đáp án:\nTrong bài nghe, ta nghe được “lime” là từ khóa ứng với câu hỏi. Sau đó, ta nghe được “which was used in the construction of roads” (cái mà được sử dụng trong việc xây dựng những con đường). Từ “construction” (việc xây dựng) có thể thay thế cho “make” (làm) trên câu hỏi, vì vậy đáp án là roads."}, "34": {"answer_label": "34.insects", "quote": "What happens is that insects settle on insects the leaves and eat their way around them, destroying them as they go.", "explain": "Câu hỏi:\n(ii) “Bell-miner Associated Die-back\"\nCause - 34\tfeed\ton eucalyplus leaves.\n- They secrete a substance containing sugar.\n- Bell-miner birds are attracted by this and keep away other species.\nKeywords được paraphrase:\nCâu hỏi là một trong những nguyên nhân gây ra bệnh “Bell-miner Associated Die-back”. Chỗ cần điền là một danh từ đứng ở vị trí chủ ngữ, rat có thể danh từ ch một sinh vật nào đó vì ta có thể thấy động từ đi sau danh từ này là \"feed on” (ăn).\nGiải thích đáp án:\nTrong bài nghe, ta nghe được “insects settle on the leaves and eat their way around them” (những con côn trùng sống trên những chiếc lá và ăn theo ra xung quanh chúng), “eat” thay cho “feed on” trên câu hỏi, vì vậy đáp án là insects."}, "35": {"answer_label": "35. grass", "quote": "If there are very frequent bush fires in a region, this encourages grass to grow afterwards.", "explain": "Câu hỏi:\nBushfires\nWilliam Jackson’s theory:\nHigh-frequency bushfires have impact on vegetation, resulting in the growth of 35.\nKeywords được paraphrase:\nChỗ cần điền phji là danh từ - sự mọc của cái gì “growth of ”. Sự tăng trưởng này là tót quả của “high-frequency bushfires” (các vụ cháy có độ thường xuyên cao).\nGiải thích đáp án:\nTrong bài nghe, “high-frequency bushfires” được paraphrase thành \"very frequency bushfires\". Sau đó ta nghe được “this encourages grass to grow afterwards\" (điều này tạo điều kiện cho rà mọc sau đó). Ta có thể thấy “grow” (mọc) là dạng động từ của “growth”, vì vậy đáp án là grass."}, "36": {"answer_label": "36. water", "quote": "While if the bush fires are rather less frequent, this results in the growth of eucalyptus forests, so why is this? Why do fairly frequent bush fires actually support the growth of eucalyptus. Well, one reason is that the bush fire stop the growth of other species which would consume water needed by eucalyptus trees.", "explain": "Câu hỏi:\n• mid-frequency bushfires result in the growth of eucalyptus forests, because they: — make more 36 …………..\tavailable to the trees\nKeywords được paraphrase:\nCâu hỏi là một trong những lý do vì sao các vụ cháy ở mức độ thường xuyên vừa phải lại dẫn đến sụ' tăng trưởng của rừng cây eucalyptus, thể hiện qua từ “because”. Trong bài nghe, ta cũng nghe được người nói đặt khá nhiều câu hỏi “Why”, trước khi nêu ra lý do.\nGiải thích đáp án:\nPhần cần điền phái là danh từ vì đứng sau more và danh từ đó phải là một thứ cần cho cây - “available to the trees”. Trong bài nghe, ta nghe được “the bush fire stop the growth of other species which would consume water needed by eucalyptus trees” (Các vụ cháy cây bụi làm ngưng sự gia tăng của các loài sinh vật khác, những loài mà sẽ tiêu thụ nước cần thiết bởi cây eucalyptus). Vì vậy đáp án là water."}, "37": {"answer_label": "37. soil", "quote": "If these other quick growing species of bushes and plants are allowed to proliferate, they harm the eucalyptus in another way by affecting the composition of the soil and removing nutrients from it.", "explain": "Câu hỏi:\nmaintain the quality of the 37………………………\nKeywords được paraphrase:\nĐây là một lý do khác của việc vì sao các vụ cháy cây bụi mức độ ùra lại làm tăng trưởng rừng cây eucalyptus. TO khóa cần tập trung là \"quality of” (chất lượng) và \"maintain” (giữ lại). Ngoài ra, cũng lưu ý chỗ cần điền phii là danh từ vì ta thấy có mạo từ “the” đứng trước nó.\nGiải thích đáp án:\n38. Now scientists believe that this reduced Dry frequency of bush fires to low levels have led to what’s known as dry rainforest...\nỞ phần trên ta có tM thấy một tác động của các v,i cháy cây bụi “bushfires” là nó làm ngưng sự tăng trưởng của một số loài sinh vật và từ đó mới dẫn đến những lợi ích cho cây và ở câu hỏi này cũng theo logic tương tự. Ta nghe được “they harm the eucalyptus in another way by affecting the composition of the soil and removing nutrients from it” (Chúng làm haji cây eucalyptus theo một cách khác bằng cách ảnh hưởng đến thành phần của đất và lấy đi chất dinh dưỡng từ đất). Như vậy, nếu các loài vật này bị mất đi nhờ các vụ cháy, chất lượng của đất “soil” sẽ được giữ lại “maintain”. Vì vậy soil là đáp án."}, "38": {"answer_label": "38. dry", "quote": "Now scientists believe that this reduced frequency of bush fires to low levels have led to what’s known as dry rainforest…", "explain": "Câu hỏi:\n• low-frequency bushfires result in the growth of 38 ………………………'rainforest',which is:\n— 39\tecosystem\n—\t an ideal environment for the 40…………. of the bell-miner.\nKeywords được paraphrase:\nChỗ cần điền là một tính từ hoặc danh từ bổ nghĩa cho “rainforest”, ta đặt câu tói rừng mưa như thế nào để hiểu rõ nội dung cần nghe hơn. Ngoài ra, các từ khóa “low- frequency bushfires” và “result in” (dẫn đến) cũng cần phải chú ý.\nGiải thích đáp án:\nTrong bài nghe, ta có thể nghe được “this reduced frequency of bush fires to low levels have led to what’s known as dry rainforest...” (tan suất giảm xuống mức thíp của các vụ cháy cây bụi đã dẫn tới cái mà được biết đến là các rừng mưa khô), “have led to” (dẫn đến) đồng nghĩa với “result in” trên câu hỏi. Dry là đáp án của câu hỏi này."}, "39": {"answer_label": "39. simple", "quote": "Unlike tropical rainforest which is a rich simple ecosystem, this type of ecosystem is usually a simple one. It has very thick dense vegetation, but not much variety of species.", "explain": "Câu hỏi: (như trên)\nKeywords được paraphrase:\ncâu hỏi là một trong những thông tin liên quan đến rừng mưa khô “dry rainforest\" ở câu 38. Chỗ ân điền là một tính từ hoặc danh từ bổ nghĩa cho “ecosystem” (hệ sinh thái).\nGiải thích đáp án:\nTrong bài nghe, ta có thể nghe được 2 tính từ đi kèm với “ecosystem” là “rích” và “simple”. Tuy nhiên, “rich” không phải là tính chít của “dry rainforest” mà của “tropical rainforest”. Vì vậy, đắp án là “simple”."}, "40": {"answer_label": "40. nest", "quote": "So one species that does find it ideal is nest the Bell-miner bird which build its nests in the undergrowth there...", "explain": "Câu hỏi: (như trên)\nKeywords được paraphrase:\nCâu hỏi này là thông tin thứ 2 liên quan đến “dry rainforest” ở câu 38. Các từ khóa “ideal environment” có thể được nghe ở bài nghe để xác định điểm tà đầu. Chỗ ân điền phái là danh từ vì theo sau \"the\" và danh từ này phải cái gì đó của loài bell-miner.\nGiải thích đáp án:\nTrong bài nghe ta nghe được “the Bell-miner bird which build its nests in the undergrowth there...” (loài chim Bell-miner, loài mà xây tổ của chúng ở những cây thíp ở đó), như vậy ta có thể thà'y tó \"nest” là đáp án."}}, "script_full": [{"speaker": null, "text": "Today I'm going to talk about the eucalyptus tree. This is a very common tree here in Australia, where it's also sometimes called the gum tree. First I'm going to talk about why it's important, then I'm going to describe some problems it faces at present.", "qids": [], "time_seconds": null}, {"speaker": null, "text": "Right, well the eucalyptus tree is an important tree for lots of reasons. For example, it gives shelter to creatures like birds and bats, and these and other species also depend on it for food, particularly the nectar from its flowers. So it supports biodiversity. It's useful to us humans too, because we can kill germs with a disinfectant made from oil extracted from eucalyptus leaves.", "qids": ["31", "32"], "time_seconds": 112}, {"speaker": null, "text": "The eucalyptus grows all over Australia and the trees can live for up to four hundred years. So it's alarming that all across the country, numbers of eucalyptus are falling because the trees are dying off prematurely. So what are the reasons for this?", "qids": [], "time_seconds": null}, {"speaker": null, "text": "One possible reason is disease. As far back as the 1970s the trees started getting a disease called Mundulla Yellows. The trees' leaves would gradually turn yellow, then the tree would die. It wasn't until 2004 that they found the cause of the problem was lime, or calcium hydroxide to give it its proper chemical name, which was being used in the construction of roads. The lime was being washed away into the ground and affecting the roots of the eucalyptus trees nearby. What it was doing was preventing the trees from sucking up the iron they needed for healthy growth. When this was injected back into the affected trees, they immediately recovered.", "qids": ["33"], "time_seconds": 167}, {"speaker": null, "text": "But this problem only affected a relatively small number of trees. By 2000, huge numbers of eucalyptus were dying along Australia's East Coast, of a disease known as Bell-miner Associated Die-back. The bell-miner is a bird, and the disease seems to be common where there are high populations of bell-miners. Again it's the leaves of the trees that are affected. What happens is that insects settle on the leaves and eat their way round them, destroying them as they go, and at the same time they secrete a solution which has sugar in it. The bell-miner birds really like this solution, and in order to get as much as possible, they keep away other creatures that might try to get it. So these birds and insects flourish at the expense of other species, and eventually so much damage is done to the leaves that the tree dies.", "qids": ["34"], "time_seconds": 223}, {"speaker": null, "text": "But experts say that trees can start looking sick before any sign of Bell-miner Associated Die-back. So it looks as if the problem might have another explanation. One possibility is that it's to do with the huge bushfires that we have in Australia. A theory proposed over 40 years ago by ecologist William Jackson is that the frequency of bushfires in a particular region affects the type of vegetation that grows there. If there are very frequent bushfires in a region, this encourages grass to grow afterwards, while if the bushfires are rather less frequent, this results in the growth of eucalyptus forests.", "qids": ["35"], "time_seconds": 299}, {"speaker": null, "text": "So why is this? Why do fairly frequent bushfires actually support the growth of eucalyptus? Well, one reason is that the fire stops the growth of other species which would consume water needed by eucalyptus trees. And there's another reason. If these other quick-growing species of bushes and plants are allowed to proliferate, they harm the eucalyptus in another way, by affecting the composition of the soil, and removing nutrients from it. So some bushfires are actually essential for the eucalyptus to survive as long as they are not too frequent. In fact there's evidence that Australia's indigenous people practised regular burning of bush land for thousands of years before the arrival of the Europeans.", "qids": ["36", "37"], "time_seconds": 350}, {"speaker": null, "text": "But since Europeans arrived on the continent, the number of bushfires has been strictly controlled. Now scientists believe that this reduced frequency of bushfires to low levels has led to what's known as 'dry rainforest', which seems an odd name as usually we associate tropical rainforest with wet conditions. And what's special about this type of rainforest? Well, unlike tropical rainforest which is a rich ecosystem, this type of ecosystem is usually a simple one. It has very thick, dense vegetation, but not much variety of species. The vegetation provides lots of shade, so one species that does find it ideal is the bell-miner bird, which builds its nests in the undergrowth there. But again that's not helpful for the eucalyptus tree.", "qids": ["38", "39", "40"], "time_seconds": 406}], "notes": ["The Eucalyptus Tree in Australia", "Importance", "• it provides {{31}}and food for a wide range of species", "• its leaves provide {{32}}which is used to make a disinfectant", "Reasons for present decline in number", "A) Diseases", "(i) ‘Mundulla Yellows’", "• Cause          - lime used for making {{33}}was absorbed", "- trees were unable to take in necessary iron through their roots", "(ii)  ‘Bell-miner Associated Die-back’", "• Cause          - {{34}}feed on eucalyptus leaves", "- - they secrete a substance containing sugar", "- - bell-miner birds are attracted by this and keep away other species", "B) Bushfires", "William Jackson’s theory:", "• high-frequency bushfires have impact on vegetation, resulting in the growth of {{35}}", "• mid-frequency bushfires result in the growth of eucalyptus forests, because they:", "- make more {{36}}available to the trees", "- maintain the quality of the {{37}}", "• low-frequency bushfires result in the growth of {{38}}rainforest’,", "which is:", "- a {{39}}ecosystem", "- an ideal environment for the {{40}}of the bell-miner"]}]};
</script>
<script>
(function(){
  const partsEl = document.getElementById('parts');
  const tabsEl = document.getElementById('tabs');

  function renderNotes(part){
    let html = '<div class="notes-block">';
    for(const rawLine of part.notes){
      const text = rawLine.trim();
      if(!text) continue;
      const isBlankLine = /\{\{\d+\}\}/.test(text);
      const isBulletLine = /^[–\-•]/.test(text);
      const isExample = /^example$/i.test(text);
      const rendered = text.replace(/\{\{(\d+)\}\}/g, (m, num) => {
        return `<span class="blank-num">${num}</span><input class="blank" type="text" data-part="${part.part}" data-q="${num}" autocomplete="off" spellcheck="false">`;
      });
      if(isExample){
        html += `<span class="subhead example-line">Example</span><br>`;
      } else if(isBlankLine){
        html += (isBulletLine ? '<span class="bullet">' : '<span>') + rendered + '</span><br>';
      } else if(isBulletLine){
        html += `<span class="bullet">${text}</span><br>`;
      } else if(text.split(' ').length <= 4){
        html += `<span class="subhead">${text}</span><br>`;
      } else {
        html += `<span class="example-line">${text}</span><br>`;
      }
    }
    html += '</div>';
    return html;
  }

  function renderMatching(g, part){
    let html = '<div class="qgroup" data-qids="' + g.qids.join(',') + '" data-mtype="matching">';
    if(g.image){
      html += `<img class="map-img" src="${g.image}" alt="${(g.box_title||'Map')}">`;
    }
    const boxEntries = Object.entries(g.box || {});
    if(boxEntries.length){
      html += '<div class="box-panel">';
      if(g.box_title) html += `<div class="box-title">${g.box_title}</div>`;
      for(const [letter, text] of boxEntries){
        html += `<div class="box-item"><b>${letter}</b><span>${text}</span></div>`;
      }
      html += '</div>';
    } else if(g.box_title){
      html += `<div class="box-title" style="margin-bottom:8px;font-weight:800;color:var(--navy);">${g.box_title}</div>`;
    }
    const letters = boxEntries.length ? boxEntries.map(([l]) => l) : (g.qids.length ? inferLetters(g) : []);
    for(const s of g.stems){
      html += `<div class="stem-row" data-q="${s.qid}"><span class="blank-num">${s.qid}</span><span class="stem-text">${s.prompt}</span>`;
      html += `<select data-part="${part.part}" data-q="${s.qid}"><option value="">--</option>`;
      for(const letter of letters){
        html += `<option value="${letter}">${letter}</option>`;
      }
      html += '</select></div>';
    }
    html += '</div>';
    return html;
  }

  function inferLetters(g){
    // No box text (e.g. a map where letters are drawn on the image) --
    // fall back to A..I so the dropdown offers every valid letter (some
    // maps go up to I, not just H).
    return ['A','B','C','D','E','F','G','H','I'];
  }

  function renderMcq(part){
    let html = '';
    for(const g of part.groups){
      if(g.header){
        html += `<div class="header-note">${g.header}</div>`;
      }
      if(g.type === 'matching'){
        html += renderMatching(g, part);
        continue;
      }
      const qidsLabel = g.qids.length>1 ? `${g.qids[0]}\u2013${g.qids[g.qids.length-1]}` : g.qids[0];
      html += `<div class="qgroup" data-qids="${g.qids.join(',')}" data-multi="${g.multi}">`;
      html += `<div class="prompt"><span class="blank-num">${qidsLabel}</span> ${g.prompt}</div>`;
      html += '<div class="opt-list">';
      for(const [letter, text] of Object.entries(g.options)){
        const inputType = g.multi ? 'checkbox' : 'radio';
        const name = g.multi ? `p${part.part}g${g.qids.join('_')}` : `p${part.part}q${g.qids[0]}`;
        html += `<label class="opt" data-letter="${letter}"><input type="${inputType}" name="${name}" value="${letter}" ${g.multi?`data-max="${g.qids.length}"`:''}>`+
                `<span><b>${letter}.</b> ${text}</span></label>`;
      }
      html += '</div></div>';
    }
    return html;
  }

  const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function fmtTime(t){
    t = Math.max(0, Math.round(t||0));
    const m = Math.floor(t/60), s = t%60;
    return `${m}:${String(s).padStart(2,'0')}`;
  }

  function buildScriptHtml(part){
    // part.script_full: the complete audioscript for this part, line by line, in order.
    // Lines whose "qids" array is non-empty are the lines where an answer's information
    // is actually said -- those get highlighted, tagged with the question number(s), and
    // (when time_seconds is known) get a jump button that seeks the script's own audio player.
    const lines = part.script_full || [];
    if(!lines.length) return '<p class="muted">No script data.</p>';
    return lines.map(l => {
      const spk = l.speaker ? `<span class="spk">${esc(l.speaker)}:</span> ` : '';
      let body = esc(l.text);
      if(l.qids && l.qids.length){
        const tags = l.qids.map(q => `<span class="qtag">Q${q}</span>`).join('');
        let jumpBtn = '';
        if(typeof l.time_seconds === 'number'){
          jumpBtn = `<button type="button" class="jump-btn" data-action="jump-audio" data-part="${part.part}" data-time="${l.time_seconds}" title="Jump to ${fmtTime(l.time_seconds)}">\u25b6 ${fmtTime(l.time_seconds)}</button>`;
        }
        body = `${jumpBtn}<mark class="hl">${body}</mark>${tags}`;
      }
      return `<p class="script-line">${spk}${body}</p>`;
    }).join('');
  }

  function buildExplanationsHtml(part){
    let html = '';
    const qids = [];
    if(part.kind === 'notes'){
      Object.keys(part.answers).sort((a,b)=>a-b).forEach(q=>qids.push(q));
    } else {
      part.groups.forEach(g=>g.qids.forEach(q=>qids.push(q)));
      qids.sort((a,b)=>a-b);
    }
    for(const q of qids){
      const e = part.explanations[q] || {};
      const ans = part.answers[q] || '';
      html += `<div class="expl-item"><div class="eq-head"><span class="qnum">C\u00e2u ${q}</span><span class="ans">${ans}</span></div>`;
      if(e.quote){
        html += `<div class="quote">"${e.quote.replace(/</g,'&lt;')}"</div>`;
      }
      html += `<div class="explain">${(e.explain||'').replace(/</g,'&lt;')}</div></div>`;
    }
    return html;
  }

  function gradeParts(part){
    let correct = 0, total = 0;
    if(part.kind === 'notes'){
      for(const [q, ans] of Object.entries(part.answers)){
        total++;
        const input = partsEl.querySelector(`input.blank[data-part="${part.part}"][data-q="${q}"]`);
        if(!input) continue;
        const val = input.value.trim().toLowerCase();
        const ok = val === String(ans).trim().toLowerCase();
        input.classList.remove('correct','incorrect');
        input.classList.add(ok ? 'correct' : 'incorrect');
        if(ok) correct++;
        if(!ok){
          input.title = `Correct answer: ${ans}`;
        }
      }
    } else {
      for(const g of part.groups){
        if(g.type === 'matching'){
          for(const s of g.stems){
            total++;
            const sel = partsEl.querySelector(`.part[data-part="${part.part}"] select[data-q="${s.qid}"]`);
            if(!sel) continue;
            const correctLetter = part.answers[s.qid];
            const ok = sel.value === correctLetter;
            sel.classList.remove('correct','incorrect');
            sel.classList.add(ok ? 'correct' : 'incorrect');
            if(ok) correct++;
            else sel.title = `Correct answer: ${correctLetter}`;
          }
          continue;
        }
        const groupEl = partsEl.querySelector(`.part[data-part="${part.part}"] .qgroup[data-qids="${g.qids.join(',')}"]`);
        if(!groupEl) continue;
        const inputs = groupEl.querySelectorAll('input');
        const correctLetters = g.qids.map(q => part.answers[q]);
        const selected = Array.from(inputs).filter(i=>i.checked).map(i=>i.value);
        groupEl.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','incorrect'));
        inputs.forEach(inp=>{
          const label = inp.closest('.opt');
          const letter = label.dataset.letter;
          if(correctLetters.includes(letter)) label.classList.add('correct');
          else if(inp.checked) label.classList.add('incorrect');
        });
        if(g.multi){
          total += g.qids.length;
          const sortedSel = [...selected].sort();
          const sortedCorrect = [...correctLetters].sort();
          if(sortedSel.length===sortedCorrect.length && sortedSel.every((v,i)=>v===sortedCorrect[i])){
            correct += g.qids.length;
          } else {
            correctLetters.forEach(cl=>{ if(selected.includes(cl)) correct++; });
          }
        } else {
          total += 1;
          if(selected[0] === correctLetters[0]) correct += 1;
        }
      }
    }
    return {correct, total};
  }

  function renderPart(part, idx){
    const wrap = document.createElement('div');
    wrap.className = 'part' + (idx===0 ? ' active' : '');
    wrap.dataset.part = part.part;

    const card = document.createElement('div');
    card.className = 'card';
    let inner = `<div class="part-bar"><span>PART ${part.part}${part.title ? ' — ' + part.title : ''}</span><span class="title">${part.kind==='notes'?'Note Completion':'Multiple Choice'}</span></div>`;
    inner += `<div class="card-body">`;
    if(part.instructions) inner += `<div class="instructions">${part.instructions}</div>`;
    inner += `<div class="audio-box"><span class="icon">\ud83c\udfa7</span><span class="label">Part ${part.part} Audio</span><audio controls preload="none" src="${part.audio}"></audio></div>`;
    inner += part.kind === 'notes' ? renderNotes(part) : renderMcq(part);
    inner += `<div class="actions">
        <button class="primary" data-action="check">Check Answers</button>
        <button class="ghost" data-action="reset">Reset</button>
        <span class="score-pill" data-role="score" style="display:none;"></span>
      </div>
      <div class="actions" style="margin-top:0;">
        <button class="ghost" data-action="toggle-script">Show Script</button>
        <button class="ghost" data-action="toggle-expl">Show Answers &amp; Explanations</button>
      </div>
      <div class="toggle-section" data-role="script-section">
        <h2 style="font-size:15px;color:var(--navy);">Full Script — Part ${part.part}</h2>
        <p class="script-note">Listen and follow along below — highlighted lines show where each answer is said${part.script_full && part.script_full.some(l=>typeof l.time_seconds==='number') ? '; tap a time button to jump straight there.' : '.'}</p>
        <div class="audio-box"><span class="icon">\ud83c\udfa7</span><span class="label">Part ${part.part} Audio</span><audio controls preload="none" src="${part.audio}" data-role="script-audio"></audio></div>
        <div class="script-text">${buildScriptHtml(part)}</div>
      </div>
      <div class="toggle-section" data-role="expl-section">
        <h2 style="font-size:15px;color:var(--navy);">Answers &amp; Explanations — Part ${part.part}</h2>
        ${buildExplanationsHtml(part)}
      </div>
      </div>`;
    card.innerHTML = inner;
    wrap.appendChild(card);

    card.querySelectorAll('.qgroup[data-multi="true"]').forEach(groupEl => {
      const boxes = Array.from(groupEl.querySelectorAll('input[type="checkbox"]'));
      if(!boxes.length) return;
      const max = parseInt(boxes[0].dataset.max, 10) || 2;
      const sync = () => {
        const checkedCount = boxes.filter(b=>b.checked).length;
        boxes.forEach(b => { if(!b.checked) b.disabled = checkedCount >= max; });
      };
      boxes.forEach(b => b.addEventListener('change', sync));
    });

    card.querySelector('[data-action="check"]').addEventListener('click', () => {
      const {correct, total} = gradeParts(part);
      const pill = card.querySelector('[data-role="score"]');
      pill.style.display = 'inline-block';
      pill.textContent = `Score: ${correct} / ${total}`;
      const tabBtn = tabsEl.querySelector(`[data-tab="${part.part}"]`);
      if(tabBtn) tabBtn.classList.add('done');
    });
    card.querySelector('[data-action="reset"]').addEventListener('click', () => {
      card.querySelectorAll('input[type="text"]').forEach(i=>{i.value='';i.classList.remove('correct','incorrect');i.title='';});
      card.querySelectorAll('input[type="radio"],input[type="checkbox"]').forEach(i=>{i.checked=false;i.disabled=false;});
      card.querySelectorAll('select').forEach(s=>{s.value='';s.classList.remove('correct','incorrect');s.title='';});
      card.querySelectorAll('.opt').forEach(o=>o.classList.remove('correct','incorrect'));
      card.querySelector('[data-role="score"]').style.display='none';
      const tabBtn = tabsEl.querySelector(`[data-tab="${part.part}"]`);
      if(tabBtn) tabBtn.classList.remove('done');
    });
    card.querySelector('[data-action="toggle-script"]').addEventListener('click', (e) => {
      const sec = card.querySelector('[data-role="script-section"]');
      sec.classList.toggle('open');
      e.target.textContent = sec.classList.contains('open') ? 'Hide Script' : 'Show Script';
    });
    card.querySelector('[data-action="toggle-expl"]').addEventListener('click', (e) => {
      const sec = card.querySelector('[data-role="expl-section"]');
      sec.classList.toggle('open');
      e.target.textContent = sec.classList.contains('open') ? 'Hide Answers & Explanations' : 'Show Answers & Explanations';
    });
    card.querySelectorAll('[data-action="jump-audio"]').forEach(btn => {
      btn.addEventListener('click', () => {
        const t = Number(btn.dataset.time) || 0;
        const audio = card.querySelector('[data-role="script-audio"]');
        if(!audio) return;
        audio.currentTime = t;
        audio.play();
      });
    });

    return wrap;
  }

  TEST_DATA.parts.forEach((part, idx) => {
    const tabBtn = document.createElement('button');
    tabBtn.className = 'tab-btn' + (idx===0 ? ' active' : '');
    tabBtn.dataset.tab = part.part;
    tabBtn.innerHTML = `<span class="dot"></span>Part ${part.part}`;
    tabBtn.addEventListener('click', () => {
      partsEl.querySelectorAll('audio').forEach(a => { a.pause(); });
      tabsEl.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      partsEl.querySelectorAll('.part').forEach(p=>p.classList.remove('active'));
      tabBtn.classList.add('active');
      partsEl.querySelector(`.part[data-part="${part.part}"]`).classList.add('active');
      window.scrollTo({top:0, behavior:'smooth'});
    });
    tabsEl.appendChild(tabBtn);
    partsEl.appendChild(renderPart(part, idx));
  });
})();
</script>
</body>
</html>
